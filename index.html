: "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [40], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第3節　雑則"], "orig": "（届出）\n第百三十九条　基金は、厚生労働省令の定めるところにより、その加入員の資格の取得及び喪失に関する事項を厚生労働大臣に届け出なければならない。", "ch": 9}, {"key": "h139-2", "num": [139, 2], "label": "第139条の2", "caption": "年金数理関係書類の年金数理人による確認等", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（年金数理関係書類の年金数理人による確認等）\n第139条の2　この法律に基づき基金（第119条第1項又は第3項の規定に基づき基金を設立しようとする設立委員等を含む。）又は連合会（第137条の5の規定に基づき連合会を設立しようとする発起人を含む。）が厚生労働大臣に提出する年金数理に関する業務に係る書類であつて厚生労働省令で定めるものについては、当該書類が適正な年金数理に基づいて作成されていることを確定給付企業年金法（平成13年法律第50号）第97条第2項に規定する年金数理人が確認し、記名したものでなければならない。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [41], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第3節　雑則"], "orig": "（年金数理関係書類の年金数理人による確認等）\n第百三十九条の二　この法律に基づき基金（第百十九条第一項又は第三項の規定に基づき基金を設立しようとする設立委員等を含む。）又は連合会（第百三十七条の五の規定に基づき連合会を設立しようとする発起人を含む。）が厚生労働大臣に提出する年金数理に関する業務に係る書類であつて厚生労働省令で定めるものについては、\n当該書類が適正な年金数理に基づいて作成されていることを確定給付企業年金法（平成十三年法律第五十号）第九十七条第二項に規定する年金数理人が確認し、記名したものでなければならない。", "ch": 9}, {"key": "h140", "num": [140], "label": "第140条", "caption": "報告書の提出", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（報告書の提出）\n第140条　基金及び連合会は、厚生労働省令の定めるところにより、その業務についての報告書を厚生労働大臣に提出しなければならない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [42], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第3節　雑則"], "orig": "（報告書の提出）\n第百四十条　基金及び連合会は、厚生労働省令の定めるところにより、その業務についての報告書を厚生労働大臣に提出しなければならない。", "ch": 9}, {"key": "h141", "num": [141], "label": "第141条", "caption": "報告の徴収等", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（報告の徴収等）\n第141条　厚生労働大臣は、基金若しくは連合会又は解散した基金若しくは連合会について、必要があると認めるときは、その事業若しくはその清算事務の状況に関する報告を徴し、又は当該職員をして当該基金若しくは連合会若しくは解散した基金若しくは連合会の事務所に立ち入つて関係者に質問させ、若しくは実地にその状況を検査させることができる。\n2　前項の規定によつて質問及び検査を行なう当該職員は、その身分を示す証票を携帯し、かつ、関係人の請求があるときは、これを提示しなければならない。\n3　第1項の規定による権限は、犯罪捜査のために認められたものと解釈してはならない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [43], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第3節　雑則"], "orig": "（報告の徴収等）\n第百四十一条　厚生労働大臣は、基金若しくは連合会又は解散した基金若しくは連合会について、必要があると認めるときは、その事業若しくはその清算事務の状況に関する報告を徴し、又は当該職員をして当該基金若しくは連合会若しくは解散した基金若しくは連合会の事務所に立ち入つて関係者に質問させ、若しくは実地にその状況を検査させることができる。\n２　前項の規定によつて質問及び検査を行なう当該職員は、その身分を示す証票を携帯し、かつ、関係人の請求があるときは、これを提示しなければならない。\n３　第一項の規定による権限は、犯罪捜査のために認められたものと解釈してはならない。", "ch": 9}, {"key": "h142", "num": [142], "label": "第142条", "caption": "基金等に対する監督", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（基金等に対する監督）\n第142条　厚生労働大臣は、前条の規定により報告を徴し、又は質問し、若しくは検査した場合において、基金若しくは連合会の事業の管理若しくは執行若しくは解散した基金若しくは連合会の清算事務（以下「基金等の事業の執行」という。）が法令、規約若しくは厚生労働大臣の処分に違反していると認めるとき、基金等の事業の執行が著しく適正を欠くと認めるとき、又は基金若しくは連合会の役員若しくは解散した基金若しくは連合会の清算人が基金等の事業の執行を明らかに怠つていると認めるときは、期間を定めて、基金若しくは連合会若しくはこれらの役員又は解散した基金若しくは連合会若しくはこれらの清算人に対し、基金等の事業の執行について違反の是正又は改善のため必要な措置を採るべき旨を命ずることができる。\n2　厚生労働大臣は、基金又は連合会の事業の健全な運営を確保するため必要があると認めるときは、期間を定めて、当該基金又は連合会に対し、その規約の変更を命ずることができる。\n3　基金若しくは連合会若しくはこれらの役員若しくは解散した基金若しくは連合会若しくはこれらの清算人が第1項の命令に違反したとき、又は基金若しくは連合会が前項の命令に違反したときは、厚生労働大臣は、当該基金若しくは連合会又は解散した基金若しくは連合会に対し、期間を定めて、当該違反に係る役員又は清算人の全部又は一部の改任を命ずることができる。\n4　基金若しくは連合会又は解散した基金若しくは連合会が前項の命令に違反したときは、厚生労働大臣は、同項の命令に係る役員を改任し、又は同項の命令に係る清算人を解任することができる。\n5　基金若しくは連合会が第1項の命令に違反したとき、又はその事業の状況によりその事業の継続が困難であると認めるときは、厚生労働大臣は、当該基金若しくは連合会の解散を命ずることができる。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [44], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第3節　雑則"], "orig": "（基金等に対する監督）\n第百四十二条　厚生労働大臣は、前条の規定により報告を徴し、又は質問し、若しくは検査した場合において、基金若しくは連合会の事業の管理若しくは執行若しくは解散した基金若しくは連合会の清算事務（以下「基金等の事業の執行」という。）が法令、規約若しくは厚生労働大臣の処分に違反していると認めるとき、基金等の事業の執行が著しく適正を欠くと認めるとき、\n又は基金若しくは連合会の役員若しくは解散した基金若しくは連合会の清算人が基金等の事業の執行を明らかに怠つていると認めるときは、期間を定めて、基金若しくは連合会若しくはこれらの役員又は解散した基金若しくは連合会若しくはこれらの清算人に対し、基金等の事業の執行について違反の是正又は改善のため必要な措置を採るべき旨を命ずることができる。\n２　厚生労働大臣は、基金又は連合会の事業の健全な運営を確保するため必要があると認めるときは、期間を定めて、当該基金又は連合会に対し、その規約の変更を命ずることができる。\n３　基金若しくは連合会若しくはこれらの役員若しくは解散した基金若しくは連合会若しくはこれらの清算人が第一項の命令に違反したとき、又は基金若しくは連合会が前項の命令に違反したときは、厚生労働大臣は、当該基金若しくは連合会又は解散した基金若しくは連合会に対し、期間を定めて、当該違反に係る役員又は清算人の全部又は一部の改任を命ずることができる。\n４　基金若しくは連合会又は解散した基金若しくは連合会が前項の命令に違反したときは、厚生労働大臣は、同項の命令に係る役員を改任し、又は同項の命令に係る清算人を解任することができる。\n５　基金若しくは連合会が第一項の命令に違反したとき、又はその事業の状況によりその事業の継続が困難であると認めるときは、厚生労働大臣は、当該基金若しくは連合会の解散を命ずることができる。", "ch": 9}, {"key": "h142-2", "num": [142, 2], "label": "第142条の2", "caption": "権限の委任", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（権限の委任）\n第142条の2　この章に規定する厚生労働大臣の権限のうち基金に係るものは、厚生労働省令の定めるところにより、その一部を地方厚生局長に委任することができる。\n2　前項の規定により地方厚生局長に委任された権限は、厚生労働省令の定めるところにより、地方厚生支局長に委任することができる。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "令和元年", "rows": [45], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第3節　雑則"], "orig": "（権限の委任）\n第百四十二条の二　この章に規定する厚生労働大臣の権限のうち基金に係るものは、厚生労働省令の定めるところにより、その一部を地方厚生局長に委任することができる。\n２　前項の規定により地方厚生局長に委任された権限は、厚生労働省令の定めるところにより、地方厚生支局長に委任することができる。", "ch": 9}, {"key": "h143", "num": [143], "label": "第143条", "caption": "", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "〔学習用見出し：基金等の報告義務違反・検査妨害等の罰則〕\n第143条　第141条第1項の規定による報告をせず、若しくは虚偽の報告をし、又は同項の規定による当該職員の質問に対して答弁せず、若しくは虚偽の陳述をし、若しくは同項の規定による検査を拒み、妨げ、若しくは忌避した者は、6月以下の拘禁刑又は500000円以下の罰金に処する。\n2　解散した基金が、正当な理由がなくて、第137条の19第1項の規定により負担すべき徴収金を督促状に指定する期限までに納付しないときは、その代表者、代理人又は使用人その他の従業者でその違反行為をした者も、前項と同様とする。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [47], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第4節　罰則"], "orig": "第百四十三条　第百四十一条第一項の規定による報告をせず、若しくは虚偽の報告をし、又は同項の規定による当該職員の質問に対して答弁せず、若しくは虚偽の陳述をし、若しくは同項の規定による検査を拒み、妨げ、若しくは忌避した者は、六月以下の拘禁刑又は五十万円以下の罰金に処する。\n２　解散した基金が、正当な理由がなくて、第百三十七条の十九第一項の規定により負担すべき徴収金を督促状に指定する期限までに納付しないときは、その代表者、代理人又は使用人その他の従業者でその違反行為をした者も、前項と同様とする。", "ch": 9}, {"key": "h144", "num": [144], "label": "第144条", "caption": "", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "〔学習用見出し：法人に対する両罰規定〕\n第144条　法人の代表者、代理人、使用人その他の従業者が、その法人の業務に関して、前条の違反行為をしたときは、行為者を罰するほか、その法人に対しても、同条の罰金刑を科する。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [48], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第4節　罰則"], "orig": "第百四十四条　法人の代表者、代理人、使用人その他の従業者が、その法人の業務に関して、前条の違反行為をしたときは、行為者を罰するほか、その法人に対しても、同条の罰金刑を科する。", "ch": 9}, {"key": "h145", "num": [145], "label": "第145条", "caption": "", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "〔学習用見出し：基金・連合会の役職員等の過料〕\n第145条　基金若しくは連合会又は解散した基金若しくは連合会が、次の各号のいずれかに該当する場合には、その違反行為をした基金若しくは連合会の役員、代理人若しくは使用人その他の従業者又は解散した基金若しくは連合会の清算人は、200000円以下の過料に処する。\n1　第120条第4項（第137条の8第2項において準用する場合を含む。）の規定に違反して、届出をせず、又は虚偽の届出をしたとき。\n2　第139条の規定に違反して、届出をせず、又は虚偽の届出をしたとき。\n3　第140条の規定に違反して、報告をせず、又は虚偽の報告をしたとき。\n4　第142条第1項の規定による命令に違反したとき。\n5　この章の規定により基金又は連合会が行うものとされた事業以外の事業を行つたとき。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [49], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第4節　罰則"], "orig": "第百四十五条　基金若しくは連合会又は解散した基金若しくは連合会が、次の各号のいずれかに該当する場合には、その違反行為をした基金若しくは連合会の役員、代理人若しくは使用人その他の従業者又は解散した基金若しくは連合会の清算人は、二十万円以下の過料に処する。\n一　第百二十条第四項（第百三十七条の八第二項において準用する場合を含む。）の規定に違反して、届出をせず、又は虚偽の届出をしたとき。\n二　第百三十九条の規定に違反して、届出をせず、又は虚偽の届出をしたとき。\n三　第百四十条の規定に違反して、報告をせず、又は虚偽の報告をしたとき。\n四　第百四十二条第一項の規定による命令に違反したとき。\n五　この章の規定により基金又は連合会が行うものとされた事業以外の事業を行つたとき。", "ch": 9}, {"key": "h146", "num": [146], "label": "第146条", "caption": "", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "〔学習用見出し：基金・連合会の役員の過料〕\n第146条　基金又は連合会が、次の各号のいずれかに該当する場合には、その違反行為をした基金又は連合会の役員は、200000円以下の過料に処する。\n1　第121条（第137条の9において準用する場合を含む。）の規定に違反して、公告を怠り、又は虚偽の公告をしたとき。\n2　第137条の3の4第2項又は第137条の3の10第2項の規定に違反して、書類を備え置かず、その書類に記載すべき事項を記載せず、若しくは虚偽の記載をし、又はこれらの規定による閲覧を拒んだとき。\n3　第137条の17第7項又は第137条の19第7項の規定に違反して、通知をしないとき。\n4　第137条の17第8項（第137条の19第8項において準用する場合を含む。）の規定に違反して、公告を怠り、又は虚偽の公告をしたとき。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [50], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第4節　罰則"], "orig": "第百四十六条　基金又は連合会が、次の各号のいずれかに該当する場合には、その違反行為をした基金又は連合会の役員は、二十万円以下の過料に処する。\n一　第百二十一条（第百三十七条の九において準用する場合を含む。）の規定に違反して、公告を怠り、又は虚偽の公告をしたとき。\n二　第百三十七条の三の四第二項又は第百三十七条の三の十第二項の規定に違反して、書類を備え置かず、その書類に記載すべき事項を記載せず、若しくは虚偽の記載をし、又はこれらの規定による閲覧を拒んだとき。\n三　第百三十七条の十七第七項又は第百三十七条の十九第七項の規定に違反して、通知をしないとき。\n四　第百三十七条の十七第八項（第百三十七条の十九第八項において準用する場合を含む。）の規定に違反して、公告を怠り、又は虚偽の公告をしたとき。", "ch": 9}, {"key": "h147", "num": [147], "label": "第147条", "caption": "", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "〔学習用見出し：加入員等の届出違反の過料〕\n第147条　次の各号に掲げる場合には、100000円以下の過料に処する。\n1　加入員が、第127条の2において準用する第12条第1項又は第138条において準用する第105条第1項の規定に違反して、届出をしなかつたとき。ただし、第127条の2において準用する第12条第2項（第138条において準用する第105条第2項において準用する場合を含む。）の規定によつて世帯主から届出がなされたときを除く。\n2　加入員が、第127条の2において準用する第12条第1項又は第138条において準用する第105条第1項の規定に違反して、虚偽の届出をしたとき。\n3　加入員の属する世帯の世帯主が、第127条の2において準用する第12条第2項（第138条において準用する第105条第2項において準用する場合を含む。）の規定により届出をする場合に虚偽の届出をしたとき。\n4　戸籍法の規定による死亡の届出義務者が、第138条において準用する第105条第4項本文の規定に違反して、届出をしなかつたとき。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [51], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第4節　罰則"], "orig": "第百四十七条　次の各号に掲げる場合には、十万円以下の過料に処する。\n一　加入員が、第百二十七条の二において準用する第十二条第一項又は第百三十八条において準用する第百五条第一項の規定に違反して、届出をしなかつたとき。ただし、第百二十七条の二において準用する第十二条第二項（第百三十八条において準用する第百五条第二項において準用する場合を含む。）の規定によつて世帯主から届出がなされたときを除く。\n二　加入員が、第百二十七条の二において準用する第十二条第一項又は第百三十八条において準用する第百五条第一項の規定に違反して、虚偽の届出をしたとき。\n三　加入員の属する世帯の世帯主が、第百二十七条の二において準用する第十二条第二項（第百三十八条において準用する第百五条第二項において準用する場合を含む。）の規定により届出をする場合に虚偽の届出をしたとき。\n四　戸籍法の規定による死亡の届出義務者が、第百三十八条において準用する第百五条第四項本文の規定に違反して、届出をしなかつたとき。", "ch": 9}, {"key": "h148", "num": [148], "label": "第148条", "caption": "", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "〔学習用見出し：基金等の名称の無断使用に対する過料〕\n第148条　第118条第2項又は第137条の4の3第2項の規定に違反して、国民年金基金という名称又は国民年金基金連合会という名称を用いた者は、100000円以下の過料に処する。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [52], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第4節　罰則"], "orig": "第百四十八条　第百十八条第二項又は第百三十七条の四の三第二項の規定に違反して、国民年金基金という名称又は国民年金基金連合会という名称を用いた者は、十万円以下の過料に処する。", "ch": 9}, {"key": "f1", "num": [1], "label": "附則第1条", "caption": "施行期日", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（施行期日）\n附則 第1条　この法律は、昭和34年11月1日から施行する。ただし、第2章、第74条、第75条及び附則第4条から附則第8条までの規定は昭和35年10月1日から、第76条から第79条まで、第6章中保険料に関する部分及び附則第2条の規定は昭和36年4月1日から、附則第3条第1項の規定は公布の日から施行する。", "bg": "【1959年制定】国民皆年金の実現には、給付の開始と実務の準備をともに進める必要があった。そこで制度を一斉に始めず、まず1959年11月に無拠出の福祉年金、1960年10月に加入届出・年金手帳の準備、1961年4月に保険料徴収を始める段階施行を採った。市町村の資格把握・事務体制整備と、直ちに保護が必要な高齢者等への福祉年金支給を両立させるための施行日調整である。\n【参考】S01・S02・S03", "deb": "—", "tsu": "—", "kako": "—", "rows": [6], "orig": "（施行期日）\n附則 第一条　この法律は、昭和三十四年十一月一日から施行する。ただし、第二章、第七十四条、第七十五条及び附則第四条から附則第八条までの規定は昭和三十五年十月一日から、第七十六条から第七十九条まで、第六章中保険料に関する部分及び附則第二条の規定は昭和三十六年四月一日から、附則第三条第一項の規定は公布の日から施行する。"}, {"key": "f1-2", "num": [1, 2], "label": "附則第1条の2", "caption": "基礎年金についての検討", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（基礎年金についての検討）\n附則 第1条の2　基礎年金の水準、費用負担のあり方等については、社会経済情勢の推移、世帯の類型等を考慮して、今後検討が加えられるべきものとする。", "bg": "【1985年改正・昭和60年法律第34号】被用者年金を含む全国共通の基礎年金が生まれた。しかし制度を設けて終わりではなく、給付の水準や保険料・国庫負担の公平性が制度全体の課題となった。世帯構成、人口・経済情勢の変化に応じた見直しを将来の立法課題として明示し、改革時点の給付・負担水準を永久に固定しない趣旨で追加された。\n【参考】S02・S03・S05", "deb": "—", "tsu": "—", "kako": "—", "rows": [7], "orig": "（基礎年金についての検討）\n附則 第一条の二　基礎年金の水準、費用負担のあり方等については、社会経済情勢の推移、世帯の類型等を考慮して、今後検討が加えられるべきものとする。"}, {"key": "f2", "num": [2], "label": "附則第2条", "caption": "被保険者に関する経過措置", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（被保険者に関する経過措置）\n附則 第2条　昭和35年10月1日から昭和36年3月31日までの間において被保険者であつた者について、給付に関する規定を適用する場合においては、その者は、その期間、被保険者でなかつたものとみなす。", "bg": "【1959年制定・1961年改正】制度の準備と保険料徴収は、同時には始まらなかった。1960年10月に加入資格の届出が先行し、保険料の徴収は1961年4月から始まった。両者の間の半年間をそのまま給付算定の被保険者期間に含めると、保険料を徴収していない準備期間が年金給付に反映されるため、給付計算上は被保険者でなかったものと扱う経過措置を置いた。\n【参考】S01・S03", "deb": "—", "tsu": "—", "kako": "—", "rows": [8], "orig": "（被保険者に関する経過措置）\n附則 第二条　昭和三十五年十月一日から昭和三十六年三月三十一日までの間において被保険者であつた者について、給付に関する規定を適用する場合においては、その者は、その期間、被保険者でなかつたものとみなす。"}, {"key": "f3", "num": [3], "label": "附則第3条", "caption": "被保険者の資格の特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（被保険者の資格の特例）\n附則 第3条　第7条第1項第2号の規定の適用については、当分の間、同号中「の被保険者」とあるのは、「の被保険者（65歳以上の者にあつては、厚生年金保険法附則第4条の3第1項に規定する政令で定める給付の受給権を有しない被保険者に限る。）」とする。", "bg": "【1985年以降の被用者年金・基礎年金制度の調整】第2号被保険者の資格は厚生年金への加入と連動する。しかし、65歳以上で既に老齢・退職給付の受給権がある者まで当然に国民年金第2号と扱うかが問題となる。老齢給付の受給権がない65歳以上の被用者に限定して第2号の資格を認める読替えにより、被用者年金への継続加入と基礎年金の被保険者資格を調整する。\n【参考】S03・S05", "deb": "—", "tsu": "—", "kako": "—", "rows": [9], "orig": "（被保険者の資格の特例）\n附則 第三条　第七条第一項第二号の規定の適用については、当分の間、同号中「の被保険者」とあるのは、「の被保険者（六十五歳以上の者にあつては、厚生年金保険法附則第四条の三第一項に規定する政令で定める給付の受給権を有しない被保険者に限る。）」とする。"}, {"key": "f4", "num": [4], "label": "附則第4条", "caption": "被保険者の資格の喪失に関する経過措置", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（被保険者の資格の喪失に関する経過措置）\n附則 第4条　当分の間、第9条第5号の規定の適用については、同号中「該当するときを除く。）」とあるのは「該当するときを除く。）又は65歳に達したとき（附則第3条の規定により読み替えられた第7条第1項第2号に該当するときを除く。）」とする。", "bg": "【被用者年金の資格区分の調整】加入資格がいつ失われるのかを明確にするため、一般の国民年金資格喪失事由に加え、65歳到達による扱いを第2号被保険者について整理する必要があった。附則第3条により、老齢給付の受給権を持たない65歳以上の厚生年金加入者は引き続き第2号に当たり得るため、その例外を維持しつつ、その他の者の資格喪失時点を明確化した。\n【参考】S03・S05", "deb": "—", "tsu": "—", "kako": "—", "rows": [10], "orig": "（被保険者の資格の喪失に関する経過措置）\n附則 第四条　当分の間、第九条第五号の規定の適用については、同号中「該当するときを除く。）」とあるのは「該当するときを除く。）又は六十五歳に達したとき（附則第三条の規定により読み替えられた第七条第一項第二号に該当するときを除く。）」とする。"}, {"key": "f5", "num": [5], "label": "附則第5条", "caption": "任意加入被保険者", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（任意加入被保険者）\n附則 第5条　次の各号のいずれかに該当する者（第2号被保険者及び第3号被保険者を除く。）は、第7条第1項の規定にかかわらず、厚生労働大臣に申し出て、被保険者となることができる。\n1　日本国内に住所を有する20歳以上60歳未満の者であつて、厚生年金保険法に基づく老齢給付等を受けることができるもの（この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。）\n2　日本国内に住所を有する60歳以上65歳未満の者（この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。）\n3　日本国籍を有する者その他政令で定める者であつて、日本国内に住所を有しない20歳以上65歳未満のもの\n2　前項第1号又は第2号に該当する者が同項の規定による申出を行おうとする場合には、口座振替納付を希望する旨の申出又は口座振替納付によらない正当な事由がある場合として厚生労働省令で定める場合に該当する旨の申出を厚生労働大臣に対してしなければならない。\n3　前項（第1項第3号に掲げる者にあつては、同項）の規定による申出をした者は、その申出をした日に被保険者の資格を取得するものとする。\n4　第1項の規定による被保険者は、いつでも、厚生労働大臣に申し出て、被保険者の資格を喪失することができる。\n5　第1項の規定による被保険者は、第9条第1号に該当するに至つた日の翌日又は次の各号のいずれかに該当するに至つた日に、被保険者の資格を喪失する。\n1　65歳に達したとき。\n2　厚生年金保険の被保険者の資格を取得したとき。\n3　前項の申出が受理されたとき。\n4　第27条各号に掲げる月数を合算した月数が四百八十に達したとき。\n6　第1項第1号に掲げる者である被保険者は、前項の規定によつて被保険者の資格を喪失するほか、次の各号のいずれかに該当するに至つた日の翌日（第1号に該当するに至つた日に更に被保険者の資格を取得したとき、又は第2号若しくは第3号に該当するに至つたときは、その日）に、被保険者の資格を喪失する。\n1　日本国内に住所を有しなくなつたとき。\n2　厚生年金保険法に基づく老齢給付等を受けることができる者に該当しなくなつたとき。\n3　被扶養配偶者となつたとき。\n4　保険料を滞納し、第96条第1項の規定による指定の期限までに、その保険料を納付しないとき。\n5　この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者となつたとき。\n7　第1項第2号に掲げる者である被保険者は、第5項の規定によつて被保険者の資格を喪失するほか、前項第1号、第4号及び第5号のいずれかに該当するに至つた日の翌日（同項第1号に該当するに至つた日に更に被保険者の資格を取得したときは、その日）に、被保険者の資格を喪失する。\n8　第1項第3号に掲げる者である被保険者は、第5項の規定によつて被保険者の資格を喪失するほか、次の各号のいずれかに該当するに至つた日の翌日（その事実があつた日に更に被保険者の資格を取得したときは、その日）に、被保険者の資格を喪失する。\n1　日本国内に住所を有するに至つたとき。\n2　日本国籍を有する者及び第1項第3号に規定する政令で定める者のいずれにも該当しなくなつたとき。\n3　被扶養配偶者となつたとき（60歳未満であるときに限る。）。\n4　保険料を滞納し、その後、保険料を納付することなく2年間が経過したとき。\n9　第1項の規定による被保険者は、第87条の2の規定の適用については、第1号被保険者とみなし、当該被保険者としての被保険者期間は、第5条第1項の規定の適用については第7条第1項第1号に規定する被保険者としての被保険者期間と、第49条から第52条の6まで、附則第9条の3及び第9条の3の2の規定の適用については第1号被保険者としての被保険者期間と、それぞれみなす。\n10　第1項の規定による被保険者については、第88条の2から第90条の3までの規定を適用しない。\n11　第1項の規定による被保険者（同項第1号に掲げる者を除く。第13項において同じ。）は、第116条第1項及び第2項並びに第127条第1項の規定の適用については、第1号被保険者とみなす。\n12　第1項の規定による被保険者（同項第3号に掲げる者に限る。）は、第127条第1項の規定にかかわらず、その者が住所を有していた地区に係る地域型基金又はその者が加入していた職能型基金に申し出て、地域型基金又は職能型基金の加入員となることができる。\nこの場合における第116条第1項及び第2項並びに第127条第3項の規定の適用については、第116条第1項中「有する者」とあるのは「有する者及び有していた者」と、同条第2項中「従事する者」とあるのは「従事する者及び従事していた者」と、第127条第3項第2号中「地域型基金の加入員」とあるのは「地域型基金の加入員（附則第5条第12項の規定により加入員となつた者を除く。）」と、「職能型基金の加入員」とあるのは「職能型基金の加入員（同項の規定により加入員となつた者を除く。）」とする。\n13　第1項の規定による被保険者が中途脱退者であつて再びもとの基金の加入員となつた場合における第130条第2項（第137条の17第5項において準用する場合を除く。）及び国民年金法等の一部を改正する法律（昭和60年法律第34号。以下「昭和60年改正法」という。）附則第34条第4項第1号の規定の適用については、第130条第2項中「当該基金の加入員であつた期間」とあるのは「当該基金の加入員であつた期間であつて、連合会（第137条の4に規定する連合会をいう。）がその支給に関する義務を負つている年金又は一時金の額の計算の基礎となる期間を除いたもの」と、昭和60年改正法附則第34条第4項第1号中「同法第130条第2項に規定する加入員期間をいう。\n以下この号において同じ」とあるのは「同法附則第5条第13項の規定により読み替えて適用する同法第130条第2項に規定する加入員期間をいう」と、「加入員期間の月数」とあるのは「加入員であつた期間の月数」とする。この場合においては、第137条の18の規定は、適用しない。", "bg": "【1985年の3区分制度への再編とその後の改正】強制加入は原則20歳以上60歳未満。それでも、60歳までの納付期間が不足する人、海外居住の日本人、早期に老齢給付の受給権を持つ人などには加入継続・加入機会の需要がある。任意加入を認めることで受給資格・年金額を補完し、65歳到達や納付済期間480月到達など、終了すべき場面も定めた。\n【参考】S02・S03・S05", "deb": "—", "tsu": "—", "kako": "平成29年、令和元年、令和2年、令和3年、令和4年、令和5年、令和6年、令和7年", "rows": [11], "orig": "（任意加入被保険者）\n附則 第五条　次の各号のいずれかに該当する者（第二号被保険者及び第三号被保険者を除く。）は、第七条第一項の規定にかかわらず、厚生労働大臣に申し出て、被保険者となることができる。\n一　日本国内に住所を有する二十歳以上六十歳未満の者であつて、厚生年金保険法に基づく老齢給付等を受けることができるもの（この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。）\n二　日本国内に住所を有する六十歳以上六十五歳未満の者（この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。）\n三　日本国籍を有する者その他政令で定める者であつて、日本国内に住所を有しない二十歳以上六十五歳未満のもの\n２　前項第一号又は第二号に該当する者が同項の規定による申出を行おうとする場合には、口座振替納付を希望する旨の申出又は口座振替納付によらない正当な事由がある場合として厚生労働省令で定める場合に該当する旨の申出を厚生労働大臣に対してしなければならない。\n３　前項（第一項第三号に掲げる者にあつては、同項）の規定による申出をした者は、その申出をした日に被保険者の資格を取得するものとする。\n４　第一項の規定による被保険者は、いつでも、厚生労働大臣に申し出て、被保険者の資格を喪失することができる。\n５　第一項の規定による被保険者は、第九条第一号に該当するに至つた日の翌日又は次の各号のいずれかに該当するに至つた日に、被保険者の資格を喪失する。\n一　六十五歳に達したとき。\n二　厚生年金保険の被保険者の資格を取得したとき。\n三　前項の申出が受理されたとき。\n四　第二十七条各号に掲げる月数を合算した月数が四百八十に達したとき。\n６　第一項第一号に掲げる者である被保険者は、前項の規定によつて被保険者の資格を喪失するほか、次の各号のいずれかに該当するに至つた日の翌日（第一号に該当するに至つた日に更に被保険者の資格を取得したとき、又は第二号若しくは第三号に該当するに至つたときは、その日）に、被保険者の資格を喪失する。\n一　日本国内に住所を有しなくなつたとき。\n二　厚生年金保険法に基づく老齢給付等を受けることができる者に該当しなくなつたとき。\n三　被扶養配偶者となつたとき。\n四　保険料を滞納し、第九十六条第一項の規定による指定の期限までに、その保険料を納付しないとき。\n五　この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者となつたとき。\n７　第一項第二号に掲げる者である被保険者は、第五項の規定によつて被保険者の資格を喪失するほか、前項第一号、第四号及び第五号のいずれかに該当するに至つた日の翌日（同項第一号に該当するに至つた日に更に被保険者の資格を取得したときは、その日）に、被保険者の資格を喪失する。\n８　第一項第三号に掲げる者である被保険者は、第五項の規定によつて被保険者の資格を喪失するほか、次の各号のいずれかに該当するに至つた日の翌日（その事実があつた日に更に被保険者の資格を取得したときは、その日）に、被保険者の資格を喪失する。\n一　日本国内に住所を有するに至つたとき。\n二　日本国籍を有する者及び第一項第三号に規定する政令で定める者のいずれにも該当しなくなつたとき。\n三　被扶養配偶者となつたとき（六十歳未満であるときに限る。）。\n四　保険料を滞納し、その後、保険料を納付することなく二年間が経過したとき。\n９　第一項の規定による被保険者は、第八十七条の二の規定の適用については、第一号被保険者とみなし、当該被保険者としての被保険者期間は、第五条第一項の規定の適用については第七条第一項第一号に規定する被保険者としての被保険者期間と、第四十九条から第五十二条の六まで、附則第九条の三及び第九条の三の二の規定の適用については第一号被保険者としての被保険者期間と、それぞれみなす。\n１０　第一項の規定による被保険者については、第八十八条の二から第九十条の三までの規定を適用しない。\n１１　第一項の規定による被保険者（同項第一号に掲げる者を除く。第十三項において同じ。）は、第百十六条第一項及び第二項並びに第百二十七条第一項の規定の適用については、第一号被保険者とみなす。\n１２　第一項の規定による被保険者（同項第三号に掲げる者に限る。）は、第百二十七条第一項の規定にかかわらず、その者が住所を有していた地区に係る地域型基金又はその者が加入していた職能型基金に申し出て、地域型基金又は職能型基金の加入員となることができる。この場合における第百十六条第一項及び第二項並びに第百二十七条第三項の規定の適用については、第百十六条第一項中「有する者」とあるのは「有する者及び有していた者」と、同条第二項中「従事する者」とあるのは「従事する者及び従事していた者」と、第百二十七条第三項第二号中「地域型基金の加入員」とあるのは「地域型基金の加入員（附則第五条第十二項の規定により加入員となつた者を除く。）」と、「職能型基金の加入員」とあるのは「職能型基金の加入員（同項の規定により加入員となつた者を除く。）」とする。\n１３　第一項の規定による被保険者が中途脱退者であつて再びもとの基金の加入員となつた場合における第百三十条第二項（第百三十七条の十七第五項において準用する場合を除く。）及び国民年金法等の一部を改正する法律（昭和六十年法律第三十四号。以下「昭和六十年改正法」という。）附則第三十四条第四項第一号の規定の適用については、第百三十条第二項中「当該基金の加入員であつた期間」とあるのは「当該基金の加入員であつた期間であつて、連合会（第百三十七条の四に規定する連合会をいう。）がその支給に関する義務を負つている年金又は一時金の額の計算の基礎となる期間を除いたもの」と、昭和六十年改正法附則第三十四条第四項第一号中「同法第百三十条第二項に規定する加入員期間をいう。以下この号において同じ」とあるのは「同法附則第五条第十三項の規定により読み替えて適用する同法第百三十条第二項に規定する加入員期間をいう」と、「加入員期間の月数」とあるのは「加入員であつた期間の月数」とする。この場合においては、第百三十七条の十八の規定は、適用しない。"}, {"key": "f6", "num": [6], "label": "附則第6条", "caption": "", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "〔学習用見出し：他制度の老齢給付等の受給に伴う保険料の取扱い〕\n附則 第6条　第1号被保険者である者が厚生年金保険法に基づく老齢給付等を受けることができる者に該当するに至つた場合において、その者がこれに該当するに至らなかつたならば納付すべき保険料を、その該当するに至つた日の属する月以降の期間について、第93条第1項の規定により前納しているとき、又はその該当するに至つた日の属する月後における最初の4月の末日までに納付したときは、その該当するに至つた日において、前条第1項の申出をしたものとみなす。", "bg": "【任意加入への円滑な切替え】本人の納付意思を、制度上の資格変更で途切れさせないための規定である。第1号被保険者が厚生年金の老齢給付等を受けられる立場になった際は、強制加入の対象が変わる。既に将来月分の保険料を前納した人などに改めて任意加入の申出を要求すると、本人の納付意思に反して加入期間が途切れ得るため、所定の前納・納付があれば申出をしたものとみなして加入を継続できるようにした。\n【参考】S03", "deb": "—", "tsu": "—", "kako": "—", "rows": [12], "orig": "附則 第六条　第一号被保険者である者が厚生年金保険法に基づく老齢給付等を受けることができる者に該当するに至つた場合において、その者がこれに該当するに至らなかつたならば納付すべき保険料を、その該当するに至つた日の属する月以降の期間について、第九十三条第一項の規定により前納しているとき、又はその該当するに至つた日の属する月後における最初の四月の末日までに納付したときは、その該当するに至つた日において、前条第一項の申出をしたものとみなす。"}, {"key": "f7-2", "num": [7, 2], "label": "附則第7条の2", "caption": "被保険者期間に関する特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（被保険者期間に関する特例）\n附則 第7条の2　厚生年金保険の被保険者期間につき厚生年金保険法による保険料を徴収する権利が時効によつて消滅したとき（同法第75条ただし書に該当するときを除く。）は、当該保険料に係る厚生年金保険の被保険者期間の計算の基礎となつた月に係る第2号被保険者としての被保険者期間は、第5条第1項の規定にかかわらず、保険料納付済期間に算入しない。\nその者の配偶者が第3号被保険者である場合における当該厚生年金保険の被保険者期間の計算の基礎となつた月に係る当該配偶者の第3号被保険者としての被保険者期間についても、同様とする。", "bg": "【1985年の基礎年金導入に伴う制度間調整】制度をまたぐ年金期間を、どこまで納付済期間とみなすか。第2号被保険者とその配偶者の第3号期間は、原則として国民年金の保険料納付済期間に反映される。しかし、基礎となる厚生年金の保険料徴収権が時効消滅した期間まで無条件に算入すると、保険料負担と給付算定が一致しなくなる。このため、一定の場合に第2号・対応する第3号期間を納付済期間から除く特例を置いた。\n【参考】S03・S05", "deb": "—", "tsu": "—", "kako": "—", "rows": [13], "orig": "（被保険者期間に関する特例）\n附則 第七条の二　厚生年金保険の被保険者期間につき厚生年金保険法による保険料を徴収する権利が時効によつて消滅したとき（同法第七十五条ただし書に該当するときを除く。）は、当該保険料に係る厚生年金保険の被保険者期間の計算の基礎となつた月に係る第二号被保険者としての被保険者期間は、第五条第一項の規定にかかわらず、保険料納付済期間に算入しない。その者の配偶者が第三号被保険者である場合における当該厚生年金保険の被保険者期間の計算の基礎となつた月に係る当該配偶者の第三号被保険者としての被保険者期間についても、同様とする。"}, {"key": "f7-3", "num": [7, 3], "label": "附則第7条の3", "caption": "", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "〔学習用見出し：第3号被保険者の届出遅延に伴う特例〕\n附則 第7条の3　第7条第1項第3号に該当しなかつた者が同号の規定に該当する被保険者となつたことに関する第12条第5項から第8項までの規定による届出又は同号に該当する被保険者の配偶者が厚生年金保険の被保険者の資格を喪失した後引き続き厚生年金保険の被保険者となつたことに関する第105条第1項（同条第2項において第12条第6項から第8項までの規定を準用する場合を含む。）の規定による届出が行われた日の属する月前の当該届出に係る第3号被保険者としての被保険者期間（当該届出が行われた日の属する月の前々月までの2年間のうちにあるものを除く。）は、第5条第1項の規定にかかわらず、保険料納付済期間に算入しない。\n2　第3号被保険者又は第3号被保険者であつた者は、その者の第3号被保険者としての被保険者期間のうち、前項の規定により保険料納付済期間に算入されない期間（前条の規定により保険料納付済期間に算入されない第3号被保険者としての被保険者期間を除く。）について、前項に規定する届出を遅滞したことについてやむを得ない事由があると認められるときは、厚生労働大臣にその旨の届出をすることができる。\n3　前項の規定により届出が行われたときは、第1項の規定にかかわらず、当該届出が行われた日以後、当該届出に係る期間は保険料納付済期間に算入する。\n4　老齢基礎年金の受給権者が第2項の規定による届出を行い、前項の規定により当該届出に係る期間が保険料納付済期間に算入されたときは、当該届出のあつた日の属する月の翌月から、年金額を改定する。\n5　第3項の規定により第2項の届出に係る期間が保険料納付済期間に算入された者に対する昭和60年改正法附則第18条の規定の適用については、同条第1項中「同日以後の国民年金の被保険者期間」とあるのは、「同日以後に保険料納付済期間に算入される期間」とする。", "bg": "【第3号被保険者の届出遅延対策】被扶養配偶者にも年金権を認めた一方で、届出の遅れが新たな問題となった。1985年改革で被扶養配偶者が第3号となり、本人の届出漏れ・遅延により実際には該当していても年金記録に反映されない問題が生じた。2年を超える遅延届出について原則は納付済期間に算入しない一方、やむを得ない理由がある場合の特例届出を設け、届出義務と年金権保護との調整を図った。1994年・2004年の改正でも救済の仕組みが見直された。\n【参考】S03・S09", "deb": "—", "tsu": "—", "kako": "平成29年、令和4年", "rows": [14], "orig": "附則 第七条の三　第七条第一項第三号に該当しなかつた者が同号の規定に該当する被保険者となつたことに関する第十二条第五項から第八項までの規定による届出又は同号に該当する被保険者の配偶者が厚生年金保険の被保険者の資格を喪失した後引き続き厚生年金保険の被保険者となつたことに関する第百五条第一項（同条第二項において第十二条第六項から第八項までの規定を準用する場合を含む。）の規定による届出が行われた日の属する月前の当該届出に係る第三号被保険者としての被保険者期間（当該届出が行われた日の属する月の前々月までの二年間のうちにあるものを除く。）は、第五条第一項の規定にかかわらず、保険料納付済期間に算入しない。\n２　第三号被保険者又は第三号被保険者であつた者は、その者の第三号被保険者としての被保険者期間のうち、前項の規定により保険料納付済期間に算入されない期間（前条の規定により保険料納付済期間に算入されない第三号被保険者としての被保険者期間を除く。）について、前項に規定する届出を遅滞したことについてやむを得ない事由があると認められるときは、厚生労働大臣にその旨の届出をすることができる。\n３　前項の規定により届出が行われたときは、第一項の規定にかかわらず、当該届出が行われた日以後、当該届出に係る期間は保険料納付済期間に算入する。\n４　老齢基礎年金の受給権者が第二項の規定による届出を行い、前項の規定により当該届出に係る期間が保険料納付済期間に算入されたときは、当該届出のあつた日の属する月の翌月から、年金額を改定する。\n５　第三項の規定により第二項の届出に係る期間が保険料納付済期間に算入された者に対する昭和六十年改正法附則第十八条の規定の適用については、同条第一項中「同日以後の国民年金の被保険者期間」とあるのは、「同日以後に保険料納付済期間に算入される期間」とする。"}, {"key": "f7-3-2", "num": [7, 3, 2], "label": "附則第7条の3の2", "caption": "", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "〔学習用見出し：第3号被保険者期間の記録に関する特例の適用除外〕\n附則 第7条の3の2　前条第1項の規定は、次の各号のいずれかに該当する場合において、当該各号に規定する被保険者期間については、適用しない。\n1　第3号被保険者としての被保険者期間（保険料納付済期間（政令で定める期間を除く。）に限る。以下この条において「対象第3号被保険者期間」という。）を有する者の当該対象第3号被保険者期間の一部について、第3号被保険者としての被保険者期間以外の期間として第14条の規定により記録した事項の訂正がなされた場合　｜　当該第3号被保険者としての被保険者期間以外の期間に引き続く第3号被保険者としての被保険者期間\n2　対象第3号被保険者期間を有する者の当該対象第3号被保険者期間の一部の期間（以下この号において「対象一部第3号被保険者期間」という。）におけるその者の配偶者の被保険者期間が、直近の厚生年金保険の被保険者である期間に引き続く他の厚生年金保険の被保険者である期間となつたことにより、当該対象一部第3号被保険者期間について、保険料納付済期間でないものとして第14条の規定により記録した事項の訂正がなされた場合　｜　当該訂正がなされた第3号被保険者としての被保険者期間", "bg": "【第3号被保険者の記録不整合への対応】記録を正した結果、別の期間にまで不利益が及ぶことがある。第3号だった期間の一部が第1号等へ訂正されたことや、配偶者の厚生年金記録の接続関係が変わったことにより、周辺の第3号期間まで遅延届出扱いとなる事態があった。本人に新たな届出遅延の責任を一律に負わせないよう、一定の記録訂正の場合は前条の不算入措置を適用しない特例を設けた。\n【参考】S03・S08", "deb": "—", "tsu": "—", "kako": "—", "rows": [15], "orig": "附則 第七条の三の二　前条第一項の規定は、次の各号のいずれかに該当する場合において、当該各号に規定する被保険者期間については、適用しない。\n一　第三号被保険者としての被保険者期間（保険料納付済期間（政令で定める期間を除く。）に限る。以下この条において「対象第三号被保険者期間」という。）を有する者の当該対象第三号被保険者期間の一部について、第三号被保険者としての被保険者期間以外の期間として第十四条の規定により記録した事項の訂正がなされた場合　｜　当該第三号被保険者としての被保険者期間以外の期間に引き続く第三号被保険者としての被保険者期間\n二　対象第三号被保険者期間を有する者の当該対象第三号被保険者期間の一部の期間（以下この号において「対象一部第三号被保険者期間」という。）におけるその者の配偶者の被保険者期間が、直近の厚生年金保険の被保険者である期間に引き続く他の厚生年金保険の被保険者である期間となつたことにより、当該対象一部第三号被保険者期間について、保険料納付済期間でないものとして第十四条の規定により記録した事項の訂正がなされた場合　｜　当該訂正がなされた第三号被保険者としての被保険者期間"}, {"key": "f7-4", "num": [7, 4], "label": "附則第7条の4", "caption": "", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "〔学習用見出し：第2号被保険者に関する届出規定の適用除外〕\n附則 第7条の4　第2号被保険者については、第12条及び第105条の規定を適用しない。", "bg": "【1985年の基礎年金創設】同じ資格変更を二重に届け出させないための整理である。厚生年金に加入する第2号被保険者は、原則として勤務先を経由して厚生年金側で資格・異動を管理する。国民年金第1号等と同じ届出を別途要求すると二重の手続になるため、国民年金法第12条・第105条の届出規定の適用を除外し、制度間の事務分担を整理した。\n【参考】S03・S05", "deb": "—", "tsu": "—", "kako": "—", "rows": [16], "orig": "附則 第七条の四　第二号被保険者については、第十二条及び第百五条の規定を適用しない。"}, {"key": "f7-5", "num": [7, 5], "label": "附則第7条の5", "caption": "国民年金原簿の特例等", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（国民年金原簿の特例等）\n附則 第7条の5　第14条及び第14条の2の規定の適用については、当分の間、第14条中「被保険者」とあるのは、「被保険者（第2号被保険者のうち第2号厚生年金被保険者、第3号厚生年金被保険者又は第4号厚生年金被保険者であるものを除く。\n次条において同じ。）」とする。\n2　第2号被保険者であつた期間のうち厚生年金保険法第2条の5第1項第2号に規定する第2号厚生年金被保険者期間（以下この条において「第2号厚生年金被保険者期間」という。）、同項第3号に規定する第3号厚生年金被保険者期間（以下この条において「第3号厚生年金被保険者期間」という。）又は同項第4号に規定する第4号厚生年金被保険者期間（以下この条において「第4号厚生年金被保険者期間」という。）につき第26条、第30条第1項、第30条の2第1項、第30条の3第1項、第34条第4項、第36条第2項ただし書、第37条、附則第9条の2第1項又は第9条の2の2第1項の規定の適用を受けようとする者についての当該厚生年金保険の被保険者であつた期間については、当分の間、第2号厚生年金被保険者期間については国家公務員共済組合連合会の確認を、第3号厚生年金被保険者期間については地方公務員共済組合の確認を、第4号厚生年金被保険者期間については日本私立学校振興・共済事業団の確認を受けたところによる。\n3　前項の規定による確認に関する処分に不服がある者は、厚生年金保険法第90条第2項及び第4項から第6項までの定めるところにより、同条第2項各号に定める審査機関に審査請求をすることができる。\n4　第2項の場合において、当該第2号厚生年金被保険者期間、第3号厚生年金被保険者期間又は第4号厚生年金被保険者期間に係る同項の規定による確認の処分についての不服を、当該厚生年金保険の被保険者であつた期間に基づく老齢基礎年金、障害基礎年金又は遺族基礎年金に関する処分についての不服の理由とすることができない。", "bg": "【2012年被用者年金一元化に伴う記録事務の整理】被用者年金を一元化しても、各機関の過去の記録まで一か所に集まるわけではない。公務員・私学教職員等も厚生年金被保険者に一元化された一方、各共済組合等は各実施機関として過去の期間記録を保有する。国民年金原簿で一律に確認するのではなく、各実施機関による期間確認と審査請求の手続を残し、基礎年金の受給資格判断に必要な記録の正確性を確保するための特例である。\n【参考】S03・S04", "deb": "—", "tsu": "—", "kako": "—", "rows": [17], "orig": "（国民年金原簿の特例等）\n附則 第七条の五　第十四条及び第十四条の二の規定の適用については、当分の間、第十四条中「被保険者」とあるのは、「被保険者（第二号被保険者のうち第二号厚生年金被保険者、第三号厚生年金被保険者又は第四号厚生年金被保険者であるものを除く。次条において同じ。）」とする。\n２　第二号被保険者であつた期間のうち厚生年金保険法第二条の五第一項第二号に規定する第二号厚生年金被保険者期間（以下この条において「第二号厚生年金被保険者期間」という。）、同項第三号に規定する第三号厚生年金被保険者期間（以下この条において「第三号厚生年金被保険者期間」という。）又は同項第四号に規定する第四号厚生年金被保険者期間（以下この条において「第四号厚生年金被保険者期間」という。）につき第二十六条、第三十条第一項、第三十条の二第一項、第三十条の三第一項、第三十四条第四項、第三十六条第二項ただし書、第三十七条、附則第九条の二第一項又は第九条の二の二第一項の規定の適用を受けようとする者についての当該厚生年金保険の被保険者であつた期間については、当分の間、第二号厚生年金被保険者期間については国家公務員共済組合連合会の確認を、第三号厚生年金被保険者期間については地方公務員共済組合の確認を、第四号厚生年金被保険者期間については日本私立学校振興・共済事業団の確認を受けたところによる。\n３　前項の規定による確認に関する処分に不服がある者は、厚生年金保険法第九十条第二項及び第四項から第六項までの定めるところにより、同条第二項各号に定める審査機関に審査請求をすることができる。\n４　第二項の場合において、当該第二号厚生年金被保険者期間、第三号厚生年金被保険者期間又は第四号厚生年金被保険者期間に係る同項の規定による確認の処分についての不服を、当該厚生年金保険の被保険者であつた期間に基づく老齢基礎年金、障害基礎年金又は遺族基礎年金に関する処分についての不服の理由とすることができない。"}, {"key": "f8", "num": [8], "label": "附則第8条", "caption": "資料の提供", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（資料の提供）\n附則 第8条　厚生労働大臣は、被保険者の資格に関し必要があるときは、共済組合、日本私立学校振興・共済事業団その他厚生年金保険法に基づく老齢給付等に係る制度の管掌機関に対し、必要な資料の提供を求めることができる。", "bg": "【被用者年金との資格照合】年金の加入資格は、国民年金の記録だけでは確定できない場合がある。第2号被保険者に該当するかは厚生年金や共済制度の加入・老齢給付の状況によって決まる。本人の申告と国民年金側の記録だけでは確認が難しいため、共済組合や私学共済事業団など他制度の運営主体に資料提供を求め、加入資格の誤認や重複判定を防ぐ仕組みを置いた。\n【参考】S03・S04", "deb": "—", "tsu": "—", "kako": "—", "rows": [18], "orig": "（資料の提供）\n附則 第八条　厚生労働大臣は、被保険者の資格に関し必要があるときは、共済組合、日本私立学校振興・共済事業団その他厚生年金保険法に基づく老齢給付等に係る制度の管掌機関に対し、必要な資料の提供を求めることができる。"}, {"key": "f9", "num": [9], "label": "附則第9条", "caption": "老齢基礎年金等の支給要件の特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（老齢基礎年金等の支給要件の特例）\n附則 第9条　保険料納付済期間又は保険料免除期間（第90条の3第1項の規定により納付することを要しないものとされた保険料に係るものを除く。次条第1項及び附則第9条の2の2第1項において同じ。）を有する者（以下この項において「保険料納付済期間等を有する者」という。）のうち、第26条ただし書に該当する者であつて保険料納付済期間、保険料免除期間及び合算対象期間（附則第5条第1項第1号又は第3号に該当した期間（第2号被保険者又は第3号被保険者であつた期間、保険料納付済期間及び60歳以上であつた期間を除く。）をいう。以下同じ。）を合算した期間が10年以上であるものは、第26条、次条第1項、附則第9条の2の2第1項、第9条の3第1項及び第9条の3の2第1項の規定の適用については、第26条ただし書に該当しないものとみなし、保険料納付済期間等を有する者のうち、保険料納付済期間と保険料免除期間とを合算した期間が25年に満たない者であつて保険料納付済期間、保険料免除期間及び合算対象期間並びに65歳に達した日の属する月以後の厚生年金保険の被保険者期間を合算した期間が25年以上であるものは、第37条（第3号に限る。）の規定の適用については、保険料納付済期間と保険料免除期間とを合算した期間が25年以上であるものとみなす。\n2　合算対象期間の計算については、第11条の規定の例による。", "bg": "【1985年基礎年金改革と受給資格期間の接続】制度の移行期には、保険料を納めていない期間をどう扱うかが問題となった。加入義務の対象外だった期間や、任意加入しなかった海外在住期間などは、保険料を納めていないため年金額には反映しない一方、老齢給付の受給資格まで否定すると移行期の人に不利益が生じる。そこで合算対象期間（いわゆるカラ期間）を資格期間に加えられる特例を整備した。後の受給資格期間短縮にも対応している。\n【参考】S02・S04・S05", "deb": "—", "tsu": "—", "kako": "令和元年、令和7年", "rows": [19], "orig": "（老齢基礎年金等の支給要件の特例）\n附則 第九条　保険料納付済期間又は保険料免除期間（第九十条の三第一項の規定により納付することを要しないものとされた保険料に係るものを除く。次条第一項及び附則第九条の二の二第一項において同じ。）を有する者（以下この項において「保険料納付済期間等を有する者」という。）のうち、第二十六条ただし書に該当する者であつて保険料納付済期間、保険料免除期間及び合算対象期間（附則第五条第一項第一号又は第三号に該当した期間（第二号被保険者又は第三号被保険者であつた期間、保険料納付済期間及び六十歳以上であつた期間を除く。）をいう。以下同じ。）を合算した期間が十年以上であるものは、第二十六条、次条第一項、附則第九条の二の二第一項、第九条の三第一項及び第九条の三の二第一項の規定の適用については、第二十六条ただし書に該当しないものとみなし、保険料納付済期間等を有する者のうち、保険料納付済期間と保険料免除期間とを合算した期間が二十五年に満たない者であつて保険料納付済期間、保険料免除期間及び合算対象期間並びに六十五歳に達した日の属する月以後の厚生年金保険の被保険者期間を合算した期間が二十五年以上であるものは、第三十七条（第三号に限る。）の規定の適用については、保険料納付済期間と保険料免除期間とを合算した期間が二十五年以上であるものとみなす。\n２　合算対象期間の計算については、第十一条の規定の例による。"}, {"key": "f9-2", "num": [9, 2], "label": "附則第9条の2", "caption": "老齢基礎年金の支給の繰上げ", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（老齢基礎年金の支給の繰上げ）\n附則 第9条の2　保険料納付済期間又は保険料免除期間を有する者であつて、60歳以上65歳未満であるもの（附則第5条第1項の規定による被保険者でないものに限るものとし、次条第1項に規定する支給繰上げの請求をすることができるものを除く。）は、当分の間、65歳に達する前に、厚生労働大臣に老齢基礎年金の支給繰上げの請求をすることができる。ただし、その者が、その請求があつた日の前日において、第26条ただし書に該当したときは、この限りでない。\n2　前項の請求は、厚生年金保険法附則第7条の3第1項又は第13条の4第1項の規定により支給繰上げの請求をすることができる者にあつては、当該請求と同時に行わなければならない。\n3　第1項の請求があつたときは、第26条の規定にかかわらず、その請求があつた日から、その者に老齢基礎年金を支給する。\n4　前項の規定により支給する老齢基礎年金の額は、第27条の規定にかかわらず、同条に定める額から政令で定める額を減じた額とする。\n5　寡婦年金の受給権は、受給権者が第3項の規定による老齢基礎年金の受給権を取得したときは、消滅する。\n6　第4項の規定は、第3項の規定による老齢基礎年金の受給権者が第87条の2の規定による保険料に係る保険料納付済期間を有する場合における付加年金の額について準用する。この場合において、第4項中「第27条」とあるのは、「第44条」と読み替えるものとする。", "bg": "【1985年基礎年金の65歳支給原則と受給選択】原則は65歳から。それでも、老齢基礎年金については、退職・所得の状況により60～64歳から生活資金を必要とする場合もある。65歳前の請求を認める代わりに減額した額を支給し、早期受給と生涯の給付水準との均衡を図った。後年の受給開始年齢選択の改正でも調整されてきた。\n【参考】S02・S04・S05", "deb": "—", "tsu": "—", "kako": "平成29年、令和元年、令和4年、令和5年", "rows": [20], "orig": "（老齢基礎年金の支給の繰上げ）\n附則 第九条の二　保険料納付済期間又は保険料免除期間を有する者であつて、六十歳以上六十五歳未満であるもの（附則第五条第一項の規定による被保険者でないものに限るものとし、次条第一項に規定する支給繰上げの請求をすることができるものを除く。）は、当分の間、六十五歳に達する前に、厚生労働大臣に老齢基礎年金の支給繰上げの請求をすることができる。ただし、その者が、その請求があつた日の前日において、第二十六条ただし書に該当したときは、この限りでない。\n２　前項の請求は、厚生年金保険法附則第七条の三第一項又は第十三条の四第一項の規定により支給繰上げの請求をすることができる者にあつては、当該請求と同時に行わなければならない。\n３　第一項の請求があつたときは、第二十六条の規定にかかわらず、その請求があつた日から、その者に老齢基礎年金を支給する。\n４　前項の規定により支給する老齢基礎年金の額は、第二十七条の規定にかかわらず、同条に定める額から政令で定める額を減じた額とする。\n５　寡婦年金の受給権は、受給権者が第三項の規定による老齢基礎年金の受給権を取得したときは、消滅する。\n６　第四項の規定は、第三項の規定による老齢基礎年金の受給権者が第八十七条の二の規定による保険料に係る保険料納付済期間を有する場合における付加年金の額について準用する。この場合において、第四項中「第二十七条」とあるのは、「第四十四条」と読み替えるものとする。"}, {"key": "f9-2-2", "num": [9, 2, 2], "label": "附則第9条の2の2", "caption": "老齢厚生年金の支給繰上げの請求ができる者等に係る老齢基礎年金の支給の繰上げの特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（老齢厚生年金の支給繰上げの請求ができる者等に係る老齢基礎年金の支給の繰上げの特例）\n附則 第9条の2の2　保険料納付済期間又は保険料免除期間を有する者であつて、厚生年金保険法附則第8条の2各項に規定する者（同条第3項に規定する者その他政令で定めるものに限るものとし、同条各項の表の下欄に掲げる年齢に達していないものに限る。）に該当するもの（60歳以上の者であつて、かつ、附則第5条第1項の規定による被保険者でないものに限る。）は、当分の間、厚生労働大臣に老齢基礎年金の一部の支給繰上げの請求をすることができる。ただし、その者が、その請求があつた日の前日において、第26条ただし書に該当したときは、この限りでない。\n2　前項の請求は、厚生年金保険法附則第7条の3第1項又は第13条の4第1項の規定により支給繰上げの請求をすることができる者にあつては、当該請求と同時に行わなければならない。\n3　第1項の請求があつたときは、第26条の規定にかかわらず、その請求があつた日から、その者に老齢基礎年金を支給する。\n4　前項の規定により支給する老齢基礎年金の額は、第27条の規定にかかわらず、同条に定める額に政令で定める率を乗じて得た額から政令で定める額を減じた額とする。\n5　第3項の規定による老齢基礎年金の受給権者が65歳に達したときは、前項の規定にかかわらず、当該老齢基礎年金の額に、第27条に定める額に一から前項に規定する政令で定める率を控除して得た率を乗じて得た額を加算するものとし、65歳に達した日の属する月の翌月から、年金の額を改定する。\n6　前条第5項及び第6項の規定は、第3項の規定による老齢基礎年金について準用する。この場合において、同条第6項中「第4項の規定」とあるのは「次条第4項及び第5項の規定」と、「第4項中」とあるのは「次条第4項及び第5項の規定中」と読み替えるものとする。", "bg": "【2000年改正・平成12年法律第18号】年金の受取り方を選べるようにするには、基礎年金と厚生年金の関係も整理しなければならない。特別支給の老齢厚生年金の支給開始年齢が段階的に引き上げられる過程で、老齢基礎年金だけを全部繰り上げる制度では、厚生年金の報酬比例部分との受給時期・金額の調整が不十分となった。対象者に基礎年金の一部繰上げを認め、老齢厚生年金との同時請求・65歳到達後の年金額改定を組み合わせた。\n【参考】S04・S06", "deb": "—", "tsu": "—", "kako": "—", "rows": [21], "orig": "（老齢厚生年金の支給繰上げの請求ができる者等に係る老齢基礎年金の支給の繰上げの特例）\n附則 第九条の二の二　保険料納付済期間又は保険料免除期間を有する者であつて、厚生年金保険法附則第八条の二各項に規定する者（同条第三項に規定する者その他政令で定めるものに限るものとし、同条各項の表の下欄に掲げる年齢に達していないものに限る。）に該当するもの（六十歳以上の者であつて、かつ、附則第五条第一項の規定による被保険者でないものに限る。）は、当分の間、厚生労働大臣に老齢基礎年金の一部の支給繰上げの請求をすることができる。ただし、その者が、その請求があつた日の前日において、第二十六条ただし書に該当したときは、この限りでない。\n２　前項の請求は、厚生年金保険法附則第七条の三第一項又は第十三条の四第一項の規定により支給繰上げの請求をすることができる者にあつては、当該請求と同時に行わなければならない。\n３　第一項の請求があつたときは、第二十六条の規定にかかわらず、その請求があつた日から、その者に老齢基礎年金を支給する。\n４　前項の規定により支給する老齢基礎年金の額は、第二十七条の規定にかかわらず、同条に定める額に政令で定める率を乗じて得た額から政令で定める額を減じた額とする。\n５　第三項の規定による老齢基礎年金の受給権者が六十五歳に達したときは、前項の規定にかかわらず、当該老齢基礎年金の額に、第二十七条に定める額に一から前項に規定する政令で定める率を控除して得た率を乗じて得た額を加算するものとし、六十五歳に達した日の属する月の翌月から、年金の額を改定する。\n６　前条第五項及び第六項の規定は、第三項の規定による老齢基礎年金について準用する。この場合において、同条第六項中「第四項の規定」とあるのは「次条第四項及び第五項の規定」と、「第四項中」とあるのは「次条第四項及び第五項の規定中」と読み替えるものとする。"}, {"key": "f9-2-3", "num": [9, 2, 3], "label": "附則第9条の2の3", "caption": "障害基礎年金等の特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（障害基礎年金等の特例）\n附則 第9条の2の3　第30条第1項（第2号に限る。）、第30条の2、第30条の3、第30条の4第2項、第34条第4項、第36条第2項ただし書及び第49条並びに附則第5条の規定は、当分の間、附則第9条の2第3項若しくは前条第3項の規定による老齢基礎年金の受給権者又は厚生年金保険法附則第7条の3第3項若しくは第13条の4第3項の規定による老齢厚生年金の受給権者については、適用しない。", "bg": "【2000年改正・繰上げ受給と障害給付との調整】早く年金を受け取り始める選択は、その後の障害給付にも影響し得る。老齢基礎年金・老齢厚生年金を65歳前に繰り上げた場合、受給権を得た後に障害状態が悪化したときの障害基礎年金の新規請求等と競合し得る。繰上げを選択する時点での給付上の効果を明確にし、事後重症請求等の規定と任意加入規定の適用関係を整理するために置かれた特例である。\n【参考】S04・S06", "deb": "—", "tsu": "—", "kako": "平成29年、令和5年、令和6年", "rows": [22], "orig": "（障害基礎年金等の特例）\n附則 第九条の二の三　第三十条第一項（第二号に限る。）、第三十条の二、第三十条の三、第三十条の四第二項、第三十四条第四項、第三十六条第二項ただし書及び第四十九条並びに附則第五条の規定は、当分の間、附則第九条の二第三項若しくは前条第三項の規定による老齢基礎年金の受給権者又は厚生年金保険法附則第七条の三第三項若しくは第十三条の四第三項の規定による老齢厚生年金の受給権者については、適用しない。"}, {"key": "f9-2-4", "num": [9, 2, 4], "label": "附則第9条の2の4", "caption": "併給調整の特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（併給調整の特例）\n附則 第9条の2の4　第20条第1項の規定の適用については、当分の間、同項中「遺族基礎年金又は寡婦年金」とあるのは「年金給付（老齢基礎年金及び障害基礎年金（その受給権者が65歳に達しているものに限る。）並びに付加年金を除く。）」と、「老齢基礎年金の受給権者」とあるのは「老齢基礎年金の受給権者（65歳に達している者に限る。）」と、「障害基礎年金の受給権者」とあるのは「障害基礎年金の受給権者（65歳に達している者に限る。）」とする。", "bg": "【2000年改正・繰上げと併給調整】繰上げによって受給時期が変われば、ほかの年金との関係も変わる。原則65歳からの老齢基礎年金と、60歳台前半に繰上げ支給される基礎年金・厚生年金について、他の年金給付と併給できる範囲を一律に扱うと制度間の調整が崩れる。そこで65歳到達前後を区別し、遺族・障害等の年金と老齢年金の選択・支給停止の適用関係を読替えで整えた。\n【参考】S04・S06", "deb": "—", "tsu": "—", "kako": "令和6年", "rows": [23], "orig": "（併給調整の特例）\n附則 第九条の二の四　第二十条第一項の規定の適用については、当分の間、同項中「遺族基礎年金又は寡婦年金」とあるのは「年金給付（老齢基礎年金及び障害基礎年金（その受給権者が六十五歳に達しているものに限る。）並びに付加年金を除く。）」と、「老齢基礎年金の受給権者」とあるのは「老齢基礎年金の受給権者（六十五歳に達している者に限る。）」と、「障害基礎年金の受給権者」とあるのは「障害基礎年金の受給権者（六十五歳に達している者に限る。）」とする。"}, {"key": "f9-2-5", "num": [9, 2, 5], "label": "附則第9条の2の5", "caption": "延滞金の割合の特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（延滞金の割合の特例）\n附則 第9条の2の5　第97条第1項（第134条の2第1項において準用する場合及び第137条の21第2項において読み替えて準用する場合を含む。以下この条において同じ。）に規定する延滞金の年14.6パーセントの割合及び年7.3パーセントの割合は、当分の間、第97条第1項の規定にかかわらず、各年の延滞税特例基準割合（租税特別措置法（昭和32年法律第26号）第94条第1項に規定する延滞税特例基準割合をいう。以下この条において同じ。）が年7.3パーセントの割合に満たない場合には、その年中においては、年14.6パーセントの割合にあつては当該延滞税特例基準割合に年7.3パーセントの割合を加算した割合とし、年7.3パーセントの割合にあつては当該延滞税特例基準割合に年1パーセントの割合を加算した割合（当該加算した割合が年7.3パーセントの割合を超える場合には、年7.3パーセントの割合）とする。", "bg": "【2009年改正とその後の金利環境への対応】延滞金は納付を促す一方で、金利環境を無視すれば負担が過大になり得る。法定延滞金率を景気や市場金利にかかわらず高率に固定すると、低金利下では過大な負担となり得る。延滞税特例基準割合を参照する変動率の特例を設け、納付遅延への制裁・徴収促進の機能は残しながら、実勢金利との著しい乖離を抑える仕組みとした。\n【参考】S04", "deb": "—", "tsu": "—", "kako": "—", "rows": [24], "orig": "（延滞金の割合の特例）\n附則 第九条の二の五　第九十七条第一項（第百三十四条の二第一項において準用する場合及び第百三十七条の二十一第二項において読み替えて準用する場合を含む。以下この条において同じ。）に規定する延滞金の年十四・六パーセントの割合及び年七・三パーセントの割合は、当分の間、第九十七条第一項の規定にかかわらず、各年の延滞税特例基準割合（租税特別措置法（昭和三十二年法律第二十六号）第九十四条第一項に規定する延滞税特例基準割合をいう。以下この条において同じ。）が年七・三パーセントの割合に満たない場合には、その年中においては、年十四・六パーセントの割合にあつては当該延滞税特例基準割合に年七・三パーセントの割合を加算した割合とし、年七・三パーセントの割合にあつては当該延滞税特例基準割合に年一パーセントの割合を加算した割合（当該加算した割合が年七・三パーセントの割合を超える場合には、年七・三パーセントの割合）とする。"}, {"key": "f9-2-6", "num": [9, 2, 6], "label": "附則第9条の2の6", "caption": "保険料の免除に要する費用の財源の特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（保険料の免除に要する費用の財源の特例）\n附則 第9条の2の6　令和8年度から令和10年度までの間における第88条の3第3項の規定の適用については、同項中「子ども・子育て支援納付金」とあるのは、「子ども・子育て支援納付金及び同法第71条の26第2項に規定する子ども・子育て支援特例公債の発行収入金」とする。", "bg": "【2024年改正・令和6年法律第47号】育児期間の保険料免除を新設するには、開始時点の財源も整えなければならない。第1号被保険者の育児期間における保険料免除を2026年10月から開始するに当たり、子ども・子育て支援の新しい財源を段階的に整える必要があった。2026～2028年度について、支援納付金に加え子ども・子育て支援特例公債の発行収入金を財源に使えるようにし、制度開始直後の移行期の費用を賄う特例を設けた。\n【参考】S04・S12", "deb": "—", "tsu": "—", "kako": "—", "rows": [25], "orig": "（保険料の免除に要する費用の財源の特例）\n附則 第九条の二の六　令和八年度から令和十年度までの間における第八十八条の三第三項の規定の適用については、同項中「子ども・子育て支援納付金」とあるのは、「子ども・子育て支援納付金及び同法第七十一条の二十六第二項に規定する子ども・子育て支援特例公債の発行収入金」とする。"}, {"key": "f9-3", "num": [9, 3], "label": "附則第9条の3", "caption": "旧陸軍共済組合等の組合員であつた期間を有する者に対する老齢年金の支給", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（旧陸軍共済組合等の組合員であつた期間を有する者に対する老齢年金の支給）\n附則 第9条の3　第1号被保険者としての被保険者期間に係る保険料納付済期間、保険料免除期間及び旧陸軍共済組合令（昭和15年勅令第947号）に基づく旧陸軍共済組合その他政令で定める共済組合の組合員であつた期間であつて政令で定める期間を合算した期間が10年以上である者が65歳に達したときは、その者に老齢年金を支給する。ただし、当該保険料納付済期間と当該保険料免除期間とを合算した期間が1年以上であり、かつ、第26条ただし書に該当する場合に限る。\n2　前項の規定により支給する老齢年金の額は、第1号被保険者としての被保険者期間に係る保険料納付済期間及び保険料免除期間につき、第27条の規定の例によつて計算した額とする。\n3　第1項の規定による老齢年金は、第3章（第2節を除く。）及び第7章から第10章まで並びに厚生年金保険法第38条の規定の適用については、老齢基礎年金とみなす。\n4　第28条、附則第9条の2（同条第1項ただし書を除く。）、第9条の2の3及び第9条の2の4の規定は、第1項に規定する要件に該当する者について準用する。この場合において、附則第9条の2第1項中「保険料納付済期間又は保険料免除期間を有する」とあるのは「附則第9条の3第1項に規定する要件に該当する」と、同条第3項中「第26条」とあるのは「附則第9条の3第1項」と読み替えるものとする。\n5　第1項の規定による老齢年金の受給権は、受給権者が死亡したときは、消滅する。", "bg": "【1966年改正・旧令共済期間の救済】制度が変わっても、それ以前の加入歴を切り捨てないための特例である。戦前・戦中の旧陸軍・海軍共済組合等の加入期間は、戦後の社会保険制度へ当然に引き継がれるとは限らず、年金資格期間を満たせない人がいた。旧令共済組合員期間と国民年金の保険料納付済・免除期間を合算して老齢年金につなぐ特例を整え、過去の就労歴が制度の断絶によって無意味になるのを緩和した。\n【参考】S04・S11", "deb": "—", "tsu": "—", "kako": "—", "rows": [26], "orig": "（旧陸軍共済組合等の組合員であつた期間を有する者に対する老齢年金の支給）\n附則 第九条の三　第一号被保険者としての被保険者期間に係る保険料納付済期間、保険料免除期間及び旧陸軍共済組合令（昭和十五年勅令第九百四十七号）に基づく旧陸軍共済組合その他政令で定める共済組合の組合員であつた期間であつて政令で定める期間を合算した期間が十年以上である者が六十五歳に達したときは、その者に老齢年金を支給する。ただし、当該保険料納付済期間と当該保険料免除期間とを合算した期間が一年以上であり、かつ、第二十六条ただし書に該当する場合に限る。\n２　前項の規定により支給する老齢年金の額は、第一号被保険者としての被保険者期間に係る保険料納付済期間及び保険料免除期間につき、第二十七条の規定の例によつて計算した額とする。\n３　第一項の規定による老齢年金は、第三章（第二節を除く。）及び第七章から第十章まで並びに厚生年金保険法第三十八条の規定の適用については、老齢基礎年金とみなす。\n４　第二十八条、附則第九条の二（同条第一項ただし書を除く。）、第九条の二の三及び第九条の二の四の規定は、第一項に規定する要件に該当する者について準用する。この場合において、附則第九条の二第一項中「保険料納付済期間又は保険料免除期間を有する」とあるのは「附則第九条の三第一項に規定する要件に該当する」と、同条第三項中「第二十六条」とあるのは「附則第九条の三第一項」と読み替えるものとする。\n５　第一項の規定による老齢年金の受給権は、受給権者が死亡したときは、消滅する。"}, {"key": "f9-3-2", "num": [9, 3, 2], "label": "附則第9条の3の2", "caption": "日本国籍を有しない者に対する脱退一時金の支給", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（日本国籍を有しない者に対する脱退一時金の支給）\n附則 第9条の3の2　当分の間、保険料納付済期間等の月数（請求の日の前日において請求の日の属する月の前月までの第1号被保険者としての被保険者期間に係る保険料納付済期間の月数、保険料4分の1免除期間の月数の4分の3に相当する月数、保険料半額免除期間の月数の2分の1に相当する月数及び保険料4分の3免除期間の月数の4分の1に相当する月数を合算した月数をいう。第3項において同じ。）が6月以上である日本国籍を有しない者（被保険者でない者に限る。）であつて、第26条ただし書に該当するものその他これに準ずるものとして政令で定めるものは、脱退一時金の支給を請求することができる。ただし、その者が次の各号のいずれかに該当するときは、この限りでない。\n1　日本国内に住所を有するとき。\n2　障害基礎年金その他政令で定める給付の受給権を有したことがあるとき。\n3　最後に被保険者の資格を喪失した日（同日において日本国内に住所を有していた者にあつては、同日後初めて、日本国内に住所を有しなくなつた日）から起算して2年を経過しているとき。\n2　前項の請求があつたときは、その請求をした者に脱退一時金を支給する。\n3　脱退一時金の額は、基準月（請求の日の属する月の前月までの第1号被保険者としての被保険者期間（保険料納付済期間、保険料4分の1免除期間、保険料半額免除期間又は保険料4分の3免除期間に限る。）に属する月のうち同日の前日における直近の月をいう。）の属する年度における保険料の額に2分の1を乗じて得た額に保険料納付済期間等の月数に応じて政令で定める数を乗じて得た額とする。\n4　脱退一時金の支給を受けたときは、支給を受けた者は、その額の計算の基礎となつた第1号被保険者としての被保険者であつた期間は、被保険者でなかつたものとみなす。\n5　脱退一時金に関する処分に不服がある者は、社会保険審査会に対して審査請求をすることができる。\n6　第101条第3項から第5項まで及び第101条の2の規定は、前項の審査請求について準用する。この場合において、これらの規定に関し必要な技術的読替えは、政令で定める。\n7　第16条、第19条第1項、第4項及び第5項、第23条、第24条、第105条第4項、第107条第1項並びに第111条の規定は、脱退一時金について準用する。この場合において、これらの規定に関し必要な技術的読替えは、政令で定める。", "bg": "【1994年改正・1995年4月施行】日本で保険料を納めても、短期間の在留では年金の受給に届かないことがある。日本で短期間就労して保険料を納めた外国人が帰国すると、老齢年金の受給資格期間に届かず納付が給付につながらないことがあった。短期在留者の負担と給付の不均衡を是正するため、一定の納付期間を持ち、帰国後に所定の期間内に請求する外国人に脱退一時金を支給する制度を創設した。\n【参考】S04・S07", "deb": "—", "tsu": "—", "kako": "平成29年、平成30年、令和2年、令和3年、令和4年、令和7年、令和8年", "rows": [27], "orig": "（日本国籍を有しない者に対する脱退一時金の支給）\n附則 第九条の三の二　当分の間、保険料納付済期間等の月数（請求の日の前日において請求の日の属する月の前月までの第一号被保険者としての被保険者期間に係る保険料納付済期間の月数、保険料四分の一免除期間の月数の四分の三に相当する月数、保険料半額免除期間の月数の二分の一に相当する月数及び保険料四分の三免除期間の月数の四分の一に相当する月数を合算した月数をいう。第三項において同じ。）が六月以上である日本国籍を有しない者（被保険者でない者に限る。）であつて、第二十六条ただし書に該当するものその他これに準ずるものとして政令で定めるものは、脱退一時金の支給を請求することができる。ただし、その者が次の各号のいずれかに該当するときは、この限りでない。\n一　日本国内に住所を有するとき。\n二　障害基礎年金その他政令で定める給付の受給権を有したことがあるとき。\n三　最後に被保険者の資格を喪失した日（同日において日本国内に住所を有していた者にあつては、同日後初めて、日本国内に住所を有しなくなつた日）から起算して二年を経過しているとき。\n２　前項の請求があつたときは、その請求をした者に脱退一時金を支給する。\n３　脱退一時金の額は、基準月（請求の日の属する月の前月までの第一号被保険者としての被保険者期間（保険料納付済期間、保険料四分の一免除期間、保険料半額免除期間又は保険料四分の三免除期間に限る。）に属する月のうち同日の前日における直近の月をいう。）の属する年度における保険料の額に二分の一を乗じて得た額に保険料納付済期間等の月数に応じて政令で定める数を乗じて得た額とする。\n４　脱退一時金の支給を受けたときは、支給を受けた者は、その額の計算の基礎となつた第一号被保険者としての被保険者であつた期間は、被保険者でなかつたものとみなす。\n５　脱退一時金に関する処分に不服がある者は、社会保険審査会に対して審査請求をすることができる。\n６　第百一条第三項から第五項まで及び第百一条の二の規定は、前項の審査請求について準用する。この場合において、これらの規定に関し必要な技術的読替えは、政令で定める。\n７　第十六条、第十九条第一項、第四項及び第五項、第二十三条、第二十四条、第百五条第四項、第百七条第一項並びに第百十一条の規定は、脱退一時金について準用する。この場合において、これらの規定に関し必要な技術的読替えは、政令で定める。"}, {"key": "f9-4", "num": [9, 4], "label": "附則第9条の4", "caption": "基礎年金の支払", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（基礎年金の支払）\n附則 第9条の4　基礎年金の支払に関する事務は、政令で定めるところにより、政令で定める者に行わせることができる。", "bg": "【1985年の基礎年金制度への移行後の支払事務】共通の基礎年金を、実務上は誰が支払うのか。基礎年金は国民年金・厚生年金等の制度をまたぐ共通給付となったため、給付権の裁定主体と実際の支払事務の処理主体を必ずしも一致させる必要がない。政令で定める機関等に支払事務を行わせる根拠を置き、全国的な大量支払の事務を円滑化することを目的とした。\n【参考】S04・S05", "deb": "—", "tsu": "—", "kako": "—", "rows": [28], "orig": "（基礎年金の支払）\n附則 第九条の四　基礎年金の支払に関する事務は、政令で定めるところにより、政令で定める者に行わせることができる。"}, {"key": "f9-4-2", "num": [9, 4, 2], "label": "附則第9条の4の2", "caption": "第3号被保険者としての被保険者期間の特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（第3号被保険者としての被保険者期間の特例）\n附則 第9条の4の2　被保険者又は被保険者であつた者は、第3号被保険者としての被保険者期間（昭和61年4月から公的年金制度の健全性及び信頼性の確保のための厚生年金保険法等の一部を改正する法律（平成25年法律第63号。\n次条第1項において「平成25年改正法」という。）附則第1条第2号に掲げる規定の施行の日（以下「平成25年改正法一部施行日」という。）の属する月の前月までの間にある保険料納付済期間（政令で定める期間を除く。）に限る。）のうち、第1号被保険者としての被保険者期間として第14条の規定により記録した事項の訂正がなされた期間（附則第9条の4の6第1項及び第2項において「不整合期間」という。）であつて、当該訂正がなされたときにおいて保険料を徴収する権利が時効によつて消滅しているもの（以下「時効消滅不整合期間」という。）について、厚生労働大臣に届出をすることができる。\n2　前項の規定により届出が行われたときは、当該届出に係る時効消滅不整合期間（第4項及び次条第1項において「特定期間」という。）については、この法律その他の政令で定める法令の規定を適用する場合においては、当該届出が行われた日以後、第90条の3第1項の規定により納付することを要しないものとされた保険料に係る期間とみなすほか、これらの規定の適用に関し必要な事項は、政令で定める。\n3　次条第1項の規定その他政令で定める規定により保険料の納付が行われたときは、納付が行われた日以後、当該納付に係る月については、前項の規定は、適用しない。\n4　特定期間を有する者に対する昭和60年改正法附則第18条の規定の適用については、同条第1項中「同日以後の国民年金の被保険者期間」とあるのは、「同日以後に同法附則第9条の4の2第2項の規定により同法第90条の3第1項の規定により納付することを要しないものとされた保険料に係る期間とみなされた期間」とする。", "bg": "【2013年改正・平成25年法律第63号】実際の資格は変わっているのに、年金記録は以前のまま。そのずれが、後の年金権に影響する問題となった。配偶者の離職等で実際は第1号に変わったのに、記録上は第3号のままとなる「3号不整合記録」が問題化した。記録を訂正すると保険料の時効消滅等により無年金・年金減額を招くため、届出に基づき一定の期間を特定期間として扱い、受給資格・納付要件の判定で不利益を緩和する特例を整えた。\n【参考】S04・S08・S17", "deb": "2013年5月10日・衆議院本会議（第183回国会）。不整合記録を救済すれば、適正に保険料を納めた人との公平性はどうなるのか。第3号から第1号への種別変更の届出漏れをめぐり、議員からその点などが質問された。政府は、納付実績と給付の公平性を維持しながら、記録訂正・追納機会の確保と無年金防止等の生活配慮を行うと説明。\n【参考】S17", "tsu": "—", "kako": "—", "rows": [29], "orig": "（第三号被保険者としての被保険者期間の特例）\n附則 第九条の四の二　被保険者又は被保険者であつた者は、第三号被保険者としての被保険者期間（昭和六十一年四月から公的年金制度の健全性及び信頼性の確保のための厚生年金保険法等の一部を改正する法律（平成二十五年法律第六十三号。次条第一項において「平成二十五年改正法」という。）附則第一条第二号に掲げる規定の施行の日（以下「平成二十五年改正法一部施行日」という。）の属する月の前月までの間にある保険料納付済期間（政令で定める期間を除く。）に限る。）のうち、第一号被保険者としての被保険者期間として第十四条の規定により記録した事項の訂正がなされた期間（附則第九条の四の六第一項及び第二項において「不整合期間」という。）であつて、当該訂正がなされたときにおいて保険料を徴収する権利が時効によつて消滅しているもの（以下「時効消滅不整合期間」という。）について、厚生労働大臣に届出をすることができる。\n２　前項の規定により届出が行われたときは、当該届出に係る時効消滅不整合期間（第四項及び次条第一項において「特定期間」という。）については、この法律その他の政令で定める法令の規定を適用する場合においては、当該届出が行われた日以後、第九十条の三第一項の規定により納付することを要しないものとされた保険料に係る期間とみなすほか、これらの規定の適用に関し必要な事項は、政令で定める。\n３　次条第一項の規定その他政令で定める規定により保険料の納付が行われたときは、納付が行われた日以後、当該納付に係る月については、前項の規定は、適用しない。\n４　特定期間を有する者に対する昭和六十年改正法附則第十八条の規定の適用については、同条第一項中「同日以後の国民年金の被保険者期間」とあるのは、「同日以後に同法附則第九条の四の二第二項の規定により同法第九十条の三第一項の規定により納付することを要しないものとされた保険料に係る期間とみなされた期間」とする。"}, {"key": "f9-4-3", "num": [9, 4, 3], "label": "附則第9条の4の3", "caption": "特定保険料の納付", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（特定保険料の納付）\n附則 第9条の4の3　平成25年改正法附則第98条の政令で定める日の翌日から起算して3年を経過する日（以下「特定保険料納付期限日」という。）までの間において、被保険者又は被保険者であつた者（特定期間を有する者に限る。）は、厚生労働大臣の承認を受け、特定期間のうち、保険料納付済期間以外の期間であつて、その者が50歳以上60歳未満であつた期間（その者が60歳未満である場合にあつては、承認の日の属する月前10年以内の期間）の各月につき、承認の日の属する月前10年以内の期間の各月の保険料に相当する額に政令で定める額を加算した額のうち最も高い額（承認の日の属する月前10年以内の期間にあつては、当該加算した額）の保険料（以下この条及び附則第9条の4の9第4項において「特定保険料」という。）を納付することができる。\n2　前項の規定による特定保険料の納付は、先に経過した月の保険料に係る特定保険料から順次に行うものとする。\n3　第1項の規定により特定保険料の納付が行われたときは、納付が行われた日に、納付に係る月の保険料が納付されたものとみなす。\n4　老齢基礎年金の受給権者が第1項の規定による特定保険料の納付を行つたときは、納付が行われた日の属する月の翌月から、年金額を改定する。ただし、次条に規定する特定受給者については、特定保険料納付期限日の属する月の翌月から、年金額を改定する。\n5　前各項に定めるもののほか、特定保険料の納付手続その他特定保険料の納付について必要な事項は、政令で定める。", "bg": "【2013年改正・不整合記録の納付による回復】記録を訂正しても、納めたくても納められない。第3号不整合記録が訂正されると過去分の保険料は通常の時効により納付できず、年金額を回復する機会が失われる。そこで対象期間・年齢・期限を区切って「特定保険料」を後から納められる仕組みを設け、受給資格の保護だけでなく、実際の納付に応じた給付の回復を可能にした。\n【参考】S04・S08・S15", "deb": "—", "tsu": "—", "kako": "—", "rows": [30], "orig": "（特定保険料の納付）\n附則 第九条の四の三　平成二十五年改正法附則第九十八条の政令で定める日の翌日から起算して三年を経過する日（以下「特定保険料納付期限日」という。）までの間において、被保険者又は被保険者であつた者（特定期間を有する者に限る。）は、厚生労働大臣の承認を受け、特定期間のうち、保険料納付済期間以外の期間であつて、その者が五十歳以上六十歳未満であつた期間（その者が六十歳未満である場合にあつては、承認の日の属する月前十年以内の期間）の各月につき、承認の日の属する月前十年以内の期間の各月の保険料に相当する額に政令で定める額を加算した額のうち最も高い額（承認の日の属する月前十年以内の期間にあつては、当該加算した額）の保険料（以下この条及び附則第九条の四の九第四項において「特定保険料」という。）を納付することができる。\n２　前項の規定による特定保険料の納付は、先に経過した月の保険料に係る特定保険料から順次に行うものとする。\n３　第一項の規定により特定保険料の納付が行われたときは、納付が行われた日に、納付に係る月の保険料が納付されたものとみなす。\n４　老齢基礎年金の受給権者が第一項の規定による特定保険料の納付を行つたときは、納付が行われた日の属する月の翌月から、年金額を改定する。ただし、次条に規定する特定受給者については、特定保険料納付期限日の属する月の翌月から、年金額を改定する。\n５　前各項に定めるもののほか、特定保険料の納付手続その他特定保険料の納付について必要な事項は、政令で定める。"}, {"key": "f9-4-4", "num": [9, 4, 4], "label": "附則第9条の4の4", "caption": "特定受給者の老齢基礎年金等の特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（特定受給者の老齢基礎年金等の特例）\n附則 第9条の4の4　平成25年改正法一部施行日以後に第14条の規定により記録した事項の訂正がなされたことにより時効消滅不整合期間となつた期間を有する者であつて、平成25年改正法一部施行日において当該時効消滅不整合期間となつた期間が保険料納付済期間であるものとして老齢基礎年金又は厚生年金保険法に基づく老齢給付等を受けているもの（これらの給付の全部につき支給が停止されている者を含む。次条において「特定受給者」という。）が有する当該時効消滅不整合期間となつた期間については、この法律その他の政令で定める法令の規定（老齢基礎年金又は厚生年金保険法に基づく老齢給付等に係るものに限る。）を適用する場合においては、特定保険料納付期限日までの間、保険料納付済期間とみなす。この場合において、附則第9条の4の2第2項の規定は、適用しない。", "bg": "【2013年改正・受給中の人の急激な不利益への配慮】記録の適正化を急ぐだけでは、すでに年金で生活する人への影響が大きくなり得る。過去の不整合記録に基づいてすでに老齢年金を受けていた人について、記録訂正と同時に納付済期間をすべて失わせると生活に急変が生じる。特定保険料の納付猶予期間内は一定の不整合期間を納付済期間とみなし、記録の適正化と既裁定年金受給者の生活保障を段階的に両立させた。\n【参考】S04・S08・S17", "deb": "—", "tsu": "—", "kako": "—", "rows": [31], "orig": "（特定受給者の老齢基礎年金等の特例）\n附則 第九条の四の四　平成二十五年改正法一部施行日以後に第十四条の規定により記録した事項の訂正がなされたことにより時効消滅不整合期間となつた期間を有する者であつて、平成二十五年改正法一部施行日において当該時効消滅不整合期間となつた期間が保険料納付済期間であるものとして老齢基礎年金又は厚生年金保険法に基づく老齢給付等を受けているもの（これらの給付の全部につき支給が停止されている者を含む。次条において「特定受給者」という。）が有する当該時効消滅不整合期間となつた期間については、この法律その他の政令で定める法令の規定（老齢基礎年金又は厚生年金保険法に基づく老齢給付等に係るものに限る。）を適用する場合においては、特定保険料納付期限日までの間、保険料納付済期間とみなす。この場合において、附則第九条の四の二第二項の規定は、適用しない。"}, {"key": "f9-4-5", "num": [9, 4, 5], "label": "附則第9条の4の5", "caption": "特定保険料納付期限日の属する月の翌月以後の特定受給者の老齢基礎年金の額", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（特定保険料納付期限日の属する月の翌月以後の特定受給者の老齢基礎年金の額）\n附則 第9条の4の5　特定受給者に支給する特定保険料納付期限日の属する月の翌月以後の月分の老齢基礎年金の額については、訂正後年金額（第27条及び第28条並びに附則第9条の2及び第9条の2の2並びに昭和60年改正法附則第17条の規定に定める額をいう。）が訂正前年金額（前条に規定する時効消滅不整合期間となつた期間を保険料納付済期間とみなして第27条及び第28条並びに附則第9条の2及び第9条の2の2並びに昭和60年改正法附則第17条の規定を適用した場合におけるこれらの規定に定める額をいう。）に100分の90を乗じて得た額（以下この条において「減額下限額」という。）に満たないときは、第27条及び第28条並びに附則第9条の2及び第9条の2の2並びに昭和60年改正法附則第17条の規定にかかわらず、減額下限額に相当する額とする。", "bg": "【2013年改正・年金額減少の激変緩和】記録の公平性を保ちながら、受給者の生活の急変も避けなければならない。特定保険料を納める期限が経過した後、修正後の年金額が従前の年金額に比べ大幅に下がる場合がある。記録・保険料負担の公平性を確保しつつ生活への影響を緩和するため、一定の特定受給者には訂正前年金額の90％相当額を下限とする減額緩和措置を置いた。\n【参考】S04・S08・S17", "deb": "2013年5月10日・衆議院本会議（第183回国会）。記録を正すことと、すでに年金を受けている人の生活を守ること。その両立が、第3号不整合記録の訂正をめぐる議論の焦点だった。政府は、不整合期間を正して納付実績に応じた年金額にするとともに、過去分の返還を求めず、訂正前年金額からの減額を10％以内とする生活配慮を説明した。\n【参考】S17", "tsu": "—", "kako": "—", "rows": [32], "orig": "（特定保険料納付期限日の属する月の翌月以後の特定受給者の老齢基礎年金の額）\n附則 第九条の四の五　特定受給者に支給する特定保険料納付期限日の属する月の翌月以後の月分の老齢基礎年金の額については、訂正後年金額（第二十七条及び第二十八条並びに附則第九条の二及び第九条の二の二並びに昭和六十年改正法附則第十七条の規定に定める額をいう。）が訂正前年金額（前条に規定する時効消滅不整合期間となつた期間を保険料納付済期間とみなして第二十七条及び第二十八条並びに附則第九条の二及び第九条の二の二並びに昭和六十年改正法附則第十七条の規定を適用した場合におけるこれらの規定に定める額をいう。）に百分の九十を乗じて得た額（以下この条において「減額下限額」という。）に満たないときは、第二十七条及び第二十八条並びに附則第九条の二及び第九条の二の二並びに昭和六十年改正法附則第十七条の規定にかかわらず、減額下限額に相当する額とする。"}, {"key": "f9-4-6", "num": [9, 4, 6], "label": "附則第9条の4の6", "caption": "不整合期間を有する者の障害基礎年金等に係る特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（不整合期間を有する者の障害基礎年金等に係る特例）\n附則 第9条の4の6　平成25年改正法一部施行日以後に第14条の規定により記録した事項の訂正がなされたことにより不整合期間となつた期間を有する者であつて、平成25年改正法一部施行日において当該不整合期間となつた期間が保険料納付済期間であるものとして障害基礎年金又は厚生年金保険法その他の政令で定める法令に基づく障害を支給事由とする年金たる給付を受けているもの（これらの給付の全部につき支給が停止されている者を含む。）の当該不整合期間となつた期間については、この法律その他の政令で定める法令の規定（これらの給付に係るものに限る。）を適用する場合においては、保険料納付済期間とみなす。\n2　平成25年改正法一部施行日以後に第14条の規定により記録した事項の訂正がなされたことにより不整合期間となつた期間を有する者の死亡に係る遺族基礎年金又は厚生年金保険法その他の政令で定める法令に基づく死亡を支給事由とする年金たる給付であつて、平成25年改正法一部施行日において当該不整合期間となつた期間が保険料納付済期間であるものとして支給されているもの（これらの給付の全部につき支給が停止されているものを含む。）の受給資格要件たる期間の計算の基礎となる当該不整合期間となつた期間については、この法律その他の政令で定める法令の規定（これらの給付に係るものに限る。）を適用する場合においては、保険料納付済期間とみなす。\n3　附則第9条の4の2第1項の規定により届出が行われたときは、当該届出が行われた日以後、当該届出に係る期間については、第1項の規定は、適用しない。", "bg": "【2013年改正・障害・遺族給付の保護】記録の訂正が、障害や遺族の給付まで失わせる結果になってよいのか。第3号不整合期間が訂正されることで、既に支給している障害年金や遺族年金まで受給要件を欠く扱いになると、本人・遺族の生活保障を大きく損なう。既裁定給付に係る受給資格等の判定では不整合期間を一定範囲で納付済期間とみなし、老齢年金の調整とは区別した救済を設けた。\n【参考】S04・S08", "deb": "—", "tsu": "—", "kako": "—", "rows": [33], "orig": "（不整合期間を有する者の障害基礎年金等に係る特例）\n附則 第九条の四の六　平成二十五年改正法一部施行日以後に第十四条の規定により記録した事項の訂正がなされたことにより不整合期間となつた期間を有する者であつて、平成二十五年改正法一部施行日において当該不整合期間となつた期間が保険料納付済期間であるものとして障害基礎年金又は厚生年金保険法その他の政令で定める法令に基づく障害を支給事由とする年金たる給付を受けているもの（これらの給付の全部につき支給が停止されている者を含む。）の当該不整合期間となつた期間については、この法律その他の政令で定める法令の規定（これらの給付に係るものに限る。）を適用する場合においては、保険料納付済期間とみなす。\n２　平成二十五年改正法一部施行日以後に第十四条の規定により記録した事項の訂正がなされたことにより不整合期間となつた期間を有する者の死亡に係る遺族基礎年金又は厚生年金保険法その他の政令で定める法令に基づく死亡を支給事由とする年金たる給付であつて、平成二十五年改正法一部施行日において当該不整合期間となつた期間が保険料納付済期間であるものとして支給されているもの（これらの給付の全部につき支給が停止されているものを含む。）の受給資格要件たる期間の計算の基礎となる当該不整合期間となつた期間については、この法律その他の政令で定める法令の規定（これらの給付に係るものに限る。）を適用する場合においては、保険料納付済期間とみなす。\n３　附則第九条の四の二第一項の規定により届出が行われたときは、当該届出が行われた日以後、当該届出に係る期間については、第一項の規定は、適用しない。"}, {"key": "f9-4-7", "num": [9, 4, 7], "label": "附則第9条の4の7", "caption": "特定事由に係る申出等の特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（特定事由に係る申出等の特例）\n附則 第9条の4の7　被保険者又は被保険者であつた者は、次の各号のいずれかに該当するときは、厚生労働大臣にその旨の申出をすることができる。\n1　特定事由（この法律その他の政令で定める法令の規定に基づいて行われるべき事務の処理が行われなかつたこと又はその処理が著しく不当であることをいう。以下この条及び附則第9条の4の9から第9条の4の11までにおいて同じ。）により特定手続（第87条の2第1項の申出その他の政令で定める手続をいう。以下この条において同じ。）をすることができなくなつたとき。\n2　特定事由により特定手続を遅滞したとき。\n2　厚生労働大臣は、前項の申出に理由があると認めるときは、その申出を承認するものとする。\n3　第1項の申出をした者が前項の規定による承認を受けた場合において、特定事由がなければ特定手続が行われていたと認められるときに当該特定手続が行われていたとしたならば当該特定手続に係る規定により当該申出をした者が被保険者となる期間があるときは、当該期間は、この法律その他の政令で定める法令の規定（第87条第1項及び第2項並びに第88条第1項の規定その他政令で定める規定を除く。）を適用する場合においては、当該申出のあつた日以後、当該特定手続に係る規定による被保険者としての被保険者期間（附則第9条の4の9第1項第2号において「特定被保険者期間」という。）とみなす。\n4　第1項の申出をした者が第2項の規定による承認を受けた場合において、特定事由がなければ特定手続が行われていたと認められるときに当該特定手続が行われていたとしたならば当該特定手続に係る規定によりその一部の額につき保険料を納付することを要しないものとされる期間があるときは、当該期間は、この法律その他の政令で定める法令の規定を適用する場合においては、当該申出のあつた日以後、当該特定手続に係る規定によりその一部の額につき納付することを要しないものとされた保険料に係る期間（附則第9条の4の9第1項第3号及び第9条の4の11第1項第2号において「特定一部免除期間」という。）とみなす。ただし、当該申出をした者がこれを希望しない期間については、この限りでない。\n5　第1項の申出をした者が第2項の規定による承認を受けた場合において、特定事由がなければ特定手続が行われていたと認められるときに当該特定手続が行われていたとしたならば当該特定手続に係る規定により当該申出をした者が付加保険料（第87条の2第1項の規定による保険料をいう。\n以下この条並びに附則第9条の4の9第1項第1号及び第9条の4の10において同じ。）を納付する者となる期間があるときは、当該期間は、この法律その他の政令で定める法令の規定（第87条第1項及び第2項並びに第88条第1項の規定その他政令で定める規定を除く。）を適用する場合においては、当該申出のあつた日以後、当該特定手続に係る規定により付加保険料を納付する者である期間（附則第9条の4の10第1項第2号において「特定付加納付期間」という。）とみなす。\n6　第1項の申出をした者が第2項の規定による承認を受けた場合において、特定事由がなければ特定手続が行われていたと認められるときに当該特定手続が行われていたとしたならば当該特定手続に係る規定により保険料を納付することを要しないものとされる期間（以下この項から第8項までにおいて「全額免除対象期間」という。）があるときは、当該全額免除対象期間は、この法律その他の政令で定める法令の規定を適用する場合においては、当該申出のあつた日以後、当該特定手続に係る規定により納付することを要しないものとされた保険料に係る期間（次項及び第8項並びに附則第9条の4の11第1項第3号において「特定全額免除期間」という。）とみなす。ただし、当該申出をした者がこれを希望しない期間については、この限りでない。\n7　老齢基礎年金の受給権者が第2項の規定による承認を受けた場合において、前項の規定により全額免除対象期間（第90条の3第1項の規定により納付することを要しないものとされた保険料に係るものを除く。）が特定全額免除期間とみなされたときは、第1項の申出のあつた日の属する月の翌月から、年金額を改定する。\n8　第6項の規定により全額免除対象期間が特定全額免除期間とみなされた者に対する昭和60年改正法附則第18条の規定の適用については、同条第1項中「同日以後の国民年金の被保険者期間」とあるのは、「同日以後に同法附則第9条の4の7第6項の規定により保険料免除期間」とする。\n9　厚生労働大臣は、厚生労働省令で、第2項の規定による承認の基準を定めるものとする。\n10　厚生労働大臣は、前項の厚生労働省令を定め、又は変更しようとするときは、あらかじめ、社会保障審議会に諮問しなければならない。\n11　前各項に定めるもののほか、第1項の申出の手続その他前各項の規定の適用に関し必要な事項は、政令で定める。", "bg": "【2014年改正・平成26年法律第64号、2016年4月施行】本人が手続を望んでも、行政側の誤りで機会を失うことがある。年金事務所等の事務処理誤りや説明漏れによって加入・免除申請等の手続を逃し、受給権に不利益が生じても、従来は期限経過後に十分な回復ができなかった。年金記録問題の検証を踏まえ、本人の申出・審査によって本来できた手続や免除期間等を回復させる仕組みを創設した。\n【参考】S04・S10・S16・S20", "deb": "—", "tsu": "—", "kako": "—", "rows": [34], "orig": "（特定事由に係る申出等の特例）\n附則 第九条の四の七　被保険者又は被保険者であつた者は、次の各号のいずれかに該当するときは、厚生労働大臣にその旨の申出をすることができる。\n一　特定事由（この法律その他の政令で定める法令の規定に基づいて行われるべき事務の処理が行われなかつたこと又はその処理が著しく不当であることをいう。以下この条及び附則第九条の四の九から第九条の四の十一までにおいて同じ。）により特定手続（第八十七条の二第一項の申出その他の政令で定める手続をいう。以下この条において同じ。）をすることができなくなつたとき。\n二　特定事由により特定手続を遅滞したとき。\n２　厚生労働大臣は、前項の申出に理由があると認めるときは、その申出を承認するものとする。\n３　第一項の申出をした者が前項の規定による承認を受けた場合において、特定事由がなければ特定手続が行われていたと認められるときに当該特定手続が行われていたとしたならば当該特定手続に係る規定により当該申出をした者が被保険者となる期間があるときは、当該期間は、この法律その他の政令で定める法令の規定（第八十七条第一項及び第二項並びに第八十八条第一項の規定その他政令で定める規定を除く。）を適用する場合においては、当該申出のあつた日以後、当該特定手続に係る規定による被保険者としての被保険者期間（附則第九条の四の九第一項第二号において「特定被保険者期間」という。）とみなす。\n４　第一項の申出をした者が第二項の規定による承認を受けた場合において、特定事由がなければ特定手続が行われていたと認められるときに当該特定手続が行われていたとしたならば当該特定手続に係る規定によりその一部の額につき保険料を納付することを要しないものとされる期間があるときは、当該期間は、この法律その他の政令で定める法令の規定を適用する場合においては、当該申出のあつた日以後、当該特定手続に係る規定によりその一部の額につき納付することを要しないものとされた保険料に係る期間（附則第九条の四の九第一項第三号及び第九条の四の十一第一項第二号において「特定一部免除期間」という。）とみなす。ただし、当該申出をした者がこれを希望しない期間については、この限りでない。\n５　第一項の申出をした者が第二項の規定による承認を受けた場合において、特定事由がなければ特定手続が行われていたと認められるときに当該特定手続が行われていたとしたならば当該特定手続に係る規定により当該申出をした者が付加保険料（第八十七条の二第一項の規定による保険料をいう。以下この条並びに附則第九条の四の九第一項第一号及び第九条の四の十において同じ。）を納付する者となる期間があるときは、当該期間は、この法律その他の政令で定める法令の規定（第八十七条第一項及び第二項並びに第八十八条第一項の規定その他政令で定める規定を除く。）を適用する場合においては、当該申出のあつた日以後、当該特定手続に係る規定により付加保険料を納付する者である期間（附則第九条の四の十第一項第二号において「特定付加納付期間」という。）とみなす。\n６　第一項の申出をした者が第二項の規定による承認を受けた場合において、特定事由がなければ特定手続が行われていたと認められるときに当該特定手続が行われていたとしたならば当該特定手続に係る規定により保険料を納付することを要しないものとされる期間（以下この項から第八項までにおいて「全額免除対象期間」という。）があるときは、当該全額免除対象期間は、この法律その他の政令で定める法令の規定を適用する場合においては、当該申出のあつた日以後、当該特定手続に係る規定により納付することを要しないものとされた保険料に係る期間（次項及び第八項並びに附則第九条の四の十一第一項第三号において「特定全額免除期間」という。）とみなす。ただし、当該申出をした者がこれを希望しない期間については、この限りでない。\n７　老齢基礎年金の受給権者が第二項の規定による承認を受けた場合において、前項の規定により全額免除対象期間（第九十条の三第一項の規定により納付することを要しないものとされた保険料に係るものを除く。）が特定全額免除期間とみなされたときは、第一項の申出のあつた日の属する月の翌月から、年金額を改定する。\n８　第六項の規定により全額免除対象期間が特定全額免除期間とみなされた者に対する昭和六十年改正法附則第十八条の規定の適用については、同条第一項中「同日以後の国民年金の被保険者期間」とあるのは、「同日以後に同法附則第九条の四の七第六項の規定により保険料免除期間」とする。\n９　厚生労働大臣は、厚生労働省令で、第二項の規定による承認の基準を定めるものとする。\n１０　厚生労働大臣は、前項の厚生労働省令を定め、又は変更しようとするときは、あらかじめ、社会保障審議会に諮問しなければならない。\n１１　前各項に定めるもののほか、第一項の申出の手続その他前各項の規定の適用に関し必要な事項は、政令で定める。"}, {"key": "f9-4-8", "num": [9, 4, 8], "label": "附則第9条の4の8", "caption": "昭和61年3月31日以前の期間についての特定事由に係る申出等", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（昭和61年3月31日以前の期間についての特定事由に係る申出等）\n附則 第9条の4の8　昭和61年3月31日以前の期間について、前条の規定を適用する場合においては、同条第6項中「当該特定手続に係る規定により納付することを要しないものとされた保険料に係る期間」とあるのは「昭和60年改正法第1条の規定による改正前の第5条第4項に規定する保険料免除期間」とするほか、同条の規定の適用に関し必要な事項は、政令で定める。", "bg": "【2014年改正・旧法期間への適用】救済の対象を、基礎年金導入前の期間までどう及ぼすか。2016年施行の事務処理誤り救済は、1986年4月に始まった基礎年金制度より前の国民年金加入期間にも及び得る。そのまま新法の免除区分を適用すると旧法時代の期間区分と一致しないため、1986年3月以前の期間は旧法の「保険料免除期間」に読み替えて救済効果を与える。\n【参考】S04・S10", "deb": "—", "tsu": "—", "kako": "—", "rows": [35], "orig": "（昭和六十一年三月三十一日以前の期間についての特定事由に係る申出等）\n附則 第九条の四の八　昭和六十一年三月三十一日以前の期間について、前条の規定を適用する場合においては、同条第六項中「当該特定手続に係る規定により納付することを要しないものとされた保険料に係る期間」とあるのは「昭和六十年改正法第一条の規定による改正前の第五条第四項に規定する保険料免除期間」とするほか、同条の規定の適用に関し必要な事項は、政令で定める。"}, {"key": "f9-4-9", "num": [9, 4, 9], "label": "附則第9条の4の9", "caption": "特定事由に係る保険料の納付の特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（特定事由に係る保険料の納付の特例）\n附則 第9条の4の9　被保険者又は被保険者であつた者は、次の各号のいずれかに該当する期間（保険料納付済期間を除く。第3項において「対象期間」という。）を有するときは、厚生労働大臣にその旨の申出をすることができる。\n1　特定事由により保険料（第90条の2第1項から第3項までの規定によりその一部の額につき納付することを要しないものとされた保険料にあつてはその一部の額以外の残余の額とし、付加保険料を除く。以下この条において同じ。）を納付することができなくなつたと認められる期間\n2　附則第9条の4の7第3項の規定により特定被保険者期間とみなされた期間\n3　附則第9条の4の7第4項の規定により特定一部免除期間とみなされた期間\n2　厚生労働大臣は、前項の申出（同項第1号に係るものに限る。）に理由があると認めるとき、又は同項の申出（同項第2号又は第3号に係るものに限る。）があつたときは、その申出を承認するものとする。\n3　第1項の申出をした者は、前項の規定による承認を受けたときは、当該承認に係る対象期間の各月につき、当該各月の保険料に相当する額の保険料（以下この条において「特例保険料」という。）を納付することができる。\n4　第1項の申出（同項第1号に係るものに限る。）をした者が特定事由により納付することができなくなつた保険料が、特定保険料その他の政令で定める保険料であるときは、特例保険料の額は、前項の規定にかかわらず、政令で定める額とする。\n5　第3項の規定による特例保険料の納付は、先に経過した月の保険料に係る特例保険料から順次に行うものとする。\n6　第3項の規定により特例保険料の納付が行われたときは、第1項の申出のあつた日に、納付に係る月の保険料が納付されたものとみなす。\n7　老齢基礎年金の受給権者が第3項の規定による特例保険料の納付を行つたときは、第1項の申出のあつた日の属する月の翌月から、年金額を改定する。\n8　第3項の規定により特例保険料を納付した者に対する昭和60年改正法附則第18条の規定の適用については、同条第1項中「同日以後の国民年金の被保険者期間」とあるのは、「同日以後に同法附則第9条の4の9第3項の規定による納付が行われたことにより保険料納付済期間又は保険料免除期間」とする。\n9　附則第9条の4の7第9項及び第10項の規定は、第2項の規定による承認について準用する。\n10　前各項に定めるもののほか、第1項の申出の手続その他前各項の規定の適用に関し必要な事項は、政令で定める。", "bg": "【2014年改正・保険料納付機会の回復】行政の誤りが、本人の保険料納付の機会まで奪ってしまう。その問題に対応するため、年金事務所等の誤処理が原因で通常の納付期限・時効を過ぎた場合、本人には保険料を支払う意思があっても年金額を回復できない。特定事由の承認を受けた対象期間について「特例保険料」を事後納付できる制度を設け、実際の負担に応じて年金記録・年金額を回復させることとした。\n【参考】S04・S10・S16・S20", "deb": "—", "tsu": "—", "kako": "—", "rows": [36], "orig": "（特定事由に係る保険料の納付の特例）\n附則 第九条の四の九　被保険者又は被保険者であつた者は、次の各号のいずれかに該当する期間（保険料納付済期間を除く。第三項において「対象期間」という。）を有するときは、厚生労働大臣にその旨の申出をすることができる。\n一　特定事由により保険料（第九十条の二第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料にあつてはその一部の額以外の残余の額とし、付加保険料を除く。以下この条において同じ。）を納付することができなくなつたと認められる期間\n二　附則第九条の四の七第三項の規定により特定被保険者期間とみなされた期間\n三　附則第九条の四の七第四項の規定により特定一部免除期間とみなされた期間\n２　厚生労働大臣は、前項の申出（同項第一号に係るものに限る。）に理由があると認めるとき、又は同項の申出（同項第二号又は第三号に係るものに限る。）があつたときは、その申出を承認するものとする。\n３　第一項の申出をした者は、前項の規定による承認を受けたときは、当該承認に係る対象期間の各月につき、当該各月の保険料に相当する額の保険料（以下この条において「特例保険料」という。）を納付することができる。\n４　第一項の申出（同項第一号に係るものに限る。）をした者が特定事由により納付することができなくなつた保険料が、特定保険料その他の政令で定める保険料であるときは、特例保険料の額は、前項の規定にかかわらず、政令で定める額とする。\n５　第三項の規定による特例保険料の納付は、先に経過した月の保険料に係る特例保険料から順次に行うものとする。\n６　第三項の規定により特例保険料の納付が行われたときは、第一項の申出のあつた日に、納付に係る月の保険料が納付されたものとみなす。\n７　老齢基礎年金の受給権者が第三項の規定による特例保険料の納付を行つたときは、第一項の申出のあつた日の属する月の翌月から、年金額を改定する。\n８　第三項の規定により特例保険料を納付した者に対する昭和六十年改正法附則第十八条の規定の適用については、同条第一項中「同日以後の国民年金の被保険者期間」とあるのは、「同日以後に同法附則第九条の四の九第三項の規定による納付が行われたことにより保険料納付済期間又は保険料免除期間」とする。\n９　附則第九条の四の七第九項及び第十項の規定は、第二項の規定による承認について準用する。\n１０　前各項に定めるもののほか、第一項の申出の手続その他前各項の規定の適用に関し必要な事項は、政令で定める。"}, {"key": "f9-4-10", "num": [9, 4, 10], "label": "附則第9条の4の10", "caption": "特定事由に係る付加保険料の納付の特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（特定事由に係る付加保険料の納付の特例）\n附則 第9条の4の10　被保険者又は被保険者であつた者は、次の各号のいずれかに該当する期間（付加保険料に係る保険料納付済期間を除く。第3項において「付加対象期間」という。）を有するときは、厚生労働大臣にその旨の申出をすることができる。\n1　特定事由により付加保険料を納付することができなくなつたと認められる期間\n2　附則第9条の4の7第5項の規定により特定付加納付期間とみなされた期間\n2　厚生労働大臣は、前項の申出（同項第1号に係るものに限る。）に理由があると認めるとき、又は同項の申出（同項第2号に係るものに限る。）があつたときは、その申出を承認するものとする。\n3　第1項の申出をした者は、前項の規定による承認を受けたときは、当該承認に係る付加対象期間の各月につき、当該各月の付加保険料に相当する額の保険料（次項及び第6項において「特例付加保険料」という。）を納付することができる。\n4　前項の規定による特例付加保険料の納付は、保険料の納付が行われた月についてのみ行うことができる。\n5　前条第5項から第7項までの規定は、第3項の場合に準用する。\n6　老齢基礎年金の受給権者（付加保険料に係る保険料納付済期間を有する者を除く。）が第3項の規定による特例付加保険料の納付を行つた場合における第43条の規定の適用については、同条中「老齢基礎年金の受給権を取得した」とあるのは、「附則第9条の4の10第1項の規定による申出をした」とする。\n7　附則第9条の4の7第9項及び第10項の規定は、第2項の規定による承認について準用する。\n8　前各項に定めるもののほか、第1項の申出の手続その他前各項の規定の適用に関し必要な事項は、政令で定める。", "bg": "【2014年改正・付加保険料の救済】本人が選んだはずの上乗せ保障を、行政の誤りで失わせないための規定である。付加年金の上乗せを希望していたのに、行政側の事務誤りによって付加保険料を納められなかった場合、通常は事後の納付で権利を回復しにくい。特定事由に限り付加保険料の特例納付を認め、通常保険料との納付関係も調整して、上乗せ給付を選択する機会を救済する。\n【参考】S04・S10・S16", "deb": "—", "tsu": "—", "kako": "—", "rows": [37], "orig": "（特定事由に係る付加保険料の納付の特例）\n附則 第九条の四の十　被保険者又は被保険者であつた者は、次の各号のいずれかに該当する期間（付加保険料に係る保険料納付済期間を除く。第三項において「付加対象期間」という。）を有するときは、厚生労働大臣にその旨の申出をすることができる。\n一　特定事由により付加保険料を納付することができなくなつたと認められる期間\n二　附則第九条の四の七第五項の規定により特定付加納付期間とみなされた期間\n２　厚生労働大臣は、前項の申出（同項第一号に係るものに限る。）に理由があると認めるとき、又は同項の申出（同項第二号に係るものに限る。）があつたときは、その申出を承認するものとする。\n３　第一項の申出をした者は、前項の規定による承認を受けたときは、当該承認に係る付加対象期間の各月につき、当該各月の付加保険料に相当する額の保険料（次項及び第六項において「特例付加保険料」という。）を納付することができる。\n４　前項の規定による特例付加保険料の納付は、保険料の納付が行われた月についてのみ行うことができる。\n５　前条第五項から第七項までの規定は、第三項の場合に準用する。\n６　老齢基礎年金の受給権者（付加保険料に係る保険料納付済期間を有する者を除く。）が第三項の規定による特例付加保険料の納付を行つた場合における第四十三条の規定の適用については、同条中「老齢基礎年金の受給権を取得した」とあるのは、「附則第九条の四の十第一項の規定による申出をした」とする。\n７　附則第九条の四の七第九項及び第十項の規定は、第二項の規定による承認について準用する。\n８　前各項に定めるもののほか、第一項の申出の手続その他前各項の規定の適用に関し必要な事項は、政令で定める。"}, {"key": "f9-4-11", "num": [9, 4, 11], "label": "附則第9条の4の11", "caption": "特定事由に係る保険料の追納の特例", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（特定事由に係る保険料の追納の特例）\n附則 第9条の4の11　被保険者又は被保険者であつた者は、次の各号のいずれかに該当する期間（保険料納付済期間を除く。第3項において「追納対象期間」という。）を有するときは、厚生労働大臣にその旨の申出をすることができる。\n1　特定事由により第94条の規定による追納をすることができなくなつたと認められる期間\n2　附則第9条の4の7第4項の規定により特定一部免除期間とみなされた期間\n3　附則第9条の4の7第6項の規定により特定全額免除期間とみなされた期間\n2　厚生労働大臣は、前項の申出（同項第1号に係るものに限る。）に理由があると認めるとき、又は同項の申出（同項第2号又は第3号に係るものに限る。）があつたときは、その申出を承認するものとする。\n3　第1項の申出をした者は、前項の規定による承認を受けたときは、当該承認に係る追納対象期間の各月の保険料（第89条第1項、第90条第1項又は第90条の3第1項の規定により納付することを要しないものとされた保険料及び第90条の2第1項から第3項までの規定によりその一部の額につき納付することを要しないものとされた保険料に限る。）の全部又は一部につき追納をすることができる。ただし、同条第1項から第3項までの規定によりその一部の額につき納付することを要しないものとされた保険料については、その残余の額につき納付されたときに限る。\n4　前項の規定による追納は、先に経過した月の分の保険料から順次に行うものとする。\n5　第3項の場合において追納すべき額は、当該追納に係る期間の各月の保険料の額に政令で定める額を加算した額とする。\n6　附則第9条の4の9第6項から第8項までの規定は、第3項の場合に準用する。この場合において、必要な読替えは、政令で定める。\n7　附則第9条の4の7第9項及び第10項の規定は、第2項の規定による承認について準用する。\n8　前各項に定めるもののほか、第1項の申出の手続その他前各項の規定の適用に関し必要な事項は、政令で定める。", "bg": "【2014年改正・追納機会の救済】追納の機会を失うことは、将来の年金額にも影響する。全額・一部免除期間等を後で追納すれば老齢基礎年金額を増やせるが、行政の誤処理で追納期限が過ぎると本人の意思に反して不利益が確定する。特定事由により追納できなかった期間などについて、特例の追納を認め、過去の免除期間を納付済期間へ変更できるようにした。\n【参考】S04・S10・S16", "deb": "—", "tsu": "—", "kako": "—", "rows": [38], "orig": "（特定事由に係る保険料の追納の特例）\n附則 第九条の四の十一　被保険者又は被保険者であつた者は、次の各号のいずれかに該当する期間（保険料納付済期間を除く。第三項において「追納対象期間」という。）を有するときは、厚生労働大臣にその旨の申出をすることができる。\n一　特定事由により第九十四条の規定による追納をすることができなくなつたと認められる期間\n二　附則第九条の四の七第四項の規定により特定一部免除期間とみなされた期間\n三　附則第九条の四の七第六項の規定により特定全額免除期間とみなされた期間\n２　厚生労働大臣は、前項の申出（同項第一号に係るものに限る。）に理由があると認めるとき、又は同項の申出（同項第二号又は第三号に係るものに限る。）があつたときは、その申出を承認するものとする。\n３　第一項の申出をした者は、前項の規定による承認を受けたときは、当該承認に係る追納対象期間の各月の保険料（第八十九条第一項、第九十条第一項又は第九十条の三第一項の規定により納付することを要しないものとされた保険料及び第九十条の二第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料に限る。）の全部又は一部につき追納をすることができる。ただし、同条第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料については、その残余の額につき納付されたときに限る。\n４　前項の規定による追納は、先に経過した月の分の保険料から順次に行うものとする。\n５　第三項の場合において追納すべき額は、当該追納に係る期間の各月の保険料の額に政令で定める額を加算した額とする。\n６　附則第九条の四の九第六項から第八項までの規定は、第三項の場合に準用する。この場合において、必要な読替えは、政令で定める。\n７　附則第九条の四の七第九項及び第十項の規定は、第二項の規定による承認について準用する。\n８　前各項に定めるもののほか、第一項の申出の手続その他前各項の規定の適用に関し必要な事項は、政令で定める。"}, {"key": "f9-4-12", "num": [9, 4, 12], "label": "附則第9条の4の12", "caption": "昭和61年3月31日以前の期間についての特定事由に係る保険料の納付等", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（昭和61年3月31日以前の期間についての特定事由に係る保険料の納付等）\n附則 第9条の4の12　昭和61年3月31日以前の期間について、前3条の規定を適用する場合においては、附則第9条の4の9第6項の規定により保険料が納付されたものとみなされた期間は、同条第1項の申出のあつた日以後、昭和60年改正法第1条の規定による改正前の第5条第3項に規定する保険料納付済期間とみなすほか、前3条の規定の適用に関し必要な事項は、政令で定める。", "bg": "【2014年改正・1986年以前との法体系の接続】救済措置を新制度だけに限れば、旧法期間に問題を抱える人が取り残される。事務処理誤りによる特例保険料の納付・追納の対象は、基礎年金創設前の保険料期間にも及び得る。新旧制度では納付済・免除期間の定義や給付計算の接続方法が異なるため、1986年3月以前に係る特例納付の効果を旧法の「保険料納付済期間」へ結び付ける読替えを置いた。\n【参考】S04・S10", "deb": "—", "tsu": "—", "kako": "—", "rows": [39], "orig": "（昭和六十一年三月三十一日以前の期間についての特定事由に係る保険料の納付等）\n附則 第九条の四の十二　昭和六十一年三月三十一日以前の期間について、前三条の規定を適用する場合においては、附則第九条の四の九第六項の規定により保険料が納付されたものとみなされた期間は、同条第一項の申出のあつた日以後、昭和六十年改正法第一条の規定による改正前の第五条第三項に規定する保険料納付済期間とみなすほか、前三条の規定の適用に関し必要な事項は、政令で定める。"}, {"key": "f9-5", "num": [9, 5], "label": "附則第9条の5", "caption": "独立行政法人福祉医療機構による債権の管理及び回収の業務", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（独立行政法人福祉医療機構による債権の管理及び回収の業務）\n附則 第9条の5　政府は、国民年金事業の円滑な実施を図るため、年金積立金管理運用独立行政法人法附則第14条の規定による廃止前の年金福祉事業団の解散及び業務の承継等に関する法律（平成12年法律第20号）第12条第1項に規定する債権の管理及び回収の業務を、当該債権の回収が終了するまでの間、独立行政法人福祉医療機構に行わせるものとする。\n2　政府は、国民年金事業の円滑な実施を図るため、年金制度の機能強化のための国民年金法等の一部を改正する法律（令和2年法律第40号）第28条の規定による改正前の独立行政法人福祉医療機構法（平成14年法律第166号）第12条第1項第12号に規定する小口の資金の貸付けに係る債権の管理及び回収の業務を、令和9年3月31日までの間、独立行政法人福祉医療機構に行わせるものとする。", "bg": "【旧年金福祉事業の整理と2020年改正】組織の再編が済んでも、過去の貸付債権は残る。年金福祉事業団等の事業を再編しても、過去の貸付債権は消滅しないため、独立行政法人福祉医療機構に管理・回収業務を引き継がせる必要があった。年金担保貸付は利用者の困窮を招くとの指摘を受けて2022年3月末で新規受付を終了したが、既存貸付の回収業務は経過的に残るため、その取扱い・期限を本条で定める。\n【参考】S04・S13・S19", "deb": "—", "tsu": "—", "kako": "—", "rows": [40], "orig": "（独立行政法人福祉医療機構による債権の管理及び回収の業務）\n附則 第九条の五　政府は、国民年金事業の円滑な実施を図るため、年金積立金管理運用独立行政法人法附則第十四条の規定による廃止前の年金福祉事業団の解散及び業務の承継等に関する法律（平成十二年法律第二十号）第十二条第一項に規定する債権の管理及び回収の業務を、当該債権の回収が終了するまでの間、独立行政法人福祉医療機構に行わせるものとする。\n２　政府は、国民年金事業の円滑な実施を図るため、年金制度の機能強化のための国民年金法等の一部を改正する法律（令和二年法律第四十号）第二十八条の規定による改正前の独立行政法人福祉医療機構法（平成十四年法律第百六十六号）第十二条第一項第十二号に規定する小口の資金の貸付けに係る債権の管理及び回収の業務を、令和九年三月三十一日までの間、独立行政法人福祉医療機構に行わせるものとする。"}, {"key": "f10", "num": [10], "label": "附則第10条", "caption": "機構への厚生労働大臣の権限に係る事務の委任等", "status": null, "sheet": "附則_国民年金法本法", "scope": "fusoku", "text": "（機構への厚生労働大臣の権限に係る事務の委任等）\n附則 第10条　国民年金法等の一部を改正する法律（平成16年法律第104号）附則第19条その他この法律の改正に伴う経過措置を定める規定であつて厚生労働省令で定めるものによる厚生労働大臣の権限については、日本年金機構法（平成19年法律第109号）附則第20条の規定による改正後の国民年金法（次項において「新国民年金法」という。）第109条の4から第109条の12までの規定の例により、当該権限に係る事務を機構に行わせるものとする。\n2　前項の場合において、新国民年金法第109条の4から第109条の12までの規定の適用についての技術的読替えその他これらの規定の適用に関し必要な事項は、厚生労働省令で定める。", "bg": "【2007年日本年金機構法による運営体制改革】組織の看板が変わっても、国の責任と現場の事務の分担は明確でなければならない。社会保険庁を廃止して日本年金機構へ事務を移管した際、厚生労働大臣に法律上帰属する裁定・保険料関係の権限と、機構が実際に処理する事務を整理する必要があった。2004年改正に伴う経過措置上の権限についても、現行の事務委任・権限分担規定の例によって機構に行わせられるようにした。\n【参考】S04・S14", "deb": "—", "tsu": "—", "kako": "—", "rows": [41], "orig": "（機構への厚生労働大臣の権限に係る事務の委任等）\n附則 第十条　国民年金法等の一部を改正する法律（平成十六年法律第百四号）附則第十九条その他この法律の改正に伴う経過措置を定める規定であつて厚生労働省令で定めるものによる厚生労働大臣の権限については、日本年金機構法（平成十九年法律第百九号）附則第二十条の規定による改正後の国民年金法（次項において「新国民年金法」という。）第百九条の四から第百九条の十二までの規定の例により、当該権限に係る事務を機構に行わせるものとする。\n２　前項の場合において、新国民年金法第百九条の四から第百九条の十二までの規定の適用についての技術的読替えその他これらの規定の適用に関し必要な事項は、厚生労働省令で定める。"}], "sources": [{"t": "第1～10条。学習用欄の転記母本。", "kind": "法令", "what": "国民年金法（厚生労働省掲載法令本文）", "url": "https://www.mhlw.go.jp/web/t_doc?dataId=85001000&dataType=0&pageNo=1", "note": "本文目視転記・機械的全文字照合は未実施", "hits": ["h1", "h2", "h3", "h4", "h4-2", "h4-3", "h5", "h6", "h7", "h8", "h9", "h10"]}, {"t": "公布・改正履歴と施行時点の照合先。", "kind": "法令", "what": "国民年金法（e-Gov・時点指定）", "url": "https://laws.e-gov.go.jp/law/334AC0000000141?occasion_date=20261017", "note": "法令構成・現行性の参照", "hits": [], "general": true}, {"t": "制定の背景、拠出・無拠出併用、被用者年金との関係。", "kind": "立法", "what": "1959年3月3日 参議院社会労働委員会／坂田道太厚生大臣・提案理由", "url": "https://kokkai.ndl.go.jp/simple/txt/103114410X01219590303/3", "note": "提案理由。質疑・答弁と区別", "hits": [], "general": true}, {"t": "社会保険方式、基礎年金額、女性の年金権をめぐる質問。", "kind": "立法", "what": "1984年4月17日 衆議院本会議／河野正議員質問", "url": "https://kokkai.ndl.go.jp/simple/txt/110105254X01819840417/18", "note": "原本発言確認済み", "hits": [], "general": true}, {"t": "直前の河野議員質問への答弁。", "kind": "立法", "what": "1984年4月17日 衆議院本会議／渡部恒三厚生大臣答弁", "url": "https://kokkai.ndl.go.jp/simple/txt/110105254X01819840417/20", "note": "原本発言確認済み", "hits": [], "general": true}, {"t": "基礎年金、3区分、給付体系の説明。", "kind": "通達", "what": "昭和60年7月1日 発年第44号（1985年国民年金法等改正施行）", "url": "https://www.mhlw.go.jp/web/t_doc?dataId=00tb1448&dataType=1&pageNo=1", "note": "通達の存在・該当本文確認。後続改廃の網羅検証は未実施", "hits": [], "general": true}, {"t": "1959年制定、福祉年金・拠出制開始、1985年改正。", "kind": "制度史", "what": "年金制度の仕組みと考え方 第4 公的年金制度の歴史", "url": "https://www.mhlw.go.jp/stf/nenkin_shikumi_04.html", "note": "厚生労働省一次資料", "hits": [], "general": true}, {"t": "財政均衡、少なくとも5年、約100年の財政検証。", "kind": "制度史", "what 4.html", "note": "原典・改正沿革・制度史からの説明。条文ごとの立法動機は資料に裏付けられる範囲で整理。", "hits": [], "general": true}, {"t": "国民年金法本法附則（学習用附則シートB列・該当条文）", "kind": "附則立法背景", "what": "S17｜平成25年5月10日 衆議院本会議 第3号不整合記録問題の政府答弁", "url": "https://kokkai.ndl.go.jp/simple/detail?minId=118305254X02120130510", "note": "原典・改正沿革・制度史からの説明。条文ごとの立法動機は資料に裏付けられる範囲で整理。", "hits": [], "general": true}, {"t": "国民年金法本法附則（学習用附則シートB列・該当条文）", "kind": "附則立法背景", "what": "S18｜平成25年5月17日 衆議院厚生労働委員会 第3号不整合対策の質疑", "url": "https://kokkai.ndl.go.jp/simple/detail?minId=118304260X01220130517", "note": "原典・改正沿革・制度史からの説明。条文ごとの立法動機は資料に裏付けられる範囲で整理。", "hits": [], "general": true}, {"t": "国民年金法本法附則（学習用附則シートB列・該当条文）", "kind": "附則立法背景", "what": "S19｜厚労省 年金担保貸付廃止（2020年制度改正）の説明", "url": "https://www.mhlw.go.jp/content/12500000/001491385.pdf", "note": "原典・改正沿革・制度史からの説明。条文ごとの立法動機は資料に裏付けられる範囲で整理。", "hits": [], "general": true}, {"t": "国民年金法本法附則（学習用附則シートB列・該当条文）", "kind": "附則立法背景", "what": "S20｜厚労省 2014年改正の事務取扱（特定事由の背景）", "url": "https://www.mhlw.go.jp/content/12500000/001536663.pdf", "note": "原典・改正沿革・制度史からの説明。条文ごとの立法動機は資料に裏付けられる範囲で整理。", "hits": [], "general": true}], "extras": [{"title": "正式原文控え", "notes": [], "header": ["条番号", "条文名（XML見出し）", "施行時点", "正式原文（項・号・ただし書を含む）", "資料・照合元"], "rows": [["第一条", "（国民年金制度の目的）", "2026-10-01", "（国民年金制度の目的）\n第一条　国民年金制度は、日本国憲法第二十五条第二項に規定する理念に基き、老齢、障害又は死亡によつて国民生活の安定がそこなわれることを国民の共同連帯によつて防止し、もつて健全な国民生活の維持及び向上に寄与することを目的とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二条", "（国民年金の給付）", "2026-10-01", "（国民年金の給付）\n第二条　国民年金は、前条の目的を達成するため、国民の老齢、障害又は死亡に関して必要な給付を行うものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三条", "（管掌）", "2026-10-01", "（管掌）\n第三条　国民年金事業は、政府が、管掌する。\n２　国民年金事業の事務の一部は、政令の定めるところにより、法律によつて組織された共済組合（以下単に「共済組合」という。）、国家公務員共済組合連合会、全国市町村職員共済組合連合会、地方公務員共済組合連合会又は私立学校教職員共済法（昭和二十八年法律第二百四十五号）\nの規定により私立学校教職員共済制度を管掌することとされた日本私立学校振興・共済事業団（以下「共済組合等」という。）に行わせることができる。\n３　国民年金事業の事務の一部は、政令の定めるところにより、市町村長（特別区の区長を含む。以下同じ。）が行うこととすることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四条", "（年金額の改定）", "2026-10-01", "（年金額の改定）\n第四条　この法律による年金の額は、国民の生活水準その他の諸事情に著しい変動が生じた場合には、変動後の諸事情に応ずるため、速やかに改定の措置が講ぜられなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四条の二", "（財政の均衡）", "2026-10-01", "（財政の均衡）\n第四条の二　国民年金事業の財政は、長期的にその均衡が保たれたものでなければならず、著しくその均衡を失すると見込まれる場合には、速やかに所要の措置が講ぜられなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四条の三", "（財政の現況及び見通しの作成）", "2026-10-01", "（財政の現況及び見通しの作成）\n第四条の三　政府は、少なくとも五年ごとに、保険料及び国庫負担の額並びにこの法律による給付に要する費用の額その他の国民年金事業の財政に係る収支についてその現況及び財政均衡期間における見通し（以下「財政の現況及び見通し」という。）を作成しなければならない。\n２　前項の財政均衡期間（第十六条の二第一項において「財政均衡期間」という。）は、財政の現況及び見通しが作成される年以降おおむね百年間とする。\n３　政府は、第一項の規定により財政の現況及び見通しを作成したときは、遅滞なく、これを公表しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第五条", "（用語の定義）", "2026-10-01", "（用語の定義）\n第五条　この法律において、「保険料納付済期間」とは、第七条第一項第一号に規定する被保険者としての被保険者期間のうち納付された保険料（第九十六条の規定により徴収された保険料を含み、第九十条の二第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料につきその残余の額が納付又は徴収されたものを除く。以下同じ。\n）に係るもの及び第八十八条の二又は第八十八条の三第一項若しくは第二項の規定により納付することを要しないものとされた保険料に係るもの、第七条第一項第二号に規定する被保険者としての被保険者期間並びに同項第三号に規定する被保険者としての被保険者期間を合算した期間をいう。\n２　この法律において、「保険料免除期間」とは、保険料全額免除期間、保険料四分の三免除期間、保険料半額免除期間及び保険料四分の一免除期間を合算した期間をいう。\n３　この法律において、「保険料全額免除期間」とは、第七条第一項第一号に規定する被保険者としての被保険者期間であつて第八十九条第一項、第九十条第一項又は第九十条の三第一項の規定により納付することを要しないものとされた保険料に係るもののうち、第九十四条第四項の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間を\nいう。\n４　この法律において、「保険料四分の三免除期間」とは、第七条第一項第一号に規定する被保険者としての被保険者期間であつて第九十条の二第一項の規定によりその四分の三の額につき納付することを要しないものとされた保険料（納付することを要しないものとされた四分の三の額以外の四分の一の額につき納付されたものに限る。\n）に係るもののうち、第九十四条第四項の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間をいう。\n５　この法律において、「保険料半額免除期間」とは、第七条第一項第一号に規定する被保険者としての被保険者期間であつて第九十条の二第二項の規定によりその半額につき納付することを要しないものとされた保険料（納付することを要しないものとされた半額以外の半額につき納付されたものに限る。\n）に係るもののうち、第九十四条第四項の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間をいう。\n６　この法律において、「保険料四分の一免除期間」とは、第七条第一項第一号に規定する被保険者としての被保険者期間であつて第九十条の二第三項の規定によりその四分の一の額につき納付することを要しないものとされた保険料（納付することを要しないものとされた四分の一の額以外の四分の三の額につき納付されたものに限る。\n）に係るもののうち、第九十四条第四項の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間をいう。\n７　この法律において、「配偶者」、「夫」及び「妻」には、婚姻の届出をしていないが、事実上婚姻関係と同様の事情にある者を含むものとする。\n８　この法律において、「政府及び実施機関」とは、厚生年金保険の実施者たる政府及び実施機関たる共済組合等をいう。\n９　この法律において、「実施機関たる共済組合等」とは、厚生年金保険の実施機関たる国家公務員共済組合連合会、地方公務員共済組合連合会又は日本私立学校振興・共済事業団をいう。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第六条", "（事務の区分）", "2026-10-01", "（事務の区分）\n第六条　第十二条第一項及び第四項（第百五条第二項において準用する場合を含む。）並びに第百五条第一項及び第四項の規定により市町村が処理することとされている事務は、地方自治法（昭和二十二年法律第六十七号）第二条第九項第一号に規定する第一号法定受託事務とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七条", "（被保険者の資格）", "2026-10-01", "（被保険者の資格）\n第七条　次の各号のいずれかに該当する者は、国民年金の被保険者とする。\n一　日本国内に住所を有する二十歳以上六十歳未満の者であつて次号及び第三号のいずれにも該当しないもの（厚生年金保険法（昭和二十九年法律第百十五号）に基づく老齢を支給事由とする年金たる保険給付その他の老齢又は退職を支給事由とする給付であつて政令で定めるもの（以下「厚生年金保険法に基づく老齢給付等」という。\n）を受けることができる者その他この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。以下「第一号被保険者」という。）\n二　厚生年金保険の被保険者（以下「第二号被保険者」という。）\n三　第二号被保険者の配偶者（日本国内に住所を有する者又は外国において留学をする学生その他の日本国内に住所を有しないが渡航目的その他の事情を考慮して日本国内に生活の基礎があると認められる者として厚生労働省令で定める者に限る。）であつて主として第二号被保険者の収入により生計を維持するもの（第二号被保険者である者その他この法律の適用を除外すべき特別\nの理由がある者として厚生労働省令で定める者を除く。以下「被扶養配偶者」という。）のうち二十歳以上六十歳未満のもの（以下「第三号被保険者」という。）\n２　前項第三号の規定の適用上、主として第二号被保険者の収入により生計を維持することの認定に関し必要な事項は、政令で定める。\n３　前項の認定については、行政手続法（平成五年法律第八十八号）第三章（第十二条及び第十四条を除く。）の規定は、適用しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第八条", "（資格取得の時期）", "2026-10-01", "（資格取得の時期）\n第八条　前条の規定による被保険者は、同条第一項第二号及び第三号のいずれにも該当しない者については第一号から第三号までのいずれかに該当するに至つた日に、二十歳未満の者又は六十歳以上の者については第四号に該当するに至つた日に、その他の者については同号又は第五号のいずれかに該当するに至つた日に、それぞれ被保険者の資格を取得する。\n一　二十歳に達したとき。\n二　日本国内に住所を有するに至つたとき。\n三　厚生年金保険法に基づく老齢給付等を受けることができる者その他この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者でなくなつたとき。\n四　厚生年金保険の被保険者の資格を取得したとき。\n五　被扶養配偶者となつたとき。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条", "（資格喪失の時期）", "2026-10-01", "（資格喪失の時期）\n第九条　第七条の規定による被保険者は、次の各号のいずれかに該当するに至つた日の翌日（第二号に該当するに至つた日に更に第七条第一項第二号若しくは第三号に該当するに至つたとき又は第三号から第五号までのいずれかに該当するに至つたとき（第四号については、厚生年金保険法に基づく老齢給付等を受けることができる者となつたときに限る。\n）は、その日）に、被保険者の資格を喪失する。\n一　死亡したとき。\n二　日本国内に住所を有しなくなつたとき（第七条第一項第二号又は第三号に該当するときを除く。）。\n三　六十歳に達したとき（第七条第一項第二号に該当するときを除く。）。\n四　厚生年金保険法に基づく老齢給付等を受けることができる者その他この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者となつたとき（第七条第一項第二号又は第三号に該当するときを除く。）。\n五　厚生年金保険の被保険者の資格を喪失したとき（第七条第一項各号のいずれかに該当するときを除く。）。\n六　被扶養配偶者でなくなつたとき（第七条第一項第一号又は第二号に該当するときを除く。）。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十条", "—", "2026-10-01", "第十条　削除", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十一条", "（被保険者期間の計算）", "2026-10-01", "（被保険者期間の計算）\n第十一条　被保険者期間を計算する場合には、月によるものとし、被保険者の資格を取得した日の属する月からその資格を喪失した日の属する月の前月までをこれに算入する。\n２　被保険者がその資格を取得した日の属する月にその資格を喪失したときは、その月を一箇月として被保険者期間に算入する。ただし、その月にさらに被保険者の資格を取得したときは、この限りでない。\n３　被保険者の資格を喪失した後、さらにその資格を取得した者については、前後の被保険者期間を合算する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十一条の二", "—", "2026-10-01", "第十一条の二　第一号被保険者としての被保険者期間、第二号被保険者としての被保険者期間又は第三号被保険者としての被保険者期間を計算する場合には、被保険者の種別（第一号被保険者、第二号被保険者又は第三号被保険者のいずれであるかの区別をいう。以下同じ。）に変更があつた月は、変更後の種別の被保険者であつた月とみなす。\n同一の月において、二回以上にわたり被保険者の種別に変更があつたときは、その月は最後の種別の被保険者であつた月とみなす。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十二条", "（届出）", "2026-10-01", "（届出）\n第十二条　被保険者（第三号被保険者を除く。次項において同じ。）は、厚生労働省令の定めるところにより、その資格の取得及び喪失並びに種別の変更に関する事項並びに氏名及び住所の変更に関する事項を市町村長に届け出なければならない。\n２　被保険者の属する世帯の世帯主（以下単に「世帯主」という。）は、被保険者に代つて、前項の届出をすることができる。\n３　住民基本台帳法（昭和四十二年法律第八十一号）第二十二条から第二十四条まで、第三十条の四十六又は第三十条の四十七の規定による届出があつたとき（当該届出に係る書面に同法第二十九条の規定による付記がされたときに限る。）は、その届出と同一の事由に基づく第一項の規定による届出があつたものとみなす。\n４　市町村長は、第一項又は第二項の規定による届出を受理したとき（氏名及び住所の変更に関する事項の届出であつて厚生労働省令で定めるものを受理したときを除く。）は、厚生労働省令の定めるところにより、厚生労働大臣にこれを報告しなければならない。\n５　第三号被保険者は、厚生労働省令の定めるところにより、その資格の取得及び喪失並びに種別の変更に関する事項並びに氏名及び住所の変更に関する事項を厚生労働大臣に届け出なければならない。ただし、氏名及び住所の変更に関する事項であつて厚生労働省令で定めるものについては、この限りでない。\n６　前項の届出は、厚生労働省令で定める場合を除き、厚生年金保険法第二条の五第一項第一号に規定する第一号厚生年金被保険者（以下「第一号厚生年金被保険者」という。）である第二号被保険者の被扶養配偶者である第三号被保険者にあつては、その配偶者である第二号被保険者を使用する事業主を経由して行うものとし、\n同項第二号に規定する第二号厚生年金被保険者（以下「第二号厚生年金被保険者」という。）、同項第三号に規定する第三号厚生年金被保険者（以下「第三号厚生年金被保険者」という。）又は同項第四号に規定する第四号厚生年金被保険者（以下「第四号厚生年金被保険者」という。\n）である第二号被保険者の被扶養配偶者である第三号被保険者にあつては、その配偶者である第二号被保険者を組合員又は加入者とする国家公務員共済組合、地方公務員共済組合又は日本私立学校振興・共済事業団を経由して行うものとする。\n７　前項に規定する第二号被保険者を使用する事業主とは、第一号厚生年金被保険者である第二号被保険者を使用する事業所（厚生年金保険法第六条第一項に規定する事業所をいう。）の事業主（同法第二十七条に規定する事業主をいう。第百八条第三項において同じ。）をいう。\n８　第六項に規定する第二号被保険者を使用する事業主は、同項の経由に係る事務の一部を当該事業主が設立する健康保険組合に委託することができる。\n９　第六項の規定により、第五項の届出が第二号被保険者を使用する事業主又は国家公務員共済組合、地方公務員共済組合若しくは日本私立学校振興・共済事業団に受理されたときは、その受理されたときに厚生労働大臣に届出があつたものとみなす。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十二条の二", "—", "2026-10-01", "第十二条の二　第三号被保険者であつた者は、第二号被保険者の被扶養配偶者でなくなつたことについて、厚生労働省令の定めるところにより、その旨を厚生労働大臣に届け出なければならない。\n２　前条第六項から第九項までの規定は、前項の届出について準用する。この場合において、必要な技術的読替えは、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十三条", "—", "2026-10-01", "第十三条　削除", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十四条", "（国民年金原簿）", "2026-10-01", "（国民年金原簿）\n第十四条　厚生労働大臣は、国民年金原簿を備え、これに被保険者の氏名、資格の取得及び喪失、種別の変更、保険料の納付状況、基礎年金番号（政府管掌年金事業（政府が管掌する国民年金事業及び厚生年金保険事業をいう。）の運営に関する事務その他当該事業に関連する事務であつて厚生労働省令で定めるものを遂行するために用いる記号及び番号であつて厚生労働省令で定めるもの\nをいう。）その他厚生労働省令で定める事項を記録するものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十四条の二", "（訂正の請求）", "2026-10-01", "（訂正の請求）\n第十四条の二　被保険者又は被保険者であつた者は、国民年金原簿に記録された自己に係る特定国民年金原簿記録（被保険者の資格の取得及び喪失、種別の変更、保険料の納付状況その他厚生労働省令で定める事項の内容をいう。以下この項において同じ。）が事実でない、又は国民年金原簿に自己に係る特定国民年金原簿記録が記録されていないと思料するときは、\n厚生労働省令で定めるところにより、厚生労働大臣に対し、国民年金原簿の訂正の請求をすることができる。\n２　前項の規定は、被保険者又は被保険者であつた者が死亡した場合において、次の表の上欄に掲げる者について準用する。この場合において、同項中「自己」とあるのは、同表の上欄に掲げる者の区分に応じ、同表の下欄に掲げる字句に読み替えるものとする。\n第十九条の規定により未支給の年金の支給を請求することができる者\n死亡した年金給付の受給権者\n遺族基礎年金を受けることができる配偶者又は子\n死亡した被保険者又は被保険者であつた者\n寡婦年金を受けることができる妻\n死亡した夫\n死亡一時金を受けることができる遺族\n死亡した被保険者又は被保険者であつた者", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十四条の三", "（訂正に関する方針）", "2026-10-01", "（訂正に関する方針）\n第十四条の三　厚生労働大臣は、前条第一項（同条第二項において準用する場合を含む。）の規定による請求（次条において「訂正請求」という。）に係る国民年金原簿の訂正に関する方針を定めなければならない。\n２　厚生労働大臣は、前項の方針を定め、又は変更しようとするときは、あらかじめ、社会保障審議会に諮問しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000
