あつては、二分の一）を超えない範囲内については、代議員会において、基金の業務の適正な運営に必要な学識経験を有する者のうちから選挙することができる。\n３　設立当時の理事は、創立総会において、第百十九条の二第五項の設立の同意を申し出た者のうちから選挙する。ただし、理事の定数の三分の一を超えない範囲内については、年金に関する学識経験を有する者のうちから選挙することができる。\n４　理事のうち一人を理事長とし、理事が選挙する。\n５　監事は、代議員会において、学識経験を有する者及び代議員のうちから、それぞれ一人を選挙する。\n６　設立当時の監事は、創立総会において、学識経験を有する者及び第百十九条の二第五項の設立の同意を申し出た者のうちから、それぞれ一人を選挙する。\n７　役員の任期は、三年を超えない範囲内で規約で定める期間とする。ただし、補欠の役員の任期は、前任者の残任期間とする。\n８　役員は、その任期が満了しても、後任の役員が就任するまでの間は、なお、その職務を行う。\n９　監事は、理事又は基金の職員と兼ねることができない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十五条", "（役員の職務）", "2026-10-01", "（役員の職務）\n第百二十五条　理事長は、基金を代表し、その業務を執行する。理事長に事故があるとき、又は理事長が欠けたときは、理事のうちから、あらかじめ理事長が指定する者がその職務を代理し、又はその職務を行なう。\n２　基金の業務は、規約に別段の定めがある場合を除くほか、理事の過半数により決し、可否同数のときは、理事長の決するところによる。\n３　理事は、理事長の定めるところにより、理事長を補佐して、年金及び一時金に充てるべき積立金（以下「積立金」という。）の管理及び運用に関する基金の業務を執行することができる。\n４　監事は、基金の業務を監査する。\n５　監事は、監査の結果に基づき、必要があると認めるときは、理事長又は代議員会に意見を提出することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十五条の二", "（理事の義務及び損害賠償責任）", "2026-10-01", "（理事の義務及び損害賠償責任）\n第百二十五条の二　理事は、前条第三項に規定する基金の業務について、法令、法令に基づいてする厚生労働大臣の処分、規約及び代議員会の議決を遵守し、基金のため忠実にその職務を遂行しなければならない。\n２　理事が前条第三項に規定する基金の業務についてその任務を怠つたときは、その理事は、基金に対し連帯して損害賠償の責めに任ずる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十五条の三", "（理事の禁止行為等）", "2026-10-01", "（理事の禁止行為等）\n第百二十五条の三　理事は、自己又は当該基金以外の第三者の利益を図る目的をもつて、積立金の管理及び運用の適正を害するものとして厚生労働省令で定める行為をしてはならない。\n２　基金は、前項の規定に違反した理事を、規約の定めるところにより、代議員会の議決を経て、交代させることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十五条の四", "（理事長の代表権の制限）", "2026-10-01", "（理事長の代表権の制限）\n第百二十五条の四　基金と理事長（第百二十五条第一項の規定により理事長の職務を代理し、又はその職務を行う者を含む。以下この条において同じ。）との利益が相反する事項については、理事長は、代表権を有しない。この場合においては、学識経験を有する者のうちから選任された監事が基金を代表する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十六条", "（基金の役員及び職員の公務員たる性質）", "2026-10-01", "（基金の役員及び職員の公務員たる性質）\n第百二十六条　基金の役員及び基金に使用され、その事務に従事する者は、刑法その他の罰則の適用については、法令により公務に従事する職員とみなす。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十七条", "（加入員）", "2026-10-01", "（加入員）\n第百二十七条　第一号被保険者は、その者が住所を有する地区に係る地域型基金又はその従事する事業若しくは業務に係る職能型基金に申し出て、その加入員となることができる。ただし、他の基金の加入員であるときは、この限りでない。\n２　前項の申出をした者は、その申出をした日に加入員の資格を取得するものとする。\n３　加入員は、次の各号のいずれかに該当するに至つた日の翌日（第一号又は第四号に該当するに至つたときは、その日とし、第三号に該当するに至つたときは、当該保険料を納付することを要しないものとされた月の初日とする。）に、加入員の資格を喪失する。\n一　被保険者の資格を喪失したとき、又は第二号被保険者若しくは第三号被保険者となつたとき。\n二　地域型基金の加入員にあつては、当該基金の地区内に住所を有する者でなくなつたとき、職能型基金の加入員にあつては、当該事業又は業務に従事する者でなくなつたとき。\n三　第八十九条第一項、第九十条第一項又は第九十条の三第一項の規定により保険料を納付することを要しないものとされたとき及び第九十条の二第一項から第三項までの規定によりその一部の額につき保険料を納付することを要しないものとされたとき。\n四　農業者年金の被保険者となつたとき。\n五　当該基金が解散したとき。\n４　加入員の資格を取得した月にその資格を喪失した者は、その資格を取得した日にさかのぼつて、加入員でなかつたものとみなす。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十七条の二", "（準用規定）", "2026-10-01", "（準用規定）\n第百二十七条の二　第十二条第一項の規定は、加入員について、同条第二項の規定は、加入員の属する世帯の世帯主について準用する。この場合において、同条第一項中「市町村長」とあるのは「基金」と、同条第二項中「被保険者」とあるのは「加入員」と読み替えるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十八条", "（基金の業務）", "2026-10-01", "（基金の業務）\n第百二十八条　基金は、加入員又は加入員であつた者に対し、年金の支給を行ない、あわせて加入員又は加入員であつた者の死亡に関し、一時金の支給を行なうものとする。\n２　基金は、加入員及び加入員であつた者の福祉を増進するため、必要な施設をすることができる。\n３　基金は、信託会社（信託業法（平成十六年法律第百五十四号）第三条又は第五十三条第一項の免許を受けたものに限る。以下同じ。）、信託業務を営む金融機関（金融機関の信託業務の兼営等に関する法律（昭和十八年法律第四十三号）第一条第一項の認可を受けた金融機関をいう。以下同じ。\n）、生命保険会社、農業協同組合連合会（全国を地区とし、農業協同組合法（昭和二十二年法律第百三十二号）第十条第一項第十号の事業を行うものに限る。以下同じ。）若しくは共済水産業協同組合連合会（全国を地区とするものに限る。以下同じ。）又は金融商品取引業者（金融商品取引法（昭和二十三年法律第二十五号）第二条第九項に規定する金融商品取引業者をいう。\n以下同じ。）と、当該基金が支給する年金又は一時金に要する費用に関して信託、保険若しくは共済の契約又は投資一任契約（同条第八項第十二号ロに規定する契約をいう。以下同じ。）を締結するときは、政令の定めるところによらなければならない。\n４　信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会若しくは共済水産業協同組合連合会又は金融商品取引業者は、正当な理由がある場合を除き、前項に規定する契約（運用方法を特定する信託の契約であつて、政令で定めるものを除く。）の締結を拒絶してはならない。\n５　基金は、政令で定めるところにより、厚生労働大臣の認可を受けて、その業務（加入員又は加入員であつた者に年金又は一時金の支給を行うために必要となるその者に関する情報の収集、整理又は分析を含む。）の一部を信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会、共済水産業協同組合連合会、\n国民年金基金連合会その他の法人に委託することができる。\n６　銀行その他の政令で定める金融機関は、他の法律の規定にかかわらず、前項の業務（第百二十七条第一項の申出の受理に関する業務に限る。）を受託することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十八条の二", "（年金数理）", "2026-10-01", "（年金数理）\n第百二十八条の二　基金は、適正な年金数理に基づいてその業務を行わなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十九条", "（基金の給付の基準）", "2026-10-01", "（基金の給付の基準）\n第百二十九条　基金が支給する年金は、少なくとも、当該基金の加入員であつた者が老齢基礎年金の受給権を取得したときには、その者に支給されるものでなければならない。\n２　老齢基礎年金の受給権者に対し基金が支給する年金は、当該老齢基礎年金の受給権の消滅事由以外の事由によつて、その受給権を消滅させるものであつてはならない。\n３　基金が支給する一時金は、少なくとも、当該基金の加入員又は加入員であつた者が死亡した場合において、その遺族が死亡一時金を受けたときには、その遺族に支給されるものでなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十条", "—", "2026-10-01", "第百三十条　基金が支給する年金は、政令の定めるところにより、その額が算定されるものでなければならない。\n２　老齢基礎年金の受給権者に対し基金が支給する年金の額は、二百円（第二十八条又は附則第九条の二若しくは第九条の二の二の規定による老齢基礎年金の受給権者に対し基金が支給する年金については、政令で定める額。以下同じ。）に納付された掛金に係る当該基金の加入員であつた期間（第八十七条の規定による保険料に係る保険料納付済期間である期間に限る。\n以下「加入員期間」という。）の月数を乗じて得た額を超えるものでなければならない。\n３　基金が支給する一時金の額は、八千五百円を超えるものでなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十一条", "—", "2026-10-01", "第百三十一条　老齢基礎年金の受給権者に対し基金が支給する年金は、当該老齢基礎年金がその全額につき支給を停止されている場合を除いては、その支給を停止することができない。ただし、当該年金の額のうち、二百円に当該基金に係る加入員期間の月数を乗じて得た額を超える部分については、この限りでない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十一条の二", "（積立金の積立て）", "2026-10-01", "（積立金の積立て）\n第百三十一条の二　基金は、政令の定めるところにより、積立金を積み立てなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十二条", "（資金の運用等）", "2026-10-01", "（資金の運用等）\n第百三十二条　基金の積立金の運用は、政令の定めるところにより、安全かつ効率的にしなければならない。\n２　基金の業務上の余裕金の運用は、政令の定めるところにより、基金の業務の目的及び資金の性質に応じ、安全かつ効率的にしなければならない。\n３　基金は、事業年度その他その財務に関しては、前条及び前二項の規定によるほか、政令の定めるところによらなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十三条", "（準用規定）", "2026-10-01", "（準用規定）\n第百三十三条　第十六条及び第二十四条の規定は、基金が支給する年金及び一時金を受ける権利について、第十八条第一項及び第二項並びに第十九条第一項及び第三項から第五項までの規定は、基金が支給する年金について、第二十一条の二の規定は、基金が支給する年金及び一時金について、第二十二条及び第二十三条の規定は、基金について、第二十五条、\n第七十条後段及び第七十一条第一項の規定は、基金が支給する一時金について準用する。この場合において、第十六条中「厚生労働大臣」とあるのは「基金」と、第二十一条の二中「支払うべき年金給付」とあるのは「支払うべき一時金」と、「年金給付の支払金」とあるのは「一時金の支払金」と、第二十四条中「老齢基礎年金」とあるのは「基金が支給する年金」と、\n第七十一条第一項中「被保険者又は被保険者であつた者」とあるのは「加入員又は加入員であつた者」と読み替えるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十四条", "（掛金）", "2026-10-01", "（掛金）\n第百三十四条　基金は、基金が支給する年金及び一時金に関する事業に要する費用に充てるため、掛金を徴収する。\n２　掛金は、年金の額の計算の基礎となる各月につき、徴収するものとする。\n３　掛金は、政令の定めるところにより、その額が算定されるものでなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十四条の二", "（準用規定）", "2026-10-01", "（準用規定）\n第百三十四条の二　第八十八条の規定は、加入員について、第九十五条、第九十六条第一項から第五項まで、第九十七条及び第九十八条の規定は、掛金及び第百三十三条において準用する第二十三条の規定による徴収金について準用する。この場合において、第八十八条及び第九十七条第一項中「保険料」とあるのは「掛金」と、第九十六条第一項、第二項、\n第四項及び第五項並びに第九十七条第一項中「厚生労働大臣」とあるのは「基金」と、「前条第一項」とあるのは「第百三十四条の二において準用する前条第一項」と読み替えるものとする。\n２　基金は、前項において準用する第九十六条第四項の規定により国税滞納処分の例により処分をしようとするときは、厚生労働大臣の認可を受けなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十五条", "（解散）", "2026-10-01", "（解散）\n第百三十五条　基金は、次に掲げる理由により解散する。\n一　代議員の定数の四分の三以上の多数による代議員会の議決\n二　基金の事業の継続の不能\n三　第百四十二条第五項の規定による解散の命令\n２　基金は、前項第一号又は第二号に掲げる理由により解散しようとするときは、厚生労働大臣の認可を受けなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十六条", "（基金の解散による年金等の支給に関する義務の消滅）", "2026-10-01", "（基金の解散による年金等の支給に関する義務の消滅）\n第百三十六条　基金は、解散したときは、当該基金の加入員であつた者に係る年金及び一時金の支給に関する義務を免れる。ただし、解散した日までに支給すべきであつた年金又は一時金でまだ支給していないものの支給に関する義務については、この限りでない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十六条の二", "（清算中の基金の能力）", "2026-10-01", "（清算中の基金の能力）\n第百三十六条の二　解散した基金は、清算の目的の範囲内において、その清算の結了に至るまではなお存続するものとみなす。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条", "（清算人等）", "2026-10-01", "（清算人等）\n第百三十七条　基金が第百三十五条第一項第一号又は第二号の規定により解散したときは、理事が、その清算人となる。ただし、代議員会において他人を選任したときは、この限りでない。\n２　次に掲げる場合には、厚生労働大臣が清算人を選任する。\n一　前項の規定により清算人となる者がないとき。\n二　基金が第百三十五条第一項第三号の規定により解散したとき。\n三　清算人が欠けたため損害を生ずるおそれがあるとき。\n３　前項の場合において、清算人の職務の執行に要する費用は、基金が負担する。\n４　解散した基金の残余財産は、規約の定めるところにより、その解散した日において当該基金が年金の支給に関する義務を負つていた者（以下「解散基金加入員」という。）に分配しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の二", "（清算人の職務及び権限）", "2026-10-01", "（清算人の職務及び権限）\n第百三十七条の二　清算人の職務は、次のとおりとする。\n一　現務の結了\n二　債権の取立て及び債務の弁済\n三　残余財産の分配\n２　清算人は、前項各号に掲げる職務を行うために必要な一切の行為をすることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の二の二", "（債権の申出の催告等）", "2026-10-01", "（債権の申出の催告等）\n第百三十七条の二の二　清算人は、その就職の日から二箇月以内に、少なくとも三回の公告をもつて、債権者に対し、一定の期間内にその債権の申出をすべき旨の催告をしなければならない。この場合において、その期間は、二箇月を下ることができない。\n２　前項の公告には、債権者がその期間内に申出をしないときは清算から除斥されるべき旨を付記しなければならない。ただし、清算人は、知れている債権者を除斥することができない。\n３　清算人は、知れている債権者には、各別にその申出の催告をしなければならない。\n４　第一項の公告は、官報に掲載してする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の二の三", "（期間経過後の債権の申出）", "2026-10-01", "（期間経過後の債権の申出）\n第百三十七条の二の三　前条第一項の期間の経過後に申出をした債権者は、基金の債務が完済された後まだ権利の帰属すべき者に引き渡されていない財産に対してのみ、請求をすることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の二の四", "（準用規定等）", "2026-10-01", "（準用規定等）\n第百三十七条の二の四　第百二十六条の規定は、基金の清算人について準用する。\n２　この款に定めるもののほか、解散した基金の清算に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三", "—", "2026-10-01", "第百三十七条の三　基金は、厚生労働大臣の認可を受けて、他の基金と吸収合併（基金が他の基金とする合併であつて、合併により消滅する基金の権利義務の全部を合併後存続する基金に承継させるものをいう。以下この目において同じ。）をすることができる。ただし、地域型基金と職能型基金との吸収合併については、\nその地区が全国である地域型基金が次条に規定する吸収合併存続基金となる場合を除き、これをすることができない。\n２　合併をする基金は、吸収合併契約を締結しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の二", "—", "2026-10-01", "第百三十七条の三の二　基金が吸収合併をする場合には、吸収合併契約において、吸収合併後存続する基金（第百三十七条の三の六及び第百三十七条の三の十五第一項において「吸収合併存続基金」という。）及び吸収合併により消滅する基金（第百三十七条の三の六及び同項において「吸収合併消滅基金」という。\n）の名称及び主たる事務所の所在地その他厚生労働省令で定める事項を定めなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の三", "—", "2026-10-01", "第百三十七条の三の三　基金は、吸収合併契約について代議員会において代議員の定数の三分の二以上の多数により議決しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の四", "—", "2026-10-01", "第百三十七条の三の四　基金は、前条の代議員会の議決があつたときは、その議決があつた日（次項において「議決日」という。）から二週間以内に、財産目録及び貸借対照表を作成しなければならない。\n２　基金は、議決日から第百三十七条の三第一項の認可を受ける日までの間、前項の規定により作成した財産目録及び貸借対照表を主たる事務所に備え置き、その債権者から請求があつたときは、厚生労働省令で定めるところにより、これを閲覧に供しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の五", "—", "2026-10-01", "第百三十七条の三の五　基金は、前条第一項の期間内に、その債権者に対し、異議があれば一定の期間内に述べるべき旨を公告し、かつ、知れている債権者に対しては、各別にこれを催告しなければならない。ただし、その期間は、二月を下ることができない。\n２　債権者が前項の期間内に吸収合併に対して異議を述べなかつたときは、吸収合併を承認したものとみなす。\n３　債権者が異議を述べたときは、基金は、これに弁済をし、若しくは相当の担保を提供し、又はその債権者に弁済を受けさせることを目的として信託会社若しくは信託業務を営む金融機関に相当の財産を信託しなければならない。ただし、吸収合併をしてもその債権者を害するおそれがないときは、この限りでない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の六", "—", "2026-10-01", "第百三十七条の三の六　吸収合併存続基金は、第百三十七条の三第一項の認可を受けた日に、吸収合併消滅基金の権利義務を承継する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の七", "—", "2026-10-01", "第百三十七条の三の七　基金は、職能型基金が、その事業に関して有する権利義務であつて次項に規定する吸収分割承継基金となる地域型基金の地区に係るものを当該地域型基金に承継させる場合に限り、厚生労働大臣の認可を受けて、吸収分割（基金がその事業に関して有する権利義務の全部又は一部を分割後他の基金に承継させることをいう。以下同じ。）をすることができる。\n２　吸収分割をする基金（以下「吸収分割基金」という。）は、当該基金がその事業に関して有する権利義務の全部又は一部を当該基金から承継する基金（以下「吸収分割承継基金」という。）との間で、吸収分割契約を締結しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の八", "—", "2026-10-01", "第百三十七条の三の八　基金が吸収分割をする場合には、吸収分割契約において、次に掲げる事項を定めなければならない。\n一　吸収分割基金及び吸収分割承継基金の名称及び主たる事務所の所在地\n二　吸収分割承継基金が吸収分割により吸収分割基金から承継する資産、債務、雇用契約その他の権利義務に関する事項\n三　前二号に掲げる事項のほか、厚生労働省令で定める事項", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の九", "—", "2026-10-01", "第百三十七条の三の九　基金は、吸収分割契約について代議員会において代議員の定数の三分の二以上の多数により議決しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の十", "—", "2026-10-01", "第百三十七条の三の十　基金は、前条の代議員会の議決があつたときは、その議決があつた日（次項において「議決日」という。）から二週間以内に、財産目録及び貸借対照表を作成しなければならない。\n２　基金は、議決日から第百三十七条の三の七第一項の認可を受ける日までの間、前項の規定により作成した財産目録及び貸借対照表を主たる事務所に備え置き、その債権者から請求があつたときは、厚生労働省令で定めるところにより、これを閲覧に供しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の十一", "—", "2026-10-01", "第百三十七条の三の十一　基金は、前条第一項の期間内に、その債権者に対し、異議があれば一定の期間内に述べるべき旨を公告し、かつ、知れている債権者に対しては、各別にこれを催告しなければならない。ただし、その期間は、二月を下ることができない。\n２　債権者が前項の期間内に吸収分割に対して異議を述べなかつたときは、吸収分割を承認したものとみなす。\n３　債権者が異議を述べたときは、基金は、これに弁済をし、若しくは相当の担保を提供し、又はその債権者に弁済を受けさせることを目的として信託会社若しくは信託業務を営む金融機関に相当の財産を信託しなければならない。ただし、吸収分割をしてもその債権者を害するおそれがないときは、この限りでない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の十二", "—", "2026-10-01", "第百三十七条の三の十二　吸収分割承継基金は、吸収分割契約の定めに従い、第百三十七条の三の七第一項の認可を受けた日に、吸収分割基金の権利義務を承継する。\n２　前項の規定にかかわらず、吸収分割基金の債権者であつて、前条第一項の規定による各別の催告を受けなかつたものは、吸収分割契約において吸収分割後に吸収分割基金に対して債務の履行を請求することができないものとされている場合であつても、吸収分割基金に対して、吸収分割基金が第百三十七条の三の七第一項の認可を受けた日に有していた財産の価額を限度として、\n当該債務の履行を請求することができる。\n３　第一項の規定にかかわらず、吸収分割基金の債権者であつて、前条第一項の規定による各別の催告を受けなかつたものは、吸収分割契約において吸収分割後に吸収分割承継基金に対して債務の履行を請求することができないものとされている場合であつても、吸収分割承継基金に対して、その承継した財産の価額を限度として、当該債務の履行を請求することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の十三", "—", "2026-10-01", "第百三十七条の三の十三　会社分割に伴う労働契約の承継等に関する法律（平成十二年法律第百三号）第二条から第八条まで（第二条第三項各号及び第四条第三項各号を除く。）及び商法等の一部を改正する法律（平成十二年法律第九十号）附則第五条第一項の規定は、前目の規定により吸収分割基金が吸収分割をする場合について準用する。\nこの場合において、会社分割に伴う労働契約の承継等に関する法律第二条第一項及び第二項中「承継会社等」とあるのは「承継基金」と、同項中「分割会社」とあるのは「分割基金」と、同条第三項中「次の各号に掲げる場合に応じ、当該各号に定める」とあるのは「国民年金法（昭和三十四年法律第百四十一号）第百三十七条の三の十第一項に規定する議決日から起算して、\n二週間を経過する」と、同法第三条から第八条まで（第四条第三項を除く。）の規定中「分割会社」とあるのは「分割基金」と、「承継会社等」とあるのは「承継基金」と、同法第四条第三項中「次の各号に掲げる場合に応じ、当該各号に」とあるのは「国民年金法第百三十七条の三の七第一項の認可を受ける日の前日までの日で分割基金が」と読み替えるものとするほか、\n必要な技術的読替えは、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の十四", "—", "2026-10-01", "第百三十七条の三の十四　民法第三百九十八条の九第三項から第五項まで並びに第三百九十八条の十第一項及び第二項並びに事業性融資の推進等に関する法律（令和六年法律第五十二号）第二十六条第一項の規定は、前目の規定により吸収分割基金が吸収分割をする場合について準用する。この場合において、民法第三百九十八条の九第三項中「前二項」とあるのは、\n「国民年金法（昭和三十四年法律第百四十一号）第百三十七条の三の十四において準用する次条第一項又は第二項」と読み替えるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の十五", "—", "2026-10-01", "第百三十七条の三の十五　吸収合併存続基金が、第百三十七条の三の六の規定により権利義務を承継したときは、吸収合併存続基金に年金の支給に関する義務が承継された者の吸収合併消滅基金の加入員期間は、吸収合併存続基金の加入員期間とみなす。\n２　吸収分割承継基金が、第百三十七条の三の十二第一項の規定により権利義務を承継したときは、吸収分割承継基金に年金の支給に関する義務が承継された者の吸収分割基金の加入員期間は、吸収分割承継基金の加入員期間とみなす。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の三の十六", "—", "2026-10-01", "第百三十七条の三の十六　この款に定めるもののほか、基金の合併及び分割に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の四", "（連合会）", "2026-10-01", "（連合会）\n第百三十七条の四　基金は、第百三十七条の十七第一項に規定する中途脱退者及び解散基金加入員に係る年金及び一時金の支給を共同して行うため、国民年金基金連合会（以下「連合会」という。）を設立することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の四の二", "（法人格）", "2026-10-01", "（法人格）\n第百三十七条の四の二　連合会は、法人とする。\n２　連合会の住所は、その主たる事務所の所在地にあるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の四の三", "（名称）", "2026-10-01", "（名称）\n第百三十七条の四の三　連合会は、その名称中に国民年金基金連合会という文字を用いなければならない。\n２　連合会でない者は、国民年金基金連合会という名称を用いてはならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の五", "（発起人）", "2026-10-01", "（発起人）\n第百三十七条の五　連合会を設立するには、その会員となろうとする二以上の基金が発起人とならなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の六", "（創立総会）", "2026-10-01", "（創立総会）\n第百三十七条の六　発起人は、規約を作成し、創立総会の日時及び場所とともに公告して、創立総会を開かなければならない。\n２　前項の公告は、会日の二週間前までにしなければならない。\n３　発起人が作成した規約の承認その他設立に必要な事項の決定は、創立総会の議決によらなければならない。\n４　創立総会においては、前項の規約を修正することができる。ただし、会員の資格に関する規定については、この限りでない。\n５　創立総会の議事は、その会日までに発起人に対し設立の同意を申し出た基金の理事長の半数以上が出席して、その出席者の三分の二以上で決する。\n６　前各項に定めるもののほか、議事の手続その他創立総会に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の七", "（設立の認可等）", "2026-10-01", "（設立の認可等）\n第百三十七条の七　発起人は、創立総会の終了後遅滞なく、規約その他必要な事項を記載した書面を厚生労働大臣に提出して、設立の認可を受けなければならない。\n２　連合会は、設立の認可を受けた時に成立する。\n３　前条第五項の設立の同意を申し出た基金は、連合会が成立したときは、その成立の日に会員の資格を取得するものとする。\n４　第百十九条の五の規定は、連合会について準用する。この場合において、同条中「設立委員等」とあるのは、「発起人」と読み替えるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の八", "（規約）", "2026-10-01", "（規約）\n第百三十七条の八　連合会は、規約をもつて次に掲げる事項を定めなければならない。\n一　名称\n二　事務所の所在地\n三　評議員会に関する事項\n四　役員に関する事項\n五　会員の資格に関する事項\n六　年金及び一時金に関する事項\n七　附帯事業に関する事項\n八　会費に関する事項\n九　資産の管理その他財務に関する事項\n十　解散及び清算に関する事項\n十一　業務の委託に関する事項\n十二　公告に関する事項\n十三　その他組織及び業務に関する重要事項\n２　第百二十条第三項及び第四項の規定は、連合会の規約について準用する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の九", "（準用規定）", "2026-10-01", "（準用規定）\n第百三十七条の九　第百二十一条の規定は、連合会について準用する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十", "（評議員会）", "2026-10-01", "（評議員会）\n第百三十七条の十　連合会に、評議員会を置く。\n２　評議員会は、評議員をもつて組織する。\n３　評議員は、会員である基金の理事長において互選する。ただし、特別の事情があるときは、規約で定めるところにより、会員である基金の理事長の過半数の同意を得て、連合会の業務の適正な運営及び国民年金基金制度の適切な運用に必要な学識経験を有する者のうちから、理事長が委嘱することを妨げない。\n４　設立当時の評議員は、創立総会において、第百三十七条の六第五項の設立の同意を申し出た基金の理事長のうちから選挙する。\n５　評議員の任期は、二年とする。ただし、補欠の評議員の任期は、前任者の残任期間とする。\n６　評議員会は、理事長が招集する。評議員の定数の三分の一以上の者が会議に付議すべき事項及び招集の理由を記載した書面を理事長に提出して評議員会の招集を請求したときは、理事長は、その請求のあつた日から二十日以内に評議員会を招集しなければならない。\n７　評議員会に議長を置く。議長は、理事長をもつて充てる。\n８　前各項に定めるもののほか、評議員会の招集、議事の手続その他評議員会に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十一", "—", "2026-10-01", "第百三十七条の十一　次に掲げる事項は、評議員会の議決を経なければならない。\n一　規約の変更\n二　毎事業年度の予算\n三　毎事業年度の事業報告及び決算\n四　その他規約で定める事項\n２　理事長は、評議員会が成立しないとき、又は理事長において評議員会を招集する暇がないと認めるときは、評議員会の議決を経なければならない事項で臨時急施を要するものを処分することができる。\n３　理事長は、前項の規定による処置については、次の評議員会においてこれを報告し、その承認を求めなければならない。\n４　評議員会は、監事に対し、連合会の業務に関する監査を求め、その結果の報告を請求することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十二", "（役員）", "2026-10-01", "（役員）\n第百三十七条の十二　連合会に、役員として理事及び監事を置く。\n２　理事は、評議員において互選する。ただし、特別の事情があるときは、評議員会において、評議員以外の連合会の業務の適正な運営及び国民年金基金制度の適切な運用に必要な学識経験を有する者のうちから選任することを妨げない。\n３　設立当時の理事は、創立総会において、第百三十七条の六第五項の設立の同意を申し出た基金の理事長のうちから選挙する。ただし、特別の事情があるときは、当該理事長以外の年金に関する学識経験を有する者のうちから選任することを妨げない。\n４　理事のうち一人を理事長とし、理事が選挙する。\n５　監事は、評議員において一人を互選し、評議員会において、学識経験を有する者のうちから一人を選任する。\n６　設立当時の監事は、創立総会において、第百三十七条の六第五項の設立の同意を申し出た基金の理事長のうちから一人を選挙し、学識経験を有する者のうちから一人を選任する。\n７　役員の任期は、二年とする。ただし、補欠の役員の任期は、前任者の残任期間とする。\n８　役員は、その任期が満了しても、後任の役員が就任するまでの間は、なお、その職務を行う。\n９　監事は、理事又は連合会の職員と兼ねることができない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十三", "（役員の職務等）", "2026-10-01", "（役員の職務等）\n第百三十七条の十三　理事長は、連合会を代表し、その業務を執行する。理事長に事故があるとき、又は理事長が欠けたときは、理事のうちから、あらかじめ理事長が指定する者がその職務を代理し、又はその職務を行う。\n２　連合会の業務は、規約に別段の定めがある場合を除くほか、理事の過半数により決し、可否同数のときは、理事長の決するところによる。\n３　理事は、理事長の定めるところにより、理事長を補佐して、積立金の管理及び運用に関する連合会の業務を執行することができる。\n４　監事は、連合会の業務を監査する。\n５　監事は、監査の結果に基づき、必要があると認めるときは、理事長又は評議員会に意見を提出することができる。\n６　第百二十六条の規定は、連合会の役員及び連合会に使用され、その事務に従事する者について準用する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十三の二", "（理事の義務及び損害賠償責任）", "2026-10-01", "（理事の義務及び損害賠償責任）\n第百三十七条の十三の二　理事は、前条第三項に規定する連合会の業務について、法令、法令に基づいてする厚生労働大臣の処分、規約及び評議員会の議決を遵守し、連合会のため忠実にその職務を遂行しなければならない。\n２　理事が前条第三項に規定する連合会の業務についてその任務を怠つたときは、その理事は、連合会に対し連帯して損害賠償の責めに任ずる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十三の三", "（理事の禁止行為等）", "2026-10-01", "（理事の禁止行為等）\n第百三十七条の十三の三　理事は、自己又は連合会以外の第三者の利益を図る目的をもつて、積立金の管理及び運用の適正を害するものとして厚生労働省令で定める行為をしてはならない。\n２　連合会は、前項の規定に違反した理事を、規約の定めるところにより、評議員会の議決を経て、交代させることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十三の四", "（理事長の代表権の制限）", "2026-10-01", "（理事長の代表権の制限）\n第百三十七条の十三の四　連合会と理事長（第百三十七条の十三第一項の規定により理事長の職務を代理し、又はその職務を行う者を含む。以下この条において同じ。）との利益が相反する事項については、理事長は、代表権を有しない。この場合においては、学識経験を有する者のうちから選任された監事が連合会を代表する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十四", "（会員）", "2026-10-01", "（会員）\n第百三十七条の十四　基金は、連合会に申し出て、その会員となることができる。ただし、他の連合会の会員であるときは、この限りでない。\n２　厚生労働大臣は、基金又は加入員の便宜を図るために必要があると認めるときは、基金に対し、いずれかの連合会に加入することを命ずることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十五", "（連合会の業務）", "2026-10-01", "（連合会の業務）\n第百三十七条の十五　連合会は、第百三十七条の十七第四項の規定により年金又は一時金を支給するものとされている中途脱退者及びその会員である基金に係る解散基金加入員に対し、年金又は死亡を支給事由とする一時金の支給を行うものとする。\n２　連合会は、次に掲げる事業を行うことができる。ただし、第一号に掲げる事業を行う場合には、厚生労働大臣の認可を受けなければならない。\n一　基金が支給する年金及び一時金につき一定額が確保されるよう、基金の拠出金等を原資として、基金の積立金の額を付加する事業\n二　第百二十八条第五項の規定による委託を受けて基金の業務の一部を行う事業\n三　基金への助言又は指導を行う事業その他の基金の行う事業の健全な発展を図るものとして政令で定める事業\n四　国民年金基金制度についての啓発活動及び広報活動を行う事業\n３　連合会は、基金の加入員及び加入員であつた者の福祉を増進するため、必要な施設をすることができる。\n４　連合会は、信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会若しくは共済水産業協同組合連合会又は金融商品取引業者と、当該連合会が支給する年金又は一時金に要する費用に関して信託、保険若しくは共済の契約又は投資一任契約を締結するときは、政令の定めるところによらなければならない。\n５　第百二十八条第四項の規定は、前項の信託の契約（運用方法を特定する信託の契約であつて、政令で定めるものを除く。）、保険若しくは共済の契約又は投資一任契約について準用する。\n６　連合会は、厚生労働大臣の認可を受けて、その業務の一部を信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会、共済水産業協同組合連合会その他政令で定める法人に委託することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十六", "（年金数理）", "2026-10-01", "（年金数理）\n第百三十七条の十六　連合会は、適正な年金数理に基づいてその業務を行わなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十七", "（中途脱退者に係る措置）", "2026-10-01", "（中途脱退者に係る措置）\n第百三十七条の十七　連合会の会員である基金は、政令の定めるところにより、中途脱退者（当該基金の加入員の資格を喪失した者（当該加入員の資格を喪失した日において当該基金が支給する年金の受給権を有する者を除く。）であつて、政令の定めるところにより計算したその者の当該基金の加入員期間が政令で定める期間に満たないものをいう。以下同じ。\n）の当該基金の加入員期間に係る年金の現価に相当する額（以下「現価相当額」という。）の交付を当該連合会に申し出ることができる。\n２　連合会は、前項の規定により現価相当額の交付の申出があつたときは、これを拒絶してはならない。\n３　第一項の交付の申出に係る現価相当額の計算については、政令で定める。\n４　連合会は、第一項の交付の申出に係る現価相当額の交付を受けたときは、当該交付金を原資として、当該中途脱退者に係る年金又は一時金を支給するものとする。\n５　第百二十九条から第百三十一条までの規定は、前項の年金又は一時金について準用する。\n６　基金は、第一項の交付の申出に係る現価相当額を交付したときは、当該中途脱退者に係る年金及び一時金の支給に関する義務を免れる。\n７　連合会は、第四項の規定により中途脱退者に係る年金又は一時金を支給することとなつたときは、その旨を当該中途脱退者に通知しなければならない。\n８　連合会は、中途脱退者の所在が明らかでないため前項の通知をすることができないときは、同項の通知に代えて、その通知すべき事項を公告しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十八", "—", "2026-10-01", "第百三十七条の十八　連合会が前条第四項の規定により年金又は一時金を支給するものとされている中途脱退者が再びもとの基金の加入員となつたときは、当該基金は、当該連合会に対し、当該中途脱退者に係る年金の現価相当額の交付を請求するものとする。\n２　前項の交付の請求に係る現価相当額の計算については、政令で定める。\n３　基金は、第一項の交付の請求に係る現価相当額の交付を受けたときは、当該交付金を原資として、当該中途脱退者に係る年金又は一時金を支給するものとする。\n４　連合会は、第一項の交付の請求に係る現価相当額を交付したときは、当該中途脱退者に係る年金及び一時金の支給に関する義務を免れる。\n５　前条第二項の規定は、第一項の規定による交付の請求について準用する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の十九", "（解散基金加入員に係る措置）", "2026-10-01", "（解散基金加入員に係る措置）\n第百三十七条の十九　連合会は、その会員である基金が解散したときは、当該基金の解散基金加入員に係る第九十五条の二に規定する責任準備金に相当する額を当該解散した基金から徴収する。\n２　連合会は、前項の規定により責任準備金に相当する額を徴収した基金に係る解散基金加入員が老齢基礎年金の受給権を取得したとき又は当該基金が解散した日において当該基金に係る解散基金加入員が老齢基礎年金の受給権を有していたときは、当該解散基金加入員に年金を支給し、当該解散基金加入員が死亡した場合において、その遺族が死亡一時金を受けたときは、\nその遺族に一時金を支給するものとする。\n３　前項の年金の額は、二百円に当該解散した基金に係る加入員期間の月数を乗じて得た額とし、同項の一時金の額は、八千五百円とする。\n４　解散した基金は、規約の定めるところにより、第百三十七条第四項の規定により解散基金加入員に分配すべき残余財産の交付を第一項の規定により責任準備金に相当する額を徴収した連合会に申し出ることができる。\n５　連合会は、前項の規定による申出に従い解散基金加入員に分配すべき残余財産の交付を受けたときは、当該交付金を原資として、政令の定めるところにより、当該解散基金加入員に係る年金又は一時金の額を加算するものとする。\n６　連合会が前項に規定する残余財産の交付を受けたときは、第百三十七条第四項の規定の適用については、当該残余財産は、当該解散基金加入員に分配されたものとみなす。\n７　連合会は、第五項の規定により解散基金加入員に係る年金又は一時金の額を加算することとなつたときは、その旨を当該解散基金加入員に通知しなければならない。\n８　第百三十七条の十七第二項の規定は、第四項の規定による申出について、同条第八項の規定は、前項の規定による通知について準用する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の二十", "（年金の支給停止）", "2026-10-01", "（年金の支給停止）\n第百三十七条の二十　連合会が前条第二項の規定により支給する年金は、当該解散基金加入員が受給権を有する老齢基礎年金につきその全額の支給が停止されているときは、その間、その支給を停止するものとする。ただし、当該年金の額のうち、二百円に当該解散した基金に係る加入員期間の月数を乗じて得た額を超える部分については、この限りでない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の二十一", "（準用規定）", "2026-10-01", "（準用規定）\n第百三十七条の二十一　第十六条及び第二十四条の規定は、連合会が支給する年金及び一時金を受ける権利について、第十八条第一項及び第二項並びに第十九条第一項及び第三項から第五項までの規定は、連合会が支給する年金について、第二十一条の二の規定は、連合会が支給する年金及び一時金について、第二十二条及び第二十三条の規定は、連合会について、第二十五条、\n第七十条後段及び第七十一条第一項の規定は、連合会が支給する一時金について、第二十九条の規定は、連合会が第百三十七条の十九第二項の規定により支給する年金について準用する。この場合において、第十六条中「厚生労働大臣」とあるのは「連合会」と、第二十一条の二中「支払うべき年金給付」とあるのは「支払うべき一時金」と、\n「年金給付の支払金」とあるのは「一時金の支払金」と、第二十四条中「老齢基礎年金」とあるのは「連合会が支給する年金」と、第二十九条中「受給権者」とあるのは「受給権を有する者」と、第七十一条第一項中「被保険者又は被保険者であつた者」とあるのは「加入員又は加入員であつた者」と読み替えるものとする。\n２　第九十五条、第九十六条第一項から第五項まで、第九十七条及び第九十八条の規定は、前項において準用する第二十三条の規定及び第百三十七条の十九第一項の規定による徴収金について準用する。この場合において、第九十六条第一項、第二項、第四項及び第五項並びに第九十七条第一項中「厚生労働大臣」とあるのは「連合会」と、\n「前条第一項」とあるのは「第百三十七条の二十一第二項において準用する前条第一項」と、「年十四・六パーセント（当該督促が保険料に係るものであるときは、当該納期限の翌日から三月を経過する日までの期間については、年七・三パーセント）」とあるのは「年十四・六パーセント」と読み替えるものとする。\n３　第百三十一条の二及び第百三十二条の規定は、連合会の積立金の積立て及びその運用、業務上の余裕金の運用並びに事業年度その他その財務について準用する。この場合において、同条第三項中「前条及び前二項」とあるのは、「第百三十七条の二十一第三項において準用する前条及び前二項」と読み替えるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の二十二", "（解散）", "2026-10-01", "（解散）\n第百三十七条の二十二　連合会は、次に掲げる理由により解散する。\n一　評議員の定数の四分の三以上の多数による評議員会の議決\n二　第百四十二条第五項の規定による解散の命令\n２　連合会は、前項第一号に掲げる理由により解散しようとするときは、厚生労働大臣の認可を受けなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の二十三", "（連合会の解散による年金及び一時金の支給に関する義務の消滅）", "2026-10-01", "（連合会の解散による年金及び一時金の支給に関する義務の消滅）\n第百三十七条の二十三　連合会は、解散したときは、当該連合会が第百三十七条の十七第四項及び第百三十七条の十九第二項の規定により支給するものとされている年金及び一時金の支給に関する義務を免れる。ただし、解散した日までに支給すべきであつた年金又は一時金でまだ支給していないものの支給に関する義務については、この限りでない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十七条の二十四", "（清算）", "2026-10-01", "（清算）\n第百三十七条の二十四　連合会が第百三十七条の二十二第一項第一号の規定により解散したときは、理事が、その清算人となる。ただし、評議員会において他人を選任したときは、この限りでない。\n２　連合会が第百三十七条の二十二第一項第二号の規定により解散したときは、厚生労働大臣が清算人を選任する。\n３　第百三十六条の二、第百三十七条第二項（第二号を除く。）及び第三項並びに第百三十七条の二から第百三十七条の二の四までの規定は、連合会の清算について準用する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十八条", "（準用規定）", "2026-10-01", "（準用規定）\n第百三十八条　次の表の第一欄に掲げる規定は、同表の第二欄に掲げるものについて準用する。この場合において、同表の第一欄に掲げる規定中同表の第三欄に掲げる字句は、それぞれ同表の第四欄に掲げる字句と読み替えるものとする。\n第一欄\n第二欄\n第三欄\n第四欄\n第百一条第一項から第三項まで及び第五項\n加入員及び会員の資格に関する処分、年金若しくは一時金に関する処分、掛金に関する処分又は第百三十三条及び第百三十七条の二十一において準用する第二十三条並びに第百三十七条の十九第一項の規定による徴収金に関する処分に不服がある者\n第百一条の二\n加入員及び会員の資格に関する処分又は年金若しくは一時金に関する処分に不服がある者\n前条第一項\n第百三十八条において準用する第百一条第一項\n第百二条第一項及び第二項\n年金\n　\n　\n第百二条第四項及び第五項\n掛金並びに第百三十三条及び第百三十七条の二十一において準用する第二十三条並びに第百三十七条の十九第一項の規定による徴収金並びに一時金\n　\n　\n第百四条\n加入員、加入員であつた者又は年金若しくは一時金の受給権を有する者の戸籍\n厚生労働大臣又は被保険者、被保険者であつた者若しくは受給権者\n基金、連合会、加入員若しくは加入員であつた者又は年金若しくは一時金の受給権を有する者\n第百五条（第二項（第十二条第二項を準用する部分を除く。）及び第五項を除く。）\n加入員及び基金又は連合会が支給する年金又は一時金の受給権を有する者\n事項を第三号被保険者以外の被保険者にあつては市町村長に、第三号被保険者にあつては厚生労働大臣\n事項を基金\n厚生労働大臣に対し\n基金又は連合会に対し\nその旨を第三号被保険者以外の被保険者に係るものにあつては市町村長に、第三号被保険者又は受給権者に係るものにあつては厚生労働大臣\nその旨を基金又は連合会", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十九条", "（届出）", "2026-10-01", "（届出）\n第百三十九条　基金は、厚生労働省令の定めるところにより、その加入員の資格の取得及び喪失に関する事項を厚生労働大臣に届け出なければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三十九条の二", "（年金数理関係書類の年金数理人による確認等）", "2026-10-01", "（年金数理関係書類の年金数理人による確認等）\n第百三十九条の二　この法律に基づき基金（第百十九条第一項又は第三項の規定に基づき基金を設立しようとする設立委員等を含む。）又は連合会（第百三十七条の五の規定に基づき連合会を設立しようとする発起人を含む。）が厚生労働大臣に提出する年金数理に関する業務に係る書類であつて厚生労働省令で定めるものについては、\n当該書類が適正な年金数理に基づいて作成されていることを確定給付企業年金法（平成十三年法律第五十号）第九十七条第二項に規定する年金数理人が確認し、記名したものでなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百四十条", "（報告書の提出）", "2026-10-01", "（報告書の提出）\n第百四十条　基金及び連合会は、厚生労働省令の定めるところにより、その業務についての報告書を厚生労働大臣に提出しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百四十一条", "（報告の徴収等）", "2026-10-01", "（報告の徴収等）\n第百四十一条　厚生労働大臣は、基金若しくは連合会又は解散した基金若しくは連合会について、必要があると認めるときは、その事業若しくはその清算事務の状況に関する報告を徴し、又は当該職員をして当該基金若しくは連合会若しくは解散した基金若しくは連合会の事務所に立ち入つて関係者に質問させ、若しくは実地にその状況を検査させることができる。\n２　前項の規定によつて質問及び検査を行なう当該職員は、その身分を示す証票を携帯し、かつ、関係人の請求があるときは、これを提示しなければならない。\n３　第一項の規定による権限は、犯罪捜査のために認められたものと解釈してはならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百四十二条", "（基金等に対する監督）", "2026-10-01", "（基金等に対する監督）\n第百四十二条　厚生労働大臣は、前条の規定により報告を徴し、又は質問し、若しくは検査した場合において、基金若しくは連合会の事業の管理若しくは執行若しくは解散した基金若しくは連合会の清算事務（以下「基金等の事業の執行」という。）が法令、規約若しくは厚生労働大臣の処分に違反していると認めるとき、基金等の事業の執行が著しく適正を欠くと認めるとき、\n又は基金若しくは連合会の役員若しくは解散した基金若しくは連合会の清算人が基金等の事業の執行を明らかに怠つていると認めるときは、期間を定めて、基金若しくは連合会若しくはこれらの役員又は解散した基金若しくは連合会若しくはこれらの清算人に対し、基金等の事業の執行について違反の是正又は改善のため必要な措置を採るべき旨を命ずることができる。\n２　厚生労働大臣は、基金又は連合会の事業の健全な運営を確保するため必要があると認めるときは、期間を定めて、当該基金又は連合会に対し、その規約の変更を命ずることができる。\n３　基金若しくは連合会若しくはこれらの役員若しくは解散した基金若しくは連合会若しくはこれらの清算人が第一項の命令に違反したとき、又は基金若しくは連合会が前項の命令に違反したときは、厚生労働大臣は、当該基金若しくは連合会又は解散した基金若しくは連合会に対し、期間を定めて、当該違反に係る役員又は清算人の全部又は一部の改任を命ずることができる。\n４　基金若しくは連合会又は解散した基金若しくは連合会が前項の命令に違反したときは、厚生労働大臣は、同項の命令に係る役員を改任し、又は同項の命令に係る清算人を解任することができる。\n５　基金若しくは連合会が第一項の命令に違反したとき、又はその事業の状況によりその事業の継続が困難であると認めるときは、厚生労働大臣は、当該基金若しくは連合会の解散を命ずることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百四十二条の二", "（権限の委任）", "2026-10-01", "（権限の委任）\n第百四十二条の二　この章に規定する厚生労働大臣の権限のうち基金に係るものは、厚生労働省令の定めるところにより、その一部を地方厚生局長に委任することができる。\n２　前項の規定により地方厚生局長に委任された権限は、厚生労働省令の定めるところにより、地方厚生支局長に委任することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百四十三条", "—", "2026-10-01", "第百四十三条　第百四十一条第一項の規定による報告をせず、若しくは虚偽の報告をし、又は同項の規定による当該職員の質問に対して答弁せず、若しくは虚偽の陳述をし、若しくは同項の規定による検査を拒み、妨げ、若しくは忌避した者は、六月以下の拘禁刑又は五十万円以下の罰金に処する。\n２　解散した基金が、正当な理由がなくて、第百三十七条の十九第一項の規定により負担すべき徴収金を督促状に指定する期限までに納付しないときは、その代表者、代理人又は使用人その他の従業者でその違反行為をした者も、前項と同様とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百四十四条", "—", "2026-10-01", "第百四十四条　法人の代表者、代理人、使用人その他の従業者が、その法人の業務に関して、前条の違反行為をしたときは、行為者を罰するほか、その法人に対しても、同条の罰金刑を科する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百四十五条", "—", "2026-10-01", "第百四十五条　基金若しくは連合会又は解散した基金若しくは連合会が、次の各号のいずれかに該当する場合には、その違反行為をした基金若しくは連合会の役員、代理人若しくは使用人その他の従業者又は解散した基金若しくは連合会の清算人は、二十万円以下の過料に処する。\n一　第百二十条第四項（第百三十七条の八第二項において準用する場合を含む。）の規定に違反して、届出をせず、又は虚偽の届出をしたとき。\n二　第百三十九条の規定に違反して、届出をせず、又は虚偽の届出をしたとき。\n三　第百四十条の規定に違反して、報告をせず、又は虚偽の報告をしたとき。\n四　第百四十二条第一項の規定による命令に違反したとき。\n五　この章の規定により基金又は連合会が行うものとされた事業以外の事業を行つたとき。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百四十六条", "—", "2026-10-01", "第百四十六条　基金又は連合会が、次の各号のいずれかに該当する場合には、その違反行為をした基金又は連合会の役員は、二十万円以下の過料に処する。\n一　第百二十一条（第百三十七条の九において準用する場合を含む。）の規定に違反して、公告を怠り、又は虚偽の公告をしたとき。\n二　第百三十七条の三の四第二項又は第百三十七条の三の十第二項の規定に違反して、書類を備え置かず、その書類に記載すべき事項を記載せず、若しくは虚偽の記載をし、又はこれらの規定による閲覧を拒んだとき。\n三　第百三十七条の十七第七項又は第百三十七条の十九第七項の規定に違反して、通知をしないとき。\n四　第百三十七条の十七第八項（第百三十七条の十九第八項において準用する場合を含む。）の規定に違反して、公告を怠り、又は虚偽の公告をしたとき。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百四十七条", "—", "2026-10-01", "第百四十七条　次の各号に掲げる場合には、十万円以下の過料に処する。\n一　加入員が、第百二十七条の二において準用する第十二条第一項又は第百三十八条において準用する第百五条第一項の規定に違反して、届出をしなかつたとき。ただし、第百二十七条の二において準用する第十二条第二項（第百三十八条において準用する第百五条第二項において準用する場合を含む。）の規定によつて世帯主から届出がなされたときを除く。\n二　加入員が、第百二十七条の二において準用する第十二条第一項又は第百三十八条において準用する第百五条第一項の規定に違反して、虚偽の届出をしたとき。\n三　加入員の属する世帯の世帯主が、第百二十七条の二において準用する第十二条第二項（第百三十八条において準用する第百五条第二項において準用する場合を含む。）の規定により届出をする場合に虚偽の届出をしたとき。\n四　戸籍法の規定による死亡の届出義務者が、第百三十八条において準用する第百五条第四項本文の規定に違反して、届出をしなかつたとき。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百四十八条", "—", "2026-10-01", "第百四十八条　第百十八条第二項又は第百三十七条の四の三第二項の規定に違反して、国民年金基金という名称又は国民年金基金連合会という名称を用いた者は、十万円以下の過料に処する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["【法令中の表｜原文照合用】", "各表の列の対応を復元したものです。条文本文と併せて参照してください。", "", "", ""], ["条文内の表", "第1欄", "第2欄", "第3欄／第4欄", "XML出典"], ["第十四条の 員であつた者又は年金若しくは一時金の受給権を有する者", ""], ["第百五条（第二項（第十二条第二項を準用する部分を除く。）及び第五項を除く。）", "加入員及び基金又は連合会が支給する年金又は一時金の受給権を有する者", "事項を第三号被保険者以外の被保険者にあつては市町村長に、第三号被保険者にあつては厚生労働大臣", "事項を基金", ""], ["", "", "厚生労働大臣に対し", "基金又は連合会に対し", ""], ["", "", "その旨を第三号被保険者以外の被保険者に係るものにあつては市町村長に、第三号被保険者又は受給権者に係るものにあつては厚生労働大臣", "その旨を基金又は連合会", ""], ["国民年金法（昭和34年法律第141号）・本法附則", "附則見出し", "2026-10-01", "附　則", "e-Gov法令XML（改正法附則はExtract=trueの収録範囲）"], ["第一条", "（施行期日）", "2026-10-01", "（施行期日）\n附則 第一条　この法律は、昭和三十四年十一月一日から施行する。ただし、第二章、第七十四条、第七十五条及び附則第四条から附則第八条までの規定は昭和三十五年十月一日から、第七十六条から第七十九条まで、第六章中保険料に関する部分及び附則第二条の規定は昭和三十六年四月一日から、附則第三条第一項の規定は公布の日から施行する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第一条の二", "（基礎年金についての検討）", "2026-10-01", "（基礎年金についての検討）\n附則 第一条の二　基礎年金の水準、費用負担のあり方等については、社会経済情勢の推移、世帯の類型等を考慮して、今後検討が加えられるべきものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二条", "（被保険者に関する経過措置）", "2026-10-01", "（被保険者に関する経過措置）\n附則 第二条　昭和三十五年十月一日から昭和三十六年三月三十一日までの間において被保険者であつた者について、給付に関する規定を適用する場合においては、その者は、その期間、被保険者でなかつたものとみなす。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三条", "（被保険者の資格の特例）", "2026-10-01", "（被保険者の資格の特例）\n附則 第三条　第七条第一項第二号の規定の適用については、当分の間、同号中「の被保険者」とあるのは、「の被保険者（六十五歳以上の者にあつては、厚生年金保険法附則第四条の三第一項に規定する政令で定める給付の受給権を有しない被保険者に限る。）」とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四条", "（被保険者の資格の喪失に関する経過措置）", "2026-10-01", "（被保険者の資格の喪失に関する経過措置）\n附則 第四条　当分の間、第九条第五号の規定の適用については、同号中「該当するときを除く。）」とあるのは「該当するときを除く。）又は六十五歳に達したとき（附則第三条の規定により読み替えられた第七条第一項第二号に該当するときを除く。）」とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第五条", "（任意加入被保険者）", "2026-10-01", "（任意加入被保険者）\n附則 第五条　次の各号のいずれかに該当する者（第二号被保険者及び第三号被保険者を除く。）は、第七条第一項の規定にかかわらず、厚生労働大臣に申し出て、被保険者となることができる。\n一　日本国内に住所を有する二十歳以上六十歳未満の者であつて、厚生年金保険法に基づく老齢給付等を受けることができるもの（この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。）\n二　日本国内に住所を有する六十歳以上六十五歳未満の者（この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。）\n三　日本国籍を有する者その他政令で定める者であつて、日本国内に住所を有しない二十歳以上六十五歳未満のもの\n２　前項第一号又は第二号に該当する者が同項の規定による申出を行おうとする場合には、口座振替納付を希望する旨の申出又は口座振替納付によらない正当な事由がある場合として厚生労働省令で定める場合に該当する旨の申出を厚生労働大臣に対してしなければならない。\n３　前項（第一項第三号に掲げる者にあつては、同項）の規定による申出をした者は、その申出をした日に被保険者の資格を取得するものとする。\n４　第一項の規定による被保険者は、いつでも、厚生労働大臣に申し出て、被保険者の資格を喪失することができる。\n５　第一項の規定による被保険者は、第九条第一号に該当するに至つた日の翌日又は次の各号のいずれかに該当するに至つた日に、被保険者の資格を喪失する。\n一　六十五歳に達したとき。\n二　厚生年金保険の被保険者の資格を取得したとき。\n三　前項の申出が受理されたとき。\n四　第二十七条各号に掲げる月数を合算した月数が四百八十に達したとき。\n６　第一項第一号に掲げる者である被保険者は、前項の規定によつて被保険者の資格を喪失するほか、次の各号のいずれかに該当するに至つた日の翌日（第一号に該当するに至つた日に更に被保険者の資格を取得したとき、又は第二号若しくは第三号に該当するに至つたときは、その日）に、被保険者の資格を喪失する。\n一　日本国内に住所を有しなくなつたとき。\n二　厚生年金保険法に基づく老齢給付等を受けることができる者に該当しなくなつたとき。\n三　被扶養配偶者となつたとき。\n四　保険料を滞納し、第九十六条第一項の規定による指定の期限までに、その保険料を納付しないとき。\n五　この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者となつたとき。\n７　第一項第二号に掲げる者である被保険者は、第五項の規定によつて被保険者の資格を喪失するほか、前項第一号、第四号及び第五号のいずれかに該当するに至つた日の翌日（同項第一号に該当するに至つた日に更に被保険者の資格を取得したときは、その日）に、被保険者の資格を喪失する。\n８　第一項第三号に掲げる者である被保険者は、第五項の規定によつて被保険者の資格を喪失するほか、次の各号のいずれかに該当するに至つた日の翌日（その事実があつた日に更に被保険者の資格を取得したときは、その日）に、被保険者の資格を喪失する。\n一　日本国内に住所を有するに至つたとき。\n二　日本国籍を有する者及び第一項第三号に規定する政令で定める者のいずれにも該当しなくなつたとき。\n三　被扶養配偶者となつたとき（六十歳未満であるときに限る。）。\n四　保険料を滞納し、その後、保険料を納付することなく二年間が経過したとき。\n９　第一項の規定による被保険者は、第八十七条の二の規定の適用については、第一号被保険者とみなし、当該被保険者としての被保険者期間は、第五条第一項の規定の適用については第七条第一項第一号に規定する被保険者としての被保険者期間と、第四十九条から第五十二条の六まで、附則第九条の三及び第九条の三の二の規定の適用については第一号被保険者としての被保険者期間と、それぞれみなす。\n１０　第一項の規定による被保険者については、第八十八条の二から第九十条の三までの規定を適用しない。\n１１　第一項の規定による被保険者（同項第一号に掲げる者を除く。第十三項において同じ。）は、第百十六条第一項及び第二項並びに第百二十七条第一項の規定の適用については、第一号被保険者とみなす。\n１２　第一項の規定による被保険者（同項第三号に掲げる者に限る。）は、第百二十七条第一項の規定にかかわらず、その者が住所を有していた地区に係る地域型基金又はその者が加入していた職能型基金に申し出て、地域型基金又は職能型基金の加入員となることができる。この場合における第百十六条第一項及び第二項並びに第百二十七条第三項の規定の適用については、第百十六条第一項中「有する者」とあるのは「有する者及び有していた者」と、同条第二項中「従事する者」とあるのは「従事する者及び従事していた者」と、第百二十七条第三項第二号中「地域型基金の加入員」とあるのは「地域型基金の加入員（附則第五条第十二項の規定により加入員となつた者を除く。）」と、「職能型基金の加入員」とあるのは「職能型基金の加入員（同項の規定により加入員となつた者を除く。）」とする。\n１３　第一項の規定による被保険者が中途脱退者であつて再びもとの基金の加入員となつた場合における第百三十条第二項（第百三十七条の十七第五項において準用する場合を除く。）及び国民年金法等の一部を改正する法律（昭和六十年法律第三十四号。以下「昭和六十年改正法」という。）附則第三十四条第四項第一号の規定の適用については、第百三十条第二項中「当該基金の加入員であつた期間」とあるのは「当該基金の加入員であつた期間であつて、連合会（第百三十七条の四に規定する連合会をいう。）がその支給に関する義務を負つている年金又は一時金の額の計算の基礎となる期間を除いたもの」と、昭和六十年改正法附則第三十四条第四項第一号中「同法第百三十条第二項に規定する加入員期間をいう。以下この号において同じ」とあるのは「同法附則第五条第十三項の規定により読み替えて適用する同法第百三十条第二項に規定する加入員期間をいう」と、「加入員期間の月数」とあるのは「加入員であつた期間の月数」とする。この場合においては、第百三十七条の十八の規定は、適用しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第六条", "article", "2026-10-01", "附則 第六条　第一号被保険者である者が厚生年金保険法に基づく老齢給付等を受けることができる者に該当するに至つた場合において、その者がこれに該当するに至らなかつたならば納付すべき保険料を、その該当するに至つた日の属する月以降の期間について、第九十三条第一項の規定により前納しているとき、又はその該当するに至つた日の属する月後における最初の四月の末日までに納付したときは、その該当するに至つた日において、前条第一項の申出をしたものとみなす。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七条の二", "（被保険者期間に関する特例）", "2026-10-01", "（被保険者期間に関する特例）\n附則 第七条の二　厚生年金保険の被保険者期間につき厚生年金保険法による保険料を徴収する権利が時効によつて消滅したとき（同法第七十五条ただし書に該当するときを除く。）は、当該保険料に係る厚生年金保険の被保険者期間の計算の基礎となつた月に係る第二号被保険者としての被保険者期間は、第五条第一項の規定にかかわらず、保険料納付済期間に算入しない。その者の配偶者が第三号被保険者である場合における当該厚生年金保険の被保険者期間の計算の基礎となつた月に係る当該配偶者の第三号被保険者としての被保険者期間についても、同様とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七条の三", "article", "2026-10-01", "附則 第七条の三　第七条第一項第三号に該当しなかつた者が同号の規定に該当する被保険者となつたことに関する第十二条第五項から第八項までの規定による届出又は同号に該当する被保険者の配偶者が厚生年金保険の被保険者の資格を喪失した後引き続き厚生年金保険の被保険者となつたことに関する第百五条第一項（同条第二項において第十二条第六項から第八項までの規定を準用する場合を含む。）の規定による届出が行われた日の属する月前の当該届出に係る第三号被保険者としての被保険者期間（当該届出が行われた日の属する月の前々月までの二年間のうちにあるものを除く。）は、第五条第一項の規定にかかわらず、保険料納付済期間に算入しない。\n２　第三号被保険者又は第三号被保険者であつた者は、その者の第三号被保険者としての被保険者期間のうち、前項の規定により保険料納付済期間に算入されない期間（前条の規定により保険料納付済期間に算入されない第三号被保険者としての被保険者期間を除く。）について、前項に規定する届出を遅滞したことについてやむを得ない事由があると認められるときは、厚生労働大臣にその旨の届出をすることができる。\n３　前項の規定により届出が行われたときは、第一項の規定にかかわらず、当該届出が行われた日以後、当該届出に係る期間は保険料納付済期間に算入する。\n４　老齢基礎年金の受給権者が第二項の規定による届出を行い、前項の規定により当該届出に係る期間が保険料納付済期間に算入されたときは、当該届出のあつた日の属する月の翌月から、年金額を改定する。\n５　第三項の規定により第二項の届出に係る期間が保険料納付済期間に算入された者に対する昭和六十年改正法附則第十八条の規定の適用については、同条第一項中「同日以後の国民年金の被保険者期間」とあるのは、「同日以後に保険料納付済期間に算入される期間」とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七条の三の二", "article", "2026-10-01", "附則 第七条の三の二　前条第一項の規定は、次の各号のいずれかに該当する場合において、当該各号に規定する被保険者期間については、適用しない。\n一　第三号被保険者としての被保険者期間（保険料納付済期間（政令で定める期間を除く。）に限る。以下この条において「対象第三号被保険者期間」という。）を有する者の当該対象第三号被保険者期間の一部について、第三号被保険者としての被保険者期間以外の期間として第十四条の規定により記録した事項の訂正がなされた場合　｜　当該第三号被保険者としての被保険者期間以外の期間に引き続く第三号被保険者としての被保険者期間\n二　対象第三号被保険者期間を有する者の当該対象第三号被保険者期間の一部の期間（以下この号において「対象一部第三号被保険者期間」という。）におけるその者の配偶者の被保険者期間が、直近の厚生年金保険の被保険者である期間に引き続く他の厚生年金保険の被保険者である期間となつたことにより、当該対象一部第三号被保険者期間について、保険料納付済期間でないものとして第十四条の規定により記録した事項の訂正がなされた場合　｜　当該訂正がなされた第三号被保険者としての被保険者期間", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七条の四", "article", "2026-10-01", "附則 第七条の四　第二号被保険者については、第十二条及び第百五条の規定を適用しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七条の五", "（国民年金原簿の特例等）", "2026-10-01", "（国民年金原簿の特例等）\n附則 第七条の五　第十四条及び第十四条の二の規定の適用については、当分の間、第十四条中「被保険者」とあるのは、「被保険者（第二号被保険者のうち第二号厚生年金被保険者、第三号厚生年金被保険者又は第四号厚生年金被保険者であるものを除く。次条において同じ。）」とする。\n２　第二号被保険者であつた期間のうち厚生年金保険法第二条の五第一項第二号に規定する第二号厚生年金被保険者期間（以下この条において「第二号厚生年金被保険者期間」という。）、同項第三号に規定する第三号厚生年金被保険者期間（以下この条において「第三号厚生年金被保険者期間」という。）又は同項第四号に規定する第四号厚生年金被保険者期間（以下この条において「第四号厚生年金被保険者期間」という。）につき第二十六条、第三十条第一項、第三十条の二第一項、第三十条の三第一項、第三十四条第四項、第三十六条第二項ただし書、第三十七条、附則第九条の二第一項又は第九条の二の二第一項の規定の適用を受けようとする者についての当該厚生年金保険の被保険者であつた期間については、当分の間、第二号厚生年金被保険者期間については国家公務員共済組合連合会の確認を、第三号厚生年金被保険者期間については地方公務員共済組合の確認を、第四号厚生年金被保険者期間については日本私立学校振興・共済事業団の確認を受けたところによる。\n３　前項の規定による確認に関する処分に不服がある者は、厚生年金保険法第九十条第二項及び第四項から第六項までの定めるところにより、同条第二項各号に定める審査機関に審査請求をすることができる。\n４　第二項の場合において、当該第二号厚生年金被保険者期間、第三号厚生年金被保険者期間又は第四号厚生年金被保険者期間に係る同項の規定による確認の処分についての不服を、当該厚生年金保険の被保険者であつた期間に基づく老齢基礎年金、障害基礎年金又は遺族基礎年金に関する処分についての不服の理由とすることができない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第八条", "（資料の提供）", "2026-10-01", "（資料の提供）\n附則 第八条　厚生労働大臣は、被保険者の資格に関し必要があるときは、共済組合、日本私立学校振興・共済事業団その他厚生年金保険法に基づく老齢給付等に係る制度の管掌機関に対し、必要な資料の提供を求めることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条", "（老齢基礎年金等の支給要件の特例）", "2026-10-01", "（老齢基礎年金等の支給要件の特例）\n附則 第九条　保険料納付済期間又は保険料免除期間（第九十条の三第一項の規定により納付することを要しないものとされた保険料に係るものを除く。次条第一項及び附則第九条の二の二第一項において同じ。）を有する者（以下この項において「保険料納付済期間等を有する者」という。）のうち、第二十六条ただし書に該当する者であつて保険料納付済期間、保険料免除期間及び合算対象期間（附則第五条第一項第一号又は第三号に該当した期間（第二号被保険者又は第三号被保険者であつた期間、保険料納付済期間及び六十歳以上であつた期間を除く。）をいう。以下同じ。）を合算した期間が十年以上であるものは、第二十六条、次条第一項、附則第九条の二の二第一項、第九条の三第一項及び第九条の三の二第一項の規定の適用については、第二十六条ただし書に該当しないものとみなし、保険料納付済期間等を有する者のうち、保険料納付済期間と保険料免除期間とを合算した期間が二十五年に満たない者であつて保険料納付済期間、保険料免除期間及び合算対象期間並びに六十五歳に達した日の属する月以後の厚生年金保険の被保険者期間を合算した期間が二十五年以上であるものは、第三十七条（第三号に限る。）の規定の適用については、保険料納付済期間と保険料免除期間とを合算した期間が二十五年以上であるものとみなす。\n２　合算対象期間の計算については、第十一条の規定の例による。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の二", "（老齢基礎年金の支給の繰上げ）", "2026-10-01", "（老齢基礎年金の支給の繰上げ）\n附則 第九条の二　保険料納付済期間又は保険料免除期間を有する者であつて、六十歳以上六十五歳未満であるもの（附則第五条第一項の規定による被保険者でないものに限るものとし、次条第一項に規定する支給繰上げの請求をすることができるものを除く。）は、当分の間、六十五歳に達する前に、厚生労働大臣に老齢基礎年金の支給繰上げの請求をすることができる。ただし、その者が、その請求があつた日の前日において、第二十六条ただし書に該当したときは、この限りでない。\n２　前項の請求は、厚生年金保険法附則第七条の三第一項又は第十三条の四第一項の規定により支給繰上げの請求をすることができる者にあつては、当該請求と同時に行わなければならない。\n３　第一項の請求があつたときは、第二十六条の規定にかかわらず、その請求があつた日から、その者に老齢基礎年金を支給する。\n４　前項の規定により支給する老齢基礎年金の額は、第二十七条の規定にかかわらず、同条に定める額から政令で定める額を減じた額とする。\n５　寡婦年金の受給権は、受給権者が第三項の規定による老齢基礎年金の受給権を取得したときは、消滅する。\n６　第四項の規定は、第三項の規定による老齢基礎年金の受給権者が第八十七条の二の規定による保険料に係る保険料納付済期間を有する場合における付加年金の額について準用する。この場合において、第四項中「第二十七条」とあるのは、「第四十四条」と読み替えるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の二の二", "（老齢厚生年金の支給繰上げの請求ができる者等に係る老齢基礎年金の支給の繰上げの特例）", "2026-10-01", "（老齢厚生年金の支給繰上げの請求ができる者等に係る老齢基礎年金の支給の繰上げの特例）\n附則 第九条の二の二　保険料納付済期間又は保険料免除期間を有する者であつて、厚生年金保険法附則第八条の二各項に規定する者（同条第三項に規定する者その他政令で定めるものに限るものとし、同条各項の表の下欄に掲げる年齢に達していないものに限る。）に該当するもの（六十歳以上の者であつて、かつ、附則第五条第一項の規定による被保険者でないものに限る。）は、当分の間、厚生労働大臣に老齢基礎年金の一部の支給繰上げの請求をすることができる。ただし、その者が、その請求があつた日の前日において、第二十六条ただし書に該当したときは、この限りでない。\n２　前項の請求は、厚生年金保険法附則第七条の三第一項又は第十三条の四第一項の規定により支給繰上げの請求をすることができる者にあつては、当該請求と同時に行わなければならない。\n３　第一項の請求があつたときは、第二十六条の規定にかかわらず、その請求があつた日から、その者に老齢基礎年金を支給する。\n４　前項の規定により支給する老齢基礎年金の額は、第二十七条の規定にかかわらず、同条に定める額に政令で定める率を乗じて得た額から政令で定める額を減じた額とする。\n５　第三項の規定による老齢基礎年金の受給権者が六十五歳に達したときは、前項の規定にかかわらず、当該老齢基礎年金の額に、第二十七条に定める額に一から前項に規定する政令で定める率を控除して得た率を乗じて得た額を加算するものとし、六十五歳に達した日の属する月の翌月から、年金の額を改定する。\n６　前条第五項及び第六項の規定は、第三項の規定による老齢基礎年金について準用する。この場合において、同条第六項中「第四項の規定」とあるのは「次条第四項及び第五項の規定」と、「第四項中」とあるのは「次条第四項及び第五項の規定中」と読み替えるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の二の三", "（障害基礎年金等の特例）", "2026-10-01", "（障害基礎年金等の特例）\n附則 第九条の二の三　第三十条第一項（第二号に限る。）、第三十条の二、第三十条の三、第三十条の四第二項、第三十四条第四項、第三十六条第二項ただし書及び第四十九条並びに附則第五条の規定は、当分の間、附則第九条の二第三項若しくは前条第三項の規定による老齢基礎年金の受給権者又は厚生年金保険法附則第七条の三第三項若しくは第十三条の四第三項の規定による老齢厚生年金の受給権者については、適用しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の二の四", "（併給調整の特例）", "2026-10-01", "（併給調整の特例）\n附則 第九条の二の四　第二十条第一項の規定の適用については、当分の間、同項中「遺族基礎年金又は寡婦年金」とあるのは「年金給付（老齢基礎年金及び障害基礎年金（その受給権者が六十五歳に達しているものに限る。）並びに付加年金を除く。）」と、「老齢基礎年金の受給権者」とあるのは「老齢基礎年金の受給権者（六十五歳に達している者に限る。）」と、「障害基礎年金の受給権者」とあるのは「障害基礎年金の受給権者（六十五歳に達している者に限る。）」とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の二の五", "（延滞金の割合の特例）", "2026-10-01", "（延滞金の割合の特例）\n附則 第九条の二の五　第九十七条第一項（第百三十四条の二第一項において準用する場合及び第百三十七条の二十一第二項において読み替えて準用する場合を含む。以下この条において同じ。）に規定する延滞金の年十四・六パーセントの割合及び年七・三パーセントの割合は、当分の間、第九十七条第一項の規定にかかわらず、各年の延滞税特例基準割合（租税特別措置法（昭和三十二年法律第二十六号）第九十四条第一項に規定する延滞税特例基準割合をいう。以下この条において同じ。）が年七・三パーセントの割合に満たない場合には、その年中においては、年十四・六パーセントの割合にあつては当該延滞税特例基準割合に年七・三パーセントの割合を加算した割合とし、年七・三パーセントの割合にあつては当該延滞税特例基準割合に年一パーセントの割合を加算した割合（当該加算した割合が年七・三パーセントの割合を超える場合には、年七・三パーセントの割合）とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の二の六", "（保険料の免除に要する費用の財源の特例）", "2026-10-01", "（保険料の免除に要する費用の財源の特例）\n附則 第九条の二の六　令和八年度から令和十年度までの間における第八十八条の三第三項の規定の適用については、同項中「子ども・子育て支援納付金」とあるのは、「子ども・子育て支援納付金及び同法第七十一条の二十六第二項に規定する子ども・子育て支援特例公債の発行収入金」とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の三", "（旧陸軍共済組合等の組合員であつた期間を有する者に対する老齢年金の支給）", "2026-10-01", "（旧陸軍共済組合等の組合員であつた期間を有する者に対する老齢年金の支給）\n附則 第九条の三　第一号被保険者としての被保険者期間に係る保険料納付済期間、保険料免除期間及び旧陸軍共済組合令（昭和十五年勅令第九百四十七号）に基づく旧陸軍共済組合その他政令で定める共済組合の組合員であつた期間であつて政令で定める期間を合算した期間が十年以上である者が六十五歳に達したときは、その者に老齢年金を支給する。ただし、当該保険料納付済期間と当該保険料免除期間とを合算した期間が一年以上であり、かつ、第二十六条ただし書に該当する場合に限る。\n２　前項の規定により支給する老齢年金の額は、第一号被保険者としての被保険者期間に係る保険料納付済期間及び保険料免除期間につき、第二十七条の規定の例によつて計算した額とする。\n３　第一項の規定による老齢年金は、第三章（第二節を除く。）及び第七章から第十章まで並びに厚生年金保険法第三十八条の規定の適用については、老齢基礎年金とみなす。\n４　第二十八条、附則第九条の二（同条第一項ただし書を除く。）、第九条の二の三及び第九条の二の四の規定は、第一項に規定する要件に該当する者について準用する。この場合において、附則第九条の二第一項中「保険料納付済期間又は保険料免除期間を有する」とあるのは「附則第九条の三第一項に規定する要件に該当する」と、同条第三項中「第二十六条」とあるのは「附則第九条の三第一項」と読み替えるものとする。\n５　第一項の規定による老齢年金の受給権は、受給権者が死亡したときは、消滅する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の三の二", "（日本国籍を有しない者に対する脱退一時金の支給）", "2026-10-01", "（日本国籍を有しない者に対する脱退一時金の支給）\n附則 第九条の三の二　当分の間、保険料納付済期間等の月数（請求の日の前日において請求の日の属する月の前月までの第一号被保険者としての被保険者期間に係る保険料納付済期間の月数、保険料四分の一免除期間の月数の四分の三に相当する月数、保険料半額免除期間の月数の二分の一に相当する月数及び保険料四分の三免除期間の月数の四分の一に相当する月数を合算した月数をいう。第三項において同じ。）が六月以上である日本国籍を有しない者（被保険者でない者に限る。）であつて、第二十六条ただし書に該当するものその他これに準ずるものとして政令で定めるものは、脱退一時金の支給を請求することができる。ただし、その者が次の各号のいずれかに該当するときは、この限りでない。\n一　日本国内に住所を有するとき。\n二　障害基礎年金その他政令で定める給付の受給権を有したことがあるとき。\n三　最後に被保険者の資格を喪失した日（同日において日本国内に住所を有していた者にあつては、同日後初めて、日本国内に住所を有しなくなつた日）から起算して二年を経過しているとき。\n２　前項の請求があつたときは、その請求をした者に脱退一時金を支給する。\n３　脱退一時金の額は、基準月（請求の日の属する月の前月までの第一号被保険者としての被保険者期間（保険料納付済期間、保険料四分の一免除期間、保険料半額免除期間又は保険料四分の三免除期間に限る。）に属する月のうち同日の前日における直近の月をいう。）の属する年度における保険料の額に二分の一を乗じて得た額に保険料納付済期間等の月数に応じて政令で定める数を乗じて得た額とする。\n４　脱退一時金の支給を受けたときは、支給を受けた者は、その額の計算の基礎となつた第一号被保険者としての被保険者であつた期間は、被保険者でなかつたものとみなす。\n５　脱退一時金に関する処分に不服がある者は、社会保険審査会に対して審査請求をすることができる。\n６　第百一条第三項から第五項まで及び第百一条の二の規定は、前項の審査請求について準用する。この場合において、これらの規定に関し必要な技術的読替えは、政令で定める。\n７　第十六条、第十九条第一項、第四項及び第五項、第二十三条、第二十四条、第百五条第四項、第百七条第一項並びに第百十一条の規定は、脱退一時金について準用する。この場合において、これらの規定に関し必要な技術的読替えは、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の四", "（基礎年金の支払）", "2026-10-01", "（基礎年金の支払）\n附則 第九条の四　基礎年金の支払に関する事務は、政令で定めるところにより、政令で定める者に行わせることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の四の二", "（第三号被保険者としての被保険者期間の特例）", "2026-10-01", "（第三号被保険者としての被保険者期間の特例）\n附則 第九条の四の二　被保険者又は被保険者であつた者は、第三号被保険者としての被保険者期間（昭和六十一年四月から公的年金制度の健全性及び信頼性の確保のための厚生年金保険法等の一部を改正する法律（平成二十五年法律第六十三号。次条第一項において「平成二十五年改正法」という。）附則第一条第二号に掲げる規定の施行の日（以下「平成二十五年改正法一部施行日」という。）の属する月の前月までの間にある保険料納付済期間（政令で定める期間を除く。）に限る。）のうち、第一号被保険者としての被保険者期間として第十四条の規定により記録した事項の訂正がなされた期間（附則第九条の四の六第一項及び第二項において「不整合期間」という。）であつて、当該訂正がなされたときにおいて保険料を徴収する権利が時効によつて消滅しているもの（以下「時効消滅不整合期間」という。）について、厚生労働大臣に届出をすることができる。\n２　前項の規定により届出が行われたときは、当該届出に係る時効消滅不整合期間（第四項及び次条第一項において「特定期間」という。）については、この法律その他の政令で定める法令の規定を適用する場合においては、当該届出が行われた日以後、第九十条の三第一項の規定により納付することを要しないものとされた保険料に係る期間とみなすほか、これらの規定の適用に関し必要な事項は、政令で定める。\n３　次条第一項の規定その他政令で定める規定により保険料の納付が行われたときは、納付が行われた日以後、当該納付に係る月については、前項の規定は、適用しない。\n４　特定期間を有する者に対する昭和六十年改正法附則第十八条の規定の適用については、同条第一項中「同日以後の国民年金の被保険者期間」とあるのは、「同日以後に同法附則第九条の四の二第二項の規定により同法第九十条の三第一項の規定により納付することを要しないものとされた保険料に係る期間とみなされた期間」とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の四の三", "（特定保険料の納付）", "2026-10-01", "（特定保険料の納付）\n附則 第九条の四の三　平成二十五年改正法附則第九十八条の政令で定める日の翌日から起算して三年を経過する日（以下「特定保険料納付期限日」という。）までの間において、被保険者又は被保険者であつた者（特定期間を有する者に限る。）は、厚生労働大臣の承認を受け、特定期間のうち、保険料納付済期間以外の期間であつて、その者が五十歳以上六十歳未満であつた期間（その者が六十歳未満である場合にあつては、承認の日の属する月前十年以内の期間）の各月につき、承認の日の属する月前十年以内の期間の各月の保険料に相当する額に政令で定める額を加算した額のうち最も高い額（承認の日の属する月前十年以内の期間にあつては、当該加算した額）の保険料（以下この条及び附則第九条の四の九第四項において「特定保険料」という。）を納付することができる。\n２　前項の規定による特定保険料の納付は、先に経過した月の保険料に係る特定保険料から順次に行うものとする。\n３　第一項の規定により特定保険料の納付が行われたときは、納付が行われた日に、納付に係る月の保険料が納付されたものとみなす。\n４　老齢基礎年金の受給権者が第一項の規定による特定保険料の納付を行つたときは、納付が行われた日の属する月の翌月から、年金額を改定する。ただし、次条に規定する特定受給者については、特定保険料納付期限日の属する月の翌月から、年金額を改定する。\n５　前各項に定めるもののほか、特定保険料の納付手続その他特定保険料の納付について必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の四の四", "（特定受給者の老齢基礎年金等の特例）", "2026-10-01", "（特定受給者の老齢基礎年金等の特例）\n附則 第九条の四の四　平成二十五年改正法一部施行日以後に第十四条の規定により記録した事項の訂正がなされたことにより時効消滅不整合期間となつた期間を有する者であつて、平成二十五年改正法一部施行日において当該時効消滅不整合期間となつた期間が保険料納付済期間であるものとして老齢基礎年金又は厚生年金保険法に基づく老齢給付等を受けているもの（これらの給付の全部につき支給が停止されている者を含む。次条において「特定受給者」という。）が有する当該時効消滅不整合期間となつた期間については、この法律その他の政令で定める法令の規定（老齢基礎年金又は厚生年金保険法に基づく老齢給付等に係るものに限る。）を適用する場合においては、特定保険料納付期限日までの間、保険料納付済期間とみなす。この場合において、附則第九条の四の二第二項の規定は、適用しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の四の五", "（特定保険料納付期限日の属する月の翌月以後の特定受給者の老齢基礎年金の額）", "2026-10-01", "（特定保険料納付期限日の属する月の翌月以後の特定受給者の老齢基礎年金の額）\n附則 第九条の四の五　特定受給者に支給する特定保険料納付期限日の属する月の翌月以後の月分の老齢基礎年金の額については、訂正後年金額（第二十七条及び第二十八条並びに附則第九条の二及び第九条の二の二並びに昭和六十年改正法附則第十七条の規定に定める額をいう。）が訂正前年金額（前条に規定する時効消滅不整合期間となつた期間を保険料納付済期間とみなして第二十七条及び第二十八条並びに附則第九条の二及び第九条の二の二並びに昭和六十年改正法附則第十七条の規定を適用した場合におけるこれらの規定に定める額をいう。）に百分の九十を乗じて得た額（以下この条において「減額下限額」という。）に満たないときは、第二十七条及び第二十八条並びに附則第九条の二及び第九条の二の二並びに昭和六十年改正法附則第十七条の規定にかかわらず、減額下限額に相当する額とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の四の六", "（不整合期間を有する者の障害基礎年金等に係る特例）", "2026-10-01", "（不整合期間を有する者の障害基礎年金等に係る特例）\n附則 第九条の四の六　平成二十五年改正法一部施行日以後に第十四条の規定により記録した事項の訂正がなされたことにより不整合期間となつた期間を有する者であつて、平成二十五年改正法一部施行日において当該不整合期間となつた期間が保険料納付済期間であるものとして障害基礎年金又は厚生年金保険法その他の政令で定める法令に基づく障害を支給事由とする年金たる給付を受けているもの（これらの給付の全部につき支給が停止されている者を含む。）の当該不整合期間となつた期間については、この法律その他の政令で定める法令の規定（これらの給付に係るものに限る。）を適用する場合においては、保険料納付済期間とみなす。\n２　平成二十五年改正法一部施行日以後に第十四条の規定により記録した事項の訂正がなされたことにより不整合期間となつた期間を有する者の死亡に係る遺族基礎年金又は厚生年金保険法その他の政令で定める法令に基づく死亡を支給事由とする年金たる給付であつて、平成二十五年改正法一部施行日において当該不整合期間となつた期間が保険料納付済期間であるものとして支給されているもの（これらの給付の全部につき支給が停止されているものを含む。）の受給資格要件たる期間の計算の基礎となる当該不整合期間となつた期間については、この法律その他の政令で定める法令の規定（これらの給付に係るものに限る。）を適用する場合においては、保険料納付済期間とみなす。\n３　附則第九条の四の二第一項の規定により届出が行われたときは、当該届出が行われた日以後、当該届出に係る期間については、第一項の規定は、適用しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の四の七", "（特定事由に係る申出等の特例）", "2026-10-01", "（特定事由に係る申出等の特例）\n附則 第九条の四の七　被保険者又は被保険者であつた者は、次の各号のいずれかに該当するときは、厚生労働大臣にその旨の申出をすることができる。\n一　特定事由（この法律その他の政令で定める法令の規定に基づいて行われるべき事務の処理が行われなかつたこと又はその処理が著しく不当であることをいう。以下この条及び附則第九条の四の九から第九条の四の十一までにおいて同じ。）により特定手続（第八十七条の二第一項の申出その他の政令で定める手続をいう。以下この条において同じ。）をすることができなくなつたとき。\n二　特定事由により特定手続を遅滞したとき。\n２　厚生労働大臣は、前項の申出に理由があると認めるときは、その申出を承認するものとする。\n３　第一項の申出をした者が前項の規定による承認を受けた場合において、特定事由がなければ特定手続が行われていたと認められるときに当該特定手続が行われていたとしたならば当該特定手続に係る規定により当該申出をした者が被保険者となる期間があるときは、当該期間は、この法律その他の政令で定める法令の規定（第八十七条第一項及び第二項並びに第八十八条第一項の規定その他政令で定める規定を除く。）を適用する場合においては、当該申出のあつた日以後、当該特定手続に係る規定による被保険者としての被保険者期間（附則第九条の四の九第一項第二号において「特定被保険者期間」という。）とみなす。\n４　第一項の申出をした者が第二項の規定による承認を受けた場合において、特定事由がなければ特定手続が行われていたと認められるときに当該特定手続が行われていたとしたならば当該特定手続に係る規定によりその一部の額につき保険料を納付することを要しないものとされる期間があるときは、当該期間は、この法律その他の政令で定める法令の規定を適用する場合においては、当該申出のあつた日以後、当該特定手続に係る規定によりその一部の額につき納付することを要しないものとされた保険料に係る期間（附則第九条の四の九第一項第三号及び第九条の四の十一第一項第二号において「特定一部免除期間」という。）とみなす。ただし、当該申出をした者がこれを希望しない期間については、この限りでない。\n５　第一項の申出をした者が第二項の規定による承認を受けた場合において、特定事由がなければ特定手続が行われていたと認められるときに当該特定手続が行われていたとしたならば当該特定手続に係る規定により当該申出をした者が付加保険料（第八十七条の二第一項の規定による保険料をいう。以下この条並びに附則第九条の四の九第一項第一号及び第九条の四の十において同じ。）を納付する者となる期間があるときは、当該期間は、この法律その他の政令で定める法令の規定（第八十七条第一項及び第二項並びに第八十八条第一項の規定その他政令で定める規定を除く。）を適用する場合においては、当該申出のあつた日以後、当該特定手続に係る規定により付加保険料を納付する者である期間（附則第九条の四の十第一項第二号において「特定付加納付期間」という。）とみなす。\n６　第一項の申出をした者が第二項の規定による承認を受けた場合において、特定事由がなければ特定手続が行われていたと認められるときに当該特定手続が行われていたとしたならば当該特定手続に係る規定により保険料を納付することを要しないものとされる期間（以下この項から第八項までにおいて「全額免除対象期間」という。）があるときは、当該全額免除対象期間は、この法律その他の政令で定める法令の規定を適用する場合においては、当該申出のあつた日以後、当該特定手続に係る規定により納付することを要しないものとされた保険料に係る期間（次項及び第八項並びに附則第九条の四の十一第一項第三号において「特定全額免除期間」という。）とみなす。ただし、当該申出をした者がこれを希望しない期間については、この限りでない。\n７　老齢基礎年金の受給権者が第二項の規定による承認を受けた場合において、前項の規定により全額免除対象期間（第九十条の三第一項の規定により納付することを要しないものとされた保険料に係るものを除く。）が特定全額免除期間とみなされたときは、第一項の申出のあつた日の属する月の翌月から、年金額を改定する。\n８　第六項の規定により全額免除対象期間が特定全額免除期間とみなされた者に対する昭和六十年改正法附則第十八条の規定の適用については、同条第一項中「同日以後の国民年金の被保険者期間」とあるのは、「同日以後に同法附則第九条の四の七第六項の規定により保険料免除期間」とする。\n９　厚生労働大臣は、厚生労働省令で、第二項の規定による承認の基準を定めるものとする。\n１０　厚生労働大臣は、前項の厚生労働省令を定め、又は変更しようとするときは、あらかじめ、社会保障審議会に諮問しなければならない。\n１１　前各項に定めるもののほか、第一項の申出の手続その他前各項の規定の適用に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の四の八", "（昭和六十一年三月三十一日以前の期間についての特定事由に係る申出等）", "2026-10-01", "（昭和六十一年三月三十一日以前の期間についての特定事由に係る申出等）\n附則 第九条の四の八　昭和六十一年三月三十一日以前の期間について、前条の規定を適用する場合においては、同条第六項中「当該特定手続に係る規定により納付することを要しないものとされた保険料に係る期間」とあるのは「昭和六十年改正法第一条の規定による改正前の第五条第四項に規定する保険料免除期間」とするほか、同条の規定の適用に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の四の九", "（特定事由に係る保険料の納付の特例）", "2026-10-01", "（特定事由に係る保険料の納付の特例）\n附則 第九条の四の九　被保険者又は被保険者であつた者は、次の各号のいずれかに該当する期間（保険料納付済期間を除く。第三項において「対象期間」という。）を有するときは、厚生労働大臣にその旨の申出をすることができる。\n一　特定事由により保険料（第九十条の二第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料にあつてはその一部の額以外の残余の額とし、付加保険料を除く。以下この条において同じ。）を納付することができなくなつたと認められる期間\n二　附則第九条の四の七第三項の規定により特定被保険者期間とみなされた期間\n三　附則第九条の四の七第四項の規定により特定一部免除期間とみなされた期間\n２　厚生労働大臣は、前項の申出（同項第一号に係るものに限る。）に理由があると認めるとき、又は同項の申出（同項第二号又は第三号に係るものに限る。）があつたときは、その申出を承認するものとする。\n３　第一項の申出をした者は、前項の規定による承認を受けたときは、当該承認に係る対象期間の各月につき、当該各月の保険料に相当する額の保険料（以下この条において「特例保険料」という。）を納付することができる。\n４　第一項の申出（同項第一号に係るものに限る。）をした者が特定事由により納付することができなくなつた保険料が、特定保険料その他の政令で定める保険料であるときは、特例保険料の額は、前項の規定にかかわらず、政令で定める額とする。\n５　第三項の規定による特例保険料の納付は、先に経過した月の保険料に係る特例保険料から順次に行うものとする。\n６　第三項の規定により特例保険料の納付が行われたときは、第一項の申出のあつた日に、納付に係る月の保険料が納付されたものとみなす。\n７　老齢基礎年金の受給権者が第三項の規定による特例保険料の納付を行つたときは、第一項の申出のあつた日の属する月の翌月から、年金額を改定する。\n８　第三項の規定により特例保険料を納付した者に対する昭和六十年改正法附則第十八条の規定の適用については、同条第一項中「同日以後の国民年金の被保険者期間」とあるのは、「同日以後に同法附則第九条の四の九第三項の規定による納付が行われたことにより保険料納付済期間又は保険料免除期間」とする。\n９　附則第九条の四の七第九項及び第十項の規定は、第二項の規定による承認について準用する。\n１０　前各項に定めるもののほか、第一項の申出の手続その他前各項の規定の適用に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の四の十", "（特定事由に係る付加保険料の納付の特例）", "2026-10-01", "（特定事由に係る付加保険料の納付の特例）\n附則 第九条の四の十　被保険者又は被保険者であつた者は、次の各号のいずれかに該当する期間（付加保険料に係る保険料納付済期間を除く。第三項において「付加対象期間」という。）を有するときは、厚生労働大臣にその旨の申出をすることができる。\n一　特定事由により付加保険料を納付することができなくなつたと認められる期間\n二　附則第九条の四の七第五項の規定により特定付加納付期間とみなされた期間\n２　厚生労働大臣は、前項の申出（同項第一号に係るものに限る。）に理由があると認めるとき、又は同項の申出（同項第二号に係るものに限る。）があつたときは、その申出を承認するものとする。\n３　第一項の申出をした者は、前項の規定による承認を受けたときは、当該承認に係る付加対象期間の各月につき、当該各月の付加保険料に相当する額の保険料（次項及び第六項において「特例付加保険料」という。）を納付することができる。\n４　前項の規定による特例付加保険料の納付は、保険料の納付が行われた月についてのみ行うことができる。\n５　前条第五項から第七項までの規定は、第三項の場合に準用する。\n６　老齢基礎年金の受給権者（付加保険料に係る保険料納付済期間を有する者を除く。）が第三項の規定による特例付加保険料の納付を行つた場合における第四十三条の規定の適用については、同条中「老齢基礎年金の受給権を取得した」とあるのは、「附則第九条の四の十第一項の規定による申出をした」とする。\n７　附則第九条の四の七第九項及び第十項の規定は、第二項の規定による承認について準用する。\n８　前各項に定めるもののほか、第一項の申出の手続その他前各項の規定の適用に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の四の十一", "（特定事由に係る保険料の追納の特例）", "2026-10-01", "（特定事由に係る保険料の追納の特例）\n附則 第九条の四の十一　被保険者又は被保険者であつた者は、次の各号のいずれかに該当する期間（保険料納付済期間を除く。第三項において「追納対象期間」という。）を有するときは、厚生労働大臣にその旨の申出をすることができる。\n一　特定事由により第九十四条の規定による追納をすることができなくなつたと認められる期間\n二　附則第九条の四の七第四項の規定により特定一部免除期間とみなされた期間\n三　附則第九条の四の七第六項の規定により特定全額免除期間とみなされた期間\n２　厚生労働大臣は、前項の申出（同項第一号に係るものに限る。）に理由があると認めるとき、又は同項の申出（同項第二号又は第三号に係るものに限る。）があつたときは、その申出を承認するものとする。\n３　第一項の申出をした者は、前項の規定による承認を受けたときは、当該承認に係る追納対象期間の各月の保険料（第八十九条第一項、第九十条第一項又は第九十条の三第一項の規定により納付することを要しないものとされた保険料及び第九十条の二第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料に限る。）の全部又は一部につき追納をすることができる。ただし、同条第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料については、その残余の額につき納付されたときに限る。\n４　前項の規定による追納は、先に経過した月の分の保険料から順次に行うものとする。\n５　第三項の場合において追納すべき額は、当該追納に係る期間の各月の保険料の額に政令で定める額を加算した額とする。\n６　附則第九条の四の九第六項から第八項までの規定は、第三項の場合に準用する。この場合において、必要な読替えは、政令で定める。\n７　附則第九条の四の七第九項及び第十項の規定は、第二項の規定による承認について準用する。\n８　前各項に定めるもののほか、第一項の申出の手続その他前各項の規定の適用に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の四の十二", "（昭和六十一年三月三十一日以前の期間についての特定事由に係る保険料の納付等）", "2026-10-01", "（昭和六十一年三月三十一日以前の期間についての特定事由に係る保険料の納付等）\n附則 第九条の四の十二　昭和六十一年三月三十一日以前の期間について、前三条の規定を適用する場合においては、附則第九条の四の九第六項の規定により保険料が納付されたものとみなされた期間は、同条第一項の申出のあつた日以後、昭和六十年改正法第一条の規定による改正前の第五条第三項に規定する保険料納付済期間とみなすほか、前三条の規定の適用に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九条の五", "（独立行政法人福祉医療機構による債権の管理及び回収の業務）", "2026-10-01", "（独立行政法人福祉医療機構による債権の管理及び回収の業務）\n附則 第九条の五　政府は、国民年金事業の円滑な実施を図るため、年金積立金管理運用独立行政法人法附則第十四条の規定による廃止前の年金福祉事業団の解散及び業務の承継等に関する法律（平成十二年法律第二十号）第十二条第一項に規定する債権の管理及び回収の業務を、当該債権の回収が終了するまでの間、独立行政法人福祉医療機構に行わせるものとする。\n２　政府は、国民年金事業の円滑な実施を図るため、年金制度の機能強化のための国民年金法等の一部を改正する法律（令和二年法律第四十号）第二十八条の規定による改正前の独立行政法人福祉医療機構法（平成十四年法律第百六十六号）第十二条第一項第十二号に規定する小口の資金の貸付けに係る債権の管理及び回収の業務を、令和九年三月三十一日までの間、独立行政法人福祉医療機構に行わせるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十条", "（機構への厚生労働大臣の権限に係る事務の委任等）", "2026-10-01", "（機構への厚生労働大臣の権限に係る事務の委任等）\n附則 第十条　国民年金法等の一部を改正する法律（平成十六年法律第百四号）附則第十九条その他この法律の改正に伴う経過措置を定める規定であつて厚生労働省令で定めるものによる厚生労働大臣の権限については、日本年金機構法（平成十九年法律第百九号）附則第二十条の規 <script type="application/json" id="cfg">{"title": "国民年金法 条文立法史ノート", "short": "国年法ノート", "iconColor": ["#8a5a1c", "#6c4613"], "lawName": "国民年金法", "selfRx": "国民年金法|国年法", "lastArticle": 148, "prefix": "npa", "subjects": "政府|厚生労働大臣|日本年金機構|機構|市町村長|市町村|第1号被保険者|第2号被保険者|第3号被保険者|被保険者|受給権者|加入員|基金|連合会|配偶者|何人", "nolink": [], "notes": {}, "kaiseiNote": "改正法の附則（国年法の条文ではありません）", "tag": {"old": "制定|1959年|昭和34年|昭34", "amend": "改正|新設|追加|施行|改革|一元化|\\d{4}年|昭和\\d+年|平成|令和|後年|法律\\d+号|法律第", "other": "plain"}, "tagKey": [["1959年制定", "制定当時（1959年）の記述"], ["1985年改正", "後年の改正・施行、後年の通達・国会審議"], ["現行", "現行の条文・現在の取扱い"], ["公的法令", "時点を表さない見出し（資料の種類・説明の観点など）"]], "homeNote": "収録範囲は、本則（第1条～第148条）と本法附則（2026年10月1日施行版e-Gov法令XMLに掲載された条項）です。別の改正法に付された附則は、Excelの記載のとおり収録対象外です。", "aboutHtml": "    <h3>データの出どころ<\/h3>\n    <p>Excel教材（条文シート12枚：第1条～第148条、附則シート1枚：本法附則、根拠資料一覧シート1枚、正式原文控えシート1枚）の各欄を、加工せずに表示しています。各欄の見出しは、シートごとの列名をそのまま使っています。シート上部の注記も、各シートの記載のまま表示しています。<\/p>\n    <p>条文欄は、Excelの記載のとおり、数値の漢数字を算用数字にした学習用表記です。変換前の表記は、各条文の枠の下の「変換前の条文表記（漢数字）」で確認できます（Excel「正式原文控え」シートの記載。同シートの「資料・照合元」欄のとおり、e-Gov法令XMLから転記されたものです）。<\/p>\n    <p>章の区分は、国民年金法の目次（第1章～第10章）によります（厚生労働省 法令等データベース掲載の国民年金法、2026年10月17日確認）。節の見出しは、Excelの見出し行（「第3章　給付　第1節　通則」など）をそのまま使っています。<\/p>\n    <p>収録範囲は、本則（第1条～第148条）と本法附則です。別の改正法に付された附則は、Excelの記載のとおり収録対象外です。<\/p>\n    <h3>過去問欄<\/h3>\n    <p>Excelの「過去問出題年」欄の記載をそのまま表示しています。「—」は、Excelの記載どおりの表示であり、「出題がない」と確定したことを意味するものではありません。<\/p>\n    <h3>根拠資料・検証<\/h3>\n    <p>「根拠資料一覧」シート（209行）は、一覧の「根拠資料」から、行を省かずに見られます。「対応内容」欄に「第○条」と条番号が書かれている行は、その条のページにも表示しています（範囲で書かれた行や、条番号のない行は、資料一覧にだけ表示しています）。「検証状態」欄の記載も、そのまま表示しています。<\/p>\n    <p>「正式原文控え」シートは、一覧の「検証・資料」から、表のまま見られます。<\/p>\n    <h3>ツールでの表示調整（2026年10月17日、Excel修正版で再作成）<\/h3>\n    <p>1．算用数字化で項（「2　」）と号（「1　」）の書き方が同じになっているため、字下げは「正式原文控え」の表記（項は「２」、号は「一」）を、番号付きの行の順に当てて見分けています（全303件で行の数が一致することを確認）。<\/p>\n    <p>2．条文中の「第○条」は、国民年金法の条文を指す箇所に限ってリンクにしています（2026年10月17日に全791件のリンク先を点検）。他の法令の条（「厚生年金保険法第47条」「住民基本台帳法第30条の38」など）、他の法律で定義された略称に続く条（「平成25年改正法」の附則第1条など）、旧条番号（「旧第14条の2」など）、【】の見出しの中の条番号、附則の各条の見出し（「附則 第1条　」）はリンクにしていません。「附則第9条の4の7第1項、第9条の4の9第1項」のように附則の条から続く列挙は、後ろの条も附則の条としてリンクしています。リンクを押すと参照先の条文をその場に重ねて表示し、「第○条第○項」の場合はその項に色を付けます。<\/p>\n    <p>3．【】の見出しは、制定時（1959年）、後年の改正・施行、現行、時点を表さない見出し（「公的法令」など）を色で分けています。色分けは見出しの語句による機械的な判定です。<\/p>\n    <p>4．「数字・期間」「主体」「要件・例外」の印は、語句の機械的な検出によるものです。既定では表示していません。<\/p>\n", "srcName": "根拠資料", "srcCol": "対応内容"}</script>

  const yrs = kako(e).n;

      <h3 id="peek-t">${esc(e.label)}${top.kou ? `第${top.kou}項` : ''}${e.caption ? `<small>（${esc(e.caption)}）</small>` : ''}</h3></div>
      <button class="peek-x" id="peek-x" aria-label="閉じる" title="閉じる（Esc）">×</button></div>
    <div class="peek-tools">${prev ? `<button class="btn" id="peek-back">‹ ${esc(E[prev.key].label)}に戻る</button>` : ''}

      <div class="law">${(PEEKSELF = top.key, lawHtml(e))}</div></div>`;
  PEEKSELF = null;
  box.hidden = false; $('#peekscrim').hidden = false;

  box.querySelector('.peek-b').scrollTop = 0;

}

// 現行条文：本則は「削除」以外、本法附則は【現行掲載条文】のもの、改正法附則はe-Gov掲載のため全件
function isCurrent(k){
  const e = E[k];
  if (e.status === '削除') return false;
  if (e.scope === 'fusoku' && e.status && tagClass(e.status) === 'gone') return false;
  return true;
}
// neighbours for 前へ／次へ・← →・swipe; with 「現行条文だけ」 on, deleted / historical articles are skipped
function neighbours(k){
  const o = ORDER[E[k].scope], i = o.indexOf(k), ok = x => !UI.now || isCurrent(x);
  let p = null, n = null;
  for (let j = i - 1; j >= 0; j--) if (ok(o[j])) { p = o[j]; break; }
  for (let j = i + 1; j < o.length; j++) if (ok(o[j])) { n = o[j]; break; }
  return {prev: p ? E[p] : null, next: n ? E[n] : null};
}
function passes(k){
  const r = rec(k);
  if ($('#f-rev').checked && r.st !== 'review') return false;
  if ($('#f-memo').checked && !r.memo) return false;
  if ($('#f-ex').checked && !kako(E[k]).years.length) return false;
  if ($('#f-now').checked && !isCurrent(k)) return false;
  return true;
}
function itemHtml(k, dotH){
  const e = E[k], sub = e.caption || e.status || '';
  return `<button class="item" data-go="${k}"${k === CUR ? ' aria-current="true"' : ''}>${dotH !== undefined ? `<i class="chdot" ${hv(dotH)}></i>` : '<i></i>'}<span class="tx">${esc(e.label)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>${marksFor(k, true)}</button>`;
}
function chProgress(keys){
  const d = keys.filter(k => rec(k).st === 'done').length, v = keys.filter(k => rec(k).st === 'review').length;
  return {d, v, n: keys.length};
}
function renderList(){

  let h = '';
  if (SCOPE === 'honsoku'){
    UI.open = UI.open || {};
    const filtering = $('#f-rev').checked || $('#f-memo').checked || $('#f-ex').checked;
    CH.forEach((c, i) => {
      const keys = c.keys.filter(passes); if (!keys.length) return;

      const p = chProgress(c.keys);
      h += `<button class="chh chbg chc" ${hv(c.h)} data-ch="${i}" aria-expanded="${open}"><b>${esc(c.no)}</b><span>${esc(c.name)}</span><small>${p.d}/${p.n}</small></button>`;
      if (open){ let sec = null;
        keys.forEach(k => { const s2 = (E[k].heads || []).slice(1).join('　'); if (s2 && s2 !== sec) h += `<div class="grp sec">${esc(s2)}</div>`; sec = s2; h += itemHtml(k, c.h); }); }
    });
  } else {
    let last = '';
    ORDER[SCOPE].forEach(k => {
      if (!passes(k)) return;
      const e = E[k];
      const g = SCOPE === 'kaisei' ? (e.label.match(/^(昭和|平成|令和)/) || ['その他'])[0] + 'の改正法' : (SH[e.sheet].head || e.sheet);
      if (g !== last){ last = g; h += `<div class="grp">${esc(g)}</div>`; }
      h += itemHtml(k);

  list.innerHTML = h || '<p class="grp">該当する条文はありません。</p>';

}

      Object.keys(r).forEach(k => { if (E[k]) { REC[k] = Object.assign({}, REC[k], r[k]); n++; } }); saveRec();
      let m = 0; if (j.marker) Object.keys(j.marker).forEach(k => { const v = normHL(j.marker[k]); if (E[k] && v) { HL[k] = v; m++; } }); saveHL();

      catch(e) { $('#impmsg').textContent = '読み込めませんでした。書き出したJSONファイルを選んでください。'; } };

  });

}
function sourcesPage(filter){

/* ---------- reference sheets (verification records etc.), shown whole ---------- */
const XROWS = {};   // article key -> [[sheet index, row index], ...]
D.extras.forEach((x, xi) => Object.entries(x.hits || {}).forEach(([k, rows]) => rows.forEach(ri => (XROWS[k] = XROWS[k] || []).push([xi, ri]))));
const cellHtml = v => /^https?:\/\/\S+$/.test(v.trim()) ? `<a href="${esc(v.trim())}" target="_blank" rel="noopener">${esc(v.trim())}</a>` : esc(v).replace(/\n/g, '<br>');

  $('#main').scrollTop = 0; closeSide();
}

function xrecHtml(k){

      <span style="color:var(--c-bg);font-weight:700">1 背景</span><span>制定・改正が必要になった社会事情（茶）</span>

      ${(CFG.tagKey || []).map(([t, d]) => `<span>${tagHtml(t)}</span><span>${esc(d)}</span>`).join('')}
      <span><span class="pill done">済</span> <span class="pill rev">復習</span></span><span>学習済み（緑）・要復習（橙）</span>
    </div>
    <p class="saved">時点の色は【】内の語句（制定・改正・現行・削除など）から機械的に決めています。【】の文言そのものはExcelのとおりです。</p>
    <h3>表示上の約束</h3>

    <p>${esc(kaiseiNote)}</p>

/* ---------- search ---------- */
const NFKC = s => (s || '').normalize('NFKC').replace(/\s+/g, '');
const IDX = D.entries.map(e => ({e, f:{条文:NFKC(e.text), 背景:NFKC(e.bg), 議論:NFKC(e.deb), 通達:NFKC(e.tsu), 過去問:NFKC(e.kako)}, label:NFKC(e.label + e.caption)}));
function search(q0){
  CUR = null; renderList();
  const q = NFKC(q0);
  crumb('検索：' + esc(q0));
  if (!q){ home(); return; }
  const m = q.match(/^(附則)?第?(\d+)条?((?:の\d+)*)$/);
  let exact = [];
  if (m){
    const want = [+m[2], ...(m[3].match(/\d+/g)||[]).map(Number)].join('-');
    exact = D.entries.filter(e => e.num && e.num.join('-') === want && (m[1] ? e.scope === 'fusoku' : true));
  }
  const hits = IDX.filter(x => !exact.includes(x.e) && (x.label.includes(q) || Object.values(x.f).some(v => v.includes(q))));
  const res = exact.map(e => IDX[e.i]).concat(hits);
  const snip = x => { for (const [name, v] of Object.entries(x.f)){ const i = v.indexOf(q); if (i >= 0) return `［${name}］` + esc(v.slice(Math.max(0,i-30), i)) + '<mark>' + esc(q) + '</mark>' + esc(v.slice(i+q.length, i+q.length+50)); } return ''; };
  $('#page').innerHTML = `<div class="doc"><h1>検索結果</h1><p class="saved">「${esc(q0)}」　${res.length}件（条文原文・背景・議論・通達・過去問の各欄が対象）</p>
    <div class="hits">${res.map(x => { const c = x.e.ch !== undefined ? CH[x.e.ch] : null; return `<button class="hit" data-go="${x.e.key}"><b>${esc(x.e.label)}</b><small>${c ? esc(c.no) + '　' : ''}${SCOPE_NAME[x.e.scope]}${x.e.caption ? '　' + esc(x.e.caption) : ''}</small><span>${snip(x)}</span></button>`; }).join('') || '<p class="none">見つかりませんでした。語句を短くしてお試しください。</p>'}</div></div>`;
  $('#main').scrollTop = 0; closeSide();
}

/* ---------- routing & events ---------- */
function route(){
  const h = decodeURIComponent((location.hash || '').slice(1));
  if (!h || h === 'home') return home();
  if (h === 'records') return records();
  if (h === 'about') return about();
  if (h === 'src') return sourcesPage('');
  if (h === 'xs') return extrasIndex();
  const xm = h.match(/^x(\d+)$/); if (xm && D.extras[+xm[1]]) return extraPage(+xm[1]);
  if (h.startsWith('q=')) return search(h.slice(2));
  const cm = h.match(/^ch(\d+)$/); if (cm) return chapterPage(+cm[1]);
  if (E[h]) return article(h);
  if (h.startsWith('memo-') || h.startsWith('s-')) return;
  home();
}
function go(t){ if (location.hash === '#' + t) route(); else location.hash = t; }
window.addEventListener('hashchange', () => { closePeek(); route(); syncBack(); syncHL(); });
const narrow = () => window.matchMedia('(max-width:900px)').matches;
function closeSide(){ $('#side').classList.remove('open'); }
function setCollapsed(b){ $('.app').classList.toggle('collapsed', b); UI.collapsed = b; saveUI(); }
$('#menu').addEventListener('click', () => { if (narrow()) $('#side').classList.toggle('open'); else setCollapsed(!$('.app').classList.contains('collapsed')); });
$('#sideclose').addEventListener('click', ev => { ev.stopPropagation(); if (narrow()) closeSide(); else setCollapsed(true); });
$('#scrim').addEventListener('click', closeSide);
$('#peekscrim').addEventListener('click', closePeek);
if (UI.collapsed) $('.app').classList.add('collapsed');
// swipe the list to the left to put it away (phone)
let sx = null, sy = null;
$('#side').addEventListener('touchstart', ev => { sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; }, {passive:true});
$('#side').addEventListener('touchend', ev => { if (sx === null) return; const dx = ev.changedTouches[0].clientX - sx, dy = ev.changedTouches[0].clientY - sy; sx = null;
  if (dx < -70 && Math.abs(dy) < Math.abs(dx) * 0.6) closeSide(); }, {passive:true});
document.addEventListener('click', ev => {
  const a = ev.target.closest('a[href^="#s-"],a[href^="#memo-"]');
  if (a){ ev.preventDefault(); const el = document.getElementById(a.getAttribute('href').slice(1)); if (el){ if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({behavior:'smooth', block:'start'}); } return; }
  const chh = ev.target.closest('.chh');
  if (chh){ const i = chh.dataset.ch; UI.open = UI.open || {}; const open = chh.getAttribute('aria-expanded') === 'true';
    if (open) { delete UI.open[i]; saveUI(); if (CUR && String(E[CUR].ch) === i) { CUR = null; } renderList(); return; }
    UI.open[i] = true; saveUI(); return go('ch' + i); }
  const rf = ev.target.closest('a.ref[data-ref]');
  if (rf){ ev.preventDefault(); openPeek(rf.dataset.ref, +rf.dataset.kou || 0, rf.dataset.from, rf.dataset.hist === '1'); return; }
  const bc = ev.target.closest('#backchip');
  if (bc){ if (ev.target.closest('[data-x]')) { RET = null; syncBack(); return; }
    const r = RET; RET = null; slide(r.key, -1); setTimeout(() => { if (CUR === r.key) $('#main').scrollTop = r.y; }, 420); syncBack(); return; }
  const hb = ev.target.closest('[data-hl]');
  if (hb){ const v = hb.dataset.hl; HLMODE = (hb.id === 'hlbtn') ? (HLMODE ? '' : 'pen') : (HLMODE === v ? 'pen' : v); HLCLR = 0; syncHL(); return; }
  if (ev.target.closest('[data-hloff]')){ HLMODE = ''; HLCLR = 0; syncHL(); return; }
  const hc = ev.target.closest('[data-hlc]'); if (hc){ HLCOL = +hc.dataset.hlc; HLMODE = 'pen'; try{ localStorage.setItem(P + 'hlcol', HLCOL); }catch(e){} syncHL(); return; }
  const hx = ev.target.closest('[data-hlclear]');
  if (hx && CUR){ if (!HLCLR){ HLCLR = 1; hx.textContent = 'もう一度押すとこの条の線が全部消えます'; clearTimeout(hx._t); hx._t = setTimeout(() => { HLCLR = 0; syncHL(); }, 3000); return; }
    HLCLR = 0; delete HL[CUR]; saveHL(); article(CUR); return; }
  const sl = ev.target.closest('[data-slide]'); if (sl){ if (sl.dataset.slide) slide(sl.dataset.slide, +sl.dataset.dir); return; }
  const g = ev.target.closest('[data-go]'); if (g){ go(g.dataset.go); return; }
  const sc = ev.target.closest('[data-scope]');
  if (sc){ SCOPE = sc.dataset.scope; if (SCOPE === 'src') go('src'); else if (SCOPE === 'xs') go('xs'); else { renderList(); if (!CUR || E[CUR].scope !== SCOPE) go(SCOPE === 'honsoku' ? 'home' : ORDER[SCOPE][0]); } return; }
  const st = ev.target.closest('[data-st]');
  if (st && CUR){ const v = st.dataset.st; setRec(CUR, {st: rec(CUR).st === v ? null : v});
    document.querySelectorAll('[data-st]').forEach(b => b.setAttribute('aria-pressed', rec(CUR).st === b.dataset.st)); renderList(); return; }
  const mk = ev.target.closest('[data-mark]');
  if (mk && CUR){ MARKS[mk.dataset.mark] = !MARKS[mk.dataset.mark]; try{ localStorage.setItem(P + 'marks', JSON.stringify(MARKS)); }catch(e){}
    const y = $('#main').scrollTop; article(CUR); $('#main').scrollTop = y; return; }
});
$('#sform').addEventListener('submit', ev => { ev.preventDefault(); const v = $('#q').value.trim(); if (v) go('q=' + v); });
['#f-rev','#f-memo','#f-ex'].forEach(id => $(id).addEventListener('change', renderList));
$('#f-now').checked = !!UI.now;
$('#f-now').addEventListener('change', () => { UI.now = $('#f-now').checked; saveUI();
  if (CUR) { const y = $('#main').scrollTop, open = $('#side').classList.contains('open'); article(CUR); $('#main').scrollTop = y; if (open) $('#side').classList.add('open'); } else renderList(); });
const fsz = $('#fsz');
function applyFs(b){ document.documentElement.classList.toggle('big', b); fsz.setAttribute('aria-pressed', b); }
try { applyFs(JSON.parse(localStorage.getItem(P + 'big') || 'false')); MARKS = Object.assign(MARKS, JSON.parse(localStorage.getItem(P + 'marks') || '{}')); } catch(e) {}
const thm = $('#thm'), THM = {light:'ライト', dark:'ダーク', auto:'端末'};
function applyTheme(t){ if (!THM[t]) t = 'light'; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); thm.textContent = '表示 ' + THM[t]; thm.dataset.t = t; }
try { applyTheme(localStorage.getItem(P + 'theme') || 'light'); } catch(e) { applyTheme('light'); }
thm.addEventListener('click', () => { const nx = {light:'dark', dark:'auto', auto:'light'}[thm.dataset.t]; applyTheme(nx); try{ localStorage.setItem(P + 'theme', nx); }catch(e){} });
fsz.addEventListener('click', () => { const b = !document.documentElement.classList.contains('big'); applyFs(b); try{ localStorage.setItem(P + 'big', JSON.stringify(b)); }catch(e){} });
document.addEventListener('keydown', ev => {
  if (PEEK.length){ if (ev.key === 'Escape') closePeek(); return; }
  if (!CUR || /input|textarea/i.test(document.activeElement.tagName)) return;
  const nb = neighbours(CUR);
  if (ev.key === 'ArrowRight' && nb.next) slide(nb.next.key, 1);
  if (ev.key === 'ArrowLeft' && nb.prev) slide(nb.prev.key, -1);
});
/* slide to the neighbouring article: the page moves out to one side and the next one comes in from the other */
let sliding = false;
const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function slide(key, dir){
  const pg = $('#page');
  if (sliding) return;
  if (reduced() || !pg.animate){ go(key); return; }
  sliding = true;
  pg.animate([{transform:'translateX(0)', opacity:1}, {transform:`translateX(${-dir * 48}px)`, opacity:0}], {duration:150, easing:'ease-in'})
    .finished.then(() => {
      go(key);
      pg.animate([{transform:`translateX(${dir * 48}px)`, opacity:0}, {transform:'translateX(0)', opacity:1}], {duration:200, easing:'ease-out'})
        .finished.then(() => { sliding = false; }, () => { sliding = false; });
    }, () => { sliding = false; go(key); });
}
// swipe on touch screens (tables that scroll sideways are left alone)
let tx = null, ty = null;
$('#page').addEventListener('touchstart', ev => { if (ev.target.closest('.tw,textarea,input') || (HLMODE && ev.target.closest('[data-hlz]'))) { tx = null; return; } tx = ev.touches[0].clientX; ty = ev.touches[0].clientY; }, {passive:true});
$('#page').addEventListener('touchend', ev => {
  if (tx === null || !CUR) return;
  const dx = ev.changedTouches[0].clientX - tx, dy = ev.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
  const nb = neighbours(CUR);
  if (dx < 0 && nb.next) slide(nb.next.key, 1);
  if (dx > 0 && nb.prev) slide(nb.prev.key, -1);
}, {passive:true});
(() => { let n = 0; document.querySelectorAll('.scopes button').forEach(b => { const sc = b.dataset.scope;
  if (sc === 'src') b.textContent = SRCN;
  b.hidden = !(sc === 'src' || (sc === 'xs' ? D.extras.length > 0 : ORDER[sc].length > 0)); if (!b.hidden) n++; });
  $('.scopes').style.gridTemplateColumns = `repeat(${n}, 1fr)`; })();
route(); syncHL();
})();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
