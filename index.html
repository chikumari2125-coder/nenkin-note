基金", "第8款　合併及び分割", "第2目　分割"], "orig": "第百三十七条の三の十一　基金は、前条第一項の期間内に、その債権者に対し、異議があれば一定の期間内に述べるべき旨を公告し、かつ、知れている債権者に対しては、各別にこれを催告しなければならない。ただし、その期間は、二月を下ることができない。\n２　債権者が前項の期間内に吸収分割に対して異議を述べなかつたときは、吸収分割を承認したものとみなす。\n３　債権者が異議を述べたときは、基金は、これに弁済をし、若しくは相当の担保を提供し、又はその債権者に弁済を受けさせることを目的として信託会社若しくは信託業務を営む金融機関に相当の財産を信託しなければならない。ただし、吸収分割をしてもその債権者を害するおそれがないときは、この限りでない。", "ch": 9}, {"key": "h137-3-12", "num": [137, 3, 12], "label": "第137条の3の12", "caption": "", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "〔学習用見出し：吸収分割による権利義務の承継〕\n第137条の3の12　吸収分割承継基金は、吸収分割契約の定めに従い、第137条の3の7第1項の認可を受けた日に、吸収分割基金の権利義務を承継する。\n2　前項の規定にかかわらず、吸収分割基金の債権者であつて、前条第1項の規定による各別の催告を受けなかつたものは、吸収分割契約において吸収分割後に吸収分割基金に対して債務の履行を請求することができないものとされている場合であつても、吸収分割基金に対して、吸収分割基金が第137条の3の7第1項の認可を受けた日に有していた財産の価額を限度として、当該債務の履行を請求することができる。\n3　第1項の規定にかかわらず、吸収分割基金の債権者であつて、前条第1項の規定による各別の催告を受けなかつたものは、吸収分割契約において吸収分割後に吸収分割承継基金に対して債務の履行を請求することができないものとされている場合であつても、吸収分割承継基金に対して、その承継した財産の価額を限度として、当該債務の履行を請求することができる。", "bg": "【2016年・平成28年法律66号】基金の運営をより合理的にし、加入員の利便性も高めるには、組織を再編できる仕組みが必要だった。そこで合併・分割の手続を法律で定め、再編の道を開いた。※条文固有の質疑は未照合。", "deb": "【法案概要・一次資料／実際の質疑ではない】2016年改正で国民年金基金の合併・分割の規定を整備。※条文固有の国会質疑・政府答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度資料】2016年確定拠出年金法等改正の概要（合併・分割規定）。", "kako": "—", "rows": [30], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第8款　合併及び分割", "第2目　分割"], "orig": "第百三十七条の三の十二　吸収分割承継基金は、吸収分割契約の定めに従い、第百三十七条の三の七第一項の認可を受けた日に、吸収分割基金の権利義務を承継する。\n２　前項の規定にかかわらず、吸収分割基金の債権者であつて、前条第一項の規定による各別の催告を受けなかつたものは、吸収分割契約において吸収分割後に吸収分割基金に対して債務の履行を請求することができないものとされている場合であつても、吸収分割基金に対して、吸収分割基金が第百三十七条の三の七第一項の認可を受けた日に有していた財産の価額を限度として、\n当該債務の履行を請求することができる。\n３　第一項の規定にかかわらず、吸収分割基金の債権者であつて、前条第一項の規定による各別の催告を受けなかつたものは、吸収分割契約において吸収分割後に吸収分割承継基金に対して債務の履行を請求することができないものとされている場合であつても、吸収分割承継基金に対して、その承継した財産の価額を限度として、当該債務の履行を請求することができる。", "ch": 9}, {"key": "h137-3-13", "num": [137, 3, 13], "label": "第137条の3の13", "caption": "", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "〔学習用見出し：吸収分割に伴う労働契約の承継〕\n第137条の3の13　会社分割に伴う労働契約の承継等に関する法律（平成12年法律第103号）第2条から第8条まで（第2条第3項各号及び第4条第3項各号を除く。）及び商法等の一部を改正する法律（平成12年法律第90号）附則第5条第1項の規定は、前目の規定により吸収分割基金が吸収分割をする場合について準用する。\nこの場合において、会社分割に伴う労働契約の承継等に関する法律第2条第1項及び第2項中「承継会社等」とあるのは「承継基金」と、同項中「分割会社」とあるのは「分割基金」と、同条第3項中「次の各号に掲げる場合に応じ、当該各号に定める」とあるのは「国民年金法（昭和34年法律第141号）第137条の3の10第1項に規定する議決日から起算して、2週間を経過する」と、同法第3条から第8条まで（第4条第3項を除く。）の規定中「分割会社」とあるのは「分割基金」と、「承継会社等」とあるのは「承継基金」と、同法第4条第3項中「次の各号に掲げる場合に応じ、当該各号に」とあるのは「国民年金法第137条の3の7第1項の認可を受ける日の前日までの日で分割基金が」と読み替えるものとするほか、必要な技術的読替えは、政令で定める。", "bg": "【2016年・平成28年法律66号】基金の運営をより合理的にし、加入員の利便性も高めるには、組織を再編できる仕組みが必要だった。そこで合併・分割の手続を法律で定め、再編の道を開いた。※条文固有の質疑は未照合。", "deb": "【法案概要・一次資料／実際の質疑ではない】2016年改正で国民年金基金の合併・分割の規定を整備。※条文固有の国会質疑・政府答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度資料】2016年確定拠出年金法等改正の概要（合併・分割規定）。", "kako": "—", "rows": [32], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第8款　合併及び分割", "第3目　雑則"], "orig": "第百三十七条の三の十三　会社分割に伴う労働契約の承継等に関する法律（平成十二年法律第百三号）第二条から第八条まで（第二条第三項各号及び第四条第三項各号を除く。）及び商法等の一部を改正する法律（平成十二年法律第九十号）附則第五条第一項の規定は、前目の規定により吸収分割基金が吸収分割をする場合について準用する。\nこの場合において、会社分割に伴う労働契約の承継等に関する法律第二条第一項及び第二項中「承継会社等」とあるのは「承継基金」と、同項中「分割会社」とあるのは「分割基金」と、同条第三項中「次の各号に掲げる場合に応じ、当該各号に定める」とあるのは「国民年金法（昭和三十四年法律第百四十一号）第百三十七条の三の十第一項に規定する議決日から起算して、\n二週間を経過する」と、同法第三条から第八条まで（第四条第三項を除く。）の規定中「分割会社」とあるのは「分割基金」と、「承継会社等」とあるのは「承継基金」と、同法第四条第三項中「次の各号に掲げる場合に応じ、当該各号に」とあるのは「国民年金法第百三十七条の三の七第一項の認可を受ける日の前日までの日で分割基金が」と読み替えるものとするほか、\n必要な技術的読替えは、政令で定める。", "ch": 9}, {"key": "h137-3-14", "num": [137, 3, 14], "label": "第137条の3の14", "caption": "", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "〔学習用見出し：吸収分割に伴う担保権等の取扱い〕\n第137条の3の14　民法第398条の9第3項から第5項まで並びに第398条の10第1項及び第2項並びに事業性融資の推進等に関する法律（令和6年法律第52号）第26条第1項の規定は、前目の規定により吸収分割基金が吸収分割をする場合について準用する。この場合において、民法第398条の9第3項中「前2項」とあるのは、「国民年金法（昭和34年法律第141号）第137条の3の14において準用する次条第1項又は第2項」と読み替えるものとする。", "bg": "【2016年新設】基金が分かれるとき、加入員の権利義務をどう引き継ぐか。その調整を規律した。\n【2024年・令和6年法律52号】事業性融資関連法に伴う準用規定の改正注記を確認。逐条審議は未照合。", "deb": "—", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【法改正】2024年法律第52号に伴う改正注記。", "kako": "—", "rows": [33], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第8款　合併及び分割", "第3目　雑則"], "orig": "第百三十七条の三の十四　民法第三百九十八条の九第三項から第五項まで並びに第三百九十八条の十第一項及び第二項並びに事業性融資の推進等に関する法律（令和六年法律第五十二号）第二十六条第一項の規定は、前目の規定により吸収分割基金が吸収分割をする場合について準用する。この場合において、民法第三百九十八条の九第三項中「前二項」とあるのは、\n「国民年金法（昭和三十四年法律第百四十一号）第百三十七条の三の十四において準用する次条第一項又は第二項」と読み替えるものとする。", "ch": 9}, {"key": "h137-3-15", "num": [137, 3, 15], "label": "第137条の3の15", "caption": "", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "〔学習用見出し：合併・分割後の加入員期間の取扱い〕\n第137条の3の15　吸収合併存続基金が、第137条の3の6の規定により権利義務を承継したときは、吸収合併存続基金に年金の支給に関する義務が承継された者の吸収合併消滅基金の加入員期間は、吸収合併存続基金の加入員期間とみなす。\n2　吸収分割承継基金が、第137条の3の12第1項の規定により権利義務を承継したときは、吸収分割承継基金に年金の支給に関する義務が承継された者の吸収分割基金の加入員期間は、吸収分割承継基金の加入員期間とみなす。", "bg": "【2016年・平成28年法律66号】基金の運営をより合理的にし、加入員の利便性も高めるには、組織を再編できる仕組みが必要だった。そこで合併・分割の手続を法律で定め、再編の道を開いた。※条文固有の質疑は未照合。", "deb": "【法案概要・一次資料／実際の質疑ではない】2016年改正で国民年金基金の合併・分割の規定を整備。※条文固有の国会質疑・政府答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度資料】2016年確定拠出年金法等改正の概要（合併・分割規定）。", "kako": "—", "rows": [34], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第8款　合併及び分割", "第3目　雑則"], "orig": "第百三十七条の三の十五　吸収合併存続基金が、第百三十七条の三の六の規定により権利義務を承継したときは、吸収合併存続基金に年金の支給に関する義務が承継された者の吸収合併消滅基金の加入員期間は、吸収合併存続基金の加入員期間とみなす。\n２　吸収分割承継基金が、第百三十七条の三の十二第一項の規定により権利義務を承継したときは、吸収分割承継基金に年金の支給に関する義務が承継された者の吸収分割基金の加入員期間は、吸収分割承継基金の加入員期間とみなす。", "ch": 9}, {"key": "h137-3-16", "num": [137, 3, 16], "label": "第137条の3の16", "caption": "", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "〔学習用見出し：基金の合併・分割に関する政令への委任〕\n第137条の3の16　この款に定めるもののほか、基金の合併及び分割に関し必要な事項は、政令で定める。", "bg": "【2016年・平成28年法律66号】基金の運営をより合理的にし、加入員の利便性も高めるには、組織を再編できる仕組みが必要だった。そこで合併・分割の手続を法律で定め、再編の道を開いた。※条文固有の質疑は未照合。", "deb": "【法案概要・一次資料／実際の質疑ではない】2016年改正で国民年金基金の合併・分割の規定を整備。※条文固有の国会質疑・政府答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度資料】2016年確定拠出年金法等改正の概要（合併・分割規定）。", "kako": "—", "rows": [35], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第8款　合併及び分割", "第3目　雑則"], "orig": "第百三十七条の三の十六　この款に定めるもののほか、基金の合併及び分割に関し必要な事項は、政令で定める。", "ch": 9}, {"key": "h137-4", "num": [137, 4], "label": "第137条の4", "caption": "連合会", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（連合会）\n第137条の4　基金は、第137条の17第1項に規定する中途脱退者及び解散基金加入員に係る年金及び一時金の支給を共同して行うため、国民年金基金連合会（以下「連合会」という。）を設立することができる。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [8], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第1款　通則"], "orig": "（連合会）\n第百三十七条の四　基金は、第百三十七条の十七第一項に規定する中途脱退者及び解散基金加入員に係る年金及び一時金の支給を共同して行うため、国民年金基金連合会（以下「連合会」という。）を設立することができる。", "ch": 9}, {"key": "h137-4-2", "num": [137, 4, 2], "label": "第137条の4の2", "caption": "法人格", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（法人格）\n第137条の4の2　連合会は、法人とする。\n2　連合会の住所は、その主たる事務所の所在地にあるものとする。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [9], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第1款　通則"], "orig": "（法人格）\n第百三十七条の四の二　連合会は、法人とする。\n２　連合会の住所は、その主たる事務所の所在地にあるものとする。", "ch": 9}, {"key": "h137-4-3", "num": [137, 4, 3], "label": "第137条の4の3", "caption": "名称", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（名称）\n第137条の4の3　連合会は、その名称中に国民年金基金連合会という文字を用いなければならない。\n2　連合会でない者は、国民年金基金連合会という名称を用いてはならない。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [10], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第1款　通則"], "orig": "（名称）\n第百三十七条の四の三　連合会は、その名称中に国民年金基金連合会という文字を用いなければならない。\n２　連合会でない者は、国民年金基金連合会という名称を用いてはならない。", "ch": 9}, {"key": "h137-5", "num": [137, 5], "label": "第137条の5", "caption": "発起人", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（発起人）\n第137条の5　連合会を設立するには、その会員となろうとする2以上の基金が発起人とならなければならない。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [12], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第2款　設立"], "orig": "（発起人）\n第百三十七条の五　連合会を設立するには、その会員となろうとする二以上の基金が発起人とならなければならない。", "ch": 9}, {"key": "h137-6", "num": [137, 6], "label": "第137条の6", "caption": "創立総会", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（創立総会）\n第137条の6　発起人は、規約を作成し、創立総会の日時及び場所とともに公告して、創立総会を開かなければならない。\n2　前項の公告は、会日の2週間前までにしなければならない。\n3　発起人が作成した規約の承認その他設立に必要な事項の決定は、創立総会の議決によらなければならない。\n4　創立総会においては、前項の規約を修正することができる。ただし、会員の資格に関する規定については、この限りでない。\n5　創立総会の議事は、その会日までに発起人に対し設立の同意を申し出た基金の理事長の半数以上が出席して、その出席者の3分の2以上で決する。\n6　前各項に定めるもののほか、議事の手続その他創立総会に関し必要な事項は、政令で定める。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [13], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第2款　設立"], "orig": "（創立総会）\n第百三十七条の六　発起人は、規約を作成し、創立総会の日時及び場所とともに公告して、創立総会を開かなければならない。\n２　前項の公告は、会日の二週間前までにしなければならない。\n３　発起人が作成した規約の承認その他設立に必要な事項の決定は、創立総会の議決によらなければならない。\n４　創立総会においては、前項の規約を修正することができる。ただし、会員の資格に関する規定については、この限りでない。\n５　創立総会の議事は、その会日までに発起人に対し設立の同意を申し出た基金の理事長の半数以上が出席して、その出席者の三分の二以上で決する。\n６　前各項に定めるもののほか、議事の手続その他創立総会に関し必要な事項は、政令で定める。", "ch": 9}, {"key": "h137-7", "num": [137, 7], "label": "第137条の7", "caption": "設立の認可等", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（設立の認可等）\n第137条の7　発起人は、創立総会の終了後遅滞なく、規約その他必要な事項を記載した書面を厚生労働大臣に提出して、設立の認可を受けなければならない。\n2　連合会は、設立の認可を受けた時に成立する。\n3　前条第5項の設立の同意を申し出た基金は、連合会が成立したときは、その成立の日に会員の資格を取得するものとする。\n4　第119条の5の規定は、連合会について準用する。この場合において、同条中「設立委員等」とあるのは、「発起人」と読み替えるものとする。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [14], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第2款　設立"], "orig": "（設立の認可等）\n第百三十七条の七　発起人は、創立総会の終了後遅滞なく、規約その他必要な事項を記載した書面を厚生労働大臣に提出して、設立の認可を受けなければならない。\n２　連合会は、設立の認可を受けた時に成立する。\n３　前条第五項の設立の同意を申し出た基金は、連合会が成立したときは、その成立の日に会員の資格を取得するものとする。\n４　第百十九条の五の規定は、連合会について準用する。この場合において、同条中「設立委員等」とあるのは、「発起人」と読み替えるものとする。", "ch": 9}, {"key": "h137-8", "num": [137, 8], "label": "第137条の8", "caption": "規約", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（規約）\n第137条の8　連合会は、規約をもつて次に掲げる事項を定めなければならない。\n1　名称\n2　事務所の所在地\n3　評議員会に関する事項\n4　役員に関する事項\n5　会員の資格に関する事項\n6　年金及び一時金に関する事項\n7　附帯事業に関する事項\n8　会費に関する事項\n9　資産の管理その他財務に関する事項\n10　解散及び清算に関する事項\n11　業務の委託に関する事項\n12　公告に関する事項\n13　その他組織及び業務に関する重要事項\n2　第120条第3項及び第4項の規定は、連合会の規約について準用する。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [16], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第3款　管理及び会員"], "orig": "（規約）\n第百三十七条の八　連合会は、規約をもつて次に掲げる事項を定めなければならない。\n一　名称\n二　事務所の所在地\n三　評議員会に関する事項\n四　役員に関する事項\n五　会員の資格に関する事項\n六　年金及び一時金に関する事項\n七　附帯事業に関する事項\n八　会費に関する事項\n九　資産の管理その他財務に関する事項\n十　解散及び清算に関する事項\n十一　業務の委託に関する事項\n十二　公告に関する事項\n十三　その他組織及び業務に関する重要事項\n２　第百二十条第三項及び第四項の規定は、連合会の規約について準用する。", "ch": 9}, {"key": "h137-9", "num": [137, 9], "label": "第137条の9", "caption": "準用規定", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（準用規定）\n第137条の9　第121条の規定は、連合会について準用する。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [17], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第3款　管理及び会員"], "orig": "（準用規定）\n第百三十七条の九　第百二十一条の規定は、連合会について準用する。", "ch": 9}, {"key": "h137-10", "num": [137, 10], "label": "第137条の10", "caption": "評議員会", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（評議員会）\n第137条の10　連合会に、評議員会を置く。\n2　評議員会は、評議員をもつて組織する。\n3　評議員は、会員である基金の理事長において互選する。ただし、特別の事情があるときは、規約で定めるところにより、会員である基金の理事長の過半数の同意を得て、連合会の業務の適正な運営及び国民年金基金制度の適切な運用に必要な学識経験を有する者のうちから、理事長が委嘱することを妨げない。\n4　設立当時の評議員は、創立総会において、第137条の6第5項の設立の同意を申し出た基金の理事長のうちから選挙する。\n5　評議員の任期は、2年とする。ただし、補欠の評議員の任期は、前任者の残任期間とする。\n6　評議員会は、理事長が招集する。評議員の定数の3分の1以上の者が会議に付議すべき事項及び招集の理由を記載した書面を理事長に提出して評議員会の招集を請求したときは、理事長は、その請求のあつた日から20日以内に評議員会を招集しなければならない。\n7　評議員会に議長を置く。議長は、理事長をもつて充てる。\n8　前各項に定めるもののほか、評議員会の招集、議事の手続その他評議員会に関し必要な事項は、政令で定める。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [18], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第3款　管理及び会員"], "orig": "（評議員会）\n第百三十七条の十　連合会に、評議員会を置く。\n２　評議員会は、評議員をもつて組織する。\n３　評議員は、会員である基金の理事長において互選する。ただし、特別の事情があるときは、規約で定めるところにより、会員である基金の理事長の過半数の同意を得て、連合会の業務の適正な運営及び国民年金基金制度の適切な運用に必要な学識経験を有する者のうちから、理事長が委嘱することを妨げない。\n４　設立当時の評議員は、創立総会において、第百三十七条の六第五項の設立の同意を申し出た基金の理事長のうちから選挙する。\n５　評議員の任期は、二年とする。ただし、補欠の評議員の任期は、前任者の残任期間とする。\n６　評議員会は、理事長が招集する。評議員の定数の三分の一以上の者が会議に付議すべき事項及び招集の理由を記載した書面を理事長に提出して評議員会の招集を請求したときは、理事長は、その請求のあつた日から二十日以内に評議員会を招集しなければならない。\n７　評議員会に議長を置く。議長は、理事長をもつて充てる。\n８　前各項に定めるもののほか、評議員会の招集、議事の手続その他評議員会に関し必要な事項は、政令で定める。", "ch": 9}, {"key": "h137-11", "num": [137, 11], "label": "第137条の11", "caption": "", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "〔学習用見出し：連合会の評議員会の議決事項〕\n第137条の11　次に掲げる事項は、評議員会の議決を経なければならない。\n1　規約の変更\n2　毎事業年度の予算\n3　毎事業年度の事業報告及び決算\n4　その他規約で定める事項\n2　理事長は、評議員会が成立しないとき、又は理事長において評議員会を招集する暇がないと認めるときは、評議員会の議決を経なければならない事項で臨時急施を要するものを処分することができる。\n3　理事長は、前項の規定による処置については、次の評議員会においてこれを報告し、その承認を求めなければならない。\n4　評議員会は、監事に対し、連合会の業務に関する監査を求め、その結果の報告を請求することができる。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [19], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第3款　管理及び会員"], "orig": "第百三十七条の十一　次に掲げる事項は、評議員会の議決を経なければならない。\n一　規約の変更\n二　毎事業年度の予算\n三　毎事業年度の事業報告及び決算\n四　その他規約で定める事項\n２　理事長は、評議員会が成立しないとき、又は理事長において評議員会を招集する暇がないと認めるときは、評議員会の議決を経なければならない事項で臨時急施を要するものを処分することができる。\n３　理事長は、前項の規定による処置については、次の評議員会においてこれを報告し、その承認を求めなければならない。\n４　評議員会は、監事に対し、連合会の業務に関する監査を求め、その結果の報告を請求することができる。", "ch": 9}, {"key": "h137-12", "num": [137, 12], "label": "第137条の12", "caption": "役員", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（役員）\n第137条の12　連合会に、役員として理事及び監事を置く。\n2　理事は、評議員において互選する。ただし、特別の事情があるときは、評議員会において、評議員以外の連合会の業務の適正な運営及び国民年金基金制度の適切な運用に必要な学識経験を有する者のうちから選任することを妨げない。\n3　設立当時の理事は、創立総会において、第137条の6第5項の設立の同意を申し出た基金の理事長のうちから選挙する。ただし、特別の事情があるときは、当該理事長以外の年金に関する学識経験を有する者のうちから選任することを妨げない。\n4　理事のうち1人を理事長とし、理事が選挙する。\n5　監事は、評議員において1人を互選し、評議員会において、学識経験を有する者のうちから1人を選任する。\n6　設立当時の監事は、創立総会において、第137条の6第5項の設立の同意を申し出た基金の理事長のうちから1人を選挙し、学識経験を有する者のうちから1人を選任する。\n7　役員の任期は、2年とする。ただし、補欠の役員の任期は、前任者の残任期間とする。\n8　役員は、その任期が満了しても、後任の役員が就任するまでの間は、なお、その職務を行う。\n9　監事は、理事又は連合会の職員と兼ねることができない。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [20], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第3款　管理及び会員"], "orig": "（役員）\n第百三十七条の十二　連合会に、役員として理事及び監事を置く。\n２　理事は、評議員において互選する。ただし、特別の事情があるときは、評議員会において、評議員以外の連合会の業務の適正な運営及び国民年金基金制度の適切な運用に必要な学識経験を有する者のうちから選任することを妨げない。\n３　設立当時の理事は、創立総会において、第百三十七条の六第五項の設立の同意を申し出た基金の理事長のうちから選挙する。ただし、特別の事情があるときは、当該理事長以外の年金に関する学識経験を有する者のうちから選任することを妨げない。\n４　理事のうち一人を理事長とし、理事が選挙する。\n５　監事は、評議員において一人を互選し、評議員会において、学識経験を有する者のうちから一人を選任する。\n６　設立当時の監事は、創立総会において、第百三十七条の六第五項の設立の同意を申し出た基金の理事長のうちから一人を選挙し、学識経験を有する者のうちから一人を選任する。\n７　役員の任期は、二年とする。ただし、補欠の役員の任期は、前任者の残任期間とする。\n８　役員は、その任期が満了しても、後任の役員が就任するまでの間は、なお、その職務を行う。\n９　監事は、理事又は連合会の職員と兼ねることができない。", "ch": 9}, {"key": "h137-13", "num": [137, 13], "label": "第137条の13", "caption": "役員の職務等", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（役員の職務等）\n第137条の13　理事長は、連合会を代表し、その業務を執行する。理事長に事故があるとき、又は理事長が欠けたときは、理事のうちから、あらかじめ理事長が指定する者がその職務を代理し、又はその職務を行う。\n2　連合会の業務は、規約に別段の定めがある場合を除くほか、理事の過半数により決し、可否同数のときは、理事長の決するところによる。\n3　理事は、理事長の定めるところにより、理事長を補佐して、積立金の管理及び運用に関する連合会の業務を執行することができる。\n4　監事は、連合会の業務を監査する。\n5　監事は、監査の結果に基づき、必要があると認めるときは、理事長又は評議員会に意見を提出することができる。\n6　第126条の規定は、連合会の役員及び連合会に使用され、その事務に従事する者について準用する。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [21], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第3款　管理及び会員"], "orig": "（役員の職務等）\n第百三十七条の十三　理事長は、連合会を代表し、その業務を執行する。理事長に事故があるとき、又は理事長が欠けたときは、理事のうちから、あらかじめ理事長が指定する者がその職務を代理し、又はその職務を行う。\n２　連合会の業務は、規約に別段の定めがある場合を除くほか、理事の過半数により決し、可否同数のときは、理事長の決するところによる。\n３　理事は、理事長の定めるところにより、理事長を補佐して、積立金の管理及び運用に関する連合会の業務を執行することができる。\n４　監事は、連合会の業務を監査する。\n５　監事は、監査の結果に基づき、必要があると認めるときは、理事長又は評議員会に意見を提出することができる。\n６　第百二十六条の規定は、連合会の役員及び連合会に使用され、その事務に従事する者について準用する。", "ch": 9}, {"key": "h137-13-2", "num": [137, 13, 2], "label": "第137条の13の2", "caption": "理事の義務及び損害賠償責任", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（理事の義務及び損害賠償責任）\n第137条の13の2　理事は、前条第3項に規定する連合会の業務について、法令、法令に基づいてする厚生労働大臣の処分、規約及び評議員会の議決を遵守し、連合会のため忠実にその職務を遂行しなければならない。\n2　理事が前条第3項に規定する連合会の業務についてその任務を怠つたときは、その理事は、連合会に対し連帯して損害賠償の責めに任ずる。", "bg": "【1996年・平成8年法律107号】加入員の積立金を預かる以上、運用に携わる理事の責任を曖昧にはできない。忠実義務や利益相反・責任に関する規律を設けた改正注記を確認できる。※改正時の個別質疑は未照合。", "deb": "—", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [22], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第3款　管理及び会員"], "orig": "（理事の義務及び損害賠償責任）\n第百三十七条の十三の二　理事は、前条第三項に規定する連合会の業務について、法令、法令に基づいてする厚生労働大臣の処分、規約及び評議員会の議決を遵守し、連合会のため忠実にその職務を遂行しなければならない。\n２　理事が前条第三項に規定する連合会の業務についてその任務を怠つたときは、その理事は、連合会に対し連帯して損害賠償の責めに任ずる。", "ch": 9}, {"key": "h137-13-3", "num": [137, 13, 3], "label": "第137条の13の3", "caption": "理事の禁止行為等", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（理事の禁止行為等）\n第137条の13の3　理事は、自己又は連合会以外の第3者の利益を図る目的をもつて、積立金の管理及び運用の適正を害するものとして厚生労働省令で定める行為をしてはならない。\n2　連合会は、前項の規定に違反した理事を、規約の定めるところにより、評議員会の議決を経て、交代させることができる。", "bg": "【1996年・平成8年法律107号】加入員の積立金を預かる以上、運用に携わる理事の責任を曖昧にはできない。忠実義務や利益相反・責任に関する規律を設けた改正注記を確認できる。※改正時の個別質疑は未照合。", "deb": "—", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [23], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第3款　管理及び会員"], "orig": "（理事の禁止行為等）\n第百三十七条の十三の三　理事は、自己又は連合会以外の第三者の利益を図る目的をもつて、積立金の管理及び運用の適正を害するものとして厚生労働省令で定める行為をしてはならない。\n２　連合会は、前項の規定に違反した理事を、規約の定めるところにより、評議員会の議決を経て、交代させることができる。", "ch": 9}, {"key": "h137-13-4", "num": [137, 13, 4], "label": "第137条の13の4", "caption": "理事長の代表権の制限", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（理事長の代表権の制限）\n第137条の13の4　連合会と理事長（第137条の13第1項の規定により理事長の職務を代理し、又はその職務を行う者を含む。以下この条において同じ。）との利益が相反する事項については、理事長は、代表権を有しない。この場合においては、学識経験を有する者のうちから選任された監事が連合会を代表する。", "bg": "【1996年・平成8年法律107号】加入員の積立金を預かる以上、運用に携わる理事の責任を曖昧にはできない。忠実義務や利益相反・責任に関する規律を設けた改正注記を確認できる。※改正時の個別質疑は未照合。", "deb": "—", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [24], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第3款　管理及び会員"], "orig": "（理事長の代表権の制限）\n第百三十七条の十三の四　連合会と理事長（第百三十七条の十三第一項の規定により理事長の職務を代理し、又はその職務を行う者を含む。以下この条において同じ。）との利益が相反する事項については、理事長は、代表権を有しない。この場合においては、学識経験を有する者のうちから選任された監事が連合会を代表する。", "ch": 9}, {"key": "h137-14", "num": [137, 14], "label": "第137条の14", "caption": "会員", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（会員）\n第137条の14　基金は、連合会に申し出て、その会員となることができる。ただし、他の連合会の会員であるときは、この限りでない。\n2　厚生労働大臣は、基金又は加入員の便宜を図るために必要があると認めるときは、基金に対し、いずれかの連合会に加入することを命ずることができる。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [25], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第3款　管理及び会員"], "orig": "（会員）\n第百三十七条の十四　基金は、連合会に申し出て、その会員となることができる。ただし、他の連合会の会員であるときは、この限りでない。\n２　厚生労働大臣は、基金又は加入員の便宜を図るために必要があると認めるときは、基金に対し、いずれかの連合会に加入することを命ずることができる。", "ch": 9}, {"key": "h137-15", "num": [137, 15], "label": "第137条の15", "caption": "連合会の業務", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（連合会の業務）\n第137条の15　連合会は、第137条の17第4項の規定により年金又は一時金を支給するものとされている中途脱退者及びその会員である基金に係る解散基金加入員に対し、年金又は死亡を支給事由とする一時金の支給を行うものとする。\n2　連合会は、次に掲げる事業を行うことができる。ただし、第1号に掲げる事業を行う場合には、厚生労働大臣の認可を受けなければならない。\n1　基金が支給する年金及び一時金につき一定額が確保されるよう、基金の拠出金等を原資として、基金の積立金の額を付加する事業\n2　第128条第5項の規定による委託を受けて基金の業務の一部を行う事業\n3　基金への助言又は指導を行う事業その他の基金の行う事業の健全な発展を図るものとして政令で定める事業\n4　国民年金基金制度についての啓発活動及び広報活動を行う事業\n3　連合会は、基金の加入員及び加入員であつた者の福祉を増進するため、必要な施設をすることができる。\n4　連合会は、信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会若しくは共済水産業協同組合連合会又は金融商品取引業者と、当該連合会が支給する年金又は一時金に要する費用に関して信託、保険若しくは共済の契約又は投資一任契約を締結するときは、政令の定めるところによらなければならない。\n5　第128条第4項の規定は、前項の信託の契約（運用方法を特定する信託の契約であつて、政令で定めるものを除く。）、保険若しくは共済の契約又は投資一任契約について準用する。\n6　連合会は、厚生労働大臣の認可を受けて、その業務の一部を信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会、共済水産業協同組合連合会その他政令で定める法人に委託することができる。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [27], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第4款　連合会の行う業務"], "orig": "（連合会の業務）\n第百三十七条の十五　連合会は、第百三十七条の十七第四項の規定により年金又は一時金を支給するものとされている中途脱退者及びその会員である基金に係る解散基金加入員に対し、年金又は死亡を支給事由とする一時金の支給を行うものとする。\n２　連合会は、次に掲げる事業を行うことができる。ただし、第一号に掲げる事業を行う場合には、厚生労働大臣の認可を受けなければならない。\n一　基金が支給する年金及び一時金につき一定額が確保されるよう、基金の拠出金等を原資として、基金の積立金の額を付加する事業\n二　第百二十八条第五項の規定による委託を受けて基金の業務の一部を行う事業\n三　基金への助言又は指導を行う事業その他の基金の行う事業の健全な発展を図るものとして政令で定める事業\n四　国民年金基金制度についての啓発活動及び広報活動を行う事業\n３　連合会は、基金の加入員及び加入員であつた者の福祉を増進するため、必要な施設をすることができる。\n４　連合会は、信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会若しくは共済水産業協同組合連合会又は金融商品取引業者と、当該連合会が支給する年金又は一時金に要する費用に関して信託、保険若しくは共済の契約又は投資一任契約を締結するときは、政令の定めるところによらなければならない。\n５　第百二十八条第四項の規定は、前項の信託の契約（運用方法を特定する信託の契約であつて、政令で定めるものを除く。）、保険若しくは共済の契約又は投資一任契約について準用する。\n６　連合会は、厚生労働大臣の認可を受けて、その業務の一部を信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会、共済水産業協同組合連合会その他政令で定める法人に委託することができる。", "ch": 9}, {"key": "h137-16", "num": [137, 16], "label": "第137条の16", "caption": "年金数理", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（年金数理）\n第137条の16　連合会は、適正な年金数理に基づいてその業務を行わなければならない。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [28], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第4款　連合会の行う業務"], "orig": "（年金数理）\n第百三十七条の十六　連合会は、適正な年金数理に基づいてその業務を行わなければならない。", "ch": 9}, {"key": "h137-17", "num": [137, 17], "label": "第137条の17", "caption": "中途脱退者に係る措置", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "（中途脱退者に係る措置）\n第137条の17　連合会の会員である基金は、政令の定めるところにより、中途脱退者（当該基金の加入員の資格を喪失した者（当該加入員の資格を喪失した日において当該基金が支給する年金の受給権を有する者を除く。）であつて、政令の定めるところにより計算したその者の当該基金の加入員期間が政令で定める期間に満たないものをいう。以下同じ。）の当該基金の加入員期間に係る年金の現価に相当する額（以下「現価相当額」という。）の交付を当該連合会に申し出ることができる。\n2　連合会は、前項の規定により現価相当額の交付の申出があつたときは、これを拒絶してはならない。\n3　第1項の交付の申出に係る現価相当額の計算については、政令で定める。\n4　連合会は、第1項の交付の申出に係る現価相当額の交付を受けたときは、当該交付金を原資として、当該中途脱退者に係る年金又は一時金を支給するものとする。\n5　第129条から第131条までの規定は、前項の年金又は一時金について準用する。\n6　基金は、第1項の交付の申出に係る現価相当額を交付したときは、当該中途脱退者に係る年金及び一時金の支給に関する義務を免れる。\n7　連合会は、第4項の規定により中途脱退者に係る年金又は一時金を支給することとなつたときは、その旨を当該中途脱退者に通知しなければならない。\n8　連合会は、中途脱退者の所在が明らかでないため前項の通知をすることができないときは、同項の通知に代えて、その通知すべき事項を公告しなければならない。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "平成30年", "rows": [29], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第2節　国民年金基金連合会", "第4款　連合会の行う業務"], "orig": "（中途脱退者に係る措置）\n第百三十七条の十七　連合会の会員である基金は、政令の定めるところにより、中途脱退者（当該基金の加入員の資格を喪失した者（当該加入員の資格を喪失した日において当該基金が支給する年金の受給権を有する者を除く。）であつて、政令の定めるところにより計算したその者の当該基金の加入員期間が政令で定める期間に満たないものをいう。以下同じ。\n）の当該基金の加入員期間に係る年金の現価に相当する額（以下「現価相当額」という。）の交付を当該連合会に申し出ることができる。\n２　連合会は、前項の規定により現価相当額の交付の申出があつたときは、これを拒絶してはならない。\n３　第一項の交付の申出に係る現価相当額の計算については、政令で定める。\n４　連合会は、第一項の交付の申出に係る現価相当額の交付を受けたときは、当該交付金を原資として、当該中途脱退者に係る年金又は一時金を支給するものとする。\n５　第百二十九条から第百三十一条までの規定は、前項の年金又は一時金について準用する。\n６　基金は、第一項の交付の申出に係る現価相当額を交付したときは、当該中途脱退者に係る年金及び一時金の支給に関する義務を免れる。\n７　連合会は、第四項の規定により中途脱退者に係る年金又は一時金を支給することとなつたときは、その旨を当該中途脱退者に通知しなければならない。\n８　連合会は、中途脱退者の所在が明らかでないため前項の通知をすることができないときは、同項の通知に代えて、その通知すべき事項を公告しなければならない。", "ch": 9}, {"key": "h137-18", "num": [137, 18], "label": "第137条の18", "caption": "", "status": null, "sheet": "第137条の4～148条_連合会等", "scope": "honsoku", "text": "〔学習用見出し：中途脱退者の再加入に伴う現価相当額の交付〕\n第137条の18　連合会が前条第4項の規定により年金又は一時金を支給するものとされている中途脱退者が再びもとの基金の加入員となつたときは、当該基金は、当該連合会に対し、当該中途脱退者に係る年金の現価相当額の交付を請求するものとする。\n2　前項の交付の請求に係る現価相当額の計算については、政令で定める。\n3　基金は、第1項の交付の請求に係る現価相当額の交付を受けたときは、当該交付金を原資として、当該中途脱退者に係る年金又は一時金を支給するものとする。\n4　連合会は、第1項の交付の請求に係る現価相当額を交付したときは、当該中途脱退者に係る年
