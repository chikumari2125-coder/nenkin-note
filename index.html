<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="国年法ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>国民年金法 条文立法史ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDMincho:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: sidebar (scope, search, chapters → articles) + reading area.
   Wide screens: statute text pinned on the left (past-exam years on top), the story of the article
   (背景→議論→通達→出典) on the right. Narrow screens: stacked.
   Colour carries meaning only: chapter = its own hue, column = its own hue, time-point tag = era,
   past exam = rose, study status = green / orange. */
:root{
  --bg:#f6f7f5; --paper:#ffffff; --ink:#1d2321; --sub:#5e6763; --faint:#8a928e; --rule:#d9dedb; --panel:#f1f3f2;
  --c-bg:#94601a;  --c-bg-s:#fbf2e2;     /* 背景：社会事情・時代 */
  --c-deb:#2c5d97; --c-deb-s:#ebf1f9;    /* 議論：問い */
  --c-ans:#2d7556; --c-ans-s:#eaf4ee;    /* 答弁・説明 */
  --c-tsu:#67488f; --c-tsu-s:#f2edf8;    /* 通達：解釈・要件 */
  --c-src:#5f6a66; --c-src-s:#f0f2f1;    /* 出典 */
  --c-exam:#ad3646; --c-exam-s:#fbe8ea;  /* 過去問 */
  --c-done:#2d7556; --c-rev:#c25e17;
  --t-old:#94601a; --t-amend:#4b54a8; --t-now:#2d7556; --t-gone:#7b7f7d;
  --mk-num:#f3e6b5; --mk-sub:#2c5d97; --mk-exc:#c25e17;
  --hl0:#ffe94d; --hl1:#9ee89a; --hl2:#a9d4ff;
  --chS:42%; --chT:31%; --chB:93%; --chM:48%;
  --f-law:"BIZ UDMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --fs:17px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131817; --paper:#1a201f; --ink:#e3e8e6; --sub:#a1aba7; --faint:#7c8682; --rule:#2e3734; --panel:#1f2725;
  --c-bg:#e2b36d; --c-bg-s:#2d2618; --c-deb:#8db6e8; --c-deb-s:#1b2533; --c-ans:#86c9a8; --c-ans-s:#1a2b23;
  --c-tsu:#c3a9e6; --c-tsu-s:#272035; --c-src:#a6b0ac; --c-src-s:#212826; --c-exam:#ef8f9b; --c-exam-s:#36202a;
  --c-done:#86c9a8; --c-rev:#f0a467; --t-old:#e2b36d; --t-amend:#a9b0f0; --t-now:#86c9a8; --t-gone:#9aa09d;
  --mk-num:#4c4425; --mk-sub:#8db6e8; --mk-exc:#f0a467; --hl0:#8a7a12; --hl1:#2f6b37; --hl2:#2b5a86; --chS:35%; --chT:76%; --chB:19%; --chM:60%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131817; --paper:#1a201f; --ink:#e3e8e6; --sub:#a1aba7; --faint:#7c8682; --rule:#2e3734; --panel:#1f2725;
  --c-bg:#e2b36d; --c-bg-s:#2d2618; --c-deb:#8db6e8; --c-deb-s:#1b2533; --c-ans:#86c9a8; --c-ans-s:#1a2b23;
  --c-tsu:#c3a9e6; --c-tsu-s:#272035; --c-src:#a6b0ac; --c-src-s:#212826; --c-exam:#ef8f9b; --c-exam-s:#36202a;
  --c-done:#86c9a8; --c-rev:#f0a467; --t-old:#e2b36d; --t-amend:#a9b0f0; --t-now:#86c9a8; --t-gone:#9aa09d;
  --mk-num:#4c4425; --mk-sub:#8db6e8; --mk-exc:#f0a467; --hl0:#8a7a12; --hl1:#2f6b37; --hl2:#2b5a86; --chS:35%; --chT:76%; --chB:19%; --chM:60%; color-scheme:dark}
:root.big{--fs:19px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:var(--fs);line-height:1.8}
a{color:var(--c-deb)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c-deb);outline-offset:2px}
/* chapter hue helpers: element sets --h */
.chc{color:hsl(var(--h) var(--chS) var(--chT))}
.chbg{background:hsl(var(--h) calc(var(--chS) + 8%) var(--chB))}
.chdot{display:inline-block;width:.62em;height:.62em;border-radius:2px;background:hsl(var(--h) var(--chS) var(--chM));flex:none}

.app{display:grid;grid-template-columns:330px minmax(0,1fr);height:100vh}
/* sidebar */
.side{border-right:1px solid var(--rule);background:var(--paper);display:flex;flex-direction:column;min-height:0}
.brandrow{display:flex;align-items:stretch;border-bottom:1px solid var(--rule)}
.brand{padding:14px 8px 10px 16px;cursor:pointer;flex:1;min-width:0}
.sideclose{flex:none;width:48px;border:0;border-left:1px solid var(--rule);background:none;color:var(--sub);font-size:1em;cursor:pointer}
.sideclose:hover{background:var(--panel);color:var(--ink)}
.filters .fnow{color:var(--c-done);font-weight:700}
.scrim{display:none}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}
.app.collapsed .side{visibility:hidden;overflow:hidden;border:0}
.app.collapsed .menu-btn{display:inline-block}
.brand b{display:block;font-family:var(--f-law);font-size:1.05em;line-height:1.4}
.brand span{font-size:.72em;color:var(--sub)}
.scopes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 12px 0}
.scopes button{border:1px solid var(--rule);background:var(--bg);border-radius:6px;padding:5px 2px;font-size:.74em;cursor:pointer;white-space:nowrap}
.scopes button[hidden]{display:none}
.scopes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sform{padding:10px 12px;display:flex;gap:6px}
.sform input{flex:1;min-width:0;border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--bg);font-size:.88em}
.filters{display:flex;gap:10px;padding:0 12px 8px;font-size:.74em;color:var(--sub);flex-wrap:wrap}
.filters label{display:flex;gap:4px;align-items:center;cursor:pointer}
.list{overflow-y:auto;flex:1;padding:0 6px 20px;min-height:0}
.grp.sec{padding:8px 10px 2px 22px;font-size:.7em}
.grp{font-size:.72em;color:var(--sub);padding:12px 10px 4px;line-height:1.5}
.chh{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:6px;padding:7px 10px;margin-top:8px;cursor:pointer;text-align:left;font-size:.8em;line-height:1.4}
.chh b{flex:none}
.chh span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chh small{flex:none;font-size:.86em;opacity:.85;font-variant-numeric:tabular-nums}
.chh::after{content:"▾";flex:none;font-size:.8em;opacity:.7}
.chh[aria-expanded="false"]::after{content:"▸"}
.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:.86em;line-height:1.45}
.item:hover{background:var(--panel)}
.item[aria-current="true"]{background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule)}
.item small{display:block;color:var(--sub);font-size:.82em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tx{min-width:0}
.marksq{display:flex;gap:4px;align-items:center}
.pill{font-size:.7em;border-radius:3px;padding:0 5px;line-height:1.6;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ex{color:var(--c-exam);background:var(--c-exam-s)}
.pill.done{color:var(--paper);background:var(--c-done)}
.pill.rev{color:var(--paper);background:var(--c-rev)}
.pill.memo{color:var(--sub);border:1px solid var(--rule)}
.sidefoot{border-top:1px solid var(--rule);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:5px 10px;font-size:.8em;cursor:pointer;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--panel);border-color:var(--ink)}

/* main */
.main{overflow-y:auto;min-height:0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.top-in{display:flex;gap:8px;align-items:center;padding:8px 20px;flex-wrap:wrap}
.top-in .crumb{flex:1;min-width:0;font-size:.8em;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px;align-items:center}
.menu-btn{display:none}
.page{padding:18px 24px 80px;max-width:1520px}
.chband{display:inline-flex;gap:8px;align-items:center;border-radius:6px;padding:2px 10px;font-size:.8em;text-decoration:none;font-weight:700}
.head h1{font-family:var(--f-law);font-size:1.62em;line-height:1.35;margin:8px 0 0}
.titlerow{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:8px}
.titlerow h1{flex:1;min-width:0;margin:0}
.stepper{display:flex;gap:6px;flex:none}
.step{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.86em;line-height:1.3;text-align:left}
.step[data-dir="1"]{text-align:right}
.step small{display:block;font-size:.78em;color:var(--sub);white-space:nowrap}
.step .ar{font-size:1.5em;line-height:1;color:var(--sub)}
.step:hover:not(:disabled){border-color:var(--ink)}
.step:disabled{opacity:.4;cursor:default}
@media (max-width:900px){.stepper{width:100%}.step{flex:1;justify-content:space-between}}

.head .cap{font-family:var(--f-law);color:var(--sub);font-size:.95em;margin-left:.4em;font-weight:400}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.badge{font-size:.72em;border:1px solid var(--rule);border-radius:4px;padding:1px 8px;color:var(--sub);background:var(--paper)}
.rec{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 0}
.rec .btn[data-st="done"][aria-pressed="true"]{background:var(--c-done);color:var(--paper);border-color:var(--c-done)}
.rec .btn[data-st="review"][aria-pressed="true"]{background:var(--c-rev);color:var(--paper);border-color:var(--c-rev)}
.marks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78em;color:var(--sub);margin-left:auto}
.marks .btn[data-mark="n"][aria-pressed="true"]{background:var(--mk-num)}
.marks .btn[data-mark="s"][aria-pressed="true"]{border-color:var(--mk-sub);color:var(--mk-sub)}
.marks .btn[data-mark="x"][aria-pressed="true"]{border-color:var(--mk-exc);color:var(--mk-exc)}

.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:16px}
@media (min-width:1180px){
  .grid{grid-template-columns:minmax(0,47fr) minmax(0,53fr);align-items:start}
  .lawbox{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow-y:auto}
}
.lawbox{background:var(--paper);border:1px solid var(--rule);border-top:4px solid hsl(var(--h,150) var(--chS) var(--chM));border-radius:10px;padding:14px 22px 18px}
.exam{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:10px;margin-bottom:10px;border-bottom:1px dashed var(--rule)}
.exam .lb{font-size:.74em;font-weight:700;color:var(--c-exam);margin-right:2px;cursor:help}
.yr{display:inline-flex;align-items:baseline;gap:2px;font-size:.78em;border-radius:5px;padding:1px 8px;font-variant-numeric:tabular-nums;line-height:1.7;white-space:nowrap}
.yr.r{background:var(--c-exam);color:var(--paper)}
.yr.h{border:1px solid var(--c-exam);color:var(--c-exam);background:var(--c-exam-s)}
.yr.none{border:1px dashed var(--rule);color:var(--sub);white-space:normal}
.yr b{font-weight:700;margin-right:2px}
.yr.mk-dir{background:var(--c-exam);color:var(--paper)}
.yr.mk-rel{border:1px solid var(--c-exam);color:var(--c-exam);background:var(--c-exam-s)}
.yr.mk-prov{border:1px dashed var(--c-exam);color:var(--c-exam);background:transparent}
.exam .dt{font-size:.74em;color:var(--sub)}
.exam .cnt{margin-left:auto;font-size:.72em;color:var(--sub)}
.sec-h{font-size:.76em;letter-spacing:.1em;color:var(--sub);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.law{font-family:var(--f-law);font-size:1.06em;line-height:2.05}
.law p{margin:0}
.law .cap-l{color:var(--sub)}
.law .gap{height:.6em}
.law .kou{padding-left:1.2em;text-indent:-1.2em}
.law .gou{padding-left:2.2em;text-indent:-1.2em}
.law .sub{padding-left:3.2em;text-indent:-1.2em}
.tag{display:inline-block;font-family:var(--f-ui);font-size:.72em;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 6px;line-height:1.7;text-indent:0;margin:2px 0;color:var(--t-old)}
.tag.amend{color:var(--t-amend)} .tag.now{color:var(--t-now)} .tag.plain{color:var(--sub);border-color:var(--rule)}
.tag.gone{color:var(--t-gone);border-style:dashed}
.law a.ref{color:inherit;text-decoration:underline;text-decoration-color:var(--c-deb);text-underline-offset:3px}
.law a.ref:hover{color:var(--c-deb)}
.rd a.ref{color:inherit;text-decoration:underline dotted;text-decoration-color:var(--c-deb);text-underline-offset:3px}
.mk .n{background:var(--mk-num);border-radius:2px}
.mk .s{text-decoration:underline;text-decoration-color:var(--mk-sub);text-decoration-thickness:2px;text-underline-offset:4px}
.mk .x{text-decoration:underline dotted;text-decoration-color:var(--mk-exc);text-decoration-thickness:2px;text-underline-offset:4px}
.legend{font-size:.74em;color:var(--sub);margin-top:10px}
.hlbtn[aria-pressed="true"]{background:var(--hl0);color:#222;border-color:#b59a00}
.hlbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 20px 8px;border-top:1px solid var(--rule);font-size:.92em}
.hlbar[hidden]{display:none}
.hlbar .btn[data-hl="erase"][aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hlcols{display:inline-flex;gap:6px}
.hlc{width:28px;height:28px;border-radius:50%;border:2px solid var(--rule);cursor:pointer;padding:0}
.hlc[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset}
.hlc.c0{background:var(--hl0)} .hlc.c1{background:var(--hl1)} .hlc.c2{background:var(--hl2)}
.hlbar .hint{font-size:.76em;color:var(--sub);flex-basis:100%}
.hlbar .hint:empty{display:none}
.hlbar [data-hlclear][hidden]{display:none}
[data-hlz].hlon{touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:crosshair;-webkit-touch-callout:none}
.hlon a.ref{pointer-events:none}
.pill.hlp{background:var(--hl0);color:#222;border-color:transparent}
mark.hl{color:inherit;background:linear-gradient(transparent 38%, var(--hlc) 38%, var(--hlc) 92%, transparent 92%);border-radius:1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.hl.c0{--hlc:var(--hl0)} mark.hl.c1{--hlc:var(--hl1)} mark.hl.c2{--hlc:var(--hl2)}
@media print{.hlbar{display:none}}
.orig{margin-top:12px;border-top:1px dashed var(--rule);padding-top:8px}
.orig summary{cursor:pointer;font-size:.8em;color:var(--sub)}
.orig .otext{font-family:var(--f-law);font-size:.95em;line-height:1.9;margin-top:6px;color:var(--sub)}
.xtab table{font-size:.8em;min-width:100%}
.xtab td,.xtab th{vertical-align:top;line-height:1.6;min-width:9em;max-width:30em}
.xtab td:first-child,.xtab th:first-child{min-width:6em}
.xtab .xl{margin-top:4px;font-size:.92em}
.xtab .xl a{margin-right:6px}
.xr{padding:8px 0;border-bottom:1px solid var(--rule)}
.xr dl{display:grid;grid-template-columns:minmax(6em,10em) 1fr;gap:2px 10px;margin:6px 0 0;font-size:.84em}
.xr dt{color:var(--sub)}
.xr dd{margin:0;line-height:1.6;word-break:break-word}
@media (max-width:900px){.xr dl{grid-template-columns:1fr}.xr dt{margin-top:4px}}
/* reference preview: read the referred article without leaving the page */
.peek-scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.25)}
.peek{position:fixed;z-index:41;background:var(--paper);display:flex;flex-direction:column;box-shadow:0 0 34px rgba(0,0,0,.25);
  top:0;right:0;bottom:0;width:min(600px,92vw);border-left:4px solid hsl(var(--h,150) var(--chS) var(--chM))}
.peek[hidden],.peek-scrim[hidden],.backchip[hidden]{display:none}
.peek-h{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--rule)}
.peek-h .tt{flex:1;min-width:0}
.peek-h .kk{font-size:.72em;color:var(--sub)}
.peek-h h3{margin:2px 0 0;font-family:var(--f-law);font-size:1.15em;line-height:1.4}
.peek-h h3 small{font-weight:400;color:var(--sub);margin-left:.4em;font-size:.82em}
.peek-x{border:0;background:none;font-size:1.4em;line-height:1;color:var(--sub);cursor:pointer;padding:2px 6px}
.peek-tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--rule)}
.peek-tools .open{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.peek-b{overflow-y:auto;padding:12px 16px 24px;flex:1;-webkit-overflow-scrolling:touch}
.peek-b .law p.hit-kou{background:var(--c-deb-s);box-shadow:-6px 0 0 var(--c-deb-s),6px 0 0 var(--c-deb-s);border-radius:2px}
.peek-note{font-size:.76em;color:var(--sub);margin:0 0 8px;line-height:1.6}
@media (max-width:900px){
  .peek{top:auto;left:0;right:0;width:auto;max-height:78vh;border-left:0;border-top:4px solid hsl(var(--h,150) var(--chS) var(--chM));border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom)}
}
.backchip{position:fixed;z-index:35;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  border-radius:999px;padding:9px 16px 9px 12px;font-size:.86em;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;gap:8px}
.backchip .x{opacity:.7;margin-left:6px;padding:0 2px}
.legend span{margin-right:10px}

.read{display:flex;flex-direction:column;gap:18px}
.toc{display:flex;gap:6px;flex-wrap:wrap}
.toc a{font-size:.78em;border-radius:99px;padding:2px 12px;text-decoration:none;font-weight:700}
.toc .t-bg{color:var(--c-bg);background:var(--c-bg-s)} .toc .t-deb{color:var(--c-deb);background:var(--c-deb-s)}
.toc .t-tsu{color:var(--c-tsu);background:var(--c-tsu-s)} .toc .t-src{color:var(--c-src);background:var(--c-src-s)}
.toc .t-memo{color:var(--sub);border:1px solid var(--rule)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:0 20px 16px;scroll-margin-top:70px;overflow:hidden}
.card>h2{font-size:.95em;margin:0 -20px 12px;padding:9px 20px;display:flex;align-items:baseline;gap:10px}
.card>h2 .no{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;color:var(--paper);font-size:.85em;flex:none;align-self:center}
.card>h2 small{font-weight:400;color:var(--sub);font-size:.78em}
.card.bg>h2{background:var(--c-bg-s);color:var(--c-bg)} .card.bg>h2 .no{background:var(--c-bg)}
.card.deb>h2{background:var(--c-deb-s);color:var(--c-deb)} .card.deb>h2 .no{background:var(--c-deb)}
.card.tsu>h2{background:var(--c-tsu-s);color:var(--c-tsu)} .card.tsu>h2 .no{background:var(--c-tsu)}
.card.memo>h2{background:var(--panel);color:var(--ink)}
.rd{font-size:.97em;line-height:1.9}
.rd p{margin:0 0 .15em}

.rd .hd{font-weight:700;margin-top:.4em}
.card.deb .rd .hd{color:var(--c-deb)}
.rd .lq{display:inline-block;border-bottom:1px dashed var(--c-rev);color:var(--c-rev)}
.rd .q{padding-left:1.4em;text-indent:-1.4em;margin-top:.6em}
.rd .q .qn{color:var(--c-deb);font-weight:700}
.rd .a{margin:.25em 0 .25em 1.2em;padding:4px 10px 4px 2.2em;text-indent:-1.2em;background:var(--c-ans-s);border-radius:6px}
.rd .a .an{color:var(--c-ans);font-weight:700}
.rd .nt{font-size:.88em;color:var(--sub);padding-left:1.2em;text-indent:-1.2em;margin-top:.3em}
.notice{font-size:.82em;background:var(--panel);border:1px dashed var(--rule);border-radius:8px;padding:8px 12px;margin:0 0 12px;line-height:1.7}

.none{color:var(--sub)}

details.src>summary{cursor:pointer;padding:10px 20px;font-size:.95em;font-weight:700;color:var(--c-src);background:var(--c-src-s);border-radius:10px;list-style:none;display:flex;gap:10px;align-items:baseline}

.src-list{display:flex;flex-direction:column;gap:8px;font-size:.86em;padding:6px 20px 16px}
.src-it{border-top:1px solid var(--rule);padding-top:8px;line-height:1.6}
.src-it .k{font-size:.8em;color:var(--sub)}

textarea{width:100%;min-height:7em;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--bg);line-height:1.7;resize:vertical}
.saved{font-size:.74em;color:var(--sub)}

.pn small{display:block;color:var(--sub);font-size:.76em}
.tw{overflow-x:auto}

3日の政府提案理由で長寿化、老後の所得保障の必要性を説明。国民皆年金の基本理念を掲げた。\n【制度実施】無拠出の福祉年金は1959年11月、拠出制国民年金は1961年4月開始。", "deb": "【1985年改正関連／1984年4月17日・衆議院本会議】河野正議員が問いかけたのは、基礎年金は税方式にすべきではないか、保険料方式でよいのかという点だった。これに対し、渡部恒三厚生大臣は、拠出した者としない者の公平性、巨額の税負担への合意の難しさなどから、社会保険方式を維持すべきと答弁。\n※第1条制定時の個別質疑ではなく、後年の制度理念に関する質疑。", "tsu": "【昭和60年7月1日 発年第44号】1985年の制度再編について、国民年金を全国共通の基礎年金制度に改める趣旨を説明。制定時の第1条文言に対する逐条解釈通達ではない。", "kako": "—", "rows": [6], "heads": ["第1章　総則"], "orig": "（国民年金制度の目的）\n第一条　国民年金制度は、日本国憲法第二十五条第二項に規定する理念に基き、老齢、障害又は死亡によつて国民生活の安定がそこなわれることを国民の共同連帯によつて防止し、もつて健全な国民生活の維持及び向上に寄与することを目的とする。", "ch": 0}, {"key": "h2", "num": [2], "label": "第2条", "caption": "国民年金の給付", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（国民年金の給付）\n第2条　国民年金は、前条の目的を達成するため、国民の老齢、障害又は死亡に関して必要な給付を行うものとする。", "bg": "【制定・1959年】老齢・障害・死亡という暮らしの転機に、所得をどう支えるか。その答えとして制度が構想された。政府提案理由では拠出制を基本とし、拠出できない既高齢者や障害者等へ無拠出の福祉年金を併用するとした。\n【1985年改正】給付を全国共通の老齢・障害・遺族基礎年金を中心とする体系に再編（1986年4月実施）。", "deb": "【1985年改正関連／1984年4月17日・衆議院本会議】河野正議員は、40年加入で月額5万円という基礎年金の水準で生活を支えられるのかと疑問を呈した。これに対し、渡部恒三厚生大臣は、給付と負担の均衡を図ることが長期的安定に不可欠と答弁。\n※本条固有の逐条審議ではなく、基礎年金改正をめぐる質疑。", "tsu": "【昭和60年7月1日 発年第44号】基礎年金の種類を老齢・障害・遺族とする体系改正を説明。現行の各給付の具体的要件は各給付条文で別途確認。", "kako": "令和5年", "rows": [7], "heads": ["第1章　総則"], "orig": "（国民年金の給付）\n第二条　国民年金は、前条の目的を達成するため、国民の老齢、障害又は死亡に関して必要な給付を行うものとする。", "ch": 0}, {"key": "h3", "num": [3], "label": "第3条", "caption": "管掌", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（管掌）\n第3条　国民年金事業は、政府が、管掌する。\n2　国民年金事業の事務の一部は、政令の定めるところにより、法律によつて組織された共済組合（以下単に「共済組合」という。）、国家公務員共済組合連合会、全国市町村職員共済組合連合会、地方公務員共済組合連合会又は私立学校教職員共済法（昭和28年法律第245号）の規定により私立学校教職員共済制度を管掌することとされた日本私立学校振興・共済事業団（以下「共済組合等」という。）に行わせることができる。\n3　国民年金事業の事務の一部は、政令の定めるところにより、市町村長（特別区の区長を含む。以下同じ。）が行うこととすることができる。", "bg": "【制定時】全国的な年金保障を制度として動かす。その運営を国の社会保障事業として位置付けた。\n【後年の改正】基礎年金制度の導入後は共済組合等に一部事務を担わせる規定等を整備。現行条文の政府管掌と事務委任・実施は区別する。", "deb": "—", "tsu": "—", "kako": "平成30年", "rows": [8], "heads": ["第1章　総則"], "orig": "（管掌）\n第三条　国民年金事業は、政府が、管掌する。\n２　国民年金事業の事務の一部は、政令の定めるところにより、法律によつて組織された共済組合（以下単に「共済組合」という。）、国家公務員共済組合連合会、全国市町村職員共済組合連合会、地方公務員共済組合連合会又は私立学校教職員共済法（昭和二十八年法律第二百四十五号）\nの規定により私立学校教職員共済制度を管掌することとされた日本私立学校振興・共済事業団（以下「共済組合等」という。）に行わせることができる。\n３　国民年金事業の事務の一部は、政令の定めるところにより、市町村長（特別区の区長を含む。以下同じ。）が行うこととすることができる。", "ch": 0}, {"key": "h4", "num": [4], "label": "第4条", "caption": "年金額の改定", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（年金額の改定）\n第4条　この法律による年金の額は、国民の生活水準その他の諸事情に著しい変動が生じた場合には、変動後の諸事情に応ずるため、速やかに改定の措置が講ぜられなければならない。", "bg": "【制定・改正】生活水準などが大きく変わったのに、年金額だけが取り残されてよいのか。著しい変動が生じた場合に改定措置を講じるという、基本的な要請を定めた。定期的な具体的改定方式や物価・賃金変動への反映は別の条文・後年の改正と区別する。", "deb": "—", "tsu": "—", "kako": "令和2年、令和8年", "rows": [9], "heads": ["第1章　総則"], "orig": "（年金額の改定）\n第四条　この法律による年金の額は、国民の生活水準その他の諸事情に著しい変動が生じた場合には、変動後の諸事情に応ずるため、速やかに改定の措置が講ぜられなければならない。", "ch": 0}, {"key": "h4-2", "num": [4, 2], "label": "第4条の2", "caption": "財政の均衡", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（財政の均衡）\n第4条の2　国民年金事業の財政は、長期的にその均衡が保たれたものでなければならず、著しくその均衡を失すると見込まれる場合には、速やかに所要の措置が講ぜられなければならない。", "bg": "【2004年改正・追加】少子高齢化が進むなか、将来の保険料負担をどう抑え、給付をどう支えるか。2004年改正は、長期的な給付と負担の均衡を確保する財政運営への転換を図った。保険料水準の固定、積立金の活用、給付水準の調整を組み合わせた。", "deb": "【2004年改正関連／国会審議】有限均衡方式の採用、将来の保険料負担と給付水準の調整は議論された。ただし、今回未照合の質疑相手・発言位置については問答として収録しない。具体的な質疑・答弁の追加確認待ち。", "tsu": "—", "kako": "令和8年", "rows": [10], "heads": ["第1章　総則"], "orig": "（財政の均衡）\n第四条の二　国民年金事業の財政は、長期的にその均衡が保たれたものでなければならず、著しくその均衡を失すると見込まれる場合には、速やかに所要の措置が講ぜられなければならない。", "ch": 0}, {"key": "h4-3", "num": [4, 3], "label": "第4条の3", "caption": "財政の現況及び見通しの作成", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（財政の現況及び見通しの作成）\n第4条の3　政府は、少なくとも5年ごとに、保険料及び国庫負担の額並びにこの法律による給付に要する費用の額その他の国民年金事業の財政に係る収支についてその現況及び財政均衡期間における見通し（以下「財政の現況及び見通し」という。）を作成しなければならない。\n2　前項の財政均衡期間（第16条の2第1項において「財政均衡期間」という。）は、財政の現況及び見通しが作成される年以降おおむね100年間とする。\n3　政府は、第1項の規定により財政の現況及び見通しを作成したときは、遅滞なく、これを公表しなければならない。", "bg": "【2004年改正・追加】年金財政を将来にわたって見通すため、従来の財政再計算を見直した。少なくとも5年ごとに、おおむね100年間の収支見通しを作成・公表する財政検証の仕組みを整えた。数値は予測であり、現状を固定した保証値ではない。", "deb": "【2004年改正関連／国会審議】おおむね100年の財政均衡と定期財政検証に関する政府説明が存在するが、条文固有の質問と一対一で照合できた問答は現段階では未収録。", "tsu": "—", "kako": "令和6年", "rows": [11], "heads": ["第1章　総則"], "orig": "（財政の現況及び見通しの作成）\n第四条の三　政府は、少なくとも五年ごとに、保険料及び国庫負担の額並びにこの法律による給付に要する費用の額その他の国民年金事業の財政に係る収支についてその現況及び財政均衡期間における見通し（以下「財政の現況及び見通し」という。）を作成しなければならない。\n２　前項の財政均衡期間（第十六条の二第一項において「財政均衡期間」という。）は、財政の現況及び見通しが作成される年以降おおむね百年間とする。\n３　政府は、第一項の規定により財政の現況及び見通しを作成したときは、遅滞なく、これを公表しなければならない。", "ch": 0}, {"key": "h5", "num": [5], "label": "第5条", "caption": "用語の定義", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（用語の定義）\n第5条　この法律において、「保険料納付済期間」とは、第7条第1項第1号に規定する被保険者としての被保険者期間のうち納付された保険料（第96条の規定により徴収された保険料を含み、第90条の2第1項から第3項までの規定によりその一部の額につき納付することを要しないものとされた保険料につきその残余の額が納付又は徴収されたものを除く。以下同じ。）に係るもの及び第88条の2又は第88条の3第1項若しくは第2項の規定により納付することを要しないものとされた保険料に係るもの、第7条第1項第2号に規定する被保険者としての被保険者期間並びに同項第3号に規定する被保険者としての被保険者期間を合算した期間をいう。\n2　この法律において、「保険料免除期間」とは、保険料全額免除期間、保険料4分の3免除期間、保険料半額免除期間及び保険料4分の1免除期間を合算した期間をいう。\n3　この法律において、「保険料全額免除期間」とは、第7条第1項第1号に規定する被保険者としての被保険者期間であつて第89条第1項、第90条第1項又は第90条の3第1項の規定により納付することを要しないものとされた保険料に係るもののうち、第94条第4項の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間をいう。\n4　この法律において、「保険料4分の3免除期間」とは、第7条第1項第1号に規定する被保険者としての被保険者期間であつて第90条の2第1項の規定によりその4分の3の額につき納付することを要しないものとされた保険料（納付することを要しないものとされた4分の3の額以外の4分の1の額につき納付されたものに限る。）に係るもののうち、第94条第4項の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間をいう。\n5　この法律において、「保険料半額免除期間」とは、第7条第1項第1号に規定する被保険者としての被保険者期間であつて第90条の2第2項の規定によりその半額につき納付することを要しないものとされた保険料（納付することを要しないものとされた半額以外の半額につき納付されたものに限る。）に係るもののうち、第94条第4項の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間をいう。\n6　この法律において、「保険料4分の1免除期間」とは、第7条第1項第1号に規定する被保険者としての被保険者期間であつて第90条の2第3項の規定によりその4分の1の額につき納付することを要しないものとされた保険料（納付することを要しないものとされた4分の1の額以外の4分の3の額につき納付されたものに限る。）に係るもののうち、第94条第4項の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間をいう。\n7　この法律において、「配偶者」、「夫」及び「妻」には、婚姻の届出をしていないが、事実上婚姻関係と同様の事情にある者を含むものとする。\n8　この法律において、「政府及び実施機関」とは、厚生年金保険の実施者たる政府及び実施機関たる共済組合等をいう。\n9　この法律において、「実施機関たる共済組合等」とは、厚生年金保険の実施機関たる国家公務員共済組合連合会、地方公務員共済組合連合会又は日本私立学校振興・共済事業団をいう。", "bg": "【1985年改正等】被保険者の3区分をまたぐ期間を、どのように年金へ反映させるか。基礎年金制度の導入に合わせ、保険料納付済期間や免除期間の定義を整備。\n【後年】法定免除、申請免除、一部免除、産前産後免除、年金一元化に伴う実施機関などの制度変更が本条の定義に反映された。", "deb": "—", "tsu": "【昭和60年7月1日 発年第44号】第1号～第3号被保険者への区分、共通基礎年金を導入した制度全体の関係を説明。現在の免除期間の全類型までを網羅する通達ではない。", "kako": "令和2年、令和3年、令和4年、令和5年、令和7年", "rows": [12], "heads": ["第1章　総則"], "orig": "（用語の定義）\n第五条　この法律において、「保険料納付済期間」とは、第七条第一項第一号に規定する被保険者としての被保険者期間のうち納付された保険料（第九十六条の規定により徴収された保険料を含み、第九十条の二第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料につきその残余の額が納付又は徴収されたものを除く。以下同じ。\n）に係るもの及び第八十八条の二又は第八十八条の三第一項若しくは第二項の規定により納付することを要しないものとされた保険料に係るもの、第七条第一項第二号に規定する被保険者としての被保険者期間並びに同項第三号に規定する被保険者としての被保険者期間を合算した期間をいう。\n２　この法律において、「保険料免除期間」とは、保険料全額免除期間、保険料四分の三免除期間、保険料半額免除期間及び保険料四分の一免除期間を合算した期間をいう。\n３　この法律において、「保険料全額免除期間」とは、第七条第一項第一号に規定する被保険者としての被保険者期間であつて第八十九条第一項、第九十条第一項又は第九十条の三第一項の規定により納付することを要しないものとされた保険料に係るもののうち、第九十四条第四項の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間を\nいう。\n４　この法律において、「保険料四分の三免除期間」とは、第七条第一項第一号に規定する被保険者としての被保険者期間であつて第九十条の二第一項の規定によりその四分の三の額につき納付することを要しないものとされた保険料（納付することを要しないものとされた四分の三の額以外の四分の一の額につき納付されたものに限る。\n）に係るもののうち、第九十四条第四項の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間をいう。\n５　この法律において、「保険料半額免除期間」とは、第七条第一項第一号に規定する被保険者としての被保険者期間であつて第九十条の二第二項の規定によりその半額につき納付することを要しないものとされた保険料（納付することを要しないものとされた半額以外の半額につき納付されたものに限る。\n）に係るもののうち、第九十四条第四項の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間をいう。\n６　この法律において、「保険料四分の一免除期間」とは、第七条第一項第一号に規定する被保険者としての被保険者期間であつて第九十条の二第三項の規定によりその四分の一の額につき納付することを要しないものとされた保険料（納付することを要しないものとされた四分の一の額以外の四分の三の額につき納付されたものに限る。\n）に係るもののうち、第九十四条第四項の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間をいう。\n７　この法律において、「配偶者」、「夫」及び「妻」には、婚姻の届出をしていないが、事実上婚姻関係と同様の事情にある者を含むものとする。\n８　この法律において、「政府及び実施機関」とは、厚生年金保険の実施者たる政府及び実施機関たる共済組合等をいう。\n９　この法律において、「実施機関たる共済組合等」とは、厚生年金保険の実施機関たる国家公務員共済組合連合会、地方公務員共済組合連合会又は日本私立学校振興・共済事業団をいう。", "ch": 0}, {"key": "h6", "num": [6], "label": "第6条", "caption": "事務の区分", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（事務の区分）\n第6条　第12条第1項及び第4項（第105条第2項において準用する場合を含む。）並びに第105条第1項及び第4項の規定により市町村が処理することとされている事務は、地方自治法（昭和22年法律第67号）第2条第9項第1号に規定する第1号法定受託事務とする。", "bg": "【1999年地方分権関係改正】国が担う年金制度を、市町村の実務の中でどう扱うか。国民年金事務の位置付けを、地方自治法上の第1号法定受託事務として整理した。行政主体を定める条文であり、届出等の実体要件は第12条等で規定される。", "deb": "—", "tsu": "—", "kako": "—", "rows": [13], "heads": ["第1章　総則"], "orig": "（事務の区分）\n第六条　第十二条第一項及び第四項（第百五条第二項において準用する場合を含む。）並びに第百五条第一項及び第四項の規定により市町村が処理することとされている事務は、地方自治法（昭和二十二年法律第六十七号）第二条第九項第一号に規定する第一号法定受託事務とする。", "ch": 0}, {"key": "h7", "num": [7], "label": "第7条", "caption": "被保険者の資格", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（被保険者の資格）\n第7条　次の各号のいずれかに該当する者は、国民年金の被保険者とする。\n1　日本国内に住所を有する20歳以上60歳未満の者であつて次号及び第3号のいずれにも該当しないもの（厚生年金保険法（昭和29年法律第115号）に基づく老齢を支給事由とする年金たる保険給付その他の老齢又は退職を支給事由とする給付であつて政令で定めるもの（以下「厚生年金保険法に基づく老齢給付等」という。）を受けることができる者その他この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。以下「第1号被保険者」という。）\n2　厚生年金保険の被保険者（以下「第2号被保険者」という。）\n3　第2号被保険者の配偶者（日本国内に住所を有する者又は外国において留学をする学生その他の日本国内に住所を有しないが渡航目的その他の事情を考慮して日本国内に生活の基礎があると認められる者として厚生労働省令で定める者に限る。）であつて主として第2号被保険者の収入により生計を維持するもの（第2号被保険者である者その他この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。以下「被扶養配偶者」という。）のうち20歳以上60歳未満のもの（以下「第3号被保険者」という。）\n2　前項第3号の規定の適用上、主として第2号被保険者の収入により生計を維持することの認定に関し必要な事項は、政令で定める。\n3　前項の認定については、行政手続法（平成5年法律第88号）第3章（第12条及び第14条を除く。）の規定は、適用しない。", "bg": "【1959年制定時】旧制度は被用者年金でカバーされない自営業者等が中心。政府説明では既存の公的年金被保険者と配偶者・学生の取扱いが重要な課題だった。\n【1985年改正】1986年4月から第1号・第2号・第3号被保険者という区分を設け、被扶養配偶者にも本人の年金権を確保する道を開いた。\n【2019年改正】第3号被保険者の国内居住要件に海外特例を整備（2020年4月施行）。", "deb": "【1985年改正関連／1984年4月17日・衆議院本会議】河野正議員が問いかけたのは、基礎年金の導入によって女性自身の年金権が本当に確立するのかという問題だった。渡部恒三厚生大臣は、被用者の妻を含む女性に国民年金を適用して年金権確立を図ると答弁。\n※1985年改正時の議論。1959年制定時の第7条の審議とは区別。", "tsu": "【昭和60年7月1日 発年第44号】1985年改正の施行通知。第1号＝旧国民年金の主な対象者、第2号＝厚生年金被保険者、第3号＝その被扶養配偶者という構造を説明。\n※同通知当時は学生の扱いなど現在と異なる部分がある。旧通知の対象要件を現行法そのものとして転載しない。", "kako": "平成29年、令和元年、令和3年、令和4年、令和5年、令和6年、令和8年", "rows": [15], "heads": ["第2章　被保険者"], "orig": "（被保険者の資格）\n第七条　次の各号のいずれかに該当する者は、国民年金の被保険者とする。\n一　日本国内に住所を有する二十歳以上六十歳未満の者であつて次号及び第三号のいずれにも該当しないもの（厚生年金保険法（昭和二十九年法律第百十五号）に基づく老齢を支給事由とする年金たる保険給付その他の老齢又は退職を支給事由とする給付であつて政令で定めるもの（以下「厚生年金保険法に基づく老齢給付等」という。\n）を受けることができる者その他この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。以下「第一号被保険者」という。）\n二　厚生年金保険の被保険者（以下「第二号被保険者」という。）\n三　第二号被保険者の配偶者（日本国内に住所を有する者又は外国において留学をする学生その他の日本国内に住所を有しないが渡航目的その他の事情を考慮して日本国内に生活の基礎があると認められる者として厚生労働省令で定める者に限る。）であつて主として第二号被保険者の収入により生計を維持するもの（第二号被保険者である者その他この法律の適用を除外すべき特別\nの理由がある者として厚生労働省令で定める者を除く。以下「被扶養配偶者」という。）のうち二十歳以上六十歳未満のもの（以下「第三号被保険者」という。）\n２　前項第三号の規定の適用上、主として第二号被保険者の収入により生計を維持することの認定に関し必要な事項は、政令で定める。\n３　前項の認定については、行政手続法（平成五年法律第八十八号）第三章（第十二条及び第十四条を除く。）の規定は、適用しない。", "ch": 1}, {"key": "h8", "num": [8], "label": "第8条", "caption": "資格取得の時期", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（資格取得の時期）\n第8条　前条の規定による被保険者は、同条第1項第2号及び第3号のいずれにも該当しない者については第1号から第3号までのいずれかに該当するに至つた日に、20歳未満の者又は60歳以上の者については第4号に該当するに至つた日に、その他の者については同号又は第5号のいずれかに該当するに至つた日に、それぞれ被保険者の資格を取得する。\n1　20歳に達したとき。\n2　日本国内に住所を有するに至つたとき。\n3　厚生年金保険法に基づく老齢給付等を受けることができる者その他この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者でなくなつたとき。\n4　厚生年金保険の被保険者の資格を取得したとき。\n5　被扶養配偶者となつたとき。", "bg": "【1985年改正】3区分になれば、資格の始まりも一様ではない。被保険者ごとに資格取得の発生時点を整理した。第1号の20歳到達等と第2号・第3号の資格取得は契機が異なるため、同じ日付の理解を機械的に当てはめない。", "deb": "—", "tsu": "【昭和60年7月1日 発年第44号】1985年改正による3種別の制度創設に対応。資格取得日個々の例外について、この通知の記載のみで現行要件が確定するとは扱わない。", "kako": "令和6年、令和7年", "rows": [16], "heads": ["第2章　被保険者"], "orig": "（資格取得の時期）\n第八条　前条の規定による被保険者は、同条第一項第二号及び第三号のいずれにも該当しない者については第一号から第三号までのいずれかに該当するに至つた日に、二十歳未満の者又は六十歳以上の者については第四号に該当するに至つた日に、その他の者については同号又は第五号のいずれかに該当するに至つた日に、それぞれ被保険者の資格を取得する。\n一　二十歳に達したとき。\n二　日本国内に住所を有するに至つたとき。\n三　厚生年金保険法に基づく老齢給付等を受けることができる者その他この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者でなくなつたとき。\n四　厚生年金保険の被保険者の資格を取得したとき。\n五　被扶養配偶者となつたとき。", "ch": 1}, {"key": "h9", "num": [9], "label": "第9条", "caption": "資格喪失の時期", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（資格喪失の時期）\n第9条　第7条の規定による被保険者は、次の各号のいずれかに該当するに至つた日の翌日（第2号に該当するに至つた日に更に第7条第1項第2号若しくは第3号に該当するに至つたとき又は第3号から第5号までのいずれかに該当するに至つたとき（第4号については、厚生年金保険法に基づく老齢給付等を受けることができる者となつたときに限る。）は、その日）に、被保険者の資格を喪失する。\n1　死亡したとき。\n2　日本国内に住所を有しなくなつたとき（第7条第1項第2号又は第3号に該当するときを除く。）。\n3　60歳に達したとき（第7条第1項第2号に該当するときを除く。）。\n4　厚生年金保険法に基づく老齢給付等を受けることができる者その他この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者となつたとき（第7条第1項第2号又は第3号に該当するときを除く。）。\n5　厚生年金保険の被保険者の資格を喪失したとき（第7条第1項各号のいずれかに該当するときを除く。）。\n6　被扶養配偶者でなくなつたとき（第7条第1項第1号又は第2号に該当するときを除く。）。", "bg": "【1985年改正】資格は、いつ失われるのか。原則は事由発生日の翌日だが、一部は当日喪失という例外を規定。第1号から第2号への切替えや年齢要件との交錯に対応する。", "deb": "—", "tsu": "【昭和60年7月1日 発年第44号】基礎年金制度の被保険者制度改革に関する施行通知。個別の喪失時期は条文原文を優先。", "kako": "平成29年、平成30年、令和3年、令和4年、令和6年、令和8年", "rows": [17], "heads": ["第2章　被保険者"], "orig": "（資格喪失の時期）\n第九条　第七条の規定による被保険者は、次の各号のいずれかに該当するに至つた日の翌日（第二号に該当するに至つた日に更に第七条第一項第二号若しくは第三号に該当するに至つたとき又は第三号から第五号までのいずれかに該当するに至つたとき（第四号については、厚生年金保険法に基づく老齢給付等を受けることができる者となつたときに限る。\n）は、その日）に、被保険者の資格を喪失する。\n一　死亡したとき。\n二　日本国内に住所を有しなくなつたとき（第七条第一項第二号又は第三号に該当するときを除く。）。\n三　六十歳に達したとき（第七条第一項第二号に該当するときを除く。）。\n四　厚生年金保険法に基づく老齢給付等を受けることができる者その他この法律の適用を除外すべき特別の理由がある者として厚生労働省令で定める者となつたとき（第七条第一項第二号又は第三号に該当するときを除く。）。\n五　厚生年金保険の被保険者の資格を喪失したとき（第七条第一項各号のいずれかに該当するときを除く。）。\n六　被扶養配偶者でなくなつたとき（第七条第一項第一号又は第二号に該当するときを除く。）。", "ch": 1}, {"key": "h10", "num": [10], "label": "第10条", "caption": "", "status": "削除", "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "第10条　削除", "bg": "【2012年改正（平成24年法律第62号）】現行第10条は削除。過去の条文の規定は現行法の実体要件として扱わない。削除前条文の沿革確認は後続作業。", "deb": "—", "tsu": "—", "kako": "—", "rows": [18], "heads": ["第2章　被保険者"], "orig": "第十条　削除", "ch": 1}, {"key": "h11", "num": [11], "label": "第11条", "caption": "被保険者期間の計算", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（被保険者期間の計算）\n第11条　被保険者期間を計算する場合には、月によるものとし、被保険者の資格を取得した日の属する月からその資格を喪失した日の属する月の前月までをこれに算入する。\n2　被保険者がその資格を取得した日の属する月にその資格を喪失したときは、その月を1箇月として被保険者期間に算入する。ただし、その月にさらに被保険者の資格を取得したときは、この限りでない。\n3　被保険者の資格を喪失した後、さらにその資格を取得した者については、前後の被保険者期間を合算する。", "bg": "【1959年制定からの基本構造】加入の長さを、年金の額や保険料にどう結び付けるか。被保険者期間を月単位で定めた。資格取得月から喪失月の前月までを原則とし、同月得喪の場合などは別途規定。\n※制定時に採用した政策判断の個別質疑は未確認。", "deb": "—", "tsu": "—", "kako": "平成29年、令和元年、令和2年、令和5年、令和7年", "rows": [19], "heads": ["第2章　被保険者"], "orig": "（被保険者期間の計算）\n第十一条　被保険者期間を計算する場合には、月によるものとし、被保険者の資格を取得した日の属する月からその資格を喪失した日の属する月の前月までをこれに算入する。\n２　被保険者がその資格を取得した日の属する月にその資格を喪失したときは、その月を一箇月として被保険者期間に算入する。ただし、その月にさらに被保険者の資格を取得したときは、この限りでない。\n３　被保険者の資格を喪失した後、さらにその資格を取得した者については、前後の被保険者期間を合算する。", "ch": 1}, {"key": "h11-2", "num": [11, 2], "label": "第11条の2", "caption": "", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "〔学習用見出し：被保険者の種別変更月の計算〕\n第11条の2　第1号被保険者としての被保険者期間、第2号被保険者としての被保険者期間又は第3号被保険者としての被保険者期間を計算する場合には、被保険者の種別（第1号被保険者、第2号被保険者又は第3号被保険者のいずれであるかの区別をいう。以下同じ。）に変更があつた月は、変更後の種別の被保険者であつた月とみなす。\n同一の月において、2回以上にわたり被保険者の種別に変更があつたときは、その月は最後の種別の被保険者であつた月とみなす。", "bg": "【1985年改正・追加（昭和60年法律第34号）】第1号・第2号・第3号という被保険者の種別が導入され、同じ月の中で種別が変わる場合も想定されるようになった。そのため、同月内で種別が変わる場合の期間帰属を明文化。衆議院公布法の改正本文にも追加規定を確認できる。", "deb": "—", "tsu": "—", "kako": "平成30年、令和5年、令和7年", "rows": [20], "heads": ["第2章　被保険者"], "orig": "第十一条の二　第一号被保険者としての被保険者期間、第二号被保険者としての被保険者期間又は第三号被保険者としての被保険者期間を計算する場合には、被保険者の種別（第一号被保険者、第二号被保険者又は第三号被保険者のいずれであるかの区別をいう。以下同じ。）に変更があつた月は、変更後の種別の被保険者であつた月とみなす。\n同一の月において、二回以上にわたり被保険者の種別に変更があつたときは、その月は最後の種別の被保険者であつた月とみなす。", "ch": 1}, {"key": "h12", "num": [12], "label": "第12条", "caption": "届出", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（届出）\n第12条　被保険者（第3号被保険者を除く。次項において同じ。）は、厚生労働省令の定めるところにより、その資格の取得及び喪失並びに種別の変更に関する事項並びに氏名及び住所の変更に関する事項を市町村長に届け出なければならない。\n2　被保険者の属する世帯の世帯主（以下単に「世帯主」という。）は、被保険者に代つて、前項の届出をすることができる。\n3　住民基本台帳法（昭和42年法律第81号）第22条から第24条まで、第30条の46又は第30条の47の規定による届出があつたとき（当該届出に係る書面に同法第29条の規定による付記がされたときに限る。）は、その届出と同一の事由に基づく第1項の規定による届出があつたものとみなす。\n4　市町村長は、第1項又は第2項の規定による届出を受理したとき（氏名及び住所の変更に関する事項の届出であつて厚生労働省令で定めるものを受理したときを除く。）は、厚生労働省令の定めるところにより、厚生労働大臣にこれを報告しなければならない。\n5　第3号被保険者は、厚生労働省令の定めるところにより、その資格の取得及び喪失並びに種別の変更に関する事項並びに氏名及び住所の変更に関する事項を厚生労働大臣に届け出なければならない。ただし、氏名及び住所の変更に関する事項であつて厚生労働省令で定めるものについては、この限りでない。\n6　前項の届出は、厚生労働省令で定める場合を除き、厚生年金保険法第2条の5第1項第1号に規定する第1号厚生年金被保険者（以下「第1号厚生年金被保険者」という。）である第2号被保険者の被扶養配偶者である第3号被保険者にあつては、その配偶者である第2号被保険者を使用する事業主を経由して行うものとし、同項第2号に規定する第2号厚生年金被保険者（以下「第2号厚生年金被保険者」という。）、同項第3号に規定する第3号厚生年金被保険者（以下「第3号厚生年金被保険者」という。）又は同項第4号に規定 , "ch": 1}, {"key": "h12-2", "num": [12, 2], "label": "第12条の2", "caption": "", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "〔学習用見出し：第3号被保険者でなくなった場合の届出〕\n第12条の2　第3号被保険者であつた者は、第2号被保険者の被扶養配偶者でなくなつたことについて、厚生労働省令の定めるところにより、その旨を厚生労働大臣に届け出なければならない。\n2　前条第6項から第9項までの規定は、前項の届出について準用する。この場合において、必要な技術的読替えは、政令で定める。", "bg": "【2013年改正で追加／2014年12月施行】扶養関係が変わっても年金記録は第3号のまま残る――そうした『不整合記録』を防ぐため、非該当の届出を整備。平成26年7月22日・年管発0722第1号で届出手続を規定。", "deb": "—", "tsu": "【平成26年7月22日・年管発0722第1号】第12条の2に基づく被扶養配偶者非該当届の記載事項等を通知。2014年12月1日施行。\n【平成26年11月1日・年管管発1101第1号】対象者、提出経路など不整合記録防止の実務を説明。\n※当時の書面・媒体の細目は現行手続と照合が必要。", "kako": "令和2年", "rows": [22], "heads": ["第2章　被保険者"], "orig": "第十二条の二　第三号被保険者であつた者は、第二号被保険者の被扶養配偶者でなくなつたことについて、厚生労働省令の定めるところにより、その旨を厚生労働大臣に届け出なければならない。\n２　前条第六項から第九項までの規定は、前項の届出について準用する。この場合において、必要な技術的読替えは、政令で定める。", "ch": 1}, {"key": "h13", "num": [13], "label": "第13条", "caption": "", "status": "削除", "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "第13条　削除", "bg": "【2020年改正／2022年4月施行】年金手帳の新規交付を廃止し、基礎年金番号通知書へ切り替えたことに伴い第13条を削除（令和2年法律第40号）。従前の年金手帳は引き続き基礎年金番号を確認する資料として利用可能。", "deb": "—", "tsu": "—", "kako": "—", "rows": [23], "heads": ["第2章　被保険者"], "orig": "第十三条　削除", "ch": 1}, {"key": "h14", "num": [14], "label": "第14条", "caption": "国民年金原簿", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（国民年金原簿）\n第14条　厚生労働大臣は、国民年金原簿を備え、これに被保険者の氏名、資格の取得及び喪失、種別の変更、保険料の納付状況、基礎年金番号（政府管掌年金事業（政府が管掌する国民年金事業及び厚生年金保険事業をいう。）の運営に関する事務その他当該事業に関連する事務であつて厚生労働省令で定めるものを遂行するために用いる記号及び番号であつて厚生労働省令で定めるものをいう。）その他厚生労働省令で定める事項を記録するものとする。", "bg": "【制定からの管理原簿】年金の受給権を支えるのは、加入と納付の記録である。被保険者資格や保険料納付状況等を管理する中核的な規定を置いた。\n【1985年以降】被保険者種別の記録が加わり、後年は基礎年金番号等を記録。第14条の2以下の訂正請求制度は、本条の記録の正確性を保つための法的手続。", "deb": "—", "tsu": "—", "kako": "令和元年、令和2年", "rows": [24], "heads": ["第2章　被保険者"], "orig": "（国民年金原簿）\n第十四条　厚生労働大臣は、国民年金原簿を備え、これに被保険者の氏名、資格の取得及び喪失、種別の変更、保険料の納付状況、基礎年金番号（政府管掌年金事業（政府が管掌する国民年金事業及び厚生年金保険事業をいう。）の運営に関する事務その他当該事業に関連する事務であつて厚生労働省令で定めるものを遂行するために用いる記号及び番号であつて厚生労働省令で定めるもの\nをいう。）その他厚生労働省令で定める事項を記録するものとする。", "ch": 1}, {"key": "h14-2", "num": [14, 2], "label": "第14条の2", "caption": "訂正の請求", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（訂正の請求）\n第14条の2　被保険者又は被保険者であつた者は、国民年金原簿に記録された自己に係る特定国民年金原簿記録（被保険者の資格の取得及び喪失、種別の変更、保険料の納付状況その他厚生労働省令で定める事項の内容をいう。以下この項において同じ。）が事実でない、又は国民年金原簿に自己に係る特定国民年金原簿記録が記録されていないと思料するときは、厚生労働省令で定めるところにより、厚生労働大臣に対し、国民年金原簿の訂正の請求をすることができる。\n2　前項の規定は、被保険者又は被保険者であつた者が死亡した場合において、次の表の上欄に掲げる者について準用する。この場合において、同項中「自己」とあるのは、同表の上欄に掲げる者の区分に応じ、同表の下欄に掲げる字句に読み替えるものとする。\n第19条の規定により未支給の年金の支給を請求することができる者　│　死亡した年金給付の受給権者\n遺族基礎年金を受けることができる配偶者又は子　│　死亡した被保険者又は被保険者であつた者\n寡婦年金を受けることができる妻　│　死亡した夫\n死亡一時金を受けることができる遺族　│　死亡した被保険者又は被保険者であつた者", "bg": "【2014年改正・追加／2015年3月1日施行】年金記録を正せないままでは、本人の年金権に影響が残りかねない。記録問題への対応として、従来の第三者委員会方式等の経験を踏まえ、年金記録の訂正を法律上請求できる仕組みを整備。本人のほか、死亡後には法定の遺族等に準用する。平成26年法律第64号と平成27年2月27日通知で確認。", "deb": "【2014年5月23日・衆議院厚生労働委員会】年金記録の訂正を厚労省の制度内で判断するなら、その公平性をどう担保するのか。この点が問われ、田村憲久厚生労働大臣は、従前の総務省第三者委員会と同様の救済を継続できる旨を説明。\n【同年5月28日・参議院本会議】外部有識者の審議、基準の明確化、迅速な訂正手続について議員質問と田村大臣答弁が行われた。※法案全体の審議。", "tsu": "【平成27年2月27日・年管発0227第1号、第2号】記録訂正に関する方針、国民年金記録訂正請求認定基準・要領、事務取扱要領を通知（原則2015年3月1日適用）。\n※本条は2014年改正法で創設。従来の年金記録確認第三者委員会の旧運用とは区別する。", "kako": "平成30年、令和4年", "rows": [25], "heads": ["第2章　被保険者"], "orig": "（訂正の請求）\n第十四条の二　被保険者又は被保険者であつた者は、国民年金原簿に記録された自己に係る特定国民年金原簿記録（被保険者の資格の取得及び喪失、種別の変更、保険料の納付状況その他厚生労働省令で定める事項の内容をいう。以下この項において同じ。）が事実でない、又は国民年金原簿に自己に係る特定国民年金原簿記録が記録されていないと思料するときは、\n厚生労働省令で定めるところにより、厚生労働大臣に対し、国民年金原簿の訂正の請求をすることができる。\n２　前項の規定は、被保険者又は被保険者であつた者が死亡した場合において、次の表の上欄に掲げる者について準用する。この場合において、同項中「自己」とあるのは、同表の上欄に掲げる者の区分に応じ、同表の下欄に掲げる字句に読み替えるものとする。\n第十九条の規定により未支給の年金の支給を請求することができる者\n死亡した年金給付の受給権者\n遺族基礎年金を受けることができる配偶者又は子\n死亡した被保険者又は被保険者であつた者\n寡婦年金を受けることができる妻\n死亡した夫\n死亡一時金を受けることができる遺族\n死亡した被保険者又は被保険者であつた者", "ch": 1}, {"key": "h14-3", "num": [14, 3], "label": "第14条の3", "caption": "訂正に関する方針", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（訂正に関する方針）\n第14条の3　厚生労働大臣は、前条第1項（同条第2項において準用する場合を含む。）の規定による請求（次条において「訂正請求」という。）に係る国民年金原簿の訂正に関する方針を定めなければならない。\n2　厚生労働大臣は、前項の方針を定め、又は変更しようとするときは、あらかじめ、社会保障審議会に諮問しなければならない。", "bg": "【2014年改正・追加】記録を訂正するか否か。その判断を恣意的なものにしないため、厚生労働大臣による方針策定と社会保障審議会への事前諮問を義務付けた。2015年の記録訂正制度開始に伴い方針（告示第42号）を整備。", "deb": "【2014年5月28日・参議院本会議】訂正手続を公正で透明なものにできるかが議論の焦点になった。田村憲久厚生労働大臣は、判断基準等を社会保障審議会に諮問して定める趣旨を説明。※第14条の2～4にまたがる法案全体の質疑。", "tsu": "【平成27年2月27日・年管発0227第1号／第2号】訂正に関する方針（平成27年厚生労働省告示第42号）等の制定と取扱いを通知。現行の告示・基準の改正履歴については追加照合が必要。", "kako": "令和2年、令和7年", "rows": [26], "heads": ["第2章　被保険者"], "orig": "（訂正に関する方針）\n第十四条の三　厚生労働大臣は、前条第一項（同条第二項において準用する場合を含む。）の規定による請求（次条において「訂正請求」という。）に係る国民年金原簿の訂正に関する方針を定めなければならない。\n２　厚生労働大臣は、前項の方針を定め、又は変更しようとするときは、あらかじめ、社会保障審議会に諮問しなければならない。", "ch": 1}, {"key": "h14-4", "num": [14, 4], "label": "第14条の4", "caption": "訂正請求に対する措置", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（訂正請求に対する措置）\n第14条の4　厚生労働大臣は、訂正請求に理由があると認めるときは、当該訂正請求に係る国民年金原簿の訂正をする旨を決定しなければならない。\n2　厚生労働大臣は、前項の規定による決定をする場合を除き、訂正請求に係る国民年金原簿の訂正をしない旨を決定しなければならない。\n3　厚生労働大臣は、前2項の規定による決定をしようとするときは、あらかじめ、社会保障審議会に諮問しなければならない。", "bg": "【2014年改正・追加】訂正を認める場合も、認めない場合も、判断の根拠を明確にする必要があった。そこで、その判断を法律上の決定とし、原則として社会保障審議会への事前諮問を求め、判断の公正性と権利救済を確保。現在の実務では地方厚生（支）局が調査し、地方年金記録訂正審議会が審議する。", "deb": "【2014年5月21日・衆議院厚生労働委員会】年金記録の訂正・不訂正が処分になることで不服申立てが可能になり、地方厚生局長の判断を厚生労働大臣が審査する仕組みについて樽見英樹政府参考人が説明。※個別条文だけではなく訂正制度全体の議論。", "tsu": "【平成27年2月27日・年管発0227第1号／第2号】記録訂正に関する事務取扱要領・認定基準等を通知。社会保障審議会の下部組織である地方年金記録訂正審議会等の運用については現行公開資料を参照。", "kako": "—", "rows": [27], "heads": ["第2章　被保険者"], "orig": "（訂正請求に対する措置）\n第十四条の四　厚生労働大臣は、訂正請求に理由があると認めるときは、当該訂正請求に係る国民年金原簿の訂正をする旨を決定しなければならない。\n２　厚生労働大臣は、前項の規定による決定をする場合を除き、訂正請求に係る国民年金原簿の訂正をしない旨を決定しなければならない。\n３　厚生労働大臣は、前二項の規定による決定をしようとするときは、あらかじめ、社会保障審議会に諮問しなければならない。", "ch": 1}, {"key": "h14-5", "num": [14, 5], "label": "第14条の5", "caption": "被保険者に対する情報の提供", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（被保険者に対する情報の提供）\n第14条の5　厚生労働大臣は、国民年金制度に対する国民の理解を増進させ、及びその信頼を向上させるため、厚生労働省令で定めるところにより、被保険者に対し、当該被保険者の保険料納付の実績及び将来の給付に関する必要な情報を分かりやすい形で通知するものとする。", "bg": "【2004年改正で新設（当初は第14条の2）】自分が納めた保険料と将来の給付を、本人が把握できるようにする。そのため、納付実績・将来給付の見通し等を分かりやすく通知する制度的基盤を整備した。2014年の年金記録訂正制度創設により、旧第14条の2を第14条の5へ繰り下げ。\n【実務例】ねんきん定期便等。", "deb": "—", "tsu": "—", "kako": "令和4年", "rows": [28], "heads": ["第2章　被保険者"], "orig": "（被保険者に対する情報の提供）\n第十四条の五　厚生労働大臣は、国民年金制度に対する国民の理解を増進させ、及びその信頼を向上させるため、厚生労働省令で定めるところにより、被保険者に対し、当該被保険者の保険料納付の実績及び将来の給付に関する必要な情報を分かりやすい形で通知するものとする。", "ch": 1}, {"key": "h15", "num": [15], "label": "第15条", "caption": "給付の種類", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（給付の種類）\n第15条　この法律による給付（以下単に「給付」という。）は、次のとおりとする。\n1　老齢基礎年金\n2　障害基礎年金\n3　遺族基礎年金\n4　付加年金、寡婦年金及び死亡一時金", "bg": "【1959年制定】当初の第15条は老齢年金、障害年金、母子年金・遺児年金・寡婦年金を列挙。現在の給付区分を制定時からのものと取り違えない。\n【1985年改正／1986年4月施行】全国民共通の基礎年金を導入したことに伴い、老齢・障害・遺族の基礎年金を中心とする給付体系に変更した。", "deb": "—（第15条固有の国会質疑・政府答弁は今回未確認）", "tsu": "【昭和60年7月1日・発年第44号】1985年年金制度改正の施行関係通知。基礎年金への制度転換に関する参考資料。第15条のみの個別解釈通知という意味ではない。", "kako": "令和2年", "rows": [31], "heads": ["第3章　給付", "第1節　通則"], "orig": "（給付の種類）\n第十五条　この法律による給付（以下単に「給付」という。）は、次のとおりとする。\n一　老齢基礎年金\n二　障害基礎年金\n三　遺族基礎年金\n四　付加年金、寡婦年金及び死亡一時金", "ch": 2}, {"key": "h16", "num": [16], "label": "第16条", "caption": "裁定", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（裁定）\n第16条　給付を受ける権利は、その権利を有する者（以下「受給権者」という。）の請求に基いて、厚生労働大臣が裁定する。", "bg": "【1959年制定】受給権者の請求に基づき行政庁が受給権を裁定する仕組みを規定。制定当時の裁定権者は厚生大臣であった。\n【後年の改正】現行本文では厚生労働大臣とされる。請求・裁定と年金支払開始の関係は第18条等と併せて理解する。", "deb": "—（第16条固有の国会質疑・政府答弁は今回未確認）", "tsu": "—（第16条の裁定手続を直接解説する通知の発出番号・現行適用関係は今回未確認）", "kako": "令和3年、令和7年", "rows": [32], "heads": ["第3章　給付", "第1節　通則"], "orig": "（裁定）\n第十六条　給付を受ける権利は、その権利を有する者（以下「受給権者」という。）の請求に基いて、厚生労働大臣が裁定する。", "ch": 2}, {"key": "h16-2", "num": [16, 2], "label": "第16条の2", "caption": "調整期間", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（調整期間）\n第16条の2　政府は、第4条の3第1項の規定により財政の現況及び見通しを作成するに当たり、国民年金事業の財政が、財政均衡期間の終了時に給付の支給に支障が生じないようにするために必要な積立金（年金特別会計の国民年金勘定の積立金をいう。第5章において同じ。）を保有しつつ当該財政均衡期間にわたつてその均衡を保つことができないと見込まれる場合には、年金たる給付（付加年金を除く。）の額（以下この項において「給付額」という。）を調整するものとし、政令で、給付額を調整する期間（以下「調整期間」という。）の開始年度を定めるものとする。\n2　財政の現況及び見通しにおいて、前項の調整を行う必要がなくなつたと認められるときは、政令で、調整期間の終了年度を定めるものとする。\n3　政府は、調整期間において財政の現況及び見通しを作成するときは、調整期間の終了年度の見通しについても作成し、併せて、これを公表しなければならない。", "bg": "【2004年改正】保険料負担の先行きを見通せるようにするため、将来の保険料水準の上限を固定し、長期的な給付と負担の均衡を図る財政枠組みと、給付水準を自動調整するマクロ経済スライドを導入。必要な給付額調整の開始・終了年度を財政検証と連動させる（第16条の2を全面改正）。\n※個々の年金額を計算するマクロ経済スライドの具体的な数式は別条文の規定も参照する。", "deb": "【2004年6月1日・参議院厚生労働委員会】マクロ経済スライドで賃金・物価の動向をどう扱うかについて質疑。吉武民樹政府参考人は、将来の保険料水準の法定と被保険者数の減少等を反映した給付調整により、負担と給付の均衡を確保する考え方を説明。※2004年改正の制度全体の質疑であり第16条の2固有の逐条質疑ではない。", "tsu": "—（2004年改正に関する厚生労働省の制度説明は確認。第16条の2固有の通達の現行効力については未確認）", "kako": "令和3年", "rows": [33], "heads": ["第3章　給付", "第1節　通則"], "orig": "（調整期間）\n第十六条の二　政府は、第四条の三第一項の規定により財政の現況及び見通しを作成するに当たり、国民年金事業の財政が、財政均衡期間の終了時に給付の支給に支障が生じないようにするために必要な積立金（年金特別会計の国民年金勘定の積立金をいう。第五章において同じ。）を保有しつつ当該財政均衡期間にわたつてその均衡を保つことができないと見込まれる場合には、\n年金たる給付（付加年金を除く。）の額（以下この項において「給付額」という。）を調整するものとし、政令で、給付額を調整する期間（以下「調整期間」という。）の開始年度を定めるものとする。\n２　財政の現況及び見通しにおいて、前項の調整を行う必要がなくなつたと認められるときは、政令で、調整期間の終了年度を定めるものとする。\n３　政府は、調整期間において財政の現況及び見通しを作成するときは、調整期間の終了年度の見通しについても作成し、併せて、これを公表しなければならない。", "ch": 2}, {"key": "h17", "num": [17], "label": "第17条", "caption": "端数処理", "status": null, "sheet": "第1～17条_総則・資格", "scope": "honsoku", "text": "（端数処理）\n第17条　年金たる給付（以下「年金給付」という。）を受ける権利を裁定する場合又は年金給付の額を改定する場合において、年金給付の額に50銭未満の端数が生じたときは、これを切り捨て、50銭以上1円未満の端数が生じたときは、これを1円に切り上げるものとする。\n2　前項に規定するもののほか、年金給付の額を計算する場合において生じる1円未満の端数の処理については、政令で定める。", "bg": "【1959年制定】当初の第17条は、裁定時に1円未満の端数を1円へ切り上げる規定だった。\n【2012年改正・2015年10月施行の一元化関連措置】年金額の端数処理を従前の100円単位から1円単位へ変更。受給権発生時期や既裁定年金の最初の改定時期により適用時期が異なる。第18条の2の支払期ごとの端数処理と区別する。", "deb": "—（今回確認した範囲では第17条の端数変更に固有の質疑・政府答弁を特定できず）", "tsu": "【平成27年9月30日・年管管発0930第13号】被用者年金一元化の施行に伴う事務取扱通知。裁定・改定時の年金額を100円単位から1円単位へ変更する適用区分等を説明。", "kako": "—", "rows": [34], "heads": ["第3章　給付", "第1節　通則"], "orig": "（端数処理）\n第十七条　年金たる給付（以下「年金給付」という。）を受ける権利を裁定する場合又は年金給付の額を改定する場合において、年金給付の額に五十銭未満の端数が生じたときは、これを切り捨て、五十銭以上一円未満の端数が生じたときは、これを一円に切り上げるものとする。\n２　前項に規定するもののほか、年金給付の額を計算する場合において生じる一円未満の端数の処理については、政令で定める。", "ch": 2}, {"key": "h18", "num": [18], "label": "第18条", "caption": "年金の支給期間及び支払期月", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "（年金の支給期間及び支払期月）\n第18条　年金給付の支給は、これを支給すべき事由が生じた日の属する月の翌月から始め、権利が消滅した日の属する月で終るものとする。\n2　年金給付は、その支給を停止すべき事由が生じたときは、その事由が生じた日の属する月の翌月からその事由が消滅した日の属する月までの分の支給を停止する。ただし、これらの日が同じ月に属する場合は、支給を停止しない。\n3　年金給付は、毎年2月、4月、6月、8月、10月及び12月の6期に、それぞれの前月までの分を支払う。ただし、前支払期月に支払うべきであつた年金又は権利が消滅した場合若しくは年金の支給を停止した場合におけるその期の年金は、その支払期月でない月であつても、支払うものとする。", "bg": "【1959年制定】年金はいつから、いつまで支給するのか。その基本を月単位で示す原則は、制定当初から置かれていた。支払期月は制定当時、2月・5月・8月・11月の年4期だった。\n【後年の改正】段階的に年6回支払へ改められ、現行は偶数月（2・4・6・8・10・12月）の年6期。受給権の『発生月の翌月から』と、実際の『支払期月』を混同しない。", "deb": "【1988年4月21日・衆議院社会労働委員会】「年4回」から「年6回」へ。旧法国民年金の障害年金等の支払回数を増やす理由を新井彬之議員が問い、佐々木喜之政府委員は、受給者側の要請を踏まえ、よりきめ細かい支払サービスを行うためと説明。新井議員はさらに毎月払いの早期実現を要望した。※当時の旧法年金に関する審議。", "tsu": "—（支払期月の段階的改正について制定・改正法と国会審議は確認。第18条を直接対象とする後続通達の全件照合は未実施）", "kako": "令和元年、令和5年、令和6年", "rows": [7], "heads": ["第3章　給付", "第1節　通則"], "orig": "（年金の支給期間及び支払期月）\n第十八条　年金給付の支給は、これを支給すべき事由が生じた日の属する月の翌月から始め、権利が消滅した日の属する月で終るものとする。\n２　年金給付は、その支給を停止すべき事由が生じたときは、その事由が生じた日の属する月の翌月からその事由が消滅した日の属する月までの分の支給を停止する。ただし、これらの日が同じ月に属する場合は、支給を停止しない。\n３　年金給付は、毎年二月、四月、六月、八月、十月及び十二月の六期に、それぞれの前月までの分を支払う。ただし、前支払期月に支払うべきであつた年金又は権利が消滅した場合若しくは年金の支給を停止した場合におけるその期の年金は、その支払期月でない月であつても、支払うものとする。", "ch": 2}, {"key": "h18-2", "num": [18, 2], "label": "第18条の2", "caption": "2月期支払の年金の加算", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "（2月期支払の年金の加算）\n第18条の2　前条第3項の規定による支払額に1円未満の端数が生じたときは、これを切り捨てるものとする。\n2　毎年3月から翌年2月までの間において前項の規定により切り捨てた金額の合計額（1円未満の端数が生じたときは、これを切り捨てた額）については、これを当該2月の支払期月の年金額に加算するものとする。", "bg": "【2012年改正で追加】細かな端数でも、支払が重なれば扱いを統一する必要がある。各支払期に生じる1円未満の端数を切り捨て、3月～翌2月に切り捨てた端数の合計額を2月期に加算する規定を設けた。\n【2015年10月施行】被用者年金一元化に伴う円単位の年金額処理の実務で適用。年額の裁定・改定時の端数処理（第17条）とは段階が異なる。", "deb": "—（第18条の2固有の実際の国会質疑・答弁は今回未確認）", "tsu": "【平成27年9月30日・年管管発0930第13号】支払期の1円未満端数を切り捨て、年間の切捨て額を2月期の支払額に加算する処理と年金振込通知書への表示を案内。", "kako": "令和5年", "rows": [8], "heads": ["第3章　給付", "第1節　通則"], "orig": "（二月期支払の年金の加算）\n第十八条の二　前条第三項の規定による支払額に一円未満の端数が生じたときは、これを切り捨てるものとする。\n２　毎年三月から翌年二月までの間において前項の規定により切り捨てた金額の合計額（一円未満の端数が生じたときは、これを切り捨てた額）については、これを当該二月の支払期月の年金額に加算するものとする。", "ch": 2}, {"key": "h18-3", "num": [18, 3], "label": "第18条の3", "caption": "死亡の推定", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "（死亡の推定）\n第18条の3　船舶が沈没し、転覆し、滅失し、若しくは行方不明となつた際現にその船舶に乗つていた者若しくは船舶に乗つていてその船舶の航行中に行方不明となつた者の生死が3箇月間分らない場合又はこれらの者の死亡が3箇月以内に明らかとなり、かつ、その死亡の時期が分らない場合には、死亡を支給事由とする給付の支給に関する規定の適用については、その船舶が沈没し、転覆し、滅失し、若しくは行方不明となつた日又はその者が行方不明となつた日に、その者は、死亡したものと推定する。航空機が墜落し、滅失し、若しくは行方不明となつた際現にその航空機に乗つていた者若しくは航空機に乗つていてその航空機の航行中に行方不明となつた者の生死が3箇月間分らない場合又はこれらの者の死亡が3箇月以内に明らかとなり、かつ、その死亡の時期が分らない場合にも、同様とする。", "bg": "【1961年改正で追加】船舶・航空機の事故等では、生死や死亡時期を確認できないことがある。その場合に備え、死亡推定に関する特則を設けた。死亡による年金給付の支給要件や死亡日の判定に利用する。\n【2012年改正】第18条の2の挿入に伴い、旧第18条の2から第18条の3へ繰下げ。具体的な改正理由の個別質疑は未確認。", "deb": "—（第18条の3固有の国会質疑・政府答弁は今回未確認）", "tsu": "—（本条固有の現行解釈通知を番号とともに確認できず）", "kako": "平成29年", "rows": [9], "heads": ["第3章　給付", "第1節　通則"], "orig": "（死亡の推定）\n第十八条の三　船舶が沈没し、転覆し、滅失し、若しくは行方不明となつた際現にその船舶に乗つていた者若しくは船舶に乗つていてその船舶の航行中に行方不明となつた者の生死が三箇月間分らない場合又はこれらの者の死亡が三箇月以内に明らかとなり、かつ、その死亡の時期が分らない場合には、死亡を支給事由とする給付の支給に関する規定の適用については、その船舶が沈没し、\n転覆し、滅失し、若しくは行方不明となつた日又はその者が行方不明となつた日に、その者は、死亡したものと推定する。航空機が墜落し、滅失し、若しくは行方不明となつた際現にその航空機に乗つていた者若しくは航空機に乗つていてその航空機の航行中に行方不明となつた者の生死が三箇月間分らない場合又はこれらの者の死亡が三箇月以内に明らかとなり、かつ、\nその死亡の時期が分らない場合にも、同様とする。", "ch": 2}, {"key": "h18-4", "num": [18, 4], "label": "第18条の4", "caption": "失踪宣告の場合の取扱い", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "（失踪宣告の場合の取扱い）\n第18条の4　失踪の宣告を受けたことにより死亡したとみなされた者に係る死亡を支給事由とする給付の支給に関する規定の適用については、第37条、第37条の2、第49条第1項、第52条の2第1項及び第52条の3第1項中「死亡日」とあるのは「行方不明となつた日」とし、「死亡の当時」とあるのは「行方不明となつた当時」とする。\nただし、受給権者又は給付の支給の要件となり、若しくはその額の加算の対象となる者の身分関係、年齢及び障害の状態に係るこれらの規定の適用については、この限りでない。", "bg": "【1971年改正で追加】民法上の失踪宣告によって死亡したとみなされるケースの、死亡を理由とする給付の認定時点の特則を規定。身分関係・年齢・障害状態に関する例外を明示。\n【2012年改正】第18条の2挿入に伴い、旧第18条の3から第18条の4へ繰下げ。制度趣旨は現行条文構成からの説明であり、当時の政府答弁と同一視しない。", "deb": "—（第18条の4固有の国会質疑・政府答弁は今回未確認）", "tsu": "—（本条固有の現行解釈通知を番号とともに確認できず）", "kako": "令和2年、令和7年", "rows": [10], "heads": ["第3章　給付", "第1節　通則"], "orig": "（失踪宣告の場合の取扱い）\n第十八条の四　失踪の宣告を受けたことにより死亡したとみなされた者に係る死亡を支給事由とする給付の支給に関する規定の適用については、第三十七条、第三十七条の二、第四十九条第一項、第五十二条の二第一項及び第五十二条の三第一項中「死亡日」とあるのは「行方不明となつた日」とし、「死亡の当時」とあるのは「行方不明となつた当時」とする。\nただし、受給権者又は給付の支給の要件となり、若しくはその額の加算の対象となる者の身分関係、年齢及び障害の状態に係るこれらの規定の適用については、この限りでない。", "ch": 2}, {"key": "h19", "num": [19], "label": "第19条", "caption": "未支給年金", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "（未支給年金）\n第19条　年金給付の受給権者が死亡した場合において、その死亡した者に支給すべき年金給付でまだその者に支給しなかつたものがあるときは、その者の配偶者、子、父母、孫、祖父母、兄弟姉妹又はこれらの者以外の3親等内の親族であつて、その者の死亡の当時その者と生計を同じくしていたものは、自己の名で、その未支給の年金の支給を請求することができる。\n2　前項の場合において、死亡した者が遺族基礎年金の受給権者であつたときは、その者の死亡の当時当該遺族基礎年金の支給の要件となり、又はその額の加算の対象となつていた被保険者又は被保険者であつた者の子は、同項に規定する子とみなす。\n3　第1項の場合において、死亡した受給権者が死亡前にその年金を請求していなかつたときは、同項に規定する者は、自己の名で、その年金を請求することができる。\n4　未支給の年金を受けるべき者の順位は、政令で定める。\n5　未支給の年金を受けるべき同順位者が2人以上あるときは、その1人のした請求は、全員のためその全額につきしたものとみなし、その1人に対してした支給は、全員に対してしたものとみなす。", "bg": "【1959年制定】亡くなった受給権者に支払われるはずだった年金を、誰が受け取れるのか。制定当初は、死亡者の妻・子が母子年金や遺児年金を受ける場合等に限る、現在より狭い仕組みだった。\n【1961年改正】対象範囲に関する条文を全面改正。\n【2012年法律第62号／2014年4月施行】未支給年金の請求対象を『生計を同じくする配偶者、子、父母、孫、祖父母、兄弟姉妹』から『その他の3親等内の親族』まで拡大。優先順位は政令に委任。", "deb": "—（2012年改正の本条に特定した国会質疑・答弁は今回未確認。施行通知に記載された制度変更を根拠に説明）", "tsu": "【平成26年3月31日・年管管発0331第10号】第19条の未支給年金の請求者拡大を通知。3親等内の親族の具体例と必要書類等の事務取扱いを説明。\n【日本年金機構・現行手続】同居とは限らない『生計を同じく』する要件、順位、同順位者の代表請求などを掲載。", "kako": "平成29年、令和元年、令和2年、令和3年、令和5年、令和6年、令和7年", "rows": [11], "heads": ["第3章　給付", "第1節　通則"], "orig": "（未支給年金）\n第十九条　年金給付の受給権者が死亡した場合において、その死亡した者に支給すべき年金給付でまだその者に支給しなかつたものがあるときは、その者の配偶者、子、父母、孫、祖父母、兄弟姉妹又はこれらの者以外の三親等内の親族であつて、その者の死亡の当時その者と生計を同じくしていたものは、自己の名で、その未支給の年金の支給を請求することができる。\n２　前項の場合において、死亡した者が遺族基礎年金の受給権者であつたときは、その者の死亡の当時当該遺族基礎年金の支給の要件となり、又はその額の加算の対象となつていた被保険者又は被保険者であつた者の子は、同項に規定する子とみなす。\n３　第一項の場合において、死亡した受給権者が死亡前にその年金を請求していなかつたときは、同項に規定する者は、自己の名で、その年金を請求することができる。\n４　未支給の年金を受けるべき者の順位は、政令で定める。\n５　未支給の年金を受けるべき同順位者が二人以上あるときは、その一人のした請求は、全員のためその全額につきしたものとみなし、その一人に対してした支給は、全員に対してしたものとみなす。", "ch": 2}, {"key": "h20", "num": [20], "label": "第20条", "caption": "併給の調整", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "（併給の調整）\n第20条　遺族基礎年金又は寡婦年金は、その受給権者が他の年金給付（付加年金を除く。）又は厚生年金保険法による年金たる保険給付（当該年金給付と同一の支給事由に基づいて支給されるものを除く。以下この条において同じ。）を受けることができるときは、その間、その支給を停止する。老齢基礎年金の受給権者が他の年金給付（付加年金を除く。）又は同法による年金たる保険給付（遺族厚生年金を除く。）を受けることができる場合における当該老齢基礎年金及び障害基礎年金の受給権者が他の年金給付（付加年金を除く。）を受けることができる場合における当該障害基礎年金についても、同様とする。\n2　前項の規定によりその支給を停止するものとされた年金給付の受給権者は、同項の規定にかかわらず、その支給の停止の解除を申請することができる。ただし、その者に係る同項に規定する他の年金給付又は厚生年金保険法による年金たる保険給付について、この項の本文若しくは次項又は他の法令の規定でこれらに相当するものとして政令で定めるものによりその支給の停止が解除されているときは、この限りでない。\n3　第1項の規定によりその支給を停止するものとされた年金給付について、その支給を停止すべき事由が生じた日の属する月分の支給が行われる場合は、その事由が生じたときにおいて、当該年金給付に係る前項の申請があつたものとみなす。\n4　第2項の申請（前項の規定により第2項の申請があつたものとみなされた場合における当該申請を含む。）は、いつでも、将来に向かつて撤回することができる。", "bg": "【1959年制定】複数の年金を受けられる場合、どのように調整するか。原則として本人の選択した1年金を支給し、他を停止する『1人1年金』の基本的考え方を置いていた。\n【1985年改正／1986年施行】基礎年金と被用者年金の2階建て体系に対応するため全面改正。その後の改正により同一支給事由の基礎年金・厚生年金や一定の65歳以上の異事由給付の組合せ等について例外が設けられた。具体的な併給可否は厚生年金保険法等も併せて確認。", "deb": "—（第20条に直接対応する実際の改正時国会質疑・政府答弁は今回未確認）", "tsu": "—（本条の併給可否は日本年金機構の現行解説で補足。ただし、その解説は通達ではないため通達欄では区別）\n【参考：日本年金機構】『年金の併給または選択』は原則1人1年金と例外（65歳以上の一定の組合せ）を具体的に説明。", "kako": "平成29年、令和3年、令和4年、令和5年、令和6年", "rows": [12], "heads": ["第3章　給付", "第1節　通則"], "orig": "（併給の調整）\n第二十条　遺族基礎年金又は寡婦年金は、その受給権者が他の年金給付（付加年金を除く。）又は厚生年金保険法による年金たる保険給付（当該年金給付と同一の支給事由に基づいて支給されるものを除く。以下この条において同じ。）を受けることができるときは、その間、その支給を停止する。老齢基礎年金の受給権者が他の年金給付（付加年金を除く。\n）又は同法による年金たる保険給付（遺族厚生年金を除く。）を受けることができる場合における当該老齢基礎年金及び障害基礎年金の受給権者が他の年金給付（付加年金を除く。）を受けることができる場合における当該障害基礎年金についても、同様とする。\n２　前項の規定によりその支給を停止するものとされた年金給付の受給権者は、同項の規定にかかわらず、その支給の停止の解除を申請することができる。ただし、その者に係る同項に規定する他の年金給付又は厚生年金保険法による年金たる保険給付について、この項の本文若しくは次項又は他の法令の規定でこれらに相当するものとして政令で定めるものによりその支給の停止が\n解除されているときは、この限りでない。\n３　第一項の規定によりその支給を停止するものとされた年金給付について、その支給を停止すべき事由が生じた日の属する月分の支給が行われる場合は、その事由が生じたときにおいて、当該年金給付に係る前項の申請があつたものとみなす。\n４　第二項の申請（前項の規定により第二項の申請があつたものとみなされた場合における当該申請を含む。）は、いつでも、将来に向かつて撤回することができる。", "ch": 2}, {"key": "h20-2", "num": [20, 2], "label": "第20条の2", "caption": "受給権者の申出による支給停止", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "（受給権者の申出による支給停止）\n第20条の2　年金給付（この法律の他の規定又は他の法令の規定によりその全額につき支給を停止されている年金給付を除く。）は、その受給権者の申出により、その全額の支給を停止する。ただし、この法律の他の規定又は他の法令の規定によりその額の一部につき支給を停止されているときは、停止されていない部分の額の支給を停止する。\n2　前項ただし書のその額の一部につき支給を停止されている年金給付について、この法律の他の規定又は他の法令の規定による支給停止が解除されたときは、前項本文の年金給付の全額の支給を停止する。\n3　第1項の申出は、いつでも、将来に向かつて撤回することができる。\n4　第1項又は第2項の規定により支給を停止されている年金給付は、政令で定める法令の規定の適用については、その支給を停止されていないものとみなす。\n5　第1項の規定による支給停止の方法その他前各項の規定の適用に関し必要な事項は、政令で定める。", "bg": "【2004年改正・平成16年法律第104号で追加／2007年4月施行】年金を受け取る権利があっても、本人が受け取りを望まない場合がある。その意思を制度上反映できるよう、受給権者自身が年金を受け取らない旨を表明する制度を整備した。単に裁定請求を控えても、後に請求した際には時効消滅していない過去分が支給され、受給辞退の意思を徹底できなかった。本人の申出による支給停止を設け、撤回は将来に向かって認める。根拠：日本年金機構「受給権者の申出による支給停止の規定が設けられたのはどうしてですか」。", "deb": "—（本条固有の国会における質問者・政府答弁の原文は今回未確認。上記は日本年金機構の制度趣旨説明であり国会発言ではない。）", "tsu": "【平成19年3月29日・庁保険発第0329009号】2004年改正法の2007年4月施行分の実施事務通知。旧法給付（老齢福祉年金等）への申出停止の準用にも言及。現行の老齢基礎年金等の個別手続は日本年金機構の2025年12月16日更新案内で別途確認。※通知が現行手続すべてを規定するものではない。", "kako": "—", "rows": [13], "heads": ["第3章　給付", "第1節　通則"], "orig": "（受給権者の申出による支給停止）\n第二十条の二　年金給付（この法律の他の規定又は他の法令の規定によりその全額につき支給を停止されている年金給付を除く。）は、その受給権者の申出により、その全額の支給を停止する。ただし、この法律の他の規定又は他の法令の規定によりその額の一部につき支給を停止されているときは、停止されていない部分の額の支給を停止する。\n２　前項ただし書のその額の一部につき支給を停止されている年金給付について、この法律の他の規定又は他の法令の規定による支給停止が解除されたときは、前項本文の年金給付の全額の支給を停止する。\n３　第一項の申出は、いつでも、将来に向かつて撤回することができる。\n４　第一項又は第二項の規定により支給を停止されている年金給付は、政令で定める法令の規定の適用については、その支給を停止されていないものとみなす。\n５　第一項の規定による支給停止の方法その他前各項の規定の適用に関し必要な事項は、政令で定める。", "ch": 2}, {"key": "h21", "num": [21], "label": "第21条", "caption": "年金の支払の調整", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "（年金の支払の調整）\n第21条　乙年金の受給権者が甲年金の受給権を取得したため乙年金の受給権が消滅し、又は同一人に対して乙年金の支給を停止して甲年金を支給すべき場合において、乙年金の受給権が消滅し、又は乙年金の支給を停止すべき事由が生じた日の属する月の翌月以降の分として、乙年金の支払が行われたときは、その支払われた乙年金は、甲年金の内払とみなす。\n2　年金の支給を停止すべき事由が生じたにもかかわらず、その停止すべき期間の分として年金が支払われたときは、その支払われた年金は、その後に支払うべき年金の内払とみなすことができる。障害基礎年金又は遺族基礎年金を減額して改定すべき事由が生じたにもかかわらず、その事由が生じた日の属する月の翌月以降の分として減額しない額の障害基礎年金又は遺族基礎年金が支払われた場合における当該障害基礎年金又は遺族基礎年金の当該減額すべきであつた部分についても、同様とする。\n3　同一人に対して厚生年金保険法による年金たる保険給付（厚生労働大臣が支給するものに限る。以下この項において同じ。）の支給を停止して年金給付を支給すべき場合において、年金給付を支給すべき事由が生じた日の属する月の翌月以降の分として同法による年金たる保険給付の支払が行われたときは、その支払われた同法による年金たる保険給付は、年金給付の内払とみなすことができる。", "bg": "【給付の支払調整】支給対象が乙年金から甲年金に移った後の支払等を、法定の範囲で内払として扱う規定。第1項の『内払とみなす』と、第2・3項の『内払とみなすことができる』を区別する。\n【改正履歴】厚労省掲載の法令注記では1961年・1985年・2012年の一部改正を確認。各改正年の条文固有の提案理由までは今回確認していないため、推測による立法理由は記載しない。", "deb": "—（本条固有の国会質疑・政府答弁の一次資料は今回未確認）", "tsu": "—（第21条の内払規定を直接説明する通達について、発出日・発出番号と現行効力の一括確認は未了。法文の『みなす／みなすことができる』で判定する。）", "kako": "令和2年、令和3年", "rows": [14], "heads": ["第3章　給付", "第1節　通則"], "orig": "（年金の支払の調整）\n第二十一条　乙年金の受給権者が甲年金の受給権を取得したため乙年金の受給権が消滅し、又は同一人に対して乙年金の支給を停止して甲年金を支給すべき場合において、乙年金の受給権が消滅し、又は乙年金の支給を停止すべき事由が生じた日の属する月の翌月以降の分として、乙年金の支払が行われたときは、その支払われた乙年金は、甲年金の内払とみなす。\n２　年金の支給を停止すべき事由が生じたにもかかわらず、その停止すべき期間の分として年金が支払われたときは、その支払われた年金は、その後に支払うべき年金の内払とみなすことができる。障害基礎年金又は遺族基礎年金を減額して改定すべき事由が生じたにもかかわらず、\nその事由が生じた日の属する月の翌月以降の分として減額しない額の障害基礎年金又は遺族基礎年金が支払われた場合における当該障害基礎年金又は遺族基礎年金の当該減額すべきであつた部分についても、同様とする。\n３　同一人に対して厚生年金保険法による年金たる保険給付（厚生労働大臣が支給するものに限る。以下この項において同じ。）の支給を停止して年金給付を支給すべき場合において、年金給付を支給すべき事由が生じた日の属する月の翌月以降の分として同法による年金たる保険給付の支払が行われたときは、その支払われた同法による年金たる保険給付は、\n年金給付の内払とみなすことができる。", "ch": 2}, {"key": "h21-2", "num": [21, 2], "label": "第21条の2", "caption": "", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "〔学習用見出し：死亡後の年金過誤払と返還金の調整〕\n第21条の2　年金給付の受給権者が死亡したためその受給権が消滅したにもかかわらず、その死亡の日の属する月の翌月以降の分として当該年金給付の過誤払が行われた場合において、当該過誤払による返還金に係る債権（以下この条において「返還金債権」という。）に係る債務の弁済をすべき者に支払うべき年金給付があるときは、厚生労働省令で定めるところにより、当該年金給付の支払金の金額を当該過誤払による返還金債権の金額に充当することができる。", "bg": "【1985年改正・昭和60年法律第34号で追加／1986年4月施行】死亡により消滅した年金受給権について、その翌月以後の過誤払が生じ、返還義務者に別の年金給付を支払うべき場合に、一定の充当を認めた。法第21条の一般的な『内払』とは別の、死亡後過誤払に係る返還金債権への『充当』を規定する。\n【1999年改正】厚労省法令注記に一部改正の記録あり。内容別の改正理由は今回未確認。", "deb": "—（本条の追加について国会議員と政府の具体的な逐条質疑は今回未確認）", "tsu": "【昭和61年3月31日・庁保発第12号】国民年金法等改正の施行に伴う通知。第21条の2による年金支払金の過誤払返還金債権への充当が可能な場合を、国民年金法施行規則第86条の2で定めたことを明示。※1986年施行時の説明。規則の改正後本文・運用の全追跡は未了。", "kako": "平成29年、令和5年", "rows": [15], "heads": ["第3章　給付", "第1節　通則"], "orig": "第二十一条の二　年金給付の受給権者が死亡したためその受給権が消滅したにもかかわらず、その死亡の日の属する月の翌月以降の分として当該年金給付の過誤払が行われた場合において、当該過誤払による返還金に係る債権（以下この条において「返還金債権」という。）に係る債務の弁済をすべき者に支払うべき年金給付があるときは、厚生労働省令で定めるところにより、\n当該年金給付の支払金の金額を当該過誤払による返還金債権の金額に充当することができる。", "ch": 2}, {"key": "h22", "num": [22], "label": "第22条", "caption": "損害賠償請求権", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "（損害賠償請求権）\n第22条　政府は、障害若しくは死亡又はこれらの直接の原因となつた事故が第3者の行為によつて生じた場合において、給付をしたときは、その給付の価額の限度で、受給権者が第3者に対して有する損害賠償の請求権を取得する。\n2　前項の場合において、受給権者が第3者から同一の事由について損害賠償を受けたときは、政府は、その価額の限度で、給付を行う責を免かれる。", "bg": "【制度趣旨・条文から確認できる範囲】第三者により障害・死亡が生じたとき、年金給付と損害賠償をどう調整するか。交通事故等の第三者行為が障害・死亡の原因となった際に、政府による給付と加害者への損害賠償請求との関係を調整する。第1項は政府の請求権取得（給付価額が限度）、第2項は既に受けた損害賠償の価額を限度とする給付調整を規定。\n【改正履歴】厚労省の法令注記では1961年と1982年の一部改正を確認。個別改正理由は未確認。", "deb": "—（第22条に特定した国会質疑・政府答弁の原本は今回未確認）", "tsu": "—（本条固有の通達番号・現行効力は未確認）。【現行公式案内・通達ではない】日本年金機構「障害基礎年金を受けられるとき」には第三者行為事故状況届・示談書等の添付資料案内がある。", "kako": "平成30年", "rows": [16], "heads": ["第3章　給付", "第1節　通則"], "orig": "（損害賠償請求権）\n第二十二条　政府は、障害若しくは死亡又はこれらの直接の原因となつた事故が第三者の行為によつて生じた場合において、給付をしたときは、その給付の価額の限度で、受給権者が第三者に対して有する損害賠償の請求権を取得する。\n２　前項の場合において、受給権者が第三者から同一の事由について損害賠償を受けたときは、政府は、その価額の限度で、給付を行う責を免かれる。", "ch": 2}, {"key": "h23", "num": [23], "label": "第23条", "caption": "不正利得の徴収", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "（不正利得の徴収）\n第23条　偽りその他不正の手段により給付を受けた者があるときは、厚生労働大臣は、受給額に相当する金額の全部又は一部をその者から徴収することができる。", "bg": "【制度趣旨・条文から確認できる範囲】偽りその他不正の手段による給付について、厚生労働大臣が受給額相当額の全部又は一部を徴収できる規定。通常の死亡後過誤払の充当（第21条の2）と混同しない。\n【改正履歴】厚労省の法令注記で1961年・1962年・2007年の一部改正を確認。各改正の固有の立法目的は未調査。", "deb": "—（本条固有の実際の国会質疑・政府答弁は今回未確認）", "tsu": "—（第23条固有の現行解釈通達の番号と改廃履歴を確認できず）", "kako": "—", "rows": [17], "heads": ["第3章　給付", "第1節　通則"], "orig": "（不正利得の徴収）\n第二十三条　偽りその他不正の手段により給付を受けた者があるときは、厚生労働大臣は、受給額に相当する金額の全部又は一部をその者から徴収することができる。", "ch": 2}, {"key": "h24", "num": [24], "label": "第24条", "caption": "受給権の保護", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "（受給権の保護）\n第24条　給付を受ける権利は、譲り渡し、担保に供し、又は差し押えることができない。ただし、老齢基礎年金又は付加年金を受ける権利を国税滞納処分（その例による処分を含む。）により差し押える場合は、この限りでない。", "bg": "【制定時からの基本原則】給付を受ける権利の譲渡・担保提供・差押えを原則禁止し、年金を生活保障に用いることを保護。\n【1973・1974年改正の歴史】一時的資金需要等から、例外的な公的年金担保貸付が設けられた経緯がある。\n【2020年改正・令和2年法律第40号／2022年4月施行】年金担保貸付制度の新規申込を2022年3月末で終了。生活費となる年金が返済に充てられ困窮を招く問題への対応。現行第24条に従来の年金担保貸付の一般的な例外はない。ただし、改正法附則には既存借入等の経過措置があるため、『過去の貸付がすべて直ちに無効になった』とは扱わない。", "deb": "—（第24条改正をめぐる国会の質問者・政府答弁の逐語一次資料は今回未確認。厚生労働省の改正趣旨説明・年金担保貸付廃止計画の記述を背景欄に記載。）", "tsu": "【令和2年6月5日・保発0605第1号／年発0605第4号】2020年の年金制度改正法の公布通知。年金担保貸付事業廃止を含む改正内容を周知。\n【令和4年3月29日・年発0329第1号ほか】年金担保貸付事業等の廃止に伴う省令の整備を通知。※制度廃止と、改正前の貸付に係る附則の経過措置を区別する。", "kako": "令和5年", "rows": [18], "heads": ["第3章　給付", "第1節　通則"], "orig": "（受給権の保護）\n第二十四条　給付を受ける権利は、譲り渡し、担保に供し、又は差し押えることができない。ただし、老齢基礎年金又は付加年金を受ける権利を国税滞納処分（その例による処分を含む。）により差し押える場合は、この限りでない。", "ch": 2}, {"key": "h25", "num": [25], "label": "第25条", "caption": "公課の禁止", "status": null, "sheet": "第18～25条_給付通則", "scope": "honsoku", "text": "（公課の禁止）\n第25条　租税その他の公課は、給付として支給を受けた金銭を標準として、課することができない。ただし、老齢基礎年金及び付加年金については、この限りでない。", "bg": "【制度趣旨・条文から確認できる範囲】国民年金の給付を原則として公課の課税標準にできないことを定めるが、老齢基礎年金・付加年金は例外。障害基礎年金・遺族基礎年金・寡婦年金・死亡一時金の非課税関係と、老齢・付加年金が公的年金等に係る所得課税対象となる点を区別。\n【改正履歴】厚労省の法令注記では1961年（2法）・1962年・1985年に一部改正。現行の『基礎年金』名称を1959年当初に遡らせない。", "deb": "—（本条固有の国会質疑・政府答弁は今回未確認）", "tsu": "—（本条固有の現行解釈通達は今回未確認）。【公的資料・通達ではない】国税庁税務大学校論叢第99号に国民年金法第25条の非課税対象の整理がある。", "kako": "令和3年、令和7年", "rows": [19], "heads": ["第3章　給付", "第1節　通則"], "orig": "（公課の禁止）\n第二十五条　租税その他の公課は、給付として支給を受けた金銭を標準として、課することができない。ただし、老齢基礎年金及び付加年金については、この限りでない。", "ch": 2}, {"key": "h26", "num": [26], "label": "第26条", "caption": "支給要件", "status": null, "sheet": "第26～29条_老齢基礎", "scope": "honsoku", "text": "（支給要件）\n第26条　老齢基礎年金は、保険料納付済期間又は保険料免除期間（第90条の3第1項の規定により納付することを要しないものとされた保険料に係るものを除く。）を有する者が65歳に達したときに、その者に支給する。ただし、その者の保険料納付済期間と保険料免除期間とを合算した期間が10年に満たないときは、この限りでない。", "bg": "【1985年改正】昭和60年法律第34号により老後の保障を全国共通の基礎年金へと組み直すため、旧法の老齢年金・通算老齢年金を老齢基礎年金へ再構成した。制定時と現在の給付体系を区別する。1985年改正当初は資格期間原則25年。\n【2017年8月1日施行】受給資格期間を原則25年から10年へ短縮。ただし合算対象期間等は本条本文だけで読み切れないため、別途附則等の適用が必要。", "deb": "—（本条改正に直接対応した質問者と政府答弁の一連の発言について、今回は国会会議録の原文未照合。1985年改正の公布条文と2017年日本年金機構解説を質疑として扱わない。）", "tsu": "—（本条固有の改廃を含めて有効性が確認できた通達番号は未収録。）【参考・通達ではない】日本年金機構「必要な資格期間が25年から10年に短縮されました」（2017年）。", "kako": "平成30年、令和元年、令和2年、令和5年", "rows": [7], "heads": ["第3章　給付", "第2節　老齢基礎年金"], "orig": "（支給要件）\n第二十六条　老齢基礎年金は、保険料納付済期間又は保険料免除期間（第九十条の三第一項の規定により納付することを要しないものとされた保険料に係るものを除く。）を有する者が六十五歳に達したときに、その者に支給する。ただし、その者の保険料納付済期間と保険料免除期間とを合算した期間が十年に満たないときは、この限りでない。", "ch": 2}, {"key": "h27", "num": [27], "label": "第27条", "caption": "年金額", "status": null, "sheet": "第26～29条_老齢基礎", "scope": "honsoku", "text": "（年金額）\n第27条　老齢基礎年金の額は、780900円に改定率（次条第1項の規定により設定し、同条（第1項を除く。）から第27条の5までの規定により改定した率をいう。以下同じ。）を乗じて得た額（その額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）とする。\nただし、保険料納付済期間の月数が480に満たない者に支給する場合は、当該額に、次の各号に掲げる月数を合算した月数（480を限度とする。）を480で除して得た数を乗じて得た額とする。\n1　保険料納付済期間の月数\n2　保険料4分の1免除期間の月数（480から保険料納付済期間の月数を控除して得た月数を限度とする。）の8分の7に相当する月数\n3　保険料4分の1免除期間の月数から前号に規定する保険料4分の1免除期間の月数を控除して得た月数の8分の3に相当する月数\n4　保険料半額免除期間の月数（480から保険料納付済期間の月数及び保険料4分の1免除期間の月数を合算した月数を控除して得た月数を限度とする。）の4分の3に相当する月数\n5　保険料半額免除期間の月数から前号に規定する保険料半額免除期間の月数を控除して得た月数の4分の1に相当する月数\n6　保険料4分の3免除期間の月数（480から保険料納付済期間の月数、保険料4分の1免除期間の月数及び保険料半額免除期間の月数を合算した月数を控除して得た月数を限度とする。）の8分の5に相当する月数\n7　保険料4分の3免除期間の月数から前号に規定する保険料4分の3免除期間の月数を控除して得た月数の8分の1に相当する月数\n8　保険料全額免除期間（第90条の3第1項の規定により納付することを要しないものとされた保険料に係るものを除く。）の月数（480から保険料納付済期間の月数、保険料4分の1免除期間の月数、保険料半額免除期間の月数及び保険料4分の3免除期間の月数を合算した月数を控除して得た月数を限度とする。）の2分の1に相当する月数", "bg": "【1985年改正】老後の保障を全国民共通の基礎年金へと組み直し、加入期間に応じた年金額の計算方法を整備した。当初の満額は年60万円、免除期間の反映係数等も現在とは異なる。\n【2004年改正等】改定率・免除区分等を踏まえる計算規定へ移行。78万900円は法文上の基礎額であり、2026年度に実際に支給される満額そのものではない。\n【注意】旧法期間の計算・2009年以前の免除期間等は別途附則による経過措置に注意。", "deb": "【2012年11月14日・衆議院厚労委】永岡桂子委員は、特例水準を早期に解消する理由と受給者の生活への影響について質問。三井辨雄厚生労働大臣は、特例水準が将来世代の給付と年金財政に与える影響を説明し、丁寧な周知にも言及。※これは年金額の特例水準をめぐる関連審議であり、第27条の各号・端数処理固有の質疑ではない。", "tsu": "—（第27条の免除期間各号固有の解釈通達の現行改廃履歴は未確認。）【参考・通達ではない】日本年金機構の2026年度年金額計算案内で実際の満額等を確認。", "kako": "平成29年、平成30年、令和3年、令和4年、令和5年、令和7年", "rows": [8], "heads": ["第3章　給付", "第2節　老齢基礎年金"], "orig": "（年金額）\n第二十七条　老齢基礎年金の額は、七十八万九百円に改定率（次条第一項の規定により設定し、同条（第一項を除く。）から第二十七条の五までの規定により改定した率をいう。以下同じ。）を乗じて得た額（その額に五十円未満の端数が生じたときは、これを切り捨て、五十円以上百円未満の端数が生じたときは、これを百円に切り上げるものとする。）とする。\nただし、保険料納付済期間の月数が四百八十に満たない者に支給する場合は、当該額に、次の各号に掲げる月数を合算した月数（四百八十を限度とする。）を四百八十で除して得た数を乗じて得た額とする。\n一　保険料納付済期間の月数\n二　保険料四分の一免除期間の月数（四百八十から保険料納付済期間の月数を控除して得た月数を限度とする。）の八分の七に相当する月数\n三　保険料四分の一免除期間の月数から前号に規定する保険料四分の一免除期間の月数を控除して得た月数の八分の三に相当する月数\n四　保険料半額免除期間の月数（四百八十から保険料納付済期間の月数及び保険料四分の一免除期間の月数を合算した月数を控除して得た月数を限度とする。）の四分の三に相当する月数\n五　保険料半額免除期間の月数から前号に規定する保険料半額免除期間の月数を控除して得た月数の四分の一に相当する月数\n六　保険料四分の三免除期間の月数（四百八十から保険料納付済期間の月数、保険料四分の一免除期間の月数及び保険料半額免除期間の月数を合算した月数を控除して得た月数を限度とする。）の八分の五に相当する月数\n七　保険料四分の三免除期間の月数から前号に規定する保険料四分の三免除期間の月数を控除して得た月数の八分の一に相当する月数\n八　保険料全額免除期間（第九十条の三第一項の規定により納付することを要しないものとされた保険料に係るものを除く。）の月数（四百八十から保険料納付済期間の月数、保険料四分の一免除期間の月数、保険料半額免除期間の月数及び保険料四分の三免除期間の月数を合算した月数を控除して得た月数を限度とする。）の二分の一に相当する月数", "ch": 2}, {"key": "h27-2", "num": [27, 2], "label": "第27条の2", "caption": "改定率の改定等", "status": null, "sheet": "第26～29条_老齢基礎", "scope": "honsoku", "text": "（改定率の改定等）\n第27条の2　平成16年度における改定率は、1とする。\n2　改定率については、毎年度、第1号に掲げる率（以下「物価変動率」という。）に第2号及び第3号に掲げる率を乗じて得た率（以下「名目手取り賃金変動率」という。）を基準として改定し、当該年度の4月以降の年金たる給付について適用する。\n1　当該年度の初日の属する年の前々年の物価指数（総務省において作成する年平均の全国消費者物価指数をいう。以下同じ。）に対する当該年度の初日の属する年の前年の物価指数の比率\n2　イに掲げる率をロに掲げる率で除して得た率の3乗根となる率\nイ　当該年度の初日の属する年の5年前の年の4月1日の属する年度における厚生年金保険の被保険者に係る標準報酬平均額（厚生年金保険法第43条の2第1項第2号イに規定する標準報酬平均額をいう。以下この号及び第87条第5項第2号イにおいて同じ。）に対する当該年度の前々年度における厚生年金保険の被保険者に係る標準報酬平均額の比率\nロ　当該年度の初日の属する年の5年前の年における物価指数に対する当該年度の初日の属する年の前々年における物価指数の比率\n3　イに掲げる率をロに掲げる率で除して得た率\nイ　0.910から当該年度の初日の属する年の3年前の年の9月1日における厚生年金保険法の規定による保険料率（以下「保険料率」という。）の2分の1に相当する率を控除して得た率\nロ　0.910から当該年度の初日の属する年の4年前の年の9月1日における保険料率の2分の1に相当する率を控除して得た率\n3　前項の規定による改定率の改定の措置は、政令で定める。", "bg": "【2004年・平成16年法律第104号で新設】保険料水準固定方式の下で、賃金・物価の変動を年金額に反映するため、改定率と計算要素を法定。\n【2016年・平成28年法律第114号】賃金が物価より低下する場合の改定ルールを見直し。条文の技術的計算要素は、法令と政令を合わせて確認する。", "deb": "【2016年11月1日・衆議院本会議】安倍晋三首相は、伊佐進一議員の質問に対し、2004年の保険料上限固定とマクロ経済スライド導入によって将来負担・給付水準の均衡を図ったと答弁。※第27条の2の算定式そのものへの逐条答弁ではなく、制度改正全体の説明。", "tsu": "—（第27条の2の現行改定率算定について、発出番号・後続改廃を全件追跡した固有通達は未収録。）【参考・通達ではない】厚労省・平成28年改正の年金額改定ルール解説。", "kako": "—", "rows": [9], "heads": ["第3章　給付", "第2節　老齢基礎年金"], "orig": "（改定率の改定等）\n第二十七条の二　平成十六年度における改定率は、一とする。\n２　改定率については、毎年度、第一号に掲げる率（以下「物価変動率」という。）に第二号及び第三号に掲げる率を乗じて得た率（以下「名目手取り賃金変動率」という。）を基準として改定し、当該年度の四月以降の年金たる給付について適用する。\n一　当該年度の初日の属する年の前々年の物価指数（総務省において作成する年平均の全国消費者物価指数をいう。以下同じ。）に対する当該年度の初日の属する年の前年の物価指数の比率\n二　イに掲げる率をロに掲げる率で除して得た率の三乗根となる率\nイ　当該年度の初日の属する年の五年前の年の四月一日の属する年度における厚生年金保険の被保険者に係る標準報酬平均額（厚生年金保険法第四十三条の二第一項第二号イに規定する標準報酬平均額をいう。以下この号及び第八十七条第五項第二号イにおいて同じ。）に対する当該年度の前々年度における厚生年金保険の被保険者に係る標準報酬平均額の比率\nロ　当該年度の初日の属する年の五年前の年における物価指数に対する当該年度の初日の属する年の前々年における物価指数の比率\n三　イに掲げる率をロに掲げる率で除して得た率\nイ　〇・九一〇から当該年度の初日の属する年の三年前の年の九月一日における厚生年金保険法の規定による保険料率（以下「保険料率」という。）の二分の一に相当する率を控除して得た率\nロ　〇・九一〇から当該年度の初日の属する年の四年前の年の九月一日における保険料率の二分の一に相当する率を控除して得た率\n３　前項の規定による改定率の改定の措置は、政令で定める。", "ch": 2}, {"key": "h27-3", "num": [27, 3], "label": "第27条の3", "caption": "", "status": null, "sheet": "第26～29条_老齢基礎", "scope": "honsoku", "text": "〔学習用見出し：基準年度以後の改定率〕\n第27条の3　受給権者が65歳に達した日の属する年度の初日の属する年の3年後の年の4月1日の属する年度（第27条の5第1項第2号及び第3項第1号において「基準年度」という。）以後において適用される改定率（以下「基準年度以後改定率」という。）の改定については、前条の規定にかかわらず、物価変動率（物価変動率が名目手取り賃金変動率を上回るときは、名目手取り賃金変動率）を基準とする。\n2　前項の規定による基準年度以後改定率の改定の措置は、政令で定める。", "bg": "【2004年改正で新設】新規裁定者と既裁定者の改定指標を分け、高齢期の年金額の改定に物価動向等を反映させる。\n【2016年改正】基準年度以後について、物価上昇より賃金変動が弱い場合に賃金指標を用いる改定ルールを整備。", "deb": "—（第27条の3単独の逐条質疑と答弁の一連の原文は今回未確認。制度全体の国会説明と混同しない。）", "tsu": "—（本条固有の現行解釈通達の番号・後続改廃は今回未確認。）", "kako": "令和2年", "rows": [10], "heads": ["第3章　給付", "第2節　老齢基礎年金"], "orig": "第二十七条の三　受給権者が六十五歳に達した日の属する年度の初日の属する年の三年後の年の四月一日の属する年度（第二十七条の五第一項第二号及び第三項第一号において「基準年度」という。）以後において適用される改定率（以下「基準年度以後改定率」という。）の改定については、前条の規定にかかわらず、物価変動率（物価変動率が名目手取り賃金変動率を上回るときは、\n名目手取り賃金変動率）を基準とする。\n２　前項の規定による基準
