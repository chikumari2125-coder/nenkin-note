000074.xml"], ["第十四条の四", "（訂正請求に対する措置）", "2026-10-01", "（訂正請求に対する措置）\n第十四条の四　厚生労働大臣は、訂正請求に理由があると認めるときは、当該訂正請求に係る国民年金原簿の訂正をする旨を決定しなければならない。\n２　厚生労働大臣は、前項の規定による決定をする場合を除き、訂正請求に係る国民年金原簿の訂正をしない旨を決定しなければならない。\n３　厚生労働大臣は、前二項の規定による決定をしようとするときは、あらかじめ、社会保障審議会に諮問しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十四条の五", "（被保険者に対する情報の提供）", "2026-10-01", "（被保険者に対する情報の提供）\n第十四条の五　厚生労働大臣は、国民年金制度に対する国民の理解を増進させ、及びその信頼を向上させるため、厚生労働省令で定めるところにより、被保険者に対し、当該被保険者の保険料納付の実績及び将来の給付に関する必要な情報を分かりやすい形で通知するものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十五条", "（給付の種類）", "2026-10-01", "（給付の種類）\n第十五条　この法律による給付（以下単に「給付」という。）は、次のとおりとする。\n一　老齢基礎年金\n二　障害基礎年金\n三　遺族基礎年金\n四　付加年金、寡婦年金及び死亡一時金", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十六条", "（裁定）", "2026-10-01", "（裁定）\n第十六条　給付を受ける権利は、その権利を有する者（以下「受給権者」という。）の請求に基いて、厚生労働大臣が裁定する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十六条の二", "（調整期間）", "2026-10-01", "（調整期間）\n第十六条の二　政府は、第四条の三第一項の規定により財政の現況及び見通しを作成するに当たり、国民年金事業の財政が、財政均衡期間の終了時に給付の支給に支障が生じないようにするために必要な積立金（年金特別会計の国民年金勘定の積立金をいう。第五章において同じ。）を保有しつつ当該財政均衡期間にわたつてその均衡を保つことができないと見込まれる場合には、\n年金たる給付（付加年金を除く。）の額（以下この項において「給付額」という。）を調整するものとし、政令で、給付額を調整する期間（以下「調整期間」という。）の開始年度を定めるものとする。\n２　財政の現況及び見通しにおいて、前項の調整を行う必要がなくなつたと認められるときは、政令で、調整期間の終了年度を定めるものとする。\n３　政府は、調整期間において財政の現況及び見通しを作成するときは、調整期間の終了年度の見通しについても作成し、併せて、これを公表しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十七条", "（端数処理）", "2026-10-01", "（端数処理）\n第十七条　年金たる給付（以下「年金給付」という。）を受ける権利を裁定する場合又は年金給付の額を改定する場合において、年金給付の額に五十銭未満の端数が生じたときは、これを切り捨て、五十銭以上一円未満の端数が生じたときは、これを一円に切り上げるものとする。\n２　前項に規定するもののほか、年金給付の額を計算する場合において生じる一円未満の端数の処理については、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十八条", "（年金の支給期間及び支払期月）", "2026-10-01", "（年金の支給期間及び支払期月）\n第十八条　年金給付の支給は、これを支給すべき事由が生じた日の属する月の翌月から始め、権利が消滅した日の属する月で終るものとする。\n２　年金給付は、その支給を停止すべき事由が生じたときは、その事由が生じた日の属する月の翌月からその事由が消滅した日の属する月までの分の支給を停止する。ただし、これらの日が同じ月に属する場合は、支給を停止しない。\n３　年金給付は、毎年二月、四月、六月、八月、十月及び十二月の六期に、それぞれの前月までの分を支払う。ただし、前支払期月に支払うべきであつた年金又は権利が消滅した場合若しくは年金の支給を停止した場合におけるその期の年金は、その支払期月でない月であつても、支払うものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十八条の二", "（二月期支払の年金の加算）", "2026-10-01", "（二月期支払の年金の加算）\n第十八条の二　前条第三項の規定による支払額に一円未満の端数が生じたときは、これを切り捨てるものとする。\n２　毎年三月から翌年二月までの間において前項の規定により切り捨てた金額の合計額（一円未満の端数が生じたときは、これを切り捨てた額）については、これを当該二月の支払期月の年金額に加算するものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十八条の三", "（死亡の推定）", "2026-10-01", "（死亡の推定）\n第十八条の三　船舶が沈没し、転覆し、滅失し、若しくは行方不明となつた際現にその船舶に乗つていた者若しくは船舶に乗つていてその船舶の航行中に行方不明となつた者の生死が三箇月間分らない場合又はこれらの者の死亡が三箇月以内に明らかとなり、かつ、その死亡の時期が分らない場合には、死亡を支給事由とする給付の支給に関する規定の適用については、その船舶が沈没し、\n転覆し、滅失し、若しくは行方不明となつた日又はその者が行方不明となつた日に、その者は、死亡したものと推定する。航空機が墜落し、滅失し、若しくは行方不明となつた際現にその航空機に乗つていた者若しくは航空機に乗つていてその航空機の航行中に行方不明となつた者の生死が三箇月間分らない場合又はこれらの者の死亡が三箇月以内に明らかとなり、かつ、\nその死亡の時期が分らない場合にも、同様とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十八条の四", "（失踪宣告の場合の取扱い）", "2026-10-01", "（失踪宣告の場合の取扱い）\n第十八条の四　失踪の宣告を受けたことにより死亡したとみなされた者に係る死亡を支給事由とする給付の支給に関する規定の適用については、第三十七条、第三十七条の二、第四十九条第一項、第五十二条の二第一項及び第五十二条の三第一項中「死亡日」とあるのは「行方不明となつた日」とし、「死亡の当時」とあるのは「行方不明となつた当時」とする。\nただし、受給権者又は給付の支給の要件となり、若しくはその額の加算の対象となる者の身分関係、年齢及び障害の状態に係るこれらの規定の適用については、この限りでない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第十九条", "（未支給年金）", "2026-10-01", "（未支給年金）\n第十九条　年金給付の受給権者が死亡した場合において、その死亡した者に支給すべき年金給付でまだその者に支給しなかつたものがあるときは、その者の配偶者、子、父母、孫、祖父母、兄弟姉妹又はこれらの者以外の三親等内の親族であつて、その者の死亡の当時その者と生計を同じくしていたものは、自己の名で、その未支給の年金の支給を請求することができる。\n２　前項の場合において、死亡した者が遺族基礎年金の受給権者であつたときは、その者の死亡の当時当該遺族基礎年金の支給の要件となり、又はその額の加算の対象となつていた被保険者又は被保険者であつた者の子は、同項に規定する子とみなす。\n３　第一項の場合において、死亡した受給権者が死亡前にその年金を請求していなかつたときは、同項に規定する者は、自己の名で、その年金を請求することができる。\n４　未支給の年金を受けるべき者の順位は、政令で定める。\n５　未支給の年金を受けるべき同順位者が二人以上あるときは、その一人のした請求は、全員のためその全額につきしたものとみなし、その一人に対してした支給は、全員に対してしたものとみなす。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十条", "（併給の調整）", "2026-10-01", "（併給の調整）\n第二十条　遺族基礎年金又は寡婦年金は、その受給権者が他の年金給付（付加年金を除く。）又は厚生年金保険法による年金たる保険給付（当該年金給付と同一の支給事由に基づいて支給されるものを除く。以下この条において同じ。）を受けることができるときは、その間、その支給を停止する。老齢基礎年金の受給権者が他の年金給付（付加年金を除く。\n）又は同法による年金たる保険給付（遺族厚生年金を除く。）を受けることができる場合における当該老齢基礎年金及び障害基礎年金の受給権者が他の年金給付（付加年金を除く。）を受けることができる場合における当該障害基礎年金についても、同様とする。\n２　前項の規定によりその支給を停止するものとされた年金給付の受給権者は、同項の規定にかかわらず、その支給の停止の解除を申請することができる。ただし、その者に係る同項に規定する他の年金給付又は厚生年金保険法による年金たる保険給付について、この項の本文若しくは次項又は他の法令の規定でこれらに相当するものとして政令で定めるものによりその支給の停止が\n解除されているときは、この限りでない。\n３　第一項の規定によりその支給を停止するものとされた年金給付について、その支給を停止すべき事由が生じた日の属する月分の支給が行われる場合は、その事由が生じたときにおいて、当該年金給付に係る前項の申請があつたものとみなす。\n４　第二項の申請（前項の規定により第二項の申請があつたものとみなされた場合における当該申請を含む。）は、いつでも、将来に向かつて撤回することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十条の二", "（受給権者の申出による支給停止）", "2026-10-01", "（受給権者の申出による支給停止）\n第二十条の二　年金給付（この法律の他の規定又は他の法令の規定によりその全額につき支給を停止されている年金給付を除く。）は、その受給権者の申出により、その全額の支給を停止する。ただし、この法律の他の規定又は他の法令の規定によりその額の一部につき支給を停止されているときは、停止されていない部分の額の支給を停止する。\n２　前項ただし書のその額の一部につき支給を停止されている年金給付について、この法律の他の規定又は他の法令の規定による支給停止が解除されたときは、前項本文の年金給付の全額の支給を停止する。\n３　第一項の申出は、いつでも、将来に向かつて撤回することができる。\n４　第一項又は第二項の規定により支給を停止されている年金給付は、政令で定める法令の規定の適用については、その支給を停止されていないものとみなす。\n５　第一項の規定による支給停止の方法その他前各項の規定の適用に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十一条", "（年金の支払の調整）", "2026-10-01", "（年金の支払の調整）\n第二十一条　乙年金の受給権者が甲年金の受給権を取得したため乙年金の受給権が消滅し、又は同一人に対して乙年金の支給を停止して甲年金を支給すべき場合において、乙年金の受給権が消滅し、又は乙年金の支給を停止すべき事由が生じた日の属する月の翌月以降の分として、乙年金の支払が行われたときは、その支払われた乙年金は、甲年金の内払とみなす。\n２　年金の支給を停止すべき事由が生じたにもかかわらず、その停止すべき期間の分として年金が支払われたときは、その支払われた年金は、その後に支払うべき年金の内払とみなすことができる。障害基礎年金又は遺族基礎年金を減額して改定すべき事由が生じたにもかかわらず、\nその事由が生じた日の属する月の翌月以降の分として減額しない額の障害基礎年金又は遺族基礎年金が支払われた場合における当該障害基礎年金又は遺族基礎年金の当該減額すべきであつた部分についても、同様とする。\n３　同一人に対して厚生年金保険法による年金たる保険給付（厚生労働大臣が支給するものに限る。以下この項において同じ。）の支給を停止して年金給付を支給すべき場合において、年金給付を支給すべき事由が生じた日の属する月の翌月以降の分として同法による年金たる保険給付の支払が行われたときは、その支払われた同法による年金たる保険給付は、\n年金給付の内払とみなすことができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十一条の二", "—", "2026-10-01", "第二十一条の二　年金給付の受給権者が死亡したためその受給権が消滅したにもかかわらず、その死亡の日の属する月の翌月以降の分として当該年金給付の過誤払が行われた場合において、当該過誤払による返還金に係る債権（以下この条において「返還金債権」という。）に係る債務の弁済をすべき者に支払うべき年金給付があるときは、厚生労働省令で定めるところにより、\n当該年金給付の支払金の金額を当該過誤払による返還金債権の金額に充当することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十二条", "（損害賠償請求権）", "2026-10-01", "（損害賠償請求権）\n第二十二条　政府は、障害若しくは死亡又はこれらの直接の原因となつた事故が第三者の行為によつて生じた場合において、給付をしたときは、その給付の価額の限度で、受給権者が第三者に対して有する損害賠償の請求権を取得する。\n２　前項の場合において、受給権者が第三者から同一の事由について損害賠償を受けたときは、政府は、その価額の限度で、給付を行う責を免かれる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十三条", "（不正利得の徴収）", "2026-10-01", "（不正利得の徴収）\n第二十三条　偽りその他不正の手段により給付を受けた者があるときは、厚生労働大臣は、受給額に相当する金額の全部又は一部をその者から徴収することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十四条", "（受給権の保護）", "2026-10-01", "（受給権の保護）\n第二十四条　給付を受ける権利は、譲り渡し、担保に供し、又は差し押えることができない。ただし、老齢基礎年金又は付加年金を受ける権利を国税滞納処分（その例による処分を含む。）により差し押える場合は、この限りでない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十五条", "（公課の禁止）", "2026-10-01", "（公課の禁止）\n第二十五条　租税その他の公課は、給付として支給を受けた金銭を標準として、課することができない。ただし、老齢基礎年金及び付加年金については、この限りでない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十六条", "（支給要件）", "2026-10-01", "（支給要件）\n第二十六条　老齢基礎年金は、保険料納付済期間又は保険料免除期間（第九十条の三第一項の規定により納付することを要しないものとされた保険料に係るものを除く。）を有する者が六十五歳に達したときに、その者に支給する。ただし、その者の保険料納付済期間と保険料免除期間とを合算した期間が十年に満たないときは、この限りでない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十七条", "（年金額）", "2026-10-01", "（年金額）\n第二十七条　老齢基礎年金の額は、七十八万九百円に改定率（次条第一項の規定により設定し、同条（第一項を除く。）から第二十七条の五までの規定により改定した率をいう。以下同じ。）を乗じて得た額（その額に五十円未満の端数が生じたときは、これを切り捨て、五十円以上百円未満の端数が生じたときは、これを百円に切り上げるものとする。）とする。\nただし、保険料納付済期間の月数が四百八十に満たない者に支給する場合は、当該額に、次の各号に掲げる月数を合算した月数（四百八十を限度とする。）を四百八十で除して得た数を乗じて得た額とする。\n一　保険料納付済期間の月数\n二　保険料四分の一免除期間の月数（四百八十から保険料納付済期間の月数を控除して得た月数を限度とする。）の八分の七に相当する月数\n三　保険料四分の一免除期間の月数から前号に規定する保険料四分の一免除期間の月数を控除して得た月数の八分の三に相当する月数\n四　保険料半額免除期間の月数（四百八十から保険料納付済期間の月数及び保険料四分の一免除期間の月数を合算した月数を控除して得た月数を限度とする。）の四分の三に相当する月数\n五　保険料半額免除期間の月数から前号に規定する保険料半額免除期間の月数を控除して得た月数の四分の一に相当する月数\n六　保険料四分の三免除期間の月数（四百八十から保険料納付済期間の月数、保険料四分の一免除期間の月数及び保険料半額免除期間の月数を合算した月数を控除して得た月数を限度とする。）の八分の五に相当する月数\n七　保険料四分の三免除期間の月数から前号に規定する保険料四分の三免除期間の月数を控除して得た月数の八分の一に相当する月数\n八　保険料全額免除期間（第九十条の三第一項の規定により納付することを要しないものとされた保険料に係るものを除く。）の月数（四百八十から保険料納付済期間の月数、保険料四分の一免除期間の月数、保険料半額免除期間の月数及び保険料四分の三免除期間の月数を合算した月数を控除して得た月数を限度とする。）の二分の一に相当する月数", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十七条の二", "（改定率の改定等）", "2026-10-01", "（改定率の改定等）\n第二十七条の二　平成十六年度における改定率は、一とする。\n２　改定率については、毎年度、第一号に掲げる率（以下「物価変動率」という。）に第二号及び第三号に掲げる率を乗じて得た率（以下「名目手取り賃金変動率」という。）を基準として改定し、当該年度の四月以降の年金たる給付について適用する。\n一　当該年度の初日の属する年の前々年の物価指数（総務省において作成する年平均の全国消費者物価指数をいう。以下同じ。）に対する当該年度の初日の属する年の前年の物価指数の比率\n二　イに掲げる率をロに掲げる率で除して得た率の三乗根となる率\nイ　当該年度の初日の属する年の五年前の年の四月一日の属する年度における厚生年金保険の被保険者に係る標準報酬平均額（厚生年金保険法第四十三条の二第一項第二号イに規定する標準報酬平均額をいう。以下この号及び第八十七条第五項第二号イにおいて同じ。）に対する当該年度の前々年度における厚生年金保険の被保険者に係る標準報酬平均額の比率\nロ　当該年度の初日の属する年の五年前の年における物価指数に対する当該年度の初日の属する年の前々年における物価指数の比率\n三　イに掲げる率をロに掲げる率で除して得た率\nイ　〇・九一〇から当該年度の初日の属する年の三年前の年の九月一日における厚生年金保険法の規定による保険料率（以下「保険料率」という。）の二分の一に相当する率を控除して得た率\nロ　〇・九一〇から当該年度の初日の属する年の四年前の年の九月一日における保険料率の二分の一に相当する率を控除して得た率\n３　前項の規定による改定率の改定の措置は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十七条の三", "—", "2026-10-01", "第二十七条の三　受給権者が六十五歳に達した日の属する年度の初日の属する年の三年後の年の四月一日の属する年度（第二十七条の五第一項第二号及び第三項第一号において「基準年度」という。）以後において適用される改定率（以下「基準年度以後改定率」という。）の改定については、前条の規定にかかわらず、物価変動率（物価変動率が名目手取り賃金変動率を上回るときは、\n名目手取り賃金変動率）を基準とする。\n２　前項の規定による基準年度以後改定率の改定の措置は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十七条の四", "（調整期間における改定率の改定の特例）", "2026-10-01", "（調整期間における改定率の改定の特例）\n第二十七条の四　調整期間における改定率の改定については、前二条の規定にかかわらず、名目手取り賃金変動率に、調整率（第一号に掲げる率に第二号に掲げる率を乗じて得た率（当該率が一を上回るときは、一）をいう。以下同じ。）に当該年度の前年度の特別調整率を乗じて得た率を乗じて得た率（当該率が一を下回るときは、一。第三項第二号において「算出率」という。\n）を基準とする。\n一　当該年度の初日の属する年の五年前の年の四月一日の属する年度における公的年金の被保険者（この法律又は厚生年金保険法の被保険者をいう。）の総数として政令で定めるところにより算定した数（以下「公的年金被保険者総数」という。）に対する当該年度の前々年度における公的年金被保険者総数の比率の三乗根となる率\n二　〇・九九七\n２　名目手取り賃金変動率が一を下回る場合の調整期間における改定率の改定については、前項の規定にかかわらず、名目手取り賃金変動率を基準とする。\n３　第一項の特別調整率とは、第一号の規定により設定し、第二号の規定により改定した率をいう。\n一　平成二十九年度における特別調整率は、一とする。\n二　特別調整率については、毎年度、名目手取り賃金変動率に調整率を乗じて得た率を算出率で除して得た率（名目手取り賃金変動率が一を下回るときは、調整率）を基準として改定する。\n４　前三項の規定による改定率の改定の措置は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十七条の五", "—", "2026-10-01", "第二十七条の五　調整期間における基準年度以後改定率の改定については、前条の規定にかかわらず、第一号に掲げる率に第二号に掲げる率を乗じて得た率（当該率が一を下回るときは、一。第三項第一号ロにおいて「基準年度以後算出率」という。）を基準とする。\n一　物価変動率（物価変動率が名目手取り賃金変動率を上回るときは、名目手取り賃金変動率）\n二　調整率に当該年度の前年度の基準年度以後特別調整率（当該年度が基準年度である場合にあつては、当該年度の前年度の前条第三項に規定する特別調整率）を乗じて得た率\n２　次の各号に掲げる場合の調整期間における基準年度以後改定率の改定については、前項の規定にかかわらず、当該各号に定める率を基準とする。\n一　物価変動率が一を下回るとき（次号に掲げる場合を除く。）物価変動率\n二　物価変動率が名目手取り賃金変動率を上回り、かつ、名目手取り賃金変動率が一を下回るとき名目手取り賃金変動率\n３　第一項の基準年度以後特別調整率とは、第一号の規定により設定し、第二号の規定により改定した率をいう。\n一　基準年度における基準年度以後特別調整率は、イに掲げる率にロに掲げる率を乗じて得た率とする。\nイ　基準年度の前年度の前条第三項に規定する特別調整率\nロ　物価変動率（物価変動率が名目手取り賃金変動率を上回るときは、名目手取り賃金変動率）に調整率を乗じて得た率を基準年度以後算出率で除して得た率（物価変動率又は名目手取り賃金変動率が一を下回るときは、調整率）\n二　基準年度以後特別調整率については、毎年度、前号ロに掲げる率を基準として改定する。\n４　前三項の規定による基準年度以後改定率の改定の措置は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十八条", "（支給の繰下げ）", "2026-10-01", "（支給の繰下げ）\n第二十八条　老齢基礎年金の受給権を有する者であつて六十六歳に達する前に当該老齢基礎年金を請求していなかつたものは、厚生労働大臣に当該老齢基礎年金の支給繰下げの申出をすることができる。ただし、その者が六十五歳に達したときに、他の年金たる給付（他の年金給付（付加年金を除く。）又は厚生年金保険法による年金たる保険給付（老齢を支給事由とするものを除く。\n）をいう。以下この条において同じ。）の受給権者であつたとき、又は六十五歳に達した日から六十六歳に達した日までの間において他の年金たる給付の受給権者となつたときは、この限りでない。\n２　六十六歳に達した日後に次の各号に掲げる者が前項の申出（第五項の規定により前項の申出があつたものとみなされた場合における当該申出を除く。以下この項において同じ。）をしたときは、当該各号に定める日において、前項の申出があつたものとみなす。\n一　七十五歳に達する日前に他の年金たる給付の受給権者となつた者他の年金たる給付を支給すべき事由が生じた日\n二　七十五歳に達した日後にある者（前号に該当する者を除く。）七十五歳に達した日\n３　第一項の申出（第五項の規定により第一項の申出があつたものとみなされた場合における当該申出を含む。次項において同じ。）をした者に対する老齢基礎年金の支給は、第十八条第一項の規定にかかわらず、当該申出のあつた日の属する月の翌月から始めるものとする。\n４　第一項の申出をした者に支給する老齢基礎年金の額は、第二十七条の規定にかかわらず、同条に定める額に政令で定める額を加算した額とする。\n５　第一項の規定により老齢基礎年金の支給繰下げの申出をすることができる者が、七十歳に達した日後に当該老齢基礎年金を請求し、かつ、当該請求の際に同項の申出をしないときは、当該請求をした日の五年前の日に同項の申出があつたものとみなす。ただし、その者が次の各号のいずれかに該当する場合は、この限りでない。\n一　八十歳に達した日以後にあるとき。\n二　六十五歳に達した日から当該請求をした日の五年前の日までの間において他の年金たる給付の受給権者となつたとき。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第二十九条", "（失権）", "2026-10-01", "（失権）\n第二十九条　老齢基礎年金の受給権は、受給権者が死亡したときは、消滅する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十条", "（支給要件）", "2026-10-01", "（支給要件）\n第三十条　障害基礎年金は、疾病にかかり、又は負傷し、かつ、その疾病又は負傷及びこれらに起因する疾病（以下「傷病」という。）について初めて医師又は歯科医師の診療を受けた日（以下「初診日」という。）において次の各号のいずれかに該当した者が、当該初診日から起算して一年六月を経過した日（その期間内にその傷病が治つた場合においては、\nその治つた日（その症状が固定し治療の効果が期待できない状態に至つた日を含む。）とし、以下「障害認定日」という。）において、その傷病により次項に規定する障害等級に該当する程度の障害の状態にあるときに、その者に支給する。ただし、当該傷病に係る初診日の前日において、当該初診日の属する月の前々月までに被保険者期間があり、かつ、\n当該被保険者期間に係る保険料納付済期間と保険料免除期間とを合算した期間が当該被保険者期間の三分の二に満たないときは、この限りでない。\n一　被保険者であること。\n二　被保険者であつた者であつて、日本国内に住所を有し、かつ、六十歳以上六十五歳未満であること。\n２　障害等級は、障害の程度に応じて重度のものから一級及び二級とし、各級の障害の状態は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十条の二", "—", "2026-10-01", "第三十条の二　疾病にかかり、又は負傷し、かつ、当該傷病に係る初診日において前条第一項各号のいずれかに該当した者であつて、障害認定日において同条第二項に規定する障害等級（以下単に「障害等級」という。）に該当する程度の障害の状態になかつたものが、同日後六十五歳に達する日の前日までの間において、\nその傷病により障害等級に該当する程度の障害の状態に該当するに至つたときは、その者は、その期間内に同条第一項の障害基礎年金の支給を請求することができる。\n２　前条第一項ただし書の規定は、前項の場合に準用する。\n３　第一項の請求があつたときは、前条第一項の規定にかかわらず、その請求をした者に同項の障害基礎年金を支給する。\n４　第一項の障害基礎年金と同一の支給事由に基づく厚生年金保険法第四十七条又は第四十七条の二の規定による障害厚生年金について、同法第五十二条の規定によりその額が改定されたときは、そのときに同項の請求があつたものとみなす。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十条の三", "—", "2026-10-01", "第三十条の三　疾病にかかり、又は負傷し、かつ、その傷病（以下この条において「基準傷病」という。）に係る初診日において第三十条第一項各号のいずれかに該当した者であつて、基準傷病以外の傷病により障害の状態にあるものが、基準傷病に係る障害認定日以後六十五歳に達する日の前日までの間において、初めて、基準傷病による障害（以下この条において「基準障害」という。\n）と他の障害とを併合して障害等級に該当する程度の障害の状態に該当するに至つたとき（基準傷病の初診日が、基準傷病以外の傷病（基準傷病以外の傷病が二以上ある場合は、基準傷病以外のすべての傷病）の初診日以降であるときに限る。）は、その者に基準障害と他の障害とを併合した障害の程度による障害基礎年金を支給する。\n２　第三十条第一項ただし書の規定は、前項の場合に準用する。この場合において、同条第一項ただし書中「当該傷病」とあるのは、「基準傷病」と読み替えるものとする。\n３　第一項の障害基礎年金の支給は、第十八条第一項の規定にかかわらず、当該障害基礎年金の請求があつた月の翌月から始めるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十条の四", "—", "2026-10-01", "第三十条の四　疾病にかかり、又は負傷し、その初診日において二十歳未満であつた者が、障害認定日以後に二十歳に達したときは二十歳に達した日において、障害認定日が二十歳に達した日後であるときはその障害認定日において、障害等級に該当する程度の障害の状態にあるときは、その者に障害基礎年金を支給する。\n２　疾病にかかり、又は負傷し、その初診日において二十歳未満であつた者（同日において被保険者でなかつた者に限る。）が、障害認定日以後に二十歳に達したときは二十歳に達した日後において、障害認定日が二十歳に達した日後であるときはその障害認定日後において、その傷病により、六十五歳に達する日の前日までの間に、\n障害等級に該当する程度の障害の状態に該当するに至つたときは、その者は、その期間内に前項の障害基礎年金の支給を請求することができる。\n３　第三十条の二第三項の規定は、前項の場合に準用する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十一条", "（併給の調整）", "2026-10-01", "（併給の調整）\n第三十一条　障害基礎年金の受給権者に対して更に障害基礎年金を支給すべき事由が生じたときは、前後の障害を併合した障害の程度による障害基礎年金を支給する。\n２　障害基礎年金の受給権者が前項の規定により前後の障害を併合した障害の程度による障害基礎年金の受給権を取得したときは、従前の障害基礎年金の受給権は、消滅する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十二条", "—", "2026-10-01", "第三十二条　期間を定めて支給を停止されている障害基礎年金の受給権者に対して更に障害基礎年金を支給すべき事由が生じたときは、前条第一項の規定により支給する前後の障害を併合した障害の程度による障害基礎年金は、従前の障害基礎年金の支給を停止すべきであつた期間、その支給を停止するものとし、その間、\nその者に従前の障害を併合しない障害の程度による障害基礎年金を支給する。\n２　障害基礎年金の受給権者が更に障害基礎年金の受給権を取得した場合において、新たに取得した障害基礎年金が第三十六条第一項の規定によりその支給を停止すべきものであるときは、前条第二項の規定にかかわらず、その停止すべき期間、その者に対して従前の障害基礎年金を支給する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十三条", "（年金額）", "2026-10-01", "（年金額）\n第三十三条　障害基礎年金の額は、七十八万九百円に改定率を乗じて得た額（その額に五十円未満の端数が生じたときは、これを切り捨て、五十円以上百円未満の端数が生じたときは、これを百円に切り上げるものとする。）とする。\n２　障害の程度が障害等級の一級に該当する者に支給する障害基礎年金の額は、前項の規定にかかわらず、同項に定める額の百分の百二十五に相当する額とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十三条の二", "—", "2026-10-01", "第三十三条の二　障害基礎年金の額は、受給権者によつて生計を維持しているその者の子（十八歳に達する日以後の最初の三月三十一日までの間にある子及び二十歳未満であつて障害等級に該当する障害の状態にある子に限る。）があるときは、前条の規定にかかわらず、同条に定める額にその子一人につきそれぞれ七万四千九百円に改定率（第二十七条の三及び第二十七条の五の規定の適用がな\nいものとして改定した改定率とする。以下この項において同じ。）を乗じて得た額（そのうち二人までについては、それぞれ二十二万四千七百円に改定率を乗じて得た額とし、それらの額に五十円未満の端数が生じたときは、これを切り捨て、五十円以上百円未満の端数が生じたときは、これを百円に切り上げるものとする。）を加算した額とする。\n２　受給権者がその権利を取得した日の翌日以後にその者によつて生計を維持しているその者の子（十八歳に達する日以後の最初の三月三十一日までの間にある子及び二十歳未満であつて障害等級に該当する障害の状態にある子に限る。）を有するに至つたことにより、前項の規定によりその額を加算することとなつたときは、当該子を有するに至つた日の属する月の翌月から、\n障害基礎年金の額を改定する。\n３　第一項の規定によりその額が加算された障害基礎年金については、子のうちの一人又は二人以上が次の各号のいずれかに該当するに至つたときは、その該当するに至つた日の属する月の翌月から、その該当するに至つた子の数に応じて、年金額を改定する。\n一　死亡したとき。\n二　受給権者による生計維持の状態がやんだとき。\n三　婚姻をしたとき。\n四　受給権者の配偶者以外の者の養子となつたとき。\n五　離縁によつて、受給権者の子でなくなつたとき。\n六　十八歳に達した日以後の最初の三月三十一日が終了したとき。ただし、障害等級に該当する障害の状態にあるときを除く。\n七　障害等級に該当する障害の状態にある子について、その事情がやんだとき。ただし、その子が十八歳に達する日以後の最初の三月三十一日までの間にあるときを除く。\n八　二十歳に達したとき。\n４　第一項又は前項第二号の規定の適用上、障害基礎年金の受給権者によつて生計を維持していること又はその者による生計維持の状態がやんだことの認定に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十四条", "（障害の程度が変わつた場合の年金額の改定）", "2026-10-01", "（障害の程度が変わつた場合の年金額の改定）\n第三十四条　厚生労働大臣は、障害基礎年金の受給権者について、その障害の程度を診査し、その程度が従前の障害等級以外の障害等級に該当すると認めるときは、障害基礎年金の額を改定することができる。\n２　障害基礎年金の受給権者は、厚生労働大臣に対し、障害の程度が増進したことによる障害基礎年金の額の改定を請求することができる。\n３　前項の請求は、障害基礎年金の受給権者の障害の程度が増進したことが明らかである場合として厚生労働省令で定める場合を除き、当該障害基礎年金の受給権を取得した日又は第一項の規定による厚生労働大臣の診査を受けた日から起算して一年を経過した日後でなければ行うことができない。\n４　障害基礎年金の受給権者であつて、疾病にかかり、又は負傷し、かつ、その傷病（当該障害基礎年金の支給事由となつた障害に係る傷病の初診日後に初診日があるものに限る。以下この項及び第三十六条第二項ただし書において同じ。）に係る当該初診日において第三十条第一項各号のいずれかに該当したものが、当該傷病により障害（障害等級に該当しない程度のものに限る。\n以下この項及び第三十六条第二項ただし書において「その他障害」という。）の状態にあり、かつ、当該傷病に係る障害認定日以後六十五歳に達する日の前日までの間において、当該障害基礎年金の支給事由となつた障害とその他障害（その他障害が二以上ある場合は、すべてのその他障害を併合した障害）\nとを併合した障害の程度が当該障害基礎年金の支給事由となつた障害の程度より増進したときは、その者は、厚生労働大臣に対し、その期間内に当該障害基礎年金の額の改定を請求することができる。\n５　第三十条第一項ただし書の規定は、前項の場合に準用する。\n６　第一項の規定により障害基礎年金の額が改定されたときは、改定後の額による障害基礎年金の支給は、改定が行われた日の属する月の翌月から始めるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十五条", "（失権）", "2026-10-01", "（失権）\n第三十五条　障害基礎年金の受給権は、第三十一条第二項の規定によつて消滅するほか、受給権者が次の各号のいずれかに該当するに至つたときは、消滅する。\n一　死亡したとき。\n二　厚生年金保険法第四十七条第二項に規定する障害等級に該当する程度の障害の状態にない者が、六十五歳に達したとき。ただし、六十五歳に達した日において、同項に規定する障害等級に該当する程度の障害の状態に該当しなくなつた日から起算して同項に規定する障害等級に該当する程度の障害の状態に該当することなく三年を経過していないときを除く。\n三　厚生年金保険法第四十七条第二項に規定する障害等級に該当する程度の障害の状態に該当しなくなつた日から起算して同項に規定する障害等級に該当する程度の障害の状態に該当することなく三年を経過したとき。ただし、三年を経過した日において、当該受給権者が六十五歳未満であるときを除く。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十六条", "（支給停止）", "2026-10-01", "（支給停止）\n第三十六条　障害基礎年金は、その受給権者が当該傷病による障害について、労働基準法（昭和二十二年法律第四十九号）の規定による障害補償を受けることができるときは、六年間、その支給を停止する。\n２　障害基礎年金は、受給権者が障害等級に該当する程度の障害の状態に該当しなくなつたときは、その障害の状態に該当しない間、その支給を停止する。ただし、その支給を停止された障害基礎年金の受給権者が疾病にかかり、又は負傷し、かつ、その傷病に係る初診日において第三十条第一項各号のいずれかに該当した場合であつて、当該傷病によりその他障害の状態にあり、\nかつ、当該傷病に係る障害認定日以後六十五歳に達する日の前日までの間において、当該障害基礎年金の支給事由となつた障害とその他障害（その他障害が二以上ある場合は、すべてのその他障害を併合した障害）とを併合した障害の程度が障害等級に該当するに至つたときは、この限りでない。\n３　第三十条第一項ただし書の規定は、前項ただし書の場合に準用する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十六条の二", "—", "2026-10-01", "第三十六条の二　第三十条の四の規定による障害基礎年金は、受給権者が次の各号のいずれかに該当するとき（第二号及び第三号に該当する場合にあつては、厚生労働省令で定める場合に限る。）は、その該当する期間、その支給を停止する。\n一　恩給法（大正十二年法律第四十八号。他の法律において準用する場合を含む。）に基づく年金たる給付、労働者災害補償保険法（昭和二十二年法律第五十号）の規定による年金たる給付その他の年金たる給付であつて政令で定めるものを受けることができるとき。\n二　刑事施設、労役場その他これらに準ずる施設に拘禁されているとき。\n三　少年院その他これに準ずる施設に収容されているとき。\n四　日本国内に住所を有しないとき。\n２　前項第一号に規定する給付が、その全額につき支給を停止されているときは、同項の規定を適用しない。ただし、その支給の停止が前条第一項又は第四十一条第一項に規定する給付が行われることによるものであるときは、この限りでない。\n３　第一項に規定する障害基礎年金の額及び同項第一号に規定する給付の額（その給付が、その額の一部につき支給を停止されているときは、停止されていない部分の額。次項において同じ。）が、いずれも政令で定める額に満たないときは、第一項の規定を適用しない。ただし、これらの額を合算した額が当該政令で定める額を超えるときは、\n当該障害基礎年金のうちその超える額に相当する部分については、この限りでない。\n４　第一項に規定する障害基礎年金の額が、前項に規定する政令で定める額以上であり、かつ、第一項第一号に規定する給付の額を超えるときは、その超える部分については、同項の規定にかかわらず、当該障害基礎年金の支給を停止しない。\n５　第一項第一号に規定する給付が、恩給法による増加恩給、同法第七十五条第一項第二号に規定する扶助料その他政令で定めるこれらに準ずる給付であつて、障害又は死亡を事由として政令で定める者に支給されるものであるときは、第一項、第三項及び前項の規定を適用しない。\n６　第一項第一号に規定する給付の額の計算方法は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十六条の三", "—", "2026-10-01", "第三十六条の三　第三十条の四の規定による障害基礎年金は、受給権者の前年の所得が、その者の所得税法（昭和四十年法律第三十三号）に規定する同一生計配偶者及び扶養親族（以下「扶養親族等」という。）の有無及び数に応じて、政令で定める額を超えるときは、その年の十月から翌年の九月まで、政令で定めるところにより、\nその全部又は二分の一（第三十三条の二第一項の規定によりその額が加算された障害基礎年金にあつては、その額から同項の規定により加算する額を控除した額の二分の一）に相当する部分の支給を停止する。\n２　前項に規定する所得の範囲及びその額の計算方法は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十六条の四", "—", "2026-10-01", "第三十六条の四　震災、風水害、火災その他これらに類する災害により、自己又は所得税法に規定する同一生計配偶者若しくは扶養親族の所有に係る住宅、家財又は政令で定めるその他の財産につき被害金額（保険金、損害賠償金等により補充された金額を除く。）がその価格のおおむね二分の一以上である損害を受けた者（以下「被災者」という。\n）がある場合においては、その損害を受けた月から翌年の九月までの第三十条の四の規定による障害基礎年金については、その損害を受けた年の前年又は前々年における当該被災者の所得を理由とする前条の規定による支給の停止は、行わない。\n２　前項の規定により第三十条の四の規定による障害基礎年金の支給の停止が行われなかつた場合において、当該被災者の当該損害を受けた年の所得が、その者の扶養親族等の有無及び数に応じて、前条第一項に規定する政令で定める額を超えるときは、当該被災者に支給する第三十条の四の規定による障害基礎年金で、前項に規定する期間に係るものは、\n当該被災者が損害を受けた月に遡つて、その支給を停止する。\n３　前項に規定する所得の範囲及びその額の計算方法については、前条第一項に規定する所得の範囲及びその額の計算方法の例による。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十七条", "（支給要件）", "2026-10-01", "（支給要件）\n第三十七条　遺族基礎年金は、被保険者又は被保険者であつた者が次の各号のいずれかに該当する場合に、その者の配偶者又は子に支給する。ただし、第一号又は第二号に該当する場合にあつては、死亡した者につき、死亡日の前日において、死亡日の属する月の前々月までに被保険者期間があり、かつ、\n当該被保険者期間に係る保険料納付済期間と保険料免除期間とを合算した期間が当該被保険者期間の三分の二に満たないときは、この限りでない。\n一　被保険者が、死亡したとき。\n二　被保険者であつた者であつて、日本国内に住所を有し、かつ、六十歳以上六十五歳未満であるものが、死亡したとき。\n三　保険料納付済期間と保険料免除期間とを合算した期間が二十五年以上である者が、死亡したとき。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十七条の二", "（遺族の範囲）", "2026-10-01", "（遺族の範囲）\n第三十七条の二　遺族基礎年金を受けることができる配偶者又は子は、被保険者又は被保険者であつた者の配偶者又は子（以下単に「配偶者」又は「子」という。）であつて、被保険者又は被保険者であつた者の死亡の当時その者によつて生計を維持し、かつ、次に掲げる要件に該当したものとする。\n一　配偶者については、被保険者又は被保険者であつた者の死亡の当時その者によつて生計を維持し、かつ、次号に掲げる要件に該当する子と生計を同じくすること。\n二　子については、十八歳に達する日以後の最初の三月三十一日までの間にあるか又は二十歳未満であつて障害等級に該当する障害の状態にあり、かつ、現に婚姻をしていないこと。\n２　被保険者又は被保険者であつた者の死亡の当時胎児であつた子が生まれたときは、前項の規定の適用については、将来に向かつて、その子は、被保険者又は被保険者であつた者の死亡の当時その者によつて生計を維持していたものとみなし、配偶者は、その者の死亡の当時その子と生計を同じくしていたものとみなす。\n３　第一項の規定の適用上、被保険者又は被保険者であつた者によつて生計を維持していたことの認定に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十八条", "（年金額）", "2026-10-01", "（年金額）\n第三十八条　遺族基礎年金の額は、七十八万九百円に改定率を乗じて得た額（その額に五十円未満の端数が生じたときは、これを切り捨て、五十円以上百円未満の端数が生じたときは、これを百円に切り上げるものとする。）とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十九条", "—", "2026-10-01", "第三十九条　配偶者に支給する遺族基礎年金の額は、前条の規定にかかわらず、同条に定める額に配偶者が遺族基礎年金の受給権を取得した当時第三十七条の二第一項に規定する要件に該当し、かつ、その者と生計を同じくした子につきそれぞれ七万四千九百円に改定率（第二十七条の三及び第二十七条の五の規定の適用がないものとして改定した改定率とする。以下この項において同じ。\n）を乗じて得た額（そのうち二人までについては、それぞれ二十二万四千七百円に改定率を乗じて得た額とし、それらの額に五十円未満の端数が生じたときは、これを切り捨て、五十円以上百円未満の端数が生じたときは、これを百円に切り上げるものとする。）を加算した額とする。\n２　配偶者が遺族基礎年金の受給権を取得した当時胎児であつた子が生まれたときは、前項の規定の適用については、その子は、配偶者がその権利を取得した当時第三十七条の二第一項に規定する要件に該当し、かつ、その者と生計を同じくした子とみなし、その生まれた日の属する月の翌月から、遺族基礎年金の額を改定する。\n３　配偶者に支給する遺族基礎年金については、第一項に規定する子が二人以上ある場合であつて、その子のうち一人を除いた子の一人又は二人以上が次の各号のいずれかに該当するに至つたときは、その該当するに至つた日の属する月の翌月から、その該当するに至つた子の数に応じて、年金額を改定する。\n一　死亡したとき。\n二　婚姻（届出をしていないが、事実上婚姻関係と同様の事情にある場合を含む。以下同じ。）をしたとき。\n三　配偶者以外の者の養子（届出をしていないが、事実上養子縁組関係と同様の事情にある者を含む。以下同じ。）となつたとき。\n四　離縁によつて、死亡した被保険者又は被保険者であつた者の子でなくなつたとき。\n五　配偶者と生計を同じくしなくなつたとき。\n六　十八歳に達した日以後の最初の三月三十一日が終了したとき。ただし、障害等級に該当する障害の状態にあるときを除く。\n七　障害等級に該当する障害の状態にある子について、その事情がやんだとき。ただし、その子が十八歳に達する日以後の最初の三月三十一日までの間にあるときを除く。\n八　二十歳に達したとき。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第三十九条の二", "—", "2026-10-01", "第三十九条の二　子に支給する遺族基礎年金の額は、当該被保険者又は被保険者であつた者の死亡について遺族基礎年金の受給権を取得した子が二人以上あるときは、第三十八条の規定にかかわらず、同条に定める額にその子のうち一人を除いた子につきそれぞれ七万四千九百円に改定率（第二十七条の三及び第二十七条の五の規定の適用がないものとして改定した改定率とする。\n以下この項において同じ。）を乗じて得た額（そのうち一人については、二十二万四千七百円に改定率を乗じて得た額とし、それらの額に五十円未満の端数が生じたときは、これを切り捨て、五十円以上百円未満の端数が生じたときは、これを百円に切り上げるものとする。）を加算した額を、その子の数で除して得た額とする。\n２　前項の場合において、遺族基礎年金の受給権を有する子の数に増減を生じたときは、増減を生じた日の属する月の翌月から、遺族基礎年金の額を改定する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四十条", "（失権）", "2026-10-01", "（失権）\n第四十条　遺族基礎年金の受給権は、受給権者が次の各号のいずれかに該当するに至つたときは、消滅する。\n一　死亡したとき。\n二　婚姻をしたとき。\n三　養子となつたとき（直系血族又は直系姻族の養子となつたときを除く。）。\n２　配偶者の有する遺族基礎年金の受給権は、前項の規定によつて消滅するほか、第三十九条第一項に規定する子が一人であるときはその子が、同項に規定する子が二人以上であるときは同時に又は時を異にしてその全ての子が、同条第三項各号のいずれかに該当するに至つたときは、消滅する。\n３　子の有する遺族基礎年金の受給権は、第一項の規定によつて消滅するほか、子が次の各号のいずれかに該当するに至つたときは、消滅する。\n一　離縁によつて、死亡した被保険者又は被保険者であつた者の子でなくなつたとき。\n二　十八歳に達した日以後の最初の三月三十一日が終了したとき。ただし、障害等級に該当する障害の状態にあるときを除く。\n三　障害等級に該当する障害の状態にある子について、その事情がやんだとき。ただし、その子が十八歳に達する日以後の最初の三月三十一日までの間にあるときを除く。\n四　二十歳に達したとき。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四十一条", "（支給停止）", "2026-10-01", "（支給停止）\n第四十一条　遺族基礎年金は、当該被保険者又は被保険者であつた者の死亡について、労働基準法の規定による遺族補償が行われるべきものであるときは、死亡日から六年間、その支給を停止する。\n２　子に対する遺族基礎年金は、配偶者が遺族基礎年金の受給権を有するとき（配偶者に対する遺族基礎年金が第二十条の二第一項若しくは第二項又は次条第一項の規定によりその支給を停止されているときを除く。）、又は生計を同じくするその子の父若しくは母があるときは、その間、その支給を停止する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四十一条の二", "—", "2026-10-01", "第四十一条の二　配偶者に対する遺族基礎年金は、その者の所在が一年以上明らかでないときは、遺族基礎年金の受給権を有する子の申請によつて、その所在が明らかでなくなつた時に遡つて、その支給を停止する。\n２　配偶者は、いつでも、前項の規定による支給の停止の解除を申請することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四十二条", "—", "2026-10-01", "第四十二条　遺族基礎年金の受給権を有する子が二人以上ある場合において、その子のうち一人以上の子の所在が一年以上明らかでないときは、その子に対する遺族基礎年金は、他の子の申請によつて、その所在が明らかでなくなつた時にさかのぼつて、その支給を停止する。\n２　前項の規定によつて遺族基礎年金の支給を停止された子は、いつでも、その支給の停止の解除を申請することができる。\n３　第三十九条の二第二項の規定は、第一項の規定により遺族基礎年金の支給が停止され、又は前項の規定によりその停止が解除された場合に準用する。この場合において、同条第二項中「増減を生じた日」とあるのは、「支給が停止され、又はその停止が解除された日」と読み替えるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四十三条", "（支給要件）", "2026-10-01", "（支給要件）\n第四十三条　付加年金は、第八十七条の二第一項の規定による保険料に係る保険料納付済期間を有する者が老齢基礎年金の受給権を取得したときに、その者に支給する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四十四条", "（年金額）", "2026-10-01", "（年金額）\n第四十四条　付加年金の額は、二百円に第八十七条の二第一項の規定による保険料に係る保険料納付済期間の月数を乗じて得た額とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四十五条", "（国民年金基金又は国民年金基金連合会の解散の場合の取扱い）", "2026-10-01", "（国民年金基金又は国民年金基金連合会の解散の場合の取扱い）\n第四十五条　国民年金基金又は国民年金基金連合会が解散したときは、次の各号に掲げる期間は、それぞれ、第八十七条の二第一項の規定による保険料に係る保険料納付済期間とみなして、前二条の規定を適用する。\n一　その解散前に納付された掛金に係る国民年金基金の加入員であつた期間であつて、国民年金基金連合会がその支給に関する義務を負つている年金の額の計算の基礎となる期間を除いたもの（第八十七条の規定による保険料に係る保険料納付済期間である期間に限る。）\n二　その解散に係る国民年金基金連合会がその支給に関する義務を負つていた年金の額の計算の基礎となる国民年金基金の加入員であつた期間であつて、納付された掛金に係るもの（第八十七条の規定による保険料に係る保険料納付済期間である期間に限る。）\n２　前項の場合において、国民年金基金の加入員であつた者が付加年金の受給権を取得した後に当該国民年金基金又はその者に対し年金の支給に関する義務を負つていた国民年金基金連合会が解散したものであるときは、その国民年金基金又は国民年金基金連合会が解散した月の翌月から、当該付加年金の額を改定する。\n３　第一項の場合において、国民年金基金の加入員であつた者が老齢基礎年金の受給権を取得した後に当該国民年金基金又はその者に対し年金の支給に関する義務を負つていた国民年金基金連合会が解散したものである場合（前項の規定に該当する場合を除く。）におけるその者に対する第四十三条の規定の適用については、同条中「老齢基礎年金の受給権を取得」とあるのは、\n「加入員であつた国民年金基金又はその者に対し年金の支給に関する義務を負つていた国民年金基金連合会が解散」と読み替えるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四十六条", "（支給の繰下げ）", "2026-10-01", "（支給の繰下げ）\n第四十六条　付加年金の支給は、その受給権者が第二十八条第一項に規定する支給繰下げの申出（同条第五項の規定により同条第一項の申出があつたものとみなされた場合における当該申出を含む。）を行つたときは、第十八条第一項の規定にかかわらず、当該申出のあつた日の属する月の翌月から始めるものとする。\n２　第二十八条第四項の規定は、前項の規定によつて支給する付加年金の額について準用する。この場合において、同条第四項中「第二十七条」とあるのは、「第四十四条」と読み替えるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四十七条", "（支給停止）", "2026-10-01", "（支給停止）\n第四十七条　付加年金は、老齢基礎年金がその全額につき支給を停止されているときは、その間、その支給を停止する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四十八条", "（失権）", "2026-10-01", "（失権）\n第四十八条　付加年金の受給権は、受給権者が死亡したときは、消滅する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第四十九条", "（支給要件）", "2026-10-01", "（支給要件）\n第四十九条　寡婦年金は、死亡日の前日において死亡日の属する月の前月までの第一号被保険者としての被保険者期間に係る保険料納付済期間と保険料免除期間とを合算した期間が十年以上である夫（保険料納付済期間又は第九十条の三第一項の規定により納付することを要しないものとされた保険料に係る期間以外の保険料免除期間を有する者に限る。\n）が死亡した場合において、夫の死亡の当時夫によつて生計を維持し、かつ、夫との婚姻関係（届出をしていないが、事実上婚姻関係と同様の事情にある場合を含む。）が十年以上継続した六十五歳未満の妻があるときに、その者に支給する。ただし、老齢基礎年金又は障害基礎年金の支給を受けたことがある夫が死亡したときは、この限りでない。\n２　第三十七条の二第三項の規定は、前項の場合に準用する。この場合において、同条第三項中「被保険者又は被保険者であつた者」とあるのは、「夫」と読み替えるものとする。\n３　六十歳未満の妻に支給する寡婦年金は、第十八条第一項の規定にかかわらず、妻が六十歳に達した日の属する月の翌月から、その支給を始める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第五十条", "（年金額）", "2026-10-01", "（年金額）\n第五十条　寡婦年金の額は、死亡日の属する月の前月までの第一号被保険者としての被保険者期間に係る死亡日の前日における保険料納付済期間及び保険料免除期間につき、第二十七条の規定の例によつて計算した額の四分の三に相当する額とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第五十一条", "（失権）", "2026-10-01", "（失権）\n第五十一条　寡婦年金の受給権は、受給権者が六十五歳に達したとき、又は第四十条第一項各号のいずれかに該当するに至つたときは、消滅する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第五十二条", "（支給停止）", "2026-10-01", "（支給停止）\n第五十二条　寡婦年金は、当該夫の死亡について第四十一条第一項に規定する給付が行われるべきものであるときは、死亡日から六年間、その支給を停止する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第五十二条の二", "（支給要件）", "2026-10-01", "（支給要件）\n第五十二条の二　死亡一時金は、死亡日の前日において死亡日の属する月の前月までの第一号被保険者としての被保険者期間に係る保険料納付済期間の月数、保険料四分の一免除期間の月数の四分の三に相当する月数、保険料半額免除期間の月数の二分の一に相当する月数及び保険料四分の三免除期間の月数の四分の一に相当する月数を合算した月数が三十六月以上である者が死亡した場合におい\nて、その者に遺族があるときに、その遺族に支給する。ただし、老齢基礎年金又は障害基礎年金の支給を受けたことがある者が死亡したときは、この限りでない。\n２　前項の規定にかかわらず、死亡一時金は、次の各号のいずれかに該当するときは、支給しない。\n一　死亡した者の死亡日においてその者の死亡により遺族基礎年金を受けることができる者があるとき。ただし、当該死亡日の属する月に当該遺族基礎年金の受給権が消滅したときを除く。\n二　死亡した者の死亡日において胎児である子がある場合であつて、当該胎児であつた子が生まれた日においてその子又は死亡した者の配偶者が死亡した者の死亡により遺族基礎年金を受けることができるに至つたとき。ただし、当該胎児であつた子が生まれた日の属する月に当該遺族基礎年金の受給権が消滅したときを除く。\n３　第一項に規定する死亡した者の子がその者の死亡により遺族基礎年金の受給権を取得した場合（その者の死亡によりその者の配偶者が遺族基礎年金の受給権を取得した場合を除く。）であつて、その受給権を取得した当時その子と生計を同じくするその子の父又は母があることにより第四十一条第二項の規定によつて当該遺族基礎年金の支給が停止されるものであるときは、\n前項の規定は適用しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第五十二条の三", "（遺族の範囲及び順位等）", "2026-10-01", "（遺族の範囲及び順位等）\n第五十二条の三　死亡一時金を受けることができる遺族は、死亡した者の配偶者、子、父母、孫、祖父母又は兄弟姉妹であつて、その者の死亡の当時その者と生計を同じくしていたものとする。ただし、前条第三項の規定に該当する場合において支給する死亡一時金を受けることができる遺族は、死亡した者の配偶者であつて、その者の死亡の当時その者と生計を同じくしていたものとする。\n２　死亡一時金（前項ただし書に規定するものを除く。次項において同じ。）を受けるべき者の順位は、前項に規定する順序による。\n３　死亡一時金を受けるべき同順位の遺族が二人以上あるときは、その一人のした請求は、全員のためその全額につきしたものとみなし、その一人に対してした支給は、全員に対してしたものとみなす。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第五十二条の四", "（金額）", "2026-10-01", "（金額）\n第五十二条の四　死亡一時金の額は、死亡日の属する月の前月までの第一号被保険者としての被保険者期間に係る死亡日の前日における保険料納付済期間の月数、保険料四分の一免除期間の月数の四分の三に相当する月数、保険料半額免除期間の月数の二分の一に相当する月数及び保険料四分の三免除期間の月数の四分の一に相当する月数を合算した月数に応じて、\nそれぞれ次の表の下欄に定める額とする。\n死亡日の属する月の前月までの被保険者期間に係る死亡日の前日における保険料納付済期間の月数、保険料四分の一免除期間の月数の四分の三に相当する月数、保険料半額免除期間の月数の二分の一に相当する月数及び保険料四分の三免除期間の月数の四分の一に相当する月数を合算した月数\n金額\n三六月以上一八〇月未満\n一二〇、〇〇〇円\n一八〇月以上二四〇月未満\n一四五、〇〇〇円\n二四〇月以上三〇〇月未満\n一七〇、〇〇〇円\n三〇〇月以上三六〇月未満\n二二〇、〇〇〇円\n三六〇月以上四二〇月未満\n二七〇、〇〇〇円\n四二〇月以上\n三二〇、〇〇〇円\n２　死亡日の属する月の前月までの第一号被保険者としての被保険者期間に係る死亡日の前日における第八十七条の二第一項の規定による保険料に係る保険料納付済期間が三年以上である者の遺族に支給する死亡一時金の額は、前項の規定にかかわらず、同項に定める額に八千五百円を加算した額とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第五十二条の五", "—", "2026-10-01", "第五十二条の五　第四十五条第一項の規定は、死亡一時金について準用する。この場合において、同項中「前二条」とあるのは、「第五十二条の四第二項」と読み替えるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第五十二条の六", "（支給の調整）", "2026-10-01", "（支給の調整）\n第五十二条の六　第五十二条の三の規定により死亡一時金の支給を受ける者が、第五十二条の二第一項に規定する者の死亡により寡婦年金を受けることができるときは、その者の選択により、死亡一時金と寡婦年金とのうち、その一を支給し、他は支給しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第五十三条から第六十八条まで", "—", "2026-10-01", "第五十三条から第六十八条まで　削除", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第六十九条", "—", "2026-10-01", "第六十九条　故意に障害又はその直接の原因となつた事故を生じさせた者の当該障害については、これを支給事由とする障害基礎年金は、支給しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七十条", "—", "2026-10-01", "第七十条　故意の犯罪行為若しくは重大な過失により、又は正当な理由がなくて療養に関する指示に従わないことにより、障害若しくはその原因となつた事故を生じさせ、又は障害の程度を増進させた者の当該障害については、これを支給事由とする給付は、その全部又は一部を行わないことができる。\n自己の故意の犯罪行為若しくは重大な過失により、又は正当な理由がなくて療養に関する指示に従わないことにより、死亡又はその原因となつた事故を生じさせた者の死亡についても、同様とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七十一条", "—", "2026-10-01", "第七十一条　遺族基礎年金、寡婦年金又は死亡一時金は、被保険者又は被保険者であつた者を故意に死亡させた者には、支給しない。被保険者又は被保険者であつた者の死亡前に、その者の死亡によつて遺族基礎年金又は死亡一時金の受給権者となるべき者を故意に死亡させた者についても、同様とする。\n２　遺族基礎年金の受給権は、受給権者が他の受給権者を故意に死亡させたときは、消滅する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七十二条", "—", "2026-10-01", "第七十二条　年金給付は、次の各号のいずれかに該当する場合においては、その額の全部又は一部につき、その支給を停止することができる。\n一　受給権者が、正当な理由がなくて、第百七条第一項の規定による命令に従わず、又は同項の規定による当該職員の質問に応じなかつたとき。\n二　障害基礎年金の受給権者又は第百七条第二項に規定する子が、正当な理由がなくて、同項の規定による命令に従わず、又は同項の規定による当該職員の診断を拒んだとき。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七十三条", "—", "2026-10-01", "第七十三条　受給権者が、正当な理由がなくて、第百五条第三項の規定による届出をせず、又は書類その他の物件を提出しないときは、年金給付の支払を一時差し止めることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七十四条", "—", "2026-10-01", "第七十四条　政府は、国民年金事業の円滑な実施を図るため、国民年金に関し、次に掲げる事業を行うことができる。\n一　教育及び広報を行うこと。\n二　被保険者、受給権者その他の関係者（以下この条において「被保険者等」という。）に対し、相談その他の援助を行うこと。\n三　被保険者等に対し、被保険者等が行う手続に関する情報その他の被保険者等の利便の向上に資する情報を提供すること。\n２　政府は、国民年金事業の実施に必要な事務を円滑に処理し、被保険者等の利便の向上に資するため、電子情報処理組織の運用を行うものとする。\n３　政府は、第一項各号に掲げる事業及び前項に規定する運用の全部又は一部を日本年金機構（以下「機構」という。）に行わせることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七十五条", "（運用の目的）", "2026-10-01", "（運用の目的）\n第七十五条　積立金の運用は、積立金が国民年金の被保険者から徴収された保険料の一部であり、かつ、将来の給付の貴重な財源となるものであることに特に留意し、専ら国民年金の被保険者の利益のために、長期的な観点から、安全かつ効率的に行うことにより、将来にわたつて、国民年金事業の運営の安定に資することを目的として行うものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七十六条", "（積立金の運用）", "2026-10-01", "（積立金の運用）\n第七十六条　積立金の運用は、厚生労働大臣が、前条の目的に沿つた運用に基づく納付金の納付を目的として、年金積立金管理運用独立行政法人に対し、積立金を寄託することにより行うものとする。\n２　厚生労働大臣は、前項の規定にかかわらず、同項の規定に基づく寄託をするまでの間、財政融資資金に積立金を預託することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七十七条", "（運用職員の責務）", "2026-10-01", "（運用職員の責務）\n第七十七条　積立金の運用に係る行政事務に従事する厚生労働省の職員（政令で定める者に限る。以下「運用職員」という。）は、積立金の運用の目的に沿つて、慎重かつ細心の注意を払い、全力を挙げてその職務を遂行しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七十八条", "（秘密保持義務）", "2026-10-01", "（秘密保持義務）\n第七十八条　運用職員は、その職務に関して知り得た秘密を漏らし、又は盗用してはならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第七十九条", "（懲戒処分）", "2026-10-01", "（懲戒処分）\n第七十九条　運用職員が前条の規定に違反したと認めるときは、厚生労働大臣は、その職員に対し国家公務員法（昭和二十二年法律第百二十号）に基づく懲戒処分をしなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第八十条", "（年金積立金管理運用独立行政法人法との関係）", "2026-10-01", "（年金積立金管理運用独立行政法人法との関係）\n第八十条　積立金の運用については、この法律に定めるもののほか、年金積立金管理運用独立行政法人法（平成十六年法律第百五号）の定めるところによる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第八十一条から第八十四条まで", "—", "2026-10-01", "第八十一条から第八十四条まで　削除", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第八十五条", "（国庫負担）", "2026-10-01", "（国庫負担）\n第八十五条　国庫は、毎年度、国民年金事業に要する費用（次項に規定する費用を除く。）に充てるため、次に掲げる額を負担する。\n一　当該年度における基礎年金（老齢基礎年金、障害基礎年金及び遺族基礎年金をいう。以下同じ。）の給付に要する費用の総額（次号及び第三号に掲げる額を除く。以下「保険料・拠出金算定対象額」という。）から第二十七条第三号、第五号及び第七号に規定する月数を基礎として計算したものを控除して得た額に、\n一から各政府及び実施機関に係る第九十四条の三第一項に規定する政令で定めるところにより算定した率を合算した率を控除して得た率を乗じて得た額の二分の一に相当する額\n二　当該年度における保険料免除期間を有する者に係る老齢基礎年金（第二十七条ただし書の規定によつてその額が計算されるものに限る。）の給付に要する費用の額に、イに掲げる数をロに掲げる数で除して得た数を乗じて得た額の合算額\nイ　次に掲げる数を合算した数\n（１）　当該保険料四分の一免除期間の月数（四百八十から当該保険料納付済期間の月数を控除して得た月数を限度とする。）に八分の一を乗じて得た数\n（２）　当該保険料半額免除期間の月数（四百八十から当該保険料納付済期間の月数及び当該保険料四分の一免除期間の月数を合算した月数を控除して得た月数を限度とする。）に四分の一を乗じて得た数\n（３）　当該保険料四分の三免除期間の月数（四百八十から当該保険料納付済期間の月数、当該保険料四分の一免除期間の月数及び当該保険料半額免除期間の月数を合算した月数を控除して得た月数を限度とする。）に八分の三を乗じて得た数\n（４）　当該保険料全額免除期間（第九十条の三第一項の規定により納付することを要しないものとされた保険料に係るものを除く。）の月数（四百八十から当該保険料納付済期間の月数、当該保険料四分の一免除期間の月数、当該保険料半額免除期間の月数及び当該保険料四分の三免除期間の月数を合算した月数を控除して得た月数を限度とする。）に二分の一を乗じて得た数\nロ　第二十七条各号に掲げる月数を合算した数\n三　当該年度における第三十条の四の規定による障害基礎年金の給付に要する費用の百分の二十に相当する額\n２　国庫は、毎年度、予算の範囲内で、国民年金事業の事務の執行に要する費用を負担する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第八十六条", "（事務費の交付）", "2026-10-01", "（事務費の交付）\n第八十六条　政府は、政令の定めるところにより、市町村（特別区を含む。以下同じ。）に対し、市町村長がこの法律又はこの法律に基づく政令の規定によつて行う事務の処理に必要な費用を交付する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第八十七条", "（保険料）", "2026-10-01", "（保険料）\n第八十七条　政府は、国民年金事業に要する費用に充てるため、保険料を徴収する。\n２　保険料は、被保険者期間の計算の基礎となる各月につき、徴収するものとする。\n３　保険料の額は、次の表の上欄に掲げる月分についてそれぞれ同表の下欄に定める額に保険料改定率を乗じて得た額（その額に五円未満の端数が生じたときは、これを切り捨て、五円以上十円未満の端数が生じたときは、これを十円に切り上げるものとする。）とする。\n平成十七年度に属する月の月分\n一万三千五百八十円\n平成十八年度に属する月の月分\n一万三千八百六十円\n平成十九年度に属する月の月分\n一万四千百四十円\n平成二十年度に属する月の月分\n一万四千四百二十円\n平成二十一年度に属する月の月分\n一万四千七百円\n平成二十二年度に属する月の月分\n一万四千九百八十円\n平成二十三年度に属する月の月分\n一万五千二百六十円\n平成二十四年度に属する月の月分\n一万五千五百四十円\n平成二十五年度に属する月の月分\n一万五千八百二十円\n平成二十六年度に属する月の月分\n一万六千百円\n平成二十七年度に属する月の月分\n一万六千三百八十円\n平成二十八年度に属する月の月分\n一万六千六百六十円\n平成二十九年度及び平成三十年度に属する月の月分\n一万六千九百円\n令和元年度以後の年度に属する月の月分\n一万七千円\n４　平成十七年度における前項の保険料改定率は、一とする。\n５　第三項の保険料改定率は、毎年度、当該年度の前年度の保険料改定率に次に掲げる率を乗じて得た率を基準として改定し、当該年度に属する月の月分の保険料について適用する。\n一　当該年度の初日の属する年の三年前の年の物価指数に対する当該年度の初日の属する年の前々年の物価指数の比率\n二　イに掲げる率をロに掲げる率で除して得た率の三乗根となる率\nイ　当該年度の初日の属する年の六年前の年の四月一日の属する年度における厚生年金保険の被保険者に係る標準報酬平均額に対する当該年度の初日の属する年の三年前の年の四月一日の属する年度における厚生年金保険の被保険者に係る標準報酬平均額の比率\nロ　当該年度の初日の属する年の六年前の年における物価指数に対する当該年度の初日の属する年の三年前の年における物価指数の比率\n６　前項の規定による保険料改定率の改定の措置は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第八十七条の二", "—", "2026-10-01", "第八十七条の二　第一号被保険者（第八十九条第一項、第九十条第一項又は第九十条の三第一項の規定により保険料を納付することを要しないものとされている者、第九十条の二第一項から第三項までの規定によりその一部の額につき保険料を納付することを要しないものとされている者及び国民年金基金の加入員を除く。\n）は、厚生労働大臣に申し出て、その申出をした日の属する月以後の各月につき、前条第三項に定める額の保険料のほか、四百円の保険料を納付する者となることができる。\n２　前項の規定による保険料の納付は、前条第三項に定める額の保険料の納付が行われた月（第九十四条第四項の規定により保険料が納付されたものとみなされた月を除く。）又は第八十八条の二若しくは第八十八条の三第一項若しくは第二項の規定により納付することを要しないものとされた保険料に係る期間の各月についてのみ行うことができる。\n３　第一項の規定により保険料を納付する者となつたものは、いつでも、厚生労働大臣に申し出て、その申出をした日の属する月の前月以後の各月に係る保険料（既に納付されたもの及び第九十三条第一項の規定により前納されたもの（国民年金基金の加入員となつた日の属する月以後の各月に係るものを除く。）を除く。\n）につき第一項の規定により保険料を納付する者でなくなることができる。\n４　第一項の規定により保険料を納付する者となつたものが、国民年金基金の加入員となつたときは、その加入員となつた日に、前項の申出をしたものとみなす。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第八十八条", "（保険料の納付義務）", "2026-10-01", "（保険料の納付義務）\n第八十八条　被保険者は、保険料を納付しなければならない。\n２　世帯主は、その世帯に属する被保険者の保険料を連帯して納付する義務を負う。\n３　配偶者の一方は、被保険者たる他方の保険料を連帯して納付する義務を負う。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第八十八条の二", "—", "2026-10-01", "第八十八条の二　被保険者は、出産の予定日（厚生労働省令で定める場合にあつては、出産の日。次条第一項、第百六条第一項及び第百八条第二項において「出産予定日」という。）の属する月（以下この条において「出産予定月」という。）の前月（多胎妊娠の場合においては、三月前）から出産予定月の翌々月までの期間に係る保険料は、納付することを要しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第八十八条の三", "—", "2026-10-01", "第八十八条の三　前条の規定の適用を受けた被保険者が同条の出産に係る子を養育する場合においては、当該被保険者は、当該出産予定日から起算して三月を経過した日の属する月から当該出産予定日から起算して十二月を経過した日（当該日の前日までに、当該子が死亡したときその他当該被保険者が当該子を養育しないこととなつた事由として厚生労働省令で定める事由が生じたときは、\n当該事由が生じた日の翌日）が属する月の前月までの期間（当該子以外の子に係る同条の規定の適用を受ける期間を除く。）に係る保険料は、納付することを要しない。\n２　被保険者（前項に規定する被保険者を除く。）は、その子（民法（明治二十九年法律第八十九号）第八百十七条の二第一項の規定により被保険者が当該被保険者との間における同項に規定する特別養子縁組の成立について家庭裁判所に請求した者（当該請求に係る家事審判事件が裁判所に係属している場合に限る。\n）であつて当該被保険者が現に監護するもの、児童福祉法（昭和二十二年法律第百六十四号）第二十七条第一項（第三号に係る部分に限る。）の規定により同法第六条の四第二号に規定する養子縁組里親である被保険者に委託されている児童及びこれらの被保険者に準ずる者として厚生労働省令で定める被保険者に厚生労働省令で定めるところにより委託されている者を含む。\n以下この項、第百六条第一項及び第百八条第二項において同じ。）を養育することとなつた日の属する月から当該子が一歳に達する日（当該子が一歳に達する日の前日までに、当該子が死亡したときその他当該被保険者が当該子を養育しないこととなつた事由として厚生労働省令で定める事由が生じたときは、\n当該事由が生じた日）の翌日が属する月の前月までの期間（当該子以外の子に係る前条の規定の適用を受ける期間を除く。）に係る保険料は、納付することを要しない。\n３　前二項の規定により納付することを要しないものとされた保険料に相当する額については、政令で定めるところにより、子ども・子育て支援法（平成二十四年法律第六十五号）の規定により政府が徴収する子ども・子育て支援納付金により補塡するものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第八十九条", "—", "2026-10-01", "第八十九条　被保険者（第八十八条の二、前条第一項及び第二項並びに第九十条の二第一項から第三項までの規定の適用を受ける被保険者を除く。）が次の各号のいずれかに該当するに至つたときは、その該当するに至つた日の属する月の前月からこれに該当しなくなる日の属する月までの期間に係る保険料は、既に納付されたものを除き、納付することを要しない。\n一　障害基礎年金又は厚生年金保険法に基づく障害を支給事由とする年金たる給付その他の障害を支給事由とする給付であつて政令で定めるものの受給権者（最後に同法第四十七条第二項に規定する障害等級に該当する程度の障害の状態（以下この号において「障害状態」という。）\nに該当しなくなつた日から起算して障害状態に該当することなく三年を経過した障害基礎年金の受給権者（現に障害状態に該当しない者に限る。）その他の政令で定める者を除く。）であるとき。\n二　生活保護法（昭和二十五年法律第百四十四号）による生活扶助その他の援助であつて厚生労働省令で定めるものを受けるとき。\n三　前二号に掲げるもののほか、厚生労働省令で定める施設に入所しているとき。\n２　前項の規定により納付することを要しないものとされた保険料について、被保険者又は被保険者であつた者（次条から第九十条の三までにおいて「被保険者等」という。）から当該保険料に係る期間の各月につき、保険料を納付する旨の申出があつたときは、当該申出のあつた期間に係る保険料に限り、同項の規定は適用しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十条", "—", "2026-10-01", "第九十条　次の各号のいずれかに該当する被保険者等から申請があつたときは、厚生労働大臣は、その指定する期間（次条第一項から第三項までの規定の適用を受ける期間又は学校教育法（昭和二十二年法律第二十六号）第五十条に規定する高等学校の生徒、同法第八十三条に規定する大学の学生その他の生徒若しくは学生であつて政令で定めるもの（以下「学生等」という。\n）である期間若しくは学生等であつた期間を除く。）に係る保険料につき、既に納付されたものを除き、これを納付することを要しないものとし、申請のあつた日以後、当該保険料に係る期間を第五条第三項に規定する保険料全額免除期間（第九十四条第一項の規定により追納が行われた場合にあつては、当該追納に係る期間を除く。）に算入することができる。\nただし、世帯主又は配偶者のいずれかが次の各号のいずれにも該当しないときは、この限りでない。\n一　当該保険料を納付することを要しないものとすべき月の属する年の前年の所得（一月から厚生労働省令で定める月までの月分の保険料については、前々年の所得とする。以下この章において同じ。）が、その者の扶養親族等の有無及び数に応じて、政令で定める額以下であるとき。\n二　被保険者又は被保険者の属する世帯の他の世帯員が生活保護法による生活扶助以外の扶助その他の援助であつて厚生労働省令で定めるものを受けるとき。\n三　地方税法（昭和二十五年法律第二百二十六号）に定める障害者、寡婦その他の同法の規定による市町村民税が課されない者として政令で定める者であつて、当該保険料を納付することを要しないものとすべき月の属する年の前年の所得が政令で定める額以下であるとき。\n四　保険料を納付することが著しく困難である場合として天災その他の厚生労働省令で定める事由があるとき。\n２　前項の規定による処分があつたときは、年金給付の支給要件及び額に関する規定の適用については、その処分は、当該申請のあつた日にされたものとみなす。\n３　第一項の規定による処分を受けた被保険者から当該処分の取消しの申請があつたときは、厚生労働大臣は、当該申請があつた日の属する月の前月以後の各月の保険料について、当該処分を取り消すことができる。\n４　第一項第一号及び第三号に規定する所得の範囲及びその額の計算方法は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十条の二", "—", "2026-10-01", "第九十条の二　次の各号のいずれかに該当する被保険者等から申請があつたときは、厚生労働大臣は、その指定する期間（前条第一項若しくは次項若しくは第三項の規定の適用を受ける期間又は学生等である期間若しくは学生等であつた期間を除く。）に係る保険料につき、既に納付されたものを除き、その四分の三を納付することを要しないものとし、申請のあつた日以後、\n当該保険料に係る期間を第五条第四項に規定する保険料四分の三免除期間（第九十四条第一項の規定により追納が行われた場合にあつては、当該追納に係る期間を除く。）に算入することができる。ただし、世帯主又は配偶者のいずれかが次の各号のいずれにも該当しないときは、この限りでない。\n一　当該保険料を納付することを要しないものとすべき月の属する年の前年の所得が、その者の扶養親族等の有無及び数に応じて、政令で定める額以下であるとき。\n二　前条第一項第二号及び第三号に該当するとき。\n三　保険料を納付することが著しく困難である場合として天災その他の厚生労働省令で定める事由があるとき。\n２　次の各号のいずれかに該当する被保険者等から申請があつたときは、厚生労働大臣は、その指定する期間（前条第一項若しくは前項若しくは次項の規定の適用を受ける期間又は学生等である期間若しくは学生等であつた期間を除く。）に係る保険料につき、既に納付されたものを除き、その半額を納付することを要しないものとし、申請のあつた日以後、\n当該保険料に係る期間を第五条第五項に規定する保険料半額免除期間（第九十四条第一項の規定により追納が行われた場合にあつては、当該追納に係る期間を除く。）に算入することができる。ただし、世帯主又は配偶者のいずれかが次の各号のいずれにも該当しないときは、この限りでない。\n一　当該保険料を納付することを要しないものとすべき月の属する年の前年の所得が、その者の扶養親族等の有無及び数に応じて、政令で定める額以下であるとき。\n二　前条第一項第二号及び第三号に該当するとき。\n三　保険料を納付することが著しく困難である場合として天災その他の厚生労働省令で定める事由があるとき。\n３　次の各号のいずれかに該当する被保険者等から申請があつたときは、厚生労働大臣は、その指定する期間（前条第一項若しくは前二項の規定の適用を受ける期間又は学生等である期間若しくは学生等であつた期間を除く。）に係る保険料につき、既に納付されたものを除き、その四分の一を納付することを要しないものとし、申請のあつた日以後、\n当該保険料に係る期間を第五条第六項に規定する保険料四分の一免除期間（第九十四条第一項の規定により追納が行われた場合にあつては、当該追納に係る期間を除く。）に算入することができる。ただし、世帯主又は配偶者のいずれかが次の各号のいずれにも該当しないときは、この限りでない。\n一　当該保険料を納付することを要しないものとすべき月の属する年の前年の所得が、その者の扶養親族等の有無及び数に応じて、政令で定める額以下であるとき。\n二　前条第一項第二号及び第三号に該当するとき。\n三　保険料を納付することが著しく困難である場合として天災その他の厚生労働省令で定める事由があるとき。\n４　前条第三項の規定は、前三項の規定による処分を受けた被保険者から当該処分の取消しの申請があつたときに準用する。\n５　第一項第一号、第二項第一号及び第三項第一号に規定する所得の範囲及びその額の計算方法は、政令で定める。\n６　第一項から第三項までの規定により納付することを要しないものとされたその一部の額以外の残余の額に五円未満の端数が生じたときは、これを切り捨て、五円以上十円未満の端数が生じたときは、これを十円に切り上げるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十条の三", "—", "2026-10-01", "第九十条の三　次の各号のいずれかに該当する学生等である被保険者又は学生等であつた被保険者等から申請があつたときは、厚生労働大臣は、その指定する期間（学生等である期間又は学生等であつた期間に限る。）に係る保険料につき、既に納付されたものを除き、これを納付することを要しないものとし、申請のあつた日以後、\n当該保険料に係る期間を第五条第三項に規定する保険料全額免除期間（第九十四条第一項の規定により追納が行われた場合にあつては、当該追納に係る期間を除く。）に算入することができる。\n一　当該保険料を納付することを要しないものとすべき月の属する年の前年の所得が、その者の扶養親族等の有無及び数に応じて、政令で定める額以下であるとき。\n二　第九十条第一項第二号及び第三号に該当するとき。\n三　保険料を納付することが著しく困難である場合として天災その他の厚生労働省令で定める事由があるとき。\n２　第九十条第二項の規定は、前項の場合に準用する。\n３　第一項第一号に規定する所得の範囲及びその額の計算方法は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十一条", "（保険料の納期限）", "2026-10-01", "（保険料の納期限）\n第九十一条　毎月の保険料は、翌月末日までに納付しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十二条", "（保険料の通知及び納付）", "2026-10-01", "（保険料の通知及び納付）\n第九十二条　厚生労働大臣は、毎年度、被保険者に対し、各年度の各月に係る保険料について、保険料の額、納期限その他厚生労働省令で定める事項を通知するものとする。\n２　前項に定めるもののほか、保険料の納付方法について必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十二条の二", "（口座振替による納付）", "2026-10-01", "（口座振替による納付）\n第九十二条の二　厚生労働大臣は、被保険者から、預金又は貯金の払出しとその払い出した金銭による保険料の納付をその預金口座又は貯金口座のある金融機関に委託して行うこと（附則第五条第二項において「口座振替納付」という。）を希望する旨の申出があつた場合には、その納付が確実と認められ、かつ、その申出を承認することが保険料の徴収上有利と認められるときに限り、\nその申出を承認することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十二条の二の二", "（指定代理納付者による納付）", "2026-10-01", "（指定代理納付者による納付）\n第九十二条の二の二　被保険者は、厚生労働大臣に対し、被保険者の保険料を立て替えて納付する事務を適正かつ確実に実施することができると認められる者であつて、政令で定める要件に該当する者として厚生労働大臣が指定するもの（以下この条において「指定代理納付者」という。）から付与される番号、記号その他の符号を通知することにより、\n当該指定代理納付者をして当該被保険者の保険料を立て替えて納付させることを希望する旨の申出をすることができる。\n２　厚生労働大臣は、前項の申出を受けたときは、その納付が確実と認められ、かつ、その申出を承認することが保険料の徴収上有利と認められるときに限り、その申出を承認することができる。\n３　第一項の指定の手続その他指定代理納付者による納付に関し必要な事項は、厚生労働省令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十二条の三", "（保険料の納付委託）", "2026-10-01", "（保険料の納付委託）\n第九十二条の三　次に掲げる者は、被保険者（第一号に掲げる者にあつては、国民年金基金の加入員に限る。）の委託を受けて、保険料の納付に関する事務（以下「納付事務」という。）を行うことができる。\n一　国民年金基金又は国民年金基金連合会\n二　納付事務を適正かつ確実に実施することができると認められ、かつ、政令で定める要件に該当する者として厚生労働大臣が指定するもの\n２　国民年金基金又は国民年金基金連合会が前項の委託を受けて納付事務を行う場合には、第百四十五条第五号中「この章」とあるのは、「第九十二条の三第一項又はこの章」とするほか、この法律の規定の適用に関し必要な事項は、政令で定める。\n３　厚生労働大臣は、第一項第二号の規定による指定をしたときは、当該指定を受けた者の名称及び住所並びに事務所の所在地を公示しなければならない。\n４　第一項第二号の規定による指定を受けた者は、その名称及び住所並びに事務所の所在地を変更しようとするときは、あらかじめ、その旨を厚生労働大臣に届け出なければならない。\n５　厚生労働大臣は、前項の規定による届出があつたときは、当該届出に係る事項を公示しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十二条の四", "—", "2026-10-01", "第九十二条の四　被保険者が前条第一項の委託に基づき保険料を同項各号に掲げる者で納付事務を行うもの（以下「納付受託者」という。）に交付したときは、納付受託者は、政府に対して当該保険料の納付の責めに任ずるものとする。\n２　納付受託者は、前項の規定により被保険者から保険料の交付を受けたときは、遅滞なく、厚生労働省令で定めるところにより、その旨及び交付を受けた年月日を厚生労働大臣に報告しなければならない。\n３　被保険者が第一項の規定により保険料を納付受託者に交付したとき（前納に係る保険料にあつては、前納に係る期間の各月が経過したとき）は、当該保険料に係る被保険者期間は、第五条第一項の規定の適用については保険料納付済期間とみなす。\n４　被保険者が第一項の規定により、第九十条の二第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料を納付受託者に交付したとき（前納に係る保険料にあつては、前納に係る期間の各月が経過したとき）は、当該保険料に係る被保険者期間は、前項の規定にかかわらず、\n第五条第四項の規定の適用については保険料四分の三免除期間と、同条第五項の規定の適用については保険料半額免除期間と、同条第六項の規定の適用については保険料四分の一免除期間とみなす。\n５　被保険者が第一項の規定により保険料を納付受託者に交付したときは、第九十七条の規定の適用については、当該交付した日に当該保険料の納付があつたものとみなす。\n６　政府は、第一項の規定により納付受託者が納付すべき徴収金については、当該納付受託者に対して第九十六条第四項の規定による処分をしてもなお徴収すべき残余がある場合に限り、その残余の額を当該被保険者から徴収することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十二条の五", "—", "2026-10-01", "第九十二条の五　納付受託者は、厚生労働省令で定めるところにより、帳簿を備え付け、これに納付事務に関する事項を記載し、及びこれを保存しなければならない。\n２　厚生労働大臣は、この法律を施行するため必要があると認めるときは、その必要な限度で、厚生労働省令で定めるところにより、納付受託者に対し、報告をさせることができる。\n３　厚生労働大臣は、この法律を施行するため必要があると認めるときは、その必要な限度で、その職員に、納付受託者の事務所に立ち入り、納付受託者の帳簿、書類その他必要な物件を検査させ、又は関係者に質問させることができる。\n４　前項の規定により立入検査を行う職員は、その身分を示す証明書を携帯し、かつ、関係者の請求があるときは、これを提示しなければならない。\n５　第三項に規定する権限は、犯罪捜査のために認められたものと解釈してはならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十二条の六", "—", "2026-10-01", "第九十二条の六　厚生労働大臣は、第九十二条の三第一項第二号の規定による指定を受けた者が次の各号のいずれかに該当するときは、その指定を取り消すことができる。\n一　第九十二条の三第一項第二号に規定する指定の要件に該当しなくなつたとき。\n二　第九十二条の四第二項又は前条第二項の規定による報告をせず、又は虚偽の報告をしたとき。\n三　前条第一項の規定に違反して、帳簿を備え付けず、帳簿に記載せず、若しくは帳簿に虚偽の記載をし、又は帳簿を保存しなかつたとき。\n四　前条第三項の規定による立入り若しくは検査を拒み、妨げ、若しくは忌避し、又は同項の規定による質問に対して陳述をせず、若しくは虚偽の陳述をしたとき。\n２　厚生労働大臣は、前項の規定により指定を取り消したときは、その旨を公示しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十三条", "（保険料の前納）", "2026-10-01", "（保険料の前納）\n第九十三条　被保険者は、将来の一定期間の保険料を前納することができる。\n２　前項の場合において前納すべき額は、当該期間の各月の保険料の額から政令で定める額を控除した額とする。\n３　第一項の規定により前納された保険料について保険料納付済期間又は保険料四分の三免除期間、保険料半額免除期間若しくは保険料四分の一免除期間を計算する場合においては、前納に係る期間の各月が経過した際に、それぞれその月の保険料が納付されたものとみなす。\n４　前三項に定めるもののほか、保険料の前納手続、前納された保険料の還付その他保険料の前納について必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十四条", "（保険料の追納）", "2026-10-01", "（保険料の追納）\n第九十四条　被保険者又は被保険者であつた者（老齢基礎年金の受給権者を除く。）は、厚生労働大臣の承認を受け、第八十九条第一項、第九十条第一項又は第九十条の三第一項の規定により納付することを要しないものとされた保険料及び第九十条の二第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料（承認の日の属する月前十年以内の期\n間に係るものに限る。）の全部又は一部につき追納をすることができる。ただし、同条第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料については、その残余の額につき納付されたときに限る。\n２　前項の場合において、その一部につき追納をするときは、追納は、第九十条の三第一項の規定により納付することを要しないものとされた保険料につき行い、次いで第八十九条第一項若しくは第九十条第一項の規定により納付することを要しないものとされた保険料又は第九十条の二第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保\n険料につき行うものとし、これらの保険料のうちにあつては、先に経過した月の分から順次に行うものとする。ただし、第九十条の三第一項の規定により納付することを要しないものとされた保険料より前に納付義務が生じ、第八十九条第一項若しくは第九十条第一項の規定により納付することを要しないものとされた保険料又は第九十条の二第一項から第三項までの規定により\nその一部の額につき納付することを要しないものとされた保険料があるときは、当該保険料について、先に経過した月の分の保険料から追納をすることができるものとする。\n３　第一項の場合において追納すべき額は、当該追納に係る期間の各月の保険料の額に政令で定める額を加算した額とする。\n４　第一項の規定により追納が行われたときは、追納が行われた日に、追納に係る月の保険料が納付されたものとみなす。\n５　前各項に定めるもののほか、保険料の追納手続その他保険料の追納について必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十四条の二", "（基礎年金拠出金）", "2026-10-01", "（基礎年金拠出金）\n第九十四条の二　厚生年金保険の実施者たる政府は、毎年度、基礎年金の給付に要する費用に充てるため、基礎年金拠出金を負担する。\n２　実施機関たる共済組合等は、毎年度、基礎年金の給付に要する費用に充てるため、基礎年金拠出金を納付する。\n３　財政の現況及び見通しが作成されるときは、厚生労働大臣は、厚生年金保険の実施者たる政府が負担し、又は実施機関たる共済組合等が納付すべき基礎年金拠出金について、その将来にわたる予想額を算定するものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十四条の三", "—", "2026-10-01", "第九十四条の三　基礎年金拠出金の額は、保険料・拠出金算定対象額に当該年度における被保険者の総数に対する当該年度における当該政府及び実施機関に係る被保険者（厚生年金保険の実施者たる政府にあつては、第一号厚生年金被保険者である第二号被保険者及びその被扶養配偶者である第三号被保険者とし、実施機関たる共済組合等にあつては、\n当該実施機関たる共済組合等に係る被保険者（国家公務員共済組合連合会にあつては当該連合会を組織する共済組合に係る第二号厚生年金被保険者である第二号被保険者及びその被扶養配偶者である第三号被保険者とし、地方公務員共済組合連合会にあつては当該連合会を組織する共済組合に係る第三号厚生年金被保険者である第二号被保険者及びその被扶養配偶者である第三号\n被保険者とし、日本私立学校振興・共済事業団にあつては第四号厚生年金被保険者である第二号被保険者及びその被扶養配偶者である第三号被保険者とする。以下同じ。）とする。）の総数の比率に相当するものとして毎年度政令で定めるところにより算定した率を乗じて得た額とする。\n２　前項の場合において被保険者の総数並びに政府及び実施機関に係る被保険者の総数は、第一号被保険者、第二号被保険者及び第三号被保険者の適用の態様の均衡を考慮して、これらの被保険者のうち政令で定める者を基礎として計算するものとする。\n３　前二項に規定するもののほか、実施機関たる共済組合等に係る基礎年金拠出金の納付に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十四条の四", "—", "2026-10-01", "第九十四条の四　各地方公務員共済組合（指定都市職員共済組合、市町村職員共済組合及び都市職員共済組合にあつては、全国市町村職員共済組合連合会）は、毎年度、政令で定めるところにより、地方公務員共済組合連合会が納付すべき基礎年金拠出金の額のうち各地方公務員共済組合における厚生年金保険法第二十八条に規定する標準報酬（以下この条において「標準報酬」という。\n）の総額（全国市町村職員共済組合連合会にあつては、全ての指定都市職員共済組合、市町村職員共済組合及び都市職員共済組合における標準報酬の総額）を考慮して政令で定めるところにより算定した額を負担する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十四条の五", "（報告）", "2026-10-01", "（報告）\n第九十四条の五　厚生労働大臣は、実施機関たる共済組合等に対し、当該実施機関たる共済組合等を所管する大臣を経由して、当該実施機関たる共済組合等に係る被保険者の数その他の厚生労働省令で定める事項について報告を求めることができる。\n２　各実施機関たる共済組合等は、厚生労働省令の定めるところにより、当該実施機関たる共済組合等を所管する大臣を経由して前項の報告を行うものとする。\n３　実施機関たる共済組合等は、厚生労働省令の定めるところにより、当該実施機関たる共済組合等を所管する大臣を経由して、第九十四条の二第三項に規定する予想額の算定のために必要な事項として厚生労働省令で定める事項について厚生労働大臣に報告を行うものとする。\n４　厚生労働大臣は、厚生労働省令の定めるところにより、前項に規定する予想額その他これに関連する事項で厚生労働省令で定めるものについて、実施機関たる共済組合等を所管する大臣に報告を行うものとする。\n５　厚生労働大臣は、前各項に規定する厚生労働省令を定めるときは、実施機関たる共済組合等を所管する大臣に協議しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十四条の六", "（第二号被保険者及び第三号被保険者に係る特例）", "2026-10-01", "（第二号被保険者及び第三号被保険者に係る特例）\n第九十四条の六　第八十七条第一項及び第二項並びに第八十八条第一項の規定にかかわらず、第二号被保険者としての被保険者期間及び第三号被保険者としての被保険者期間については、政府は、保険料を徴収せず、被保険者は、保険料を納付することを要しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十五条", "（徴収）", "2026-10-01", "（徴収）\n第九十五条　保険料その他この法律（第十章を除く。以下この章から第八章までにおいて同じ。）の規定による徴収金は、この法律に別段の規定があるものを除くほか、国税徴収の例によつて徴収する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十五条の二", "（国民年金基金又は国民年金基金連合会の解散に伴う責任準備金相当額の徴収）", "2026-10-01", "（国民年金基金又は国民年金基金連合会の解散に伴う責任準備金相当額の徴収）\n第九十五条の二　政府は、国民年金基金又は国民年金基金連合会が解散したときは、その解散した日において当該国民年金基金又は国民年金基金連合会が年金の支給に関する義務を負つている者に係る政令の定めるところにより算出した責任準備金に相当する額を当該解散した国民年金基金又は国民年金基金連合会から徴収する。\nただし、第百三十七条の十九第一項の規定により国民年金基金連合会が当該解散した国民年金基金から徴収すべきときは、この限りでない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十六条", "（督促及び滞納処分）", "2026-10-01", "（督促及び滞納処分）\n第九十六条　保険料その他この法律の規定による徴収金を滞納する者があるときは、厚生労働大臣は、期限を指定して、これを督促することができる。\n２　前項の規定によつて督促をしようとするときは、厚生労働大臣は、納付義務者に対して、督促状を発する。\n３　前項の督促状により指定する期限は、督促状を発する日から起算して十日以上を経過した日でなければならない。\n４　厚生労働大臣は、第一項の規定による督促を受けた者がその指定の期限までに保険料その他この法律の規定による徴収金を納付しないときは、国税滞納処分の例によつてこれを処分し、又は滞納者の居住地若しくはその者の財産所在地の市町村に対して、その処分を請求することができる。\n５　市町村は、前項の規定による処分の請求を受けたときは、市町村税の例によつてこれを処分することができる。この場合においては、厚生労働大臣は、徴収金の百分の四に相当する額を当該市町村に交付しなければならない。\n６　前二項の規定による処分によつて受け入れた金額を保険料に充当する場合においては、さきに経過した月の保険料から順次これに充当し、一箇月の保険料の額に満たない端数は、納付義務者に交付するものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十七条", "（延滞金）", "2026-10-01", "（延滞金）\n第九十七条　前条第一項の規定によつて督促をしたときは、厚生労働大臣は、徴収金額に、納期限の翌日から徴収金完納又は財産差押の日の前日までの期間の日数に応じ、年十四・六パーセント（当該督促が保険料に係るものであるときは、当該納期限の翌日から三月を経過する日までの期間については、年七・三パーセント）の割合を乗じて計算した延滞金を徴収する。\nただし、徴収金額が五百円未満であるとき、又は滞納につきやむを得ない事情があると認められるときは、この限りでない。\n２　前項の場合において、徴収金額の一部につき納付があつたときは、その納付の日以後の期間に係る延滞金の計算の基礎となる徴収金は、その納付のあつた徴収金額を控除した金額による。\n３　延滞金を計算するに当り、徴収金額に五百円未満の端数があるときは、その端数は、切り捨てる。\n４　督促状に指定した期限までに徴収金を完納したとき、又は前三項の規定によつて計算した金額が五十円未満であるときは、延滞金は、徴収しない。\n５　延滞金の金額に五十円未満の端数があるときは、その端数は、切り捨てる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十八条", "（先取特権）", "2026-10-01", "（先取特権）\n第九十八条　保険料その他この法律の規定による徴収金の先取特権の順位は、国税及び地方税に次ぐものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第九十九条及び第百条", "—", "2026-10-01", "第九十九条及び第百条　削除", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百一条", "（不服申立て）", "2026-10-01", "（不服申立て）\n第百一条　被保険者の資格に関する処分、給付に関する処分（共済組合等が行つた障害基礎年金に係る障害の程度の診査に関する処分を除く。）又は保険料その他この法律の規定による徴収金に関する処分に不服がある者は、社会保険審査官に対して審査請求をし、その決定に不服がある者は、社会保険審査会に対して再審査請求をすることができる。\nただし、第十四条の四第一項又は第二項の規定による決定については、この限りでない。\n２　審査請求をした日から二月以内に決定がないときは、審査請求人は、社会保険審査官が審査請求を棄却したものとみなすことができる。\n３　第一項の審査請求及び再審査請求は、時効の完成猶予及び更新に関しては、裁判上の請求とみなす。\n４　被保険者の資格に関する処分が確定したときは、その処分についての不服を当該処分に基づく給付に関する処分の不服の理由とすることができない。\n５　第一項の審査請求及び再審査請求については、行政不服審査法（平成二十六年法律第六十八号）第二章（第二十二条を除く。）及び第四章の規定は、適用しない。\n６　共済組合等が行つた障害基礎年金に係る障害の程度の診査に関する処分に不服がある者は、当該共済組合等に係る共済各法（国家公務員共済組合法（昭和三十三年法律第百二十八号）、地方公務員等共済組合法（昭和三十七年法律第百五十二号）及び私立学校教職員共済法をいう。以下この項において同じ。\n）の定めるところにより、当該共済各法に定める審査機関に審査請求をすることができる。\n７　前項の規定による共済組合等が行つた障害の程度の診査に関する処分が確定したときは、その処分についての不服を当該処分に基づく障害基礎年金に関する処分についての不服の理由とすることができない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百一条の二", "（審査請求と訴訟との関係）", "2026-10-01", "（審査請求と訴訟との関係）\n第百一条の二　前条第一項に規定する処分（被保険者の資格に関する処分又は給付に関する処分（共済組合等が行つた障害基礎年金に係る障害の程度の診査に関する処分を除く。）に限る。）の取消しの訴えは、当該処分についての審査請求に対する社会保険審査官の決定を経た後でなければ、提起することができない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二条", "（時効）", "2026-10-01", "（時効）\n第百二条　年金給付を受ける権利は、その支給すべき事由が生じた日から五年を経過したとき、当該権利に基づき支払期月ごとに支払うものとされる年金給付の支給を受ける権利は、当該日の属する月の翌月以後に到来する当該年金給付の支給に係る第十八条第三項本文に規定する支払期月の翌月の初日から五年を経過したときは、時効によつて、消滅する。\n２　前項に規定する年金給付を受ける権利の時効は、当該年金給付がその全額につき支給を停止されている間は、進行しない。\n３　第一項に規定する年金給付を受ける権利又は当該権利に基づき支払期月ごとに支払うものとされる年金給付の支給を受ける権利については、会計法（昭和二十二年法律第三十五号）第三十一条の規定を適用しない。\n４　保険料その他この法律の規定による徴収金を徴収し、又はその還付を受ける権利及び死亡一時金を受ける権利は、これらを行使することができる時から二年を経過したときは、時効によつて消滅する。\n５　保険料その他この法律の規定による徴収金についての第九十六条第一項の規定による督促は、時効の更新の効力を有する。\n６　保険料その他この法律の規定による徴収金については、会計法第三十二条の規定を適用しない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百三条", "（期間の計算）", "2026-10-01", "（期間の計算）\n第百三条　この法律又はこの法律に基づく命令に規定する期間の計算については、この法律に別段の規定がある場合を除くほか、民法の期間に関する規定を準用する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百四条", "（戸籍事項の無料証明）", "2026-10-01", "（戸籍事項の無料証明）\n第百四条　市町村長（地方自治法第二百五十二条の十九第一項の指定都市においては、区長又は総合区長とする。）は、厚生労働大臣又は被保険者、被保険者であつた者若しくは受給権者に対して、当該市町村の条例の定めるところにより、被保険者、被保険者であつた者若しくは受給権者又は遺族基礎年金の支給若しくは障害基礎年金若しくは遺族基礎年金の額の加算の要件に該当する子\nの戸籍に関し、無料で証明を行うことができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百五条", "（届出等）", "2026-10-01", "（届出等）\n第百五条　被保険者は、厚生労働省令の定めるところにより、第十二条第一項又は第五項に規定する事項を除くほか、厚生労働省令の定める事項を第三号被保険者以外の被保険者にあつては市町村長に、第三号被保険者にあつては厚生労働大臣に届け出なければならない。\n２　第十二条第二項及び第四項の規定は、第三号被保険者以外の被保険者に係る前項の届出について、同条第六項から第九項までの規定は、第三号被保険者に係る前項の届出について準用する。\n３　受給権者又は受給権者の属する世帯の世帯主その他その世帯に属する者は、厚生労働省令の定めるところにより、厚生労働大臣に対し、厚生労働省令の定める事項を届け出、かつ、厚生労働省令の定める書類その他の物件を提出しなければならない。\n４　被保険者又は受給権者が死亡したときは、戸籍法（昭和二十二年法律第二百二十四号）の規定による死亡の届出義務者は、厚生労働省令の定めるところにより、その旨を第三号被保険者以外の被保険者に係るものにあつては市町村長に、第三号被保険者又は受給権者に係るものにあつては厚生労働大臣に届け出なければならない。\nただし、厚生労働省令で定める被保険者又は受給権者の死亡について、同法の規定による死亡の届出をした場合（厚生労働省令で定める場合に限る。）は、この限りでない。\n５　第十二条第六項から第九項までの規定は、第三号被保険者に係る前項の届出について準用する。この場合において、同条第六項中「第三号被保険者」とあるのは、「第三号被保険者の死亡に係るもの」と読み替えるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百六条", "（被保険者に関する調査）", "2026-10-01", "（被保険者に関する調査）\n第百六条　厚生労働大臣は、必要があると認めるときは、被保険者の資格又は保険料に関する処分に関し、被保険者に対し、出産予定日に関する書類、子の養育の状況に関する書類、被保険者若しくは被保険者の配偶者若しくは世帯主若しくはこれらの者であつた者の資産若しくは収入の状況に関する書類その他の物件の提出を命じ、\n又は当該職員をして被保険者に質問させることができる。\n２　前項の規定によつて質問を行う当該職員は、その身分を示す証票を携帯し、かつ、関係人の請求があるときは、これを提示しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百七条", "（受給権者に関する調査）", "2026-10-01", "（受給権者に関する調査）\n第百七条　厚生労働大臣は、必要があると認めるときは、受給権者に対して、その者の身分関係、障害の状態その他受給権の消滅、年金額の改定若しくは支給の停止に係る事項に関する書類その他の物件を提出すべきことを命じ、又は当該職員をしてこれらの事項に関し受給権者に質問させることができる。\n２　厚生労働大臣は、必要があると認めるときは、障害基礎年金の受給権者若しくは障害等級に該当する障害の状態にあることによりその額が加算されている子又は障害等級に該当する障害の状態にあることにより遺族基礎年金の受給権を有し、若しくは遺族基礎年金が支給され、若しくはその額が加算されている子に対して、\nその指定する医師若しくは歯科医師の診断を受けるべきことを命じ、又は当該職員をしてこれらの者の障害の状態を診断させることができる。\n３　前条第二項の規定は、前二項の規定による質問又は診断について準用する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百八条", "（資料の提供等）", "2026-10-01", "（資料の提供等）\n第百八条　厚生労働大臣は、被保険者の資格又は保険料に関し必要があると認めるときは、被保険者若しくは被保険者であつた者（以下この項において「被保険者等」という。）、国民年金基金の加入員若しくは加入員であつた者、農業者年金の被保険者若しくは被保険者であつた者、国家公務員共済組合法若しくは地方公務員等共済組合法の短期給付に関する規定の適用を受ける組合員若\nしくは組合員であつた者、私立学校教職員共済法の短期給付に関する規定の適用を受ける加入者若しくは加入者であつた者又は健康保険若しくは国民健康保険の被保険者若しくは被保険者であつた者の氏名及び住所、個人番号（行政手続における特定の個人を識別するための番号の利用等に関する法律（平成二十五年法律第二十七号）第二条第五項に規定する個人番号をいう。\n次項において同じ。）、資格の取得及び喪失の年月日、保険料若しくは掛金の納付状況その他の事項につき、官公署、第百九条第二項に規定する国民年金事務組合、国民年金基金、国民年金基金連合会、独立行政法人農業者年金基金、共済組合等、健康保険組合若しくは国民健康保険組合に対し必要な書類の閲覧若しくは資料の提供を求め、又は銀行、\n信託会社その他の機関若しくは被保険者等の配偶者若しくは世帯主その他の関係人に報告を求めることができる。\n２　厚生労働大臣は、年金給付又は保険料に関する処分に関し必要があると認めるときは、受給権者、被保険者若しくは被保険者の配偶者若しくは世帯主の資産若しくは収入の状況、受給権者に対する厚生年金保険法による年金たる保険給付の支給状況若しくは第三十六条の二第一項第一号に規定する政令で定める給付の支給状況、\n被保険者の出産予定日若しくは子の養育の状況又は第八十九条第一項第一号に規定する政令で定める給付の受給権者若しくは受給権者であつた者、同項第二号に規定する厚生労働省令で定める援助（厚生労働省令で定める援助を除く。）を受けている者若しくは受けていた者、同項第三号に規定する厚生労働省令で定める施設（厚生労働省令で定める施設を除く。\n）に入所している者若しくは入所していた者、第九十条第一項第二号に規定する厚生労働省令で定める援助を受けている者若しくは介護保険法（平成九年法律第百二十三号）第七条第六項第一号及び第四号から第六号までに掲げる法律の規定による被扶養者の氏名及び住所、個人番号その他の事項につき、官公署、共済組合等、\n厚生年金保険法附則第二十八条に規定する共済組合若しくは健康保険組合に対し必要な書類の閲覧若しくは資料の提供を求め、又は銀行、信託会社その他の機関若しくは被保険者の雇用主その他の関係人に報告を求めることができる。\n３　厚生労働大臣は、被保険者の資格又は保険料に関し必要があると認めるときは、事業主に対し、その使用する者に対するこの法律の規定の周知その他の必要な協力を求めることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百八条の二", "—", "2026-10-01", "第百八条の二　厚生労働大臣は、必要があると認めるときは、実施機関たる共済組合等を所管する大臣に対し、その大臣が所管する実施機関たる共済組合等に係る第九十四条の五第一項に規定する報告に関し監督上必要な命令を発し、又は当該職員に当該実施機関たる共済組合等の業務の状況を監査させることを求めることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百八条の二の二", "—", "2026-10-01", "第百八条の二の二　実施機関たる共済組合等は、厚生労働大臣に対し、その被保険者が第二号被保険者でなくなつたことに関して必要な情報の提供を行うものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百八条の三", "（統計調査）", "2026-10-01", "（統計調査）\n第百八条の三　厚生労働大臣は、第一条の目的を達成するため、被保険者若しくは被保険者であつた者又は受給権者に係る保険料の納付に関する実態その他の厚生労働省令で定める事項に関し必要な統計調査を行うものとする。\n２　厚生労働大臣は、前項に規定する統計調査に関し必要があると認めるときは、官公署に対し、必要な情報の提供を求めることができる。\n３　前項の規定により情報の提供を求めるに当たつては、被調査者を識別することができない方法による情報の提供を求めるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百八条の四", "（基礎年金番号の利用制限等）", "2026-10-01", "（基礎年金番号の利用制限等）\n第百八条の四　第十四条に規定する基礎年金番号については、住民基本台帳法第三十条の三十七第一項及び第二項、第三十条の三十八並びに第三十条の三十九の規定を準用する。この場合において、同法第三十条の三十七第二項中「都道府県知事」とあるのは「厚生労働大臣及び日本年金機構」と、\n同法第三十条の三十八第一項から第三項までの規定中「何人も」とあるのは「国民年金法第十四条に規定する政府管掌年金事業の運営に関する事務又は当該事業に関連する事務の遂行のため同条に規定する基礎年金番号の利用が特に必要な場合として厚生労働省令で定める場合を除き、何人も」と、\n同条第四項及び第五項並びに同法第三十条の三十九第一項中「都道府県知事」とあるのは「厚生労働大臣」と読み替えるものとするほか、必要な技術的読替えは、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百八条の五", "—", "2026-10-01", "第百八条の五　全国健康保険協会、第三条第二項に規定する共済組合等その他の厚生労働省令で定める者は、第十四条に規定する政府管掌年金事業の運営に関する事務又は当該事業に関連する事務（当該厚生労働省令で定める者のうち厚生労働省令で定める者にあつては、同条に規定する政府管掌年金事業に関連する事務）の遂行のため必要がある場合を除き、何人に対しても、\nその者又はその者以外の者に係る基礎年金番号を告知することを求めてはならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条", "（国民年金事務組合）", "2026-10-01", "（国民年金事務組合）\n第百九条　同種の事業又は業務に従事する被保険者を構成員とする団体その他被保険者を構成員とするこれに類する団体で政令で定めるものは、当該構成員である被保険者の委託を受けて、当該被保険者に係る第十二条第一項の届出をすることができる。\n２　前項に規定する団体（以下「国民年金事務組合」という。）は、同項に規定する委託を受けようとするときは、厚生労働大臣の認可を受けなければならない。\n３　厚生労働大臣は、前項の認可を受けた国民年金事務組合がその行うべき事務の処理を怠り、又はその処理が著しく不当であると認めるときは、同項の認可を取り消すことができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の二", "（全額免除申請の事務手続に関する特例）", "2026-10-01", "（全額免除申請の事務手続に関する特例）\n第百九条の二　第九十条第一項の申請（以下この条において「全額免除申請」という。）に関する事務を適正かつ確実に実施することができると認められる者であつて、厚生労働大臣が当該者からの申請に基づき指定するもの（以下この条において「指定全額免除申請事務取扱者」という。）は、\n同項各号のいずれかに該当する被保険者又は被保険者であつた者（厚生労働省令で定める者に限る。以下この条において「全額免除要件該当被保険者等」という。）の委託を受けて、全額免除要件該当被保険者等に係る全額免除申請をすることができる。\n２　全額免除要件該当被保険者等が指定全額免除申請事務取扱者に全額免除申請の委託をしたときは、第九十条第一項及び第二項の規定の適用については、当該委託をした日に、全額免除申請があつたものとみなす。\n３　指定全額免除申請事務取扱者は、全額免除要件該当被保険者等から全額免除申請の委託を受けたときは、遅滞なく、厚生労働省令で定めるところにより、当該全額免除申請をしなければならない。\n４　厚生労働大臣は、指定全額免除申請事務取扱者が第一項の事務を適正かつ確実に実施するために必要な限度において、全額免除要件該当被保険者等が第九十条第一項各号のいずれかに該当することの事実に関する情報を提供することができる。\n５　厚生労働大臣は、指定全額免除申請事務取扱者がその行うべき事務の処理を怠り、又はその処理が著しく不当であると認めるときは、指定全額免除申請事務取扱者に対し、その改善に必要な措置を採るべきことを命ずることができる。\n６　厚生労働大臣は、指定全額免除申請事務取扱者が前項の規定による命令に違反したときは、第一項の指定を取り消すことができる。\n７　指定全額免除申請事務取扱者（その者が法人である場合にあつては、その役員）若しくはその職員又はこれらの者であつた者は、正当な理由なく、第一項の事務に関して知り得た秘密を漏らしてはならない。\n８　第一項の指定の手続その他前各項の規定の実施に関し必要な事項は、厚生労働省令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の二の二", "（学生納付特例の事務手続に関する特例）", "2026-10-01", "（学生納付特例の事務手続に関する特例）\n第百九条の二の二　国及び地方公共団体並びに国立大学法人法（平成十五年法律第百十二号）第二条第一項に規定する国立大学法人、地方独立行政法人法（平成十五年法律第百十八号）第六十八条第一項に規定する公立大学法人及び私立学校法（昭和二十四年法律第二百七十号）第三条に規定する学校法人その他の政令で定める法人であつて、厚生労働大臣がこれらの法人からの申請に基づき、\n第九十条の三第一項の申請（以下この条において「学生納付特例申請」という。）に関する事務を適正かつ確実に実施することができると認められるものとして指定するもの（以下この条において「学生納付特例事務法人」という。）は、その設置する学校教育法第八十三条に規定する大学その他の政令で定める教育施設において当該教育施設の学生等である被保険者（以下この\n条において「学生等被保険者」という。）の委託を受けて、学生等被保険者に係る学生納付特例申請をすることができる。\n２　学生等被保険者が学生納付特例事務法人に学生納付特例申請の委託をしたときは、第九十条の三第一項の規定及び同条第二項において準用する第九十条第二項の規定の適用については、当該委託をした日に、学生納付特例申請があつたものとみなす。\n３　学生納付特例事務法人は、学生等被保険者から学生納付特例申請の委託を受けたときは、遅滞なく、厚生労働省令で定めるところにより、当該学生納付特例申請をしなければならない。\n４　厚生労働大臣は、学生納付特例事務法人がその行うべき事務の処理を怠り、又はその処理が著しく不当であると認めるときは、学生納付特例事務法人に対し、その改善に必要な措置を採るべきことを命ずることができる。\n５　厚生労働大臣は、学生納付特例事務法人が前項の規定による命令に違反したときは、第一項の指定を取り消すことができる。\n６　第一項の指定の手続その他前各項の規定の実施に関し必要な事項は、厚生労働省令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の三", "（保険料納付確認団体）", "2026-10-01", "（保険料納付確認団体）\n第百九条の三　同種の事業又は業務に従事する被保険者を構成員とする団体その他これに類する団体で政令で定めるものであつて、厚生労働大臣がこれらの団体からの申請に基づき、次項の業務を適正かつ確実に行うことができると認められるものとして指定するもの（以下この条において「保険料納付確認団体」という。）は、同項の業務を行うことができる。\n２　保険料納付確認団体は、当該団体の構成員その他これに類する者である被保険者からの委託により、当該被保険者に係る保険料が納期限までに納付されていない事実（次項において「保険料滞納事実」という。）の有無について確認し、その結果を当該被保険者に通知する業務を行うものとする。\n３　厚生労働大臣は、保険料納付確認団体の求めに応じ、保険料納付確認団体が前項の業務を適正に行うために必要な限度において、保険料滞納事実に関する情報を提供することができる。\n４　厚生労働大臣は、保険料納付確認団体がその行うべき業務の処理を怠り、又はその処理が著しく不当であると認めるときは、保険料納付確認団体に対し、その改善に必要な措置を採るべきことを命ずることができる。\n５　厚生労働大臣は、保険料納付確認団体が前項の規定による命令に違反したときは、第一項の指定を取り消すことができる。\n６　保険料納付確認団体の役員若しくは職員又はこれらの職にあつた者は、正当な理由なく、第二項の業務に関して知り得た秘密を漏らしてはならない。\n７　第一項の指定の手続その他保険料納付確認団体に関し必要な事項は、厚生労働省令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の四", "（機構への厚生労働大臣の権限に係る事務の委任）", "2026-10-01", "（機構への厚生労働大臣の権限に係る事務の委任）\n第百九条の四　次に掲げる厚生労働大臣の権限に係る事務（第三条第二項の規定により共済組合等が行うこととされたもの及び同条第三項の規定により市町村長が行うこととされたものを除く。）は、機構に行わせるものとする。ただし、第二十一号、第二十六号、第二十八号から第三十号まで、第三十一号、第三十二号及び第三十五号に掲げる権限は、\n厚生労働大臣が自ら行うことを妨げない。\n一　第七条第二項の規定による認定並びに附則第五条第一項及び第二項の規定による申出の受理\n二　削除\n三　第十二条第四項（第百五条第二項において準用する場合を含む。）の規定による報告の受理及び第十二条第五項の規定による届出の受理\n三の二　第十二条の二第一項の規定による届出の受理\n四　第十四条の二第一項（同条第二項において準用する場合を含む。）の規定による請求の受理\n五　第十六条（附則第九条の三の二第七項において準用する場合を含む。）の規定による請求の受理\n六　第二十条第二項の規定による申請の受理\n七　第二十条の二第一項の規定による申出の受理\n八　第二十八条第一項（附則第九条の三第四項において準用する場合を含む。）の規定による申出の受理並びに附則第九条の二第一項（附則第九条の三第四項において準用する場合を含む。）及び第九条の二の二第一項の規定による請求の受理\n九　第三十条の二第一項及び第三十条の四第二項の規定による請求の受理\n十　第三十三条の二第四項の規定による認定\n十一　第三十四条第二項及び第四項の規定による請求の受理\n十二　第三十七条の二第三項（第四十九条第二項において準用する場合を含む。）の規定による認定\n十三　第四十一条の二並びに第四十二条第一項及び第二項の規定による申請の受理\n十四　第四十六条第一項の規定による申出の受理\n十五　第八十七条の二第一項及び第三項の規定による申出の受理\n十五の二　第八十九条第二項の規定による申出の受理\n十六　第九十条第一項、第九十条の二第一項から第三項まで及び第九十条の三第一項の規定による申請（第百九条の二第一項の規定による被保険者又は被保険者であつた者の委託に係る申請及び第百九条の二の二第一項の規定による被保険者の委託に係る申請を含む。）の受理及び処分（これらの規定による指定を除く。\n）並びに第九十条第三項（第九十条の二第四項において準用する場合を含む。）の規定による申請の受理及び処分の取消し\n十七　第九十二条の二の規定による申出の受理及び承認\n十八　第九十二条の二の二第一項の規定による申出の受理及び同条第二項の規定による承認\n十九　第九十二条の三第四項の規定による届出の受理\n二十　第九十二条の四第二項の規定による報告の受理\n二十一　第九十二条の五第二項の規定による報告徴収及び同条第三項の規定による立入検査\n二十二　第九十四条第一項の規定による承認\n二十三　第九十五条の規定により国税徴収の例によるものとされる徴収に係る権限（国税通則法（昭和三十七年法律第六十六号）第四十二条において準用する民法第四百二十三条第一項の規定の例による納付義務者に属する権利の行使、国税通則法第四十六条の規定の例による納付の猶予その他の厚生労働省令で定める権限並びに次号に掲げる質問、検査及び提示又は提出の要求、\n物件の留置き並びに捜索を除く。）\n二十四　第九十五条の規定によりその例によるものとされる国税徴収法（昭和三十四年法律第百四十七号）第百四十一条の規定による質問、検査及び提示又は提出の要求、同法第百四十一条の二の規定による物件の留置き並びに同法第百四十二条の規定による捜索\n二十五　第九十六条第四項の規定による国税滞納処分の例による処分及び同項の規定による市町村に対する処分の請求\n二十六　第百四条の規定による戸籍事項に関する証明書の受領\n二十七　第百五条第一項、第三項及び第四項（附則第九条の三の二第七項において準用する場合を含む。）の規定による届出の受理並びに第百五条第三項の規定による書類その他の物件の受領\n二十八　第百六条第一項の規定による命令及び質問\n二十九　第百七条第一項（附則第九条の三の二第七項において準用する場合を含む。）の規定による命令及び質問並びに第百七条第二項の規定による命令及び診断\n三十　第百八条第一項及び第二項の規定による書類の閲覧及び資料の提供の求め、同項の規定による報告の求め並びに同条第三項の規定による協力の求め並びに附則第八条の規定による資料の提供の求め（第二十六号に掲げる証明書の受領を除く。）\n三十の二　第百八条の二の二の規定による情報の受領\n三十一　第百八条の三第二項の規定による情報の提供の求め\n三十二　第百八条の四において読み替えて準用する住民基本台帳法第三十条の三十九第一項の規定による報告の求め及び立入検査\n三十三　第百九条の二第一項の規定による指定の申請の受理\n三十三の二　第百九条の二の二第一項の規定による指定の申請の受理\n三十四　前条第一項の規定による申請の受理\n三十五　次条第二項の規定による報告の受理\n三十五の二　附則第五条第四項の規定による申出の受理\n三十六　附則第七条の三第二項の規定による届出の受理\n三十七　附則第九条の三の二第一項の規定による請求の受理\n三十七の二　附則第九条の四の二第一項の規定による届出の受理\n三十七の三　附則第九条の四の三第一項の規定による承認\n三十七の四　附則第九条の四の七第一項、第九条の四の九第一項、第九条の四の十第一項及び第九条の四の十一第一項の規定による申出の受理並びに附則第九条の四の七第二項、第九条の四の九第二項、第九条の四の十第二項及び第九条の四の十一第二項の規定による承認\n三十八　前各号に掲げるもののほか、厚生労働省令で定める権限\n２　機構は、前項第二十四号に掲げる権限及び同項第二十五号に掲げる国税滞納処分の例による処分（以下「滞納処分等」という。）その他同項各号に掲げる権限のうち厚生労働省令で定める権限に係る事務を効果的に行うため必要があると認めるときは、厚生労働省令で定めるところにより、厚生労働大臣に当該権限の行使に必要な情報を提供するとともに、\n厚生労働大臣自らその権限を行うよう求めることができる。\n３　厚生労働大臣は、前項の規定による求めがあつた場合において必要があると認めるとき、又は機構が天災その他の事由により第一項各号に掲げる権限に係る事務の全部若しくは一部を行うことが困難若しくは不適当となつたと認めるときは、同項各号に掲げる権限の全部又は一部を自ら行うものとする。\n４　厚生労働大臣は、前項の規定により第一項各号に掲げる権限の全部若しくは一部を自ら行うこととし、又は前項の規定により自ら行つている第一項各号に掲げる権限の全部若しくは一部を行わないこととするとき（次項に規定する場合を除く。）は、あらかじめ、その旨を公示しなければならない。\n５　厚生労働大臣は、第三項の規定により自ら行うこととした滞納処分等について、機構から引き継いだ当該滞納処分等の対象となる者が特定されている場合には、当該者に対し、厚生労働大臣が当該者に係る滞納処分等を行うこととなる旨その他の厚生労働省令で定める事項を通知しなければならない。\n６　厚生労働大臣が、第三項の規定により第一項各号に掲げる権限の全部若しくは一部を自ら行うこととし、又は第三項の規定により自ら行つている第一項各号に掲げる権限の全部若しくは一部を行わないこととする場合における同項各号に掲げる権限に係る事務の引継ぎその他の必要な事項は、厚生労働省令で定める。\n７　前各項に定めるもののほか、機構による第一項各号に掲げる権限に係る事務の実施又は厚生労働大臣による同項各号に掲げる権限の行使に関し必要な事項は、厚生労働省令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の五", "（財務大臣への権限の委任）", "2026-10-01", "（財務大臣への権限の委任）\n第百九条の五　厚生労働大臣は、前条第三項の規定により滞納処分等及び同条第一項第二十三号に掲げる権限の全部又は一部を自らが行うこととした場合におけるこれらの権限並びに同号に規定する厚生労働省令で定める権限のうち厚生労働省令で定めるもの（以下この条において「滞納処分等その他の処分」という。\n）に係る納付義務者が滞納処分等その他の処分の執行を免れる目的でその財産について隠ぺいしているおそれがあることその他の政令で定める事情があるため保険料その他この法律の規定による徴収金の効果的な徴収を行う上で必要があると認めるときは、政令で定めるところにより、財務大臣に、当該納付義務者に関する情報その他必要な情報を提供するとともに、\n当該納付義務者に係る滞納処分等その他の処分の権限の全部又は一部を委任することができる。\n２　財務大臣は、前項の委任に基づき、滞納処分等その他の処分の権限の全部又は一部を行つたときは、厚生労働省令で定めるところにより、滞納処分等その他の処分の執行の状況及びその結果を厚生労働大臣に報告するものとする。\n３　前条第五項の規定は、第一項の委任に基づき、財務大臣が滞納処分等その他の処分の権限の全部又は一部を行う場合の財務大臣による通知について準用する。この場合において、必要な技術的読替えその他滞納処分等その他の処分の対象となる者に対する通知に関し必要な事項は、厚生労働省令で定める。\n４　財務大臣が、第一項の委任に基づき、滞納処分等その他の処分の権限の全部若しくは一部を行うこととし、又は同項の委任に基づき行つている滞納処分等その他の処分の権限の全部若しくは一部を行わないこととする場合における滞納処分等その他の処分の権限に係る事務の引継ぎその他の必要な事項は、厚生労働省令で定める。\n５　財務大臣は、第一項の規定により委任された権限、第二項の規定による権限及び第三項において準用する前条第五項の規定による権限を国税庁長官に委任する。\n６　国税庁長官は、政令で定めるところにより、前項の規定により委任された権限の全部又は一部を納付義務者の居住地を管轄する国税局長に委任することができる。\n７　国税局長は、政令で定めるところにより、前項の規定により委任された権限の全部又は一部を納付義務者の居住地を管轄する税務署長に委任することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の六", "（機構が行う滞納処分等に係る認可等）", "2026-10-01", "（機構が行う滞納処分等に係る認可等）\n第百九条の六　機構は、滞納処分等を行う場合には、あらかじめ、厚生労働大臣の認可を受けるとともに、次条第一項に規定する滞納処分等実施規程に従い、徴収職員に行わせなければならない。\n２　前項の徴収職員は、滞納処分等に係る法令に関する知識並びに実務に必要な知識及び能力を有する機構の職員のうちから、厚生労働大臣の認可を受けて、機構の理事長が任命する。\n３　機構は、滞納処分等をしたときは、厚生労働省令で定めるところにより、速やかに、その結果を厚生労働大臣に報告しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の七", "（滞納処分等実施規程の認可等）", "2026-10-01", "（滞納処分等実施規程の認可等）\n第百九条の七　機構は、滞納処分等の実施に関する規程（以下この条において「滞納処分等実施規程」という。）を定め、厚生労働大臣の認可を受けなければならない。これを変更しようとするときも、同様とする。\n２　滞納処分等実施規程には、差押えを行う時期、差押えに係る財産の選定方法その他の滞納処分等の公正かつ確実な実施を確保するために必要なものとして厚生労働省令で定める事項を記載しなければならない。\n３　厚生労働大臣は、第一項の認可をした滞納処分等実施規程が滞納処分等の公正かつ確実な実施上不適当となつたと認めるときは、機構に対し、その滞納処分等実施規程を変更すべきことを命ずることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の八", "（機構が行う立入検査等に係る認可等）", "2026-10-01", "（機構が行う立入検査等に係る認可等）\n第百九条の八　機構は、第百九条の四第一項第二十一号、第二十八号、第二十九号又は第三十二号に掲げる権限に係る事務を行う場合には、あらかじめ、厚生労働大臣の認可を受けなければならない。\n２　機構が第百九条の四第一項第二十一号、第二十八号、第二十九号又は第三十二号に掲げる権限に係る事務を行う場合における第七十二条各号、第百六条並びに第百七条第一項及び第二項の規定の適用については、これらの規定中「当該職員」とあるのは、「機構の職員」とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の九", "（地方厚生局長等への権限の委任）", "2026-10-01", "（地方厚生局長等への権限の委任）\n第百九条の九　この法律に規定する厚生労働大臣の権限（第百九条の五第一項及び第二項並びに第十章に規定する厚生労働大臣の権限を除く。）は、厚生労働省令（第十四条の四に規定する厚生労働大臣の権限にあつては、政令）で定めるところにより、地方厚生局長に委任することができる。\n２　前項の規定により地方厚生局長に委任された権限は、厚生労働省令（第十四条の四に規定する厚生労働大臣の権限にあつては、政令）で定めるところにより、地方厚生支局長に委任することができる。\n３　第一項の規定により第十四条の四に規定する厚生労働大臣の権限が地方厚生局長に委任された場合（前項の規定により同条に規定する厚生労働大臣の権限が地方厚生支局長に委任された場合を含む。）には、同条第三項中「社会保障審議会」とあるのは、「地方厚生局に置かれる政令で定める審議会」とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の十", "（機構への事務の委託）", "2026-10-01", "（機構への事務の委託）\n第百九条の十　厚生労働大臣は、機構に、次に掲げる事務（第三条第二項の規定により共済組合等が行うこととされたもの及び同条第三項の規定により市町村長が行うこととされたものを除く。）を行わせるものとする。\n一　第十四条の規定による記録に係る事務（当該記録を除く。）\n二　第十四条の五の規定による情報の通知に係る事務（当該通知を除く。）\n三　第十六条（附則第九条の三の二第七項において準用する場合を含む。）の規定による裁定に係る事務（第百九条の四第一項第五号に掲げる請求の受理及び当該裁定を除く。）\n四　第十九条第一項（附則第九条の三の二第七項において準用する場合を含む。）及び第三項の規定による請求の内容の確認に係る事務\n五　第二十条第一項及び第二項の規定による年金給付の支給の停止に係る事務（第百九条の四第一項第六号に掲げる申請の受理及び当該支給の停止に係る決定を除く。）\n六　第二十条の二第一項及び第二項の規定による年金給付の支給の停止に係る事務（第百九条の四第一項第七号に掲げる申出の受理及び当該支給の停止に係る決定を除く。）\n七　第二十三条（附則第九条の三の二第七項において準用する場合を含む。）の規定による不正利得の徴収に係る事務（第百九条の四第一項第二十三号から第二十五号までに掲げる権限を行使する事務及び次条第一項の規定により機構が行う収納、第九十六条第一項の規定による督促その他の厚生労働省令で定める権限を行使する事務並びに第三十一号及び第三十八号に掲げる事務を\n除く。）\n八　第二十六条並びに附則第九条の二第三項（附則第九条の三第四項において準用する場合を含む。）、第九条の二の二第三項及び第九条の三第一項の規定による老齢基礎年金又は老齢年金の支給に係る事務（第百九条の四第一項第八号に掲げる申出及び請求の受理並びに当該老齢基礎年金又は老齢年金の裁定を除く。）\n九　第三十条第一項、第三十条の二第三項（第三十条の四第三項において準用する場合を含む。）、第三十条の三第一項、第三十条の四第一項、第三十一条第一項及び第三十二条の規定による障害基礎年金の支給に係る事務（第百九条の四第一項第九号に掲げる請求の受理及び当該障害基礎年金の裁定を除く。）\n十　第三十二条第一項、第三十六条第一項及び第二項、第三十六条の二第一項及び第四項、第三十六条の三第一項並びに第三十六条の四第一項及び第二項の規定による障害基礎年金の支給の停止に係る事務（当該支給の停止に係る決定を除く。）\n十一　第三十三条の二第二項及び第三項並びに第三十四条第一項の規定による障害基礎年金の額の改定に係る事務（第百九条の四第一項第十号に掲げる認定及び同項第十一号に掲げる請求の受理並びに当該改定に係る決定を除く。）\n十二　第三十七条の規定による遺族基礎年金の支給に係る事務（当該遺族基礎年金の裁定を除く。）\n十三　第三十九条第二項及び第三項並びに第三十九条の二第二項（第四十二条第三項において準用する場合を含む。）の規定による遺族基礎年金の額の改定に係る事務（当該改定に係る決定を除く。）\n十四　第四十一条、第四十一条の二並びに第四十二条第一項及び第二項の規定による遺族基礎年金の支給の停止に係る事務（第百九条の四第一項第十三号に掲げる申請の受理及び当該支給の停止に係る決定を除く。）\n十五　第四十三条の規定による付加年金の支給に係る事務（第百九条の四第一項第十四号に掲げる申出の受理及び当該付加年金の裁定を除く。）\n十六　第四十五条第二項の規定による付加年金の額の改定に係る事務（当該改定に係る決定を除く。）\n十七　第四十七条の規定による付加年金の支給の停止に係る事務（当該支給の停止に係る決定を除く。）\n十八　第四十九条第一項及び第五十二条の六の規定による寡婦年金の支給に係る事務（当該寡婦年金の裁定を除く。）\n十九　第五十二条の規定による寡婦年金の支給の停止に係る事務（当該支給の停止に係る決定を除く。）\n二十　第五十二条の二第一項及び第二項並びに第五十二条の六の規定による死亡一時金の支給に係る事務（当該死亡一時金の裁定を除く。）\n二十一　第六十九条の規定による障害基礎年金の支給に係る事務（当該障害基礎年金の裁定を除く。）\n二十二　第七十条の規定による給付の支給に係る事務（当該給付の裁定を除く。）\n二十三　第七十一条第一項の規定による遺族基礎年金、寡婦年金又は死亡一時金の支給に係る事務（当該遺族基礎年金、寡婦年金又は死亡一時金の裁定を除く。）\n二十四　第七十二条の規定による年金給付の支給の停止に係る事務（当該支給の停止に係る決定を除く。）\n二十五　第七十三条の規定による年金給付の支払の一時差止めに係る事務（当該支払の一時差止めに係る決定を除く。）\n二十六　第八十七条第一項及び第九十二条の四第六項の規定による保険料の徴収に係る事務（第百九条の四第一項第十七号から第二十号まで及び第二十三号から第二十五号までに掲げる権限を行使する事務並びに次条第一項の規定により機構が行う収納、第九十六条第一項の規定による督促その他の厚生労働省令で定める権限を行使する事務並びに第三十一号及び第三十八号に掲げる事務\nを除く。）\n二十七　第九十二条第一項の規定による保険料の通知に係る事務（当該通知を除く。）\n二十八　第九十二条の二の二第一項の規定による指定に係る事務（第百九条の四第一項第十八号に掲げる申出の受理及び当該指定を除く。）\n二十九　第九十二条の三第一項第二号の規定による指定に係る事務（当該指定を除く。）\n三十　第九十二条の六第一項の規定による指定の取消しに係る事務（当該取消しを除く。）\n三十一　第九十六条第一項及び第二項の規定による督促に係る事務（当該督促及び督促状を発すること（督促状の発送に係る事務を除く。）を除く。）\n三十二　第九十七条第一項及び第四項の規定による延滞金の徴収に係る事務（第百九条の四第一項第二十三号から第二十五号までに掲げる権限を行使する事務及び次条第一項の規定により機構が行う収納、第九十六条第一項の規定による督促その他の厚生労働省令で定める権限を行使する事務並びに前号及び第三十八号に掲げる事務を除く。）\n三十三　第百八条の三第一項の規定による統計調査に係る事務（第百九条の四第一項第三十一号に掲げる情報の提供の求め並びに当該統計調査に係る企画及び立案、総合調整並びに結果の提供を除く。）\n三十四　第百八条の四において読み替えて準用する住民基本台帳法第三十条の三十八第四項の規定による勧告及び同条第五項の規定による命令に係る事務（当該勧告及び命令を除く。）\n三十五　第百九条第二項の規定による認可及び同条第三項の規定による認可の取消しに係る事務（当該認可及び認可の取消しを除く。）\n三十六　第百九条の二第一項の規定による指定に係る事務（第百九条の四第一項第三十三号に掲げる申請の受理及び当該指定を除く。）、第百九条の二第四項の規定による情報の提供に係る事務（当該情報の提供を除く。）、同条第五項の規定による命令に係る事務（当該命令を除く。）及び同条第六項の規定による指定の取消しに係る事務（当該指定の取消しを除く。）\n三十六の二　第百九条の二の二第一項の規定による指定に係る事務（第百九条の四第一項第三十三号の二に掲げる申請の受理及び当該指定を除く。）、第百九条の二の二第四項の規定による命令に係る事務（当該命令を除く。）及び同条第五項の規定による指定の取消しに係る事務（当該指定の取消しを除く。）\n三十七　第百九条の三第一項の規定による指定に係る事務（第百九条の四第一項第三十四号に掲げる申請の受理及び当該指定を除く。）、第百九条の三第三項の規定による情報の提供に係る事務（当該情報の提供を除く。）、同条第四項の規定による命令に係る事務（当該命令を除く。）及び同条第五項の規定による指定の取消しに係る事務（当該指定の取消しを除く。）\n三十八　第百九条の四第一項第二十三号に規定する厚生労働省令で定める権限に係る事務（当該権限を行使する事務を除く。）\n三十九　附則第七条の三第四項及び第九条の二の二第五項の規定による老齢基礎年金の額の改定に係る事務（第百九条の四第一項第三十六号に掲げる届出の受理及び当該改定に係る決定を除く。）\n四十　附則第九条の三の二第二項の規定による脱退一時金の支給に係る事務（第百九条の四第一項第三十七号に掲げる請求の受理及び当該脱退一時金の裁定を除く。）\n四十一　介護保険法第二百三条その他の厚生労働省令で定める法律の規定による求めに応じたこの法律の実施に関し厚生労働大臣が保有する情報の提供に係る事務（当該情報の提供及び厚生労働省令で定める事務を除く。）\n四十二　前各号に掲げるもののほか、厚生労働省令で定める事務\n２　厚生労働大臣は、機構が天災その他の事由により前項各号に掲げる事務の全部又は一部を実施することが困難又は不適当となつたと認めるときは、同項各号に掲げる事務の全部又は一部を自ら行うものとする。\n３　前二項に定めるもののほか、機構又は厚生労働大臣による第一項各号に掲げる事務の実施に関し必要な事項は、厚生労働省令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の十一", "（機構が行う収納）", "2026-10-01", "（機構が行う収納）\n第百九条の十一　厚生労働大臣は、会計法第七条第一項の規定にかかわらず、政令で定める場合における保険料その他この法律の規定による徴収金、年金給付の過誤払による返還金その他の厚生労働省令で定めるもの（以下この条において「保険料等」という。）の収納を、政令で定めるところにより、機構に行わせることができる。\n２　前項の収納を行う機構の職員は、収納に係る法令に関する知識並びに実務に必要な知識及び能力を有する機構の職員のうちから、厚生労働大臣の認可を受けて、機構の理事長が任命する。\n３　機構は、第一項の規定により保険料等の収納をしたときは、遅滞なく、これを日本銀行に送付しなければならない。\n４　機構は、厚生労働省令で定めるところにより、収納に係る事務の実施状況及びその結果を厚生労働大臣に報告するものとする。\n５　機構は、前二項に定めるもののほか、厚生労働大臣が定める収納に係る事務の実施に関する規程に従つて収納を行わなければならない。\n６　前各項に定めるもののほか、第一項の規定による保険料等の収納について必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の十二", "（情報の提供）", "2026-10-01", "（情報の提供）\n第百九条の十二　機構は、厚生労働大臣に対し、厚生労働省令で定めるところにより、被保険者の資格に関する事項、保険料の免除に関する事項その他厚生労働大臣の権限の行使に関して必要な情報の提供を行うものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の十三", "（厚生労働大臣と機構の密接な連携）", "2026-10-01", "（厚生労働大臣と機構の密接な連携）\n第百九条の十三　厚生労働大臣及び機構は、国民年金事業が、適正かつ円滑に行われるよう、必要な情報交換を行うことその他相互の密接な連携を確保しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の十四", "（研修）", "2026-10-01", "（研修）\n第百九条の十四　厚生労働大臣は、機構の協力の下に、国民年金事業に関する事務に従事する厚生労働省の職員に対し、当該事務を適正かつ円滑に行うために必要な知識及び技能を習得させ、及び向上させるために必要な研修を行うものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百九条の十五", "（経過措置）", "2026-10-01", "（経過措置）\n第百九条の十五　この法律に基づき政令を制定し、又は改廃する場合においては、政令で、その制定又は改廃に伴い合理的に必要と判断される範囲内において、所要の経過措置を定めることができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十条", "（実施命令）", "2026-10-01", "（実施命令）\n第百十条　この法律に特別の規定があるものを除くほか、この法律の実施のための手続その他その執行について必要な細則は、省令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十一条", "—", "2026-10-01", "第百十一条　偽りその他不正な手段により給付を受けた者は、三年以下の拘禁刑又は百万円以下の罰金に処する。ただし、刑法（明治四十年法律第四十五号）に正条があるときは、刑法による。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十一条の二", "—", "2026-10-01", "第百十一条の二　第百八条の四において読み替えて準用する住民基本台帳法第三十条の三十八第五項の規定による命令に違反した場合には、当該違反行為をした者は、一年以下の拘禁刑又は五十万円以下の罰金に処する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十一条の三", "—", "2026-10-01", "第百十一条の三　解散した国民年金基金又は国民年金基金連合会が、正当な理由がなくて、第九十五条の二の規定による徴収金を督促状に指定する期限までに納付しないときは、その代表者、代理人又は使用人その他の従業者でその違反行為をした者は、六月以下の拘禁刑又は五十万円以下の罰金に処する。\n２　前項の国民年金基金又は国民年金基金連合会の代表者、代理人又は使用人その他の従業者が、その国民年金基金又は国民年金基金連合会の業務に関して同項の違反行為をしたときは、その行為者を罰するほか、その国民年金基金又は国民年金基金連合会に対しても、同項の罰金刑を科する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十二条", "—", "2026-10-01", "第百十二条　次の各号のいずれかに該当する者は、六月以下の拘禁刑又は三十万円以下の罰金に処する。\n一　第十二条第一項又は第五項の規定に違反して虚偽の届出をした被保険者\n二　第十二条第二項の規定により届出をする場合に虚偽の届出をした世帯主\n三　第百六条第一項の規定により資産若しくは収入の状況に関する書類その他の物件の提出を命ぜられてこれに従わず、若しくは虚偽の書類その他の物件の提出をし、又は同項の規定による当該職員（第百九条の八第二項において読み替えて適用される第百六条第一項に規定する機構の職員を含む。）の質問に対して答弁せず、若しくは虚偽の陳述をした被保険者", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十三条", "—", "2026-10-01", "第百十三条　第十二条第一項又は第五項の規定に違反して届出をしなかつた被保険者は、三十万円以下の罰金に処する。ただし、同条第二項の規定によつて世帯主から届出がなされたときは、この限りでない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十三条の二", "—", "2026-10-01", "第百十三条の二　次の各号のいずれかに該当する場合には、当該違反行為をした者は、三十万円以下の罰金に処する。\n一　第九十五条の規定によりその例によるものとされる国税徴収法第百四十一条の規定による徴収職員の質問に対して答弁をせず、又は偽りの陳述をしたとき。\n二　第九十五条の規定によりその例によるものとされる国税徴収法第百四十一条の規定による検査を拒み、妨げ、又は忌避したとき。\n三　第九十五条の規定によりその例によるものとされる国税徴収法第百四十一条の規定による物件の提示又は提出の要求に対し、正当な理由がなくこれに応じず、又は偽りの記載若しくは記録をした帳簿書類その他の物件を提示し、若しくは提出したとき。\n四　第百八条の四において読み替えて準用する住民基本台帳法第三十条の三十九第一項の規定による報告をせず、若しくは虚偽の報告をし、又は同項の規定による検査を拒み、妨げ、若しくは忌避したとき。\n五　第百九条の二第七項の規定に違反したとき。\n六　第百九条の三第六項の規定に違反したとき。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十三条の三", "—", "2026-10-01", "第百十三条の三　法人（法人でない社団又は財団で代表者又は管理人の定めがあるもの（以下この条において「人格のない社団等」という。）を含む。以下この項において同じ。）の代表者（人格のない社団等の管理人を含む。）又は法人若しくは人の代理人、使用人その他の従業者が、その法人又は人の業務又は財産に関して第百十一条の二又は前条（第五号及び第六号を除く。\n）の違反行為をしたときは、その行為者を罰するほか、その法人又は人に対し、各本条の罰金刑を科する。\n２　人格のない社団等について前項の規定の適用がある場合においては、その代表者又は管理人がその訴訟行為につき当該人格のない社団等を代表するほか、法人を被告人又は被疑者とする場合の刑事訴訟に関する法律の規定を準用する。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十三条の四", "—", "2026-10-01", "第百十三条の四　機構の役員は、次の各号のいずれかに該当する場合には、二十万円以下の過料に処する。\n一　第百九条の六第一項及び第二項、第百九条の七第一項、第百九条の八第一項並びに第百九条の十一第二項の規定により厚生労働大臣の認可を受けなければならない場合において、その認可を受けなかつたとき。\n二　第百九条の七第三項の規定による命令に違反したとき。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十四条", "—", "2026-10-01", "第百十四条　次の各号のいずれかに該当する者は、十万円以下の過料に処する。\n一　第百五条第一項の規定に違反して届出をしなかつた被保険者。ただし、同条第二項において準用する第十二条第二項の規定により世帯主から届出がなされたときを除く。\n二　第百五条第一項の規定に違反して虚偽の届出をした被保険者\n三　第百五条第二項において準用する第十二条第二項の規定により届出をする場合に虚偽の届出をした世帯主\n四　第百五条第四項の規定に違反して届出をしなかつた戸籍法の規定による死亡の届出義務者", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十五条", "（基金の給付）", "2026-10-01", "（基金の給付）\n第百十五条　国民年金基金（以下「基金」という。）は、第一条の目的を達成するため、加入員の老齢に関して必要な給付を行なうものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十五条の二", "（種類）", "2026-10-01", "（種類）\n第百十五条の二　基金は、地域型国民年金基金（以下「地域型基金」という。）及び職能型国民年金基金（以下「職能型基金」という。）とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十六条", "（組織）", "2026-10-01", "（組織）\n第百十六条　地域型基金は、第一号被保険者（第八十九条第一項、第九十条第一項又は第九十条の三第一項の規定により保険料を納付することを要しないものとされている者、第九十条の二第一項から第三項までの規定によりその一部の額につき保険料を納付することを要しないものとされている者及び農業者年金の被保険者を除く。次項及び第百二十七条第一項において同じ。\n）であつて、基金の地区内に住所を有する者をもつて組織する。\n２　職能型基金は、第一号被保険者であつて、基金の地区内において同種の事業又は業務に従事する者をもつて組織する。\n３　前二項に規定する者は、加入員たる資格を有する者という。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十七条", "（法人格）", "2026-10-01", "（法人格）\n第百十七条　基金は、法人とする。\n２　基金の住所は、その主たる事務所の所在地にあるものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十八条", "（名称）", "2026-10-01", "（名称）\n第百十八条　基金は、その名称中に国民年金基金という文字を用いなければならない。\n２　基金でない者は、国民年金基金という名称を用いてはならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十八条の二", "（地区）", "2026-10-01", "（地区）\n第百十八条の二　基金の地区は、地域型基金にあつては、一（第百三十七条の三の規定による吸収合併後存続する地域型基金にあつては、一以上）の都道府県の区域の全部とし、職能型基金にあつては、全国とする。\n２　地域型基金は、都道府県につき一個とし、職能型基金は、同種の事業又は業務につき全国を通じて一個とする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十九条", "（設立委員等）", "2026-10-01", "（設立委員等）\n第百十九条　地域型基金を設立するには、加入員たる資格を有する者及び年金に関する学識経験を有する者のうちから厚生労働大臣が任命した者が設立委員とならなければならない。\n２　前項の設立委員の任命は、三百人以上の加入員たる資格を有する者が厚生労働大臣に地域型基金の設立を希望する旨の申出を行つた場合に行うものとする。\n３　職能型基金を設立するには、その加入員となろうとする十五人以上の者が発起人とならなければならない。\n４　地域型基金は、千人以上の加入員がなければ設立することができない。\n５　職能型基金は、三千人以上の加入員がなければ設立することができない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十九条の二", "（創立総会）", "2026-10-01", "（創立総会）\n第百十九条の二　設立委員又は発起人（以下「設立委員等」という。）は、規約を作成し、創立総会の日時及び場所とともに公告して、創立総会を開かなければならない。\n２　前項の公告は、会日の二週間前までにしなければならない。\n３　設立委員等が作成した規約の承認その他設立に必要な事項の決定は、創立総会の議決によらなければならない。\n４　創立総会においては、前項の規約を修正することができる。ただし、地区及び加入員に関する規定については、この限りでない。\n５　創立総会の議事は、加入員たる資格を有する者であつてその会日までに設立委員等に対し設立の同意を申し出たものの半数以上が出席して、その出席者の三分の二以上で決する。\n６　前各項に定めるもののほか、議事の手続その他創立総会に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十九条の三", "（設立の認可）", "2026-10-01", "（設立の認可）\n第百十九条の三　設立委員等は、創立総会の終了後遅滞なく、規約その他必要な事項を記載した書面を厚生労働大臣に提出して、設立の認可を受けなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十九条の四", "（成立の時期）", "2026-10-01", "（成立の時期）\n第百十九条の四　基金は、設立の認可を受けた時に成立する。\n２　第百十九条の二第五項の設立の同意を申し出た者は、基金が成立したときは、その成立の日に加入員の資格を取得するものとする。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百十九条の五", "（理事長への事務引継）", "2026-10-01", "（理事長への事務引継）\n第百十九条の五　設立の認可があつたときは、設立委員等は、遅滞なく、その事務を理事長に引き継がなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十条", "（規約）", "2026-10-01", "（規約）\n第百二十条　基金は、規約をもつて次に掲げる事項を定めなければならない。\n一　名称\n二　事務所の所在地\n三　地区\n四　代議員及び代議員会に関する事項\n五　役員に関する事項\n六　加入員に関する事項\n七　年金及び一時金に関する事項\n八　掛金に関する事項\n九　資産の管理その他財務に関する事項\n十　解散及び清算に関する事項\n十一　業務の委託に関する事項\n十二　公告に関する事項\n十三　その他組織及び業務に関する重要事項\n２　職能型基金の規約には、前項に掲げる事項のほか、その設立に係る事業又は業務の種類を定めなければならない。\n３　前二項の規約の変更（政令で定める事項に係るものを除く。）は、厚生労働大臣の認可を受けなければ、その効力を生じない。\n４　基金は、前項の政令で定める事項に係る規約の変更をしたときは、遅滞なく、これを厚生労働大臣に届け出なければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十一条", "（公告）", "2026-10-01", "（公告）\n第百二十一条　基金は、政令の定めるところにより、基金の名称、事務所の所在地、役員の氏名その他政令で定める事項を公告しなければならない。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十二条", "（代議員会）", "2026-10-01", "（代議員会）\n第百二十二条　基金に、代議員会を置く。\n２　代議員会は、代議員をもつて組織する。\n３　代議員は、規約の定めるところにより、加入員のうちから選任する。\n４　設立当時の代議員は、創立総会において、第百十九条の二第五項の設立の同意を申し出た者のうちから選挙する。\n５　代議員の任期は、三年を超えない範囲内で規約で定める期間とする。ただし、補欠の代議員の任期は、前任者の残任期間とする。\n６　代議員会は、理事長が招集する。代議員の定数の三分の一以上の者が会議に付議すべき事項及び招集の理由を記載した書面を理事長に提出して代議員会の招集を請求したときは、理事長は、その請求のあつた日から二十日以内に代議員会を招集しなければならない。\n７　代議員会に議長を置く。議長は、理事長をもつて充てる。\n８　前各項に定めるもののほか、代議員会の招集、議事の手続その他代議員会に関し必要な事項は、政令で定める。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十三条", "—", "2026-10-01", "第百二十三条　次に掲げる事項は、代議員会の議決を経なければならない。\n一　規約の変更\n二　毎事業年度の予算\n三　毎事業年度の事業報告及び決算\n四　その他規約で定める事項\n２　理事長は、代議員会が成立しないとき、又は理事長において代議員会を招集する暇がないと認めるときは、代議員会の議決を経なければならない事項で臨時急施を要するものを処分することができる。\n３　理事長は、前項の規定による処置については、次の代議員会においてこれを報告し、その承認を求めなければならない。\n４　代議員会は、監事に対し、基金の業務に関する監査を求め、その結果の報告を請求することができる。", "e-Gov法令XML：334AC0000000141_20261001_507AC0000000074.xml"], ["第百二十四条", "（役員）", "2026-10-01", "（役員）\n第百二十四条　基金に、役員として理事及び監事を置く。\n２　理事は、代議員において互選する。ただし、理事の定数の三分の一（第百三十七条の三の規定による吸収合併によりその地区を全国とした地域型基金に
