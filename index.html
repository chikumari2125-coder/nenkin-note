8条の2の2　実施機関たる共済組合等は、厚生労働大臣に対し、その被保険者が第2号被保険者でなくなつたことに関して必要な情報の提供を行うものとする。", "bg": "【2013年改正】平成25年法律63号による規定追加。年金の第3号不整合記録への対処と関係する制度改正。", "deb": "—", "tsu": "【通達】平成25年6月28日 年管管発0628第7号。第3号不整合記録と情報連携の背景。", "kako": "—", "rows": [17], "heads": ["第8章　雑則"], "orig": "第百八条の二の二　実施機関たる共済組合等は、厚生労働大臣に対し、その被保険者が第二号被保険者でなくなつたことに関して必要な情報の提供を行うものとする。", "ch": 7}, {"key": "h108-3", "num": [108, 3], "label": "第108条の3", "caption": "統計調査", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（統計調査）\n第108条の3　厚生労働大臣は、第1条の目的を達成するため、被保険者若しくは被保険者であつた者又は受給権者に係る保険料の納付に関する実態その他の厚生労働省令で定める事項に関し必要な統計調査を行うものとする。\n2　厚生労働大臣は、前項に規定する統計調査に関し必要があると認めるときは、官公署に対し、必要な情報の提供を求めることができる。\n3　前項の規定により情報の提供を求めるに当たつては、被調査者を識別することができない方法による情報の提供を求めるものとする。", "bg": "【2004年改正】平成16年法律104号により追加。納付実態等の把握に関係。改正当時の逐条質疑は未確認。", "deb": "—", "tsu": "【一次資料】国民年金法108条の3。個人を識別できない方法が明記。", "kako": "令和2年", "rows": [18], "heads": ["第8章　雑則"], "orig": "（統計調査）\n第百八条の三　厚生労働大臣は、第一条の目的を達成するため、被保険者若しくは被保険者であつた者又は受給権者に係る保険料の納付に関する実態その他の厚生労働省令で定める事項に関し必要な統計調査を行うものとする。\n２　厚生労働大臣は、前項に規定する統計調査に関し必要があると認めるときは、官公署に対し、必要な情報の提供を求めることができる。\n３　前項の規定により情報の提供を求めるに当たつては、被調査者を識別することができない方法による情報の提供を求めるものとする。", "ch": 7}, {"key": "h108-4", "num": [108, 4], "label": "第108条の4", "caption": "基礎年金番号の利用制限等", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（基礎年金番号の利用制限等）\n第108条の4　第14条に規定する基礎年金番号については、住民基本台帳法第30条の37第1項及び第2項、第30条の38並びに第30条の39の規定を準用する。この場合において、同法第30条の37第2項中「都道府県知事」とあるのは「厚生労働大臣及び日本年金機構」と、同法第30条の38第1項から第3項までの規定中「何人も」とあるのは「国民年金法第14条に規定する政府管掌年金事業の運営に関する事務又は当該事業に関連する事務の遂行のため同条に規定する基礎年金番号の利用が特に必要な場合として厚生労働省令で定める場合を除き、何人も」と、同条第4項及び第5項並びに同法第30条の39第1項中「都道府県知事」とあるのは「厚生労働大臣」と読み替えるものとするほか、必要な技術的読替えは、政令で定める。", "bg": "【2007年改正】平成19年法律110号で追加。2013年改正による個人番号関係の整理もある。具体的審議は未確認。", "deb": "—", "tsu": "【一次資料】国民年金法108条の4。準用条文・読み替えに注意。", "kako": "平成30年", "rows": [19], "heads": ["第8章　雑則"], "orig": "（基礎年金番号の利用制限等）\n第百八条の四　第十四条に規定する基礎年金番号については、住民基本台帳法第三十条の三十七第一項及び第二項、第三十条の三十八並びに第三十条の三十九の規定を準用する。この場合において、同法第三十条の三十七第二項中「都道府県知事」とあるのは「厚生労働大臣及び日本年金機構」と、\n同法第三十条の三十八第一項から第三項までの規定中「何人も」とあるのは「国民年金法第十四条に規定する政府管掌年金事業の運営に関する事務又は当該事業に関連する事務の遂行のため同条に規定する基礎年金番号の利用が特に必要な場合として厚生労働省令で定める場合を除き、何人も」と、\n同条第四項及び第五項並びに同法第三十条の三十九第一項中「都道府県知事」とあるのは「厚生労働大臣」と読み替えるものとするほか、必要な技術的読替えは、政令で定める。", "ch": 7}, {"key": "h108-5", "num": [108, 5], "label": "第108条の5", "caption": "", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "〔学習用見出し：関係機関による年金記録情報の提供〕\n第108条の5　全国健康保険協会、第3条第2項に規定する共済組合等その他の厚生労働省令で定める者は、第14条に規定する政府管掌年金事業の運営に関する事務又は当該事業に関連する事務（当該厚生労働省令で定める者のうち厚生労働省令で定める者にあつては、同条に規定する政府管掌年金事業に関連する事務）の遂行のため必要がある場合を除き、何人に対しても、その者又はその者以外の者に係る基礎年金番号を告知することを求めてはならない。", "bg": "【2013年改正】平成25年法律28号で追加。識別番号の目的外取得の防止に関係する規定。", "deb": "—", "tsu": "【一次資料】国民年金法108条の5。禁止と例外を区別。", "kako": "—", "rows": [20], "heads": ["第8章　雑則"], "orig": "第百八条の五　全国健康保険協会、第三条第二項に規定する共済組合等その他の厚生労働省令で定める者は、第十四条に規定する政府管掌年金事業の運営に関する事務又は当該事業に関連する事務（当該厚生労働省令で定める者のうち厚生労働省令で定める者にあつては、同条に規定する政府管掌年金事業に関連する事務）の遂行のため必要がある場合を除き、何人に対しても、\nその者又はその者以外の者に係る基礎年金番号を告知することを求めてはならない。", "ch": 7}, {"key": "h109", "num": [109], "label": "第109条", "caption": "国民年金事務組合", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（国民年金事務組合）\n第109条　同種の事業又は業務に従事する被保険者を構成員とする団体その他被保険者を構成員とするこれに類する団体で政令で定めるものは、当該構成員である被保険者の委託を受けて、当該被保険者に係る第12条第1項の届出をすることができる。\n2　前項に規定する団体（以下「国民年金事務組合」という。）は、同項に規定する委託を受けようとするときは、厚生労働大臣の認可を受けなければならない。\n3　厚生労働大臣は、前項の認可を受けた国民年金事務組合がその行うべき事務の処理を怠り、又はその処理が著しく不当であると認めるときは、同項の認可を取り消すことができる。", "bg": "【1969年改正】昭和44年法律86号で追加。その後条番号移動・改正。導入時の個別質疑は未確認。", "deb": "—", "tsu": "【一次資料】国民年金法109条。事務組合にできる届出と認可の範囲を確認。", "kako": "—", "rows": [21], "heads": ["第8章　雑則"], "orig": "（国民年金事務組合）\n第百九条　同種の事業又は業務に従事する被保険者を構成員とする団体その他被保険者を構成員とするこれに類する団体で政令で定めるものは、当該構成員である被保険者の委託を受けて、当該被保険者に係る第十二条第一項の届出をすることができる。\n２　前項に規定する団体（以下「国民年金事務組合」という。）は、同項に規定する委託を受けようとするときは、厚生労働大臣の認可を受けなければならない。\n３　厚生労働大臣は、前項の認可を受けた国民年金事務組合がその行うべき事務の処理を怠り、又はその処理が著しく不当であると認めるときは、同項の認可を取り消すことができる。", "ch": 7}, {"key": "h109-2", "num": [109, 2], "label": "第109条の2", "caption": 章　雑則"], "orig": "（機構が行う滞納処分等に係る認可等）\n第百九条の六　機構は、滞納処分等を行う場合には、あらかじめ、厚生労働大臣の認可を受けるとともに、次条第一項に規定する滞納処分等実施規程に従い、徴収職員に行わせなければならない。\n２　前項の徴収職員は、滞納処分等に係る法令に関する知識並びに実務に必要な知識及び能力を有する機構の職員のうちから、厚生労働大臣の認可を受けて、機構の理事長が任命する。\n３　機構は、滞納処分等をしたときは、厚生労働省令で定めるところにより、速やかに、その結果を厚生労働大臣に報告しなければならない。", "ch": 7}, {"key": "h109-7", "num": [109, 7], "label": "第109条の7", "caption": "滞納処分等実施規程の認可等", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（滞納処分等実施規程の認可等）\n第109条の7　機構は、滞納処分等の実施に関する規程（以下この条において「滞納処分等実施規程」という。）を定め、厚生労働大臣の認可を受けなければならない。これを変更しようとするときも、同様とする。\n2　滞納処分等実施規程には、差押えを行う時期、差押えに係る財産の選定方法その他の滞納処分等の公正かつ確実な実施を確保するために必要なものとして厚生労働省令で定める事項を記載しなければならない。\n3　厚生労働大臣は、第1項の認可をした滞納処分等実施規程が滞納処分等の公正かつ確実な実施上不適当となつたと認めるときは、機構に対し、その滞納処分等実施規程を変更すべきことを命ずることができる。", "bg": "【2007年改正】機構による滞納処分の公正確実な運営を確保する制度構造。", "deb": "—", "tsu": "【一次資料】国民年金法109条の7。規程作成・認可・変更命令。", "kako": "—", "rows": [28], "heads": ["第8章　雑則"], "orig": "（滞納処分等実施規程の認可等）\n第百九条の七　機構は、滞納処分等の実施に関する規程（以下この条において「滞納処分等実施規程」という。）を定め、厚生労働大臣の認可を受けなければならない。これを変更しようとするときも、同様とする。\n２　滞納処分等実施規程には、差押えを行う時期、差押えに係る財産の選定方法その他の滞納処分等の公正かつ確実な実施を確保するために必要なものとして厚生労働省令で定める事項を記載しなければならない。\n３　厚生労働大臣は、第一項の認可をした滞納処分等実施規程が滞納処分等の公正かつ確実な実施上不適当となつたと認めるときは、機構に対し、その滞納処分等実施規程を変更すべきことを命ずることができる。", "ch": 7}, {"key": "h109-8", "num": [109, 8], "label": "第109条の8", "caption": "機構が行う立入検査等に係る認可等", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（機構が行う立入検査等に係る認可等）\n第109条の8　機構は、第109条の4第1項第21号、第28号、第29号又は第32号に掲げる権限に係る事務を行う場合には、あらかじめ、厚生労働大臣の認可を受けなければならない。\n2　機構が第109条の4第1項第21号、第28号、第29号又は第32号に掲げる権限に係る事務を行う場合における第72条各号、第106条並びに第107条第1項及び第2項の規定の適用については、これらの規定中「当該職員」とあるのは、「機構の職員」とする。", "bg": "【2007年改正】公権力を伴う検査等を機構が実施する際の統制の仕組み。", "deb": "—", "tsu": "【一次資料】国民年金法109条の8。第109条の4第1項の参照号を確認。", "kako": "令和2年", "rows": [29], "heads": ["第8章　雑則"], "orig": "（機構が行う立入検査等に係る認可等）\n第百九条の八　機構は、第百九条の四第一項第二十一号、第二十八号、第二十九号又は第三十二号に掲げる権限に係る事務を行う場合には、あらかじめ、厚生労働大臣の認可を受けなければならない。\n２　機構が第百九条の四第一項第二十一号、第二十八号、第二十九号又は第三十二号に掲げる権限に係る事務を行う場合における第七十二条各号、第百六条並びに第百七条第一項及び第二項の規定の適用については、これらの規定中「当該職員」とあるのは、「機構の職員」とする。", "ch": 7}, {"key": "h109-9", "num": [109, 9], "label": "第109条の9", "caption": "地方厚生局長等への権限の委任", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（地方厚生局長等への権限の委任）\n第109条の9　この法律に規定する厚生労働大臣の権限（第109条の5第1項及び第2項並びに第10章に規定する厚生労働大臣の権限を除く。）は、厚生労働省令（第14条の4に規定する厚生労働大臣の権限にあつては、政令）で定めるところにより、地方厚生局長に委任することができる。\n2　前項の規定により地方厚生局長に委任された権限は、厚生労働省令（第14条の4に規定する厚生労働大臣の権限にあつては、政令）で定めるところにより、地方厚生支局長に委任することができる。\n3　第1項の規定により第14条の4に規定する厚生労働大臣の権限が地方厚生局長に委任された場合（前項の規定により同条に規定する厚生労働大臣の権限が地方厚生支局長に委任された場合を含む。）には、同条第3項中「社会保障審議会」とあるのは、「地方厚生局に置かれる政令で定める審議会」とする。", "bg": "【2007年改正】国・地方厚生局の権限分担を調整。2014年改正で年金記録訂正関係の権限委任に対応。", "deb": "【2014年提案理由】年金記録の訂正手続の整備を説明（条文固有の質疑ではない）。", "tsu": "【通達】平成27年4月10日 年管発0410第1号（年金記録訂正審議会関係）。", "kako": "—", "rows": [30], "heads": ["第8章　雑則"], "orig": "（地方厚生局長等への権限の委任）\n第百九条の九　この法律に規定する厚生労働大臣の権限（第百九条の五第一項及び第二項並びに第十章に規定する厚生労働大臣の権限を除く。）は、厚生労働省令（第十四条の四に規定する厚生労働大臣の権限にあつては、政令）で定めるところにより、地方厚生局長に委任することができる。\n２　前項の規定により地方厚生局長に委任された権限は、厚生労働省令（第十四条の四に規定する厚生労働大臣の権限にあつては、政令）で定めるところにより、地方厚生支局長に委任することができる。\n３　第一項の規定により第十四条の四に規定する厚生労働大臣の権限が地方厚生局長に委任された場合（前項の規定により同条に規定する厚生労働大臣の権限が地方厚生支局長に委任された場合を含む。）には、同条第三項中「社会保障審議会」とあるのは、「地方厚生局に置かれる政令で定める審議会」とする。", "ch": 7}, {"key": "h109-10", "num": [109, 10], "label": "第109条の10", "caption": "機構への事務の委託", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（機構への事務の委託）\n第109条の10　厚生労働大臣は、機構に、次に掲げる事務（第3条第2項の規定により共済組合等が行うこととされたもの及び同条第3項の規定により市町村長が行うこととされたものを除く。）を行わせるものとする。\n1　第14条の規定による記録に係る事務（当該記録を除く。）\n2　第14条の5の規定による情報の通知に係る事務（当該通知を除く。）\n3　第16条（附則第9条の3の2第7項において準用する場合を含む。）の規定による裁定に係る事務（第109条の4第1項第5号に掲げる請求の受理及び当該裁定を除く。）\n4　第19条第1項（附則第9条の3の2第7項において準用する場合を含む。）及び第3項の規定による請求の内容の確認に係る事務\n5　第20条第1項及び第2項の規定による年金給付の支給の停止に係る事務（第109条の4第1項第6号に掲げる申請の受理及び当該支給の停止に係る決定を除く。）\n6　第20条の2第1項及び第2項の規定による年金給付の支給の停止に係る事務（第109条の4第1項第7号に掲げる申出の受理及び当該支給の停止に係る決定を除く。）\n7　第23条（附則第9条の3の2第7項において準用する場合を含む。）の規定による不正利得の徴収に係る事務（第109条の4第1項第23号から第25号までに掲げる権限を行使する事務及び次条第1項の規定により機構が行う収納、第96条第1項の規定による督促 及び第三十八号に掲げる事務を除く。）\n三十三　第百八条の三第一項の規定による統計調査に係る事務（第百九条の四第一項第三十一号に掲げる情報の提供の求め並びに当該統計調査に係る企画及び立案、総合調整並びに結果の提供を除く。）\n三十四　第百八条の四において読み替えて準用する住民基本台帳法第三十条の三十八第四項の規定による勧告及び同条第五項の規定による命令に係る事務（当該勧告及び命令を除く。）\n三十五　第百九条第二項の規定による認可及び同条第三項の規定による認可の取消しに係る事務（当該認可及び認可の取消しを除く。）\n三十六　第百九条の二第一項の規定による指定に係る事務（第百九条の四第一項第三十三号に掲げる申請の受理及び当該指定を除く。）、第百九条の二第四項の規定による情報の提供に係る事務（当該情報の提供を除く。）、同条第五項の規定による命令に係る事務（当該命令を除く。）及び同条第六項の規定による指定の取消しに係る事務（当該指定の取消しを除く。）\n三十六の二　第百九条の二の二第一項の規定による指定に係る事務（第百九条の四第一項第三十三号の二に掲げる申請の受理及び当該指定を除く。）、第百九条の二の二第四項の規定による命令に係る事務（当該命令を除く。）及び同条第五項の規定による指定の取消しに係る事務（当該指定の取消しを除く。）\n三十七　第百九条の三第一項の規定による指定に係る事務（第百九条の四第一項第三十四号に掲げる申請の受理及び当該指定を除く。）、第百九条の三第三項の規定による情報の提供に係る事務（当該情報の提供を除く。）、同条第四項の規定による命令に係る事務（当該命令を除く。）及び同条第五項の規定による指定の取消しに係る事務（当該指定の取消しを除く。）\n三十八　第百九条の四第一項第二十三号に規定する厚生労働省令で定める権限に係る事務（当該権限を行使する事務を除く。）\n三十九　附則第七条の三第四項及び第九条の二の二第五項の規定による老齢基礎年金の額の改定に係る事務（第百九条の四第一項第三十六号に掲げる届出の受理及び当該改定に係る決定を除く。）\n四十　附則第九条の三の二第二項の規定による脱退一時金の支給に係る事務（第百九条の四第一項第三十七号に掲げる請求の受理及び当該脱退一時金の裁定を除く。）\n四十一　介護保険法第二百三条その他の厚生労働省令で定める法律の規定による求めに応じたこの法律の実施に関し厚生労働大臣が保有する情報の提供に係る事務（当該情報の提供及び厚生労働省令で定める事務を除く。）\n四十二　前各号に掲げるもののほか、厚生労働省令で定める事務\n２　厚生労働大臣は、機構が天災その他の事由により前項各号に掲げる事務の全部又は一部を実施することが困難又は不適当となつたと認めるときは、同項各号に掲げる事務の全部又は一部を自ら行うものとする。\n３　前二項に定めるもののほか、機構又は厚生労働大臣による第一項各号に掲げる事務の実施に関し必要な事項は、厚生労働省令で定める。", "ch": 7}, {"key": "h109-11", "num": [109, 11], "label": "第109条の11", "caption": "機構が行う収納", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（機構が行う収納）\n第109条の11　厚生労働大臣は、会計法第7条第1項の規定にかかわらず、政令で定める場合における保険料その他この法律の規定による徴収金、年金給付の過誤払による返還金その他の厚生労働省令で定めるもの（以下この条において「保険料等」という。）の収納を、政令で定めるところにより、機構に行わせることができる。\n2　前項の収納を行う機構の職員は、収納に係る法令に関する知識並びに実務に必要な知識及び能力を有する機構の職員のうちから、厚生労働大臣の認可を受けて、機構の理事長が任命する。\n3　機構は、第1項の規定により保険料等の収納をしたときは、遅滞なく、これを日本銀行に送付しなければならない。\n4　機構は、厚生労働省令で定めるところにより、収納に係る事務の実施状況及びその結果を厚生労働大臣に報告するものとする。\n5　機構は、前2項に定めるもののほか、厚生労働大臣が定める収納に係る事務の実施に関する規程に従つて収納を行わなければならない。\n6　前各項に定めるもののほか、第1項の規定による保険料等の収納について必要な事項は、政令で定める。", "bg": "【2007年改正】国の会計秩序に配慮して収納実務を機構が処理する特則。", "deb": "—", "tsu": "【一次資料】国民年金法109条の11。徴収権限と現金の収納を区別。", "kako": "—", "rows": [32], "heads": ["第8章　雑則"], "orig": "（機構が行う収納）\n第百九条の十一　厚生労働大臣は、会計法第七条第一項の規定にかかわらず、政令で定める場合における保険料その他この法律の規定による徴収金、年金給付の過誤払による返還金その他の厚生労働省令で定めるもの（以下この条において「保険料等」という。）の収納を、政令で定めるところにより、機構に行わせることができる。\n２　前項の収納を行う機構の職員は、収納に係る法令に関する知識並びに実務に必要な知識及び能力を有する機構の職員のうちから、厚生労働大臣の認可を受けて、機構の理事長が任命する。\n３　機構は、第一項の規定により保険料等の収納をしたときは、遅滞なく、これを日本銀行に送付しなければならない。\n４　機構は、厚生労働省令で定めるところにより、収納に係る事務の実施状況及びその結果を厚生労働大臣に報告するものとする。\n５　機構は、前二項に定めるもののほか、厚生労働大臣が定める収納に係る事務の実施に関する規程に従つて収納を行わなければならない。\n６　前各項に定めるもののほか、第一項の規定による保険料等の収納について必要な事項は、政令で定める。", "ch": 7}, {"key": "h109-12", "num": [109, 12], "label": "第109条の12", "caption": "情報の提供", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（情報の提供）\n第109条の12　機構は、厚生労働大臣に対し、厚生労働省令で定めるところにより、被保険者の資格に関する事項、保険料の免除に関する事項その他厚生労働大臣の権限の行使に関して必要な情報の提供を行うものとする。", "bg": "【2007年改正】機構が運営し国が最終責任を持つ仕組みを情報面で支える規定。", "deb": "—", "tsu": "【一次資料】国民年金法109条の12。情報の流れは機構→大臣。", "kako": "—", "rows": [33], "heads": ["第8章　雑則"], "orig": "（情報の提供）\n第百九条の十二　機構は、厚生労働大臣に対し、厚生労働省令で定めるところにより、被保険者の資格に関する事項、保険料の免除に関する事項その他厚生労働大臣の権限の行使に関して必要な情報の提供を行うものとする。", "ch": 7}, {"key": "h109-13", "num": [109, 13], "label": "第109条の13", "caption": "厚生労働大臣と機構の密接な連携", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（厚生労働大臣と機構の密接な連携）\n第109条の13　厚生労働大臣及び機構は、国民年金事業が、適正かつ円滑に行われるよう、必要な情報交換を行うことその他相互の密接な連携を確保しなければならない。", "bg": "【2016年改正】平成28年法律114号により追加。国と機構の連携を法定したもの。具体的な条文審議の引用は未確認。", "deb": "—", "tsu": "【一次資料】国民年金法109条の13。厚生労働省「年金事業運営」。", "kako": "—", "rows": [34], "heads": ["第8章　雑則"], "orig": "（厚生労働大臣と機構の密接な連携）\n第百九条の十三　厚生労働大臣及び機構は、国民年金事業が、適正かつ円滑に行われるよう、必要な情報交換を行うことその他相互の密接な連携を確保しなければならない。", "ch": 7}, {"key": "h109-14", "num": [109, 14], "label": "第109条の14", "caption": "研修", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（研修）\n第109条の14　厚生労働大臣は、機構の協力の下に、国民年金事業に関する事務に従事する厚生労働省の職員に対し、当該事務を適正かつ円滑に行うために必要な知識及び技能を習得させ、及び向上させるために必要な研修を行うものとする。", "bg": "【2016年改正】平成28年法律114号で追加。国側の執行能力・機構との連携に関係。個別議会審議は未確認。", "deb": "—", "tsu": "【一次資料】国民年金法109条の14。研修対象は『厚生労働省の職員』。", "kako": "—", "rows": [35], "heads": ["第8章　雑則"], "orig": "（研修）\n第百九条の十四　厚生労働大臣は、機構の協力の下に、国民年金事業に関する事務に従事する厚生労働省の職員に対し、当該事務を適正かつ円滑に行うために必要な知識及び技能を習得させ、及び向上させるために必要な研修を行うものとする。", "ch": 7}, {"key": "h109-15", "num": [109, 15], "label": "第109条の15", "caption": "経過措置", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（経過措置）\n第109条の15　この法律に基づき政令を制定し、又は改廃する場合においては、政令で、その制定又は改廃に伴い合理的に必要と判断される範囲内において、所要の経過措置を定めることができる。", "bg": "【1985年改正で追加／後年条移動】昭和60年法律34号による追加後、繰下げ等の条番号移動を経て現行109条の15となった。", "deb": "—", "tsu": "【一次資料】国民年金法109条の15。包括的な無制限委任ではなく『合理的に必要な範囲』。", "kako": "—", "rows": [36], "heads": ["第8章　雑則"], "orig": "（経過措置）\n第百九条の十五　この法律に基づき政令を制定し、又は改廃する場合においては、政令で、その制定又は改廃に伴い合理的に必要と判断される範囲内において、所要の経過措置を定めることができる。", "ch": 7}, {"key": "h110", "num": [110], "label": "第110条", "caption": "実施命令", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（実施命令）\n第110条　この法律に特別の規定があるものを除くほか、この法律の実施のための手続その他その執行について必要な細則は、省令で定める。", "bg": "【制度構造】法律の実施に必要な細目を命令に委任。個別の制定時質疑は未確認。", "deb": "—", "tsu": "【一次資料】国民年金法110条。『政令』ではなく『省令』。", "kako": "—", "rows": [37], "heads": ["第8章　雑則"], "orig": "（実施命令）\n第百十条　この法律に特別の規定があるものを除くほか、この法律の実施のための手続その他その執行について必要な細則は、省令で定める。", "ch": 7}, {"key": "h111", "num": [111], "label": "第111条", "caption": "", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "〔学習用見出し：不正受給に対する罰則〕\n第111条　偽りその他不正な手段により給付を受けた者は、3年以下の拘禁刑又は1000000円以下の罰金に処する。ただし、刑法（明治40年法律第45号）に正条があるときは、刑法による。", "bg": "【制度構造】給付の不正受領を刑事罰で抑止。2022年刑法等改正（令和4年法律68号）に伴い拘禁刑表記へ改正。", "deb": "—", "tsu": "【一次資料】国民年金法111条。刑事罰と不正利得の徴収（23条）は別の制度。", "kako": "—", "rows": [39], "heads": ["第9章　罰則"], "orig": "第百十一条　偽りその他不正な手段により給付を受けた者は、三年以下の拘禁刑又は百万円以下の罰金に処する。ただし、刑法（明治四十年法律第四十五号）に正条があるときは、刑法による。", "ch": 8}, {"key": "h111-2", "num": [111, 2], "label": "第111条の2", "caption": "", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "〔学習用見出し：住民基本台帳法に基づく命令違反の罰則〕\n第111条の2　第108条の4において読み替えて準用する住民基本台帳法第30条の38第5項の規定による命令に違反した場合には、当該違反行為をした者は、1年以下の拘禁刑又は500000円以下の罰金に処する。", "bg": "【2007年改正】個人情報保護関連の番号利用規制に対応。改正後も条文原文で構成要件確認が必要。", "deb": "—", "tsu": "【一次資料】国民年金法111条の2。参照する準用条文を必ず確認。", "kako": "—", "rows": [40], "heads": ["第9章　罰則"], "orig": "第百十一条の二　第百八条の四において読み替えて準用する住民基本台帳法第三十条の三十八第五項の規定による命令に違反した場合には、当該違反行為をした者は、一年以下の拘禁刑又は五十万円以下の罰金に処する。", "ch": 8}, {"key": "h111-3", "num": [111, 3], "label": "第111条の3", "caption": "", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "〔学習用見出し：解散基金等の徴収金不納付に対する罰則〕\n第111条の3　解散した国民年金基金又は国民年金基金連合会が、正当な理由がなくて、第95条の2の規定による徴収金を督促状に指定する期限までに納付しないときは、その代表者、代理人又は使用人その他の従業者でその違反行為をした者は、6月以下の拘禁刑又は500000円以下の罰金に処する。\n2　前項の国民年金基金又は国民年金基金連合会の代表者、代理人又は使用人その他の従業者が、その国民年金基金又は国民年金基金連合会の業務に関して同項の違反行為をしたときは、その行為者を罰するほか、その国民年金基金又は国民年金基金連合会に対しても、同項の罰金刑を科する。", "bg": "【1969年改正】基金関係の制度導入に伴う追加（後年条番号変更）。", "deb": "—", "tsu": "【一次資料】国民年金法111条の3・95条の2。一般の保険料不納付と混同しない。", "kako": "—", "rows": [41], "heads": ["第9章　罰則"], "orig": "第百十一条の三　解散した国民年金基金又は国民年金基金連合会が、正当な理由がなくて、第九十五条の二の規定による徴収金を督促状に指定する期限までに納付しないときは、その代表者、代理人又は使用人その他の従業者でその違反行為をした者は、六月以下の拘禁刑又は五十万円以下の罰金に処する。\n２　前項の国民年金基金又は国民年金基金連合会の代表者、代理人又は使用人その他の従業者が、その国民年金基金又は国民年金基金連合会の業務に関して同項の違反行為をしたときは、その行為者を罰するほか、その国民年金基金又は国民年金基金連合会に対しても、同項の罰金刑を科する。", "ch": 8}, {"key": "h112", "num": [112], "label": "第112条", "caption": "", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "〔学習用見出し：虚偽の届出等に対する罰則〕\n第112条　次の各号のいずれかに該当する者は、6月以下の拘禁刑又は300000円以下の罰金に処する。\n1　第12条第1項又は第5項の規定に違反して虚偽の届出をした被保険者\n2　第12条第2項の規定により届出をする場合に虚偽の届出をした世帯主\n3　第106条第1項の規定により資産若しくは収入の状況に関する書類その他の物件の提出を命ぜられてこれに従わず、若しくは虚偽の書類その他の物件の提出をし、又は同項の規定による当該職員（第109条の8第2項において読み替えて適用される第106条第1項に規定する機構の職員を含む。）の質問に対して答弁せず、若しくは虚偽の陳述をした被保険者", "bg": "【制度構造】届出・調査の実効性確保。2022年の拘禁刑表記への改正あり。", "deb": "—", "tsu": "【一次資料】国民年金法112条。対象行為は同条各号による。", "kako": "—", "rows": [42], "heads": ["第9章　罰則"], "orig": "第百十二条　次の各号のいずれかに該当する者は、六月以下の拘禁刑又は三十万円以下の罰金に処する。\n一　第十二条第一項又は第五項の規定に違反して虚偽の届出をした被保険者\n二　第十二条第二項の規定により届出をする場合に虚偽の届出をした世帯主\n三　第百六条第一項の規定により資産若しくは収入の状況に関する書類その他の物件の提出を命ぜられてこれに従わず、若しくは虚偽の書類その他の物件の提出をし、又は同項の規定による当該職員（第百九条の八第二項において読み替えて適用される第百六条第一項に規定する機構の職員を含む。）の質問に対して答弁せず、若しくは虚偽の陳述をした被保険者", "ch": 8}, {"key": "h113", "num": [113], "label": "第113条", "caption": "", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "〔学習用見出し：届出をしない場合の罰則〕\n第113条　第12条第1項又は第5項の規定に違反して届出をしなかつた被保険者は、300000円以下の罰金に処する。ただし、同条第2項の規定によつて世帯主から届出がなされたときは、この限りでない。", "bg": "【制度構造】被保険者届出義務の履行確保。", "deb": "—", "tsu": "【一次資料】国民年金法113条。112条の『虚偽』と113条の『不届』を区別。", "kako": "—", "rows": [43], "heads": ["第9章　罰則"], "orig": "第百十三条　第十二条第一項又は第五項の規定に違反して届出をしなかつた被保険者は、三十万円以下の罰金に処する。ただし、同条第二項の規定によつて世帯主から届出がなされたときは、この限りでない。", "ch": 8}, {"key": "h113-2", "num": [113, 2], "label": "第113条の2", "caption": "", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "〔学習用見出し：徴収に関する質問・検査等への違反の罰則〕\n第113条の2　次の各号のいずれかに該当する場合には、当該違反行為をした者は、300000円以下の罰金に処する。\n1　第95条の規定によりその例によるものとされる国税徴収法第141条の規定による徴収職員の質問に対して答弁をせず、又は偽りの陳述をしたとき。\n2　第95条の規定によりその例によるものとされる国税徴収法第141条の規定による検査を拒み、妨げ、又は忌避したとき。\n3　第95条の規定によりその例によるものとされる国税徴収法第141条の規定による物件の提示又は提出の要求に対し、正当な理由がなくこれに応じず、又は偽りの記載若しくは記録をした帳簿書類その他の物件を提示し、若しくは提出したとき。\n4　第108条の4において読み替えて準用する住民基本台帳法第30条の39第1項の規定による報告をせず、若しくは虚偽の報告をし、又は同項の規定による検査を拒み、妨げ、若しくは忌避したとき。\n5　第109条の2第7項の規定に違反したとき。\n6　第109条の3第6項の規定に違反したとき。", "bg": "【2004年改正で追加】その後の委託・情報管理の規定追加に合わせて対象行為を改正。", "deb": "—", "tsu": "【一次資料】国民年金法113条の2・各号。違反行為ごとの主体に留意。", "kako": "—", "rows": [44], "heads": ["第9章　罰則"], "orig": "第百十三条の二　次の各号のいずれかに該当する場合には、当該違反行為をした者は、三十万円以下の罰金に処する。\n一　第九十五条の規定によりその例によるものとされる国税徴収法第百四十一条の規定による徴収職員の質問に対して答弁をせず、又は偽りの陳述をしたとき。\n二　第九十五条の規定によりその例によるものとされる国税徴収法第百四十一条の規定による検査を拒み、妨げ、又は忌避したとき。\n三　第九十五条の規定によりその例によるものとされる国税徴収法第百四十一条の規定による物件の提示又は提出の要求に対し、正当な理由がなくこれに応じず、又は偽りの記載若しくは記録をした帳簿書類その他の物件を提示し、若しくは提出したとき。\n四　第百八条の四において読み替えて準用する住民基本台帳法第三十条の三十九第一項の規定による報告をせず、若しくは虚偽の報告をし、又は同項の規定による検査を拒み、妨げ、若しくは忌避したとき。\n五　第百九条の二第七項の規定に違反したとき。\n六　第百九条の三第六項の規定に違反したとき。", "ch": 8}, {"key": "h113-3", "num": [113, 3], "label": "第113条の3", "caption": "", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "〔学習用見出し：両罰規定〕\n第113条の3　法人（法人でない社団又は財団で代表者又は管理人の定めがあるもの（以下この条において「人格のない社団等」という。）を含む。以下この項において同じ。）の代表者（人格のない社団等の管理人を含む。）又は法人若しくは人の代理人、使用人その他の従業者が、その法人又は人の業務又は財産に関して第111条の2又は前条（第5号及び第6号を除く。）の違反行為をしたときは、その行為者を罰するほか、その法人又は人に対し、各本条の罰金刑を科する。\n2　人格のない社団等について前項の規定の適用がある場合においては、その代表者又は管理人がその訴訟行為につき当該人格のない社団等を代表するほか、法人を被告人又は被疑者とする場合の刑事訴訟に関する法律の規定を準用する。", "bg": "【2004年改正（平成16年法律第104号）】保険料等の徴収の実効性を確保するため、国税徴収法に準じた調査での質問拒否・虚偽答弁や検査妨害等に対する罰則を整備した。あわせて、法人・事業主の業務又は財産に関して従業者等が一定の違反行為をした場合、行為者だけでなく法人・事業主にも罰金刑を科す両罰規定を設けた。法人格のない社団・財団にも適用できるよう、訴訟手続上の扱いを定めた。※両罰の対象となる違反規定の範囲には後年の改正がある。", "deb": "—", "tsu": "—", "kako": "—", "rows": [45], "heads": ["第9章　罰則"], "orig": "第百十三条の三　法人（法人でない社団又は財団で代表者又は管理人の定めがあるもの（以下この条において「人格のない社団等」という。）を含む。以下この項において同じ。）の代表者（人格のない社団等の管理人を含む。）又は法人若しくは人の代理人、使用人その他の従業者が、その法人又は人の業務又は財産に関して第百十一条の二又は前条（第五号及び第六号を除く。\n）の違反行為をしたときは、その行為者を罰するほか、その法人又は人に対し、各本条の罰金刑を科する。\n２　人格のない社団等について前項の規定の適用がある場合においては、その代表者又は管理人がその訴訟行為につき当該人格のない社団等を代表するほか、法人を被告人又は被疑者とする場合の刑事訴訟に関する法律の規定を準用する。", "ch": 8}, {"key": "h113-4", "num": [113, 4], "label": "第113条の4", "caption": "", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "〔学習用見出し：日本年金機構役員の過料〕\n第113条の4　機構の役員は、次の各号のいずれかに該当する場合には、200000円以下の過料に処する。\n1　第109条の6第1項及び第2項、第109条の7第1項、第109条の8第1項並びに第109条の11第2項の規定により厚生労働大臣の認可を受けなければならない場合において、その認可を受けなかつたとき。\n2　第109条の7第3項の規定による命令に違反したとき。", "bg": "【2007年改革（平成19年法律第109号）】社会保険庁の業務運営上の問題と公的年金への信頼低下を受け、社会保険庁を廃止し、国が財政・運営責任を持ちながら日本年金機構に実務を担わせる体制へ改めた。厚生労働大臣による認可・監督を実効あるものとするため、認可を受けずに所定の行為を行い、又は監督上の命令に違反した機構役員に過料を科す規定を整備した。刑事罰である罰金とは区別される行政上の秩序罰である。", "deb": "—", "tsu": "—", "kako": "—", "rows": [46], "heads": ["第9章　罰則"], "orig": "第百十三条の四　機構の役員は、次の各号のいずれかに該当する場合には、二十万円以下の過料に処する。\n一　第百九条の六第一項及び第二項、第百九条の七第一項、第百九条の八第一項並びに第百九条の十一第二項の規定により厚生労働大臣の認可を受けなければならない場合において、その認可を受けなかつたとき。\n二　第百九条の七第三項の規定による命令に違反したとき。", "ch": 8}, {"key": "h114", "num": [114], "label": "第114条", "caption": "", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "〔学習用見出し：届出違反等に対する過料〕\n第114条　次の各号のいずれかに該当する者は、100000円以下の過料に処する。\n1　第105条第1項の規定に違反して届出をしなかつた被保険者。ただし、同条第2項において準用する第12条第2項の規定により世帯主から届出がなされたときを除く。\n2　第105条第1項の規定に違反して虚偽の届出をした被保険者\n3　第105条第2項において準用する第12条第2項の規定により届出をする場合に虚偽の届出をした世帯主\n4　第105条第4項の規定に違反して届出をしなかつた戸籍法の規定による死亡の届出義務者", "bg": "【制度構造】届出制度の秩序維持に関する行政上の過料。改正履歴はあるが個別逐条の審議は未確認。", "deb": "—", "tsu": "【一次資料】国民年金法114条。113条の罰金と114条の過料の区別に注意。", "kako": "令和2年", "rows": [47], "heads": ["第9章　罰則"], "orig": "第百十四条　次の各号のいずれかに該当する者は、十万円以下の過料に処する。\n一　第百五条第一項の規定に違反して届出をしなかつた被保険者。ただし、同条第二項において準用する第十二条第二項の規定により世帯主から届出がなされたときを除く。\n二　第百五条第一項の規定に違反して虚偽の届出をした被保険者\n三　第百五条第二項において準用する第十二条第二項の規定により届出をする場合に虚偽の届出をした世帯主\n四　第百五条第四項の規定に違反して届出をしなかつた戸籍法の規定による死亡の届出義務者", "ch": 8}, {"key": "h115", "num": [115], "label": "第115条", "caption": "基金の給付", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（基金の給付）\n第115条　国民年金基金（以下「基金」という。）は、第1条の目的を達成するため、加入員の老齢に関して必要な給付を行なうものとする。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [8], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第1款　通則"], "orig": "（基金の給付）\n第百十五条　国民年金基金（以下「基金」という。）は、第一条の目的を達成するため、加入員の老齢に関して必要な給付を行なうものとする。", "ch": 9}, {"key": "h115-2", "num": [115, 2], "label": "第115条の2", "caption": "種類", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（種類）\n第115条の2　基金は、地域型国民年金基金（以下「地域型基金」という。）及び職能型国民年金基金（以下「職能型基金」という。）とする。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [9], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第1款　通則"], "orig": "（種類）\n第百十五条の二　基金は、地域型国民年金基金（以下「地域型基金」という。）及び職能型国民年金基金（以下「職能型基金」という。）とする。", "ch": 9}, {"key": "h116", "num": [116], "label": "第116条", "caption": "組織", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（組織）\n第116条　地域型基金は、第1号被保険者（第89条第1項、第90条第1項又は第90条の3第1項の規定により保険料を納付することを要しないものとされている者、第90条の2第1項から第3項までの規定によりその一部の額につき保険料を納付することを要しないものとされている者及び農業者年金の被保険者を除く。次項及び第127条第1項において同じ。）であつて、基金の地区内に住所を有する者をもつて組織する。\n2　職能型基金は、第1号被保険者であつて、基金の地区内において同種の事業又は業務に従事する者をもつて組織する。\n3　前2項に規定する者は、加入員たる資格を有する者という。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [10], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第1款　通則"], "orig": "（組織）\n第百十六条　地域型基金は、第一号被保険者（第八十九条第一項、第九十条第一項又は第九十条の三第一項の規定により保険料を納付することを要しないものとされている者、第九十条の二第一項から第三項までの規定によりその一部の額につき保険料を納付することを要しないものとされている者及び農業者年金の被保険者を除く。次項及び第百二十七条第一項において同じ。\n）であつて、基金の地区内に住所を有する者をもつて組織する。\n２　職能型基金は、第一号被保険者であつて、基金の地区内において同種の事業又は業務に従事する者をもつて組織する。\n３　前二項に規定する者は、加入員たる資格を有する者という。", "ch": 9}, {"key": "h117", "num": [117], "label": "第117条", "caption": "法人格", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（法人格）\n第117条　基金は、法人とする。\n2　基金の住所は、その主たる事務所の所在地にあるものとする。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [11], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第1款　通則"], "orig": "（法人格）\n第百十七条　基金は、法人とする。\n２　基金の住所は、その主たる事務所の所在地にあるものとする。", "ch": 9}, {"key": "h118", "num": [118], "label": "第118条", "caption": "名称", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（名称）\n第118条　基金は、その名称中に国民年金基金という文字を用いなければならない。\n2　基金でない者は、国民年金基金という名称を用いてはならない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [12], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第1款　通則"], "orig": "（名称）\n第百十八条　基金は、その名称中に国民年金基金という文字を用いなければならない。\n２　基金でない者は、国民年金基金という名称を用いてはならない。", "ch": 9}, {"key": "h118-2", "num": [118, 2], "label": "第118条の2", "caption": "地区", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（地区）\n第118条の2　基金の地区は、地域型基金にあつては、1（第137条の3の規定による吸収合併後存続する地域型基金にあつては、1以上）の都道府県の区域の全部とし、職能型基金にあつては、全国とする。\n2　地域型基金は、都道府県につき1個とし、職能型基金は、同種の事業又は業務につき全国を通じて1個とする。", "bg": "【2016年・平成28年法律66号】基金の運営をより合理的にし、加入員の利便性も高めるには、組織を再編できる仕組みが必要だった。そこで合併・分割の手続を法律で定め、再編の道を開いた。※条文固有の質疑は未照合。", "deb": "【法案概要・一次資料／実際の質疑ではない】2016年改正で国民年金基金の合併・分割の規定を整備。※条文固有の国会質疑・政府答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度資料】2016年確定拠出年金法等改正の概要（合併・分割規定）。", "kako": "—", "rows": [13], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第1款　通則"], "orig": "（地区）\n第百十八条の二　基金の地区は、地域型基金にあつては、一（第百三十七条の三の規定による吸収合併後存続する地域型基金にあつては、一以上）の都道府県の区域の全部とし、職能型基金にあつては、全国とする。\n２　地域型基金は、都道府県につき一個とし、職能型基金は、同種の事業又は業務につき全国を通じて一個とする。", "ch": 9}, {"key": "h119", "num": [119], "label": "第119条", "caption": "設立委員等", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（設立委員等）\n第119条　地域型基金を設立するには、加入員たる資格を有する者及び年金に関する学識経験を有する者のうちから厚生労働大臣が任命した者が設立委員とならなければならない。\n2　前項の設立委員の任命は、300人以上の加入員たる資格を有する者が厚生労働大臣に地域型基金の設立を希望する旨の申出を行つた場合に行うものとする。\n3　職能型基金を設立するには、その加入員となろうとする15人以上の者が発起人とならなければならない。\n4　地域型基金は、1000人以上の加入員がなければ設立することができない。\n5　職能型基金は、3000人以上の加入員がなければ設立することができない。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [15], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第2款　設立"], "orig": "（設立委員等）\n第百十九条　地域型基金を設立するには、加入員たる資格を有する者及び年金に関する学識経験を有する者のうちから厚生労働大臣が任命した者が設立委員とならなければならない。\n２　前項の設立委員の任命は、三百人以上の加入員たる資格を有する者が厚生労働大臣に地域型基金の設立を希望する旨の申出を行つた場合に行うものとする。\n３　職能型基金を設立するには、その加入員となろうとする十五人以上の者が発起人とならなければならない。\n４　地域型基金は、千人以上の加入員がなければ設立することができない。\n５　職能型基金は、三千人以上の加入員がなければ設立することができない。", "ch": 9}, {"key": "h119-2", "num": [119, 2], "label": "第119条の2", "caption": "創立総会", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（創立総会）\n第119条の2　設立委員又は発起人（以下「設立委員等」という。）は、規約を作成し、創立総会の日時及び場所とともに公告して、創立総会を開かなければならない。\n2　前項の公告は、会日の2週間前までにしなければならない。\n3　設立委員等が作成した規約の承認その他設立に必要な事項の決定は、創立総会の議決によらなければならない。\n4　創立総会においては、前項の規約を修正することができる。ただし、地区及び加入員に関する規定については、この限りでない。\n5　創立総会の議事は、加入員たる資格を有する者であつてその会日までに設立委員等に対し設立の同意を申し出たものの半数以上が出席して、その出席者の3分の2以上で決する。\n6　前各項に定めるもののほか、議事の手続その他創立総会に関し必要な事項は、政令で定める。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [16], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第2款　設立"], "orig": "（創立総会）\n第百十九条の二　設立委員又は発起人（以下「設立委員等」という。）は、規約を作成し、創立総会の日時及び場所とともに公告して、創立総会を開かなければならない。\n２　前項の公告は、会日の二週間前までにしなければならない。\n３　設立委員等が作成した規約の承認その他設立に必要な事項の決定は、創立総会の議決によらなければならない。\n４　創立総会においては、前項の規約を修正することができる。ただし、地区及び加入員に関する規定については、この限りでない。\n５　創立総会の議事は、加入員たる資格を有する者であつてその会日までに設立委員等に対し設立の同意を申し出たものの半数以上が出席して、その出席者の三分の二以上で決する。\n６　前各項に定めるもののほか、議事の手続その他創立総会に関し必要な事項は、政令で定める。", "ch": 9}, {"key": "h119-3", "num": [119, 3], "label": "第119条の3", "caption": "設立の認可", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（設立の認可）\n第119条の3　設立委員等は、創立総会の終了後遅滞なく、規約その他必要な事項を記載した書面を厚生労働大臣に提出して、設立の認可を受けなければならない。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [17], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第2款　設立"], "orig": "（設立の認可）\n第百十九条の三　設立委員等は、創立総会の終了後遅滞なく、規約その他必要な事項を記載した書面を厚生労働大臣に提出して、設立の認可を受けなければならない。", "ch": 9}, {"key": "h119-4", "num": [119, 4], "label": "第119条の4", "caption": "成立の時期", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（成立の時期）\n第119条の4　基金は、設立の認可を受けた時に成立する。\n2　第119条の2第5項の設立の同意を申し出た者は、基金が成立したときは、その成立の日に加入員の資格を取得するものとする。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [18], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第2款　設立"], "orig": "（成立の時期）\n第百十九条の四　基金は、設立の認可を受けた時に成立する。\n２　第百十九条の二第五項の設立の同意を申し出た者は、基金が成立したときは、その成立の日に加入員の資格を取得するものとする。", "ch": 9}, {"key": "h119-5", "num": [119, 5], "label": "第119条の5", "caption": "理事長への事務引継", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（理事長への事務引継）\n第119条の5　設立の認可があつたときは、設立委員等は、遅滞なく、その事務を理事長に引き継がなければならない。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [19], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第2款　設立"], "orig": "（理事長への事務引継）\n第百十九条の五　設立の認可があつたときは、設立委員等は、遅滞なく、その事務を理事長に引き継がなければならない。", "ch": 9}, {"key": "h120", "num": [120], "label": "第120条", "caption": "規約", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（規約）\n第120条　基金は、規約をもつて次に掲げる事項を定めなければならない。\n1　名称\n2　事務所の所在地\n3　地区\n4　代議員及び代議員会に関する事項\n5　役員に関する事項\n6　加入員に関する事項\n7　年金及び一時金に関する事項\n8　掛金に関する事項\n9　資産の管理その他財務に関する事項\n10　解散及び清算に関する事項\n11　業務の委託に関する事項\n12　公告に関する事項\n13　その他組織及び業務に関する重要事項\n2　職能型基金の規約には、前項に掲げる事項のほか、その設立に係る事業又は業務の種類を定めなければならない。\n3　前2項の規約の変更（政令で定める事項に係るものを除く。）は、厚生労働大臣の認可を受けなければ、その効力を生じない。\n4　基金は、前項の政令で定める事項に係る規約の変更をしたときは、遅滞なく、これを厚生労働大臣に届け出なければならない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [21], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第3款　管理"], "orig": "（規約）\n第百二十条　基金は、規約をもつて次に掲げる事項を定めなければならない。\n一　名称\n二　事務所の所在地\n三　地区\n四　代議員及び代議員会に関する事項\n五　役員に関する事項\n六　加入員に関する事項\n七　年金及び一時金に関する事項\n八　掛金に関する事項\n九　資産の管理その他財務に関する事項\n十　解散及び清算に関する事項\n十一　業務の委託に関する事項\n十二　公告に関する事項\n十三　その他組織及び業務に関する重要事項\n２　職能型基金の規約には、前項に掲げる事項のほか、その設立に係る事業又は業務の種類を定めなければならない。\n３　前二項の規約の変更（政令で定める事項に係るものを除く。）は、厚生労働大臣の認可を受けなければ、その効力を生じない。\n４　基金は、前項の政令で定める事項に係る規約の変更をしたときは、遅滞なく、これを厚生労働大臣に届け出なければならない。", "ch": 9}, {"key": "h121", "num": [121], "label": "第121条", "caption": "公告", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（公告）\n第121条　基金は、政令の定めるところにより、基金の名称、事務所の所在地、役員の氏名その他政令で定める事項を公告しなければならない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [22], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第3款　管理"], "orig": "（公告）\n第百二十一条　基金は、政令の定めるところにより、基金の名称、事務所の所在地、役員の氏名その他政令で定める事項を公告しなければならない。", "ch": 9}, {"key": "h122", "num": [122], "label": "第122条", "caption": "代議員会", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（代議員会）\n第122条　基金に、代議員会を置く。\n2　代議員会は、代議員をもつて組織する。\n3　代議員は、規約の定めるところにより、加入員のうちから選任する。\n4　設立当時の代議員は、創立総会において、第119条の2第5項の設立の同意を申し出た者のうちから選挙する。\n5　代議員の任期は、3年を超えない範囲内で規約で定める期間とする。ただし、補欠の代議員の任期は、前任者の残任期間とする。\n6　代議員会は、理事長が招集する。代議員の定数の3分の1以上の者が会議に付議すべき事項及び招集の理由を記載した書面を理事長に提出して代議員会の招集を請求したときは、理事長は、その請求のあつた日から20日以内に代議員会を招集しなければならない。\n7　代議員会に議長を置く。議長は、理事長をもつて充てる。\n8　前各項に定めるもののほか、代議員会の招集、議事の手続その他代議員会に関し必要な事項は、政令で定める。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [23], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第3款　管理"], "orig": "（代議員会）\n第百二十二条　基金に、代議員会を置く。\n２　代議員会は、代議員をもつて組織する。\n３　代議員は、規約の定めるところにより、加入員のうちから選任する。\n４　設立当時の代議員は、創立総会において、第百十九条の二第五項の設立の同意を申し出た者のうちから選挙する。\n５　代議員の任期は、三年を超えない範囲内で規約で定める期間とする。ただし、補欠の代議員の任期は、前任者の残任期間とする。\n６　代議員会は、理事長が招集する。代議員の定数の三分の一以上の者が会議に付議すべき事項及び招集の理由を記載した書面を理事長に提出して代議員会の招集を請求したときは、理事長は、その請求のあつた日から二十日以内に代議員会を招集しなければならない。\n７　代議員会に議長を置く。議長は、理事長をもつて充てる。\n８　前各項に定めるもののほか、代議員会の招集、議事の手続その他代議員会に関し必要な事項は、政令で定める。", "ch": 9}, {"key": "h123", "num": [123], "label": "第123条", "caption": "", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "〔学習用見出し：基金の代議員会の議決事項〕\n第123条　次に掲げる事項は、代議員会の議決を経なければならない。\n1　規約の変更\n2　毎事業年度の予算\n3　毎事業年度の事業報告及び決算\n4　その他規約で定める事項\n2　理事長は、代議員会が成立しないとき、又は理事長において代議員会を招集する暇がないと認めるときは、代議員会の議決を経なければならない事項で臨時急施を要するものを処分することができる。\n3　理事長は、前項の規定による処置については、次の代議員会においてこれを報告し、その承認を求めなければならない。\n4　代議員会は、監事に対し、基金の業務に関する監査を求め、その結果の報告を請求することができる。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [24], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第3款　管理"], "orig": "第百二十三条　次に掲げる事項は、代議員会の議決を経なければならない。\n一　規約の変更\n二　毎事業年度の予算\n三　毎事業年度の事業報告及び決算\n四　その他規約で定める事項\n２　理事長は、代議員会が成立しないとき、又は理事長において代議員会を招集する暇がないと認めるときは、代議員会の議決を経なければならない事項で臨時急施を要するものを処分することができる。\n３　理事長は、前項の規定による処置については、次の代議員会においてこれを報告し、その承認を求めなければならない。\n４　代議員会は、監事に対し、基金の業務に関する監査を求め、その結果の報告を請求することができる。", "ch": 9}, {"key": "h124", "num": [124], "label": "第124条", "caption": "役員", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（役員）\n第124条　基金に、役員として理事及び監事を置く。\n2　理事は、代議員において互選する。ただし、理事の定数の3分の1（第137条の3の規定による吸収合併によりその地区を全国とした地域型基金にあつては、2分の1）を超えない範囲内については、代議員会において、基金の業務の適正な運営に必要な学識経験を有する者のうちから選挙することができる。\n3　設立当時の理事は、創立総会において、第119条の2第5項の設立の同意を申し出た者のうちから選挙する。ただし、理事の定数の3分の1を超えない範囲内については、年金に関する学識経験を有する者のうちから選挙することができる。\n4　理事のうち1人を理事長とし、理事が選挙する。\n5　監事は、代議員会において、学識経験を有する者及び代議員のうちから、それぞれ1人を選挙する。\n6　設立当時の監事は、創立総会において、学識経験を有する者及び第119条の2第5項の設立の同意を申し出た者のうちから、それぞれ1人を選挙する。\n7　役員の任期は、3年を超えない範囲内で規約で定める期間とする。ただし、補欠の役員の任期は、前任者の残任期間とする。\n8　役員は、その任期が満了しても、後任の役員が就任するまでの間は、なお、その職務を行う。\n9　監事は、理事又は基金の職員と兼ねることができない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [25], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第3款　管理"], "orig": "（役員）\n第百二十四条　基金に、役員として理事及び監事を置く。\n２　理事は、代議員において互選する。ただし、理事の定数の三分の一（第百三十七条の三の規定による吸収合併によりその地区を全国とした地域型基金にあつては、二分の一）を超えない範囲内については、代議員会において、基金の業務の適正な運営に必要な学識経験を有する者のうちから選挙することができる。\n３　設立当時の理事は、創立総会において、第百十九条の二第五項の設立の同意を申し出た者のうちから選挙する。ただし、理事の定数の三分の一を超えない範囲内については、年金に関する学識経験を有する者のうちから選挙することができる。\n４　理事のうち一人を理事長とし、理事が選挙する。\n５　監事は、代議員会において、学識経験を有する者及び代議員のうちから、それぞれ一人を選挙する。\n６　設立当時の監事は、創立総会において、学識経験を有する者及び第百十九条の二第五項の設立の同意を申し出た者のうちから、それぞれ一人を選挙する。\n７　役員の任期は、三年を超えない範囲内で規約で定める期間とする。ただし、補欠の役員の任期は、前任者の残任期間とする。\n８　役員は、その任期が満了しても、後任の役員が就任するまでの間は、なお、その職務を行う。\n９　監事は、理事又は基金の職員と兼ねることができない。", "ch": 9}, {"key": "h125", "num": [125], "label": "第125条", "caption": "役員の職務", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（役員の職務）\n第125条　理事長は、基金を代表し、その業務を執行する。理事長に事故があるとき、又は理事長が欠けたときは、理事のうちから、あらかじめ理事長が指定する者がその職務を代理し、又はその職務を行なう。\n2　基金の業務は、規約に別段の定めがある場合を除くほか、理事の過半数により決し、可否同数のときは、理事長の決するところによる。\n3　理事は、理事長の定めるところにより、理事長を補佐して、年金及び一時金に充てるべき積立金（以下「積立金」という。）の管理及び運用に関する基金の業務を執行することができる。\n4　監事は、基金の業務を監査する。\n5　監事は、監査の結果に基づき、必要があると認めるときは、理事長又は代議員会に意見を提出することができる。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [26], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第3款　管理"], "orig": "（役員の職務）\n第百二十五条　理事長は、基金を代表し、その業務を執行する。理事長に事故があるとき、又は理事長が欠けたときは、理事のうちから、あらかじめ理事長が指定する者がその職務を代理し、又はその職務を行なう。\n２　基金の業務は、規約に別段の定めがある場合を除くほか、理事の過半数により決し、可否同数のときは、理事長の決するところによる。\n３　理事は、理事長の定めるところにより、理事長を補佐して、年金及び一時金に充てるべき積立金（以下「積立金」という。）の管理及び運用に関する基金の業務を執行することができる。\n４　監事は、基金の業務を監査する。\n５　監事は、監査の結果に基づき、必要があると認めるときは、理事長又は代議員会に意見を提出することができる。", "ch": 9}, {"key": "h125-2", "num": [125, 2], "label": "第125条の2", "caption": "理事の義務及び損害賠償責任", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（理事の義務及び損害賠償責任）\n第125条の2　理事は、前条第3項に規定する基金の業務について、法令、法令に基づいてする厚生労働大臣の処分、規約及び代議員会の議決を遵守し、基金のため忠実にその職務を遂行しなければならない。\n2　理事が前条第3項に規定する基金の業務についてその任務を怠つたときは、その理事は、基金に対し連帯して損害賠償の責めに任ずる。", "bg": "【1996年・平成8年法律107号】加入員の積立金を預かる以上、運用に携わる理事の責任を曖昧にはできない。忠実義務や利益相反・責任に関する規律を設けた改正注記を確認できる。※改正時の個別質疑は未照合。", "deb": "—", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [27], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第3款　管理"], "orig": "（理事の義務及び損害賠償責任）\n第百二十五条の二　理事は、前条第三項に規定する基金の業務について、法令、法令に基づいてする厚生労働大臣の処分、規約及び代議員会の議決を遵守し、基金のため忠実にその職務を遂行しなければならない。\n２　理事が前条第三項に規定する基金の業務についてその任務を怠つたときは、その理事は、基金に対し連帯して損害賠償の責めに任ずる。", "ch": 9}, {"key": "h125-3", "num": [125, 3], "label": "第125条の3", "caption": "理事の禁止行為等", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（理事の禁止行為等）\n第125条の3　理事は、自己又は当該基金以外の第3者の利益を図る目的をもつて、積立金の管理及び運用の適正を害するものとして厚生労働省令で定める行為をしてはならない。\n2　基金は、前項の規定に違反した理事を、規約の定めるところにより、代議員会の議決を経て、交代させることができる。", "bg": "【1996年・平成8年法律107号】加入員の積立金を預かる以上、運用に携わる理事の責任を曖昧にはできない。忠実義務や利益相反・責任に関する規律を設けた改正注記を確認できる。※改正時の個別質疑は未照合。", "deb": "—", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [28], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第3款　管理"], "orig": "（理事の禁止行為等）\n第百二十五条の三　理事は、自己又は当該基金以外の第三者の利益を図る目的をもつて、積立金の管理及び運用の適正を害するものとして厚生労働省令で定める行為をしてはならない。\n２　基金は、前項の規定に違反した理事を、規約の定めるところにより、代議員会の議決を経て、交代させることができる。", "ch": 9}, {"key": "h125-4", "num": [125, 4], "label": "第125条の4", "caption": "理事長の代表権の制限", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（理事長の代表権の制限）\n第125条の4　基金と理事長（第125条第1項の規定により理事長の職務を代理し、又はその職務を行う者を含む。以下この条において同じ。）との利益が相反する事項については、理事長は、代表権を有しない。この場合においては、学識経験を有する者のうちから選任された監事が基金を代表する。", "bg": "【1996年・平成8年法律107号】加入員の積立金を預かる以上、運用に携わる理事の責任を曖昧にはできない。忠実義務や利益相反・責任に関する規律を設けた改正注記を確認できる。※改正時の個別質疑は未照合。", "deb": "—", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [29], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第3款　管理"], "orig": "（理事長の代表権の制限）\n第百二十五条の四　基金と理事長（第百二十五条第一項の規定により理事長の職務を代理し、又はその職務を行う者を含む。以下この条において同じ。）との利益が相反する事項については、理事長は、代表権を有しない。この場合においては、学識経験を有する者のうちから選任された監事が基金を代表する。", "ch": 9}, {"key": "h126", "num": [126], "label": "第126条", "caption": "基金の役員及び職員の公務員たる性質", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（基金の役員及び職員の公務員たる性質）\n第126条　基金の役員及び基金に使用され、その事務に従事する者は、刑法その他の罰則の適用については、法令により公務に従事する職員とみなす。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [30], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第3款　管理"], "orig": "（基金の役員及び職員の公務員たる性質）\n第百二十六条　基金の役員及び基金に使用され、その事務に従事する者は、刑法その他の罰則の適用については、法令により公務に従事する職員とみなす。", "ch": 9}, {"key": "h127", "num": [127], "label": "第127条", "caption": "加入員", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（加入員）\n第127条　第1号被保険者は、その者が住所を有する地区に係る地域型基金又はその従事する事業若しくは業務に係る職能型基金に申し出て、その加入員となることができる。ただし、他の基金の加入員であるときは、この限りでない。\n2　前項の申出をした者は、その申出をした日に加入員の資格を取得するものとする。\n3　加入員は、次の各号のいずれかに該当するに至つた日の翌日（第1号又は第4号に該当するに至つたときは、その日とし、第3号に該当するに至つたときは、当該保険料を納付することを要しないものとされた月の初日とする。）に、加入員の資格を喪失する。\n1　被保険者の資格を喪失したとき、又は第2号被保険者若しくは第3号被保険者となつたとき。\n2　地域型基金の加入員にあつては、当該基金の地区内に住所を有する者でなくなつたとき、職能型基金の加入員にあつては、当該事業又は業務に従事する者でなくなつたとき。\n3　第89条第1項、第90条第1項又は第90条の3第1項の規定により保険料を納付することを要しないものとされたとき及び第90条の2第1項から第3項までの規定によりその一部の額につき保険料を納付することを要しないものとされたとき。\n4　農業者年金の被保険者となつたとき。\n5　当該基金が解散したとき。\n4　加入員の資格を取得した月にその資格を喪失した者は、その資格を取得した日にさかのぼつて、加入員でなかつたものとみなす。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "平成29年、令和2年、令和3年、令和6年", "rows": [32], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第4款　加入員"], "orig": "（加入員）\n第百二十七条　第一号被保険者は、その者が住所を有する地区に係る地域型基金又はその従事する事業若しくは業務に係る職能型基金に申し出て、その加入員となることができる。ただし、他の基金の加入員であるときは、この限りでない。\n２　前項の申出をした者は、その申出をした日に加入員の資格を取得するものとする。\n３　加入員は、次の各号のいずれかに該当するに至つた日の翌日（第一号又は第四号に該当するに至つたときは、その日とし、第三号に該当するに至つたときは、当該保険料を納付することを要しないものとされた月の初日とする。）に、加入員の資格を喪失する。\n一　被保険者の資格を喪失したとき、又は第二号被保険者若しくは第三号被保険者となつたとき。\n二　地域型基金の加入員にあつては、当該基金の地区内に住所を有する者でなくなつたとき、職能型基金の加入員にあつては、当該事業又は業務に従事する者でなくなつたとき。\n三　第八十九条第一項、第九十条第一項又は第九十条の三第一項の規定により保険料を納付することを要しないものとされたとき及び第九十条の二第一項から第三項までの規定によりその一部の額につき保険料を納付することを要しないものとされたとき。\n四　農業者年金の被保険者となつたとき。\n五　当該基金が解散したとき。\n４　加入員の資格を取得した月にその資格を喪失した者は、その資格を取得した日にさかのぼつて、加入員でなかつたものとみなす。", "ch": 9}, {"key": "h127-2", "num": [127, 2], "label": "第127条の2", "caption": "準用規定", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（準用規定）\n第127条の2　第12条第1項の規定は、加入員について、同条第2項の規定は、加入員の属する世帯の世帯主について準用する。この場合において、同条第1項中「市町村長」とあるのは「基金」と、同条第2項中「被保険者」とあるのは「加入員」と読み替えるものとする。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [33], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第4款　加入員"], "orig": "（準用規定）\n第百二十七条の二　第十二条第一項の規定は、加入員について、同条第二項の規定は、加入員の属する世帯の世帯主について準用する。この場合において、同条第一項中「市町村長」とあるのは「基金」と、同条第二項中「被保険者」とあるのは「加入員」と読み替えるものとする。", "ch": 9}, {"key": "h128", "num": [128], "label": "第128条", "caption": "基金の業務", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（基金の業務）\n第128条　基金は、加入員又は加入員であつた者に対し、年金の支給を行ない、あわせて加入員又は加入員であつた者の死亡に関し、一時金の支給を行なうものとする。\n2　基金は、加入員及び加入員であつた者の福祉を増進するため、必要な施設をすることができる。\n3　基金は、信託会社（信託業法（平成16年法律第154号）第3条又は第53条第1項の免許を受けたものに限る。以下同じ。）、信託業務を営む金融機関（金融機関の信託業務の兼営等に関する法律（昭和18年法律第43号）第1条第1項の認可を受けた金融機関をいう。以下同じ。）、生命保険会社、農業協同組合連合会（全国を地区とし、農業協同組合法（昭和22年法律第132号）第10条第1項第10号の事業を行うものに限る。以下同じ。）若しくは共済水産業協同組合連合会（全国を地区とするものに限る。以下同じ。）又は金融商品取引業者（金融商品取引法（昭和23年法律第25号）第2条第9項に規定する金融商品取引業者をいう。\n以下同じ。）と、当該基金が支給する年金又は一時金に要する費用に関して信託、保険若しくは共済の契約又は投資一任契約（同条第8項第12号ロに規定する契約をいう。以下同じ。）を締結するときは、政令の定めるところによらなければならない。\n4　信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会若しくは共済水産業協同組合連合会又は金融商品取引業者は、正当な理由がある場合を除き、前項に規定する契約（運用方法を特定する信託の契約であつて、政令で定めるものを除く。）の締結を拒絶してはならない。\n5　基金は、政令で定めるところにより、厚生労働大臣の認可を受けて、その業務（加入員又は加入員であつた者に年金又は一時金の支給を行うために必要となるその者に関する情報の収集、整理又は分析を含む。）の一部を信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会、共済水産業協同組合連合会、国民年金基金連合会その他の法人に委託することができる。\n6　銀行その他の政令で定める金融機関は、他の法律の規定にかかわらず、前項の業務（第127条第1項の申出の受理に関する業務に限る。）を受託することができる。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "平成29年、令和2年、令和3年、令和4年、令和6年", "rows": [35], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第5款　基金の行う業務"], "orig": "（基金の業務）\n第百二十八条　基金は、加入員又は加入員であつた者に対し、年金の支給を行ない、あわせて加入員又は加入員であつた者の死亡に関し、一時金の支給を行なうものとする。\n２　基金は、加入員及び加入員であつた者の福祉を増進するため、必要な施設をすることができる。\n３　基金は、信託会社（信託業法（平成十六年法律第百五十四号）第三条又は第五十三条第一項の免許を受けたものに限る。以下同じ。）、信託業務を営む金融機関（金融機関の信託業務の兼営等に関する法律（昭和十八年法律第四十三号）第一条第一項の認可を受けた金融機関をいう。以下同じ。\n）、生命保険会社、農業協同組合連合会（全国を地区とし、農業協同組合法（昭和二十二年法律第百三十二号）第十条第一項第十号の事業を行うものに限る。以下同じ。）若しくは共済水産業協同組合連合会（全国を地区とするものに限る。以下同じ。）又は金融商品取引業者（金融商品取引法（昭和二十三年法律第二十五号）第二条第九項に規定する金融商品取引業者をいう。\n以下同じ。）と、当該基金が支給する年金又は一時金に要する費用に関して信託、保険若しくは共済の契約又は投資一任契約（同条第八項第十二号ロに規定する契約をいう。以下同じ。）を締結するときは、政令の定めるところによらなければならない。\n４　信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会若しくは共済水産業協同組合連合会又は金融商品取引業者は、正当な理由がある場合を除き、前項に規定する契約（運用方法を特定する信託の契約であつて、政令で定めるものを除く。）の締結を拒絶してはならない。\n５　基金は、政令で定めるところにより、厚生労働大臣の認可を受けて、その業務（加入員又は加入員であつた者に年金又は一時金の支給を行うために必要となるその者に関する情報の収集、整理又は分析を含む。）の一部を信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会、共済水産業協同組合連合会、\n国民年金基金連合会その他の法人に委託することができる。\n６　銀行その他の政令で定める金融機関は、他の法律の規定にかかわらず、前項の業務（第百二十七条第一項の申出の受理に関する業務に限る。）を受託することができる。", "ch": 9}, {"key": "h128-2", "num": [128, 2], "label": "第128条の2", "caption": "年金数理", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（年金数理）\n第128条の2　基金は、適正な年金数理に基づいてその業務を行わなければならない。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [36], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第5款　基金の行う業務"], "orig": "（年金数理）\n第百二十八条の二　基金は、適正な年金数理に基づいてその業務を行わなければならない。", "ch": 9}, {"key": "h129", "num": [129], "label": "第129条", "caption": "基金の給付の基準", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（基金の給付の基準）\n第129条　基金が支給する年金は、少なくとも、当該基金の加入員であつた者が老齢基礎年金の受給権を取得したときには、その者に支給されるものでなければならない。\n2　老齢基礎年金の受給権者に対し基金が支給する年金は、当該老齢基礎年金の受給権の消滅事由以外の事由によつて、その受給権を消滅させるものであつてはならない。\n3　基金が支給する一時金は、少なくとも、当該基金の加入員又は加入員であつた者が死亡した場合において、その遺族が死亡一時金を受けたときには、その遺族に支給されるものでなければならない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "令和元年、令和4年", "rows": [37], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第5款　基金の行う業務"], "orig": "（基金の給付の基準）\n第百二十九条　基金が支給する年金は、少なくとも、当該基金の加入員であつた者が老齢基礎年金の受給権を取得したときには、その者に支給されるものでなければならない。\n２　老齢基礎年金の受給権者に対し基金が支給する年金は、当該老齢基礎年金の受給権の消滅事由以外の事由によつて、その受給権を消滅させるものであつてはならない。\n３　基金が支給する一時金は、少なくとも、当該基金の加入員又は加入員であつた者が死亡した場合において、その遺族が死亡一時金を受けたときには、その遺族に支給されるものでなければならない。", "ch": 9}, {"key": "h130", "num": [130], "label": "第130条", "caption": "", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "〔学習用見出し：基金の年金額〕\n第130条　基金が支給する年金は、政令の定めるところにより、その額が算定されるものでなければならない。\n2　老齢基礎年金の受給権者に対し基金が支給する年金の額は、200円（第28条又は附則第9条の2若しくは第9条の2の2の規定による老齢基礎年金の受給権者に対し基金が支給する年金については、政令で定める額。以下同じ。）に納付された掛金に係る当該基金の加入員であつた期間（第87条の規定による保険料に係る保険料納付済期間である期間に限る。\n以下「加入員期間」という。）の月数を乗じて得た額を超えるものでなければならない。\n3　基金が支給する一時金の額は、8500円を超えるものでなければならない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [38], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第5款　基金の行う業務"], "orig": "第百三十条　基金が支給する年金は、政令の定めるところにより、その額が算定されるものでなければならない。\n２　老齢基礎年金の受給権者に対し基金が支給する年金の額は、二百円（第二十八条又は附則第九条の二若しくは第九条の二の二の規定による老齢基礎年金の受給権者に対し基金が支給する年金については、政令で定める額。以下同じ。）に納付された掛金に係る当該基金の加入員であつた期間（第八十七条の規定による保険料に係る保険料納付済期間である期間に限る。\n以下「加入員期間」という。）の月数を乗じて得た額を超えるものでなければならない。\n３　基金が支給する一時金の額は、八千五百円を超えるものでなければならない。", "ch": 9}, {"key": "h131", "num": [131], "label": "第131条", "caption": "", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "〔学習用見出し：基金の年金の支給停止制限〕\n第131条　老齢基礎年金の受給権者に対し基金が支給する年金は、当該老齢基礎年金がその全額につき支給を停止されている場合を除いては、その支給を停止することができない。ただし、当該年金の額のうち、200円に当該基金に係る加入員期間の月数を乗じて得た額を超える部分については、この限りでない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [39], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第5款　基金の行う業務"], "orig": "第百三十一条　老齢基礎年金の受給権者に対し基金が支給する年金は、当該老齢基礎年金がその全額につき支給を停止されている場合を除いては、その支給を停止することができない。ただし、当該年金の額のうち、二百円に当該基金に係る加入員期間の月数を乗じて得た額を超える部分については、この限りでない。", "ch": 9}, {"key": "h131-2", "num": [131, 2], "label": "第131条の2", "caption": "積立金の積立て", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（積立金の積立て）\n第131条の2　基金は、政令の定めるところにより、積立金を積み立てなければならない。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [40], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第5款　基金の行う業務"], "orig": "（積立金の積立て）\n第百三十一条の二　基金は、政令の定めるところにより、積立金を積み立てなければならない。", "ch": 9}, {"key": "h132", "num": [132], "label": "第132条", "caption": "資金の運用等", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（資金の運用等）\n第132条　基金の積立金の運用は、政令の定めるところにより、安全かつ効率的にしなければならない。\n2　基金の業務上の余裕金の運用は、政令の定めるところにより、基金の業務の目的及び資金の性質に応じ、安全かつ効率的にしなければならない。\n3　基金は、事業年度その他その財務に関しては、前条及び前2項の規定によるほか、政令の定めるところによらなければならない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [41], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第5款　基金の行う業務"], "orig": "（資金の運用等）\n第百三十二条　基金の積立金の運用は、政令の定めるところにより、安全かつ効率的にしなければならない。\n２　基金の業務上の余裕金の運用は、政令の定めるところにより、基金の業務の目的及び資金の性質に応じ、安全かつ効率的にしなければならない。\n３　基金は、事業年度その他その財務に関しては、前条及び前二項の規定によるほか、政令の定めるところによらなければならない。", "ch": 9}, {"key": "h133", "num": [133], "label": "第133条", "caption": "準用規定", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（準用規定）\n第133条　第16条及び第24条の規定は、基金が支給する年金及び一時金を受ける権利について、第18条第1項及び第2項並びに第19条第1項及び第3項から第5項までの規定は、基金が支給する年金について、第21条の2の規定は、基金が支給する年金及び一時金について、第22条及び第23条の規定は、基金について、第25条、第70条後段及び第71条第1項の規定は、基金が支給する一時金について準用する。この場合において、第16条中「厚生労働大臣」とあるのは「基金」と、第21条の2中「支払うべき年金給付」とあるのは「支払うべき一時金」と、「年金給付の支払金」とあるのは「一時金の支払金」と、第24条中「老齢基礎年金」とあるのは「基金が支給する年金」と、第71条第1項中「被保険者又は被保険者であつた者」とあるのは「加入員又は加入員であつた者」と読み替えるものとする。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [42], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第5款　基金の行う業務"], "orig": "（準用規定）\n第百三十三条　第十六条及び第二十四条の規定は、基金が支給する年金及び一時金を受ける権利について、第十八条第一項及び第二項並びに第十九条第一項及び第三項から第五項までの規定は、基金が支給する年金について、第二十一条の二の規定は、基金が支給する年金及び一時金について、第二十二条及び第二十三条の規定は、基金について、第二十五条、\n第七十条後段及び第七十一条第一項の規定は、基金が支給する一時金について準用する。この場合において、第十六条中「厚生労働大臣」とあるのは「基金」と、第二十一条の二中「支払うべき年金給付」とあるのは「支払うべき一時金」と、「年金給付の支払金」とあるのは「一時金の支払金」と、第二十四条中「老齢基礎年金」とあるのは「基金が支給する年金」と、\n第七十一条第一項中「被保険者又は被保険者であつた者」とあるのは「加入員又は加入員であつた者」と読み替えるものとする。", "ch": 9}, {"key": "h134", "num": [134], "label": "第134条", "caption": "掛金", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（掛金）\n第134条　基金は、基金が支給する年金及び一時金に関する事業に要する費用に充てるため、掛金を徴収する。\n2　掛金は、年金の額の計算の基礎となる各月につき、徴収するものとする。\n3　掛金は、政令の定めるところにより、その額が算定されるものでなければならない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "平成29年", "rows": [44], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第6款　費用の負担"], "orig": "（掛金）\n第百三十四条　基金は、基金が支給する年金及び一時金に関する事業に要する費用に充てるため、掛金を徴収する。\n２　掛金は、年金の額の計算の基礎となる各月につき、徴収するものとする。\n３　掛金は、政令の定めるところにより、その額が算定されるものでなければならない。", "ch": 9}, {"key": "h134-2", "num": [134, 2], "label": "第134条の2", "caption": "準用規定", "status": null, "sheet": "第115～134条_基金の制度と給付", "scope": "honsoku", "text": "（準用規定）\n第134条の2　第88条の規定は、加入員について、第95条、第96条第1項から第5項まで、第97条及び第98条の規定は、掛金及び第133条において準用する第23条の規定による徴収金について準用する。この場合において、第88条及び第97条第1項中「保険料」とあるのは「掛金」と、第96条第1項、第2項、第4項及び第5項並びに第97条第1項中「厚生労働大臣」とあるのは「基金」と、「前条第1項」とあるのは「第134条の2において準用する前条第1項」と読み替えるものとする。\n2　基金は、前項において準用する第96条第4項の規定により国税滞納処分の例により処分をしようとするときは、厚生労働大臣の認可を受けなければならない。", "bg": "【1989年・平成元年法律86号】自営業者等の老後の備えを、どのように厚くできるか。第1号被保険者の保障充実と被用者年金との均衡を目指し、地域型・職能型の基金と基金連合会の制度を整えた。※条文固有の改正理由は個別未照合。", "deb": "【政府の改正方針・一次資料】1989年改正が目指したのは、上乗せ年金を自営業者等にも広げることだった。そのために地域型基金・連合会の仕組みを整えた。政府通知・当時の厚生白書を確認。※この条固有の質疑・答弁を確認したものではない。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度通知】平成元年12月22日 発年第69号／平成2年12月19日 年発第5853号（現行適用の改廃は未網羅照合）。", "kako": "—", "rows": [45], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第6款　費用の負担"], "orig": "（準用規定）\n第百三十四条の二　第八十八条の規定は、加入員について、第九十五条、第九十六条第一項から第五項まで、第九十七条及び第九十八条の規定は、掛金及び第百三十三条において準用する第二十三条の規定による徴収金について準用する。この場合において、第八十八条及び第九十七条第一項中「保険料」とあるのは「掛金」と、第九十六条第一項、第二項、\n第四項及び第五項並びに第九十七条第一項中「厚生労働大臣」とあるのは「基金」と、「前条第一項」とあるのは「第百三十四条の二において準用する前条第一項」と読み替えるものとする。\n２　基金は、前項において準用する第九十六条第四項の規定により国税滞納処分の例により処分をしようとするときは、厚生労働大臣の認可を受けなければならない。", "ch": 9}, {"key": "h135", "num": [135], "label": "第135条", "caption": "解散", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "（解散）\n第135条　基金は、次に掲げる理由により解散する。\n1　代議員の定数の4分の3以上の多数による代議員会の議決\n2　基金の事業の継続の不能\n3　第142条第5項の規定による解散の命令\n2　基金は、前項第1号又は第2号に掲げる理由により解散しようとするときは、厚生労働大臣の認可を受けなければならない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [8], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第7款　解散及び清算"], "orig": "（解散）\n第百三十五条　基金は、次に掲げる理由により解散する。\n一　代議員の定数の四分の三以上の多数による代議員会の議決\n二　基金の事業の継続の不能\n三　第百四十二条第五項の規定による解散の命令\n２　基金は、前項第一号又は第二号に掲げる理由により解散しようとするときは、厚生労働大臣の認可を受けなければならない。", "ch": 9}, {"key": "h136", "num": [136], "label": "第136条", "caption": "基金の解散による年金等の支給に関する義務の消滅", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "（基金の解散による年金等の支給に関する義務の消滅）\n第136条　基金は、解散したときは、当該基金の加入員であつた者に係る年金及び一時金の支給に関する義務を免れる。ただし、解散した日までに支給すべきであつた年金又は一時金でまだ支給していないものの支給に関する義務については、この限りでない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [9], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第7款　解散及び清算"], "orig": "（基金の解散による年金等の支給に関する義務の消滅）\n第百三十六条　基金は、解散したときは、当該基金の加入員であつた者に係る年金及び一時金の支給に関する義務を免れる。ただし、解散した日までに支給すべきであつた年金又は一時金でまだ支給していないものの支給に関する義務については、この限りでない。", "ch": 9}, {"key": "h136-2", "num": [136, 2], "label": "第136条の2", "caption": "清算中の基金の能力", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "（清算中の基金の能力）\n第136条の2　解散した基金は、清算の目的の範囲内において、その清算の結了に至るまではなお存続するものとみなす。", "bg": "【2006年・平成18年法律50号】法人の活動を終える場面にも、法的な手順が求められる。清算規律に関する条文が追加された。※改正の個別立法趣旨・質疑は未照合。", "deb": "—", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [10], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第7款　解散及び清算"], "orig": "（清算中の基金の能力）\n第百三十六条の二　解散した基金は、清算の目的の範囲内において、その清算の結了に至るまではなお存続するものとみなす。", "ch": 9}, {"key": "h137", "num": [137], "label": "第137条", "caption": "清算人等", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "（清算人等）\n第137条　基金が第135条第1項第1号又は第2号の規定により解散したときは、理事が、その清算人となる。ただし、代議員会において他人を選任したときは、この限りでない。\n2　次に掲げる場合には、厚生労働大臣が清算人を選任する。\n1　前項の規定により清算人となる者がないとき。\n2　基金が第135条第1項第3号の規定により解散したとき。\n3　清算人が欠けたため損害を生ずるおそれがあるとき。\n3　前項の場合において、清算人の職務の執行に要する費用は、基金が負担する。\n4　解散した基金の残余財産は、規約の定めるところにより、その解散した日において当該基金が年金の支給に関する義務を負つていた者（以下「解散基金加入員」という。）に分配しなければならない。", "bg": "【1969年・昭和44年法律86号】老後の備えに求めるものは、人によって異なる。そうした多様なニーズに応え、国民年金に上乗せする給付の枠組みとして基金制度を創設した。当初は職能型から始まった。\n【1989年改正】地域型の創設などによって、制度の裾野を広げた。※条文固有の質疑は未照合。", "deb": "【政策背景・当時の厚生白書】老後保障への需要は一様ではない。画一的な国民年金だけでは応えきれないという認識から、上乗せ制度が導入された。※個別議会答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [11], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第7款　解散及び清算"], "orig": "（清算人等）\n第百三十七条　基金が第百三十五条第一項第一号又は第二号の規定により解散したときは、理事が、その清算人となる。ただし、代議員会において他人を選任したときは、この限りでない。\n２　次に掲げる場合には、厚生労働大臣が清算人を選任する。\n一　前項の規定により清算人となる者がないとき。\n二　基金が第百三十五条第一項第三号の規定により解散したとき。\n三　清算人が欠けたため損害を生ずるおそれがあるとき。\n３　前項の場合において、清算人の職務の執行に要する費用は、基金が負担する。\n４　解散した基金の残余財産は、規約の定めるところにより、その解散した日において当該基金が年金の支給に関する義務を負つていた者（以下「解散基金加入員」という。）に分配しなければならない。", "ch": 9}, {"key": "h137-2", "num": [137, 2], "label": "第137条の2", "caption": "清算人の職務及び権限", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "（清算人の職務及び権限）\n第137条の2　清算人の職務は、次のとおりとする。\n1　現務の結了\n2　債権の取立て及び債務の弁済\n3　残余財産の分配\n2　清算人は、前項各号に掲げる職務を行うために必要な一切の行為をすることができる。", "bg": "【2006年・平成18年法律50号】法人の活動を終える場面にも、法的な手順が求められる。清算規律に関する条文が追加された。※改正の個別立法趣旨・質疑は未照合。", "deb": "—", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [12], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第7款　解散及び清算"], "orig": "（清算人の職務及び権限）\n第百三十七条の二　清算人の職務は、次のとおりとする。\n一　現務の結了\n二　債権の取立て及び債務の弁済\n三　残余財産の分配\n２　清算人は、前項各号に掲げる職務を行うために必要な一切の行為をすることができる。", "ch": 9}, {"key": "h137-2-2", "num": [137, 2, 2], "label": "第137条の2の2", "caption": "債権の申出の催告等", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "（債権の申出の催告等）\n第137条の2の2　清算人は、その就職の日から2箇月以内に、少なくとも3回の公告をもつて、債権者に対し、一定の期間内にその債権の申出をすべき旨の催告をしなければならない。この場合において、その期間は、2箇月を下ることができない。\n2　前項の公告には、債権者がその期間内に申出をしないときは清算から除斥されるべき旨を付記しなければならない。ただし、清算人は、知れている債権者を除斥することができない。\n3　清算人は、知れている債権者には、各別にその申出の催告をしなければならない。\n4　第1項の公告は、官報に掲載してする。", "bg": "【2006年・平成18年法律50号】法人の活動を終える場面にも、法的な手順が求められる。清算規律に関する条文が追加された。※改正の個別立法趣旨・質疑は未照合。", "deb": "—", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [13], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第7款　解散及び清算"], "orig": "（債権の申出の催告等）\n第百三十七条の二の二　清算人は、その就職の日から二箇月以内に、少なくとも三回の公告をもつて、債権者に対し、一定の期間内にその債権の申出をすべき旨の催告をしなければならない。この場合において、その期間は、二箇月を下ることができない。\n２　前項の公告には、債権者がその期間内に申出をしないときは清算から除斥されるべき旨を付記しなければならない。ただし、清算人は、知れている債権者を除斥することができない。\n３　清算人は、知れている債権者には、各別にその申出の催告をしなければならない。\n４　第一項の公告は、官報に掲載してする。", "ch": 9}, {"key": "h137-2-3", "num": [137, 2, 3], "label": "第137条の2の3", "caption": "期間経過後の債権の申出", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "（期間経過後の債権の申出）\n第137条の2の3　前条第1項の期間の経過後に申出をした債権者は、基金の債務が完済された後まだ権利の帰属すべき者に引き渡されていない財産に対してのみ、請求をすることができる。", "bg": "【2006年・平成18年法律50号】法人の活動を終える場面にも、法的な手順が求められる。清算規律に関する条文が追加された。※改正の個別立法趣旨・質疑は未照合。", "deb": "—", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [14], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第7款　解散及び清算"], "orig": "（期間経過後の債権の申出）\n第百三十七条の二の三　前条第一項の期間の経過後に申出をした債権者は、基金の債務が完済された後まだ権利の帰属すべき者に引き渡されていない財産に対してのみ、請求をすることができる。", "ch": 9}, {"key": "h137-2-4", "num": [137, 2, 4], "label": "第137条の2の4", "caption": "準用規定等", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "（準用規定等）\n第137条の2の4　第126条の規定は、基金の清算人について準用する。\n2　この款に定めるもののほか、解散した基金の清算に関し必要な事項は、政令で定める。", "bg": "【2006年・平成18年法律50号】法人の活動を終える場面にも、法的な手順が求められる。清算規律に関する条文が追加された。※改正の個別立法趣旨・質疑は未照合。", "deb": "—", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。", "kako": "—", "rows": [15], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第7款　解散及び清算"], "orig": "（準用規定等）\n第百三十七条の二の四　第百二十六条の規定は、基金の清算人について準用する。\n２　この款に定めるもののほか、解散した基金の清算に関し必要な事項は、政令で定める。", "ch": 9}, {"key": "h137-3", "num": [137, 3], "label": "第137条の3", "caption": "", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "〔学習用見出し：基金の吸収合併〕\n第137条の3　基金は、厚生労働大臣の認可を受けて、他の基金と吸収合併（基金が他の基金とする合併であつて、合併により消滅する基金の権利義務の全部を合併後存続する基金に承継させるものをいう。以下この目において同じ。）をすることができる。ただし、地域型基金と職能型基金との吸収合併については、その地区が全国である地域型基金が次条に規定する吸収合併存続基金となる場合を除き、これをすることができない。\n2　合併をする基金は、吸収合併契約を締結しなければならない。", "bg": "【2016年・平成28年法律66号】基金の運営をより合理的にし、加入員の利便性も高めるには、組織を再編できる仕組みが必要だった。そこで合併・分割の手続を法律で定め、再編の道を開いた。※条文固有の質疑は未照合。", "deb": "【法案概要・一次資料／実際の質疑ではない】2016年改正で国民年金基金の合併・分割の規定を整備。※条文固有の国会質疑・政府答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度資料】2016年確定拠出年金法等改正の概要（合併・分割規定）。", "kako": "平成30年", "rows": [18], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第8款　合併及び分割", "第1目　合併"], "orig": "第百三十七条の三　基金は、厚生労働大臣の認可を受けて、他の基金と吸収合併（基金が他の基金とする合併であつて、合併により消滅する基金の権利義務の全部を合併後存続する基金に承継させるものをいう。以下この目において同じ。）をすることができる。ただし、地域型基金と職能型基金との吸収合併については、\nその地区が全国である地域型基金が次条に規定する吸収合併存続基金となる場合を除き、これをすることができない。\n２　合併をする基金は、吸収合併契約を締結しなければならない。", "ch": 9}, {"key": "h137-3-2", "num": [137, 3, 2], "label": "第137条の3の2", "caption": "", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "〔学習用見出し：吸収合併契約で定める事項〕\n第137条の3の2　基金が吸収合併をする場合には、吸収合併契約において、吸収合併後存続する基金（第137条の3の6及び第137条の3の15第1項において「吸収合併存続基金」という。）及び吸収合併により消滅する基金（第137条の3の6及び同項において「吸収合併消滅基金」という。）の名称及び主たる事務所の所在地その他厚生労働省令で定める事項を定めなければならない。", "bg": "【2016年・平成28年法律66号】基金の運営をより合理的にし、加入員の利便性も高めるには、組織を再編できる仕組みが必要だった。そこで合併・分割の手続を法律で定め、再編の道を開いた。※条文固有の質疑は未照合。", "deb": "【法案概要・一次資料／実際の質疑ではない】2016年改正で国民年金基金の合併・分割の規定を整備。※条文固有の国会質疑・政府答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度資料】2016年確定拠出年金法等改正の概要（合併・分割規定）。", "kako": "—", "rows": [19], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第8款　合併及び分割", "第1目　合併"], "orig": "第百三十七条の三の二　基金が吸収合併をする場合には、吸収合併契約において、吸収合併後存続する基金（第百三十七条の三の六及び第百三十七条の三の十五第一項において「吸収合併存続基金」という。）及び吸収合併により消滅する基金（第百三十七条の三の六及び同項において「吸収合併消滅基金」という。\n）の名称及び主たる事務所の所在地その他厚生労働省令で定める事項を定めなければならない。", "ch": 9}, {"key": "h137-3-3", "num": [137, 3, 3], "label": "第137条の3の3", "caption": "", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "〔学習用見出し：吸収合併契約に係る代議員会議決〕\n第137条の3の3　基金は、吸収合併契約について代議員会において代議員の定数の3分の2以上の多数により議決しなければならない。", "bg": "【2016年・平成28年法律66号】基金の運営をより合理的にし、加入員の利便性も高めるには、組織を再編できる仕組 律で定め、再編の道を開いた。※条文固有の質疑は未照合。", "deb": "【法案概要・一次資料／実際の質疑ではない】2016年改正で国民年金基金の合併・分割の規定を整備。※条文固有の国会質疑・政府答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度資料】2016年確定拠出年金法等改正の概要（合併・分割規定）。", "kako": "—", "rows": [22], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第8款　合併及び分割", "第1目　合併"], "orig": "第百三十七条の三の五　基金は、前条第一項の期間内に、その債権者に対し、異議があれば一定の期間内に述べるべき旨を公告し、かつ、知れている債権者に対しては、各別にこれを催告しなければならない。ただし、その期間は、二月を下ることができない。\n２　債権者が前項の期間内に吸収合併に対して異議を述べなかつたときは、吸収合併を承認したものとみなす。\n３　債権者が異議を述べたときは、基金は、これに弁済をし、若しくは相当の担保を提供し、又はその債権者に弁済を受けさせることを目的として信託会社若しくは信託業務を営む金融機関に相当の財産を信託しなければならない。ただし、吸収合併をしてもその債権者を害するおそれがないときは、この限りでない。", "ch": 9}, {"key": "h137-3-6", "num": [137, 3, 6], "label": "第137条の3の6", "caption": "", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "〔学習用見出し：吸収合併による権利義務の承継〕\n第137条の3の6　吸収合併存続基金は、第137条の3第1項の認可を受けた日に、吸収合併消滅基金の権利義務を承継する。", "bg": "【2016年・平成28年法律66号】基金の運営をより合理的にし、加入員の利便性も高めるには、組織を再編できる仕組みが必要だった。そこで合併・分割の手続を法律で定め、再編の道を開いた。※条文固有の質疑は未照合。", "deb": "【法案概要・一次資料／実際の質疑ではない】2016年改正で国民年金基金の合併・分割の規定を整備。※条文固有の国会質疑・政府答弁は未確認。", "tsu": "【公的法令】厚生労働省掲載の国民年金法本文（各項号・例外・読替えは原文照合）。\n【制度資料】2016年確定拠出年金法等改正の概要（合併・分割規定）。", "kako": "—", "rows": [23], "heads": ["第10章　国民年金基金及び国民年金基金連合会", "第1節　国民年金基金", "第8款　合併及び分割", "第1目　合併"], "orig": "第百三十七条の三の六　吸収合併存続基金は、第百三十七条の三第一項の認可を受けた日に、吸収合併消滅基金の権利義務を承継する。", "ch": 9}, {"key": "h137-3-7", "num": [137, 3, 7], "label": "第137条の3の7", "caption": "", "status": null, "sheet": "第135～137条の3系列_解散再編", "scope": "honsoku", "text": "〔学習用見出し：基金の吸収分割〕\n第137条の3の7　基金は、職能型基金が、その事業に関して有する権利義務であつて次項に規定する吸収分割承継基金となる地域型基金の地区に係るものを当該地域型基金に承継させる場合に限り、厚生労働大臣の認可を受けて、吸収分割（基金がその事業に関して有する権利義務の全部又は一部を分割後他の基金に承継させることをいう。以下同じ。）をすることができる。\n2　吸収分割をする基金（以下「吸収分割基金」という。）は、当該基金がその事業に関して有する権利義務の全部又は一部を当該基金から承継する基金（以下「吸収分割承継基金」という。）との間で、吸収分割契約を締結しなければならない。", "bg": "【2016年・平成28年法律66号】基金の運営をより合理的にし、加入員の利便性も高めるには、組織を再編できる仕組みが必要だった。そこで合併・分割の手続を法律で定め、再編の道を開いた。※条文固有の質疑は未照合。", "deb": "【法案概要・一次資料／実際の質疑ではない】2016年改正で国民年金基金の合併・分割の規定を整備。※条文固有の国会質疑・政府答弁は未確認。", "tsu": "【公的法
