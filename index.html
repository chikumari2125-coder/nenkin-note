達した日後であるときはその障害認定日において、障害等級に該当する程度の障害の状態にあるときは、その者に障害基礎年金を支給する。\n2　疾病にかかり、又は負傷し、その初診日において20歳未満であつた者（同日において被保険者でなかつた者に限る。）が、障害認定日以後に20歳に達したときは20歳に達した日後において、障害認定日が20歳に達した日後であるときはその障害認定日後において、その傷病により、65歳に達する日の前日までの間に、障害等級に該当する程度の障害の状態に該当するに至つたときは、その者は、その期間内に前項の障害基礎年金の支給を請求することができる。\n3　第30条の2第3項の規定は、前項の場合に準用する。", "bg": "【1985年改正・1986年施行】20歳前の障害を、拠出制の年金とどのように保障の面で接続するか。従来の障害福祉年金等の位置付けを見直し、20歳前に初診日がある場合にも障害基礎年金を支給。厚労省の制度史によれば従前の無拠出給付と拠出給付との給付水準格差の改善が狙い。\n【条文上の区別】1項の認定日請求／2項の事後重症請求（同項では初診日に被保険者でなかったことが必要）。非加入の20歳前傷病には納付要件なし。所得等に基づく支給制限は第36条の2以降で、混同しない。", "deb": "【1985年12月19日・参院農林水産委】障害基礎年金の財政負担に関し、20歳前の障害者を社会保障費用で保障すべきか、共済などの社会保険方式で担うべきかという質問があった。山内豊徳政府委員は、20歳前障害の保障をより手厚くするため、社会保険を基盤としつつ当時の国庫負担を上乗せする考えを説明。※同条の逐条議論ではなく1985年改正制度に関係する議論。", "tsu": "—（本条固有の発出番号・後続改廃を確認した通達は未収録。）【参考・通達ではない】日本年金機構「20歳前障害基礎年金」等の公的解説。", "kako": "平成30年、令和5年", "rows": [10], "heads": ["第3章　給付", "第3節　障害基礎年金"], "orig": "第三十条の四　疾病にかかり、又は負傷し、その初診日において二十歳未満であつた者が、障害認定日以後に二十歳に達したときは二十歳に達した日において、障害認定日が二十歳に達した日後であるときはその障害認定日において、障害等級に該当する程度の障害の状態にあるときは、その者に障害基礎年金を支給する。\n２　疾病にかかり、又は負傷し、その初診日において二十歳未満であつた者（同日において被保険者でなかつた者に限る。）が、障害認定日以後に二十歳に達したときは二十歳に達した日後において、障害認定日が二十歳に達した日後であるときはその障害認定日後において、その傷病により、六十五歳に達する日の前日までの間に、\n障害等級に該当する程度の障害の状態に該当するに至つたときは、その者は、その期間内に前項の障害基礎年金の支給を請求することができる。\n３　第三十条の二第三項の規定は、前項の場合に準用する。", "ch": 2}, {"key": "h31", "num": [31], "label": "第31条", "caption": "併給の調整", "status": null, "sheet": "第30～36条の4_障害基礎前半", "scope": "honsoku", "text": "（併給の調整）\n第31条　障害基礎年金の受給権者に対して更に障害基礎年金を支給すべき事由が生じたときは、前後の障害を併合した障害の程度による障害基礎年金を支給する。\n2　障害基礎年金の受給権者が前項の規定により前後の障害を併合した障害の程度による障害基礎年金の受給権を取得したときは、従前の障害基礎年金の受給権は、消滅する。", "bg": "【1985年改正】従来の障害年金に関する併給調整を、障害基礎年金の規定として整理した。\n【法文上の区別】既に障害基礎年金の受給権を有する者に、別途その年金の支給事由が発生した場合の併合と、従前の受給権の消滅を定める。第30条の3の「初めて2級以上に達する基準障害」と混同しない。", "deb": "—（第31条の受給権消滅の規律について、制定時の質問・答弁の原文を未照合。）", "tsu": "—（本条固有の現行有効な解釈通達番号・改廃の原典未確認。）", "kako": "令和元年、令和3年、令和6年", "rows": [11], "heads": ["第3章　給付", "第3節　障害基礎年金"], "orig": "（併給の調整）\n第三十一条　障害基礎年金の受給権者に対して更に障害基礎年金を支給すべき事由が生じたときは、前後の障害を併合した障害の程度による障害基礎年金を支給する。\n２　障害基礎年金の受給権者が前項の規定により前後の障害を併合した障害の程度による障害基礎年金の受給権を取得したときは、従前の障害基礎年金の受給権は、消滅する。", "ch": 2}, {"key": "h32", "num": [32], "label": "第32条", "caption": "", "status": null, "sheet": "第30～36条の4_障害基礎前半", "scope": "honsoku", "text": "〔学習用見出し：併合した障害に係る年金の支給停止〕\n第32条　期間を定めて支給を停止されている障害基礎年金の受給権者に対して更に障害基礎年金を支給すべき事由が生じたときは、前条第1項の規定により支給する前後の障害を併合した障害の程度による障害基礎年金は、従前の障害基礎年金の支給を停止すべきであつた期間、その支給を停止するものとし、その間、その者に従前の障害を併合しない障害の程度による障害基礎年金を支給する。\n2　障害基礎年金の受給権者が更に障害基礎年金の受給権を取得した場合において、新たに取得した障害基礎年金が第36条第1項の規定によりその支給を停止すべきものであるときは、前条第2項の規定にかかわらず、その停止すべき期間、その者に対して従前の障害基礎年金を支給する。", "bg": "【1985年改正】支給停止中の障害年金と新たな障害給付の組合せについて、障害基礎年金への制度転換に伴い用語等を整備。\n【法文上の区別】支給停止の理由が従前の障害にある場合と、新たな障害にある場合の給付関係を区分。停止事由は第36条（労基法上の障害補償に係る調整等）とセットで読む。本条だけで支給停止の一般的な全要件が完結するわけではない。", "deb": "—（本条に関する実際の逐条質疑・政府答弁は未照合。）", "tsu": "—（改廃を含めて現行有効と確認できた本条固有通達は未収録。）", "kako": "令和4年、令和6年", "rows": [12], "heads": ["第3章　給付", "第3節　障害基礎年金"], "orig": "第三十二条　期間を定めて支給を停止されている障害基礎年金の受給権者に対して更に障害基礎年金を支給すべき事由が生じたときは、前条第一項の規定により支給する前後の障害を併合した障害の程度による障害基礎年金は、従前の障害基礎年金の支給を停止すべきであつた期間、その支給を停止するものとし、その間、\nその者に従前の障害を併合しない障害の程度による障害基礎年金を支給する。\n２　障害基礎年金の受給権者が更に障害基礎年金の受給権を取得した場合において、新たに取得した障害基礎年金が第三十六条第一項の規定によりその支給を停止すべきものであるときは、前条第二項の規定にかかわらず、その停止すべき期間、その者に対して従前の障害基礎年金を支給する。", "ch": 2}, {"key": "h33", "num": [33], "label": "第33条", "caption": "年金額", "status": null, "sheet": "第30～36条の4_障害基礎前半", "scope": "honsoku", "text": "（年金額）\n第33条　障害基礎年金の額は、780900円に改定率を乗じて得た額（その額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）とする。\n2　障害の程度が障害等級の1級に該当する者に支給する障害基礎年金の額は、前項の規定にかかわらず、同項に定める額の100分の125に相当する額とする。", "bg": "【制定時との区別】1959年制定当時の障害年金の給付体系と、1985年改正による「障害基礎年金」への再編を区別。\n【現行条文】法定の基礎額780,900円に改定率を乗じ、2級の基本年金額を定める。1級はその125％。780,900円を令和8年度の実支給額と取り違えない。\n【2026年度の公表年金額】昭和31年4月2日以後生まれは2級847,300円、1級1,059,125円。昭和31年4月1日以前生まれは2級844,900円、1級1,056,125円（子の加算前）。年度額・生年月日区分は本条基礎額と別管理。", "deb": "—（第33条の基本額や1級125％の設定理由について、制定・改正時の当該条文固有の国会質疑と答弁を一組として確認できていないため、制度の一般的説明から推定しない。）", "tsu": "—（第33条固有の現行有効な解釈通達と後続改廃履歴は未確認。）【参考：通達ではない】日本年金機構「障害基礎年金の受給要件・請求時期・年金額」（2026年度額掲載）。", "kako": "平成30年、令和3年", "rows": [13], "heads": ["第3章　給付", "第3節　障害基礎年金"], "orig": "（年金額）\n第三十三条　障害基礎年金の額は、七十八万九百円に改定率を乗じて得た額（その額に五十円未満の端数が生じたときは、これを切り捨て、五十円以上百円未満の端数が生じたときは、これを百円に切り上げるものとする。）とする。\n２　障害の程度が障害等級の一級に該当する者に支給する障害基礎年金の額は、前項の規定にかかわらず、同項に定める額の百分の百二十五に相当する額とする。", "ch": 2}, {"key": "h33-2", "num": [33, 2], "label": "第33条の2", "caption": "", "status": null, "sheet": "第30～36条の4_障害基礎前半", "scope": "honsoku", "text": "〔学習用見出し：障害基礎年金の子の加算〕\n第33条の2　障害基礎年金の額は、受給権者によつて生計を維持しているその者の子（18歳に達する日以後の最初の3月31日までの間にある子及び20歳未満であつて障害等級に該当する障害の状態にある子に限る。）があるときは、前条の規定にかかわらず、同条に定める額にその子1人につきそれぞれ74900円に改定率（第27条の3及び第27条の5の規定の適用がないものとして改定した改定率とする。以下この項において同じ。）を乗じて得た額（そのうち2人までについては、それぞれ224700円に改定率を乗じて得た額とし、それらの額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）を加算した額とする。\n2　受給権者がその権利を取得した日の翌日以後にその者によつて生計を維持しているその者の子（18歳に達する日以後の最初の3月31日までの間にある子及び20歳未満であつて障害等級に該当する障害の状態にある子に限る。）を有するに至つたことにより、前項の規定によりその額を加算することとなつたときは、当該子を有するに至つた日の属する月の翌月から、障害基礎年金の額を改定する。\n3　第1項の規定によりその額が加算された障害基礎年金については、子のうちの1人又は2人以上が次の各号のいずれかに該当するに至つたときは、その該当するに至つた日の属する月の翌月から、その該当するに至つた子の数に応じて、年金額を改定する。\n1　死亡したとき。\n2　受給権者による生計維持の状態がやんだとき。\n3　婚姻をしたとき。\n4　受給権者の配偶者以外の者の養子となつたとき。\n5　離縁によつて、受給権者の子でなくなつたとき。\n6　18歳に達した日以後の最初の3月31日が終了したとき。ただし、障害等級に該当する障害の状態にあるときを除く。\n7　障害等級に該当する障害の状態にある子について、その事情がやんだとき。ただし、その子が18歳に達する日以後の最初の3月31日までの間にあるときを除く。\n8　20歳に達したとき。\n4　第1項又は前項第2号の規定の適用上、障害基礎年金の受給権者によつて生計を維持していること又はその者による生計維持の状態がやんだことの認定に関し必要な事項は、政令で定める。", "bg": "【1985年改正】基礎年金制度への再編で子の加算規定を整備。\n【2010年改正・2011年4月施行】受給権を得た後に子が出生するなどの事情変更にも加算を認め、取得時点に子がいる場合との不均衡を改善。第2項が月翌月からの増額、第3項は子の条件喪失に伴う月翌月からの減額。\n【2026年度の支給額】子の加算は第1・2子各243,800円、第3子以降各81,300円。法文上の22万4,700円・7万4,900円は改定率適用前の基礎額。\n【将来改正は別枠】2025年成立の改正法による子の加算拡充は2028年4月施行予定。2026年現在の年金額・算定と混ぜない。", "deb": "【2010年4月9日・衆議院厚生労働委員会】藤村修委員長は各会派の合意に基づく委員長提出法案を説明し、受給開始後に子が生まれた場合に加算されないことへの不公平感を具体的な立法理由に挙げた。これに対し長妻昭厚生労働大臣は「政府として特に異議はありません」と述べた。※委員長による提案理由と政府意見の確認であり、個々の号の詳細な逐条質疑ではない。", "tsu": "—（第33条の2固有の解釈通達の全件改廃を照合していない。）【参考：通達ではない】厚労省2025年年金制度改正資料（2028年4月施行の子の加算拡充）と日本年金機構の2026年度額案内。", "kako": "令和4年", "rows": [14], "heads": ["第3章　給付", "第3節　障害基礎年金"], "orig": "第三十三条の二　障害基礎年金の額は、受給権者によつて生計を維持しているその者の子（十八歳に達する日以後の最初の三月三十一日までの間にある子及び二十歳未満であつて障害等級に該当する障害の状態にある子に限る。）があるときは、前条の規定にかかわらず、同条に定める額にその子一人につきそれぞれ七万四千九百円に改定率（第二十七条の三及び第二十七条の五の規定の適用がな\nいものとして改定した改定率とする。以下この項において同じ。）を乗じて得た額（そのうち二人までについては、それぞれ二十二万四千七百円に改定率を乗じて得た額とし、それらの額に五十円未満の端数が生じたときは、これを切り捨て、五十円以上百円未満の端数が生じたときは、これを百円に切り上げるものとする。）を加算した額とする。\n２　受給権者がその権利を取得した日の翌日以後にその者によつて生計を維持しているその者の子（十八歳に達する日以後の最初の三月三十一日までの間にある子及び二十歳未満であつて障害等級に該当する障害の状態にある子に限る。）を有するに至つたことにより、前項の規定によりその額を加算することとなつたときは、当該子を有するに至つた日の属する月の翌月から、\n障害基礎年金の額を改定する。\n３　第一項の規定によりその額が加算された障害基礎年金については、子のうちの一人又は二人以上が次の各号のいずれかに該当するに至つたときは、その該当するに至つた日の属する月の翌月から、その該当するに至つた子の数に応じて、年金額を改定する。\n一　死亡したとき。\n二　受給権者による生計維持の状態がやんだとき。\n三　婚姻をしたとき。\n四　受給権者の配偶者以外の者の養子となつたとき。\n五　離縁によつて、受給権者の子でなくなつたとき。\n六　十八歳に達した日以後の最初の三月三十一日が終了したとき。ただし、障害等級に該当する障害の状態にあるときを除く。\n七　障害等級に該当する障害の状態にある子について、その事情がやんだとき。ただし、その子が十八歳に達する日以後の最初の三月三十一日までの間にあるときを除く。\n八　二十歳に達したとき。\n４　第一項又は前項第二号の規定の適用上、障害基礎年金の受給権者によつて生計を維持していること又はその者による生計維持の状態がやんだことの認定に関し必要な事項は、政令で定める。", "ch": 2}, {"key": "h34", "num": [34], "label": "第34条", "caption": "障害の程度が変わつた場合の年金額の改定", "status": null, "sheet": "第30～36条の4_障害基礎前半", "scope": "honsoku", "text": "（障害の程度が変わつた場合の年金額の改定）\n第34条　厚生労働大臣は、障害基礎年金の受給権者について、その障害の程度を診査し、その程度が従前の障害等級以外の障害等級に該当すると認めるときは、障害基礎年金の額を改定することができる。\n2　障害基礎年金の受給権者は、厚生労働大臣に対し、障害の程度が増進したことによる障害基礎年金の額の改定を請求することができる。\n3　前項の請求は、障害基礎年金の受給権者の障害の程度が増進したことが明らかである場合として厚生労働省令で定める場合を除き、当該障害基礎年金の受給権を取得した日又は第1項の規定による厚生労働大臣の診査を受けた日から起算して1年を経過した日後でなければ行うことができない。\n4　障害基礎年金の受給権者であつて、疾病にかかり、又は負傷し、かつ、その傷病（当該障害基礎年金の支給事由となつた障害に係る傷病の初診日後に初診日があるものに限る。以下この項及び第36条第2項ただし書において同じ。）に係る当該初診日において第30条第1項各号のいずれかに該当したものが、当該傷病により障害（障害等級に該当しない程度のものに限る。\n以下この項及び第36条第2項ただし書において「その他障害」という。）の状態にあり、かつ、当該傷病に係る障害認定日以後65歳に達する日の前日までの間において、当該障害基礎年金の支給事由となつた障害とその他障害（その他障害が2以上ある場合は、すべてのその他障害を併合した障害）とを併合した障害の程度が当該障害基礎年金の支給事由となつた障害の程度より増進したときは、その者は、厚生労働大臣に対し、その期間内に当該障害基礎年金の額の改定を請求することができる。\n5　第30条第1項ただし書の規定は、前項の場合に準用する。\n6　第1項の規定により障害基礎年金の額が改定されたときは、改定後の額による障害基礎年金の支給は、改定が行われた日の属する月の翌月から始めるものとする。", "bg": "【額改定の二経路】第1項は厚生労働大臣の診査による改定、第2項は受給権者の請求による増額改定。第4項は後発の「その他障害」を併合して程度が増進した場合の請求。\n【2012年改正・2014年4月施行】額改定請求の原則1年の待期期間について、程度の増進が明白な場合は省令所定の例外を認めた。頻繁な反復請求を抑える管理上の目的と、明らかな重症化への救済の均衡を図る。\n【注意】厚生労働大臣の診査による改定、請求に基づく改定、併合改定は起算や適用要件を混同しない。", "deb": "—（2012年改正の条文固有の質問者・政府答弁の組合せは今回未照合。）【制度目的を説明する一次資料・国会問答ではない】厚労省「障害年金の額改定請求に関する検討会」（2013年）には、頻回請求抑制という待期期間の理由と2014年4月施行の改正趣旨が明記されている。", "tsu": "【2014年3月31日・年管管発0331第10号（日本年金機構あて等）】2014年4月施行の額改定請求の待期期間一部緩和に伴う事務取扱を説明。\n【同日・年管管発0331第16号・第17号】額改定請求の1年待期期間の緩和について、窓口・市町村向け周知を指示。\n※平成14年3月15日・庁保発第12号の障害認定基準改正通知は障害認定の制度史上の資料。通知の全面的な現行有効性や後続改廃は未確定。", "kako": "平成29年、令和2年、令和5年、令和6年、令和7年", "rows": [15], "heads": ["第3章　給付", "第3節　障害基礎年金"], "orig": "（障害の程度が変わつた場合の年金額の改定）\n第三十四条　厚生労働大臣は、障害基礎年金の受給権者について、その障害の程度を診査し、その程度が従前の障害等級以外の障害等級に該当すると認めるときは、障害基礎年金の額を改定することができる。\n２　障害基礎年金の受給権者は、厚生労働大臣に対し、障害の程度が増進したことによる障害基礎年金の額の改定を請求することができる。\n３　前項の請求は、障害基礎年金の受給権者の障害の程度が増進したことが明らかである場合として厚生労働省令で定める場合を除き、当該障害基礎年金の受給権を取得した日又は第一項の規定による厚生労働大臣の診査を受けた日から起算して一年を経過した日後でなければ行うことができない。\n４　障害基礎年金の受給権者であつて、疾病にかかり、又は負傷し、かつ、その傷病（当該障害基礎年金の支給事由となつた障害に係る傷病の初診日後に初診日があるものに限る。以下この項及び第三十六条第二項ただし書において同じ。）に係る当該初診日において第三十条第一項各号のいずれかに該当したものが、当該傷病により障害（障害等級に該当しない程度のものに限る。\n以下この項及び第三十六条第二項ただし書において「その他障害」という。）の状態にあり、かつ、当該傷病に係る障害認定日以後六十五歳に達する日の前日までの間において、当該障害基礎年金の支給事由となつた障害とその他障害（その他障害が二以上ある場合は、すべてのその他障害を併合した障害）\nとを併合した障害の程度が当該障害基礎年金の支給事由となつた障害の程度より増進したときは、その者は、厚生労働大臣に対し、その期間内に当該障害基礎年金の額の改定を請求することができる。\n５　第三十条第一項ただし書の規定は、前項の場合に準用する。\n６　第一項の規定により障害基礎年金の額が改定されたときは、改定後の額による障害基礎年金の支給は、改定が行われた日の属する月の翌月から始めるものとする。", "ch": 2}, {"key": "h35", "num": [35], "label": "第35条", "caption": "失権", "status": null, "sheet": "第30～36条の4_障害基礎前半", "scope": "honsoku", "text": "（失権）\n第35条　障害基礎年金の受給権は、第31条第2項の規定によつて消滅するほか、受給権者が次の各号のいずれかに該当するに至つたときは、消滅する。\n1　死亡したとき。\n2　厚生年金保険法第47条第2項に規定する障害等級に該当する程度の障害の状態にない者が、65歳に達したとき。ただし、65歳に達した日において、同項に規定する障害等級に該当する程度の障害の状態に該当しなくなつた日から起算して同項に規定する障害等級に該当する程度の障害の状態に該当することなく3年を経過していないときを除く。\n3　厚生年金保険法第47条第2項に規定する障害等級に該当する程度の障害の状態に該当しなくなつた日から起算して同項に規定する障害等級に該当する程度の障害の状態に該当することなく3年を経過したとき。ただし、3年を経過した日において、当該受給権者が65歳未満であるときを除く。", "bg": "【法文上の整理】死亡、併合後の旧受給権消滅（31条2項）に加え、障害等級に該当しなくなった状態が続く場合の失権を年齢（65歳）・期間（3年）で組み合わせる。\n【試験上の混同防止】障害等級非該当でも直ちに失権するわけではなく、第36条2項の支給停止と区別する。\n【改正履歴】昭和44年法律第86号による全部改正ほか複数の改正を経ている。改正ごとの立法理由は原典を確認できた範囲に限定。", "deb": "—（第35条の「65歳・3年」の組合せについて、制定・改正時の質疑と政府答弁の原文の一組は未照合。）", "tsu": "—（本条固有の現行有効な通達の番号・後続改廃履歴は未確認。）【参考：通達ではない】厚生労働省掲載国民年金法第35条。", "kako": "平成30年、令和元年、令和3年、令和7年", "rows": [16], "heads": ["第3章　給付", "第3節　障害基礎年金"], "orig": "（失権）\n第三十五条　障害基礎年金の受給権は、第三十一条第二項の規定によつて消滅するほか、受給権者が次の各号のいずれかに該当するに至つたときは、消滅する。\n一　死亡したとき。\n二　厚生年金保険法第四十七条第二項に規定する障害等級に該当する程度の障害の状態にない者が、六十五歳に達したとき。ただし、六十五歳に達した日において、同項に規定する障害等級に該当する程度の障害の状態に該当しなくなつた日から起算して同項に規定する障害等級に該当する程度の障害の状態に該当することなく三年を経過していないときを除く。\n三　厚生年金保険法第四十七条第二項に規定する障害等級に該当する程度の障害の状態に該当しなくなつた日から起算して同項に規定する障害等級に該当する程度の障害の状態に該当することなく三年を経過したとき。ただし、三年を経過した日において、当該受給権者が六十五歳未満であるときを除く。", "ch": 2}, {"key": "h36", "num": [36], "label": "第36条", "caption": "支給停止", "status": null, "sheet": "第30～36条の4_障害基礎前半", "scope": "honsoku", "text": "（支給停止）\n第36条　障害基礎年金は、その受給権者が当該傷病による障害について、労働基準法（昭和22年法律第49号）の規定による障害補償を受けることができるときは、6年間、その支給を停止する。\n2　障害基礎年金は、受給権者が障害等級に該当する程度の障害の状態に該当しなくなつたときは、その障害の状態に該当しない間、その支給を停止する。ただし、その支給を停止された障害基礎年金の受給権者が疾病にかかり、又は負傷し、かつ、その傷病に係る初診日において第30条第1項各号のいずれかに該当した場合であつて、当該傷病によりその他障害の状態にあり、かつ、当該傷病に係る障害認定日以後65歳に達する日の前日までの間において、当該障害基礎年金の支給事由となつた障害とその他障害（その他障害が2以上ある場合は、すべてのその他障害を併合した障害）とを併合した障害の程度が障害等級に該当するに至つたときは、この限りでない。\n3　第30条第1項ただし書の規定は、前項ただし書の場合に準用する。", "bg": "【第1項】同一傷病の障害につき労働基準法による障害補償を受けられるとき、6年間の支給停止。労災保険との併給調整を直接規定した条文と読み替えない。\n【第2項・3項】障害等級に該当しない期間は支給停止。ただし所定の後発障害との併合で等級に達した場合の例外があり、第30条1項ただし書の納付要件を準用する。\n【区別】第36条の2～4は20歳前障害基礎年金に固有の公的年金受給・所得・災害による調整を規定。本版では第36条の2～4のシートに収録。", "deb": "—（労基法上の障害補償に関する6年間停止と、第2項の後発障害の特例について、条文固有の国会質疑・答弁は今回未照合。）", "tsu": "—（本条固有の現行有効な解釈通達の番号と後続改廃の全件照合は未実施。）【参考：通達ではない】厚生労働省掲載国民年金法第36条。", "kako": "令和4年", "rows": [17], "heads": ["第3章　給付", "第3節　障害基礎年金"], "orig": "（支給停止）\n第三十六条　障害基礎年金は、その受給権者が当該傷病による障害について、労働基準法（昭和二十二年法律第四十九号）の規定による障害補償を受けることができるときは、六年間、その支給を停止する。\n２　障害基礎年金は、受給権者が障害等級に該当する程度の障害の状態に該当しなくなつたときは、その障害の状態に該当しない間、その支給を停止する。ただし、その支給を停止された障害基礎年金の受給権者が疾病にかかり、又は負傷し、かつ、その傷病に係る初診日において第三十条第一項各号のいずれかに該当した場合であつて、当該傷病によりその他障害の状態にあり、\nかつ、当該傷病に係る障害認定日以後六十五歳に達する日の前日までの間において、当該障害基礎年金の支給事由となつた障害とその他障害（その他障害が二以上ある場合は、すべてのその他障害を併合した障害）とを併合した障害の程度が障害等級に該当するに至つたときは、この限りでない。\n３　第三十条第一項ただし書の規定は、前項ただし書の場合に準用する。", "ch": 2}, {"key": "h36-2", "num": [36, 2], "label": "第36条の2", "caption": "", "status": null, "sheet": "第30～36条の4_障害基礎前半", "scope": "honsoku", "text": "〔学習用見出し：20歳前傷病に係る障害基礎年金の支給停止〕\n第36条の2　第30条の4の規定による障害基礎年金は、受給権者が次の各号のいずれかに該当するとき（第2号及び第3号に該当する場合にあつては、厚生労働省令で定める場合に限る。）は、その該当する期間、その支給を停止する。\n1　恩給法（大正12年法律第48号。他の法律において準用する場合を含む。）に基づく年金たる給付、労働者災害補償保険法（昭和22年法律第50号）の規定による年金たる給付その他の年金たる給付であつて政令で定めるものを受けることができるとき。\n2　刑事施設、労役場その他これらに準ずる施設に拘禁されているとき。\n3　少年院その他これに準ずる施設に収容されているとき。\n4　日本国内に住所を有しないとき。\n2　前項第1号に規定する給付が、その全額につき支給を停止されているときは、同項の規定を適用しない。ただし、その支給の停止が前条第1項又は第41条第1項に規定する給付が行われることによるものであるときは、この限りでない。\n3　第1項に規定する障害基礎年金の額及び同項第1号に規定する給付の額（その給付が、その額の一部につき支給を停止されているときは、停止されていない部分の額。次項において同じ。）が、いずれも政令で定める額に満たないときは、第1項の規定を適用しない。ただし、これらの額を合算した額が当該政令で定める額を超えるときは、当該障害基礎年金のうちその超える額に相当する部分については、この限りでない。\n4　第1項に規定する障害基礎年金の額が、前項に規定する政令で定める額以上であり、かつ、第1項第1号に規定する給付の額を超えるときは、その超える部分については、同項の規定にかかわらず、当該障害基礎年金の支給を停止しない。\n5　第1項第1号に規定する給付が、恩給法による増加恩給、同法第75条第1項第2号に規定する扶助料その他政令で定めるこれらに準ずる給付であつて、障害又は死亡を事由として政令で定める者に支給されるものであるときは、第1項、第3項及び前項の規定を適用しない。\n6　第1項第1号に規定する給付の額の計算方法は、政令で定める。", "bg": "【1985年改正・1986年4月施行】基礎年金制度への再編に伴い20歳前の傷病による障害基礎年金を規定し、これに固有の支給停止事由と他の年金給付との調整を整備した。\n【規定の構造】第1項第1号は恩給・労災年金などの政令所定の年金たる給付、第2・3号は省令所定の施設収容、第4号は国内に住所がない場合。第2～6項は他給付の停止状況・給付額の比較などによる例外・調整。単純に「他の年金があれば全額停止」とは整理しない。\n【注意】第36条（労基法の障害補償による6年停止）と区別。", "deb": "—（昭和60年改正時の第36条の2の各支給停止事由・調整式について、質問者と政府答弁を対応させた逐条質疑は未照合。1984年の基礎年金・20歳前障害の制度説明は背景の参考とする。）", "tsu": "—（本条固有の現行有効な解釈通達について、発出番号と後続改廃を通しで確認できていないため未収録。）【参考・通達ではない】国民年金法第36条の2本文、1985年改正法。", "kako": "平成30年、令和元年、令和4年、令和5年、令和7年", ）がある場合においては、その損害を受けた月から翌年の九月までの第三十条の四の規定による障害基礎年金については、その損害を受けた年の前年又は前々年における当該被災者の所得を理由とする前条の規定による支給の停止は、行わない。\n２　前項の規定により第三十条の四の規定による障害基礎年金の支給の停止が行われなかつた場合において、当該被災者の当該損害を受けた年の所得が、その者の扶養親族等の有無及び数に応じて、前条第一項に規定する政令で定める額を超えるときは、当該被災者に支給する第三十条の四の規定による障害基礎年金で、前項に規定する期間に係るものは、\n当該被災者が損害を受けた月に遡つて、その支給を停止する。\n３　前項に規定する所得の範囲及びその額の計算方法については、前条第一項に規定する所得の範囲及びその額の計算方法の例による。", "ch": 2}, {"key": "h37", "num": [37], "label": "第37条", "caption": "支給要件", "status": null, "sheet": "第37～42条_障害・遺族", "scope": "honsoku", "text": "（支給要件）\n第37条　遺族基礎年金は、被保険者又は被保険者であつた者が次の各号のいずれかに該当する場合に、その者の配偶者又は子に支給する。ただし、第1号又は第2号に該当する場合にあつては、死亡した者につき、死亡日の前日において、死亡日の属する月の前々月までに被保険者期間があり、かつ、当該被保険者期間に係る保険料納付済期間と保険料免除期間とを合算した期間が当該被保険者期間の3分の2に満たないときは、この限りでない。\n1　被保険者が、死亡したとき。\n2　被保険者であつた者であつて、日本国内に住所を有し、かつ、60歳以上65歳未満であるものが、死亡したとき。\n3　保険料納付済期間と保険料免除期間とを合算した期間が25年以上である者が、死亡したとき。", "bg": "【1959年制定→1985年改革】一家の担い手を失った遺族を、どのように支えるか。国民年金の遺族給付は基礎年金導入によって、子のある配偶者又は子を中心とする「遺族基礎年金」に再構成された。\n【2025年改正・現行】令和7年法律第74号による改正を踏まえ、2026年10月時点の本則は死亡者要件を第1号～第3号で規定。かつての4類型の旧法文を混在させない。\n【納付要件】第1・2号の死亡では原則、死亡日前日時点で被保険者期間のうち納付・免除が2/3以上。直近1年間未納なしの特例（死亡日が2036年3月31日まで、65歳未満等）は附則にある。第3号の25年以上の期間要件は合算対象期間等の別規定にも注意。", "deb": "【1984年7月26日・衆議院社会労働委】基礎年金導入に際し、政府側は従来の母子年金の考え方を引き継いで子のある妻に重点的な保障を行う設計を説明した。これは制度全体の理由説明であり、現行第37条第3号の個別改正への質疑ではない。", "tsu": "—（本条の死亡要件や2025年改正について、発出番号と現行効力を全件検証済みの固有解釈通達は未収録。）【参考・通達ではない】日本年金機構「遺族基礎年金（受給要件・対象者・年金額）」（2026年6月22日更新）。", "kako": "平成29年、平成30年、令和元年、令和2年、令和4年、令和6年、令和7年", "rows": [7], "heads": ["第3章　給付", "第4節　遺族基礎年金"], "orig": "（支給要件）\n第三十七条　遺族基礎年金は、被保険者又は被保険者であつた者が次の各号のいずれかに該当する場合に、その者の配偶者又は子に支給する。ただし、第一号又は第二号に該当する場合にあつては、死亡した者につき、死亡日の前日において、死亡日の属する月の前々月までに被保険者期間があり、かつ、\n当該被保険者期間に係る保険料納付済期間と保険料免除期間とを合算した期間が当該被保険者期間の三分の二に満たないときは、この限りでない。\n一　被保険者が、死亡したとき。\n二　被保険者であつた者であつて、日本国内に住所を有し、かつ、六十歳以上六十五歳未満であるものが、死亡したとき。\n三　保険料納付済期間と保険料免除期間とを合算した期間が二十五年以上である者が、死亡したとき。", "ch": 2}, {"key": "h37-2", "num": [37, 2], "label": "第37条の2", "caption": "遺族の範囲", "status": null, "sheet": "第37～42条_障害・遺族", "scope": "honsoku", "text": "（遺族の範囲）\n第37条の2　遺族基礎年金を受けることができる配偶者又は子は、被保険者又は被保険者であつた者の配偶者又は子（以下単に「配偶者」又は「子」という。）であつて、被保険者又は被保険者であつた者の死亡の当時その者によつて生計を維持し、かつ、次に掲げる要件に該当したものとする。\n1　配偶者については、被保険者又は被保険者であつた者の死亡の当時その者によつて生計を維持し、かつ、次号に掲げる要件に該当する子と生計を同じくすること。\n2　子については、18歳に達する日以後の最初の3月31日までの間にあるか又は20歳未満であつて障害等級に該当する障害の状態にあり、かつ、現に婚姻をしていないこと。\n2　被保険者又は被保険者であつた者の死亡の当時胎児であつた子が生まれたときは、前項の規定の適用については、将来に向かつて、その子は、被保険者又は被保険者であつた者の死亡の当時その者によつて生計を維持していたものとみなし、配偶者は、その者の死亡の当時その子と生計を同じくしていたものとみなす。\n3　第1項の規定の適用上、被保険者又は被保険者であつた者によつて生計を維持していたことの認定に関し必要な事項は、政令で定める。", "bg": "【1985年改正】「妻と子」の遺族基礎年金給付を本条で具体化。\n【2012年改正・2014年4月施行】母子家庭だけでなく、父子家庭にも遺族保障を届けるため、対象配偶者を妻だけでなく夫にも拡大し、父子家庭の遺族基礎年金を可能にした（平成24年法律第62号）。\n【条文上の要点】死亡者による生計維持＋「子のある配偶者」または要件該当の子。子は原則18歳到達年度末、又は20歳未満で障害等級該当、かつ未婚。死亡当時の胎児は出生後に将来に向かって生計維持・同一生計の擬制が働く。", "deb": "【2010年5月25日・参議院厚生労働委員会】母が亡くなった父子家庭では、遺族基礎年金が支給されず、子自身の受給権も停止される。小池晃議員はこの男女差を問い、是正を求めた。長妻昭厚生労働大臣は従来の母子・父子家庭への支援差を生んだ制度設計を認め、年金制度改革で重要な検討課題と答弁。これは2012年改正に先立つ具体的な質疑であり、2012年改正時の直接の逐条審議と混同しない。", "tsu": "—（生計維持認定についての個別通達の番号・改廃の連鎖は今回未照合。）【参考・通達ではない】日本年金機構の2026年案内および平成24年の厚労省改正概要。", "kako": "平成30年、令和元年、令和2年、令和4年、令和5年、令和6年", "rows": [8], "heads": ["第3章　給付", "第4節　遺族基礎年金"], "orig": "（遺族の範囲）\n第三十七条の二　遺族基礎年金を受けることができる配偶者又は子は、被保険者又は被保険者であつた者の配偶者又は子（以下単に「配偶者」又は「子」という。）であつて、被保険者又は被保険者であつた者の死亡の当時その者によつて生計を維持し、かつ、次に掲げる要件に該当したものとする。\n一　配偶者については、被保険者又は被保険者であつた者の死亡の当時その者によつて生計を維持し、かつ、次号に掲げる要件に該当する子と生計を同じくすること。\n二　子については、十八歳に達する日以後の最初の三月三十一日までの間にあるか又は二十歳未満であつて障害等級に該当する障害の状態にあり、かつ、現に婚姻をしていないこと。\n２　被保険者又は被保険者であつた者の死亡の当時胎児であつた子が生まれたときは、前項の規定の適用については、将来に向かつて、その子は、被保険者又は被保険者であつた者の死亡の当時その者によつて生計を維持していたものとみなし、配偶者は、その者の死亡の当時その子と生計を同じくしていたものとみなす。\n３　第一項の規定の適用上、被保険者又は被保険者であつた者によつて生計を維持していたことの認定に関し必要な事項は、政令で定める。", "ch": 2}, {"key": "h38", "num": [38], "label": "第38条", "caption": "年金額", "status": null, "sheet": "第37～42条_障害・遺族", "scope": "honsoku", "text": "（年金額）\n第38条　遺族基礎年金の額は、780900円に改定率を乗じて得た額（その額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）とする。", "bg": "【1985年改正】老齢・障害の基礎年金と整合する基本年金額の規定に整理。\n【2004年改正】改定率を用いる法定基礎額となった。法文の78万900円を2026年度の実際の年金支給額と混同しない。\n【2026年度の参考額】日本年金機構による2026年4月分以降の基礎額は原則847,300円（子のある配偶者が昭和31年4月1日以前生まれの場合は844,900円）。", "deb": "—（第38条の法定基礎額・端数処理そのものに関する国会議員の質問と政府答弁の一連の原典は未照合。）", "tsu": "—（本条固有の現行有効な解釈通達の発出番号・改廃履歴は未確認。）【参考・通達ではない】日本年金機構2026年度額案内。", "kako": "—", "rows": [9], "heads": ["第3章　給付", "第4節　遺族基礎年金"], "orig": "（年金額）\n第三十八条　遺族基礎年金の額は、七十八万九百円に改定率を乗じて得た額（その額に五十円未満の端数が生じたときは、これを切り捨て、五十円以上百円未満の端数が生じたときは、これを百円に切り上げるものとする。）とする。", "ch": 2}, {"key": "h39", "num": [39], "label": "第39条", "caption": "", "status": null, "sheet": "第37～42条_障害・遺族", "scope": "honsoku", "text": "〔学習用見出し：配偶者に支給する遺族基礎年金の子の加算〕\n第39条　配偶者に支給する遺族基礎年金の額は、前条の規定にかかわらず、同条に定める額に配偶者が遺族基礎年金の受給権を取得した当時第37条の2第1項に規定する要件に該当し、かつ、その者と生計を同じくした子につきそれぞれ74900円に改定率（第27条の3及び第27条の5の規定の適用がないものとして改定した改定率とする。以下この項において同じ。）を乗じて得た額（そのうち2人までについては、それぞれ224700円に改定率を乗じて得た額とし、それらの額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）を加算した額とする。\n2　配偶者が遺族基礎年金の受給権を取得した当時胎児であつた子が生まれたときは、前項の規定の適用については、その子は、配偶者がその権利を取得した当時第37条の2第1項に規定する要件に該当し、かつ、その者と生計を同じくした子とみなし、その生まれた日の属する月の翌月から、遺族基礎年金の額を改定する。\n3　配偶者に支給する遺族基礎年金については、第1項に規定する子が2人以上ある場合であつて、その子のうち1人を除いた子の1人又は2人以上が次の各号のいずれかに該当するに至つたときは、その該当するに至つた日の属する月の翌月から、その該当するに至つた子の数に応じて、年金額を改定する。\n1　死亡したとき。\n2　婚姻（届出をしていないが、事実上婚姻関係と同様の事情にある場合を含む。以下同じ。）をしたとき。\n3　配偶者以外の者の養子（届出をしていないが、事実上養子縁組関係と同様の事情にある者を含む。以下同じ。）となつたとき。\n4　離縁によつて、死亡した被保険者又は被保険者であつた者の子でなくなつたとき。\n5　配偶者と生計を同じくしなくなつたとき。\n6　18歳に達した日以後の最初の3月31日が終了したとき。ただし、障害等級に該当する障害の状態にあるときを除く。\n7　障害等級に該当する障害の状態にある子について、その事情がやんだとき。ただし、その子が18歳に達する日以後の最初の3月31日までの間にあるときを除く。\n8　20歳に達したとき。", "bg": "【1985年改正】子のある配偶者への基本額＋子の数に応じた加算を整理。\n【現行】加算額の法定基礎額は第1・2子22万4,700円、第3子以降7万4,900円（改定率適用前）。2026年度支給額は第1・2子各243,800円、第3子以降各81,300円。子の出生・資格喪失の翌月改定の時点に注意。\n【2028年4月施行予定】2025年成立法による子の加算額拡充は現在額と区別する。", "deb": "—（第39条の各号別の年金額改定理由について、条文に直接対応する国会質疑と答弁は未確認。）【制度の議論・国会の逐条答弁ではない】2025年社会保障審議会年金部会では子の加算の拡充について説明があった。", "tsu": "—（本条固有の現行効力が確定した解釈通達は未収録。）【参考・通達ではない】日本年金機構の2026年年金額、厚労省2025年改正資料。", "kako": "平成29年、令和2年、令和3年、令和7年", "rows": [10], "heads": ["第3章　給付", "第4節　遺族基礎 一人を除いた子につきそれぞれ七万四千九百円に改定率（第二十七条の三及び第二十七条の五の規定の適用がないものとして改定した改定率とする。\n以下この項において同じ。）を乗じて得た額（そのうち一人については、二十二万四千七百円に改定率を乗じて得た額とし、それらの額に五十円未満の端数が生じたときは、これを切り捨て、五十円以上百円未満の端数が生じたときは、これを百円に切り上げるものとする。）を加算した額を、その子の数で除して得た額とする。\n２　前項の場合において、遺族基礎年金の受給権を有する子の数に増減を生じたときは、増減を生じた日の属する月の翌月から、遺族基礎年金の額を改定する。", "ch": 2}, {"key": "h40", "num": [40], "label": "第40条", "caption": "失権", "status": null, "sheet": "第37～42条_障害・遺族", "scope": "honsoku", "text": "（失権）\n第40条　遺族基礎年金の受給権は、受給権者が次の各号のいずれかに該当するに至つたときは、消滅する。\n1　死亡したとき。\n2　婚姻をしたとき。\n3　養子となつたとき（直系血族又は直系姻族の養子となつたときを除く。）。\n2　配偶者の有する遺族基礎年金の受給権は、前項の規定によつて消滅するほか、第39条第1項に規定する子が1人であるときはその子が、同項に規定する子が2人以上であるときは同時に又は時を異にしてその全ての子が、同条第3項各号のいずれかに該当するに至つたときは、消滅する。\n3　子の有する遺族基礎年金の受給権は、第1項の規定によつて消滅するほか、子が次の各号のいずれかに該当するに至つたときは、消滅する。\n1　離縁によつて、死亡した被保険者又は被保険者であつた者の子でなくなつたとき。\n2　18歳に達した日以後の最初の3月31日が終了したとき。ただし、障害等級に該当する障害の状態にあるときを除く。\n3　障害等級に該当する障害の状態にある子について、その事情がやんだとき。ただし、その子が18歳に達する日以後の最初の3月31日までの間にあるときを除く。\n4　20歳に達したとき。", "bg": "【基本構造】遺族としての受給権は、どんな事情で失われるのか。共通失権（死亡・婚姻・一定の養子縁組）に加えて、配偶者は対象となる子の全員が第39条3項の事由に該当すると失権。子の受給権は本人の年齢・障害状態・離縁でも消滅。\n【試験上の区別】「支給停止」と「失権」は異なる。子に同一生計の父母がいる場合の支給停止（第41条2項）と混同しない。", "deb": "—（第40条の失権事由の個々の設定根拠に直接関する国会質疑・政府答弁は未確認。）", "tsu": "—（本条固有の有効な解釈通達・改廃履歴の網羅確認は未実施。）", "kako": "平成30年、令和元年、令和4年、令和5年", "rows": [12], "heads": ["第3章　給付", "第4節　遺族基礎年金"], "orig": "（失権）\n第四十条　遺族基礎年金の受給権は、受給権者が次の各号のいずれかに該当するに至つたときは、消滅する。\n一　死亡したとき。\n二　婚姻をしたとき。\n三　養子となつたとき（直系血族又は直系姻族の養子となつたときを除く。）。\n２　配偶者の有する遺族基礎年金の受給権は、前項の規定によつて消滅するほか、第三十九条第一項に規定する子が一人であるときはその子が、同項に規定する子が二人以上であるときは同時に又は時を異にしてその全ての子が、同条第三項各号のいずれかに該当するに至つたときは、消滅する。\n３　子の有する遺族基礎年金の受給権は、第一項の規定によつて消滅するほか、子が次の各号のいずれかに該当するに至つたときは、消滅する。\n一　離縁によつて、死亡した被保険者又は被保険者であつた者の子でなくなつたとき。\n二　十八歳に達した日以後の最初の三月三十一日が終了したとき。ただし、障害等級に該当する障害の状態にあるときを除く。\n三　障害等級に該当する障害の状態にある子について、その事情がやんだとき。ただし、その子が十八歳に達する日以後の最初の三月三十一日までの間にあるときを除く。\n四　二十歳に達したとき。", "ch": 2}, {"key": "h41", "num": [41], "label": "第41条", "caption": "支給停止", "status": null, "sheet": "第37～42条_障害・遺族", "scope": "honsoku", "text": "（支給停止）\n第41条　遺族基礎年金は、当該被保険者又は被保険者であつた者の死亡について、労働基準法の規定による遺族補償が行われるべきものであるときは、死亡日から6年間、その支給を停止する。\n2　子に対する遺族基礎年金は、配偶者が遺族基礎年金の受給権を有するとき（配偶者に対する遺族基礎年金が第20条の2第1項若しくは第2項又は次条第1項の規定によりその支給を停止されているときを除く。）、又は生計を同じくするその子の父若しくは母があるときは、その間、その支給を停止する。", "bg": "【第1項】労基法による遺族補償が行われるべき場合、死亡日から6年間の支給停止。労災保険給付一般の調整条文と取り違えない。\n【第2項・2026年現在】子の年金は、原則として配偶者に受給権があるときや、子と同一生計の父母があるときは停止。第20条の2や第41条の2に基づく配偶者の停止時など例外を確認。\n【2025年改正・2028年4月から】子の支給停止規定の見直しを予定。現行法の第2項を先取りして書き換えない（改正法附則第6条に経過措置）。", "deb": "【2010年5月25日・参院厚生労働委】父子家庭の子に受給権があっても、父と生計を同じくすることで支給が停止される――小池晃議員はその制度上の問題を指摘した。長妻昭厚労大臣は制度見直しを重要な検討課題として答弁。2014年の父子家庭への対象拡大に結びつく論点であり、2028年の条文改正そのものについての国会答弁ではない。", "tsu": "—（第41条2項の現行効力を確定できる通達原文と後続改廃は未収録。）【参考・通達ではない】厚労省2025年改正法と附則第6条、年金部会の説明資料。", "kako": "平成30年、令和6年", "rows": [13], "heads": ["第3章　給付", "第4節　遺族基礎年金"], "orig": "（支給停止）\n第四十一条　遺族基礎年金は、当該被保険者又は被保険者であつた者の死亡について、労働基準法の規定による遺族補償が行われるべきものであるときは、死亡日から六年間、その支給を停止する。\n２　子に対する遺族基礎年金は、配偶者が遺族基礎年金の受給権を有するとき（配偶者に対する遺族基礎年金が第二十条の二第一項若しくは第二項又は次条第一項の規定によりその支給を停止されているときを除く。）、又は生計を同じくするその子の父若しくは母があるときは、その間、その支給を停止する。", "ch": 2}, {"key": "h41-2", "num": [41, 2], "label": "第41条の2", "caption": "", "status": null, "sheet": "第37～42条_障害・遺族", "scope": "honsoku", "text": "〔学習用見出し：配偶者が所在不明の場合の支給停止〕\n第41条の2　配偶者に対する遺族基礎年金は、その者の所在が1年以上明らかでないときは、遺族基礎年金の受給権を有する子の申請によつて、その所在が明らかでなくなつた時に遡つて、その支給を停止する。\n2　配偶者は、いつでも、前項の規定による支給の停止の解除を申請することができる。", "bg": "【制度の機能】配偶者の所在が1年以上不明でも、受給権者である子の申請により遡及して配偶者への支給を停止し、申請により解除する仕組み。第41条2項の配偶者年金が停止される場合の例外と結びつく。\n【区別】配偶者の死亡による失権（第40条）と、所在不明による支給停止を混同しない。", "deb": "—（本条固有の制定・改正時の質問と政府答弁は今回未確認。）", "tsu": "—（本条固有の現行有効な解釈通達と後続改廃履歴は今回未確認。）", "kako": "令和3年", "rows": [14], "heads": ["第3章　給付", "第4節　遺族基礎年金"], "orig": "第四十一条の二　配偶者に対する遺族基礎年金は、その者の所在が一年以上明らかでないときは、遺族基礎年金の受給権を有する子の申請によつて、その所在が明らかでなくなつた時に遡つて、その支給を停止する。\n２　配偶者は、いつでも、前項の規定による支給の停止の解除を申請することができる。", "ch": 2}, {"key": "h42", "num": [42], "label": "第42条", "caption": "", "status": null, "sheet": "第37～42条_障害・遺族", "scope": "honsoku", "text": "〔学習用見出し：子が所在不明の場合の支給停止〕\n第42条　遺族基礎年金の受給権を有する子が2人以上ある場合において、その子のうち1人以上の子の所在が1年以上明らかでないときは、その子に対する遺族基礎年金は、他の子の申請によつて、その所在が明らかでなくなつた時にさかのぼつて、その支給を停止する。\n2　前項の規定によつて遺族基礎年金の支給を停止された子は、いつでも、その支給の停止の解除を申請することができる。\n3　第39条の2第2項の規定は、第1項の規定により遺族基礎年金の支給が停止され、又は前項の規定によりその停止が解除された場合に準用する。この場合において、同条第2項中「増減を生じた日」とあるのは、「支給が停止され、又はその停止が解除された日」と読み替えるものとする。", "bg": "【第41条の2との比較】配偶者所在不明は子が申請。第42条は子2人以上のうちの1人以上が所在不明の場合に他の子が申請。いずれも1年以上の所在不明が要件。\n【年金額】支給停止・解除に連動する子の年金額改定について第39条の2第2項を準用。失権ではない。", "deb": "—（本条に固有の立法過程の議員質問・政府答弁は確認できていない。）", "tsu": "—（本条固有の現行有効な通達番号・改廃経過は未確認。）", "kako": "平成30年、令和7年", "rows": [15], "heads": ["第3章　給付", "第4節　遺族基礎年金"], "orig": "第四十二条　遺族基礎年金の受給権を有する子が二人以上ある場合において、その子のうち一人以上の子の所在が一年以上明らかでないときは、その子に対する遺族基礎年金は、他の子の申請によつて、その所在が明らかでなくなつた時にさかのぼつて、その支給を停止する。\n２　前項の規定によつて遺族基礎年金の支給を停止された子は、いつでも、その支給の停止の解除を申請することができる。\n３　第三十九条の二第二項の規定は、第一項の規定により遺族基礎年金の支給が停止され、又は前項の規定によりその停止が解除された場合に準用する。この場合において、同条第二項中「増減を生じた日」とあるのは、「支給が停止され、又はその停止が解除された日」と読み替えるものとする。", "ch": 2}, {"key": "h43", "num": [43], "label": "第43条", "caption": "支給要件", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（支給要件）\n第43条　付加年金は、第87条の2第1項の規定による保険料に係る保険料納付済期間を有する者が老齢基礎年金の受給権を取得したときに、その者に支給する。", "bg": "【制度創設】国民年金に自分の意思で上乗せできる仕組みとして、付加保険料による年金が1970年10月に導入された。当時の付加保険料は月額350円で、現在の400円とは区別する（厚労省2015年議事録）。\n【1985年改正】1986年4月の基礎年金導入に伴い、老齢基礎年金の受給権取得と付加保険料納付済期間を組み合わせた支給要件へ全改。任意の上乗せ給付である。", "deb": "【1978年4月6日・衆院社会労働委／村山富市委員→木暮保成政府委員】村山委員が問題にしたのは、付加年金の低い給付水準だった。任意加入の魅力をどう示すのか、強制的な所得比例方式への転換は可能かと問いかけた。木暮政府委員は、任意制度では物価スライド・所得再分配に制約があり、強制的な所得比例方式にも自営業者等の所得把握などの課題があると説明。これは現行第43条の条文固有の1985年立法審議ではなく、前身制度の問題に関する審議。", "tsu": "【昭和60年7月1日・発年第44号】基礎年金への再編後も第1号被保険者としての期間に基づく付加年金を維持することを通知。後続改廃の網羅照合は未了。\n【参考・通達ではない】日本年金機構「付加保険料の納付」（2026年7月23日更新）：付加保険料は原則月400円。", "kako": "平成30年、令和2年、令和5年", "rows": [8], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第1款　付加年金"], "orig": "（支給要件）\n第四十三条　付加年金は、第八十七条の二第一項の規定による保険料に係る保険料納付済期間を有する者が老齢基礎年金の受給権を取得したときに、その者に支給する。", "ch": 2}, {"key": "h44", "num": [44], "label": "第44条", "caption": "年金額", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（年金額）\n第44条　付加年金の額は、200円に第87条の2第1項の規定による保険料に係る保険料納付済期間の月数を乗じて得た額とする。", "bg": "【1985年改正】老齢基礎年金に付加される額として年額「200円×付加保険料納付済月数」を規定（旧法からの制度継続）。実際の保険料額400円と給付額の計算単価200円を混同しない。\n【物価スライド】付加年金は老齢基礎年金と異なり自動物価スライドの対象外（平成元年改正施行通知に明記）。例：100月納付なら年額20,000円。", "deb": "【1978年4月6日・村山富市委員／木暮保成政府委員】村山委員は付加保険料400円に対する給付算定の小ささを問題提起。木暮政府委員は任意上乗せ方式の限界を説明。\n【1984年12月13日・衆院社会労働委／吉原健二政府委員】付加年金は物価スライドを行わず、加入者の伸びが鈍いこと、上乗せ保障の制度設計を工夫する必要性を説明。", "tsu": "【平成元年12月22日・発年第69号】完全自動物価スライド導入について「付加年金を除く」旨を明記。現在のスライド対象外という取扱いは日本年金機構の現行案内とも一致。ただし通知全体の改廃履歴の網羅確認は未実施。", "kako": "平成29年、令和4年", "rows": [9], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第1款　付加年金"], "orig": "（年金額）\n第四十四条　付加年金の額は、二百円に第八十七条の二第一項の規定による保険料に係る保険料納付済期間の月数を乗じて得た額とする。", "ch": 2}, {"key": "h45", "num": [45], "label": "第45条", "caption": "国民年金基金又は国民年金基金連合会の解散の場合の取扱い", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（国民年金基金又は国民年金基金連合会の解散の場合の取扱い）\n第45条　国民年金基金又は国民年金基金連合会が解散したときは、次の各号に掲げる期間は、それぞれ、第87条の2第1項の規定による保険料に係る保険料納付済期間とみなして、前2条の規定を適用する。\n1　その解散前に納付された掛金に係る国民年金基金の加入員であつた期間であつて、国民年金基金連合会がその支給に関する義務を負つている年金の額の計算の基礎となる期間を除いたもの（第87条の規定による保険料に係る保険料納付済期間である期間に限る。）\n2　その解散に係る国民年金基金連合会がその支給に関する義務を負つていた年金の額の計算の基礎となる国民年金基金の加入員であつた期間であつて、納付された掛金に係るもの（第87条の規定による保険料に係る保険料納付済期間である期間に限る。）\n2　前項の場合において、国民年金基金の加入員であつた者が付加年金の受給権を取得した後に当該国民年金基金又はその者に対し年金の支給に関する義務を負つていた国民年金基金連合会が解散したものであるときは、その国民年金基金又は国民年金基金連合会が解散した月の翌月から、当該付加年金の額を改定する。\n3　第1項の場合において、国民年金基金の加入員であつた者が老齢基礎年金の受給権を取得した後に当該国民年金基金又はその者に対し年金の支給に関する義務を負つていた国民年金基金連合会が解散したものである場合（前項の規定に該当する場合を除く。）におけるその者に対する第43条の規定の適用については、同条中「老齢基礎年金の受給権を取得」とあるのは、「加入員であつた国民年金基金又はその者に対し年金の支給に関する義務を負つていた国民年金基金連合会が解散」と読み替えるものとする。", "bg": "【1985年改正】国民年金基金が解散した場合、掛金に応じた期間を付加年金の保険料納付済期間とみなす制度を規定。\n【1989年改正】国民年金基金連合会の関与を踏まえ、解散した基金・連合会の支給義務の区分、既存受給者の額改定、老齢基礎年金受給権取得後の解散について整理。基金の通常給付と国の付加年金による引継ぎを二重に計算しない点に注意。", "deb": "—（1985年の第45条及び1989年の連合会対応改正に固有の議員質問・政府答弁は、今回一次会議録で未確認。1985年の法案本文による条文内容の確認は議会質疑の確認と区別する。）", "tsu": "【平成2年12月19日・年発第5853号】基金解散時、解散基金の加入員等に関する給付のうち付加年金に相当する部分について政府又は連合会が引き継ぐ取扱い、責任準備金の算出方法等を通知。通知発出当時の説明であり、現行の基金組織・後続改廃の全件確認は未了。", "kako": "—", "rows": [10], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第1款　付加年金"], "orig": "（国民年金基金又は国民年金基金連合会の解散の場合の取扱い）\n第四十五条　国民年金基金又は国民年金基金連合会が解散したときは、次の各号に掲げる期間は、それぞれ、第八十七条の二第一項の規定による保険料に係る保険料納付済期間とみなして、前二条の規定を適用する。\n一　その解散前に納付された掛金に係る国民年金基金の加入員であつた期間であつて、国民年金基金連合会がその支給に関する義務を負つている年金の額の計算の基礎となる期間を除いたもの（第八十七条の規定による保険料に係る保険料納付済期間である期間に限る。）\n二　その解散に係る国民年金基金連合会がその支給に関する義務を負つていた年金の額の計算の基礎となる国民年金基金の加入員であつた期間であつて、納付された掛金に係るもの（第八十七条の規定による保険料に係る保険料納付済期間である期間に限る。）\n２　前項の場合において、国民年金基金の加入員であつた者が付加年金の受給権を取得した後に当該国民年金基金又はその者に対し年金の支給に関する義務を負つていた国民年金基金連合会が解散したものであるときは、その国民年金基金又は国民年金基金連合会が解散した月の翌月から、当該付加年金の額を改定する。\n３　第一項の場合において、国民年金基金の加入員であつた者が老齢基礎年金の受給権を取得した後に当該国民年金基金又はその者に対し年金の支給に関する義務を負つていた国民年金基金連合会が解散したものである場合（前項の規定に該当する場合を除く。）におけるその者に対する第四十三条の規定の適用については、同条中「老齢基礎年金の受給権を取得」とあるのは、\n「加入員であつた国民年金基金又はその者に対し年金の支給に関する義務を負つていた国民年金基金連合会が解散」と読み替えるものとする。", "ch": 2}, {"key": "h46", "num": [46], "label": "第46条", "caption": "支給の繰下げ", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（支給の繰下げ）\n第46条　付加年金の支給は、その受給権者が第28条第1項に規定する支給繰下げの申出（同条第5項の規定により同条第1項の申出があつたものとみなされた場合における当該申出を含む。）を行つたときは、第18条第1項の規定にかかわらず、当該申出のあつた日の属する月の翌月から始めるものとする。\n2　第28条第4項の規定は、前項の規定によつて支給する付加年金の額について準用する。この場合において、同条第4項中「第27条」とあるのは、「第44条」と読み替えるものとする。", "bg": "【1985年改正】老齢基礎年金の繰下げに連動して付加年金も繰り下げ、同様の増額計算を行う仕組みを整備。\n【2020年改正】高齢期の受給選択肢を拡げ、2022年4月から繰下げ上限を75歳へ引上げ。2023年4月には第28条5項の5年前繰下げ申出みなし制度が施行され、本条の文言にも反映。単に「繰下げは請求日の翌月」と説明すると、みなし申出の例外を落とすため注意。", "deb": "—（第46条の繰下げ連動に直接固有の国会質疑・答弁は未確認。2020年改正の趣旨は厚労省の改正法説明資料で確認したが、議員と政府の質疑としては記載しない。）", "tsu": "【昭和61年3月31日・庁保発第12号】老齢基礎年金・付加年金の繰下げ加算率について施行令が定めた旨を通知（当時の率の説明）。\n【令和5年3月20日・年管管発0320001号】5年前みなし繰下げ申出等の取扱いを説明。令和5年以降の制度に適用する場合は現行法・施行令も併読。後続改廃の網羅確認は未了。", "kako": "平成29年、令和2年、令和5年", "rows": [11], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第1款　付加年金"], "orig": "（支給の繰下げ）\n第四十六条　付加年金の支給は、その受給権者が第二十八条第一項に規定する支給繰下げの申出（同条第五項の規定により同条第一項の申出があつたものとみなされた場合における当該申出を含む。）を行つたときは、第十八条第一項の規定にかかわらず、当該申出のあつた日の属する月の翌月から始めるものとする。\n２　第二十八条第四項の規定は、前項の規定によつて支給する付加年金の額について準用する。この場合において、同条第四項中「第二十七条」とあるのは、「第四十四条」と読み替えるものとする。", "ch": 2}, {"key": "h47", "num": [47], "label": "第47条", "caption": "支給停止", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（支給停止）\n第47条　付加年金は、老齢基礎年金がその全額につき支給を停止されているときは、その間、その支給を停止する。", "bg": "【1985年改正】付加年金が老齢基礎年金に従属する給付であることから、老齢基礎年金の全額停止に連動して停止する規定を置く。老齢基礎年金の支給停止事由そのものは別条文の確認が必要。全額停止と一部停止を混同しない。", "deb": "—（第47条固有の制定・改正時の議員質問・政府答弁は今回未確認。）", "tsu": "—（第47条固有の現行有効な解釈通達の発出番号・後続改廃は今回未確認。法第47条の明文を根拠とする説明。）", "kako": "令和4年", "rows": [12], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第1款　付加年金"], "orig": "（支給停止）\n第四十七条　付加年金は、老齢基礎年金がその全額につき支給を停止されているときは、その間、その支給を停止する。", "ch": 2}, {"key": "h48", "num": [48], "label": "第48条", "caption": "失権", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（失権）\n第48条　付加年金の受給権は、受給権者が死亡したときは、消滅する。", "bg": "【1985年改正】付加年金受給権の消滅事由を死亡に限定して明文化。第47条の支給停止と、第48条の失権は別の法律効果である。", "deb": "—（第48条固有の制定・改正時の議員質問・政府答弁は今回未確認。）", "tsu": "—（第48条固有の通達及び後続改廃の網羅調査は未完了。受給権が死亡で消滅することは条文そのものに明記。）", "kako": "—", "rows": [13], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第1款　付加年金"], "orig": "（失権）\n第四十八条　付加年金の受給権は、受給権者が死亡したときは、消滅する。", "ch": 2}, {"key": "h49", "num": [49], "label": "第49条", "caption": "支給要件", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（支給要件）\n第49条　寡婦年金は、死亡日の前日において死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る保険料納付済期間と保険料免除期間とを合算した期間が10年以上である夫（保険料納付済期間又は第90条の3第1項の規定により納付することを要しないものとされた保険料に係る期間以外の保険料免除期間を有する者に限る。）が死亡した場合において、夫の死亡の当時夫によつて生計を維持し、かつ、夫との婚姻関係（届出をしていないが、事実上婚姻関係と同様の事情にある場合を含む。）が10年以上継続した65歳未満の妻があるときに、その者に支給する。ただし、老齢基礎年金又は障害基礎年金の支給を受けたことがある夫が死亡したときは、この限りでない。\n2　第37条の2第3項の規定は、前項の場合に準用する。この場合において、同条第3項中「被保険者又は被保険者であつた者」とあるのは、「夫」と読み替えるものとする。\n3　60歳未満の妻に支給する寡婦年金は、第18条第1項の規定にかかわらず、妻が60歳に達した日の属する月の翌月から、その支給を始める。", "bg": "【制定時と再編】子のある遺族への年金とは異なる立場の遺族を、どのように保障するか。寡婦年金は国民年金の独自給付として整備され、1985年改正後も第1号被保険者期間を根拠とする給付として存続。子のある遺族への遺族年金とは位置付けが異なる。\n【1980年改正】事実婚の期間を婚姻関係に含める扱いを明文化（昭和55年7月から）。\n【2017年改正】夫の第1号期間の受給資格要件を25年以上から10年以上へ短縮。結婚期間10年以上と混同しない。", "deb": "【1984年8月1日・衆院社会労働委／吉原健二政府委員】国民年金本来の遺族保障は母子年金等であり、寡婦年金・死亡一時金はそれだけでは給付を受けられない遺族への制度上の配慮として形成されたことを説明。寡婦年金と死亡一時金の相違・調整をめぐる質疑の中での答弁。\n【2012年・社会保障審議会年金部会】老齢年金の受給資格期間短縮と合わせて寡婦年金も10年要件とする制度整理を事務局が説明。国会での個別質疑ではない。", "tsu": "【昭和55年10月31日・庁保発第29号】寡婦年金について、昭和55年7月1日から事実上婚姻関係と同様の事情にある者も対象に含め、同日以前の事実婚期間も婚姻継続期間として扱う旨を明記。これは当時の改正施行通知であり、その後の改廃を網羅確認したものではない。\n【制度案内・通達ではない】厚労省「年金制度の仕組みと考え方」第13、寡婦年金の10年要件等。", "kako": "平成29年、令和元年、令和2年、令和4年、令和5年、令和7年", "rows": [15], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第2款　寡婦年金"], "orig": "（支給要件）\n第四十九条　寡婦年金は、死亡日の前日において死亡日の属する月の前月までの第一号被保険者としての被保険者期間に係る保険料納付済期間と保険料免除期間とを合算した期間が十年以上である夫（保険料納付済期間又は第九十条の三第一項の規定により納付することを要しないものとされた保険料に係る期間以外の保険料免除期間を有する者に限る。\n）が死亡した場合において、夫の死亡の当時夫によつて生計を維持し、かつ、夫との婚姻関係（届出をしていないが、事実上婚姻関係と同様の事情にある場合を含む。）が十年以上継続した六十五歳未満の妻があるときに、その者に支給する。ただし、老齢基礎年金又は障害基礎年金の支給を受けたことがある夫が死亡したときは、この限りでない。\n２　第三十七条の二第三項の規定は、前項の場合に準用する。この場合において、同条第三項中「被保険者又は被保険者であつた者」とあるのは、「夫」と読み替えるものとする。\n３　六十歳未満の妻に支給する寡婦年金は、第十八条第一項の規定にかかわらず、妻が六十歳に達した日の属する月の翌月から、その支給を始める。", "ch": 2}, {"key": "h50", "num": [50], "label": "第50条", "caption": "年金額", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（年金額）\n第50条　寡婦年金の額は、死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る死亡日の前日における保険料納付済期間及び保険料免除期間につき、第27条の規定の例によつて計算した額の4分の3に相当する額とする。", "bg": "【1985年改正】新しい老齢基礎年金の仕組みに対応し、夫の第1号期間だけから第27条の例によって計算した年金額の3/4という算定構造を維持・整理。夫の老齢基礎年金の受給額そのものの3/4という説明は不正確。", "deb": "【1984年8月1日・吉原健二政府委員】寡婦年金・死亡一時金の制度設計と遺族給付との違いについて説明。第50条の「3/4」という割合の具体的な算出根拠を問う個別質疑は今回未確認。", "tsu": "—（第50条の現行計算方式について独自の適用解釈を明示する通達原典は今回未確認。現行の算定方式は法本文と厚生労働省制度解説で確認。）", "kako": "令和4年、令和5年", "rows": [16], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第2款　寡婦年金"], "orig": "（年金額）\n第五十条　寡婦年金の額は、死亡日の属する月の前月までの第一号被保険者としての被保険者期間に係る死亡日の前日における保険料納付済期間及び保険料免除期間につき、第二十七条の規定の例によつて計算した額の四分の三に相当する額とする。", "ch": 2}, {"key": "h51", "num": [51], "label": "第51条", "caption": "失権", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（失権）\n第51条　寡婦年金の受給権は、受給権者が65歳に達したとき、又は第40条第1項各号のいずれかに該当するに至つたときは、消滅する。", "bg": "【制度構造】寡婦年金は妻が60歳から65歳になるまでの期間に限定した給付。65歳に達した時点で受給権が消滅し、65歳以降の老齢基礎年金とは別制度として構成される。第40条第1項各号への準用も条文の失権要件に含まれる。", "deb": "—（第51条固有の立法時質疑・政府答弁は今回の一次資料調査では未確認。）", "tsu": "—（個別解釈通達の公的原典は未確認。現行の扱いは条文と厚生労働省案内による。）", "kako": "—", "rows": [17], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第2款　寡婦年金"], "orig": "（失権）\n第五十一条　寡婦年金の受給権は、受給権者が六十五歳に達したとき、又は第四十条第一項各号のいずれかに該当するに至つたときは、消滅する。", "ch": 2}, {"key": "h52", "num": [52], "label": "第52条", "caption": "支給停止", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（支給停止）\n第52条　寡婦年金は、当該夫の死亡について第41条第1項に規定する給付が行われるべきものであるときは、死亡日から6年間、その支給を停止する。", "bg": "【制度構造】同一の死亡により遺族基礎年金の給付が行われる場合の重複調整。条文上の期間は「死亡日から6年間」であり、受給権の消滅（第51条）とは区別する。", "deb": "—（第52条の「6年間」の設定理由に関する国会質疑・政府答弁は今回未確認。）", "tsu": "—（第52条固有の解釈通達は未確認。条文の字句から制度趣旨を推定して通達欄に記載しない。）", "kako": "平成30年", "rows": [18], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第2款　寡婦年金"], "orig": "（支給停止）\n第五十二条　寡婦年金は、当該夫の死亡について第四十一条第一項に規定する給付が行われるべきものであるときは、死亡日から六年間、その支給を停止する。", "ch": 2}, {"key": "h52-2", "num": [52, 2], "label": "第52条の2", "caption": "支給要件", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（支給要件）\n第52条の2　死亡一時金は、死亡日の前日において死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る保険料納付済期間の月数、保険料4分の1免除期間の月数の4分の3に相当する月数、保険料半額免除期間の月数の2分の1に相当する月数及び保険料4分の3免除期間の月数の4分の1に相当する月数を合算した月数が36月以上である者が死亡した場合において、その者に遺族があるときに、その遺族に支給する。ただし、老齢基礎年金又は障害基礎年金の支給を受けたことがある者が死亡したときは、この限りでない。\n2　前項の規定にかかわらず、死亡一時金は、次の各号のいずれかに該当するときは、支給しない。\n1　死亡した者の死亡日においてその者の死亡により遺族基礎年金を受けることができる者があるとき。ただし、当該死亡日の属する月に当該遺族基礎年金の受給権が消滅したときを除く。\n2　死亡した者の死亡日において胎児である子がある場合であつて、当該胎児であつた子が生まれた日においてその子又は死亡した者の配偶者が死亡した者の死亡により遺族基礎年金を受けることができるに至つたとき。ただし、当該胎児であつた子が生まれた日の属する月に当該遺族基礎年金の受給権が消滅したときを除く。\n3　第1項に規定する死亡した者の子がその者の死亡により遺族基礎年金の受給権を取得した場合（その者の死亡によりその者の配偶者が遺族基礎年金の受給権を取得した場合を除く。）であつて、その受給権を取得した当時その子と生計を同じくするその子の父又は母があることにより第41条第2項の規定によつて当該遺族基礎年金の支給が停止されるものであるときは、前項の規定は適用しない。", "bg": "【1961年改正】死亡一時金の支給規定は昭和36年法律第167号で追加。\n【立法目的】一定の保険料を納付したまま年金給付を受けずに死亡した場合の掛け捨て防止。\n【現行】保険料納付済月数等を一定率で換算した合計36月以上。遺族基礎年金との優先調整と、子の年金が停止される場合の例外あり。\n【将来改正】2028年4月以後の子の遺族基礎年金支給停止の取扱い変更は、現行第3項とは別に管理。", "deb": "【1984年8月1日・衆院社会労働委／吉原健二政府委員】母子年金等を受けられない遺族が全く給付を受けられず、保険料が掛け捨てとなることへの国民感情に配慮し、死亡一時金を設けたと明確に説明。\n【1985年4月16日・参院社会労働委／吉原健二政府委員】新制度発足前の加入期間に関する死亡一時金等は従来の給付対象とする旨を答弁。", "tsu": "【昭和55年10月31日・庁保発第29号】当時の母子年金等の受給者がある場合に死亡一時金を支給しないこと、胎児が出生した場合の調整等を通知。現在は遺族基礎年金の制度と条番号が異なるため、旧法の文言をそのまま現行解釈として引用しない。\n【現行案内・通達ではない】日本年金機構「死亡一時金」（2026年4月更新）は36月要件と子に関する例外を説明。", "kako": "平成29年、令和元年、令和2年、令和6年", "rows": [20], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第3款　死亡一時金"], "orig": "（支給要件）\n第五十二条の二　死亡一時金は、死亡日の前日において死亡日の属する月の前月までの第一号被保険者としての被保険者期間に係る保険料納付済期間の月数、保険料四分の一免除期間の月数の四分の三に相当する月数、保険料半額免除期間の月数の二分の一に相当する月数及び保険料四分の三免除期間の月数の四分の一に相当する月数を合算した月数が三十六月以上である者が死亡した場合におい\nて、その者に遺族があるときに、その遺族に支給する。ただし、老齢基礎年金又は障害基礎年金の支給を受けたことがある者が死亡したときは、この限りでない。\n２　前項の規定にかかわらず、死亡一時金は、次の各号のいずれかに該当するときは、支給しない。\n一　死亡した者の死亡日においてその者の死亡により遺族基礎年金を受けることができる者があるとき。ただし、当該死亡日の属する月に当該遺族基礎年金の受給権が消滅したときを除く。\n二　死亡した者の死亡日において胎児である子がある場合であつて、当該胎児であつた子が生まれた日においてその子又は死亡した者の配偶者が死亡した者の死亡により遺族基礎年金を受けることができるに至つたとき。ただし、当該胎児であつた子が生まれた日の属する月に当該遺族基礎年金の受給権が消滅したときを除く。\n３　第一項に規定する死亡した者の子がその者の死亡により遺族基礎年金の受給権を取得した場合（その者の死亡によりその者の配偶者が遺族基礎年金の受給権を取得した場合を除く。）であつて、その受給権を取得した当時その子と生計を同じくするその子の父又は母があることにより第四十一条第二項の規定によつて当該遺族基礎年金の支給が停止されるものであるときは、\n前項の規定は適用しない。", "ch": 2}, {"key": "h52-3", "num": [52, 3], "label": "第52条の3", "caption": "遺族の範囲及び順位等", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（遺族の範囲及び順位等）\n第52条の3　死亡一時金を受けることができる遺族は、死亡した者の配偶者、子、父母、孫、祖父母又は兄弟姉妹であつて、その者の死亡の当時その者と生計を同じくしていたものとする。ただし、前条第3項の規定に該当する場合において支給する死亡一時金を受けることができる遺族は、死亡した者の配偶者であつて、その者の死亡の当時その者と生計を同じくしていたものとする。\n2　死亡一時金（前項ただし書に規定するものを除く。次項において同じ。）を受けるべき者の順位は、前項に規定する順序による。\n3　死亡一時金を受けるべき同順位の遺族が2人以上あるときは、その1人のした請求は、全員のためその全額につきしたものとみなし、その1人に対してした支給は、全員に対してしたものとみなす。", "bg": "【1961年改正】死亡一時金とともに遺族の範囲・順位が規定。\n【現行の特徴】配偶者・子・父母・孫・祖父母・兄弟姉妹の順で、死亡時の生計同一が必要。遺族基礎年金の「生計維持」とは異なる。第52条の2第3項による特例は配偶者に限定される。", "deb": "【1984年8月1日・吉原健二政府委員】死亡一時金は、母子年金等の対象にならないさまざまな遺族に対し、保険料の掛け捨ての印象を緩和する趣旨で設けたと説明。第52条の3各順位ごとの立法過程の質疑までは確認できていない。", "tsu": "—（第52条の3固有の通達原典は今回未確認。日本年金機構の現行案内で順位・生計同一を確認。通達と制度案内を区別する。）", "kako": "令和元年、令和4年、令和5年、令和6年", "rows": [21], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第3款　死亡一時金"], "orig": "（遺族の範囲及び順位等）\n第五十二条の三　死亡一時金を受けることができる遺族は、死亡した者の配偶者、子、父母、孫、祖父母又は兄弟姉妹であつて、その者の死亡の当時その者と生計を同じくしていたものとする。ただし、前条第三項の規定に該当する場合において支給する死亡一時金を受けることができる遺族は、死亡した者の配偶者であつて、その者の死亡の当時その者と生計を同じくしていたものとする。\n２　死亡一時金（前項ただし書に規定するものを除く。次項において同じ。）を受けるべき者の順位は、前項に規定する順序による。\n３　死亡一時金を受けるべき同順位の遺族が二人以上あるときは、その一人のした請求は、全員のためその全額につきしたものとみなし、その一人に対してした支給は、全員に対してしたものとみなす。", "ch": 2}, {"key": "h52-4", "num": [52, 4], "label": "第52条の4", "caption": "金額", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（金額）\n第52条の4　死亡一時金の額は、死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る死亡日の前日における保険料納付済期間の月数、保険料4分の1免除期間の月数の4分の3に相当する月数、保険料半額免除期間の月数の2分の1に相当する月数及び保険料4分の3免除期間の月数の4分の1に相当する月数を合算した月数に応じて、それぞれ次の表の下欄に定める額とする。\n死亡日の属する月の前月までの被保険者期間に係る死亡日の前日における保険料納付済期間の月数、保険料4分の1免除期間の月数の4分の3に相当する月数、保険料半額免除期間の月数の2分の1に相当する月数及び保険料4分の3免除期間の月数の4分の1に相当する月数を合算した月数　│　金額\n36月以上180月未満　│　120,000円\n180月以上240月未満　│　145,000円\n240月以上300月未満　│　170,000円\n300月以上360月未満　│　220,000円\n360月以上420月未満　│　270,000円\n420月以上　│　320,000円\n2　死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る死亡日の前日における第87条の2第1項の規定による保険料に係る保険料納付済期間が3年以上である者の遺族に支給する死亡一時金の額は、前項の規定にかかわらず、同項に定める額に8500円を加算した額とする。", "bg": "【1961年改正】死亡一時金の月数別定額方式が追加。以後の改正で金額表が変更され、現在は120,000円～320,000円の6区分。\n【現行】第1号被保険者期間の保険料納付実績に応じて計算。付加保険料納付済期間3年以上なら8,500円を加算。年金額の算定と違い定額表による。", "deb": "【1984年8月1日・吉原健二政府委員】死亡一時金の存在理由を掛け捨て防止の観点から説明。現在の6区分のそれぞれの金額を採用した際の国会審議は今回未確認。", "tsu": "—（第52条の4の金額改定に関する現行の独立通達は今回未確認。法定金額表および付加加算の現行案内を確認。）", "kako": "平成29年、平成30年、令和2年、令和3年", "rows": [22], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第3款　死亡一時金"], "orig": "（金額）\n第五十二条の四　死亡一時金の額は、死亡日の属する月の前月までの第一号被保険者としての被保険者期間に係る死亡日の前日における保険料納付済期間の月数、保険料四分の一免除期間の月数の四分の三に相当する月数、保険料半額免除期間の月数の二分の一に相当する月数及び保険料四分の三免除期間の月数の四分の一に相当する月数を合算した月数に応じて、\nそれぞれ次の表の下欄に定める額とする。\n死亡日の属する月の前月までの被保険者期間に係る死亡日の前日における保険料納付済期間の月数、保険料四分の一免除期間の月数の四分の三に相当する月数、保険料半額免除期間の月数の二分の一に相当する月数及び保険料四分の三免除期間の月数の四分の一に相当する月数を合算した月数\n金額\n三六月以上一八〇月未満\n一二〇、〇〇〇円\n一八〇月以上二四〇月未満\n一四五、〇〇〇円\n二四〇月以上三〇〇月未満\n一七〇、〇〇〇円\n三〇〇月以上三六〇月未満\n二二〇、〇〇〇円\n三六〇月以上四二〇月未満\n二七〇、〇〇〇円\n四二〇月以上\n三二〇、〇〇〇円\n２　死亡日の属する月の前月までの第一号被保険者としての被保険者期間に係る死亡日の前日における第八十七条の二第一項の規定による保険料に係る保険料納付済期間が三年以上である者の遺族に支給する死亡一時金の額は、前項の規定にかかわらず、同項に定める額に八千五百円を加算した額とする。", "ch": 2}, {"key": "h52-5", "num": [52, 5], "label": "第52条の5", "caption": "", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "〔学習用見出し：死亡一時金に関する規定の準用〕\n第52条の5　第45条第1項の規定は、死亡一時金について準用する。この場合において、同項中「前2条」とあるのは、「第52条の4第2項」と読み替えるものとする。", "bg": "【1969年改正】国民年金基金に関する準用規定が追加。\n【1985年改正】基礎年金再編に合わせて第45条第1項の準用関係を改定。基金解散により付加年金相当期間の扱いが変わる場合の、死亡一時金の付加保険料加算との連動規定。", "deb": "—（第52条の5固有の国会議員・政府間の実際の問答は今回未確認。）", "tsu": "—（個別の後続適用通達は今回未確認。第45条の基金解散制度と一体で検討し、推測で適用の結論を補わない。）", "kako": "—", "rows": [23], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第3款　死亡一時金"], "orig": "第五十二条の五　第四十五条第一項の規定は、死亡一時金について準用する。この場合において、同項中「前二条」とあるのは、「第五十二条の四第二項」と読み替えるものとする。", "ch": 2}, {"key": "h52-6", "num": [52, 6], "label": "第52条の6", "caption": "支給の調整", "status": null, "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "（支給の調整）\n第52条の6　第52条の3の規定により死亡一時金の支給を受ける者が、第52条の2第1項に規定する者の死亡により寡婦年金を受けることができるときは、その者の選択により、死亡一時金と寡婦年金とのうち、その1を支給し、他は支給しない。", "bg": "【制度設計】同一死亡により寡婦年金と死亡一時金の両方の要件を満たす場合、両給付の重複支給を避け、受給者による選択に委ねる。昭和36年に規定追加、昭和44年に条番号変更、昭和60年改正で給付体系に対応。", "deb": "【1984年8月1日・衆院社会労働委／吉原健二政府委員】寡婦年金・死亡一時金の制度的な関係を問われ、寡婦年金は一定期間の妻への保障である一方、死亡一時金は掛け捨て感への配慮という異なる趣旨を説明。選択制を採用した趣旨の理解に役立つが、現行条文そのものの立法時質疑と同一視しない。", "tsu": "—（支給の選択について個別通達原典は今回未確認。厚労省・日本年金機構の現行制度案内で選択制を確認。）", "kako": "—", "rows": [24], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第3款　死亡一時金"], "orig": "（支給の調整）\n第五十二条の六　第五十二条の三の規定により死亡一時金の支給を受ける者が、第五十二条の二第一項に規定する者の死亡により寡婦年金を受けることができるときは、その者の選択により、死亡一時金と寡婦年金とのうち、その一を支給し、他は支給しない。", "ch": 2}, {"key": "h53-old", "num": [53], "label": "旧第53条", "caption": "第53条から第68条まで　削除", "status": "削除", "sheet": "第43～68条_第1号独自給付", "scope": "honsoku", "text": "第53条から第68条まで　削除", "bg": "【1985年改正】旧国民年金制度の給付体系が基礎年金制度へ再編され、旧第53～68条は一括して削除された。現行法の本文には「第53条から第68条まで　削除」と記される。旧条文の内容を現在の支給要件として扱わない。", "deb": "—（削除条文ごとの具体的な国会議員の質疑は今回未確認。1985年改正という制度再編の歴史と区別。）", "tsu": "—（現行の個別解釈通達は存在する条文を対象に参照。削除済み条文への旧通達は現在の根拠とはしない。）", "kako": "—", "rows": [25], "heads": ["第3章　給付", "第5節　付加年金、寡婦年金及び死亡一時金", "第3款　死亡一時金"], "orig": "第五十三条から第六十八条まで　削除", "ch": 2}, {"key": "h69", "num": [69], "label": "第69条", "caption": "", "status": null, "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "〔学習用見出し：故意に生じさせた障害に係る不支給〕\n第69条　故意に障害又はその直接の原因となつた事故を生じさせた者の当該障害については、これを支給事由とする障害基礎年金は、支給しない。", "bg": "【制度趣旨（条文構造から読み取れる限度）】自ら故意に生じさせた障害まで給付の対象とするのか。この規定は、そのような障害について給付を認めないと定める。障害基礎年金に限定され、条文は「支給しない」と定める。\n【改正履歴】厚労省掲載法文の注記は昭和57年法律第66号・昭和60年法律第34号の一部改正を示す。1985年改革後は障害基礎年金の名称で整理。各改正時の個別提案理由は未照合。", "deb": "—（1959年の制度導入に関する提案理由は確認したが、第69条をめぐる具体的な質問・政府答弁は今回確認できず。規定の制度趣旨から架空の問答を作らない。）", "tsu": "—（第69条固有の解釈通達の発出番号・改廃経過を一次資料で特定できず。条文上の不支給要件を法文で確認。）", "kako": "—", "rows": [7], "heads": ["第3章　給付", "第6節　給付の制限"], "orig": "第六十九条　故意に障害又はその直接の原因となつた事故を生じさせた者の当該障害については、これを支給事由とする障害基礎年金は、支給しない。", "ch": 2}, {"key": "h70", "num": [70], "label": "第70条", "caption": "", "status": null, "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "〔学習用見出し：犯罪行為・重大な過失等による給付制限〕\n第70条　故意の犯罪行為若しくは重大な過失により、又は正当な理由がなくて療養に関する指示に従わないことにより、障害若しくはその原因となつた事故を生じさせ、又は障害の程度を増進させた者の当該障害については、これを支給事由とする給付は、その全部又は一部を行わないことができる。\n自己の故意の犯罪行為若しくは重大な過失により、又は正当な理由がなくて療養に関する指示に従わないことにより、死亡又はその原因となつた事故を生じさせた者の死亡についても、同様とする。", "bg": "【制度趣旨（条文の構造による説明）】給付を制限する場合でも、一律の不支給と裁量による制限は区別される。故意の犯罪行為・重大な過失、又は正当な理由のない療養指示違反による障害・死亡等について、給付の全部又は一部を行わないことができる規定。第69条の「支給しない」とは裁量規定である点が異なる。\n【改正履歴】厚労省掲載法文の注記は昭和36年法律第167号・昭和57年法律第66号の一部改正を示す。個別の国会提案理由の検証は未了。", "deb": "—（故意の犯罪行為・重大な過失・療養指示違反の各要件につき、条文固有の国会質疑・答弁は未確認。）", "tsu": "【確認した解釈通知】令和3年3月4日・年管管発0304第6号（厚生労働省年金局事業管理課長通知）。違法薬剤の使用によって障害・原因事故が生じ、又は障害が増進したことが医学的に認められる場合の給付制限を整理している。薬剤非起因性の障害が併存するときは、その部分を別に審査する。単なる使用歴だけでは給付制限の対象とせず、対象障害・増進との直接の起因性を確認する。通知原文：https://www.mhlw.go.jp/web/t_doc?dataId=00tc5723&dataType=1&pageNo=1\n【効力確認上の留保】公的掲載原文を確認したが、後続改廃通知の網羅確認は未了。", "kako": "—", "rows": [8], "heads": ["第3章　給付", "第6節　給付の制限"], "orig": "第七十条　故意の犯罪行為若しくは重大な過失により、又は正当な理由がなくて療養に関する指示に従わないことにより、障害若しくはその原因となつた事故を生じさせ、又は障害の程度を増進させた者の当該障害については、これを支給事由とする給付は、その全部又は一部を行わないことができる。\n自己の故意の犯罪行為若しくは重大な過失により、又は正当な理由がなくて療養に関する指示に従わないことにより、死亡又はその原因となつた事故を生じさせた者の死亡についても、同様とする。", "ch": 2}, {"key": "h71", "num": [71], "label": "第71条", "caption": "", "status": null, "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "〔学習用見出し：故意に死亡させた者への遺族給付の不支給〕\n第71条　遺族基礎年金、寡婦年金又は死亡一時金は、被保険者又は被保険者であつた者を故意に死亡させた者には、支給しない。被保険者又は被保険者であつた者の死亡前に、その者の死亡によつて遺族基礎年金又は死亡一時金の受給権者となるべき者を故意に死亡させた者についても、同様とする。\n2　遺族基礎年金の受給権は、受給権者が他の受給権者を故意に死亡させたときは、消滅する。", "bg": "【制度趣旨（法文に基づく説明）】被保険者等や先順位となり得る遺族を故意に死亡させた者を遺族給付から排除する。第2項は遺族基礎年金の受給権者が他の受給権者を故意に死亡させた場合の受給権消滅を定める。\n【改正履歴】厚労省掲載法文の注記は昭和36年法律第167号・昭和60年法律第34号の一部改正を示す。旧母子年金等から遺族基礎年金への再編と現行の法令名を区別。", "deb": "—（故意の殺害と受給権消滅について、この条文を直接審議した国会質疑・政府答弁は未確認。）", "tsu": "—（第71条の故意殺害に関する独立通達の発出番号・改廃は今回未確認。遺族基礎年金・寡婦年金・死亡一時金の対象関係は条文による。）", "kako": "令和元年", "rows": [9], "heads": ["第3章　給付", "第6節　給付の制限"], "orig": "第七十一条　遺族基礎年金、寡婦年金又は死亡一時金は、被保険者又は被保険者であつた者を故意に死亡させた者には、支給しない。被保険者又は被保険者であつた者の死亡前に、その者の死亡によつて遺族基礎年金又は死亡一時金の受給権者となるべき者を故意に死亡させた者についても、同様とする。\n２　遺族基礎年金の受給権は、受給権者が他の受給権者を故意に死亡させたときは、消滅する。", "ch": 2}, {"key": "h72", "num": [72], "label": "第72条", "caption": "", "status": null, "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "〔学習用見出し：調査への不応答等による年金の支給停止〕\n第72条　年金給付は、次の各号のいずれかに該当する場合においては、その額の全部又は一部につき、その支給を停止することができる。\n1　受給権者が、正当な理由がなくて、第107条第1項の規定による命令に従わず、又は同項の規定による当該職員の質問に応じなかつたとき。\n2　障害基礎年金の受給権者又は第107条第2項に規定する子が、正当な理由がなくて、同項の規定による命令に従わず、又は同項の規定による当該職員の診断を拒んだとき。", "bg": "【制度趣旨（条文に即した説明）】受給資格の調査・診断に正当な理由なく協力しない場合に、年金給付の全部又は一部を「支給停止できる」制度。第107条第1項の調査命令・質問と、同条第2項の診断命令・診断拒否を区別する。\n【改正履歴】厚労省掲載法文の注記は昭和36年法律第167号・昭和46年法律第13号・昭和57年法律第66号・昭和60年法律第34号の一部改正。個別改正理由の照合は未了。", "deb": "—（第107条に基づく調査拒否の支給停止について、条文固有の議員質問・政府答弁は今回未確認。2010年の行政実務資料は国会会議録ではない。）", "tsu": "【参考：行政資料・通達ではない】厚生労働省「行方不明となっている高齢者に係る年金受給権者の安否確認等の対応」（2010年頃の公表資料）に、調査命令・質問に応じない場合の第72条に基づく支給停止の運用例がある。歴史的事例であり現在の一律運用とは断定しない。\n【通達】第72条固有の現行解釈通知番号・改廃を網羅確認したものではない。", "kako": "—", "rows": [10], "heads": ["第3章　給付", "第6節　給付の制限"], "orig": "第七十二条　年金給付は、次の各号のいずれかに該当する場合においては、その額の全部又は一部につき、その支給を停止することができる。\n一　受給権者が、正当な理由がなくて、第百七条第一項の規定による命令に従わず、又は同項の規定による当該職員の質問に応じなかつたとき。\n二　障害基礎年金の受給権者又は第百七条第二項に規定する子が、正当な理由がなくて、同項の規定による命令に従わず、又は同項の規定による当該職員の診断を拒んだとき。", "ch": 2}, {"key": "h73", "num": [73], "label": "第73条", "caption": "", "status": null, "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "〔学習用見出し：届出・書類提出義務違反による支払差止め〕\n第73条　受給権者が、正当な理由がなくて、第105条第3項の規定による届出をせず、又は書類その他の物件を提出しないときは、年金給付の支払を一時差し止めることができる。", "bg": "【制度趣旨（条文に即した説明）】第105条第3項の届出・書類等が正当な理由なく提出されない場合に、年金の「支払」を一時差し止める仕組み。第72条の「支給停止」と異なり、届出による受給権確認を促すための一時的措置と整理できる。\n【改正履歴】厚労省掲載法文の本条直後には個別の一部改正注記なし。制定時からの文言・改正履歴の完全一致は今後調査。", "deb": "—（第105条第3項の届出と第73条の支払一時差止めについて、条文固有の議員質問・政府答弁は未確認。）", "tsu": "【参考：現行実務案内・通達ではない】日本年金機構「現況届を期日までに提出できませんでした。どうすればいいですか。」（2025年9月1日更新）では、届出遅延等で一時的に支払が止まり、受理後に停止期間分が遡及支払される旨を案内。\n【通達】第73条に関する独立通達の発出番号・後続改廃は確認できていない。", "kako": "令和元年、令和2年", "rows": [11], "heads": ["第3章　給付", "第6節　給付の制限"], "orig": "第七十三条　受給権者が、正当な理由がなくて、第百五条第三項の規定による届出をせず、又は書類その他の物件を提出しないときは、年金給付の支払を一時差し止めることができる。", "ch": 2}, {"key": "h74", "num": [74], "label": "第74条", "caption": "", "status": null, "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "〔学習用見出し：国民年金事業を円滑に実施するための事業〕\n第74条　政府は、国民年金事業の円滑な実施を図るため、国民年金に関し、次に掲げる事業を行うことができる。\n1　教育及び広報を行うこと。\n2　被保険者、受給権者その他の関係者（以下この条において「被保険者等」という。）に対し、相談その他の援助を行うこと。\n3　被保険者等に対し、被保険者等が行う手続に関する情報その他の被保険者等の利便の向上に資する情報を提供すること。\n2　政府は、国民年金事業の実施に必要な事務を円滑に処理し、被保険者等の利便の向上に資するため、電子情報処理組織の運用を行うものとする。\n3　政府は、第1項各号に掲げる事業及び前項に規定する運用の全部又は一部を日本年金機構（以下「機構」という。）に行わせることができる。", "bg": "【2007年改正：確認済みの政府提案理由】社会保険庁改革と一体で、制度への信頼回復・利用者サービス改善を図るため、従来の「福祉施設規定」を見直して、年金教育・広報、相談、情報提供などの運営改善措置を明文化した（2007年6月4日、柳澤伯夫厚生労働大臣の趣旨説明）。\n【2020年改正】かつての第4項（年金担保貸付関係）は令和2年法律第40号で削除。年金担保貸付の新規申込は2022年3月末で終了。現行の第74条に第4項はない。\n【条文の要点】第1項＝事業を『行うことができる』、第2項＝情報処理組織を『運用するものとする』、第3項＝日本年金機構に行わせることができる。", "deb": "—（2007年6月4日の国会における柳澤厚生労働大臣の「提案理由」は確認済みだが、第74条の文言をめぐる議員質問・答弁は未確認。提案理由を質疑として転記しない。）", "tsu": "—", "kako": "令和5年", "rows": [13], "heads": ["第4章　国民年金事業の円滑な実施を図るための措置"], "orig": "第七十四条　政府は、国民年金事業の円滑な実施を図るため、国民年金に関し、次に掲げる事業を行うことができる。\n一　教育及び広報を行うこと。\n二　被保険者、受給権者その他の関係者（以下この条において「被保険者等」という。）に対し、相談その他の援助を行うこと。\n三　被保険者等に対し、被保険者等が行う手続に関する情報その他の被保険者等の利便の向上に資する情報を提供すること。\n２　政府は、国民年金事業の実施に必要な事務を円滑に処理し、被保険者等の利便の向上に資するため、電子情報処理組織の運用を行うものとする。\n３　政府は、第一項各号に掲げる事業及び前項に規定する運用の全部又は一部を日本年金機構（以下「機構」という。）に行わせることができる。", "ch": 3}, {"key": "h75", "num": [75], "label": "第75条", "caption": "運用の目的", "status": null, "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "（運用の目的）\n第75条　積立金の運用は、積立金が国民年金の被保険者から徴収された保険料の一部であり、かつ、将来の給付の貴重な財源となるものであることに特に留意し、専ら国民年金の被保険者の利益のために、長期的な観点から、安全かつ効率的に行うことにより、将来にわたつて、国民年金事業の運営の安定に資することを目的として行うものとする。", "bg": "【2000年改正】積立金を誰がどう運用するか。年金財政の重要な転換点となった2000年改正では、平成12年法律第18号で第5章（積立金運用）を設け、従来の旧大蔵省資金運用部への全額預託から、公的年金積立金の自主運用へ制度を改める過程で、資金の性格・被保険者利益・長期の安全かつ効率的な運用という目的を法定化した。\n【2004年改正】平成16年法律第104号による一部改正。条文の個別改正箇所・提案理由は別途精査が必要。\n【核心】積立金は保険料に由来する『将来の給付の貴重な財源』。『専ら被保険者の利益』を目的とし、短期の損益だけでなく長期の年金財政安定を目指す。", "deb": "【2000年3月21日・参議院国民福祉委員会（制度改正審議）】巨額の年金積立金を市場で運用するとき、損失リスクや政府の介入をどう防ぐのか。小池晃議員がその懸念を問い、丹羽雄哉厚生大臣は、国債などの債券中心の分散投資により長期的な安全性と有利性の両立を目指すと答弁し、運用職員等の忠実義務・注意義務と厳正な処分にも言及した。当時の資産割合は歴史的説明であり現行配分ではない。", "tsu": "—", "kako": "令和元年、令和6年", "rows": [15], "heads": ["第5章　積立金の運用"], "orig": "（運用の目的）\n第七十五条　積立金の運用は、積立金が国民年金の被保険者から徴収された保険料の一部であり、かつ、将来の給付の貴重な財源となるものであることに特に留意し、専ら国民年金の被保険者の利益のために、長期的な観点から、安全かつ効率的に行うことにより、将来にわたつて、国民年金事業の運営の安定に資することを目的として行うものとする。", "ch": 4}, {"key": "h76", "num": [76], "label": "第76条", "caption": "積立金の運用", "status": null, "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "（積立金の運用）\n第76条　積立金の運用は、厚生労働大臣が、前条の目的に沿つた運用に基づく納付金の納付を目的として、年金積立金管理運用独立行政法人に対し、積立金を寄託することにより行うものとする。\n2　厚生労働大臣は、前項の規定にかかわらず、同項の規定に基づく寄託をするまでの間、財政融資資金に積立金を預託することができる。", "bg": "【2000年改正】国が積立金の全額を旧大蔵省資金運用部に預託する従来の構造を改め、年金のための自主運用を開始する制度に転換した。2001年度から旧年金資金運用基金に寄託。\n【2004年改正・2006年施行】専門性・責任明確化のため旧基金を廃止し、2006年4月から年金積立金管理運用独立行政法人（GPIF）が管理・運用。厚生労働大臣が寄託し、GPIFが運用する構造となった。\n【現行の区別】原則はGPIFへの『寄託』、例外的に寄託までの間は財政融資資金への『預託』ができる。", "deb": "【2000年3月21日・参議院国民福祉委員会】政府が運用配分や評価に関わることで、政治介入や損失の危険は高まらないか。小池晃議員が問題を提起し、丹羽雄哉厚生大臣は、当時予定する資産配分、漸進的移行、情報の開示、運用担当者の義務によって対応する旨を答弁（旧年金資金運用基金当時の答弁）。\n【後年の確認】2016年11月18日衆院厚生労働委員会で塩崎恭久厚生労働大臣は、実務をGPIFに寄託しても年金制度を所管する大臣が最終責任を負うと答弁。これは制定時の議論とは区別する。", "tsu": "—", "kako": "令和6年", "rows": [16], "heads": ["第5章　積立金の運用"], "orig": "（積立金の運用）\n第七十六条　積立金の運用は、厚生労働大臣が、前条の目的に沿つた運用に基づく納付金の納付を目的として、年金積立金管理運用独立行政法人に対し、積立金を寄託することにより行うものとする。\n２　厚生労働大臣は、前項の規定にかかわらず、同項の規定に基づく寄託をするまでの間、財政融資資金に積立金を預託することができる。", "ch": 4}, {"key": "h77", "num": [77], "label": "第77条", "caption": "運用職員の責務", "status": null, "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "（運用職員の責務）\n第77条　積立金の運用に係る行政事務に従事する厚生労働省の職員（政令で定める者に限る。以下「運用職員」という。）は、積立金の運用の目的に沿つて、慎重かつ細心の注意を払い、全力を挙げてその職務を遂行しなければならない。", "bg": "【2000年改正】積立金の自主運用に移行する際、巨額の保険料由来資金を管理する関係職員の職務責任を明文化した。初期には別番号で規定され、平成16年法律第105号で旧第79条から第77条に繰り上がった。\n【条文の要点】対象は『積立金運用に係る行政事務に従事する厚生労働省職員』のうち政令で定める職員。GPIF職員すべてと同一ではない。", "deb": "【2000年3月21日・参議院国民福祉委員会】小池晃議員が積立金の市場運用による損失リスクを指摘。丹羽雄哉厚生大臣は自主運用に伴い運用関係職員へ忠実義務・注意義務を課し、違反に厳正に対応する考えを説明。条文番号変更前の制度改正審議として記載。", "tsu": "—", "kako": "—", "rows": [17], "heads": ["第5章　積立金の運用"], "orig": "（運用職員の責務）\n第七十七条　積立金の運用に係る行政事務に従事する厚生労働省の職員（政令で定める者に限る。以下「運用職員」という。）は、積立金の運用の目的に沿つて、慎重かつ細心の注意を払い、全力を挙げてその職務を遂行しなければならない。", "ch": 4}, {"key": "h78", "num": [78], "label": "第78条", "caption": "秘密保持義務", "status": null, "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "（秘密保持義務）\n第78条　運用職員は、その職務に関して知り得た秘密を漏らし、又は盗用してはならない。", "bg": "【制度趣旨（条文構造）】積立金運用に関わる行政職員が職務上取得した秘密の漏えい・盗用を禁じる。情報へのアクセスを伴う資金運用行政における職務規律。\n【改正履歴】平成12年法律第18号で追加、平成16年法律第105号により旧第80条から現行第78条に繰上げ。これらの改正時に第78条そのものがどのように審議されたかは未確認。", "deb": "—（秘密保持条項を直接めぐる議員の質問と政府答弁は未確認。第75～77条の資金運用全般の質疑を、本条固有の審議として流用しない。）", "tsu": "—", "kako": "—", "rows": [18], "heads": ["第5章　積立金の運用"], "orig": "（秘密保持義務）\n第七十八条　運用職員は、その職務に関して知り得た秘密を漏らし、又は盗用してはならない。", "ch": 4}, {"key": "h79", "num": [79], "label": "第79条", "caption": "懲戒処分", "status": null, "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "（懲戒処分）\n第79条　運用職員が前条の規定に違反したと認めるときは、厚生労働大臣は、その職員に対し国家公務員法（昭和22年法律第120号）に基づく懲戒処分をしなければならない。", "bg": "【2004年改正】平成16年法律第105号で追加した秘密保持違反に対する懲戒処分規定。\n【条文の要点】前条（第78条）の秘密漏えい・盗用違反を認める場合に、大臣が国家公務員法に基づく懲戒処分を『しなければならない』と明示する。第77条の注意義務違反のすべてに当然に適用する条文ではない。", "deb": "—（第79条の懲戒義務の導入を直接論じた国会質問・答弁を未確認。）", "tsu": "—", "kako": "—", "rows": [19], "heads": ["第5章　積立金の運用"], "orig": "（懲戒処分）\n第七十九条　運用職員が前条の規定に違反したと認めるときは、厚生労働大臣は、その職員に対し国家公務員法（昭和二十二年法律第百二十号）に基づく懲戒処分をしなければならない。", "ch": 4}, {"key": "h80", "num": [80], "label": "第80条", "caption": "年金積立金管理運用独立行政法人法との関係", "status": null, "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "（年金積立金管理運用独立行政法人法との関係）\n第80条　積立金の運用については、この法律に定めるもののほか、年金積立金管理運用独立行政法人法（平成16年法律第105号）の定めるところによる。", "bg": "【2004年改正】平成16年法律第105号で追加。国民年金法が積立金運用の目的・寄託等の基本事項を定め、具体的なGPIFの組織・業務・運用方法・監督等は別の『年金積立金管理運用独立行政法人法』にも従う二層の法体系とした。\n【制度史】旧年金資金運用基金を2006年4月にGPIFへ再編。法令をまたいだ相互参照関係を把握するための条文。", "deb": "【参考・後年の運用責任の答弁】2016年11月18日衆院厚生労働委員会で塩崎恭久厚生労働大臣は、GPIFへの寄託の下でも積立金運用の最終責任は厚生労働大臣が負うと説明。ただし2004年の第80条新設を直接審議した問答ではない。", "tsu": "—", "kako": "—", "rows": [20], "heads": ["第5章　積立金の運用"], "orig": "（年金積立金管理運用独立行政法人法との関係）\n第八十条　積立金の運用については、この法律に定めるもののほか、年金積立金管理運用独立行政法人法（平成十六年法律第百五号）の定めるところによる。", "ch": 4}, {"key": "h81-old", "num": [81], "label": "旧第81条", "caption": "第81条から第84条まで　削除", "status": "削除", "sheet": "第69～84条_給付制限・運営", "scope": "honsoku", "text": "第81条から第84条まで　削除", "bg": "【2004年改正】平成16年法律第105号により現行の第81～84条は削除。運用制度のGPIF法への再編に合わせ、第五章に削除条が残る。\n【確認の限度】現行条文の削除状態と改正法律番号は公的本文で確認済み。削除前の各条の内容を個別に復元した比較は未実施。削除条文に現行の義務内容があると扱わない。", "deb": "—（第81～84条各条の削除を直接めぐる議員質問・政府答弁は未確認。）", "tsu": "—", "kako": "—", "rows": [21], "heads": ["第5章　積立金の運用"], "orig": "第八十一条から第八十四条まで　削除", "ch": 4}, {"key": "h85", "num": [85], "label": "第85条", "caption": "国庫負担", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "（国庫負担）\n第85条　国庫は、毎年度、国民年金事業に要する費用（次項に規定する費用を除く。）に充てるため、次に掲げる額を負担する。\n1　当該年度における基礎年金（老齢基礎年金、障害基礎年金及び遺族基礎年金をいう。以下同じ。）の給付に要する費用の総額（次号及び第3号に掲げる額を除く。以下「保険料・拠出金算定対象額」という。）から第27条第3号、第5号及び第7号に規定する月数を基礎として計算したものを控除して得た額に、1から各政府及び実施機関に係る第94条の3第1項に規定する政令で定めるところにより算定した率を合算した率を控除して得た率を乗じて得た額の2分の1に相当する額\n2　当該年度における保険料免除期間を有する者に係る老齢基礎年金（第27条ただし書の規定によつてその額が計算されるものに限る。）の給付に要する費用の額に、イに掲げる数をロに掲げる数で除して得た数を乗じて得た額の合算額\nイ　次に掲げる数を合算した数\n（1）　当該保険料4分の1免除期間の月数（480から当該保険料納付済期間の月数を控除して得た月数を限度とする。）に8分の1を乗じて得た数\n（2）　当該保険料半額免除期間の月数（480から当該保険料納付済期間の月数及び当該保険料4分の1免除期間の月数を合算した月数を控除して得た月数を限度とする。）に4分の1を乗じて得た数\n（3）　当該保険料4分の3免除期間の月数（480から当該保険料納付済期間の月数、当該保険料4分の1免除期間の月数及び当該保険料半額免除期間の月数を合算した月数を控除して得た月数を限度とする。）に8分の3を乗じて得た数\n（4）　当該保険料全額免除期間（第90条の3第1項の規定により納付することを要しないものとされた保険料に係るものを除く。）の月数（480から当該保険料納付済期間の月数、当該保険料4分の1免除期間の月数、当該保険料半額免除期間の月数及び当該保険料4分の3免除期間の月数を合算した月数を控除して得た月数を限度とする。）に2分の1を乗じて得た数\nロ　第27条各号に掲げる月数を合算した数\n3　当該年度における第30条の4の規定による障害基礎年金の給付に要する費用の100分の20に相当する額\n2　国庫は、毎年度、予算の範囲内で、国民年金事業の事務の執行に要する費用を負担する。", "bg": "【制定・1959年】国民皆年金を継続するには、保険料だけでなく公費による支えも欠かせない。制度の財源に公費を組み込んだ。\n【1985年改正】基礎年金の創設に合わせた費用負担の再編。\n【2004年改正】税財源による基礎年金国庫負担を1/3から1/2へ引き上げる制度設計。2009年度から1/2相当を確保し、2014年度から安定財源により恒久化。", "deb": "【2009年4月8日・衆議院厚生労働委員会／政府答弁】保険料財源による世代間の支え合いと、税財源による全国民の支え合いを同等に位置付ける考え方を説明。2004年の提案理由自体は質疑・答弁と区別。", "tsu": "【関連一次資料】厚労省「基礎年金国庫負担割合2分の1の実現について」。法文上の2分の1を「すべての給付費が一律50％」とは解さず、第85条各号・他制度の拠出金を確認。", "kako": "令和3年、令和4年", "rows": [6], "heads": ["第6章　費用"], "orig": "（国庫負担）\n第八十五条　国庫は、毎年度、国民年金事業に要する費用（次項に規定する費用を除く。）に充てるため、次に掲げる額を負担する。\n一　当該年度における基礎年金（老齢基礎年金、障害基礎年金及び遺族基礎年金をいう。以下同じ。）の給付に要する費用の総額（次号及び第三号に掲げる額を除く。以下「保険料・拠出金算定対象額」という。）から第二十七条第三号、第五号及び第七号に規定する月数を基礎として計算したものを控除して得た額に、\n一から各政府及び実施機関に係る第九十四条の三第一項に規定する政令で定めるところにより算定した率を合算した率を控除して得た率を乗じて得た額の二分の一に相当する額\n二　当該年度における保険料免除期間を有する者に係る老齢基礎年金（第二十七条ただし書の規定によつてその額が計算されるものに限る。）の給付に要する費用の額に、イに掲げる数をロに掲げる数で除して得た数を乗じて得た額の合算額\nイ　次に掲げる数を合算した数\n（１）　当該保険料四分の一免除期間の月数（四百八十から当該保険料納付済期間の月数を控除して得た月数を限度とする。）に八分の一を乗じて得た数\n（２）　当該保険料半額免除期間の月数（四百八十から当該保険料納付済期間の月数及び当該保険料四分の一免除期間の月数を合算した月数を控除して得た月数を限度とする。）に四分の一を乗じて得た数\n（３）　当該保険料四分の三免除期間の月数（四百八十から当該保険料納付済期間の月数、当該保険料四分の一免除期間の月数及び当該保険料半額免除期間の月数を合算した月数を控除して得た月数を限度とする。）に八分の三を乗じて得た数\n（４）　当該保険料全額免除期間（第九十条の三第一項の規定により納付することを要しないものとされた保険料に係るものを除く。）の月数（四百八十から当該保険料納付済期間の月数、当該保険料四分の一免除期間の月数、当該保険料半額免除期間の月数及び当該保険料四分の三免除期間の月数を合算した月数を控除して得た月数を限度とする。）に二分の一を乗じて得た数\nロ　第二十七条各号に掲げる月数を合算した数\n三　当該年度における第三十条の四の規定による障害基礎年金の給付に要する費用の百分の二十に相当する額\n２　国庫は、毎年度、予算の範囲内で、国民年金事業の事務の執行に要する費用を負担する。", "ch": 5}, {"key": "h86", "num": [86], "label": "第86条", "caption": "事務費の交付", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "（事務費の交付）\n第86条　政府は、政令の定めるところにより、市町村（特別区を含む。以下同じ。）に対し、市町村長がこの法律又はこの法律に基づく政令の規定によつて行う事務の処理に必要な費用を交付する。", "bg": "【制定時からの制度構造】国民年金の窓口を担う市町村の事務を、財政面でどう支えるか。住民に身近な事務を市町村が担うことを前提に、国の費用交付を設けた。1999年の地方分権改革等の法改正により条文表現を整理。具体的な改正理由の逐条史料は未照合。", "deb": "—", "tsu": "—", "kako": "令和元年", "rows": [7], "heads": ["第6章　費用"], "orig": "（事務費の交付）\n第八十六条　政府は、政令の定めるところにより、市町村（特別区を含む。以下同じ。）に対し、市町村長がこの法律又はこの法律に基づく政令の規定によつて行う事務の処理に必要な費用を交付する。", "ch": 5}, {"key": "h87", "num": [87], "label": "第87条", "caption": "保険料", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "（保険料）\n第87条　政府は、国民年金事業に要する費用に充てるため、保険料を徴収する。\n2　保険料は、被保険者期間の計算の基礎となる各月につき、徴収するものとする。\n3　保険料の額は、次の表の上欄に掲げる月分についてそれぞれ同表の下欄に定める額に保険料改定率を乗じて得た額（その額に5円未満の端数が生じたときは、これを切り捨て、5円以上10円未満の端数が生じたときは、これを10円に切り上げるものとする。）とする。\n平成17年度に属する月の月分　│　13580円\n平成18年度に属する月の月分　│　13860円\n平成19年度に属する月の月分　│　14140円\n平成20年度に属する月の月分　│　14420円\n平成21年度に属する月の月分　│　14700円\n平成22年度に属する月の月分　│　14980円\n平成23年度に属する月の月分　│　15260円\n平成24年度に属する月の月分　│　15540円\n平成25年度に属する月の月分　│　15820円\n平成26年度に属する月の月分　│　16100円\n平成27年度に属する月の月分　│　16380円\n平成28年度に属する月の月分　│　16660円\n平成29年度及び平成30年度に属する月の月分　│　16900円\n令和元年度以後の年度に属する月の月分　│　17000円\n4　平成17年度における前項の保険料改定率は、1とする。\n5　第3項の保険料改定率は、毎年度、当該年度の前年度の保険料改定率に次に掲げる率を乗じて得た率を基準として改定し、当該年度に属する月の月分の保険料について適用する。\n1　当該年度の初日の属する年の3年前の年の物価指数に対する当該年度の初日の属する年の前々年の物価指数の比率\n2　イに掲げる率をロに掲げる率で除して得た率の3乗根となる率\nイ　当該年度の初日の属する年の6年前の年の4月1日の属する年度における厚生年金保険の被保険者に係る標準報酬平均額に対する当該年度の初日の属する年の3年前の年の4月1日の属する年度における厚生年金保険の被保険者に係る標準報酬平均額の比率\nロ　当該年度の初日の属する年の6年前の年における物価指数に対する当該年度の初日の属する年の3年前の年における物価指数の比率\n6　前項の規定による保険料改定率の改定の措置は、政令で定める。", "bg": "【2004年改正】少子高齢化が進むなか、将来の保険料負担をどこまで見通せるか。負担の上限を予見可能にする「保険料水準固定方式」を導入した。法定額を2005年度から段階的に引き上げ、2017年度以降の基準額を16,900円（2004年度価格）に設定。後の改正により、2019年度以後の表額は17,000円。", "deb": "【2004年4月2日・衆議院厚生労働委員会／坂口力厚生労働大臣の提案理由】毎年280円ずつ引き上げ、2017年度以降16,900円とする制度設計を説明。※これは質疑ではなく政府提案理由。", "tsu": "【日本年金機構・2026年度】定額保険料17,920円。17,000円は第87条第3項の法定表額であり、実際の額との区別が必要。", "kako": "平成30年、令和5年、令和6年、令和7年", "rows": [8], "heads": ["第6章　費用"], "orig": "（保険料）\n第八十七条　政府は、国民年金事業に要する費用に充てるため、保険料を徴収する。\n２　保険料は、被保険者期間の計算の基礎となる各月につき、徴収するものとする。\n３　保険料の額は、次の表の上欄に掲げる月分についてそれぞれ同表の下欄に定める額に保険料改定率を乗じて得た額（その額に五円未満の端数が生じたときは、これを切り捨て、五円以上十円未満の端数が生じたときは、これを十円に切り上げるものとする。）とする。\n平成十七年度に属する月の月分\n一万三千五百八十円\n平成十八年度に属する月の月分\n一万三千八百六十円\n平成十九年度に属する月の月分\n一万四千百四十円\n平成二十年度に属する月の月分\n一万四千四百二十円\n平成二十一年度に属する月の月分\n一万四千七百円\n平成二十二年度に属する月の月分\n一万四千九百八十円\n平成二十三年度に属する月の月分\n一万五千二百六十円\n平成二十四年度に属する月の月分\n一万五千五百四十円\n平成二十五年度に属する月の月分\n一万五千八百二十円\n平成二十六年度に属する月の月分\n一万六千百円\n平成二十七年度に属する月の月分\n一万六千三百八十円\n平成二十八年度に属する月の月分\n一万六千六百六十円\n平成二十九年度及び平成三十年度に属する月の月分\n一万六千九百円\n令和元年度以後の年度に属する月の月分\n一万七千円\n４　平成十七年度における前項の保険料改定率は、一とする。\n５　第三項の保険料改定率は、毎年度、当該年度の前年度の保険料改定率に次に掲げる率を乗じて得た率を基準として改定し、当該年度に属する月の月分の保険料について適用する。\n一　当該年度の初日の属する年の三年前の年の物価指数に対する当該年度の初日の属する年の前々年の物価指数の比率\n二　イに掲げる率をロに掲げる率で除して得た率の三乗根となる率\nイ　当該年度の初日の属する年の六年前の年の四月一日の属する年度における厚生年金保険の被保険者に係る標準報酬平均額に対する当該年度の初日の属する年の三年前の年の四月一日の属する年度における厚生年金保険の被保険者に係る標準報酬平均額の比率\nロ　当該年度の初日の属する年の六年前の年における物価指数に対する当該年度の初日の属する年の三年前の年における物価指数の比率\n６　前項の規定による保険料改定率の改定の措置は、政令で定める。", "ch": 5}, {"key": "h87-2", "num": [87, 2], "label": "第87条の2", "caption": "", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "〔学習用見出し：付加保険料の納付〕\n第87条の2　第1号被保険者（第89条第1項、第90条第1項又は第90条の3第1項の規定により保険料を納付することを要しないものとされている者、第90条の2第1項から第3項までの規定によりその一部の額につき保険料を納付することを要しないものとされている者及び国民年金基金の加入員を除く。）は、厚生労働大臣に申し出て、その申出をした日の属する月以後の各月につき、前条第3項に定める額の保険料のほか、400円の保険料を納付する者となることができる。\n2　前項の規定による保 ope": "honsoku", "text": "〔学習用見出し：産前産後期間の保険料免除〕\n第88条の2　被保険者は、出産の予定日（厚生労働省令で定める場合にあつては、出産の日。次条第1項、第106条第1項及び第108条第2項において「出産予定日」という。）の属する月（以下この条において「出産予定月」という。）の前月（多胎妊娠の場合においては、3月前）から出産予定月の翌々月までの期間に係る保険料は、納付することを要しない。", "bg": "【2016年法律第114号】次世代育成支援・出産への配慮から第1号被保険者の産前産後期間に保険料免除を設け、2019年4月から施行。免除期間は保険料納付済期間として扱う制度上の特例。", "deb": "—", "tsu": "【現行制度の注意】所得による申請免除と異なる。産前産後免除の給付算定上の扱いは第5条・関連規定も確認。", "kako": "令和元年、令和5年、令和6年、令和8年", "rows": [11], "heads": ["第6章　費用"], "orig": "第八十八条の二　被保険者は、出産の予定日（厚生労働省令で定める場合にあつては、出産の日。次条第一項、第百六条第一項及び第百八条第二項において「出産予定日」という。）の属する月（以下この条において「出産予定月」という。）の前月（多胎妊娠の場合においては、三月前）から出産予定月の翌々月までの期間に係る保険料は、納付することを要しない。", "ch": 5}, {"key": "h88-3", "num": [88, 3], "label": "第88条の3", "caption": "", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "〔学習用見出し：育児期間の保険料免除〕\n第88条の3　前条の規定の適用を受けた被保険者が同条の出産に係る子を養育する場合においては、当該被保険者は、当該出産予定日から起算して3月を経過した日の属する月から当該出産予定日から起算して12月を経過した日（当該日の前日までに、当該子が死亡したときその他当該被保険者が当該子を養育しないこととなつた事由として厚生労働省令で定める事由が生じたときは、当該事由が生じた日の翌日）が属する月の前月までの期間（当該子以外の子に係る同条の規定の適用を受ける期間を除く。）に係る保険料は、納付することを要しない。\n2　被保険者（前項に規定する被保険者を除く。）は、その子（民法（明治29年法律第89号）第817条の2第1項の規定により被保険者が当該被保険者との間における同項に規定する特別養子縁組の成立について家庭裁判所に請求した者（当該請求に係る家事審判事件が裁判所に係属している場合に限る。）であつて当該被保険者が現に監護するもの、児童福祉法（昭和22年法律第164号）第27条第1項（第3号に係る部分に限る。）の規定により同法第6条の4第2号に規定する養子縁組里親である被保険者に委託されている児童及びこれらの被保険者に準ずる者として厚生労働省令で定める被保険者に厚生労働省令で定めるところにより委託されている者を含む。\n以下この項、第106条第1項及び第108条第2項において同じ。）を養育することとなつた日の属する月から当該子が1歳に達する日（当該子が1歳に達する日の前日までに、当該子が死亡したときその他当該被保険者が当該子を養育しないこととなつた事由として厚生労働省令で定める事由が生じたときは、当該事由が生じた日）の翌日が属する月の前月までの期間（当該子以外の子に係る前条の規定の適用を受ける期間を除く。）に係る保険料は、納付することを要しない。\n3　前2項の規定により納付することを要しないものとされた保険料に相当する額については、政令で定めるところにより、子ども・子育て支援法（平成24年法律第65号）の規定により政府が徴収する子ども・子育て支援納付金により補塡するものとする。", "bg": "【2024年改正・2026年10月施行（令和6年法律第47号）】雇用されて働く人だけでなく、自営業者・フリーランス等にも子育て期の保障が必要だった。育児休業給付の対象になりにくい第1号被保険者にも、子育て期の経済的負担を軽減する仕組みが必要とされた。被用者の育児休業中の保険料免除等との均衡を考慮し、父母双方が子を養育する期間について、所得要件・休業要件を設けず国民年金保険料を免除する制度を創設。産前産後免除が適用される実母は、その期間に引き続く育児期間を対象とする。免除期間は保険料納付済期間として扱い、財源には子ども・子育て支援納付金を充てる。", "deb": "—", "tsu": "—", "kako": "—", "rows": [12], "heads": ["第6章　費用"], "orig": "第八十八条の三　前条の規定の適用を受けた被保険者が同条の出産に係る子を養育する場合においては、当該被保険者は、当該出産予定日から起算して三月を経過した日の属する月から当該出産予定日から起算して十二月を経過した日（当該日の前日までに、当該子が死亡したときその他当該被保険者が当該子を養育しないこととなつた事由として厚生労働省令で定める事由が生じたときは、\n当該事由が生じた日の翌日）が属する月の前月までの期間（当該子以外の子に係る同条の規定の適用を受ける期間を除く。）に係る保険料は、納付することを要しない。\n２　被保険者（前項に規定する被保険者を除く。）は、その子（民法（明治二十九年法律第八十九号）第八百十七条の二第一項の規定により被保険者が当該被保険者との間における同項に規定する特別養子縁組の成立について家庭裁判所に請求した者（当該請求に係る家事審判事件が裁判所に係属している場合に限る。\n）であつて当該被保険者が現に監護するもの、児童福祉法（昭和二十二年法律第百六十四号）第二十七条第一項（第三号に係る部分に限る。）の規定により同法第六条の四第二号に規定する養子縁組里親である被保険者に委託されている児童及びこれらの被保険者に準ずる者として厚生労働省令で定める被保険者に厚生労働省令で定めるところにより委託されている者を含む。\n以下この項、第百六条第一項及び第百八条第二項において同じ。）を養育することとなつた日の属する月から当該子が一歳に達する日（当該子が一歳に達する日の前日までに、当該子が死亡したときその他当該被保険者が当該子を養育しないこととなつた事由として厚生労働省令で定める事由が生じたときは、\n当該事由が生じた日）の翌日が属する月の前月までの期間（当該子以外の子に係る前条の規定の適用を受ける期間を除く。）に係る保険料は、納付することを要しない。\n３　前二項の規定により納付することを要しないものとされた保険料に相当する額については、政令で定めるところにより、子ども・子育て支援法（平成二十四年法律第六十五号）の規定により政府が徴収する子ども・子育て支援納付金により補塡するものとする。", "ch": 5}, {"key": "h89", "num": [89], "label": "第89条", "caption": "", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "〔学習用見出し：法定免除〕\n第89条　被保険者（第88条の2、前条第1項及び第2項並びに第90条の2第1項から第3項までの規定の適用を受ける被保険者を除く。）が次の各号のいずれかに該当するに至つたときは、その該当するに至つた日の属する月の前月からこれに該当しなくなる日の属する月までの期間に係る保険料は、既に納付されたものを除き、納付することを要しない。\n1　障害基礎年金又は厚生年金保険法に基づく障害を支給事由とする年金たる給付その他の障害を支給事由とする給付であつて政令で定めるものの受給権者（最後に同法第47条第2項に規定する障害等級に該当する程度の障害の状態（以下この号において「障害状態」という。）に該当しなくなつた日から起算して障害状態に該当することなく3年を経過した障害基礎年金の受給権者（現に障害状態に該当しない者に限る。）その他の政令で定める者を除く。）であるとき。\n2　生活保護法（昭和25年法律第144号）による生活扶助その他の援助であつて厚生労働省令で定めるものを受けるとき。\n3　前2号に掲げるもののほか、厚生労働省令で定める施設に入所しているとき。\n2　前項の規定により納付することを要しないものとされた保険料について、被保険者又は被保険者であつた者（次条から第90条の3までにおいて「被保険者等」という。）から当該保険料に係る期間の各月につき、保険料を納付する旨の申出があつたときは、当該申出のあつた期間に係る保険料に限り、同項の規定は適用しない。", "bg": "【制度の設計】収入を得にくい者に画一的な保険料負担を求めることの難しさに対応した法定免除。所得審査に基づく第90条の申請免除と区別する。個別の改正理由は未照合。", "deb": "—", "tsu": "—", "kako": "平成29年、令和元年、令和2年、令和4年、令和5年、令和8年", "rows": [13], "heads": ["第6章　費用"], "orig": "第八十九条　被保険者（第八十八条の二、前条第一項及び第二項並 の追納について必要な事項は、政令で定める。", "bg": "【制度趣旨】免除・学生納付特例などで負担困難だった期間について、後年の納付により老齢基礎年金の額を回復できるようにする。10年制限は改正の累積による現行規定。", "deb": "—", "tsu": "【注意】追納の時期、順序、経過年数による加算を第94条各項・政令で確認。", "kako": "平成29年、平成30年、令和元年、令和2年、令和5年、令和8年", "rows": [26], "heads": ["第6章　費用"], "orig": "（保険料の追納）\n第九十四条　被保険者又は被保険者であつた者（老齢基礎年金の受給権者を除く。）は、厚生労働大臣の承認を受け、第八十九条第一項、第九十条第一項又は第九十条の三第一項の規定により納付することを要しないものとされた保険料及び第九十条の二第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料（承認の日の属する月前十年以内の期\n間に係るものに限る。）の全部又は一部につき追納をすることができる。ただし、同条第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保険料については、その残余の額につき納付されたときに限る。\n２　前項の場合において、その一部につき追納をするときは、追納は、第九十条の三第一項の規定により納付することを要しないものとされた保険料につき行い、次いで第八十九条第一項若しくは第九十条第一項の規定により納付することを要しないものとされた保険料又は第九十条の二第一項から第三項までの規定によりその一部の額につき納付することを要しないものとされた保\n険料につき行うものとし、これらの保険料のうちにあつては、先に経過した月の分から順次に行うものとする。ただし、第九十条の三第一項の規定により納付することを要しないものとされた保険料より前に納付義務が生じ、第八十九条第一項若しくは第九十条第一項の規定により納付することを要しないものとされた保険料又は第九十条の二第一項から第三項までの規定により\nその一部の額につき納付することを要しないものとされた保険料があるときは、当該保険料について、先に経過した月の分の保険料から追納をすることができるものとする。\n３　第一項の場合において追納すべき額は、当該追納に係る期間の各月の保険料の額に政令で定める額を加算した額とする。\n４　第一項の規定により追納が行われたときは、追納が行われた日に、追納に係る月の保険料が納付されたものとみなす。\n５　前各項に定めるもののほか、保険料の追納手続その他保険料の追納について必要な事項は、政令で定める。", "ch": 5}, {"key": "h94-2", "num": [94, 2], "label": "第94条の2", "caption": "基礎年金拠出金", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "（基礎年金拠出金）\n第94条の2　厚生年金保険の実施者たる政府は、毎年度、基礎年金の給付に要する費用に充てるため、基礎年金拠出金を負担する。\n2　実施機関たる共済組合等は、毎年度、基礎年金の給付に要する費用に充てるため、基礎年金拠出金を納付する。\n3　財政の現況及び見通しが作成されるときは、厚生労働大臣は、厚生年金保険の実施者たる政府が負担し、又は実施機関たる共済組合等が納付すべき基礎年金拠出金について、その将来にわたる予想額を算定するものとする。", "bg": "【1985年改正】全国共通の基礎年金創設により、被用者年金各制度から基礎年金の費用を共同で負担する仕組みを設けた。\n【2012年改正・2015年施行】被用者年金一元化に合わせ実施機関の区分を整理。", "deb": "【2020年4月24日・衆議院厚生労働委員会／高橋俊之政府参考人答弁】制度創設時に各制度の被保険者を頭割りし、同じ拠出金単価で基礎年金財源を分かち合う仕組みと説明。", "tsu": "—", "kako": "令和2年", "rows": [27], "heads": ["第6章　費用"], "orig": "（基礎年金拠出金）\n第九十四条の二　厚生年金保険の実施者たる政府は、毎年度、基礎年金の給付に要する費用に充てるため、基礎年金拠出金を負担する。\n２　実施機関たる共済組合等は、毎年度、基礎年金の給付に要する費用に充てるため、基礎年金拠出金を納付する。\n３　財政の現況及び見通しが作成されるときは、厚生労働大臣は、厚生年金保険の実施者たる政府が負担し、又は実施機関たる共済組合等が納付すべき基礎年金拠出金について、その将来にわたる予想額を算定するものとする。", "ch": 5}, {"key": "h94-3", "num": [94, 3], "label": "第94条の3", "caption": "", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "〔学習用見出し：基礎年金拠出金の額の算定〕\n第94条の3　基礎年金拠出金の額は、保険料・拠出金算定対象額に当該年度における被保険者の総数に対する当該年度における当該政府及び実施機関に係る被保険者（厚生年金保険の実施者たる政府にあつては、第1号厚生年金被保険者である第2号被保険者及びその被扶養配偶者である第3号被保険者とし、実施機関たる共済組合等にあつては、当該実施機関たる共済組合等に係る被保険者（国家公務員共済組合連合会にあつては当該連合会を組織する共済組合に係る第2号厚生年金被保険者である第2号被保険者及びその被扶養配偶者である第3号被保険者とし、地方公務員共済組合連合会にあつては当該連合会を組織する共済組合に係る第3号厚生年金被保険者である第2号被保険者及びその被扶養配偶者である第3号被保険者とし、日本私立学校振興・共済事業団にあつては第4号厚生年金被保険者である第2号被保険者及びその被扶養配偶者である第3号被保険者とする。以下同じ。）とする。）の総数の比率に相当するものとして毎年度政令で定めるところにより算定した率を乗じて得た額とする。\n2　前項の場合において被保険者の総数並びに政府及び実施機関に係る被保険者の総数は、第1号被保険者、第2号被保険者及び第3号被保険者の適用の態様の均衡を考慮して、これらの被保険者のうち政令で定める者を基礎として計算するものとする。\n3　前2項に規定するもののほか、実施機関たる共済組合等に係る基礎年金拠出金の納付に関し必要な事項は、政令で定める。", "bg": "【1985年改正】基礎年金を共通財源で賄うため、加入者規模に応じる配賦のルールを整えた。\n【2015年一元化関連】厚生年金実施機関の区分と第2号・第3号被保険者の範囲を法に反映。", "deb": "【2020年4月24日・政府参考人答弁】頭割りの公平な単価と各年金制度間の財政調整について解説（第94条の2と共通論点）。", "tsu": "—", "kako": "平成30年、令和元年", "rows": [28], "heads": ["第6章　費用"], "orig": "第九十四条の三　基礎年金拠出金の額は、保険料・拠出金算定対象額に当該年度における被保険者の総数に対する当該年度における当該政府及び実施機関に係る被保険者（厚生年金保険の実施者たる政府にあつては、第一号厚生年金被保険者である第二号被保険者及びその被扶養配偶者である第三号被保険者とし、実施機関たる共済組合等にあつては、\n当該実施機関たる共済組合等に係る被保険者（国家公務員共済組合連合会にあつては当該連合会を組織する共済組合に係る第二号厚生年金被保険者である第二号被保険者及びその被扶養配偶者である第三号被保険者とし、地方公務員共済組合連合会にあつては当該連合会を組織する共済組合に係る第三号厚生年金被保険者である第二号被保険者及びその被扶養配偶者である第三号\n被保険者とし、日本私立学校振興・共済事業団にあつては第四号厚生年金被保険者である第二号被保険者及びその被扶養配偶者である第三号被保険者とする。以下同じ。）とする。）の総数の比率に相当するものとして毎年度政令で定めるところにより算定した率を乗じて得た額とする。\n２　前項の場合において被保険者の総数並びに政府及び実施機関に係る被保険者の総数は、第一号被保険者、第二号被保険者及び第三号被保険者の適用の態様の均衡を考慮して、これらの被保険者のうち政令で定める者を基礎として計算するものとする。\n３　前二項に規定するもののほか、実施機関たる共済組合等に係る基礎年金拠出金の納付に関し必要な事項は、政令で定める。", "ch": 5}, {"key": "h94-4", "num": [94, 4], "label": "第94条の4", "caption": "", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "〔学習用見出し：地方公務員共済組合間の拠出金負担〕\n第94条の4　各地方公務員共済組合（指定都市職員共済組合、市町村職員共済組合及び都市職員共済組合にあつては、全国市町村職員共済組合連合会）は、毎年度、政令で定めるところにより、地方公務員共済組合連合会が納付すべき基礎年金拠出金の額のうち各地方公務員共済組合における厚生年金保険法第28条に規定する標準報酬（以下この条において「標準報酬」という。）の総額（全国市町村職員共済組合連合会にあつては、全ての指定都市職員共済組合、市町村職員共済組合及び都市職員共済組合における標準報酬の総額）を考慮して政令で定めるところにより算定した額を負担する。", "bg": "【1985年改正に伴う整備】基礎年金共通財源を、地方公務員共済組合間でどのように割り振るかを規定。個別の国会審議は未確認。", "deb": "—", "tsu": "—", "kako": "—", "rows": [29], "heads": ["第6章　費用"], "orig": "第九十四条の四　各地方公務員共済組合（指定都市職員共済組合、市町村職員共済組合及び都市職員共済組合にあつては、全国市町村職員共済組合連合会）は、毎年度、政令で定めるところにより、地方公務員共済組合連合会が納付すべき基礎年金拠出金の額のうち各地方公務員共済組合における厚生年金保険法第二十八条に規定する標準報酬（以下この条において「標準報酬」という。\n）の総額（全国市町村職員共済組合連合会にあつては、全ての指定都市職員共済組合、市町村職員共済組合及び都市職員共済組合における標準報酬の総額）を考慮して政令で定めるところにより算定した額を負担する。", "ch": 5}, {"key": "h94-5", "num": [94, 5], "label": "第94条の5", "caption": "報告", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "（報告）\n第94条の5　厚生労働大臣は、実施機関たる共済組合等に対し、当該実施機関たる共済組合等を所管する大臣を経由して、当該実施機関たる共済組合等に係る被保険者の数その他の厚生労働省令で定める事項について報告を求めることができる。\n2　各実施機関たる共済組合等は、厚生労働省令の定めるところにより、当該実施機関たる共済組合等を所管する大臣を経由して前項の報告を行うものとする。\n3　実施機関たる共済組合等は、厚生労働省令の定めるところにより、当該実施機関たる共済組合等を所管する大臣を経由して、第94条の2第3項に規定する予想額の算定のために必要な事項として厚生労働省令で定める事項について厚生労働大臣に報告を行うものとする。\n4　厚生労働大臣は、厚生労働省令の定めるところにより、前項に規定する予想額その他これに関連する事項で厚生労働省令で定めるものについて、実施機関たる共済組合等を所管する大臣に報告を行うものとする。\n5　厚生労働大臣は、前各項に規定する厚生労働省令を定めるときは、実施機関たる共済組合等を所管する大臣に協議しなければならない。", "bg": "【1985年改正】制度横断で基礎年金財政を処理するため、数字を相互把握する報告枠組みを整えた。", "deb": "—", "tsu": "—", "kako": "—", "rows": [30], "heads": ["第6章　費用"], "orig": "（報告）\n第九十四条の五　厚生労働大臣は、実施機関たる共済組合等に対し、当該実施機関たる共済組合等を所管する大臣を経由して、当該実施機関たる共済組合等に係る被保険者の数その他の厚生労働省令で定める事項について報告を求めることができる。\n２　各実施機関たる共済組合等は、厚生労働省令の定めるところにより、当該実施機関たる共済組合等を所管する大臣を経由して前項の報告を行うものとする。\n３　実施機関たる共済組合等は、厚生労働省令の定めるところにより、当該実施機関たる共済組合等を所管する大臣を経由して、第九十四条の二第三項に規定する予想額の算定のために必要な事項として厚生労働省令で定める事項について厚生労働大臣に報告を行うものとする。\n４　厚生労働大臣は、厚生労働省令の定めるところにより、前項に規定する予想額その他これに関連する事項で厚生労働省令で定めるものについて、実施機関たる共済組合等を所管する大臣に報告を行うものとする。\n５　厚生労働大臣は、前各項に規定する厚生労働省令を定めるときは、実施機関たる共済組合等を所管する大臣に協議しなければならない。", "ch": 5}, {"key": "h94-6", "num": [94, 6], "label": "第94条の6", "caption": "第2号被保険者及び第3号被保険者に係る特例", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "（第2号被保険者及び第3号被保険者に係る特例）\n第94条の6　第87条第1項及び第2項並びに第88条第1項の規定にかかわらず、第2号被保険者としての被保険者期間及び第3号被保険者としての被保険者期間については、政府は、保険料を徴収せず、被保険者は、保険料を納付することを要しない。", "bg": "【1985年改正】全国民共通の基礎年金に統合しながら、第2号・第3号期間の費用を被用者年金側の基礎年金拠出金で処理。第3号個人に保険料を直接課していないことと財源負担がないことは別。", "deb": "【2020年4月24日・政府参考人答弁】第2号・第3号を含む基礎年金拠出金の対象者を各制度で算定する仕組みを説明。", "tsu": "—", "kako": "—", "rows": [31], "heads": ["第6章　費用"], "orig": "（第二号被保険者及び第三号被保険者に係る特例）\n第九十四条の六　第八十七条第一項及び第二項並びに第八十八条第一項の規定にかかわらず、第二号被保険者としての被保険者期間及び第三号被保険者としての被保険者期間については、政府は、保険料を徴収せず、被保険者は、保険料を納付することを要しない。", "ch": 5}, {"key": "h95", "num": [95], "label": "第95条", "caption": "徴収", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "（徴収）\n第95条　保険料その他この法律（第10章を除く。以下この章から第8章までにおいて同じ。）の規定による徴収金は、この法律に別段の規定があるものを除くほか、国税徴収の例によつて徴収する。", "bg": "【制度趣旨】強制保険としての保険料収納を確実にするため、公法上の徴収手続の枠組みを用いる。", "deb": "—", "tsu": "—", "kako": "—", "rows": [32], "heads": ["第6章　費用"], "orig": "（徴収）\n第九十五条　保険料その他この法律（第十章を除く。以下この章から第八章までにおいて同じ。）の規定による徴収金は、この法律に別段の規定があるものを除くほか、国税徴収の例によつて徴収する。", "ch": 5}, {"key": "h95-2", "num": [95, 2], "label": "第95条の2", "caption": "国民年金基金又は国民年金基金連合会の解散に伴う責任準備金相当額の徴収", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "（国民年金基金又は国民年金基金連合会の解散に伴う責任準備金相当額の徴収）\n第95条の2　政府は、国民年金基金又は国民年金基金連合会が解散したときは、その解散した日において当該国民年金基金又は国民年金基金連合会が年金の支給に関する義務を負つている者に係る政令の定めるところにより算出した責任準備金に相当する額を当該解散した国民年金基金又は国民年金基金連合会から徴収する。\nただし、第137条の19第1項の規定により国民年金基金連合会が当該解散した国民年金基金から徴収すべきときは、この限りでない。", "bg": "【1969年改正】国民年金基金制度の創設に合わせ、基金解散時の年金給付に係る財政責任を引き継ぐための措置を設けた。", "deb": "—", "tsu": "—", "kako": "平成30年", "rows": [33], "heads": ["第6章　費用"], "orig": "（国民年金基金又は国民年金基金連合会の解散に伴う責任準備金相当額の徴収）\n第九十五条の二　政府は、国民年金基金又は国民年金基金連合会が解散したときは、その解散した日において当該国民年金基金又は国民年金基金連合会が年金の支給に関する義務を負つている者に係る政令の定めるところにより算出した責任準備金に相当する額を当該解散した国民年金基金又は国民年金基金連合会から徴収する。\nただし、第百三十七条の十九第一項の規定により国民年金基金連合会が当該解散した国民年金基金から徴収すべきときは、この限りでない。", "ch": 5}, {"key": "h96", "num": [96], "label": "第96条", "caption": "督促及び滞納処分", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "（督促及び滞納処分）\n第96条　保険料その他この法律の規定による徴収金を滞納する者があるときは、厚生労働大臣は、期限を指定して、これを督促することができる。\n2　前項の規定によつて督促をしようとするときは、厚生労働大臣は、納付義務者に対して、督促状を発する。\n3　前項の督促状により指定する期限は、督促状を発する日から起算して10日以上を経過した日でなければならない。\n4　厚生労働大臣は、第1項の規定による督促を受けた者がその指定の期限までに保険料その他この法律の規定による徴収金を納付しないときは、国税滞納処分の例によつてこれを処分し、又は滞納者の居住地若しくはその者の財産所在地の市町村に対して、その処分を請求することができる。\n5　市町村は、前項の規定による処分の請求を受けたときは、市町村税の例によつてこれを処分することができる。この場合においては、厚生労働大臣は、徴収金の100分の4に相当する額を当該市町村に交付しなければならない。\n6　前2項の規定による処分によつて受け入れた金額を保険料に充当する場合においては、さきに経過した月の保険料から順次これに充当し、1箇月の保険料の額に満たない端数は、納付義務者に交付するものとする。", "bg": "【制度趣旨】年金財源の負担の公平と収納確保のため、公法上の督促・滞納処分制度を設ける。差押え等は条文の手続・要件に従う。", "deb": "—", "tsu": "—", "kako": "令和3年、令和6年、令和7年、令和8年", "rows": [34], "heads": ["第6章　費用"], "orig": "（督促及び滞納処分）\n第九十六条　保険料その他この法律の規定による徴収金を滞納する者があるときは、厚生労働大臣は、期限を指定して、これを督促することができる。\n２　前項の規定によつて督促をしようとするときは、厚生労働大臣は、納付義務者に対して、督促状を発する。\n３　前項の督促状により指定する期限は、督促状を発する日から起算して十日以上を経過した日でなければならない。\n４　厚生労働大臣は、第一項の規定による督促を受けた者がその指定の期限までに保険料その他この法律の規定による徴収金を納付しないときは、国税滞納処分の例によつてこれを処分し、又は滞納者の居住地若しくはその者の財産所在地の市町村に対して、その処分を請求することができる。\n５　市町村は、前項の規定による処分の請求を受けたときは、市町村税の例によつてこれを処分することができる。この場合においては、厚生労働大臣は、徴収金の百分の四に相当する額を当該市町村に交付しなければならない。\n６　前二項の規定による処分によつて受け入れた金額を保険料に充当する場合においては、さきに経過した月の保険料から順次これに充当し、一箇月の保険料の額に満たない端数は、納付義務者に交付するものとする。", "ch": 5}, {"key": "h97", "num": [97], "label": "第97条", "caption": "延滞金", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "（延滞金）\n第97条　前条第1項の規定によつて督促をしたときは、厚生労働大臣は、徴収金額に、納期限の翌日から徴収金完納又は財産差押の日の前日までの期間の日数に応じ、年14.6パーセント（当該督促が保険料に係るものであるときは、当該納期限の翌日から3月を経過する日までの期間については、年7.3パーセント）の割合を乗じて計算した延滞金を徴収する。\nただし、徴収金額が500円未満であるとき、又は滞納につきやむを得ない事情があると認められるときは、この限りでない。\n2　前項の場合において、徴収金額の一部につき納付があつたときは、その納付の日以後の期間に係る延滞金の計算の基礎となる徴収金は、その納付のあつた徴収金額を控除した金額による。\n3　延滞金を計算するに当り、徴収金額に500円未満の端数があるときは、その端数は、切り捨てる。\n4　督促状に指定した期限までに徴収金を完納したとき、又は前3項の規定によつて計算した金額が50円未満であるときは、延滞金は、徴収しない。\n5　延滞金の金額に50円未満の端数があるときは、その端数は、切り捨てる。", "bg": "【制度趣旨】滞納に伴う負担公平と期限内納付を促す仕組み。\n【改正時】社会経済情勢に応じた特例率の変更等があり、年度ごとの実効利率を本則の14.6％のみから断定しない。", "deb": "—", "tsu": "—", "kako": "令和元年", "rows": [35], "heads": ["第6章　費用"], "orig": "（延滞金）\n第九十七条　前条第一項の規定によつて督促をしたときは、厚生労働大臣は、徴収金額に、納期限の翌日から徴収金完納又は財産差押の日の前日までの期間の日数に応じ、年十四・六パーセント（当該督促が保険料に係るものであるときは、当該納期限の翌日から三月を経過する日までの期間については、年七・三パーセント）の割合を乗じて計算した延滞金を徴収する。\nただし、徴収金額が五百円未満であるとき、又は滞納につきやむを得ない事情があると認められるときは、この限りでない。\n２　前項の場合において、徴収金額の一部につき納付があつたときは、その納付の日以後の期間に係る延滞金の計算の基礎となる徴収金は、その納付のあつた徴収金額を控除した金額による。\n３　延滞金を計算するに当り、徴収金額に五百円未満の端数があるときは、その端数は、切り捨てる。\n４　督促状に指定した期限までに徴収金を完納したとき、又は前三項の規定によつて計算した金額が五十円未満であるときは、延滞金は、徴収しない。\n５　延滞金の金額に五十円未満の端数があるときは、その端数は、切り捨てる。", "ch": 5}, {"key": "h98", "num": [98], "label": "第98条", "caption": "先取特権", "status": null, "sheet": "第85～100条_費用", "scope": "honsoku", "text": "（先取特権）\n第98条　保険料その他この法律の規定による徴収金の先取特権の順位は、国税及び地方税に次ぐものとする。", "bg": "【制度趣旨】年金財源としての徴収金の回収を保護しつつ、租税債権より後の順位とする。", "deb": "—", "tsu": "—", "kako": "—", "rows": [36], "heads": ["第6章　費用"], "orig": "（先取特権）\n第九十八条　保険料その他この法律の規定による徴収金の先取特権の順位は、国税及び地方税に次ぐものとする。", "ch": 5}, {"key": "h99", "num": [99], "label": "第99条", "caption": "", "status": "削除", "sheet": "第85～100条_費用", "scope": "honsoku", "text": "第99条及び第100条　削除", "bg": "【1969年改正】昭和44年法律第86号で削除。旧条文の内容・削除理由は別途旧法と国会審議の照合が必要。", "deb": "—", "tsu": "—", "kako": "—", "rows": [37], "heads": ["第6章　費用"], "orig": "第九十九条及び第百条　削除", "ch": 5}, {"key": "h101", "num": [101], "label": "第101条", "caption": "不服申立て", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（不服申立て）\n第101条　被保険者の資格に関する処分、給付に関する処分（共済組合等が行つた障害基礎年金に係る障害の程度の診査に関する処分を除く。）又は保険料その他この法律の規定による徴収金に関する処分に不服がある者は、社会保険審査官に対して審査請求をし、その決定に不服がある者は、社会保険審査会に対して再審査請求をすることができる。\nただし、第14条の4第1項又は第2項の規定による決定については、この限りでない。\n2　審査請求をした日から2月以内に決定がないときは、審査請求人は、社会保険審査官が審査請求を棄却したものとみなすことができる。\n3　第1項の審査請求及び再審査請求は、時効の完成猶予及び更新に関しては、裁判上の請求とみなす。\n4　被保険者の資格に関する処分が確定したときは、その処分についての不服を当該処分に基づく給付に関する処分の不服の理由とすることができない。\n5　第1項の審査請求及び再審査請求については、行政不服審査法（平成26年法律第68号）第2章（第22条を除く。）及び第4章の規定は、適用しない。\n6　共済組合等が行つた障害基礎年金に係る障害の程度の診査に関する処分に不服がある者は、当該共済組合等に係る共済各法（国家公務員共済組合法（昭和33年法律第128号）、地方公務員等共済組合法（昭和37年法律第152号）及び私立学校教職員共済法をいう。以下この項において同じ。）の定めるところにより、当該共済各法に定める審査機関に審査請求をすることができる。\n7　前項の規定による共済組合等が行つた障害の程度の診査に関する処分が確定したときは、その処分についての不服を当該処分に基づく障害基礎年金に関する処分についての不服の理由とすることができない。", "bg": "【制度構造】年金の決定に納得できないとき、どこで救済を求めるか。年金処分に対する行政上の不服救済を設けた。2014年・2016年の行政不服審査制度等の改正を受けた見直しがある（改正法の個別逐条趣旨は未確認）。", "deb": "—", "tsu": "【一次資料】国民年金法101条・厚労省厚生局「審査請求に当たっての留意事項」。処分がない単なる相談・苦情は審査請求の対象外。", "kako": "平成29年、平成30年、令和元年、令和3年", "rows": [6], "heads": ["第7章　不服申立て"], "orig": "（不服申立て）\n第百一条　被保険者の資格に関する処分、給付に関する処分（共済組合等が行つた障害基礎年金に係る障害の程度の診査に関する処分を除く。）又は保険料その他この法律の規定による徴収金に関する処分に不服がある者は、社会保険審査官に対して審査請求をし、その決定に不服がある者は、社会保険審査会に対して再審査請求をすることができる。\nただし、第十四条の四第一項又は第二項の規定による決定については、この限りでない。\n２　審査請求をした日から二月以内に決定がないときは、審査請求人は、社会保険審査官が審査請求を棄却したものとみなすことができる。\n３　第一項の審査請求及び再審査請求は、時効の完成猶予及び更新に関しては、裁判上の請求とみなす。\n４　被保険者の資格に関する処分が確定したときは、その処分についての不服を当該処分に基づく給付に関する処分の不服の理由とすることができない。\n５　第一項の審査請求及び再審査請求については、行政不服審査法（平成二十六年法律第六十八号）第二章（第二十二条を除く。）及び第四章の規定は、適用しない。\n６　共済組合等が行つた障害基礎年金に係る障害の程度の診査に関する処分に不服がある者は、当該共済組合等に係る共済各法（国家公務員共済組合法（昭和三十三年法律第百二十八号）、地方公務員等共済組合法（昭和三十七年法律第百五十二号）及び私立学校教職員共済法をいう。以下この項において同じ。\n）の定めるところにより、当該共済各法に定める審査機関に審査請求をすることができる。\n７　前項の規定による共済組合等が行つた障害の程度の診査に関する処分が確定したときは、その処分についての不服を当該処分に基づく障害基礎年金に関する処分についての不服の理由とすることができない。", "ch": 6}, {"key": "h101-2", "num": [101, 2], "label": "第101条の2", "caption": "審査請求と訴訟との関係", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（審査請求と訴訟との関係）\n第101条の2　前条第1項に規定する処分（被保険者の資格に関する処分又は給付に関する処分（共済組合等が行つた障害基礎年金に係る障害の程度の診査に関する処分を除く。）に限る。）の取消しの訴えは、当該処分についての審査請求に対する社会保険審査官の決定を経た後でなければ、提起することができない。", "bg": "【1962年改正】第101条の2を追加。その後、平成26年法律69号で改正。条文単位の国会問答は未確認。", "deb": "—", "tsu": "【一次資料】国民年金法101条の2。行政事件訴訟法との関係に留意。", "kako": "令和6年", "rows": [7], "heads": ["第7章　不服申立て"], "orig": "（審査請求と訴訟との関係）\n第百一条の二　前条第一項に規定する処分（被保険者の資格に関する処分又は給付に関する処分（共済組合等が行つた障害基礎年金に係る障害の程度の診査に関する処分を除く。）に限る。）の取消しの訴えは、当該処分についての審査請求に対する社会保険審査官の決定を経た後でなければ、提起することができない。", "ch": 6}, {"key": "h102", "num": [102], "label": "第102条", "caption": "時効", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（時効）\n第102条　年金給付を受ける権利は、その支給すべき事由が生じた日から5年を経過したとき、当該権利に基づき支払期月ごとに支払うものとされる年金給付の支給を受ける権利は、当該日の属する月の翌月以後に到来する当該年金給付の支給に係る第18条第3項本文に規定する支払期月の翌月の初日から5年を経過したときは、時効によつて、消滅する。\n2　前項に規定する年金給付を受ける権利の時効は、当該年金給付がその全額につき支給を停止されている間は、進行しない。\n3　第1項に規定する年金給付を受ける権利又は当該権利に基づき支払期月ごとに支払うものとされる年金給付の支給を受ける権利については、会計法（昭和22年法律第35号）第31条の規定を適用しない。\n4　保険料その他この法律の規定による徴収金を徴収し、又はその還付を受ける権利及び死亡一時金を受ける権利は、これらを行使することができる時から2年を経過したときは、時効によつて消滅する。\n5　保険料その他この法律の規定による徴収金についての第96条第1項の規定による督促は、時効の更新の効力を有する。\n6　保険料その他この法律の規定による徴収金については、会計法第32条の規定を適用しない。", "bg": "【制定以来の法制】長期給付の権利と保険料等の短期債権を異なる期間で規律。2017年（平成29年法律45号）、2025年（令和7年法律74号）などの改正注記あり。具体的な逐条改正理由は未確認。", "deb": "—", "tsu": "【一次資料】国民年金法102条。民法の時効、年金時効特例法等との混同に注意。起算点は各項の原文参照。", "kako": "平成30年、令和2年、令和7年", "rows": [9], "heads": ["第8章　雑則"], "orig": "（時効）\n第百二条　年金給付を受ける権利は、その支給すべき事由が生じた日から五年を経過したとき、当該権利に基づき支払期月ごとに支払うものとされる年金給付の支給を受ける権利は、当該日の属する月の翌月以後に到来する当該年金給付の支給に係る第十八条第三項本文に規定する支払期月の翌月の初日から五年を経過したときは、時効によつて、消滅する。\n２　前項に規定する年金給付を受ける権利の時効は、当該年金給付がその全額につき支給を停止されている間は、進行しない。\n３　第一項に規定する年金給付を受ける権利又は当該権利に基づき支払期月ごとに支払うものとされる年金給付の支給を受ける権利については、会計法（昭和二十二年法律第三十五号）第三十一条の規定を適用しない。\n４　保険料その他この法律の規定による徴収金を徴収し、又はその還付を受ける権利及び死亡一時金を受ける権利は、これらを行使することができる時から二年を経過したときは、時効によつて消滅する。\n５　保険料その他この法律の規定による徴収金についての第九十六条第一項の規定による督促は、時効の更新の効力を有する。\n６　保険料その他この法律の規定による徴収金については、会計法第三十二条の規定を適用しない。", "ch": 7}, {"key": "h103", "num": [103], "label": "第103条", "caption": "期間の計算", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（期間の計算）\n第103条　この法律又はこの法律に基づく命令に規定する期間の計算については、この法律に別段の規定がある場合を除くほか、民法の期間に関する規定を準用する。", "bg": "【制度構造】個別の期間計算を民法の一般規律に接続。2017年民法改正に伴う改正注記がある。", "deb": "—", "tsu": "【一次資料】国民年金法103条・民法の期間規定。", "kako": "—", "rows": [10], "heads": ["第8章　雑則"], "orig": "（期間の計算）\n第百三条　この法律又はこの法律に基づく命令に規定する期間の計算については、この法律に別段の規定がある場合を除くほか、民法の期間に関する規定を準用する。", "ch": 7}, {"key": "h104", "num": [104], "label": "第104条", "caption": "戸籍事項の無料証明", "status": null, "sheet": "第101～114条_不服・雑則・罰則", "scope": "honsoku", "text": "（戸籍事項の無料証明）\n第104条　市町村長（地方自治法第252条の19第1項の指定都市に
